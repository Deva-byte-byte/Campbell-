<style>
/* Layout: one exam card at a time, narrow reading column, progress strip on top */
:root {
  --bg: #f3f5f6; --surface: #ffffff; --ink: #18232b; --muted: #5b6a74; --line: #d6dde1;
  --accent: #1f5f7a; --accent-soft: #e2eef3;
  --warn: #a8660b; --ok: #1d7a4c; --ok-soft: #e3f3ea; --bad: #b3352b; --bad-soft: #f8e4e1;
  --f-display: "Newsreader", Georgia, "Times New Roman", serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11171b; --surface: #182128; --ink: #e4ebef; --muted: #98a8b2; --line: #2b3842;
  --accent: #7cc0dc; --accent-soft: #1d3340;
  --warn: #e8b05a; --ok: #6fd3a0; --ok-soft: #173327; --bad: #f08a80; --bad-soft: #3a1f1c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11171b; --surface: #182128; --ink: #e4ebef; --muted: #98a8b2; --line: #2b3842;
  --accent: #7cc0dc; --accent-soft: #1d3340;
  --warn: #e8b05a; --ok: #6fd3a0; --ok-soft: #173327; --bad: #f08a80; --bad-soft: #3a1f1c; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; padding: 0 16px; }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 28px 48px; display: grid; gap: 20px; }
header { display: grid; gap: 6px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(26px, 5vw, 34px); line-height: 1.15; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; font-size: 15px; }

.strip { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; }
.pip { height: 8px; border-radius: 2px; background: var(--line); border: 0; padding: 0; cursor: pointer; }
.pip.ok { background: var(--ok); } .pip.bad { background: var(--bad); }
.pip.cur { outline: 2px solid var(--accent); outline-offset: 2px; }
.meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; display: grid; gap: 18px; }
.qhead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.qno { font-family: var(--f-mono); font-size: 13px; color: var(--accent); }
.tag { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 4px; }
.stem { font-family: var(--f-display); font-size: 21px; line-height: 1.4; font-weight: 500; margin: 0; }
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; text-align: left; width: 100%;
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:focus-visible, .btn:focus-visible, .pip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt .k { font-family: var(--f-mono); font-size: 13px; width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; color: var(--muted); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .k { border-color: var(--accent); color: var(--accent); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .k { border-color: var(--ok); color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { border-color: var(--bad); color: var(--bad); }
.opt:disabled { cursor: default; }

.verdict { font-weight: 600; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
.explain { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 10px; }
.explain p, .explain ul { margin: 0; }
.explain ul { padding-left: 20px; display: grid; gap: 4px; }
.src { font-size: 13px; color: var(--muted); }

.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.btn { font: inherit; font-weight: 600; border-radius: 8px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--accent); }
.btn.primary { background: var(--accent); color: var(--surface); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.hint { font-size: 13px; color: var(--muted); }

.result { display: grid; gap: 14px; }
.score { font-family: var(--f-display); font-size: 44px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.review { display: grid; gap: 6px; padding: 0; margin: 0; list-style: none; }
.review li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; min-width: 0; }
.review .n { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.review .s { font-family: var(--f-mono); font-size: 13px; font-weight: 500; }
.review .s.ok { color: var(--ok); } .review .s.bad { color: var(--bad); }
.review button { font: inherit; color: var(--ink); background: none; border: 0; padding: 0; text-align: left; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.pip.part { background: var(--warn); } .pip.pend { background: var(--accent); opacity: .5; }
.fig { margin: 0; display: grid; gap: 6px; overflow-x: auto; }
.fig svg { width: 100%; min-width: 320px; height: auto; display: block; }
.fig .grid line { stroke: var(--line); stroke-width: 1; }
.fig .ax line { stroke: var(--muted); stroke-width: 1.5; }
.fig .lbl, .fig text { fill: var(--muted); font-family: var(--f-mono); font-size: 12px; }
.fig .trace { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; }
.fig .trace.dash { stroke-dasharray: 7 5; }
.fig .mark { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 4; }
.fig figcaption { font-size: 13px; color: var(--muted); }
textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; width: 100%; resize: vertical; min-height: 140px; }
textarea:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mine { display: grid; gap: 6px; } .mine p { margin: 0; white-space: pre-wrap; background: var(--bg); border-radius: 8px; padding: 12px; }
.selfmark { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.review .s.part { color: var(--warn); }
@media (max-width: 480px) { .card { padding: 18px; } .stem { font-size: 19px; } }
@media (prefers-reduced-motion: no-preference) { .opt { transition: border-color .12s, background-color .12s; } }
.line { font: inherit; font-size: 17px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; width: 100%; }
.line:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.model { font-family: var(--f-display); font-size: 19px; line-height: 1.4; margin: 0; }
.also { font-size: 14px; color: var(--muted); margin: 0; }
.match { font-size: 13px; font-weight: 600; }
.match.ok { color: var(--ok); } .match.no { color: var(--muted); }
.fig .tagl { fill: var(--accent); font-size: 14px; font-weight: 600; }
</style>

    <h1>News, cutting edge and Indian urology</h1>

<script>
const Q = [
// ---- News and milestones
{ f:"line", t:"News · World first", q:"Where and when was the world's first human bladder transplant performed, and by whom?", a:"Ronald Reagan UCLA Medical Center, 4 May 2025, by Inderbir Gill and Nima Nassiri (USC–UCLA team).", x:"The recipient had lost most of his bladder to cancer and both kidneys, and had been on dialysis for 7 years. A kidney was transplanted first, then the bladder, from the same donor. The kidney made urine at once and dialysis was no longer needed. UCLA later reported good one-year results.", k:["ucla","gill","nassiri"] },
{ f:"mcq", t:"News · Xenotransplant", q:"The EXPAND trial began in November 2025 at NYU Langone. What makes it a milestone?",
  o:["First pig kidney transplant into a brain-dead donor","First pig kidney transplanted under a formal FDA clinical trial meant to support licensing, rather than compassionate use","First pig heart–kidney combined transplant","First xenotransplant done without immunosuppression"], a:1,
  e:["All earlier living-patient pig kidney transplants (Slayman, Looney, Andrews) were done under the FDA's Expanded Access (compassionate use) pathway.",
     "EXPAND is a combined phase 1/2/3 study of United Therapeutics' 'UKidney'. The pig has 10 gene edits: 6 human genes added and 4 pig genes inactivated."], s:"United Therapeutics press release, 3 Nov 2025; NYU Langone" },
{ f:"mcq", t:"News · Xenotransplant", q:"Towana Looney received a gene-edited pig kidney at NYU Langone in November 2024. What happened to it?",
  o:["It is still working after 2 years","It worked for about 4 months (130 days), then was removed because of rejection","It failed within 48 hours from hyperacute rejection","It was removed for porcine cytomegalovirus infection"], a:1,
  e:["It worked for 4 months and 9 days, a record at the time. It was removed when rejection developed after immunosuppression was reduced to treat an infection, and she returned to dialysis.",
     "Tim Andrews (Massachusetts General Hospital, January 2025, eGenesis kidney) then became the first recipient to pass 6 months without dialysis."], s:"News reports, April and July 2025" },
{ f:"line", t:"News · Public figure", q:"In May 2025, former US President Joe Biden was diagnosed with prostate cancer. Give the grade and stage reported, and the standard first-line treatment for that disease state.", a:"Gleason 9 (Grade Group 5) with bone metastases, hormone-sensitive: metastatic HSPC (hormone-sensitive prostate cancer), treated with ADT (androgen deprivation therapy) plus an ARPI (androgen-receptor pathway inhibitor), with or without docetaxel.", x:"ARPIs include abiraterone, enzalutamide, apalutamide and darolutamide. Triplet therapy (adding docetaxel) is supported by ARASENS and PEACE-1, especially for high-volume disease. The case reopened debate about PSA screening in older men.", k:["hormone-sensitive","hspc","grade group 5","gleason 9","adt"] },
{ f:"line", t:"News · Global burden", q:"What did the Lancet Commission on prostate cancer (April 2024) project?", a:"Annual cases would double from 1.4 million (2020) to 2.9 million by 2040, with the largest rise in low- and middle-income countries.", x:"Deaths are projected to rise by about 85%, to nearly 700,000 a year. It was launched at the EAU Congress 2024 and led by Nick James. It called for early-diagnosis programmes in low- and middle-income countries, where most men present late.", k:["double","2.9","2040"] },
{ f:"line", t:"News · Approval", q:"What is Inlexzo, when did the FDA approve it, and what complete response rate did its pivotal trial report?", a:"TAR-200, an intravesical gemcitabine-releasing device; approved 9 September 2025 for BCG-unresponsive NMIBC with CIS; SunRISe-1 complete response about 82%.", x:"It is a flexible, pretzel-shaped silicone device that releases gemcitabine over 3 weeks per cycle. About half of responders stayed in response for at least 12 months. It is a bladder-sparing option for patients unfit for or declining cystectomy.", k:["tar-200","tar 200","gemcitabine"] },
{ f:"line", t:"Cutting edge · NMIBC", q:"What is cretostimogene grenadenorepvec (BOND-003)?", a:"A conditionally replicating oncolytic adenovirus carrying a GM-CSF (granulocyte-macrophage colony-stimulating factor) gene, given intravesically for BCG-unresponsive CIS.", x:"BOND-003: complete response 75% at any time, about 46% at 1 year, with no grade 3–4 treatment-related events. The FDA gave it Breakthrough and Fast Track designations. Do not confuse it with nadofaragene, which is non-replicating and carries an interferon gene.", k:["oncolytic","gm-csf","gmcsf","adenovir"] },
{ f:"line", t:"News · Robotics", q:"What 'world first' did Agilis Robotics report from Hong Kong in December 2024?", a:"The first robot-assisted en bloc resection of a bladder tumour (ERBT), using a fully flexible transurethral endoscopic robot with two arms.", x:"En bloc resection removes the tumour in one piece rather than piecemeal. This avoids scattering tumour cells, keeps the specimen intact (muscle present) for accurate staging, and may reduce recurrence. The trial was run with CUHK.", k:["en bloc","en-bloc","erbt","bladder tumour","bladder tumor"] },
// ---- Cutting-edge science
{ f:"mcq", t:"Cutting edge · ADCs", q:"Match the antibody–drug conjugate to its target and payload. Which pairing is correct?",
  o:["Enfortumab vedotin: Trop-2 / SN-38","Sacituzumab govitecan: Nectin-4 / MMAE","Enfortumab vedotin: Nectin-4 / MMAE (monomethyl auristatin E)","Disitamab vedotin: PD-L1 / MMAE"], a:2,
  e:["Enfortumab vedotin targets Nectin-4 and carries MMAE, a microtubule disruptor. Typical toxicities are skin reactions, peripheral neuropathy and hyperglycaemia.",
     "Sacituzumab govitecan targets Trop-2 and carries SN-38 (a topoisomerase I inhibitor). Disitamab vedotin targets HER2."], s:"EV-302; urothelial cancer systemic therapy" },
{ f:"line", t:"Cutting edge · Targeted therapy", q:"What does erdafitinib inhibit, and which trial showed an overall survival benefit in urothelial carcinoma?", a:"FGFR (fibroblast growth factor receptor) tyrosine kinases; THOR, in FGFR3-altered metastatic urothelial carcinoma.", x:"Patients must be tested for FGFR alterations first. Hyperphosphataemia is a typical on-target side effect, along with central serous retinopathy.", k:["fgfr"] },
{ f:"line", t:"Cutting edge · Kidney", q:"What is belzutifan's mechanism, and in which hereditary syndrome is it used for renal tumours?", a:"HIF-2α (hypoxia-inducible factor 2-alpha) inhibitor; used in von Hippel-Lindau disease (LITESPARK-004).", x:"In VHL (von Hippel-Lindau) disease, loss of VHL protein lets HIF-2α build up and drive tumour growth. Belzutifan shrinks renal, pancreatic and CNS tumours and so delays surgery. Main side effects are anaemia and hypoxia.", k:["hif","vhl","hippel"] },
{ f:"mcq", t:"Cutting edge · Theranostics", q:"Compared with lutetium-177 PSMA, actinium-225 PSMA:",
  o:["Emits beta particles with a longer tissue range","Emits alpha particles with high linear energy transfer and a very short range, causing double-strand DNA breaks; xerostomia is a key toxicity","Is used only for imaging","Does not bind PSMA"], a:1,
  e:["Alpha particles travel only a few cell diameters but carry very high energy, so they kill cells even in tumours resistant to Lu-177. Salivary-gland toxicity (dry mouth) is more marked.",
     "Lutetium-177 is a beta emitter with a range of a few millimetres. Its evidence comes from VISION (after ARPI and taxane) and PSMAfore (taxane-naive, after ARPI)."], s:"PSMA theranostics literature" },
{ f:"mcq", t:"Cutting edge · Imaging", q:"Which of these is NOT a PSMA PET radiotracer?",
  o:["68Ga-PSMA-11","18F-DCFPyL (piflufolastat)","18F-rhPSMA-7.3 (flotufolastat)","18F-fluciclovine"], a:3,
  e:["18F-fluciclovine (Axumin) is a synthetic amino-acid analogue taken up by amino-acid transporters, not a PSMA ligand. It is less sensitive than PSMA PET at low PSA.",
     "The other three bind PSMA. 18F tracers have a longer half-life and can be made centrally in a cyclotron. 68Ga comes from a generator."], s:"Prostate imaging; EAU guideline" },
{ f:"line", t:"Cutting edge · AI", q:"What was the first AI pathology product authorised by the FDA, and what does it do?", a:"Paige Prostate (2021): it flags suspicious areas on digitised prostate biopsy slides to help pathologists detect cancer.", x:"It was authorised through the De Novo route. Multimodal AI biomarkers that combine histology images with clinical data to predict benefit from ADT are now being used in prostate cancer risk stratification.", k:["paige"] },
// ---- India and USI
{ f:"line", t:"USI · History", q:"When and where was the Urological Society of India founded, under what name, and who was its first president?", a:"December 1961, at the Association of Surgeons of India conference in Baroda, as the Urology Section of the ASI. First president: Dr G. M. Phadke.", x:"It started with 32 members, and Dr B. N. Colabawalla was the first Honorary Secretary-cum-Treasurer. It was renamed the Urological Society of India in 1971.", k:["phadke","1961","baroda"] },
{ f:"line", t:"USI · Journal", q:"In what year did the Indian Journal of Urology start in its current form, and who was its founder editor?", a:"1984; Dr Mahendra Bhandari (editor until 1994).", x:"It is the official journal of USI.", k:["bhandari","1984"] },
{ f:"line", t:"India · Transplant", q:"Who performed India's first successful kidney transplant, where, and when?", a:"Dr Mohan Rao (urologist) and Dr K. V. Johny (nephrologist), CMC Vellore, 2 February 1971, from a living donor.", x:"The graft functioned for 10 months, and the patient lived about 5 more years. THOA (Transplantation of Human Organs Act) followed in 1994.", k:["vellore","cmc","mohan rao","johny"] },
{ f:"line", t:"India · Institutions", q:"Which pioneering urology hospital was founded in 1978 in rural Gujarat, and by whom?", a:"Muljibhai Patel Urological Hospital (MPUH), Nadiad, the vision of Dr Virendra Desai.", x:"It was inaugurated by President Neelam Sanjiva Reddy on 19 March 1978. It is known for endourology, including the micro-PCNL work of Dr Mahesh Desai's group, and for transplantation.", k:["muljibhai","mpuh","nadiad"] },
{ f:"line", t:"India · Robotics", q:"What is SSI Mantra, and what urology milestone did it achieve in 2024–25?", a:"India's own surgical robot (SS Innovations, Dr Sudhir Srivastava); it was the first in India approved by CDSCO (Central Drugs Standard Control Organisation) for telesurgery, and was used for remote robotic urological cancer surgery.", x:"In 2024, RGCI Delhi performed India's first cancer telesurgery with it (surgeon in Gurugram, patient in Rohini). This was followed by urological cases such as nephrectomy and cystectomy, and a live tele-partial nephrectomy shown at ERUS 2025.", k:["telesurgery","tele-surgery","remote","indian robot","indigenous"] },
{ f:"line", t:"India · Contribution", q:"Which device did D. D. Gaur describe in 1992, and why did it matter?", a:"The Gaur balloon: a glove-finger balloon on a catheter to create the retroperitoneal working space, which made retroperitoneoscopy practical.", x:"It allowed retroperitoneal laparoscopic nephrectomy, pyelolithotomy and adrenalectomy without entering the peritoneum. Commercial balloon dissectors developed from it.", k:["balloon","retroperitone"] }
];

const KEYS = ["A","B","C","D"];
const FIG = {
cmg: `<figure class="fig"><svg viewBox="0 0 520 320" role="img" aria-label="Cystometrogram with three channels. At A, a sharp spike appears in Pves and Pabd but not in Pdet. At B, two waves appear in Pves and Pdet while Pabd stays flat.">
  <g class="ax"><line x1="60" y1="80" x2="500" y2="80"/><line x1="60" y1="170" x2="500" y2="170"/><line x1="60" y1="260" x2="500" y2="260"/><line x1="60" y1="290" x2="500" y2="290"/></g>
  <g class="lbl"><text x="54" y="84" text-anchor="end">Pves</text><text x="54" y="174" text-anchor="end">Pabd</text><text x="54" y="264" text-anchor="end">Pdet</text>
  ${[0,100,200,300,400].map(v=>`<text x="${60+1.1*v}" y="305" text-anchor="middle">${v}</text>`).join("")}
  <text x="280" y="318" text-anchor="middle">Volume infused (mL)</text>

  <line class="mark" x1="170" y1="32" x2="170" y2="290"/><line class="mark" x1="381" y1="32" x2="381" y2="290"/>
  <polyline class="trace" points="60,80 165,80 170,40 175,80 335,80 345,58 352,50 360,62 368,80 390,80 400,55 409,46 418,60 428,80 500,80"/>
  <polyline class="trace" points="60,170 165,170 170,130 175,170 500,170"/>
  <polyline class="trace" points="60,260 335,260 345,238 352,230 360,242 368,260 390,260 400,235 409,226 418,240 428,260 500,260"/>
</svg><figcaption>Channels are drawn on separate baselines. The vertical scale is the same for all three.</figcaption></figure>`,
comp: `<figure class="fig"><svg viewBox="0 0 520 300" role="img" aria-label="Detrusor pressure rising steadily from 5 cmH2O at 0 mL to 45 cmH2O at 300 mL and about 52 at 350 mL.">
  <g class="grid">${[180,100,20].map(y=>`<line x1="60" x2="500" y1="${y}" y2="${y}"/>`).join("")}</g>
  <g class="ax"><line x1="60" y1="260" x2="500" y2="260"/><line x1="60" y1="260" x2="60" y2="20"/></g>
  <g class="lbl">${[0,100,200,300,400].map(v=>`<text x="${60+1.1*v}" y="278" text-anchor="middle">${v}</text>`).join("")}
  ${[0,20,40,60].map(p=>`<text x="52" y="${264-4*p}" text-anchor="end">${p}</text>`).join("")}
  <text x="280" y="296" text-anchor="middle">Volume infused (mL)</text><text x="16" y="140" text-anchor="middle" transform="rotate(-90 16 140)">Pdet (cmH₂O)</text></g>
  <line class="mark" x1="390" y1="260" x2="390" y2="80"/><line class="mark" x1="60" y1="80" x2="390" y2="80"/>
  <polyline class="trace" points="60,240 170,206 280,160 390,80 445,52"/>

};

const STORE = "mch-prize-1";
const N = Q.length;
const fresh = () => ({ i: 0, ans: Array(N).fill(null), done: Array(N).fill(false), grade: Array(N).fill(null) });
let state = fresh();
try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.ans && s.ans.length === N) state = s; } catch (e) {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} };

const stage = document.getElementById("stage"), strip = document.getElementById("strip");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const fmt = x => Number.isInteger(x) ? String(x) : x.toFixed(1);
const isMcq = k => Q[k].f === "mcq";
const pts = k => !state.done[k] ? 0 : isMcq(k) ? (state.ans[k] === Q[k].a ? 1 : 0) : (state.grade[k] ?? 0);
const finished = k => state.done[k] && (isMcq(k) || state.grade[k] !== null);
const status = k => !state.done[k] ? "" : !finished(k) ? "pend" : pts(k) === 1 ? "ok" : pts(k) > 0 ? "part" : "bad";
const score = () => Q.reduce((n, _, k) => n + pts(k), 0);
const hits = k => { const a = String(state.ans[k] || "").toLowerCase(); return a && Q[k].k.some(w => a.includes(w)); };
const FMT = { mcq: "Single best answer", text: "Written answer", line: "One-line answer" };

function renderStrip() {
  strip.innerHTML = "";
  Q.forEach((_, k) => {
    const b = document.createElement("button");
    b.className = "pip " + status(k) + (k === state.i ? " cur" : "");
    b.setAttribute("aria-label", "Question " + (k + 1));
    b.onclick = () => { state.i = k; save(); render(); };
    strip.appendChild(b);
  });
  document.getElementById("pos").textContent = state.i < N ? `Question ${state.i + 1} of ${N} · ${FMT[Q[state.i].f]}` : "Finished";
  document.getElementById("tally").textContent = `${fmt(score())} marks · ${Q.filter((_, k) => finished(k)).length} done`;
}

const selfmark = k => `<div class="selfmark" role="group" aria-label="Mark yourself"><span class="hint">Mark yourself:</span>
  ${[[1,"Got it (1)"],[0.5,"Partly (½)"],[0,"Missed (0)"]].map(([v,l]) => `<button class="chip${state.grade[k] === v ? " on" : ""}" data-g="${v}">${l}</button>`).join("")}</div>`;

function render() {
  renderStrip();
  if (state.i >= N) return renderResult();
  const k = state.i, it = Q[k], done = state.done[k], ans = state.ans[k], last = k === N - 1;
  let body = "", exp = "";
  if (it.f === "mcq") {
    body = `<div class="opts" role="group" aria-label="Answer options">${it.o.map((txt, j) => {
      let c = "opt"; if (done) { if (j === it.a) c += " right"; else if (j === ans) c += " wrong"; } else if (j === ans) c += " sel";
      return `<button class="${c}" data-j="${j}" ${done ? "disabled" : ""}><span class="k">${KEYS[j]}</span><span>${txt}</span></button>`; }).join("")}</div>`;
    if (done) exp = `<div class="explain"><div class="verdict ${ans === it.a ? "ok" : "bad"}">${ans === it.a ? "Correct." : "Not quite. The answer is " + KEYS[it.a] + "."}</div>
      <ul>${it.e.map(x => `<li>${x}</li>`).join("")}</ul><p class="src">Read more: ${it.s}</p></div>`;
  } else if (it.f === "text") {
    body = done ? `<div class="mine"><div class="eyebrow">Your answer</div><p>${esc(ans) || "<em>No answer written.</em>"}</p></div>`
                : `<label class="eyebrow" for="ans-${k}">Write your answer</label><textarea id="ans-${k}" rows="7" placeholder="Write it as you would in the exam.">${esc(ans)}</textarea>`;
    if (done) exp = `<div class="explain"><div class="eyebrow">Model answer: compare point by point</div><ul>${it.m.map(x => `<li>${x}</li>`).join("")}</ul><p class="src">Read more: ${it.s}</p>${selfmark(k)}</div>`;
  } else {
    body = done ? `<div class="mine"><div class="eyebrow">Your line</div><p>${esc(ans) || "<em>No answer written.</em>"}</p></div>`
                : `<label class="eyebrow" for="ans-${k}">Your one-line answer</label><input class="line" id="ans-${k}" type="text" autocomplete="off" value="${esc(ans)}" placeholder="Type and press Enter">`;
    if (done) exp = `<div class="explain"><div class="eyebrow">Model answer</div><p class="model">${it.a}</p><p class="also">${it.x}</p>
      <span class="match ${hits(k) ? "ok" : "no"}">${hits(k) ? "Your line contains the key term." : "Key term not found in your line. Check the meaning yourself."}</span>${selfmark(k)}</div>`;
  }
  const primary = done ? `<button class="btn primary" id="next" ${finished(k) ? "" : "disabled"}>${last ? "See results" : "Next question"}</button>`
    : `<button class="btn primary" id="check" ${it.f === "mcq" && ans === null ? "disabled" : ""}>${it.f === "mcq" ? "Check answer" : "Show model answer"}</button>`;
  stage.innerHTML = `<article class="card">
    <div class="qhead"><span class="qno">Q${String(k + 1).padStart(2, "0")}</span><span class="tag">${it.t}</span></div>
    <p class="stem">${it.q}</p>${it.img ? FIG[it.img] : ""}${body}${exp}
    <div class="actions"><button class="btn ghost" id="prev" ${k === 0 ? "disabled" : ""}>Previous</button>${primary}</div>
    ${done && !finished(k) ? `<span class="hint">Mark yourself to continue.</span>` : ""}</article>`;
  stage.querySelectorAll(".opt").forEach(b => b.onclick = () => { if (!state.done[k]) { state.ans[k] = +b.dataset.j; save(); render(); } });
  stage.querySelectorAll(".chip").forEach(b => b.onclick = () => { state.grade[k] = +b.dataset.g; save(); render(); });
  const inp = document.getElementById("ans-" + k);
  if (inp) { inp.oninput = () => { state.ans[k] = inp.value; save(); };
    if (it.f === "line") inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); check(); } }; }
  const c = document.getElementById("check"); if (c) c.onclick = check;
  const n = document.getElementById("next"); if (n) n.onclick = next;
  document.getElementById("prev").onclick = () => { if (state.i > 0) { state.i--; save(); render(); } };
}
function check() { const k = state.i; if (isMcq(k) && state.ans[k] === null) return; state.done[k] = true; save(); render(); }
function next() {
  const k = state.i; if (!finished(k)) return;
  const open = Q.findIndex((_, j) => j > k && !finished(j));
  state.i = open !== -1 ? open : (Q.every((_, j) => finished(j)) ? N : Q.findIndex((_, j) => !finished(j)));
  save(); render(); window.scrollTo({ top: 0 });
}
function renderResult() {
  const r = score();
  const mark = k => ({ ok: `<span class="s ok">✓</span>`, part: `<span class="s part">½</span>`, bad: `<span class="s bad">✗${isMcq(k) ? " " + KEYS[Q[k].a] : ""}</span>` }[status(k)] || `<span class="s">–</span>`);
  stage.innerHTML = `<article class="card result"><div class="eyebrow">Your score</div><div class="score">${fmt(r)} / ${N}</div>
    <p class="sub">${Math.round(r / N * 100)}%. Written and one-line answers count as you marked them. Tap any topic to review it.</p>
    <ul class="review">${Q.map((it, k) => `<li><span class="n">${k + 1}</span><button data-k="${k}">${it.t}</button>${mark(k)}</li>`).join("")}</ul>
    <div class="actions"><button class="btn ghost" id="reset">Start again</button></div></article>`;
  stage.querySelectorAll(".review button").forEach(b => b.onclick = () => { state.i = +b.dataset.k; save(); render(); });
  document.getElementById("reset").onclick = () => { state = fresh(); save(); render(); };
}
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || state.i >= N || !isMcq(state.i)) return;
  const k = state.i, j = KEYS.indexOf(e.key.toUpperCase());
  if (j > -1 && !state.done[k]) { state.ans[k] = j; save(); render(); }
  else if (e.key === "Enter" && document.activeElement?.tagName !== "BUTTON") { state.done[k] ? next() : check(); }
});
render();
</script>
