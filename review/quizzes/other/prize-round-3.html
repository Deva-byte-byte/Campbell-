<style>
/* Layout: one exam card at a time, narrow reading column, progress strip on top */
:root {
  --bg: #f3f5f6; --surface: #ffffff; --ink: #18232b; --muted: #5b6a74; --line: #d6dde1;
  --accent: #1f5f7a; --accent-soft: #e2eef3;
  --warn: #a8660b; --ok: #1d7a4c; --ok-soft: #e3f3ea; --bad: #b3352b; --bad-soft: #f8e4e1;
  --f-display: "Newsreader", Georgia, "Times New Roman", serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11171b; --surface: #182128; --ink: #e4ebef; --muted: #98a8b2; --line: #2b3842;
  --accent: #7cc0dc; --accent-soft: #1d3340;
  --warn: #e8b05a; --ok: #6fd3a0; --ok-soft: #173327; --bad: #f08a80; --bad-soft: #3a1f1c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11171b; --surface: #182128; --ink: #e4ebef; --muted: #98a8b2; --line: #2b3842;
  --accent: #7cc0dc; --accent-soft: #1d3340;
  --warn: #e8b05a; --ok: #6fd3a0; --ok-soft: #173327; --bad: #f08a80; --bad-soft: #3a1f1c; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; padding: 0 16px; }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 28px 48px; display: grid; gap: 20px; }
header { display: grid; gap: 6px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(26px, 5vw, 34px); line-height: 1.15; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; font-size: 15px; }

.strip { display: grid; grid-template-columns: repeat(30, 1fr); gap: 2px; }
.pip { height: 8px; border-radius: 2px; background: var(--line); border: 0; padding: 0; cursor: pointer; }
.pip.ok { background: var(--ok); } .pip.bad { background: var(--bad); }
.pip.cur { outline: 2px solid var(--accent); outline-offset: 2px; }
.meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; display: grid; gap: 18px; }
.qhead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.qno { font-family: var(--f-mono); font-size: 13px; color: var(--accent); }
.tag { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 4px; }
.stem { font-family: var(--f-display); font-size: 21px; line-height: 1.4; font-weight: 500; margin: 0; }
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; text-align: left; width: 100%;
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:focus-visible, .btn:focus-visible, .pip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt .k { font-family: var(--f-mono); font-size: 13px; width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; color: var(--muted); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .k { border-color: var(--accent); color: var(--accent); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .k { border-color: var(--ok); color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { border-color: var(--bad); color: var(--bad); }
.opt:disabled { cursor: default; }

.verdict { font-weight: 600; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
.explain { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 10px; }
.explain p, .explain ul { margin: 0; }
.explain ul { padding-left: 20px; display: grid; gap: 4px; }
.src { font-size: 13px; color: var(--muted); }

.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.btn { font: inherit; font-weight: 600; border-radius: 8px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--accent); }
.btn.primary { background: var(--accent); color: var(--surface); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.hint { font-size: 13px; color: var(--muted); }

.result { display: grid; gap: 14px; }
.score { font-family: var(--f-display); font-size: 44px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.review { display: grid; gap: 6px; padding: 0; margin: 0; list-style: none; }
.review li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; min-width: 0; }
.review .n { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.review .s { font-family: var(--f-mono); font-size: 13px; font-weight: 500; }
.review .s.ok { color: var(--ok); } .review .s.bad { color: var(--bad); }
.review button { font: inherit; color: var(--ink); background: none; border: 0; padding: 0; text-align: left; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.pip.part { background: var(--warn); } .pip.pend { background: var(--accent); opacity: .5; }
.fig { margin: 0; display: grid; gap: 6px; overflow-x: auto; }
.fig svg { width: 100%; min-width: 320px; height: auto; display: block; }
.fig .grid line { stroke: var(--line); stroke-width: 1; }
.fig .ax line { stroke: var(--muted); stroke-width: 1.5; }
.fig .lbl, .fig text { fill: var(--muted); font-family: var(--f-mono); font-size: 12px; }
.fig .trace { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; }
.fig .trace.dash { stroke-dasharray: 7 5; }
.fig .mark { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 4; }
.fig figcaption { font-size: 13px; color: var(--muted); }
textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; width: 100%; resize: vertical; min-height: 140px; }
textarea:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mine { display: grid; gap: 6px; } .mine p { margin: 0; white-space: pre-wrap; background: var(--bg); border-radius: 8px; padding: 12px; }
.selfmark { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.review .s.part { color: var(--warn); }
@media (max-width: 480px) { .card { padding: 18px; } .stem { font-size: 19px; } }
@media (prefers-reduced-motion: no-preference) { .opt { transition: border-color .12s, background-color .12s; } }
.line { font: inherit; font-size: 17px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; width: 100%; }
.line:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.model { font-family: var(--f-display); font-size: 19px; line-height: 1.4; margin: 0; }
.also { font-size: 14px; color: var(--muted); margin: 0; }
.match { font-size: 13px; font-weight: 600; }
.match.ok { color: var(--ok); } .match.no { color: var(--muted); }
.fig .tagl { fill: var(--accent); font-size: 14px; font-weight: 600; }
</style>

<script>
const Q = [
// ===== PRIZE ROUND (1–15)
{ f:"mcq", t:"Prize · Bladder", q:"POTOMAC (Lancet, October 2025) tested durvalumab with BCG in BCG-naive high-risk NMIBC. Which arm beat BCG alone?",
  o:["Durvalumab plus BCG induction only","Durvalumab plus BCG induction and maintenance","Durvalumab alone","Both durvalumab arms"], a:1,
  e:["One year of intravenous durvalumab with BCG induction and maintenance improved disease-free survival (HR, hazard ratio, 0.68), a 32% risk reduction.",
     "Durvalumab with BCG induction only did not beat standard BCG (HR 1.14). The lesson is that maintenance BCG cannot be replaced. Grade 3–4 treatment-related events: 21% vs 4%."], s:"POTOMAC, De Santis et al., Lancet 2025" },
{ f:"line", t:"Prize · Bladder", q:"What is sasanlimab, and what did the CREST trial show?", a:"A subcutaneous anti-PD-1 antibody; added to BCG induction and maintenance in BCG-naive high-risk NMIBC, it improved event-free survival (HR 0.68).", x:"Pfizer called it the first potential advance for BCG-naive high-risk NMIBC in more than 30 years. CREST and POTOMAC both support adding a checkpoint inhibitor to BCG, but the toxicity has to be weighed against the benefit.", k:["pd-1","pd1","subcutaneous"] },
{ f:"line", t:"Prize · Screening", q:"What did the ERSPC 23-year follow-up (NEJM, October 2025) report?", a:"PSA screening reduced prostate-cancer mortality by 13%; 456 men needed to be invited, and 12 diagnosed, to prevent one prostate-cancer death.", x:"At 16 years the number needed to invite was 628, so the benefit-to-harm balance improves with longer follow-up. The trial included more than 160,000 men in 8 European countries.", k:["13","456"] },
{ f:"line", t:"Prize · Kidney", q:"What did LITESPARK-022 (ASCO GU 2026) add to adjuvant therapy for clear-cell RCC?", a:"Belzutifan (a HIF-2α inhibitor) added to adjuvant pembrolizumab improved disease-free survival compared with pembrolizumab alone (HR 0.72; 24-month DFS 80.7% vs 73.7%).", x:"It built on KEYNOTE-564, with 1,841 patients at intermediate-high or high risk, or with resected metastases. It may become the new adjuvant standard, but overall survival data are still awaited.", k:["belzutifan"] },
{ f:"line", t:"Prize · Bladder", q:"What did the RC48-C016 trial (NEJM 2025) show in HER2-expressing advanced urothelial cancer?", a:"First-line disitamab vedotin (an anti-HER2 antibody–drug conjugate) plus toripalimab (anti-PD-1) improved overall survival compared with platinum chemotherapy (31.5 vs 16.9 months).", x:"Progression-free survival was 13.1 vs 6.5 months. This makes HER2 testing a new biomarker in urothelial cancer, alongside FGFR3 testing for erdafitinib.", k:["disitamab","her2"] },
{ f:"mcq", t:"Prize · Bladder", q:"Why did Gilead withdraw sacituzumab govitecan's US indication for urothelial cancer in October 2024?",
  o:["Manufacturing problems","Its confirmatory trial TROPiCS-04 did not meet its overall survival end point after accelerated approval","Unexpected cardiac deaths","Replacement by a biosimilar"], a:1,
  e:["It received accelerated approval in April 2021 for pretreated disease. In TROPiCS-04, overall survival was numerically better than chemotherapy but not significantly so, with more toxicity.",
     "The point to learn is that accelerated approvals depend on confirmatory trials, and a negative trial can remove the indication."], s:"OncLive / Urology Times, 2024" },
{ f:"line", t:"Prize · Prostate", q:"What did the FDA approve for Pluvicto on 28 March 2025?", a:"Use in PSMA-positive mCRPC after one ARPI and before chemotherapy (taxane-naive), based on PSMAfore.", x:"In PSMAfore it reduced the risk of radiographic progression or death by 59% compared with switching ARPI. The new indication roughly tripled the number of eligible patients.", k:["before chemo","pre-chemo","taxane-naive","taxane naive","psmafore"] },
{ f:"line", t:"Prize · Andrology", q:"What is YCT-529, and how does it work?", a:"A hormone-free oral male contraceptive that blocks the retinoic acid receptor-alpha in the testis, stopping sperm production.", x:"The phase 1a trial (2025) in 16 men found no effect on hormones, heart rate, libido or mood. Repeated-dose trials measuring effect on sperm counts are under way. Vitamin A (retinoic acid) signalling is needed to start spermatogenesis.", k:["retinoic","rar"] },
{ f:"line", t:"Prize · Science", q:"What did the 2025 Nobel Prize in Physiology or Medicine recognise, and why does it matter to transplant urologists?", a:"Peripheral immune tolerance: regulatory T cells (Sakaguchi) and their master gene FOXP3 (Brunkow and Ramsdell). It matters because regulatory T-cell therapy is a route to transplant tolerance with less immunosuppression.", x:"Sakaguchi described CD4+CD25+ regulatory T cells in 1995. Regulatory T cells also shield tumours from immune attack, which links the discovery to immuno-oncology.", k:["regulatory t","treg","tolerance","foxp3"] },
{ f:"line", t:"Prize · Xenotransplant", q:"In March 2025, which country reported its first gene-edited pig kidney transplant into a living patient, and where?", a:"China, at Xijing Hospital, Xi'an (Lin Wang), in a 69-year-old woman. She was the third person in the world then living with a pig kidney.", x:"The same group reported a pig liver that functioned for 10 days in a brain-dead recipient (Nature). The other two living recipients at the time were in the US: Towana Looney and Tim Andrews.", k:["china","xijing","xi'an","xian"] },
{ f:"line", t:"Prize · Robotics", q:"What new capability did da Vinci 5 (FDA clearance 14 March 2024) introduce?", a:"Force feedback: instruments that measure the force on tissue and let the surgeon feel it.", x:"Preclinical work showed up to 43% less force on tissue. The lack of haptic feedback had been the main criticism of earlier robotic systems.", k:["force","haptic"] },
{ f:"line", t:"Prize · India", q:"In September 2025, AIIMS New Delhi achieved which robotic transplant milestone?", a:"It became the first government institution in India to perform robotic kidney transplantation (first case 3 September 2025, using da Vinci Xi).", x:"Robotic kidney transplantation in India's private sector dates from Medanta in 2013. Doing it in the public sector makes it affordable for many more patients.", k:["government","public","aiims"] },
{ f:"line", t:"Prize · India", q:"Where was the first kidney transplant done with India's own SSI Mantra robot, and by whom?", a:"Hindusthan Hospital, Coimbatore, by a team led by Dr M. K. Ramalingam.", x:"The recipient was 27 years old. SSI Mantra (SS Innovations, Dr Sudhir Srivastava) is also India's first robot approved for telesurgery.", k:["coimbatore","ramalingam","hindusthan"] },
{ f:"line", t:"Prize · World first", q:"Where and when was the world's first successful penile transplant done, and what did Johns Hopkins add in 2018?", a:"Tygerberg Hospital, Stellenbosch University, Cape Town, 11 December 2014 (André van der Merwe); Johns Hopkins did the first total penis and scrotum transplant (March 2018).", x:"The Cape Town recipient had lost his penis after complications of traditional circumcision, and regained urinary and sexual function. The Hopkins recipient was a soldier injured by a blast in Afghanistan. The testes were not transplanted, to avoid ethical problems around donor-derived sperm.", k:["cape town","tygerberg","stellenbosch","van der merwe","south africa"] },
{ f:"line", t:"Prize · Awareness", q:"Where and when did the Movember men's-health movement begin?", a:"Melbourne, Australia, in 2003.", x:"It raises awareness of prostate cancer, testicular cancer and men's mental health. November is men's-health awareness month, and September is Prostate Cancer Awareness Month.", k:["melbourne","australia","2003"] },
// ===== GENERAL UROLOGY (16–30)
{ f:"mcq", t:"General · Embryology", q:"In a complete duplex kidney, the Weigert-Meyer rule states:",
  o:["The upper-pole ureter inserts superolaterally and refluxes","The upper-pole ureter inserts inferomedially (ectopic, often with ureterocele, obstructs); the lower-pole ureter inserts superolaterally (refluxes)","Both ureters insert at the same site","The lower-pole ureter is always ectopic"], a:1,
  e:["The upper-pole ureteric bud arises higher on the mesonephric duct. It is carried further and ends up inserting lower and more medially. Its orifice is ectopic and tends to obstruct.",
     "The lower-pole orifice is lateral, with a short submucosal tunnel, so it tends to reflux. Remember: upper pole obstructs, lower pole refluxes."], s:"Ureteric anomalies chapter" },
{ f:"line", t:"General · Anatomy", q:"What is Brödel's line, and why does it matter?", a:"A relatively avascular plane on the posterolateral kidney between the territories of the anterior and posterior segmental arteries; nephrotomy along it reduces bleeding.", x:"It is used in anatrophic nephrolithotomy. In PCNL (percutaneous nephrolithotomy), the safest route is through a posterior calyx along its axis, so that it crosses the papilla and avoids interlobar vessels.", k:["avascular","segmental"] },
{ f:"line", t:"General · Physiology", q:"Which brainstem centre coordinates detrusor contraction with sphincter relaxation?", a:"The pontine micturition centre (Barrington's nucleus).", x:"Lesions between the pons and the sacral cord cause detrusor–sphincter dyssynergia. Lesions above the pons cause detrusor overactivity with coordinated (synergic) sphincters.", k:["pontine","barrington","pmc"] },
{ f:"mcq", t:"General · Pharmacology", q:"Which PDE5 (phosphodiesterase type 5) inhibitor has the longest half-life?",
  o:["Sildenafil","Vardenafil","Tadalafil","Avanafil"], a:2,
  e:["Tadalafil's half-life is about 17.5 hours, so it works for up to 36 hours and can be taken once daily (5 mg), which is also licensed for BPH symptoms.",
     "Sildenafil and vardenafil last about 4 hours. Avanafil acts fastest. All are contraindicated with nitrates."], s:"Erectile dysfunction chapter" },
{ f:"line", t:"General · Stones", q:"Which stone compositions are typically resistant to SWL (shock wave lithotripsy)?", a:"Calcium oxalate monohydrate, brushite and cystine.", x:"Stones above about 1000 HU (Hounsfield units) on non-contrast CT, and a skin-to-stone distance above about 10 cm, also predict SWL failure. Uric acid stones are radiolucent and can be dissolved with oral alkalinisation.", k:["monohydrate","brushite","cystine"] },
{ f:"line", t:"General · Infection", q:"What are the classic features of xanthogranulomatous pyelonephritis?", a:"Chronic obstruction (often a staghorn stone) with Proteus or E. coli infection, lipid-laden foamy macrophages, and the CT 'bear paw' sign. Treatment is usually nephrectomy.", x:"It is commonest in middle-aged women. It can mimic renal cell carcinoma and extend into neighbouring structures, so surgery is difficult.", k:["foam","bear paw","xanthoma","staghorn"] },
{ f:"mcq", t:"General · Trauma", q:"For suspected bladder injury, which CT cystography technique is correct?",
  o:["Rely on clamping the catheter during the excretory phase","Retrograde filling with at least 300–350 mL of dilute contrast","Fill with 50 mL to avoid rupture","Only a post-drainage film"], a:1,
  e:["Passive filling during an excretory-phase CT misses injuries. The bladder must be actively distended by retrograde filling with at least 300–350 mL.",
     "Extraperitoneal rupture: usually catheter drainage for 10–14 days. Intraperitoneal rupture, or bladder-neck injury: surgical repair."], s:"Lower urinary tract trauma chapter" },
{ f:"line", t:"General · RCC", q:"What is Stauffer syndrome?", a:"Non-metastatic liver dysfunction (raised alkaline phosphatase, prolonged prothrombin time, hepatosplenomegaly) caused by RCC, which resolves after nephrectomy.", x:"If the liver function does not return to normal after nephrectomy, suspect persistent or metastatic disease. Other RCC paraneoplastic syndromes: hypercalcaemia (PTHrP), polycythaemia (erythropoietin), hypertension (renin), anaemia and fever.", k:["liver","hepatic"] },
{ f:"line", t:"General · Testis", q:"Which crystals are seen in Leydig cell tumours?", a:"Reinke crystals.", x:"Leydig cell tumours may secrete testosterone or oestrogen, causing precocious puberty in boys or gynaecomastia in men. About 10% are malignant. Testis-sparing surgery is an option for small tumours.", k:["reinke"] },
{ f:"line", t:"General · Paediatric", q:"What is the triad of prune belly (Eagle-Barrett) syndrome?", a:"Deficient abdominal wall muscles, dilated urinary tract, and bilateral undescended testes.", x:"It occurs almost only in boys. Other features include a large, poorly emptying bladder, prostatic hypoplasia, and pulmonary hypoplasia from oligohydramnios. Orchidopexy is usually done early, often transabdominally.", k:["abdominal","cryptorchid","undescended"] },
{ f:"line", t:"General · Neuro-urology", q:"Which spinal segments does the bulbocavernosus reflex test?", a:"S2–S4 (afferent and efferent through the pudendal nerve).", x:"Method: squeeze the glans or clitoris (or tug the catheter) and feel or see the anal sphincter contract. Absence suggests a sacral cord or cauda equina lesion, or spinal shock.", k:["s2","s3","s4","sacral"] },
{ f:"mcq", t:"General · Female", q:"In POP-Q (Pelvic Organ Prolapse Quantification), where is point Aa?",
  o:["At the cervix","3 cm proximal to the external urethral meatus on the anterior vaginal wall","At the hymen","At the posterior fornix"], a:1,
  e:["Aa lies in the midline of the anterior vaginal wall, 3 cm proximal to the external urethral meatus. Its range is −3 to +3 cm relative to the hymen, which is point 0.",
     "Ba is the most dependent point of the rest of the anterior wall. C is the cervix or vaginal cuff. D is the posterior fornix. The measurements also include gh (genital hiatus), pb (perineal body) and tvl (total vaginal length)."], s:"Ch 105 / Ch 117 Prolapse" },
{ f:"line", t:"General · Andrology", q:"Why are varicoceles more common on the left?", a:"The left gonadal vein enters the left renal vein at a right angle, its column is longer, it more often lacks valves, and the left renal vein can be compressed between the aorta and SMA (nutcracker).", x:"The right gonadal vein drains obliquely into the IVC (inferior vena cava). A new right-sided or non-reducing varicocele needs a scan for a retroperitoneal mass.", k:["right angle","renal vein","valve","nutcracker"] },
{ f:"mcq", t:"General · Pharmacology", q:"Which statement about 5-alpha-reductase inhibitors is correct?",
  o:["Finasteride inhibits types 1 and 2; dutasteride only type 2","Finasteride inhibits type 2; dutasteride inhibits types 1 and 2; both lower PSA by about 50% after 6 months","Neither changes serum PSA","They act within 2 weeks"], a:1,
  e:["Double the PSA value after about 6 months of treatment to interpret it. They shrink the prostate by about 20–30% over 6–12 months and reduce the risk of retention and surgery (MTOPS, CombAT).",
     "Side effects: reduced libido, erectile and ejaculatory dysfunction, and gynaecomastia."], s:"Ch 150 BPH" },
{ f:"line", t:"General · Transplant", q:"What causes hyperacute rejection, and when does it occur?", a:"Preformed recipient antibodies (ABO or HLA) against the donor endothelium; it happens within minutes to hours of reperfusion, causing graft thrombosis.", x:"It is prevented by ABO matching and a negative crossmatch (now virtual and flow crossmatch). It cannot be treated, so the graft must be removed. Pig kidneys are gene-edited to remove α-Gal and other antigens for the same reason.", k:["preformed","antibod"] }
];

  <text x="170" y="26" text-anchor="middle" class="tagl">A</text><text x="381" y="26" text-anchor="middle" class="tagl">B</text></g>
  <line class="mark" x1="170" y1="32" x2="170" y2="290"/><line class="mark" x1="381" y1="32" x2="381" y2="290"/>
  <polyline class="trace" points="60,80 165,80 170,40 175,80 335,80 345,58 352,50 360,62 368,80 390,80 400,55 409,46 418,60 428,80 500,80"/>
  <polyline class="trace" points="60,170 165,170 170,130 175,170 500,170"/>
  <polyline class="trace" points="60,260 335,260 345,238 352,230 360,242 368,260 390,260 400,235 409,226 418,240 428,260 500,260"/>
</svg><figcaption>Channels are drawn on separate baselines. The vertical scale is the same for all three.</figcaption></figure>`,
comp: `<figure class="fig"><svg viewBox="0 0 520 300" role="img" aria-label="Detrusor pressure rising steadily from 5 cmH2O at 0 mL to 45 cmH2O at 300 mL and about 52 at 350 mL.">
  <g class="grid">${[180,100,20].map(y=>`<line x1="60" x2="500" y1="${y}" y2="${y}"/>`).join("")}</g>
  <g class="ax"><line x1="60" y1="260" x2="500" y2="260"/><line x1="60" y1="260" x2="60" y2="20"/></g>
  <g class="lbl">${[0,100,200,300,400].map(v=>`<text x="${60+1.1*v}" y="278" text-anchor="middle">${v}</text>`).join("")}
  ${[0,20,40,60].map(p=>`<text x="52" y="${264-4*p}" text-anchor="end">${p}</text>`).join("")}
  <text x="280" y="296" text-anchor="middle">Volume infused (mL)</text><text x="16" y="140" text-anchor="middle" transform="rotate(-90 16 140)">Pdet (cmH₂O)</text></g>
  <line class="mark" x1="390" y1="260" x2="390" y2="80"/><line class="mark" x1="60" y1="80" x2="390" y2="80"/>
  <polyline class="trace" points="60,240 170,206 280,160 390,80 445,52"/>
</svg></figure>`
};

const STORE = "mch-prize-3";
const N = Q.length;
const fresh = () => ({ i: 0, ans: Array(N).fill(null), done: Array(N).fill(false), grade: Array(N).fill(null) });
let state = fresh();
try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.ans && s.ans.length === N) state = s; } catch (e) {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} };

const stage = document.getElementById("stage"), strip = document.getElementById("strip");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const fmt = x => Number.isInteger(x) ? String(x) : x.toFixed(1);
const isMcq = k => Q[k].f === "mcq";
const pts = k => !state.done[k] ? 0 : isMcq(k) ? (state.ans[k] === Q[k].a ? 1 : 0) : (state.grade[k] ?? 0);
const finished = k => state.done[k] && (isMcq(k) || state.grade[k] !== null);
const status = k => !state.done[k] ? "" : !finished(k) ? "pend" : pts(k) === 1 ? "ok" : pts(k) > 0 ? "part" : "bad";
const score = () => Q.reduce((n, _, k) => n + pts(k), 0);
const hits = k => { const a = String(state.ans[k] || "").toLowerCase(); return a && Q[k].k.some(w => a.includes(w)); };
const FMT = { mcq: "Single best answer", text: "Written answer", line: "One-line answer" };

function renderStrip() {
  strip.innerHTML = "";
  Q.forEach((_, k) => {
    const b = document.createElement("button");
    b.className = "pip " + status(k) + (k === state.i ? " cur" : "");
    b.setAttribute("aria-label", "Question " + (k + 1));
    b.onclick = () => { state.i = k; save(); render(); };
    strip.appendChild(b);
  });
  document.getElementById("pos").textContent = state.i < N ? `Question ${state.i + 1} of ${N} · ${FMT[Q[state.i].f]}` : "Finished";
  document.getElementById("tally").textContent = `${fmt(score())} marks · ${Q.filter((_, k) => finished(k)).length} done`;
}

const selfmark = k => `<div class="selfmark" role="group" aria-label="Mark yourself"><span class="hint">Mark yourself:</span>
  ${[[1,"Got it (1)"],[0.5,"Partly (½)"],[0,"Missed (0)"]].map(([v,l]) => `<button class="chip${state.grade[k] === v ? " on" : ""}" data-g="${v}">${l}</button>`).join("")}</div>`;

function render() {
  renderStrip();
  if (state.i >= N) return renderResult();
  const k = state.i, it = Q[k], done = state.done[k], ans = state.ans[k], last = k === N - 1;
  let body = "", exp = "";
  if (it.f === "mcq") {
    body = `<div class="opts" role="group" aria-label="Answer options">${it.o.map((txt, j) => {
      let c = "opt"; if (done) { if (j === it.a) c += " right"; else if (j === ans) c += " wrong"; } else if (j === ans) c += " sel";
      return `<button class="${c}" data-j="${j}" ${done ? "disabled" : ""}><span class="k">${KEYS[j]}</span><span>${txt}</span></button>`; }).join("")}</div>`;
    if (done) exp = `<div class="explain"><div class="verdict ${ans === it.a ? "ok" : "bad"}">${ans === it.a ? "Correct." : "Not quite. The answer is " + KEYS[it.a] + "."}</div>
      <ul>${it.e.map(x => `<li>${x}</li>`).join("")}</ul><p class="src">Read more: ${it.s}</p></div>`;
  } else if (it.f === "text") {
    body = done ? `<div class="mine"><div class="eyebrow">Your answer</div><p>${esc(ans) || "<em>No answer written.</em>"}</p></div>`
                : `<label class="eyebrow" for="ans-${k}">Write your answer</label><textarea id="ans-${k}" rows="7" placeholder="Write it as you would in the exam.">${esc(ans)}</textarea>`;
    if (done) exp = `<div class="explain"><div class="eyebrow">Model answer: compare point by point</div><ul>${it.m.map(x => `<li>${x}</li>`).join("")}</ul><p class="src">Read more: ${it.s}</p>${selfmark(k)}</div>`;
  } else {
    body = done ? `<div class="mine"><div class="eyebrow">Your line</div><p>${esc(ans) || "<em>No answer written.</em>"}</p></div>`
                : `<label class="eyebrow" for="ans-${k}">Your one-line answer</label><input class="line" id="ans-${k}" type="text" autocomplete="off" value="${esc(ans)}" placeholder="Type and press Enter">`;
    if (done) exp = `<div class="explain"><div class="eyebrow">Model answer</div><p class="model">${it.a}</p><p class="also">${it.x}</p>
      <span class="match ${hits(k) ? "ok" : "no"}">${hits(k) ? "Your line contains the key term." : "Key term not found in your line. Check the meaning yourself."}</span>${selfmark(k)}</div>`;
  }
  const primary = done ? `<button class="btn primary" id="next" ${finished(k) ? "" : "disabled"}>${last ? "See results" : "Next question"}</button>`
    : `<button class="btn primary" id="check" ${it.f === "mcq" && ans === null ? "disabled" : ""}>${it.f === "mcq" ? "Check answer" : "Show model answer"}</button>`;
  stage.innerHTML = `<article class="card">
    <div class="qhead"><span class="qno">Q${String(k + 1).padStart(2, "0")}</span><span class="tag">${it.t}</span></div>
    <p class="stem">${it.q}</p>${it.img ? FIG[it.img] : ""}${body}${exp}
    <div class="actions"><button class="btn ghost" id="prev" ${k === 0 ? "disabled" : ""}>Previous</button>${primary}</div>
    ${done && !finished(k) ? `<span class="hint">Mark yourself to continue.</span>` : ""}</article>`;
  stage.querySelectorAll(".opt").forEach(b => b.onclick = () => { if (!state.done[k]) { state.ans[k] = +b.dataset.j; save(); render(); } });
  stage.querySelectorAll(".chip").forEach(b => b.onclick = () => { state.grade[k] = +b.dataset.g; save(); render(); });
  const inp = document.getElementById("ans-" + k);
  if (inp) { inp.oninput = () => { state.ans[k] = inp.value; save(); };
    if (it.f === "line") inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); check(); } }; }
  const c = document.getElementById("check"); if (c) c.onclick = check;
  const n = document.getElementById("next"); if (n) n.onclick = next;
  document.getElementById("prev").onclick = () => { if (state.i > 0) { state.i--; save(); render(); } };
}
function check() { const k = state.i; if (isMcq(k) && state.ans[k] === null) return; state.done[k] = true; save(); render(); }
function next() {
  const k = state.i; if (!finished(k)) return;
  const open = Q.findIndex((_, j) => j > k && !finished(j));
  state.i = open !== -1 ? open : (Q.every((_, j) => finished(j)) ? N : Q.findIndex((_, j) => !finished(j)));
  save(); render(); window.scrollTo({ top: 0 });
}
function renderResult() {
  const r = score();
  const mark = k => ({ ok: `<span class="s ok">✓</span>`, part: `<span class="s part">½</span>`, bad: `<span class="s bad">✗${isMcq(k) ? " " + KEYS[Q[k].a] : ""}</span>` }[status(k)] || `<span class="s">–</span>`);
  stage.innerHTML = `<article class="card result"><div class="eyebrow">Your score</div><div class="score">${fmt(r)} / ${N}</div>
    <p class="sub">${Math.round(r / N * 100)}%. Written and one-line answers count as you marked them. Tap any topic to review it.</p>
    <ul class="review">${Q.map((it, k) => `<li><span class="n">${k + 1}</span><button data-k="${k}">${it.t}</button>${mark(k)}</li>`).join("")}</ul>
    <div class="actions"><button class="btn ghost" id="reset">Start again</button></div></article>`;
  stage.querySelectorAll(".review button").forEach(b => b.onclick = () => { state.i = +b.dataset.k; save(); render(); });
  document.getElementById("reset").onclick = () => { state = fresh(); save(); render(); };
}
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || state.i >= N || !isMcq(state.i)) return;
  const k = state.i, j = KEYS.indexOf(e.key.toUpperCase());
  if (j > -1 && !state.done[k]) { state.ans[k] = j; save(); render(); }
  else if (e.key === "Enter" && document.activeElement?.tagName !== "BUTTON") { state.done[k] ? next() : check(); }
});
render();
</script>
