<style>
/* Layout: one exam card at a time, narrow reading column, progress strip on top */
:root {
  --bg: #f3f5f6; --surface: #ffffff; --ink: #18232b; --muted: #5b6a74; --line: #d6dde1;
  --accent: #1f5f7a; --accent-soft: #e2eef3;
  --warn: #a8660b; --ok: #1d7a4c; --ok-soft: #e3f3ea; --bad: #b3352b; --bad-soft: #f8e4e1;
  --f-display: "Newsreader", Georgia, "Times New Roman", serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11171b; --surface: #182128; --ink: #e4ebef; --muted: #98a8b2; --line: #2b3842;
  --accent: #7cc0dc; --accent-soft: #1d3340;
  --warn: #e8b05a; --ok: #6fd3a0; --ok-soft: #173327; --bad: #f08a80; --bad-soft: #3a1f1c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11171b; --surface: #182128; --ink: #e4ebef; --muted: #98a8b2; --line: #2b3842;
  --accent: #7cc0dc; --accent-soft: #1d3340;
  --warn: #e8b05a; --ok: #6fd3a0; --ok-soft: #173327; --bad: #f08a80; --bad-soft: #3a1f1c; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; padding: 0 16px; }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 28px 48px; display: grid; gap: 20px; }
header { display: grid; gap: 6px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(26px, 5vw, 34px); line-height: 1.15; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; font-size: 15px; }

.strip { display: grid; grid-template-columns: repeat(25, 1fr); gap: 3px; row-gap: 6px; }
.pip { height: 8px; border-radius: 2px; background: var(--line); border: 0; padding: 0; cursor: pointer; }
.pip.ok { background: var(--ok); } .pip.bad { background: var(--bad); }
.pip.cur { outline: 2px solid var(--accent); outline-offset: 2px; }
.meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; display: grid; gap: 18px; }
.qhead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.qno { font-family: var(--f-mono); font-size: 13px; color: var(--accent); }
.tag { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 4px; }
.stem { font-family: var(--f-display); font-size: 21px; line-height: 1.4; font-weight: 500; margin: 0; }
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; text-align: left; width: 100%;
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:focus-visible, .btn:focus-visible, .pip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt .k { font-family: var(--f-mono); font-size: 13px; width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; color: var(--muted); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .k { border-color: var(--accent); color: var(--accent); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .k { border-color: var(--ok); color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { border-color: var(--bad); color: var(--bad); }
.opt:disabled { cursor: default; }

.verdict { font-weight: 600; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
.explain { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 10px; }
.explain p, .explain ul { margin: 0; }
.explain ul { padding-left: 20px; display: grid; gap: 4px; }
.src { font-size: 13px; color: var(--muted); }

.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.btn { font: inherit; font-weight: 600; border-radius: 8px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--accent); }
.btn.primary { background: var(--accent); color: var(--surface); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.hint { font-size: 13px; color: var(--muted); }

.result { display: grid; gap: 14px; }
.score { font-family: var(--f-display); font-size: 44px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.review { display: grid; gap: 6px; padding: 0; margin: 0; list-style: none; }
.review li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; min-width: 0; }
.review .n { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.review .s { font-family: var(--f-mono); font-size: 13px; font-weight: 500; }
.review .s.ok { color: var(--ok); } .review .s.bad { color: var(--bad); }
.review button { font: inherit; color: var(--ink); background: none; border: 0; padding: 0; text-align: left; cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.pip.part { background: var(--warn); } .pip.pend { background: var(--accent); opacity: .5; }
.fig { margin: 0; display: grid; gap: 6px; overflow-x: auto; }
.fig svg { width: 100%; min-width: 320px; height: auto; display: block; }
.fig .grid line { stroke: var(--line); stroke-width: 1; }
.fig .ax line { stroke: var(--muted); stroke-width: 1.5; }
.fig .lbl, .fig text { fill: var(--muted); font-family: var(--f-mono); font-size: 12px; }
.fig .trace { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-linejoin: round; }
.fig .trace.dash { stroke-dasharray: 7 5; }
.fig .mark { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 4; }
.fig figcaption { font-size: 13px; color: var(--muted); }
textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; width: 100%; resize: vertical; min-height: 140px; }
textarea:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mine { display: grid; gap: 6px; } .mine p { margin: 0; white-space: pre-wrap; background: var(--bg); border-radius: 8px; padding: 12px; }
.selfmark { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.review .s.part { color: var(--warn); }
@media (max-width: 480px) { .card { padding: 18px; } .stem { font-size: 19px; } }
@media (prefers-reduced-motion: no-preference) { .opt { transition: border-color .12s, background-color .12s; } }
.line { font: inherit; font-size: 17px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; width: 100%; }
.line:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.model { font-family: var(--f-display); font-size: 19px; line-height: 1.4; margin: 0; }
.also { font-size: 14px; color: var(--muted); margin: 0; }
.match { font-size: 13px; font-weight: 600; }
.match.ok { color: var(--ok); } .match.no { color: var(--muted); }
.fig .tagl { fill: var(--accent); font-size: 14px; font-weight: 600; }
</style>

<script>
const Q = [{"f": "mcq", "t": "Transplant · World first", "q": "Where was the world's first human bladder transplant performed (May 2025)?", "o": ["Tygerberg Hospital, Cape Town", "Ronald Reagan UCLA Medical Center (Gill and Nassiri)", "Cleveland Clinic, Ohio", "Mayo Clinic, Rochester"], "a": 1, "e": ["On 4 May 2025, a USC–UCLA team transplanted a kidney and then a bladder from the same donor into a man who had been on dialysis for 7 years. The kidney made urine at once."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "Xenotransplant", "q": "What made the EXPAND study (first transplant 3 November 2025, NYU Langone) a milestone?", "o": ["First pig kidney transplant under a formal FDA trial meant to support licensing", "First pig heart–kidney transplant", "First xenotransplant without immunosuppression", "First pig kidney into a brain-dead donor"], "a": 0, "e": ["Earlier cases (Slayman, Looney, Andrews) were compassionate use under Expanded Access. The UKidney has 10 gene edits: 6 human genes added and 4 pig genes inactivated."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "Xenotransplant", "q": "How long did Towana Looney's gene-edited pig kidney (NYU, November 2024) function?", "o": ["About 4 months (130 days), then removed for rejection", "48 hours", "1 month, removed for viral infection", "Over 2 years and still working"], "a": 0, "e": ["It lasted 4 months and 9 days, a record at the time. Tim Andrews (MGH, January 2025) was then the first recipient to pass 6 months without dialysis."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "News · Prostate", "q": "Former US President Biden's prostate cancer (May 2025) was reported as:", "o": ["Neuroendocrine, castration-resistant", "Gleason 9 (Grade Group 5) with bone metastases, hormone-sensitive", "Grade Group 1, organ-confined", "Gleason 7 (3+4), node-positive"], "a": 1, "e": ["This is metastatic hormone-sensitive prostate cancer (mHSPC). Standard treatment is ADT (androgen deprivation therapy) plus an ARPI (androgen-receptor pathway inhibitor), with or without docetaxel (ARASENS, PEACE-1)."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "Epidemiology", "q": "The Lancet Commission on prostate cancer (2024) projected annual cases by 2040 of about:", "o": ["2.9 million", "1.4 million", "2.0 million", "5 million"], "a": 0, "e": ["Cases double from 1.4 million (2020) to 2.9 million by 2040, and deaths rise by about 85%. The largest increases are in low- and middle-income countries."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "Bladder · Approval", "q": "Inlexzo (approved 9 September 2025) is:", "o": ["A mitomycin hydrogel", "Subcutaneous pembrolizumab", "Intravesical nadofaragene", "TAR-200: a pretzel-shaped device releasing gemcitabine over 3 weeks, for BCG-unresponsive NMIBC with CIS"], "a": 3, "e": ["In SunRISe-1, complete response was about 82%, and about half of responders were still in response at 12 months or more."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "Bladder · New agents", "q": "Cretostimogene grenadenorepvec (BOND-003) is:", "o": ["An IL-15 superagonist", "A gemcitabine-releasing device", "A conditionally replicating oncolytic adenovirus carrying GM-CSF", "A non-replicating vector carrying the interferon-α2b gene"], "a": 2, "e": ["BOND-003 in BCG-unresponsive CIS: complete response 75% at any time, about 46% at 1 year. Do not confuse it with nadofaragene (interferon gene, non-replicating) or N-803 (IL-15)."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "Robotics", "q": "Agilis Robotics (Hong Kong, December 2024) reported the world's first:", "o": ["Robotic ureteroscopy", "Robotic partial nephrectomy over 5G", "Autonomous robotic prostatectomy", "Robot-assisted en bloc resection of a bladder tumour with a flexible transurethral robot"], "a": 3, "e": ["En bloc resection keeps the specimen in one piece, improves staging (muscle present) and avoids scattering tumour cells."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "Systemic therapy", "q": "Enfortumab vedotin targets ___ and carries ___:", "o": ["HER2 / MMAE", "Nectin-4 / MMAE", "Trop-2 / SN-38", "PD-L1 / DM1"], "a": 1, "e": ["Typical toxicities are skin rash, neuropathy and hyperglycaemia. Sacituzumab govitecan is Trop-2/SN-38, and disitamab vedotin is anti-HER2."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "Systemic therapy", "q": "Erdafitinib improved overall survival in which trial and which population?", "o": ["KEYNOTE-057: BCG-unresponsive CIS", "EV-302: first-line advanced urothelial carcinoma", "CheckMate 274: adjuvant MIUC", "THOR: FGFR3-altered metastatic urothelial carcinoma"], "a": 3, "e": ["It is a pan-FGFR (fibroblast growth factor receptor) inhibitor. Hyperphosphataemia is an on-target side effect, and central serous retinopathy can occur."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "Kidney", "q": "Belzutifan works by inhibiting:", "o": ["MET", "mTOR", "VEGFR", "HIF-2α"], "a": 3, "e": ["Loss of the VHL protein lets HIF-2α build up. Belzutifan is approved for VHL-associated tumours (LITESPARK-004) and later-line RCC (LITESPARK-005)."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "Theranostics", "q": "Compared with 177Lu-PSMA, 225Ac-PSMA:", "o": ["Does not bind PSMA", "Emits alpha particles: high linear energy transfer, very short range, double-strand DNA breaks, more xerostomia", "Is used only for imaging", "Is a beta emitter with a longer range"], "a": 1, "e": ["Alpha emitters can work when tumours are resistant to Lu-177. Lu-177 is a beta emitter with a range of millimetres (VISION, PSMAfore, PSMAddition)."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "Imaging", "q": "Which is NOT a PSMA-targeted PET tracer?", "o": ["18F-fluciclovine", "18F-rhPSMA-7.3 (flotufolastat)", "68Ga-PSMA-11", "18F-DCFPyL (piflufolastat)"], "a": 0, "e": ["Fluciclovine is a synthetic amino-acid analogue, not a PSMA ligand, and is less sensitive at low PSA."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "AI", "q": "The first FDA-authorised AI pathology product (2021) was:", "o": ["ArteraAI", "Google LYNA", "Paige Prostate", "Ibex Galen"], "a": 2, "e": ["It flags suspicious areas on digitised prostate biopsy slides and was authorised through the De Novo route."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "USI", "q": "The Urological Society of India began as:", "o": ["The Urology Section of the Association of Surgeons of India, Baroda, December 1961", "The Indian chapter of SIU, 1980", "A wing of the Indian Medical Association, Mumbai, 1950", "An independent society in Delhi, 1971"], "a": 0, "e": ["It started with 32 members. G. M. Phadke was the first president and B. N. Colabawalla the first secretary. It was renamed USI in 1971."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "USI", "q": "The Indian Journal of Urology (in its current form) began in ___, with founder editor ___:", "o": ["1971; G. M. Phadke", "1984; Mahendra Bhandari", "1990; Mahesh Desai", "1962; B. N. Colabawalla"], "a": 1, "e": ["Bhandari was editor until 1994. IJU is the official journal of the USI."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "India · Transplant", "q": "India's first successful kidney transplant was performed at:", "o": ["KEM Hospital, Mumbai, 1965", "PGIMER Chandigarh, 1978", "CMC Vellore, 2 February 1971 (Mohan Rao and K. V. Johny)", "AIIMS Delhi, 1973"], "a": 2, "e": ["It was a living-donor transplant. The graft worked for 10 months and the patient lived about 5 more years."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "India · Institutions", "q": "Muljibhai Patel Urological Hospital, Nadiad, was founded in 1978 as the vision of:", "o": ["Mahendra Bhandari", "Mahesh Desai", "Virendra Desai", "Janak Desai"], "a": 2, "e": ["It was inaugurated by President Neelam Sanjiva Reddy on 19 March 1978. Mahesh Desai later led it and received the 2025 AUA (Urology Care Foundation) Humanitarian Award."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "India · Robotics", "q": "SSI Mantra is notable as:", "o": ["A Chinese telesurgery platform", "The first single-port robot", "A robotic ureteroscope", "India's own surgical robot, the first in India approved by CDSCO for telesurgery"], "a": 3, "e": ["SS Innovations (Dr Sudhir Srivastava). RGCI Delhi used it for India's first cancer telesurgery in 2024. The first kidney transplant with it was done in Coimbatore (Dr M. K. Ramalingam)."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "India · Contribution", "q": "D. D. Gaur (Mumbai, 1992) introduced:", "o": ["Microperc", "A balloon to create the retroperitoneal working space for retroperitoneoscopy", "The suction ureteral access sheath", "Ultra-mini PCNL"], "a": 1, "e": ["A glove finger tied over a catheter and inflated. It made retroperitoneal laparoscopic nephrectomy, pyelolithotomy and adrenalectomy practical."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "Bladder · Trial", "q": "KEYNOTE-905/EV-303 showed perioperative EV-pembrolizumab improved survival in:", "o": ["Cisplatin-eligible MIBC", "BCG-unresponsive NMIBC", "Cisplatin-ineligible MIBC", "Upper tract urothelial carcinoma"], "a": 2, "e": ["Pathological complete response was 57% vs 8.6%, event-free survival HR 0.40, overall survival HR 0.50. It was the first survival benefit in cisplatin-ineligible patients."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "Prostate · Trial", "q": "PSMAddition was the first phase 3 trial of radioligand therapy in:", "o": ["Metastatic hormone-sensitive prostate cancer", "Biochemical recurrence", "Post-docetaxel mCRPC", "Non-metastatic CRPC"], "a": 0, "e": ["177Lu-PSMA-617 added to ADT plus an ARPI improved radiographic progression-free survival in 1,144 men."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "Prostate · Trial", "q": "CAPItello-281 selected patients by which biomarker?", "o": ["MSI-high", "PTEN deficiency (immunohistochemistry)", "AR-V7", "BRCA2 mutation"], "a": 1, "e": ["Capivasertib (an AKT inhibitor) plus abiraterone improved radiographic progression-free survival (about 33 vs 26 months) in PTEN-deficient mHSPC."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "Prostate · Trial", "q": "Final TALAPRO-2 results (Lancet 2025) showed talazoparib plus enzalutamide:", "o": ["No overall survival benefit", "Benefit only in BRCA carriers", "Benefit only in mHSPC", "An overall survival benefit in first-line mCRPC, including patients without HRR alterations"], "a": 3, "e": ["Median overall survival 45.8 vs 37.0 months. It was the first PARP inhibitor plus ARPI combination to improve overall survival in an unselected population."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "Bladder · Approval", "q": "Zusduri (UGN-102, June 2025) is:", "o": ["Gemcitabine device", "BCG substitute", "Mitomycin in a reverse-thermal hydrogel, a non-surgical alternative to TURBT for recurrent low-grade intermediate-risk NMIBC", "Intravesical pembrolizumab"], "a": 2, "e": ["In ENVISION, 78% had a complete response at 3 months. Its relative Jelmyto (UGN-101) treats low-grade upper-tract tumours."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "Andro ing, surgery and radiotherapy", "Lowest after radiotherapy"], "a": 2, "e": ["Active monitoring had more metastases and progression but no survival cost at 15 years."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "Infection · Trial", "q": "ALTAR (2022) showed which agent non-inferior to daily low-dose antibiotics for recurrent UTI in women?", "o": ["Cranberry", "D-mannose", "Methenamine hippurate", "Vaginal oestrogen"], "a": 2, "e": ["Methenamine is hydrolysed to formaldehyde in acidic urine, so it does not select for resistant organisms."], "s": "Prize rounds I–III and trial sets (sources listed there)"}, {"f": "mcq", "t": "Prostate · Radiotherapy", "q": "PACE-B (NEJM 2024) showed that for low/intermediate-risk localised prostate cancer, 5-fraction SBRT was:", "o": ["Inferior to conventional radiotherapy", "Superior for overall survival", "Non-inferior to conventional or moderately hypofractionated radiotherapy for 5-year freedom from biochemical/clinical failure", "Only feasible with brachytherapy"], "a": 2, "e": ["It supports 5-fraction stereotactic body radiotherapy (SBRT) as a standard option. Moderate hypofractionation (20 fractions) was already standard after CHHiP."], "s": "Prize rounds I–III and trial sets (sources listed there)"}];
const KEYS = ["A","B","C","D"];
const FIG = {

const STORE = "mch-mcq50-1";
const N = Q.length;
const fresh = () => ({ i: 0, ans: Array(N).fill(null), done: Array(N).fill(false), grade: Array(N).fill(null) });
let state = fresh();
try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && s.ans && s.ans.length === N) state = s; } catch (e) {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} };

const stage = document.getElementById("stage"), strip = document.getElementById("strip");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const fmt = x => Number.isInteger(x) ? String(x) : x.toFixed(1);
const isMcq = k => Q[k].f === "mcq";
const pts = k => !state.done[k] ? 0 : isMcq(k) ? (state.ans[k] === Q[k].a ? 1 : 0) : (state.grade[k] ?? 0);
const finished = k => state.done[k] && (isMcq(k) || state.grade[k] !== null);
const status = k => !state.done[k] ? "" : !finished(k) ? "pend" : pts(k) === 1 ? "ok" : pts(k) > 0 ? "part" : "bad";
const score = () => Q.reduce((n, _, k) => n + pts(k), 0);
const hits = k => { const a = String(state.ans[k] || "").toLowerCase(); return a && Q[k].k.some(w => a.includes(w)); };
const FMT = { mcq: "Single best answer", text: "Written answer", line: "One-line answer" };

function renderStrip() {
  strip.innerHTML = "";
  Q.forEach((_, k) => {
    const b = document.createElement("button");
    b.className = "pip " + status(k) + (k === state.i ? " cur" : "");
    b.setAttribute("aria-label", "Question " + (k + 1));
    b.onclick = () => { state.i = k; save(); render(); };
    strip.appendChild(b);
  });
  document.getElementById("pos").textContent = state.i < N ? `Question ${state.i + 1} of ${N} · ${FMT[Q[state.i].f]}` : "Finished";
  document.getElementById("tally").textContent = `${fmt(score())} marks · ${Q.filter((_, k) => finished(k)).length} done`;
}

const selfmark = k => `<div class="selfmark" role="group" aria-label="Mark yourself"><span class="hint">Mark yourself:</span>
  ${[[1,"Got it (1)"],[0.5,"Partly (½)"],[0,"Missed (0)"]].map(([v,l]) => `<button class="chip${state.grade[k] === v ? " on" : ""}" data-g="${v}">${l}</button>`).join("")}</div>`;

function render() {
  renderStrip();
  if (state.i >= N) return renderResult();
  const k = state.i, it = Q[k], done = state.done[k], ans = state.ans[k], last = k === N - 1;
  let body = "", exp = "";
  if (it.f === "mcq") {
    body = `<div class="opts" role="group" aria-label="Answer options">${it.o.map((txt, j) => {
      let c = "opt"; if (done) { if (j === it.a) c += " right"; else if (j === ans) c += " wrong"; } else if (j === ans) c += " sel";
      return `<button class="${c}" data-j="${j}" ${done ? "disabled" : ""}><span class="k">${KEYS[j]}</span><span>${txt}</span></button>`; }).join("")}</div>`;
    if (done) exp = `<div class="explain"><div class="verdict ${ans === it.a ? "ok" : "bad"}">${ans === it.a ? "Correct." : "Not quite. The answer is " + KEYS[it.a] + "."}</div>
      <ul>${it.e.map(x => `<li>${x}</li>`).join("")}</ul><p class="src">Read more: ${it.s}</p></div>`;
  } else if (it.f === "text") {
    body = done ? `<div class="mine"><div class="eyebrow">Your answer</div><p>${esc(ans) || "<em>No answer written.</em>"}</p></div>`
                : `<label class="eyebrow" for="ans-${k}">Write your answer</label><textarea id="ans-${k}" rows="7" placeholder="Write it as you would in the exam.">${esc(ans)}</textarea>`;
    if (done) exp = `<div class="explain"><div class="eyebrow">Model answer: compare point by point</div><ul>${it.m.map(x => `<li>${x}</li>`).join("")}</ul><p class="src">Read more: ${it.s}</p>${selfmark(k)}</div>`;
  } else {
    body = done ? `<div class="mine"><div class="eyebrow">Your line</div><p>${esc(ans) || "<em>No answer written.</em>"}</p></div>`
                : `<label class="eyebrow" for="ans-${k}">Your one-line answer</label><input class="line" id="ans-${k}" type="text" autocomplete="off" value="${esc(ans)}" placeholder="Type and press Enter">`;
    if (done) exp = `<div class="explain"><div class="eyebrow">Model answer</div><p class="model">${it.a}</p><p class="also">${it.x}</p>
      <span class="match ${hits(k) ? "ok" : "no"}">${hits(k) ? "Your line contains the key term." : "Key term not found in your line. Check the meaning yourself."}</span>${selfmark(k)}</div>`;
  }
  const primary = done ? `<button class="btn primary" id="next" ${finished(k) ? "" : "disabled"}>${last ? "See results" : "Next question"}</button>`
    : `<button class="btn primary" id="check" ${it.f === "mcq" && ans === null ? "disabled" : ""}>${it.f === "mcq" ? "Check answer" : "Show model answer"}</button>`;
  stage.innerHTML = `<article class="card">
    <div class="qhead"><span class="qno">Q${String(k + 1).padStart(2, "0")}</span><span class="tag">${it.t}</span></div>
    <p class="stem">${it.q}</p>${it.img ? FIG[it.img] : ""}${body}${exp}
    <div class="actions"><button class="btn ghost" id="prev" ${k === 0 ? "disabled" : ""}>Previous</button>${primary}</div>
    ${done && !finished(k) ? `<span class="hint">Mark yourself to continue.</span>` : ""}</article>`;
  stage.querySelectorAll(".opt").forEach(b => b.onclick = () => { if (!state.done[k]) { state.ans[k] = +b.dataset.j; save(); render(); } });
  stage.querySelectorAll(".chip").forEach(b => b.onclick = () => { state.grade[k] = +b.dataset.g; save(); render(); });
  const inp = document.getElementById("ans-" + k);
  if (inp) { inp.oninput = () => { state.ans[k] = inp.value; save(); };
    if (it.f === "line") inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); check(); } }; }
  const c = document.getElementById("check"); if (c) c.onclick = check;
  const n = document.getElementById("next"); if (n) n.onclick = next;
  document.getElementById("prev").onclick = () => { if (state.i > 0) { state.i--; save(); render(); } };
}
function check() { const k = state.i; if (isMcq(k) && state.ans[k] === null) return; state.done[k] = true; save(); render(); }
function next() {
  const k = state.i; if (!finished(k)) return;
  const open = Q.findIndex((_, j) => j > k && !finished(j));
  state.i = open !== -1 ? open : (Q.every((_, j) => finished(j)) ? N : Q.findIndex((_, j) => !finished(j)));
  save(); render(); window.scrollTo({ top: 0 });
}
function renderResult() {
  const r = score();
  const mark = k => ({ ok: `<span class="s ok">✓</span>`, part: `<span class="s part">½</span>`, bad: `<span class="s bad">✗${isMcq(k) ? " " + KEYS[Q[k].a] : ""}</span>` }[status(k)] || `<span class="s">–</span>`);
  stage.innerHTML = `<article class="card result"><div class="eyebrow">Your score</div><div class="score">${fmt(r)} / ${N}</div>
    <p class="sub">${Math.round(r / N * 100)}%. Written and one-line answers count as you marked them. Tap any topic to review it.</p>
    <ul class="review">${Q.map((it, k) => `<li><span class="n">${k + 1}</span><button data-k="${k}">${it.t}</button>${mark(k)}</li>`).join("")}</ul>
    <div class="actions"><button class="btn ghost" id="reset">Start again</button></div></article>`;
  stage.querySelectorAll(".review button").forEach(b => b.onclick = () => { state.i = +b.dataset.k; save(); render(); });
  document.getElementById("reset").onclick = () => { state = fresh(); save(); render(); };
}
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || state.i >= N || !isMcq(state.i)) return;
  const k = state.i, j = KEYS.indexOf(e.key.toUpperCase());
  if (j > -1 && !state.done[k]) { state.ans[k] = j; save(); render(); }
  else if (e.key === "Enter" && document.activeElement?.tagName !== "BUTTON") { state.done[k] ? next() : check(); }
});
render();
</script>
