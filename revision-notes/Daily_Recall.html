es volume</b>, so a margin is needed: <span class=\"key\">5 mm</span> ablates &gt;95% and 6 mm 98.6% of csPCa. About <span class=\"key\">90%</span> of outfield csPCa lies within <b>1 cm</b> of the target (the \"penumbra\")."], [15, "p", 47, "Ch 163 · Focal Therapy of Prostate Cancer", "2 · Patient selection", "Imaging finds the lesion, only biopsy grades it, and only systematic biopsy vouches for the rest of the gland — every consensus has kept all three."], [15, "p", 49, "Ch 163 · Focal Therapy of Prostate Cancer", "3 · Ablation patterns and energies", "Every energy fails at the edge of the ablation zone, where temperature or field strength becomes sublethal. Margins, thermometry and adjuvants (cryo-enhancers, stereotactic radiotherapy boost) all aim to make that edge lethal. Hence laser's precise but narrow zone gives the most infield recurrence."], [15, "l", 49, "Ch 163 · Focal Therapy of Prostate Cancer", "4 · Outcomes", "HEAT (HIFU): 7-yr failure-free survival was <span class=\"key\">69%</span> (68% intermediate, 65% high risk)."], [15, "l", 49, "Ch 163 · Focal Therapy of Prostate Cancer", "6 · Follow-up and failure", "Prostate-specific antigen (<b>PSA</b>) falls only <span class=\"key\">50–80%</span>, and the Phoenix/ASTRO definitions are not validated after FT. A rise to nadir + <span class=\"key\">1.0</span> ng/mL at 12 months, or + 1.5 at 24–36 months, predicts csPCa. Digital rectal examination is unreliable."], [15, "a", 50, "Ch 163 · Focal Therapy of Prostate Cancer", "6 · Follow-up and failure", "<ol>\n<li>At <b>3–6 months</b>: mpMRI and targeted biopsy (4–6 cores) of the treated zone.</li>\n<li>At 1–2 and 5 years: mpMRI; if a new lesion appears, then targeted biopsy.</li>\n<li>At 1–2 and 5 years: systematic biopsy of the untreated gland.</li>\n</ol>"], [15, "r", 50, "Ch 163 · Focal Therapy of Prostate Cancer", "8 · Landmark trials", "<b>PCM301</b> (Azzouzi 2017) · 415 low-risk men; padeliporfin VTP vs AS · Progression 28% vs 58%; conversion to radical therapy at 4 yr <span class=\"key\">24% vs 53%</span>; continence preserved · First level 1 evidence for FT — but Gleason 6 only, surrogate end points"], [15, "p", 50, "Ch 163 · Focal Therapy of Prostate Cancer", "8 · Landmark trials", "Open problems: can insignificant satellites be safely left; cost of repeated treatment; adjuvants. Lumpectomy works because the breast gets adjuvant radiotherapy — prostate FT relies on surveillance and retreatment instead."], [15, "l", 51, "Ch 164 · Treatment of Locally Advanced Prostate Cancer", "2 · Staging and risk assessment", "<b>PSMA PET</b> has nodal specificity ≥95% but sensitivity only ~40–66%. In <b>proPSMA</b> its accuracy was <span class=\"key\">92% vs 65%</span>."], [15, "l", 51, "Ch 164 · Treatment of Locally Advanced Prostate Cancer", "3 · Radical prostatectomy in high-risk disease", "In cT3, about half are recurrence-free at 8–10 yr on surgery alone. DSS is <span class=\"key\">~80–90% at 10 yr</span>, though biochemical disease-free survival is often ~50%."], [15, "p", 52, "Ch 164 · Treatment of Locally Advanced Prostate Cancer", "3 · Radical prostatectomy in high-risk disease", "Operative principle: a <b>positive surgical margin</b> carries the highest relative risk of progression (4.37) — higher than extracapsular extension (ECE), seminal vesicle invasion (SVI) or nodes — so remove all prostatic tissue regardless of stage."], [15, "r", 52, "Ch 164 · Treatment of Locally Advanced Prostate Cancer", "3 · Radical prostatectomy in high-risk disease", "Positive margin · — · <span class=\"key\">4.37</span> (highest)"], [15, "l", 52, "Ch 164 · Treatment of Locally Advanced Prostate Cancer", "3 · Radical prostatectomy in high-risk disease", "Dose is <span class=\"key\">≥64 Gy</span>. <b>GETUG-AFU 16</b>: <b>3 months</b> of AD with salvage RT gave 10-yr progression-free survival (PFS) 64% vs 49% (HR 0.54) <span class=\"xref\">(see Ch 162)</span>."], [15, "a", 52, "Ch 164 · Treatment of Locally Advanced Prostate Cancer", "3 · Radical prostatectomy in high-risk disease", "<p><b>pN1 after RP</b></p><ol>\n<li>If favourable (few nodes, Gleason ≤8), then observe with PSA monitoring.</li>\n<li>If adverse (&gt;3 nodes, Gleason &gt;8), then give AD plus RT (best OS).</li>\n<li>Avoid AD alone in a fit man.</li>\n</ol>"], [15, "l", 53, "Ch 164 · Treatment of Locally Advanced Prostate Cancer", "4 · RT + ADT", "<b>Duration</b>: intermediate risk 4–6 mo; high risk (NCCN) <span class=\"key\">18–36 mo</span> with external beam RT (EBRT), 12–36 mo with a brachytherapy boost."], [15, "l", 53, "Ch 164 · Treatment of Locally Advanced Prostate Cancer", "4 · RT + ADT", "<b>SPCG-7</b>: cancer death relative risk (RR) <span class=\"key\">0.44</span>; overall mortality RR 0.68."], [15, "a", 54, "Ch 164 · Treatment of Locally Advanced Prostate Cancer", "5 · ADT alone and other options", "<p><b>Locally advanced / high-risk M0</b></p><ol>\n<li>Stage with PSMA PET, or CT and bone scan.</li>\n<li>If fit and resectable, then RP with ePLND. If pathology is adverse, then early salvage RT (adjuvant if pT3b, Gleason 8–10 or positive margins). If pN1, then observe or give AD plus RT.</li>\n<li>Alternative: dose-escalated RT (with or without brachytherapy boost and pelvic nodes) plus 18–36 mo ADT.</li>\n<li>If very high risk or N1, then add 2 yr abiraterone.</li>\n<li>If unfit for local therapy, then ADT alone.</li>\n</ol>"], [15, "p", 54, "Ch 164 · Treatment of Locally Advanced Prostate Cancer", "5 · ADT alone and other options", "Viva: \"Why not ADT alone for T3 disease?\" — SPCG-7 and PR.3 show RT added to ADT halves cancer death and improves OS; AD alone neither cures nor controls the primary, and it carries its own toxicity."], [15, "l", 56, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "1 · Biochemical recurrence: concept and definitions", "After radical prostatectomy (RP), <span class=\"key\">¼–⅖</span> develop BCR within 10 years. Only ≈half of intermediate/high-risk men with BCR fail clinically."], [15, "l", 56, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "1 · Biochemical recurrence: concept and definitions", "At Memorial Sloan Kettering (MSK), PSA <span class=\"key\">≥0.4 ng/mL followed by a further rise</span> best predicted metastasis and secondary therapy."], [15, "r", 56, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "1 · Biochemical recurrence: concept and definitions", "Post-RP — American Urological Association (AUA) · PSA <span class=\"key\">≥0.2 ng/mL</span> · No gland remains, so any PSA is suspect"], [15, "r", 56, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "1 · Biochemical recurrence: concept and definitions", "After external beam RT (EBRT), with or without androgen deprivation therapy (ADT) · <b>Phoenix</b>: <span class=\"key\">nadir + 2 ng/mL</span> · The remnant gland makes PSA; validated against metastasis and death"], [15, "r", 56, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "1 · Biochemical recurrence: concept and definitions", "After low-dose-rate (LDR) brachytherapy · ≥0.2 may suit better; <span class=\"key\">&lt;0.2 at 4 years ≈ cure</span> · ≥2× the EBRT dose gives a very low nadir, so Phoenix may flatter brachytherapy"], [15, "r", 56, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "1 · Biochemical recurrence: concept and definitions", "<b>Low risk</b> (needs BOTH) · PSA doubling time (PSADT) <span class=\"key\">&gt;1 year</span> AND grade group (GG) &lt;4 · Interval to failure <span class=\"key\">&gt;18 months</span> AND GG &lt;4"], [15, "p", 56, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "1 · Biochemical recurrence: concept and definitions", "<b>PSA bounce</b> after RT: a transient rise of 0.1–0.5 ng/mL at a mean of ≈ <span class=\"key\">9 months</span> (radiation prostatitis, delayed cell death), followed by a fall. It is <b>favourable</b> (better BCR-free survival), so monitor; never salvage on a bounce."], [15, "l", 57, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "2 · Risk prediction and natural history", "<b>CAPRA</b> is the pre-operative score and <b>CAPRA-S</b> the post-operative one <span class=\"tag\">MCQ</span>. Only the MSK nomograms predict 15-year cancer-specific survival."], [15, "l", 57, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "2 · Risk prediction and natural history", "<b>Pound</b>: untreated, a median <span class=\"key\">8 years</span> passes from BCR to metastasis, then <span class=\"key\">5 years</span> to death (P2-144)."], [15, "l", 57, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "3 · Imaging at recurrence", "Bone scan and CT are rarely positive below PSA <span class=\"key\">10 ng/mL</span>."], [15, "l", 57, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "3 · Imaging at recurrence", "<b>Prostate-specific membrane antigen (PSMA) PET</b> is positive in ≈½ at PSA <span class=\"key\">&lt;0.5</span>, and finds disease outside the salvage field in ≈1 in 5. In <b>EMPIRE-1</b>, fluciclovine-guided salvage improved 3-year control."], [15, "p", 57, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "3 · Imaging at recurrence", "Salvage RT works best at the lowest PSA, but imaging detection and certainty of recurrence improve only as PSA rises. Risk features (grade, margins, kinetics) let us act early without overtreating."], [15, "l", 57, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "4 · Salvage after radical prostatectomy", "<b>Salvage RT (SRT)</b> is the only curative option (P2-144). Give <span class=\"key\">≥64–65 Gy</span> to the fossa, using intensity-modulated RT (IMRT)."], [15, "r", 58, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "5 · Salvage after radiotherapy", "Salvage RP (open/robotic) · EAU: life expectancy ≥10 years, PSA <span class=\"key\">&lt;10</span>, biopsy GG ≤3, N0M0 on imaging, initial cT1–T2. Gives pathological staging; poor if seminal vesicles or nodes are involved · Incontinence, bladder neck contracture, rectal injury, near-universal impotence"], [15, "r", 58, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "5 · Salvage after radiotherapy", "Salvage cryotherapy · PSA &lt;10 (ideally &lt;4), PSADT <span class=\"key\">≥16 months</span>; a post-cryo nadir &lt;0.2 predicts success · <b>Urethrorectal fistula</b> (1–3%), erectile dysfunction; incontinence single-digit with <b>urethral warming</b>"], [15, "l", 58, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "6 · Non-curative approach to BCR: observation vs ADT", "AUA: observation (or a trial) after maximal local therapy; ADT only for higher metastatic risk (PSADT <span class=\"key\">&lt;12 months</span> or high grade), preferably intermittent."], [15, "l", 58, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "6 · Non-curative approach to BCR: observation vs ADT", "Low-volume pN+ with undetectable PSA: <span class=\"key\">20–40%</span> are cured by surgery alone."], [15, "l", 58, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "6 · Non-curative approach to BCR: observation vs ADT", "<b>EMBARK</b> entry: PSADT <span class=\"key\">≤9 months</span>, with PSA ≥1 after RP or ≥2 above nadir after RT."], [15, "p", 59, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "7 · Androgen deprivation therapy: biology and agents", "<b>Flare</b> matters with spinal or weight-bearing bone metastases: give an antiandrogen with (or before) the agonist for <span class=\"key\">21–28 days</span>; a simultaneous start is as good as a week's lead-in. For <b>impending cord compression</b> or severe pain, use an <b>antagonist or orchiectomy</b> (or ketoconazole).<br><b>Antiandrogen withdrawal</b>: 15–30% respond (bicalutamide); 0–10% with ARTAs; no OS gain."], [15, "r", 60, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "8 · ADT side effects and their management", "<b>Osteoporosis / fracture</b> · Caused by loss of peripheral oestrogen; fracture risk rises 20–45% · Baseline DEXA and FRAX. For all: calcium 1000–1200 mg and vitamin D 400–1000 IU/day, exercise, stop smoking. Give a drug if T-score is −1 to −2.5 with 10-year hip fracture risk <span class=\"key\">&gt;3%</span> or major fracture <span class=\"key\">&gt;20%</span> (or osteoporosis): denosumab 60 mg SC 6-monthly, zoledronic acid 4–5 mg IV yearly or alendronate 70 mg weekly. Repeat DEXA at 1 year"], [15, "l", 60, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "9 · Metastatic hormone-sensitive prostate cancer (mHSPC)", "<b>SWOG 9346 PSA nadir at 7 months</b>: ≤0.2 gives median OS <span class=\"key\">75</span> months; 0.2–4 gives 44; &gt;4 gives 13."], [15, "r", 61, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "9 · Metastatic hormone-sensitive prostate cancer (mHSPC)", "<b>CHAARTED high volume</b> · <span class=\"key\">≥4 bone metastases with ≥1 outside the axial skeleton</span>, OR any visceral metastasis (no grade criterion) · Docetaxel benefit; RT to primary in low volume"], [15, "r", 61, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "9 · Metastatic hormone-sensitive prostate cancer (mHSPC)", "<b>LATITUDE high risk</b> · <span class=\"key\">≥2 of</span>: Gleason ≥8, ≥3 bone lesions, visceral · Abiraterone entry"], [15, "l", 61, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "9 · Metastatic hormone-sensitive prostate cancer (mHSPC)", "Docetaxel is <span class=\"key\">75 mg/m² 3-weekly × 6</span> (meta-analysis HR 0.77)."], [15, "l", 61, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "9 · Metastatic hormone-sensitive prostate cancer (mHSPC)", "<b>Metastasis-directed therapy (MDT)</b>: oligometastases are <span class=\"key\">≤3 sites</span> on PET, treated by SBRT or salvage node dissection."], [15, "r", 61, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "10 · Landmark trials", "RTOG 0534 (SPPORT) · Bed vs bed plus 4–6 months ADT vs pelvis plus ADT · 5-year freedom from progression 70.9 / 81.3 / <span class=\"key\">87.4%</span> · Add ADT and pelvic nodes (not OS)"], [15, "r", 61, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "10 · Landmark trials", "CHAARTED (ECOG 3805) · ADT with or without docetaxel · OS 57.6 vs 44.0 months (HR 0.61); high volume <span class=\"key\">49.2 vs 32.2</span> months · High volume only"], [15, "l", 63, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "1 · Definition and biology", "A prostate-specific antigen (PSA) doubling time (PSADT) <span class=\"key\">&lt;3 months</span> predicts a rapid course, so aggressive therapy should be considered."], [15, "r", 63, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "2 · Clinical states and progression criteria", "Bone scan · Early new lesions may be <b>flare</b> of healing disease · Rescan at <span class=\"key\">12–16 weeks</span> as new baseline; progression = <span class=\"key\">≥2 new lesions</span> (\"2 + 2\")"], [15, "p", 64, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "2 · Clinical states and progression criteria", "Every marker (PSA, bone scan, PSMA PET) can flare early, so progression is called on confirmed, combined evidence — otherwise effective therapy is abandoned too soon."], [15, "l", 64, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "3 · Germline and somatic testing", "Somatic homologous recombination repair (HRR) mutations occur in <span class=\"key\">20–25%</span> of mCRPC. Mismatch repair deficiency or microsatellite instability (dMMR/MSI-H) occurs in <span class=\"key\">2–5%</span> and should prompt Lynch counselling."], [15, "p", 65, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "5 · mCRPC: androgen-signalling inhibitors", "<b>Prednisone with abiraterone</b>: blocking CYP17 lowers cortisol, so adrenocorticotropic hormone (ACTH) rises and causes mineralocorticoid excess; prednisone suppresses ACTH. Enzalutamide needs no steroid (prednisone may activate a promiscuous AR). All ARPIs cause fatigue, falls and fractures, so take care in men &gt;75."], [15, "r", 65, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "6 · Cytotoxic chemotherapy", "Docetaxel · <span class=\"key\">75 mg/m² 3-weekly</span> with prednisone 5 mg twice daily; first line · Neutropenia, <b>neuropathy</b>, oedema, hyperlacrimation, nail dystrophy"], [15, "r", 65, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "6 · Cytotoxic chemotherapy", "Cabazitaxel · <span class=\"key\">20 mg/m²</span> (25 if low neutropenic risk) 3-weekly with prednisone and G-CSF; after docetaxel · <b>Neutropenia</b> (grade 3–4 82%), <b>diarrhoea</b>"], [15, "r", 65, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "7 · Radiopharmaceuticals", "Emitter · <b>Alpha</b> (path <span class=\"key\">&lt;100 µm</span>, so marrow is spared); calcium mimetic · Beta; needs PSMA PET-positive disease"], [15, "l", 66, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "9 · Immunotherapy", "Checkpoint inhibitors fail in unselected men. <b>Pembrolizumab</b> 200 mg IV 3-weekly is approved tumour-agnostically for <b>MSI-H/dMMR</b> or tumour mutational burden <span class=\"key\">≥10 mutations/megabase</span> after ≥1 line."], [15, "r", 66, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "10 · Neuroendocrine/aggressive-variant CRPC", "Survival · Years · <span class=\"key\">&lt;12 months</span>"], [15, "a", 67, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "12 · Complications and palliative care", "<ol>\n<li>Back pain with or without deficit or sphincter change: suspect compression.</li>\n<li>Give <b>high-dose IV dexamethasone</b> (10 mg IV, then 4–10 mg 6–12-hourly; 16–100 mg/day).</li>\n<li>Arrange <b>urgent whole-spine MRI</b>.</li>\n<li>Give RT with or without decompressive surgery.</li>\n<li>Taper steroids over 2–3 weeks.</li>\n</ol>"], [15, "r", 67, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "13 · Bone-targeted therapy", "Dose · <span class=\"key\">4 mg IV 4-weekly</span>, renal adjustment · <span class=\"key\">120 mg subcutaneous (SC) 4-weekly</span>; no renal adjustment"], [15, "r", 67, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "13 · Bone-targeted therapy", "Toxicity · Flu-like, creatinine rise, hypocalcaemia, osteonecrosis of the jaw (ONJ) · Hypocalcaemia (grade ≥3 5%), ONJ <span class=\"key\">2–4%</span>"], [15, "p", 67, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "13 · Bone-targeted therapy", "<b>ONJ</b> occurs mostly with dental extraction or poor teeth, so check the teeth first. Give calcium 1000 mg and vitamin D 800 IU daily with both agents. Bone agents are strongly recommended with radium-223."], [15, "a", 69, "★ Putting it together", "A · PSA to diagnosis", "<ol>\n<li><b>Raised prostate-specific antigen (PSA) or abnormal digital rectal examination (DRE)</b>: repeat it; exclude infection, instrumentation, 5α-reductase inhibitors (double PSA, ×2); use density, biomarkers (<span class=\"xref\">→ Ch 154</span>).</li>\n<li><b>Multiparametric MRI (mpMRI) before biopsy</b>: PI-RADS (<span class=\"xref\">→ Ch 155</span>).</li>\n<li><b>Biopsy</b> PI-RADS 3–5 targets plus systematic cores; transperineal is safer.</li>\n<li>Assign <b>ISUP Grade Group (GG)</b> (<span class=\"xref\">→ Ch 156</span>) and risk group (<span class=\"xref\">→ Ch 157</span>). If unfavourable intermediate risk or worse, then stage with PSMA PET (or CT and bone scan).</li>\n</ol>"], [15, "p", 69, "★ Putting it together", "B · Localised disease: matching risk to treatment", "SPCG-4, PIVOT and ProtecT show that radical treatment helps only younger men with ≥intermediate-risk disease and long life expectancy. ProtecT: RP = RT for 15-year cancer survival."], [15, "a", 70, "★ Putting it together", "D · Advanced disease", "<ol>\n<li><b>Biochemical recurrence (BCR)</b> (Ch 165): PSMA PET. After RP: salvage RT. After RT: local salvage if biopsy-proven. If high risk (PSA doubling time ≤9 months), then give ADT and enzalutamide (EMBARK).</li>\n<li><b>Metastatic hormone-sensitive disease (mHSPC)</b>: never ADT alone; add an androgen-receptor pathway inhibitor (ARPI), or a docetaxel triplet if fit and high volume. If low volume, add prostate RT (STAMPEDE arm H). Offer genetic testing to all.</li>\n<li><b>Non-metastatic castration-resistant disease (nmCRPC)</b> with PSA doubling time ≤10 months: ARPI (SPARTAN, PROSPER, ARAMIS).</li>\n<li><b>Metastatic castration-resistant disease (mCRPC)</b> (Ch 166): switch mechanism. Docetaxel → cabazitaxel (CARD); ¹⁷⁷Lu-PSMA (VISION); radium-223 for symptomatic bone-only disease (ALSYMPCA); a PARP inhibitor if BRCA/HRR mutation (PROfound); pembrolizumab if MSI-H. Always protect bone.</li>\n</ol>"]]};
const {names,urls,days,items}=DATA;
const KIND={p:'Key point',a:'Algorithm',m:'MCQ',l:'',r:'Table'};
const KCLS={p:'k-p',a:'k-a',m:'k-m',l:'k-l',r:'k-r'};
const PAPERS={P1:'t0',P2:'t1',P3:'t2',P4:'t3'};
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
// index items by book
const byBook=names.map(()=>[]);items.forEach((it,i)=>byBook[it[0]].push(i));
function inRange(b,a,z){return byBook[b].filter(i=>items[i][2]>=a&&items[i][2]<=z)}
function fmtDate(iso){const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}
function localISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayIndex(){const t=localISO(new Date());let i=days.findIndex(d=>d.date===t);if(i<0)i=t<days[0].date?0:days.length-1;return i}
let cur=todayIndex();
function prevStudy(k,back){let j=k-back;while(j>=0&&days[j].buf)j--;return j>=0?j:null}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function renderItems(ids,opts={}){
  let html='',lastB=-1,lastCh='',lastH2='';
  for(const i of ids){const [b,t,p,ch,h2,h]=items[i];
    if(opts.showBook&&b!==lastB){html+=`<div class="src">${esc(names[b])}</div>`;lastB=b;lastCh='';lastH2=''}
    if(ch!==lastCh){html+=(html.endsWith('</li>')?'</ul>':'')+`<div class="ch">${esc(ch)}</div>`;lastCh=ch;lastH2=''}
    else if(html.endsWith('</li>')) html+='</ul>';
    if(h2&&h2!==lastH2){html+=`<div class="h2">${esc(h2)}</div>`;lastH2=h2}
    html+=`<ul class="core"><li class="${KCLS[t]}">${KIND[t]?`<span class="kind">${KIND[t]}</span>`:''}${h}<span class="pg">p.${p}</span></li>`;
  }
  if(html.endsWith('</li>'))html+='</ul>';
  return html.replace(/<\/ul><ul class="core">/g,'');
}
function rangeLabel(r){return `${esc(names[r[0]])} <span class="bk">p.${r[1]}–${r[2]}</span>`}
function bookLinks(bb){const seen=[...new Set(bb.map(r=>r[0]))];return 'iPad PDF: '+seen.map(b=>`<span class="bk">${esc(urls[b])}</span>`).join(' · ')}
function check(key,label){const v=store.get('dr-'+key,false);return `<label class="done"><input type="checkbox" data-k="${key}" ${v?'checked':''}> ${label}</label>`}
function trackBar(){return '<div class="track" aria-hidden="true">'+days.map((d,i)=>`<i class="${d.buf?'buf':''} ${i===cur?'now':(store.get('dr-'+d.n+'-all',false)?'done':'')}"></i>`).join('')+'</div>'}
function renderToday(){
  const d=days[cur];const el=document.getElementById('today');
  const phase=d.buf?'Buffer day':(d.n<=13?'First read':'Second read');
  let h=`<div class="eyebrow">Day ${d.n} of 27 · ${phase}</div><h1>${fmtDate(d.date)}</h1>${trackBar()}`;
  if(d.buf){
    const from=d.n===14?0:14, to=d.n-1;
    const ranges=[];for(let j=from;j<to;j++)if(!days[j].buf)ranges.push(...days[j].bb);
    const ids=[];ranges.forEach(r=>ids.push(...inRange(r[0],r[1],r[2])));
    const uniq=[...new Set(ids)].sort((a,b)=>a-b);
    h+=`<div class="block buf"><h2>Pause</h2><p>Morning: catch up anything pending. If you are on track, read the Rapid Revision Sheets of Papers 1–4.</p><p>Afternoon: one calm pass through the core of every book page read ${d.n===14?'in Days 1–13':'in Days 15–26'} — ${uniq.length} items below.</p>${check(d.n+'-all','Day complete')}</div>`;
    h+=`<div class="block"><div class="recall-head"><h2>Core pass</h2><button class="toggle cz" type="button" aria-pressed="false">Hide numbers</button></div><div class="rl">${renderItems(uniq,{showBook:true})}</div></div>`;
    el.innerHTML=h;wire(el);return;
  }
  const pp=d.pp.map(r=>`<span class="r"><span class="tag ${PAPERS[r[0]]}">${r[0]}</span>p.${r[1]}–${r[2]}</span>`).join('');
  h+=`<div class="block"><h2>Papers <span class="when">7–1 and 3–4</span></h2><div class="ranges">${pp}</div><p class="meta">${d.np} pages · by 1 pm reach ${d.cut}</p>${check(d.n+'-p','Papers done')}</div>`;
  h+=`<div class="block"><h2>Books <span class="when">4–7:30</span></h2><div class="ranges">${d.bb.map(r=>`<span class="r">${rangeLabel(r)}</span>`).join('')}</div><p class="meta">${d.n===1?'Old edition p.1–39 (= iPad p.1–31, Ch 24–59) · ':d.nb+' pages · '}${bookLinks(d.bb)}</p>${check(d.n+'-b','Books done')}</div>`;
  const y=prevStudy(cur,1), w=prevStudy(cur,7);
  let rec='';let n=0;
  if(y!==null){const ids=[];days[y].bb.forEach(r=>ids.push(...inRange(r[0],r[1],r[2])));n+=ids.length;
    rec+=`<div class="src">Yesterday · ${days[y].bb.map(rangeLabel).join(' + ')}</div>${renderItems(ids)}`}
  if(w!==null&&w!==y){const ids=[];days[w].bb.forEach(r=>ids.push(...inRange(r[0],r[1],r[2])));n+=ids.length;
    rec+=`<div class="src">One week back · ${days[w].bb.map(rangeLabel).join(' + ')}</div>${renderItems(ids)}`}
  h+=`<div class="block"><div class="recall-head"><h2>Recall <span class="when">7:30–8</span></h2><button class="toggle cz" type="button" aria-pressed="false">Hide numbers</button></div>`;
  h+= n?`<p class="meta">${n} core items. Say each highlighted number before you reveal it.</p><div class="rl">${rec}</div>`:`<p class="empty">Nothing to recall yet. Tomorrow's recall starts with today's pages.</p>`;
  h+=`${check(d.n+'-r','Recall done')}</div>`;
  el.innerHTML=h;wire(el);
}
function wire(root){
  root.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.onchange=()=>{store.set('dr-'+cb.dataset.k,cb.checked);const d=days[cur];
    if(!d.buf){const all=['p','b','r'].every(x=>store.get('dr-'+d.n+'-'+x,false));store.set('dr-'+d.n+'-all',all)}
    const t=root.querySelector('.track');if(t)t.outerHTML=trackBar()});
  root.querySelectorAll('.cz').forEach(b=>b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);b.textContent=on?'Show numbers':'Hide numbers';const rl=b.closest('.block').querySelector('.rl');if(rl)rl.classList.toggle('cloze',on)});
  root.addEventListener('click',e=>{const k=e.target.closest('.cloze .key');if(k)k.classList.toggle('shown')});
}
document.getElementById('prev').onclick=()=>{if(cur>0){cur--;renderToday();scrollTo(0,0)}};
document.getElementById('next').onclick=()=>{if(cur<days.length-1){cur++;renderToday();scrollTo(0,0)}};
document.getElementById('todayBtn').onclick=()=>{cur=todayIndex();renderToday()};
function updNav(){document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===days.length-1}
const _rt=renderToday;renderToday=function(){_rt();updNav()};
// views
const vT=document.getElementById('vToday'),vC=document.getElementById('vCore');
function view(c){vT.setAttribute('aria-pressed',!c);vC.setAttribute('aria-pressed',c);document.getElementById('today').classList.toggle('hide',c);document.getElementById('core').classList.toggle('hide',!c);document.getElementById('daynav').classList.toggle('hide',c);if(c&&!coreReady)initCore();store.set('dr-view',c)}
vT.onclick=()=>view(false);vC.onclick=()=>view(true);
// core view
let coreReady=false,book=store.get('dr-book',0),limit=150;
function initCore(){coreReady=true;
  const chips=document.getElementById('bookchips');chips.innerHTML=names.map((n,i)=>`<button class="chip" type="button" data-b="${i}" aria-pressed="${i===book}">${esc(n)}</button>`).join('');
  chips.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;book=+b.dataset.b;store.set('dr-book',book);chips.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',+c.dataset.b===book));limit=150;drawCore()};
  let t;document.getElementById('q').addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>{limit=150;drawCore()},220)});
  const cz=document.getElementById('clozeCore');cz.onclick=()=>{const on=cz.getAttribute('aria-pressed')!=='true';cz.setAttribute('aria-pressed',on);cz.textContent=on?'Show numbers':'Hide numbers';document.getElementById('corelist').classList.toggle('cloze',on)};
  document.getElementById('corelist').addEventListener('click',e=>{const k=e.target.closest('.cloze .key');if(k)k.classList.toggle('shown');if(e.target.id==='more'){limit+=300;drawCore()}});
  drawCore()}
function drawCore(){const q=document.getElementById('q').value.trim().toLowerCase();
  let ids;if(q.length>=2){ids=items.map((_,i)=>i).filter(i=>{const it=items[i];return (it[5]+' '+it[3]+' '+it[4]).replace(/<[^>]+>/g,'').toLowerCase().includes(q)})}else ids=byBook[book];
  document.getElementById('ccount').textContent=(q.length>=2?`${ids.length} matches in all books`:`${ids.length} items in ${names[book]}`);
  let html=renderItems(ids.slice(0,limit),{showBook:q.length>=2});
  if(q.length>=2){const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![^<]*>)','gi');html=html.replace(re,'<mark class="hit">$1</mark>')}
  if(ids.length>limit)html+=`<button class="more" id="more" type="button">Show more (${ids.length-limit} left)</button>`;
  document.getElementById('corelist').innerHTML=html}
renderToday();
if(store.get('dr-view',false))view(true);
</script>
