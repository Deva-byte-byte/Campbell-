y", "<b>Recurrence after shunt</b> may be shunt thrombosis: <span class=\"key\">aspirin 325 mg + heparin 5000 U subcutaneously</span> pre-op → aspirin 81 mg daily × 2 weeks."], [7, "l", 39, "Ch 73 · Priapism", "2 · Aetiology", "Lifetime risk <span class=\"key\">29–42%</span>; 23% of adult and <span class=\"key\">63% of paediatric</span> ischaemic priapism. Onset ~15 y; stuttering commoner than major episodes. Precipitants: arousal, sleep, fever, cold, dehydration. Sickle trait: low risk."], [7, "a", 40, "Ch 73 · Priapism", "4 · Evaluation", "<p>History + examination + gas → ischaemic → acute ischaemic algorithm | indeterminate → penile/perineal PDUS | non-ischaemic → expectant algorithm</p>"], [7, "a", 40, "Ch 73 · Priapism", "5 · Acute ischaemic priapism (AUA/SMSNA)", "<p>&lt;36 h: aspiration ± irrigation + intracavernosal phenylephrine (BP and cardiac monitoring) → distal shunt ± tunnelling → tunnelling if not done → proximal shunt / penoscrotal decompression → prosthesis if refractory</p>\n<p>&gt;36 h: counsel high ED risk + analgesia/follow-up, OR early penile prosthesis</p>"], [7, "l", 41, "Ch 73 · Priapism", "5 · Acute ischaemic priapism (AUA/SMSNA)", "Dilute to <span class=\"key\">100–500 µg/mL</span>; <b>1-mL aliquots every 3–5 min</b> for up to <span class=\"key\">1 h</span> before failure; <span class=\"dag\">†</span>maximum ≈1 mg in 1 h (EAU)."], [7, "l", 41, "Ch 73 · Priapism", "5 · Acute ischaemic priapism (AUA/SMSNA)", "For priapism <span class=\"key\">&gt;36 h</span> or refractory to shunt ± tunnelling; oedematous corpora dilate easily, delayed surgery meets dense fibrosis."], [7, "a", 41, "Ch 73 · Priapism", "6 · Non-ischaemic priapism", "<p>Observe, reassess at 4 weeks → persists → PDUS (fistula site, size) → counsel → selective internal pudendal/cavernosal artery embolisation → recurrence → repeat embolisation with non-resorbable agent → surgical ligation only after repeated failure</p>"], [7, "m", 42, "Ch 73 · Priapism", "9 · MCQ one-liners", "First case report of priapism: 1824."], [7, "l", 43, "Ch 74 · Disorders of Male Orgasm and Ejaculation", "2 · Physiology of ejaculation", "Lumbar interneurons at <span class=\"key\">L3–L5</span> = <b>spinal ejaculation generator</b>, coordinating thoracolumbar and lumbosacral nuclei under genital and supraspinal input."], [7, "p", 43, "Ch 74 · Disorders of Male Orgasm and Ejaculation", "2 · Physiology of ejaculation", "Serotonin brakes, dopamine accelerates: PE drugs raise synaptic 5-HT; DE drugs are dopaminergic, noradrenergic or anti-serotonergic."], [7, "l", 43, "Ch 74 · Disorders of Male Orgasm and Ejaculation", "3 · Premature ejaculation — definition and classification", "ISSM: within <span class=\"key\">about 1 min</span> (lifelong) or bothersome reduction often to <span class=\"key\">≤ about 3 min</span> (acquired). First <b>evidence-based</b> definition; vaginal intercourse only; \"about 1 min\" allows ~90 s. <b>Latency alone never suffices</b>."], [7, "l", 44, "Ch 74 · Disorders of Male Orgasm and Ejaculation", "3 · Premature ejaculation — definition and classification", "AUA 2-min line trades specificity for sensitivity. <span class=\"tag\">MCQ</span> ICD-10: only older definition with a number (≤15 s); Masters and Johnson: partner satisfied in &lt;50% of episodes."], [7, "l", 44, "Ch 74 · Disorders of Male Orgasm and Ejaculation", "3 · Premature ejaculation — definition and classification", "Community stopwatch IELT: positively skewed, median <span class=\"key\">5.4 min</span>; ≤1 min statistically abnormal."], [7, "a", 44, "Ch 74 · Disorders of Male Orgasm and Ejaculation", "5 · Premature ejaculation — treatment", "<p>PE confirmed → secondary to ED/other dysfunction? <b>Yes</b> → treat primary cause → <b>No</b>: lifelong → SSRI ± behavioural therapy (patient preference); acquired → treat cause ± behavioural/SSRI, attempt withdrawal after 6–8 weeks; variable/subjective → reassurance, education, psychotherapy</p>"], [7, "p", 45, "Ch 74 · Disorders of Male Orgasm and Ejaculation", "5 · Premature ejaculation — treatment", "The real limiter in PE is adherence, not efficacy — most patients stop SSRIs and topicals (cost, lost spontaneity, \"antidepressant\" stigma)."], [7, "a", 46, "Ch 74 · Disorders of Male Orgasm and Ejaculation", "6 · Delayed ejaculation, anejaculation and anorgasmia", "<p>Orgasm? <b>Never/sometimes</b> → inhibited orgasm (psychosexual therapy) or ageing (reassure, change technique) → <b>Always</b> → ejaculate? No → <b>sperm in post-orgasm urine?</b> Yes = RE; No = aspermia → failure of emission (neurogenic, drug, metabolic) or ejaculatory duct obstruction (EDO)</p>"], [7, "l", 46, "Ch 74 · Disorders of Male Orgasm and Ejaculation", "7 · Retrograde ejaculation", "Diagnosis: <span class=\"key\">&gt;5–10 sperm/high-power field</span> in post-masturbation urine. TUIP less if one incision not extended to verumontanum; Aquablation superior to TURP for ejaculation in RCTs."], [7, "a", 47, "Ch 74 · Disorders of Male Orgasm and Ejaculation", "8 · Sperm retrieval in SCI", "<p><b>Penile vibratory stimulation (PVS)</b> — first line, success up to ~70% (needs intact T12–S1-level reflex) → <b>electroejaculation (EEJ)</b> — rectal probe stimulating hypogastric sympathetic efferents, effective and safe → prostate massage → surgical retrieval (TESE/TESA/MESA/PESA; testicular sperm extraction succeeds in most)</p>"], [7, "l", 48, "Ch 75 · Surgery for Erectile Dysfunction", "1 · Place of surgery and devices", "<b>Material</b>: Coloplast polyurethane (Bioflex) — cautery <span class=\"key\">&lt;35 W</span>; Boston/Rigicon silicone–fabric–silicone tolerates cautery. Narrow cylinders for small/scarred corpora; length-expanding cylinders correct curvature poorly."], [7, "a", 48, "Ch 75 · Surgery for Erectile Dysfunction", "4 · Operative technique (three-piece)", "<p>Catheter → expose tunica → two 2-0 PDS stay sutures per corpus → longitudinal corporotomy → dilate proximal then distal (Metzenbaum, Hegar/Brooks 7→13 mm) → goalpost test → measure (Furlow) → cylinders → test inflation 1 → close corporotomies → test inflation 2 → reservoir → pump → connect → test inflation 3 → irrigate, close</p>"], [7, "p", 49, "Ch 75 · Surgery for Erectile Dysfunction", "5 · Intra-operative problems", "No catheter after distal urethral perforation: the defect is not closed and the urinary stream draws fluid into the urethra (Bernoulli), so urine does not enter it. Wait 5–6 months for scar to obliterate the false tract. Most intra-operative errors are <b>prevented by instrument direction</b> and <b>detected by symmetry</b> (goalpost test, midline Foley)."], [7, "p", 49, "Ch 75 · Surgery for Erectile Dysfunction", "5 · Intra-operative problems", "After robotic prostatectomy the peritoneum is not replaced; bowel fixes near the internal ring, so a blind inguinal Retzius reservoir can compress bowel — choose an ectopic site or place under vision."], [7, "l", 51, "Ch 75 · Surgery for Erectile Dysfunction", "8 · Post-operative care", "Activation at <span class=\"key\">4–6 weeks</span>, partner present; daily cycling. Partners slightly less satisfied; dissatisfaction = length, rigidity."], [7, "p", 52, "Ch 76 · Diagnosis and Management of Peyronie Disease", "1 · Definition", "Myths corrected: PD is <b>not rare</b> (3–20%; higher in diabetes, ED); <b>spontaneous resolution is rare</b> — up to half worsen untreated (\"wait 6–12 months\" is a myth); teens to 70s, all races; flaccid trauma can trigger it; <b>calcification is not a marker of chronic disease</b>."], [7, "l", 52, "Ch 76 · Diagnosis and Management of Peyronie Disease", "2 · Anatomy and pathophysiology", "Longitudinal layer thinnest at 3 and 9 o'clock, <b>absent 5–7 o'clock</b>; <span class=\"key\">60–70% of plaques are dorsal</span> with septal involvement."], [7, "r", 52, "Ch 76 · Diagnosis and Management of Peyronie Disease", "3 · Clinical features and phases", "Surgery · Not appropriate · When <span class=\"key\">≥12 months from onset and stable ≥6 months</span>"], [7, "l", 53, "Ch 76 · Diagnosis and Management of Peyronie Disease", "5 · Non-surgical management", "<b>Protocol (IMPRESS)</b>: 2 injections of <span class=\"key\">0.58 mg</span> 24–72 h apart → <b>modelling</b> 24–72 h after the second; up to <span class=\"key\">4 cycles, 6 weeks apart</span> (max 8 injections). Modelling essential."], [7, "l", 53, "Ch 76 · Diagnosis and Management of Peyronie Disease", "5 · Non-surgical management", "<b>AUA criteria</b>: stable disease, curvature <span class=\"key\">&gt;30° and &lt;90°</span>, intact erections (± medication). IMPRESS excluded ventral plaques, extensive calcification, disease &lt;12 months."], [7, "a", 54, "Ch 76 · Diagnosis and Management of Peyronie Disease", "6 · Surgery", "<p>Erection adequate (± PDE5I)? <b>No</b> → inflatable prosthesis + modelling → persistent curve → incision ± graft (graft if defect &gt;2 cm)</p>\n<p><b>Yes</b> → PDDUS → simple curve &lt;60–70°, no hourglass/hinge, acceptable length loss → <b>plication</b> (length loss unacceptable → grafting)</p>\n<p><b>Yes</b> → complex/multiplanar &gt;60–70°, severe indentation/hourglass, hinge, short penis (&lt;9 cm stretched) → <b>plaque incision/partial excision + graft</b> if ED risk accepted (else prosthesis)</p>"], [7, "a", 56, "★ Putting it together: andrology decisions", "A · Infertile man: work-up", "<p><b>1. History/exam</b> (both partners): toxins, testosterone use, mumps, cryptorchidism; testis volume, vasa, varicocele (<span class=\"xref\">→ Ch 69</span>).</p>\n<p><b>2. Two semen analyses</b> (abstinence 2–7 days). Low volume + acid pH → EDO or CBAVD; post-ejaculate urine (retrograde).</p>\n<p><b>3. Hormones</b> (low count/sexual dysfunction): FSH, testosterone (low → LH, prolactin).</p>\n<p><b>4. Genetics</b> (azoospermia/severe oligo): karyotype, Y microdeletions; CFTR in CBAVD (+ partner).</p>"], [7, "p", 56, "★ Putting it together: andrology decisions", "B · Azoospermia: obstructive or not", "<span class=\"dag\">†</span> Reversal if younger partner, &gt;1 child wanted; ICSI if older partner/female factor. Vas fluid copious (even clear, sperm-free) or sperm/parts → VV; toothpaste or none → VE (<span class=\"xref\">→ Ch 70</span>)."], [7, "a", 56, "★ Putting it together: andrology decisions", "C · Erectile dysfunction ladder", "<p><b>1. Assess:</b> IIEF-5/SHIM, exam, HbA1c, lipids, morning testosterone. ED = cardiovascular sentinel; stratify cardiac risk (<span class=\"xref\">→ Ch 72</span>).</p>\n<p><b>2. Modify</b> risk factors, drugs; treat hypogonadism (rescues PDE5I failures).</p>\n<p><b>3. Shared decision:</b> PDE5I (never with nitrates; re-counsel before failure), vacuum, intraurethral alprostadil, ICI (alprostadil/trimix).</p>\n<p><b>4. Penile prosthesis</b> (inflatable three-piece) if others fail; highest satisfaction. Infected: remove all ± salvage (<span class=\"xref\">→ Ch 75</span>).</p>\n<p><b>Young, focal post-traumatic arterial occlusion</b> → revascularisation.</p>"], [7, "p", 57, "★ Putting it together: andrology decisions", "D · Priapism: ischaemic vs non-ischaemic", "Sickle cell: treat as above (no waiting for transfusion), no chilled irrigation, involve haematology. Stuttering: daily PDE5I, nightly pseudoephedrine, or post-pubertal hormonal suppression (<span class=\"xref\">→ Ch 73</span>)."], [7, "a", 57, "★ Putting it together: andrology decisions", "E · Peyronie disease", "<p><b>Active</b>: analgesia, traction. CCH: stable dorsal/lateral 30–90°, intact erections; else verapamil, interferon α-2b.</p>\n<p><b>Surgery</b>: ≥12 months from onset, stable ≥6 months; document SPL, erections (<span class=\"xref\">→ Ch 76</span>).</p>\n<p><b>Good erections</b>: simple &lt;60–70°, no hourglass/hinge, adequate length → plication; complex, hourglass/hinge, short → incision/partial excision + graft (more ED). <b>Poor erections</b> despite PDE5I → inflatable prosthesis ± modelling.</p>"], [7, "p", 57, "★ Putting it together: andrology decisions", "F · Premature ejaculation (PE)", "Diagnosis: latency (lifelong ≈1 min or less) + inability to delay + distress, never latency alone. Treat ED first. Options: stop–start/squeeze, lidocaine–prilocaine spray, on-demand dapoxetine (only licensed oral outside US), daily SSRI (paroxetine best), tramadol (off-label, addiction) (<span class=\"xref\">→ Ch 74</span>)."], [8, "p", 2, "Ch 78 · Surgical, Radiographic and Endoscopic Anatomy of the Retroperitoneum", "1 · Definition, boundaries and organs", "Secondarily retroperitoneal organs lie <b>in front of</b> the kidney, so colon, duodenum and pancreas are always in the surgeon's path to the kidney."], [8, "l", 2, "Ch 78 · Surgical, Radiographic and Endoscopic Anatomy of the Retroperitoneum", "2 · Posterior abdominal wall and surface landmarks", "Upper pole: left 11th rib, right 12th rib (right lower). Hilum <span class=\"key\">L1</span>; lower pole L3–L4."], [8, "l", 2, "Ch 78 · Surgical, Radiographic and Endoscopic Anatomy of the Retroperitoneum", "3 · Retroperitoneal fasciae and spaces", "Toldt (anterior) lamina thinner; Zuckerkandl (posterior) thicker, seen more on imaging. <span class=\"tag\">MCQ</span> Gerota described only the anterior, yet his name covers both."], [8, "p", 4, "Ch 78 · Surgical, Radiographic and Endoscopic Anatomy of the Retroperitoneum", "6 · Lymphatics", "Testis is embryologically retroperitoneal — drains to where it began. Crossover one-way (right → left), so right templates include interaortocaval and some para-aortic tissue. <span class=\"xref\">→ Ch 80, 81</span>"], [8, "l", 4, "Ch 78 · Surgical, Radiographic and Endoscopic Anatomy of the Retroperitoneum", "7 · Nerves", "<b>Parasympathetic</b>: craniosacral (III, VII, IX, X, S2–S4); ganglia in organ wall. <b>Sympathetic</b>: thoracolumbar <span class=\"key\">T1–L2</span>."], [8, "l", 4, "Ch 78 · Surgical, Radiographic and Endoscopic Anatomy of the Retroperitoneum", "7 · Nerves", "<b>Ejaculation</b>: <span class=\"dag\">†</span> postganglionic fibres from <span class=\"key\">T12–L3</span> ganglia run anterior to aorta/across IVC, converge in hypogastric plexus below IMA → <b>emission</b> and <b>bladder neck closure</b>. Extensive dissection → anejaculation or retrograde ejaculation; erection (parasympathetic) spared. <span class=\"xref\">→ Ch 81</span>"], [8, "l", 6, "Ch 79 · Neoplasms of the Testis", "1 · Epidemiology and risk factors", "&gt;95% are <b>germ cell tumours (GCTs)</b>: seminoma vs non-seminomatous GCT (NSGCT); 95% testicular, 5% extragonadal. Commonest solid malignancy in men <span class=\"key\">20–40 y</span>; peak 25–35."], [8, "l", 6, "Ch 79 · Neoplasms of the Testis", "1 · Epidemiology and risk factors", "Cisplatin: metastatic cure 5–10% → <span class=\"key\">80–90%</span>; aim now <b>minimum toxicity without losing curability</b>. Deaths from platinum resistance and failure to clear residual disease."], [8, "l", 6, "Ch 79 · Neoplasms of the Testis", "1 · Epidemiology and risk factors", "Bilateral <span class=\"key\">2%</span>, mostly metachronous; histology discordant 30–50%. Highest in Scandinavia; rising."], [8, "l", 6, "Ch 79 · Neoplasms of the Testis", "1 · Epidemiology and risk factors", "<b>GCNIS</b>: arrested fetal gonocyte, formed <b>before birth</b>; beside invasive GCT in 80–90%; invasion <span class=\"key\">50% at 5 y</span>, 70% at 7 y. Contralateral GCNIS 5–9%, ≈36% with atrophy/UDT/age &lt;40."], [8, "p", 6, "Ch 79 · Neoplasms of the Testis", "1 · Epidemiology and risk factors", "GCT is a disease of the arrested gonocyte: UDT, family history and atrophy mark an abnormal developmental field, so orchidopexy reduces but never abolishes risk."], [8, "p", 7, "Ch 79 · Neoplasms of the Testis", "2 · Pathology and classification", "Management follows the most chemoresistant element: EC drives occult metastasis, choriocarcinoma haemorrhage, teratoma surgery."], [8, "l", 7, "Ch 79 · Neoplasms of the Testis", "4 · Diagnosis and initial management", "Half-life AFP <span class=\"key\">5–7 days</span>, hCG <span class=\"key\">24–36 h</span>, LDH 24 h."], [8, "l", 8, "Ch 79 · Neoplasms of the Testis", "5 · Staging", "CT abdomen–pelvis for all; false negative in <span class=\"key\">25–35% of CS I NSGCT</span> → landing-zone nodes 5–9 mm suspicious; equivocal + normal markers → repeat CT 6–8 weeks."], [8, "p", 9, "Ch 79 · Neoplasms of the Testis", "5 · Staging", "IGCCCG uses markers at start of chemotherapy, not pre-orchidectomy, and is invalid at relapse. Seminoma risk depends on NPVM alone; mediastinal NSGCT is always poor risk."], [8, "l", 9, "Ch 79 · Neoplasms of the Testis", "6 · Treatment principles", "Orchidectomy, radiotherapy <span class=\"key\">≥20 Gy</span> (&lt;20 Gy → recurrence; spares Leydig cells, yet up to 40% need testosterone), or observation."], [8, "a", 9, "Ch 79 · Neoplasms of the Testis", "7 · NSGCT management", "<p>CS I NSGCT → low risk (no LVI, no EC predominance) → surveillance → high risk → surveillance or BEP×1 or nerve-sparing RPLND (expert), by preference and toxicity</p>"], [8, "p", 9, "Ch 79 · Neoplasms of the Testis", "7 · NSGCT management", "Surveillance maximises quality-adjusted survival when relapse risk &lt;≈1/3. All options cure ≈100%; they differ in overtreatment vs difficulty of salvage."], [8, "l", 10, "Ch 79 · Neoplasms of the Testis", "7 · NSGCT management", "Normal markers + residual mass <span class=\"key\">&gt;1 cm</span> → <b>PC-RPLND</b>, full bilateral template. Necrosis ≈40%, teratoma ≈45%, viable ≈15%."], [8, "l", 10, "Ch 79 · Neoplasms of the Testis", "8 · Seminoma management", "CS I ≈80%. Risk factors tumour <span class=\"key\">&gt;4 cm</span>, rete testis invasion (12/16/32%) — not validated, so surveillance preferred for all."], [8, "a", 11, "Ch 79 · Neoplasms of the Testis", "8 · Seminoma management", "<p>Residual seminoma mass → &lt;3 cm → observe → &gt;3 cm → FDG-PET ≥6 weeks after chemotherapy (earlier = false positives) → negative → observe → positive → template PC-RPLND (or repeat PET/observe); mass-only excision → 33% local relapse</p>"], [8, "p", 11, "Ch 79 · Neoplasms of the Testis", "10 · Treatment sequelae and follow-up", "Because cure is expected, late cardiovascular disease and second cancers — rising with each added modality — decide between equally curative options."], [8, "l", 13, "Ch 80 · Surgery of Testicular Tumours", "1 · Evaluation of the testis mass", "History → examination (supraclavicular, breasts, abdomen, scrotum) → scrotal US (key role: <b>contralateral testis</b>; bilateral synchronous ≈ <span class=\"key\">1%</span>) → markers (AFP, β-hCG, LDH: diagnosis, stage, post-orchidectomy baseline)."], [8, "a", 13, "Ch 80 · Surgery of Testicular Tumours", "2 · Radical inguinal orchidectomy", "<p>3–5 cm incision over canal → open external oblique → <b>preserve ilioinguinal nerve</b> → mobilise cord at pubic tubercle, <b>Penrose early clamp</b> → deliver testis, divide gubernaculum → dissect cord to internal ring.</p>"], [8, "l", 13, "Ch 80 · Surgery of Testicular Tumours", "2 · Radical inguinal orchidectomy", "<b>High ligation</b>: vas and gonadal vessels ligated <b>separately</b>, <b>non-absorbable</b> suture, <span class=\"key\">1–2 cm</span> tail — marks stump for excision at RPLND (vas need not be removed)."], [8, "p", 13, "Ch 80 · Surgery of Testicular Tumours", "2 · Radical inguinal orchidectomy", "<b><span class=\"dag\">†</span> Scrotal violation</b>: inguinal exploration, high cord ligation, excise scrotal scar; routine hemiscrotectomy no longer needed; chemotherapy-era outcomes not compromised."], [8, "l", 13, "Ch 80 · Surgery of Testicular Tumours", "2 · Radical inguinal orchidectomy", "<b>All three</b>: polar, <span class=\"key\">≤2 cm</span>, contralateral testis compromised/absent. <b>Never elective with a normal contralateral testis.</b>"], [8, "l", 13, "Ch 80 · Surgery of Testicular Tumours", "2 · Radical inguinal orchidectomy", "Masses <span class=\"key\">&lt;5 mm</span>, negative markers → low malignancy; partial orchidectomy or selective surveillance."], [8, "l", 13, "Ch 80 · Surgery of Testicular Tumours", "2 · Radical inguinal orchidectomy", "Cold ischaemia omissible if <span class=\"key\">&lt;30 min</span>. Tunica incision vertical for ventral midline, horizontal for medial/lateral lesions (spares segmental arteries); three-point fixation."], [8, "l", 13, "Ch 80 · Surgery of Testicular Tumours", "2 · Radical inguinal orchidectomy", "GCNIS: completion orchidectomy vs <span class=\"key\">18–20 Gy</span> vs observation (local recurrence ≈ 7.5%). <b>Local recurrence → completion orchidectomy</b>, always."], [8, "r", 14, "Ch 80 · Surgery of Testicular Tumours", "3 · RPLND — terminology and indications", "PC-RPLND · After induction; residual <span class=\"key\">&gt;1 cm</span>, normal markers"], [8, "r", 14, "Ch 80 · Surgery of Testicular Tumours", "3 · RPLND — terminology and indications", "Late relapse · <span class=\"key\">&gt;24 months</span> after complete response"], [8, "l", 14, "Ch 80 · Surgery of Testicular Tumours", "3 · RPLND — terminology and indications", "CT within <span class=\"key\">6 weeks</span>, markers within <span class=\"key\">7–10 days</span>; vascular variants; no bowel prep."], [8, "l", 14, "Ch 80 · Surgery of Testicular Tumours", "4 · Templates", "Bilateral template limits: renal vessels, ureters, common iliac arteries. No randomised trial of template extent. Modified PC template lesion <span class=\"key\">≤5 cm</span>."], [8, "p", 14, "Ch 80 · Surgery of Testicular Tumours", "5 · Open RPLND technique", "Identify fibres <b>prospectively, before dividing anything</b>; loop them, pass packet beneath. Avoid traction (neuropraxia → transient anejaculation)."], [8, "l", 15, "Ch 80 · Surgery of Testicular Tumours", "5 · Open RPLND technique", "Optionally close mesenteric root (volvulus). No routine drain (if used: remove at <span class=\"key\">&lt;100 mL/24 h</span> on diet); no NG tube; low-fat diet days 1–2; mobilise day 1; home day 3–5."], [8, "l", 15, "Ch 80 · Surgery of Testicular Tumours", "6 · Auxiliary procedures (PC-RPLND 23–45%)", "<b>Nephrectomy</b> (commonest; <b>left</b>): strongest predictor residual <span class=\"key\">&gt;10 cm</span>; risk rises fibrosis &lt; teratoma &lt; viable, and in salvage/desperation/redo. Concern: future cisplatin eligibility."], [8, "l", 15, "Ch 80 · Surgery of Testicular Tumours", "6 · Auxiliary procedures (PC-RPLND 23–45%)", "<b>IVC</b>: narrowing <span class=\"key\">&lt;25%</span> → venorrhaphy, &gt;25% → patch/graft; ligation acceptable (collaterals); grafts thrombose; mass &gt;5 cm → ≈20% need IVC work. <b>Aorta never ligated</b>; duodenal injury + graft → aortoduodenal fistula."], [8, "l", 15, "Ch 80 · Surgery of Testicular Tumours", "6 · Auxiliary procedures (PC-RPLND 23–45%)", "<b>Liver</b>: discordant ≈half; resect, or microwave ablation if <span class=\"key\">&lt;3 cm</span> unresectable. <b>Thorax</b>: 25–50% discordant → RPLND first; resect &gt;1 cm unless retroperitoneum fibrosis only (predicts thoracic necrosis ≈89%). <b>Pelvis</b>: mostly teratoma. <b>Retrocrural</b>: transdiaphragmatic along right crus."], [8, "r", 15, "Ch 80 · Surgery of Testicular Tumours", "8 · Histology of residual mass after chemotherapy", "Fibrosis/necrosis · <span class=\"key\">≈40%</span> · RFS/CSS ≈95%; no adjuvant"], [8, "r", 15, "Ch 80 · Surgery of Testicular Tumours", "8 · Histology of residual mass after chemotherapy", "Teratoma · <span class=\"key\">≈45%</span> · RFS 80–90%; must be resected"], [8, "r", 15, "Ch 80 · Surgery of Testicular Tumours", "8 · Histology of residual mass after chemotherapy", "Viable GCT · <span class=\"key\">≈15%</span> · Survival 50–70%; consider 2 adjuvant cycles"], [8, "p", 15, "Ch 80 · Surgery of Testicular Tumours", "8 · Histology of residual mass after chemotherapy", "<b>Resect every NSGCT residual &gt;1 cm</b>: no imaging (including PET <span class=\"dag\">†</span>) or marker separates necrosis from teratoma; teratoma is chemoresistant, grows, relapses late, transforms. Surgery is staging and the only treatment; histology decides further therapy."], [8, "l", 16, "Ch 80 · Surgery of Testicular Tumours", "10 · Unique situations", "<b>Seminoma residual</b>: desmoplasia, no teratoma, viable ≈10%. <span class=\"key\">&lt;3 cm</span> → observe; <span class=\"key\">&gt;3 cm</span> → FDG-PET (≥6 weeks <span class=\"dag\">†</span>); avid → PC-RPLND (select), salvage chemotherapy or HDCT."], [8, "l", 16, "Ch 80 · Surgery of Testicular Tumours", "11 · Outcomes, fertility and complications", "<b>Ejaculation</b>: template or nerve sparing → antegrade <span class=\"key\">&gt;90%</span> (primary), no oncological cost. <span class=\"dag\">†</span> Loss → pseudoephedrine/imipramine, post-ejaculatory urine sperm, electroejaculation, TESE."], [8, "r", 16, "Ch 80 · Surgery of Testicular Tumours", "11 · Outcomes, fertility and complications", "Pulmonary (bleomycin) · PC 3–5%, ARDS. Low FiO₂, restrictive fluids; tachycardia alone no fluid trigger; accept SpO₂ <span class=\"key\">88–90%</span>"], [8, "a", 16, "Ch 80 · Surgery of Testicular Tumours", "11 · Outcomes, fertility and complications", "<p>Paracentesis → drain if reaccumulates → very-low-fat, high-protein diet + MCT + octreotide → NBM + TPN → refractory: lymphangiography ± embolisation, peritoneovenous shunt or exploration → low-fat diet ≥<span class=\"key\">4 weeks</span> after resolution.</p>"], [8, "l", 17, "Ch 81 · Minimally Invasive Retroperitoneal Lymph Node Dissection", "1 · Indications and rationale", "<b>Primary</b>: marker-negative CS I NSGCT; small-volume stage II NSGCT and seminoma. Stages and cures occult disease; spares chemotherapy in the <span class=\"key\">20–30%</span> with enlarged nodes who prove pN0."], [8, "l", 17, "Ch 81 · Minimally Invasive Retroperitoneal Lymph Node Dissection", "1 · Indications and rationale", "<b>PC-RPLND</b>: NSGCT residual <span class=\"key\">&gt;1 cm</span>; select seminomas."], [8, "p", 17, "Ch 81 · Minimally Invasive Retroperitoneal Lymph Node Dissection", "1 · Indications and rationale", "Much recovery gain came from ERAS pathways, which help every approach — the benefit of access alone is smaller than it looks."], [8, "l", 17, "Ch 81 · Minimally Invasive Retroperitoneal Lymph Node Dissection", "2 · Guidelines and controversy", "Concerns: staging-only dissection (no lumbar division, low yields, excess adjuvant chemotherapy even pIIA → dual therapy; residual teratoma → late relapse); wrong patients (stage IA operated; pN0 up to 83%); console great-vessel surgery, surgeons lacking open skills, conversion <span class=\"key\">≈5%</span>; no series &gt; 5 years, peritoneal carcinomatosis reported."], [8, "l", 17, "Ch 81 · Minimally Invasive Retroperitoneal Lymph Node Dissection", "3 · Patient selection", "<b>Suits MIS</b>: chemo-naive high-risk IB; small-volume II (1–2 landing-zone nodes, none <span class=\"key\">&gt;3 cm</span>); PC solitary landing-zone mass with small response (suggests teratoma), little desmoplasia."], [8, "l", 17, "Ch 81 · Minimally Invasive Retroperitoneal Lymph Node Dissection", "4 · Unchanging operative principles", "Imaging within <span class=\"key\">≈4 weeks</span>, markers within <span class=\"key\">1–2 weeks</span>."], [8, "a", 17, "Ch 81 · Minimally Invasive Retroperitoneal Lymph Node Dissection", "4 · Unchanging operative principles", "<p>Safe entry → exposure → <b>split-and-roll</b> → prospective nerve sparing → <b>lumbar vessel division</b> → spermatic cord removal → closure</p>"], [8, "l", 18, "Ch 81 · Minimally Invasive Retroperitoneal Lymph Node Dissection", "6 · Operative steps", "Lower pneumoperitoneum to check haemostasis; bag packets; <b>no routine drain</b>; discharge <span class=\"key\">1–2 days</span>."], [8, "a", 18, "Ch 81 · Minimally Invasive Retroperitoneal Lymph Node Dissection", "7 · Complications and management", "<p>Major vascular injury → pressure + raise pneumoperitoneum → inform anaesthesia, blood, vascular help → uncontrolled: keep pressure, undock, convert</p>"], [8, "l", 18, "Ch 81 · Minimally Invasive Retroperitoneal Lymph Node Dissection", "7 · Complications and management", "Antegrade ejaculation <span class=\"key\">≥90%</span> after primary nerve-sparing."], [8, "l", 18, "Ch 81 · Minimally Invasive Retroperitoneal Lymph Node Dissection", "8 · Outcomes vs open", "Robotic node yields approach open benchmark <span class=\"key\">≈30</span>; adjuvant chemotherapy still too frequent."], [8, "l", 18, "Ch 81 · Minimally Invasive Retroperitoneal Lymph Node Dissection", "8 · Outcomes vs open", "Benchmark recurrence-free ≈<span class=\"key\">85%</span> for limited pN+ without adjuvant chemotherapy. Low MI recurrence <b>confounded</b> by high pN0 and adjuvant rates. PC data too small."], [8, "l", 19, "Ch 82 · Tumours of the Penis", "1 · Overview", "SCC = <span class=\"key\">~95%</span> of penile malignancy. <span class=\"key\">0.4–0.6%</span> of male cancers in North America/Europe; up to <span class=\"key\">10%</span> in parts of Asia, Africa, South America."], [8, "l", 19, "Ch 82 · Tumours of the Penis", "2 · Premalignant lesions — PeIN", "EQ: glans, uncircumcised, red velvety; mimic balanitis; progression <span class=\"key\">10–33%</span>. Bowen: shaft scaly plaque (mimics psoriasis, eczema, superficial BCC); <span class=\"key\">~5%</span>. Bowenoid papulosis: shaft papules, young men, HPV; <b>does not progress</b>."], [8, "r", 19, "Ch 82 · Tumours of the Penis", "3 · Aetiology and risk factors of SCC", "<b>Phimosis</b> · Present in <span class=\"key\">25–75%</span>; <span class=\"key\">7–10×</span> risk; mediates the non-circumcision risk (smegma → inflammation → fibrosis)"], [8, "r", 19, "Ch 82 · Tumours of the Penis", "3 · Aetiology and risk factors of SCC", "<b>HPV</b> · Low risk 6, 11; high risk <b>16, 18</b>, 31, 33, 45, 52, 58; <b>HPV 16 commonest</b>. Present in <span class=\"key\">~50%</span>; wives ~3× cervical cancer risk"], [8, "r", 19, "Ch 82 · Tumours of the Penis", "3 · Aetiology and risk factors of SCC", "<b>Lichen sclerosus</b> · Cancer <span class=\"key\">2.3–9%</span>; HPV-<b>independent</b> SCC"], [8, "p", 19, "Ch 82 · Tumours of the Penis", "3 · Aetiology and risk factors of SCC", "Two routes converge on the preputial sac: HPV-driven (E6/E7, p16+, basaloid/warty) and inflammation-driven HPV-independent (phimosis, smegma, LS). Neonatal circumcision, hygiene and vaccination each prevent part; adult circumcision almost none."], [8, "l", 20, "Ch 82 · Tumours of the Penis", "4 · Natural history and spread", "Distant metastases uncommon (<span class=\"key\">1–10%</span>), late. Untreated: death within <span class=\"key\">2 years</span> (femoral erosion haemorrhage, sepsis); no spontaneous remission."], [8, "r", 20, "Ch 82 · Tumours of the Penis", "6 · Histology", "Usual (keratinising) <span class=\"key\">45–65%</span> · Independent · Usually grade II; LVI/PNI ~⅓ · 25–40%"], [8, "p", 21, "Ch 82 · Tumours of the Penis", "8 · Staging — TNM 8th edition (2017)", "Traps: T1b and T2 share stage IIA; any N3 or T4 = stage IV without metastases; cN counts palpable nodes, pN counts metastases (pN1 allows two). Primary staged by tissue, groin by surgery."], [8, "l", 21, "Ch 82 · Tumours of the Penis", "9 · Management of the primary tumour", "<b>Penectomy</b> = oncological gold standard (local recurrence <span class=\"key\">0–8%</span>); &gt;half are ≤60 → preserve where safe."], [8, "l", 21, "Ch 82 · Tumours of the Penis", "9 · Management of the primary tumour", "<b>Organ preservation</b>: PeIN, Ta, T1, grade I–II, <b>compliant</b>. <b>Against</b>: <span class=\"key\">≥4 cm</span>, grade III, deep cavernosal invasion, unfit for salvage."], [8, "l", 21, "Ch 82 · Tumours of the Penis", "9 · Management of the primary tumour", "<b>Margins</b>: microscopic spread <span class=\"key\">~5 mm</span> (grade I–II), <span class=\"key\">~10 mm</span> (grade III); only <span class=\"key\">&lt;1 mm</span> raised recurrence → <b>negative frozen-section margin (&gt;1 mm) enough</b>; 2-cm dogma abandoned."], [8, "p", 22, "Ch 82 · Tumours of the Penis", "9 · Management of the primary tumour", "Margin width is a function of grade, not a fixed 2 cm. Low-grade tumours spread millimetres and recurrences are salvageable, so preservation is safe; in high-grade or cavernosal disease local relapse is lethal and amputation regains its place."], [8, "l", 22, "Ch 82 · Tumours of the Penis", "10 · Inguinal nodes → Ch 84", "Cure ~<span class=\"key\">80%</span> if ≤2 unilateral nodes, no ENE/pelvic; pelvic positive → ~<span class=\"key\">14%</span> 5-y with surgery alone."], [8, "l", 22, "Ch 82 · Tumours of the Penis", "10 · Inguinal nodes → Ch 84", "Occult nodes: PeIN/Ta/T1a <span class=\"key\">0–18%</span>; T1b+ one-third to &gt;half; corporal ~60%."], [8, "a", 22, "Ch 82 · Tumours of the Penis", "10 · Inguinal nodes → Ch 84", "<p><b>cN0 low risk</b> → surveillance → node → FNAC → ILND + contralateral staging.</p>\n<p><b>cN0 high risk (T1b+)</b> → bilateral <b>DSNB</b> or superficial/fascia-sparing/MI ILND → positive → completion ILND.</p>\n<p><b>cN1–2 mobile &lt;4 cm</b> → biopsy → ILND + contralateral staging; PLND if &gt;2 nodes or ENE.</p>\n<p><b>Fixed / ≥4 cm / pelvic</b> → neoadjuvant TIP (cisplatin-eligible) or chemoradiation → resect responders.</p>\n<p><b>Adjuvant</b> if &gt;2 nodes, bilateral, ENE or pelvic nodes.</p>"], [8, "l", 23, "Ch 82 · Tumours of the Penis", "11 · Radiotherapy", "<b>EBRT</b>: <span class=\"key\">≥66 Gy in 2-Gy fractions over ~6.5 weeks</span>; wax/Perspex block as <b>bolus</b>; ~55% recurrence-free at 5 y. Better: &gt;60 Gy, ≤45 days, ≥2 Gy/fraction; worse: T3, &gt;4 cm, high grade."], [8, "l", 25, "Ch 84 · Inguinal Node Dissection", "1 · Why the groin matters in penile cancer", "Early vs delayed inguinal lymph node dissection (ILND) for impalpable T2–3 nodes: ENE ≈20% vs ≈95%; 3-year disease-specific survival ≈84% vs ≈35%. → Manage groins within <span class=\"key\">3 months</span> of diagnosis."], [8, "l", 25, "Ch 84 · Inguinal Node Dissection", "1 · Why the groin matters in penile cancer", "Adequacy: ≥<span class=\"key\">8 nodes per side</span>. Omission predicts mortality."], [8, "l", 25, "Ch 84 · Inguinal Node Dissection", "2 · Indications and risk groups", "Unilateral palpable nodes → contralateral micrometastasis ≈<span class=\"key\">30%</span> → stage the other groin."], [8, "p", 25, "Ch 84 · Inguinal Node Dissection", "3 · Staging work-up", "Every groin test fails toward <b>false negatives</b>; a negative result never ends the pathway."], [8, "a", 26, "Ch 84 · Inguinal Node Dissection", "6 · Open radical ILND", "<p>Frog-leg → incision ≈2 cm below and parallel to inguinal ligament → flaps 3 cm above ligament to apex → divide saphenous at apex (spare if minimal disease) → open fascia lata over sartorius and adductor longus → dissect cephalad on femoral vessels → divide saphenous at junction → clear deep nodes to femoral canal → <b>sartorius transposition</b> → close femoral canal (inguinal to Cooper's ligament) → suction drains, tack flaps.</p>"], [8, "r", 27, "Ch 84 · Inguinal Node Dissection", "9 · Complications and post-op care", "Lymphocele / seroma · Unsealed lymphatics · Sealing devices; drain until <span class=\"key\">&lt;30 mL/day</span>; drain symptomatic/infected collections <span class=\"dag\">†</span>"], [8, "p", 28, "Ch 83 · Tumours of the Urethra", "2 · Anatomy → histology → lymphatics", "Site predicts histology (distal SCC, proximal UC), histology predicts behaviour, and the same anterior–posterior line fixes the nodal basin. In women it is also the <b>continence boundary</b>: the distal third can be excised without incontinence."], [8, "p", 30, "Ch 83 · Tumours of the Urethra", "5 · Male posterior (prostatic) urethral cancer", "The only question is \"stroma breached?\" TURP before BCG debulks, improves contact and stages. Ductal disease is not T2 — do not jump to cystectomy."], [8, "l", 31, "Ch 83 · Tumours of the Urethra", "8 · Urethral recurrence (UR) after radical cystectomy", "Risk <span class=\"key\">1–15%</span> (~5%); most within 2 years, ~11% after 5 years."], [8, "l", 32, "Ch 85 · Benign Disorders of the Penis and Urethra", "1 · Reconstructive surgical technique", "<b>Sutures</b>: always <b>absorbable</b> (permanent = stone nidus); monofilament PDS preferred. Support needed <span class=\"key\">30–60 days</span>; chromic lasts 14 days → avoid. <span class=\"key\">5-0</span> for most urethral work; <span class=\"key\">6-0</span> for single-layer mucosal anastomosis (non-transecting EPA); RB-1 taper needle."], [8, "l", 32, "Ch 85 · Benign Disorders of the Penis and Urethra", "2 · Tissue transfer: grafts and flaps", "OMG: <b>panlaminar plexus</b>, sacculates less than skin. BMG: more early swelling, numbness; lingual: speech difficulty; labial: worst morbidity. Buccal onlay failures occur in the <span class=\"key\">first 12 months</span>."], [8, "p", 32, "Ch 85 · Benign Disorders of the Penis and Urethra", "2 · Tissue transfer: grafts and flaps", "Graft trade-off: dense fine plexus and low mass favour take; carried dermis/lamina gives durability and resists contraction. This explains STSG vs FTSG, failure of extragenital FTSG, the Wolfe exception, and why OMG is ideal."], [8, "p", 33, "Ch 85 · Benign Disorders of the Penis and Urethra", "3 · Surgical anatomy", "Two envelopes, two vascular worlds: dartos carries skin supply (skin flaps raised on dartos); Buck's encloses erectile bodies fed by the common penile artery."], [8, "l", 33, "Ch 85 · Benign Disorders of the Penis and Urethra", "4 · Lichen sclerosus (LS)", "Malignant transformation up to <span class=\"key\">8%</span> (mostly SCC)."], [8, "p", 33, "Ch 85 · Benign Disorders of the Penis and Urethra", "4 · Lichen sclerosus (LS)", "LS is a progressive skin disease sparing the proximal urethra: hence meatus as sentinel, RUG before meatotomy, oral mucosa not skin, high recurrence, and easy perineal urethrostomy."], [8, "a", 34, "Ch 85 · Benign Disorders of the Penis and Urethra", "6 · Prepuce and meatus", "<p>Penile block → foreskin retracted: mark cuff incision across frenular base → incise to Buck's → foreskin advanced: mark coronal incision ± frenuloplasty → excise sleeve with <b>bipolar</b> (adult vessels do not seal by pressure) → quadrant dartos sutures → skin closure</p>"], [8, "l", 34, "Ch 85 · Benign Disorders of the Penis and Urethra", "6 · Prepuce and meatus", "<b>HIV</b>: foreskin rich in CD4+ cells, microtears; circumcision ↓ female-to-male HIV ~<span class=\"key\">60%</span>; also ↓ HSV, HPV. MSM: benefit mainly insertive partners."], [8, "a", 34, "Ch 85 · Benign Disorders of the Penis and Urethra", "7 · Penile curvature", "<p>Excise ventral dysgenetic tissue + mobilise spongiosum glans → perineum → artificial erection → ventral midline septotomy → still curved: dorsal tunical ellipse excision/plication under elevated neurovascular bundle (dorsal arteries may be dominant glans supply)</p>"], [8, "a", 35, "Ch 85 · Benign Disorders of the Penis and Urethra", "9 · Adult acquired buried penis (AABP)", "<p>Slit phimotic ring → glans traction → circumcising incision, excise non-viable skin → escutcheonectomy (harvest graft from it; keep 2–3 cm skin at base) → tack Scarpa to rectus fascia/pubis → drains → STSG (0.012–0.020 inch), fibrin glue, bolster 5–7 days</p>"], [8, "p", 36, "Ch 86 · Urethral Stricture Disease", "1 · Definitions, anatomy, aetiology", "Retrograde glanular flow allows the bulb to be transected and mobilised. Where it is lost (hypospadias, common penile artery injury), mobilisation becomes ischaemia — linking vessel-sparing excision and PFUI repair failure."], [8, "p", 36, "Ch 86 · Urethral Stricture Disease", "1 · Definitions, anatomy, aetiology", "Aetiology predicts biology: iatrogenic and straddle strictures are focal ischaemic/crush scars suited to excision; LS is a progressive skin disease that recurs in any skin used to repair it."], [8, "l", 36, "Ch 86 · Urethral Stricture Disease", "2 · Presentation and evaluation", "<b>Urethral rest</b>: suprapubic tube <span class=\"key\">6–8 weeks</span> → true length. Calibrate whole urethra at surgery (bougie à boule)."], [8, "a", 37, "Ch 86 · Urethral Stricture Disease", "3 · Decision making", "<p>Short (&lt;1.5 cm) bulbar, no dense spongiofibrosis, first treatment → dilation or internal urethrotomy (once) → recurrence → urethroplasty<br>Bulbar 1–2 cm (up to 3–5 cm proximally) → excision and primary anastomosis (EPA)<br>Longer bulbar → oral mucosa graft (OMG) onlay ± augmented anastomosis<br>Penile → onlay (graft or flap); hostile bed/LS/failed hypospadias → staged OMG<br>Panurethral/exhausted options/elderly → perineal urethrostomy</p>"], [8, "l", 37, "Ch 86 · Urethral Stricture Disease", "4 · Dilation and internal urethrotomy (DVIU)", "DVIU worse with luminal narrowing &gt;<span class=\"key\">74%</span>; no success in non-bulbar strictures; repetition worsens later urethroplasty. Use saline (extravasation)."], [8, "r", 37, "Ch 86 · Urethral Stricture Disease", "4 · Dilation and internal urethrotomy (DVIU)", "<span class=\"key\">&lt;1.5 cm</span> · Longer"], [8, "l", 37, "Ch 86 · Urethral Stricture Disease", "4 · Dilation and internal urethrotomy (DVIU)", "Self-catheterisation tapering over <span class=\"key\">3–6 months</span> (6-week catheter no better than 3–7 days); recurs when stopped. UroLume withdrawn."], [8, "p", 37, "Ch 86 · Urethral Stricture Disease", "4 · Dilation and internal urethrotomy (DVIU)", "No endoscopic adjunct removes spongiofibrosis, so endoscopy cures only the short superficial bulbar stricture; repetition spends the patient's reconstructive capital."], [8, "p", 38, "Ch 86 · Urethral Stricture Disease", "6 · Substitution urethroplasty", "A graft lives on its bed — it succeeds where the bed is thick and vascular (bulb, dorsal corpora) and is staged when the bed, or skin disease, cannot be trusted in one step."], [8, "l", 38, "Ch 86 · Urethral Stricture Disease", "6 · Substitution urethroplasty", "<b>Flaps</b>: hairless genital skin on dartos; <b>Quartey</b>: skin is a passenger on a fascial flap. Ventral longitudinal (<b>Orandi</b>), dorsal transverse, hockey stick (7–9 cm), <b>circular island</b> up to <span class=\"key\">15 cm</span>; scrotal island not first choice."], [8, "l", 38, "Ch 86 · Urethral Stricture Disease", "8 · Pelvic fracture urethral injury (PFUI)", "~<span class=\"key\">10%</span> of pelvic fractures; \"apple off its stem\" wrong. Primary realignment linked to delayed repair, more endoscopic failures."], [8, "l", 38, "Ch 86 · Urethral Stricture Disease", "8 · Pelvic fracture urethral injury (PFUI)", "Normal anterior urethra on RUG predicts successful anastomosis. Timing <span class=\"key\">3–6 months</span>. Transpubic unnecessary; <b>core-through not curative</b>."], [8, "a", 38, "Ch 86 · Urethral Stricture Disease", "8 · Pelvic fracture urethral injury (PFUI)", "<p>On-table endoscopy (exclude bladder stones) → exaggerated lithotomy → perineal incision → bulbospongiosus divided, bulb mobilised → Haygrove sound via suprapubic tract → excise fibrosis → spatulate to <span class=\"key\">≥30 Fr</span> → 8–10 tension-free 4-0 PDS sutures over silicone stent<br>Progressive steps only if tension: mobilisation (to penoscrotal junction) → intracrural separation → infrapubectomy → corporal rerouting</p>"], [8, "l", 39, "Ch 86 · Urethral Stricture Disease", "8 · Pelvic fracture urethral injury (PFUI)", "Success high <span class=\"key\">90s %</span>. Failure mostly <b>ischaemic stenosis</b> of mobilised bulb, not anastomotic. Anticholinergic post-op."], [8, "l", 40, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "1 · Surgical anatomy of the scrotum", "<b>Transdermal absorption</b> ~<span class=\"key\">40×</span> other skin; rich in 5α-reductase."], [8, "p", 40, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "1 · Surgical anatomy of the scrotum", "Three trunks (aorta, internal iliac, external iliac) anastomose in the cord (~10 cm above testis) and at the cauda — so the testicular artery can be ligated in Fowler–Stephens orchidopexy and the superior epididymal artery sacrificed in vasectomy reversal."], [8, "l", 40, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "3 · Scrotal wall: excision, scrotectomy, reconstruction", "<b>Fournier gangrene</b>: commonest indication for partial scrotectomy. Fluids + broad-spectrum antibiotics + <b>urgent debridement</b> (spreads <span class=\"key\">2–3 cm/h</span>); mortality ~<span class=\"key\">20%</span>. Re-debride every <span class=\"key\">24–48 h</span>. Anorectal extension may need colostomy."], [8, "l", 40, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "3 · Scrotal wall: excision, scrotectomy, reconstruction", "&gt;<span class=\"key\">50–60%</span> skin lost: no immediate reconstruction; testes in thigh pockets, saline gauze or under VAC."], [8, "a", 40, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "3 · Scrotal wall: excision, scrotectomy, reconstruction", "<p>Defect &lt;50%, no tension → primary closure · &lt;50% with tension → local scrotal advancement / secondary intention · &gt;50% → VAC, then stretched scrotal advancement or delayed primary closure → no local tissue → fasciocutaneous thigh flap · meshed STSG last.</p>"], [8, "p", 41, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "3 · Scrotal wall: excision, scrotectomy, reconstruction", "The scrotum works because it is lax; graft contracture defeats that, whereas residual scrotal skin stretches enormously and is the best donor."], [8, "l", 41, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "4 · Hydrocele", "<b>Congenital</b>: patent processus; ~<span class=\"key\">80%</span> resolve by 18 months. <b>Acquired</b>: production–absorption imbalance; men &gt;40 y."], [8, "p", 41, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "4 · Hydrocele", "More tunica excised → lower recurrence but more haematoma; plication trades a little recurrence for a dry field. Recurrence after any successful repair <span class=\"key\">0–6%</span>."], [8, "l", 41, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "4 · Hydrocele", "With <b>retreatment</b> resolution <span class=\"key\">85–96%</span>. Poor if multiloculated or &gt;<span class=\"key\">750 mL</span>."], [8, "l", 41, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "7 · Vasectomy", "<b>Counsel</b>: not immediately sterile (contraception until PVSA); repeat vasectomy &lt;<span class=\"key\">1%</span>; pregnancy ~<span class=\"key\">1 in 2000</span> even after azoospermic PVSA; chronic pain ~<span class=\"key\">1–2%</span>."], [8, "r", 42, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "7 · Vasectomy", "Skin opening · 1.5–3 cm · ≤<span class=\"key\">10 mm</span> · Puncture &lt;10 mm"], [8, "p", 42, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "7 · Vasectomy", "Every recommended method rests on <b>mucosal cautery</b>; ligatures and clips alone are not core methods. Division required; segment excision optional (<span class=\"key\">1 cm</span> adequate)."], [8, "a", 42, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "7 · Vasectomy", "<p>PVSA at <span class=\"key\">8–16 weeks</span> (≥10–20 ejaculations) → azoospermia or rare non-motile sperm (RNMS, ≤<span class=\"key\">100,000/mL</span>) → stop contraception · motile sperm → repeat at 6 months → still motile = failure → repeat vasectomy.</p>"], [8, "l", 42, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "7 · Vasectomy", "Complications: haematoma, infection, <b>sperm granuloma</b> (expected, not a complication; NSAIDs; persisting &lt;5% → excise), post-vasectomy pain ~<span class=\"key\">2%</span> (cord block → denervation or reversal)."], [8, "l", 42, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "8 · Orchidectomy and prosthesis", "<b>Prosthesis</b>: offer every man lacking a testis, before cancer orchidectomy. Port pierced ≤<span class=\"key\">5 times</span>, never post-op. <b>High scrotal subdartos</b> pouch: least infection/erosion; trans-scrotal more extrusion."], [8, "a", 43, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "10 · Chronic scrotal pain (>3 months)", "<p>History, exam, duplex US → treat cause · none → exclude extrascrotal cause (imaging abdomen, pelvis, spine, hip) → prostatitis/pelvic floor → treat · non-specific → support, NSAIDs, tricyclics, gabapentin ≥3 months → epididymal → epididymectomy · testis/post-vasectomy → cord block: &gt;<span class=\"key\">50%</span> relief → microsurgical denervation (or reversal); &lt;50% → pain clinic, inguinal orchidectomy last · post-hernia → ilioinguinal block &gt;<span class=\"key\">90%</span> → neurolysis.</p>"], [8, "l", 43, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "12 · Seminal vesicles", "Wolffian derivatives, bud ~<span class=\"key\">12 weeks</span>; ~<span class=\"key\">60%</span> of seminal fluid. Relations: bladder front, rectum behind, <b>neurovascular bundles lateral to tips</b>, ureter anterolateral."], [8, "l", 43, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "12 · Seminal vesicles", "<b>MRI most accurate</b>; TRUS obstruction if SV &gt;<span class=\"key\">1.5 cm</span> or ejaculatory duct &gt;<span class=\"key\">2.3 mm</span> — confirm by <b>aspiration showing sperm</b>."], [8, "a", 45, "★ Putting it together", "A · Testicular mass: the first week", "<p>US → AFP, hCG, LDH <b>before</b> orchidectomy → sperm bank → <b>radical inguinal orchidectomy</b> (never trans-scrotal) → repeat markers (AFP half-life 5–7 days, hCG 1–1.5 days) → CT abdomen–pelvis + chest (<span class=\"xref\">→ Ch 79, 80</span>).</p>"], [8, "a", 45, "★ Putting it together", "C · Penile cancer: primary and groin", "<p><b>Primary:</b> PeIN → topical 5-FU/imiquimod, laser, glans resurfacing. Invasive → organ-sparing, glansectomy, partial/total penectomy; margins &lt;1 cm acceptable (<span class=\"xref\">→ Ch 82</span>).</p>\n<p><b>cN0:</b> low risk (pTis/pTa/pT1a) → surveillance; intermediate/high → DSNB or modified ILND; positive → radical.</p>\n<p><b>cN+:</b> FNA positive → bilateral radical ILND; cN3 → neoadjuvant TIP first; pelvic dissection if ≥2 inguinal nodes or ENE (<span class=\"xref\">→ Ch 84</span>).</p>"], [9, "p", 2, "Ch 93 · Management of Upper Urinary Tract Obstruction", "2 · Diagnosis", "<b>Dilation is not obstruction.</b> Anatomical imaging (ultrasonography, computed tomography [CT], retrograde) shows <i>where</i>; functional tests (renography, Whitaker) show <i>whether it matters</i>. Combine one of each."], [9, "l", 2, "Ch 93 · Management of Upper Urinary Tract Obstruction", "2 · Diagnosis", "<b>Renography (Ch 93 values)</b>: hydrated → furosemide <span class=\"key\">0.3–0.5 mg/kg</span> at <b>20 min</b>; MAG3 preferred. <b>Obstructed: T½ &gt;<span class=\"key\">40 min</span></b>; after successful pyeloplasty drainage occurs even before furosemide."], [9, "a", 2, "Ch 93 · Management of Upper Urinary Tract Obstruction", "2 · Diagnosis", "<p><b>Whitaker test</b>: nephrostomy → bladder catheter → perfuse at <span class=\"key\">10 mL/min</span> → non-obstructed ≤12–15 cm H<sub>2</sub>O; obstructed &gt;<span class=\"key\">15–20 cm H<sub>2</sub>O</span>. Invasive → only when other tests non-diagnostic. Errors: pelvic compliance, position</p>"], [9, "l", 2, "Ch 93 · Management of Upper Urinary Tract Obstruction", "3 · Indications and choice of intervention", "<b>Neonates</b>: selective observation — operate for progressive hydronephrosis or a <span class=\"key\">10%</span> fall in differential function. <b>Asymptomatic adults</b>, indeterminate → serial renography."], [9, "r", 2, "Ch 93 · Management of Upper Urinary Tract Obstruction", "3 · Indications and choice of intervention", "Crossing vessel present vs absent · <span class=\"key\">42% vs 86%</span>"], [9, "l", 3, "Ch 93 · Management of Upper Urinary Tract Obstruction", "3 · Indications and choice of intervention", "<b>Nephrectomy</b>: thin shell + normal contralateral kidney. Adults &lt;<span class=\"key\">15%</span> differential function = non-salvageable; children — no agreed cut-off. Uncertain → temporary stent/nephrostomy, re-scan. Also stones with chronic infection, multiple failed repairs."], [9, "l", 3, "Ch 93 · Management of Upper Urinary Tract Obstruction", "4 · Endopyelotomy", "Pyeloplasty (≈<span class=\"key\">95%</span>) wins: wide dependent funnel and pelvic reduction; endourology wins only on recovery."], [9, "l", 3, "Ch 93 · Management of Upper Urinary Tract Obstruction", "4 · Endopyelotomy", "<b>Contraindications</b>: segment &gt;<span class=\"key\">2 cm</span>, active infection, uncorrected coagulopathy; marked vessel entanglement on 3D CT → robotic. Sterile urine first; if obstruction prevents clearance → temporise with stent/nephrostomy."], [9, "l", 3, "Ch 93 · Management of Upper Urinary Tract Obstruction", "4 · Endopyelotomy", "Stent: 14/7-Fr endopyelotomy stent (or 8–10 Fr); traditionally <span class=\"key\">6 weeks</span> (2 vs 4 weeks equal)."], [9, "a", 3, "Ch 93 · Management of Upper Urinary Tract Obstruction", "4 · Endopyelotomy", "<p>General anaesthesia → wire + safety wire → flexible ureteroscope via sheath → 200-µm holmium fibre → incise <b>laterally</b> into fat, into normal ureter → stent + Foley → renogram 4 weeks after stent removal</p>"], [9, "a", 3, "Ch 93 · Management of Upper Urinary Tract Obstruction", "4 · Endopyelotomy", "<p>Percutaneous bleeding: bed rest, transfusion → <b>do not irrigate</b> nephrostomy (tamponade) → persistent → <b>selective embolisation</b> (low threshold)</p>"], [9, "l", 3, "Ch 93 · Management of Upper Urinary Tract Obstruction", "4 · Endopyelotomy", "Renogram 1 month after stent removal → 6 months → yearly for <span class=\"key\">2–3 years</span>. Pyeloplasty 85/75% vs endopyelotomy 63/41% at 3/10 years."], [9, "p", 4, "Ch 93 · Management of Upper Urinary Tract Obstruction", "5 · Pyeloplasty", "<b>Principles (open = minimally invasive)</b>: widely patent, watertight, tension-free anastomosis; funnel-shaped, <b>dependent</b> transition."], [9, "l", 4, "Ch 93 · Management of Upper Urinary Tract Obstruction", "5 · Pyeloplasty", "<span class=\"tag\">MCQ</span> Trendelenburg 1886 first attempt; Kuster 1891 first successful dismembered; <b>Anderson–Hynes 1949</b> standard; Davis 1943 intubated ureterotomy."], [9, "a", 4, "Ch 93 · Management of Upper Urinary Tract Obstruction", "5 · Pyeloplasty", "<p>Dissect ureter with periureteral tissue → lateral marking stitch → excise UPJ → spatulate <b>laterally</b> → apex to inferior pelvis → transpose anterior to vessel → watertight absorbable anastomosis (± reduction) → stent → drain</p>"], [9, "l", 4, "Ch 93 · Management of Upper Urinary Tract Obstruction", "5 · Pyeloplasty", "<b>Stent</b> out at <span class=\"key\">4–6 weeks</span>. Added nephrostomy in uncomplicated adults → longer stay, more infection; reserve for secondary UPJO."], [9, "l", 4, "Ch 93 · Management of Upper Urinary Tract Obstruction", "5 · Pyeloplasty", "Laparoscopic/robotic success &gt;<span class=\"key\">90–95%</span> (= open); robot's advantage is ergonomic. \"Strict\" success definitions ≈one-third lower."], [9, "a", 4, "Ch 93 · Management of Upper Urinary Tract Obstruction", "5 · Pyeloplasty", "<p>Foley out 24–36 h → drain out if negligible; output rises after Foley removal → <b>replace Foley 7 days</b> (reflux along stent) → stent out 4–6 weeks → renography</p>"], [9, "p", 4, "Ch 93 · Management of Upper Urinary Tract Obstruction", "6 · Other UPJ reconstructions", "Every UPJ repair asks: <b>what tissue bridges the gap while keeping blood supply?</b> Dismemberment excises disease but devascularises; flaps keep blood supply but carry disease forward; the calyx is used when the pelvis is too small."], [9, "r", 4, "Ch 93 · Management of Upper Urinary Tract Obstruction", "6 · Other UPJ reconstructions", "Culp–DeWeerd spiral flap · Large pelvis, long proximal narrowing · Longest flap; length:width ≤<span class=\"key\">3:1</span>"], [9, "l", 5, "Ch 93 · Management of Upper Urinary Tract Obstruction", "8 · Ureteral stricture — evaluation and endourology", "Stricture after ureteroscopy (URS) ≈<span class=\"key\">3%</span> vs 1.5% after SWL; impacted stone &gt;2 months → ≈1 in 4. Thulium &gt; holmium stricture rate."], [9, "l", 5, "Ch 93 · Management of Upper Urinary Tract Obstruction", "8 · Ureteral stricture — evaluation and endourology", "Endourology needs ipsilateral function ≥<span class=\"key\">25%</span> (algorithm 20%)."], [9, "l", 5, "Ch 93 · Management of Upper Urinary Tract Obstruction", "8 · Ureteral stricture — evaluation and endourology", "<b>Balloon dilation</b>: 4-cm, 5–8-mm balloon until <b>waist disappears</b>, 10 min → stent 2–4 weeks. Contraindicated: infection, stricture &gt;<span class=\"key\">2 cm</span>. Favourable: short, recent (≤3 months), non-anastomotic, well vascularised (≈85%); anastomotic ≈50%; transplant strictures respond well."], [9, "a", 5, "Ch 93 · Management of Upper Urinary Tract Obstruction", "8 · Ureteral stricture — evaluation and endourology", "<p>&lt;2 cm + function &gt;20% → endoscopic incision | &gt;2 cm + &gt;20% → reconstruction | &lt;20% → nephrectomy (children may still merit repair). Transplant → consider balloon. Renography for 2 years</p>"], [9, "p", 5, "Ch 93 · Management of Upper Urinary Tract Obstruction", "8 · Ureteral stricture — evaluation and endourology", "Each failure predictor (long, old, anastomotic, poorly vascularised) is a proxy for <b>ischaemic scar</b> that an incision cannot heal across."], [9, "r", 5, "Ch 93 · Management of Upper Urinary Tract Obstruction", "9 · Ureteral stricture — reconstruction ladder", "Ureteroureterostomy · <span class=\"key\">2–3 cm</span> · Upper/mid"], [9, "r", 5, "Ch 93 · Management of Upper Urinary Tract Obstruction", "9 · Ureteral stricture — reconstruction ladder", "Psoas hitch · <span class=\"key\">6–10 cm</span> · Below pelvic brim"], [9, "r", 6, "Ch 93 · Management of Upper Urinary Tract Obstruction", "9 · Ureteral stricture — reconstruction ladder", "Boari flap · <span class=\"key\">10–15 cm</span> · Lower/mid; spiral may reach pelvis"], [9, "a", 6, "Ch 93 · Management of Upper Urinary Tract Obstruction", "9 · Ureteral stricture — reconstruction ladder", "<p>Persistent leak: X-ray stent position → drain off anastomosis → stop suction → Foley + anticholinergic → nephrostomy</p>"], [9, "l", 6, "Ch 93 · Management of Upper Urinary Tract Obstruction", "9 · Ureteral stricture — reconstruction ladder", "<b>Ileal ureter</b>: isoperistaltic; contraindicated by creatinine &gt;<span class=\"key\">2 mg/dL</span> (acidosis in ≈half), bladder dysfunction, inflammatory bowel disease, radiation enteritis. Distal ileum ≥15 cm from ileocaecal valve; segments &gt;15 cm prevent reflux. Tapering unproven. Dilation + acidosis → seek outlet obstruction; endoscopic surveillance from year 3."], [9, "p", 6, "Ch 93 · Management of Upper Urinary Tract Obstruction", "9 · Ureteral stricture — reconstruction ladder", "Ladder: bring the bladder up, the kidney down, borrow the other ureter, or substitute (ileum, buccal). Tension and ischaemia cause failure at every rung."], [9, "a", 6, "Ch 93 · Management of Upper Urinary Tract Obstruction", "10 · Ureteroenteric anastomotic stricture", "<p>&lt;2 cm + &gt;20% → right: endoscopic incision; <b>left: formal repair</b> (sigmoid mesentery bleeding) | &gt;2 cm → formal repair | &lt;20% → nephrectomy or observation</p>"], [9, "a", 7, "Ch 93 · Management of Upper Urinary Tract Obstruction", "11 · Retroperitoneal fibrosis", "<p>Uraemia → <b>nephrostomy</b> or stents → manage <b>post-obstructive diuresis</b> → stop culprit drug, biopsy → steroids → ureterolysis</p>"], [9, "l", 8, "Ch 94 · Upper Urinary Tract Trauma", "2 · Haematuria", "Significant: <b>gross</b>, or <b>microhaematuria (&gt;5 RBC/hpf) with SBP <span class=\"key\">&lt;90 mm Hg</span></b>. Degree ≠ severity; absent in ~⅓ blunt renovascular and <b>~½ of UPJ injuries</b>."], [9, "p", 8, "Ch 94 · Upper Urinary Tract Trauma", "2 · Haematuria", "Haematuria triggers imaging; it does not measure injury. The worst injuries (pedicle, UPJ) may not bleed into the urine, so mechanism carries equal weight."], [9, "r", 8, "Ch 94 · Upper Urinary Tract Trauma", "3 · AAST kidney injury scale (2018)", "II · Perirenal haematoma within Gerota's fascia; laceration <span class=\"key\">≤1 cm</span>, no extravasation"], [9, "l", 8, "Ch 94 · Upper Urinary Tract Trauma", "3 · AAST kidney injury scale (2018)", "Advance one grade for bilateral/multiple injuries up to III; grade by highest finding. <span class=\"tag\">MCQ</span> Trap: main-vessel injury was IV in 1989, now V; segmental pseudoaneurysm/AVF now IV."], [9, "l", 9, "Ch 94 · Upper Urinary Tract Trauma", "5 · Imaging studies", "<b>Contrast CT with arterial/nephrographic and delayed (~<span class=\"key\">10 min</span>) phases</b> = gold standard. Renal vein injury poorly seen (medial haematoma with normal arteries suggests it)."], [9, "l", 9, "Ch 94 · Upper Urinary Tract Trauma", "5 · Imaging studies", "<b>One-shot IVP</b> (unstable, no CT): <span class=\"key\">2 mL/kg contrast → single film at 10 min</span> — confirms a functioning contralateral kidney. Alternatives: palpate it; loop injured ureter + IV methylene blue."], [9, "l", 9, "Ch 94 · Upper Urinary Tract Trauma", "6 · Nonoperative management", "<b>Failure triggers</b>: instability; transfusion of <span class=\"key\">2–3 units</span>; new pain/guarding; enlarging urinoma with fever. Most failures need only stent, nephrostomy or AE."], [9, "p", 10, "Ch 94 · Upper Urinary Tract Trauma", "7 · Urinary extravasation", "Parenchymal leaks heal because antegrade flow is preserved; anything stopping urine reaching the bladder converts an observable leak into one that must be drained."], [9, "a", 10, "Ch 94 · Upper Urinary Tract Trauma", "8 · Intervention", "<p>Eviscerate small bowel → incise peritoneum over aorta above IMA → to ligament of Treitz → aorta to left renal vein → loop vein, retract → loop both arteries → reflect colon → open Gerota's → occlude if bleeding</p>"], [9, "a", 10, "Ch 94 · Upper Urinary Tract Trauma", "8 · Intervention", "<p>Exposure → vascular control → limited debridement → suture-ligate vessels → <b>watertight collecting-system closure</b> → parenchyma over bolster → Gerota's or <b>pedicled omentum</b> → drain</p>"], [9, "l", 10, "Ch 94 · Upper Urinary Tract Trauma", "8 · Intervention", "<b>Revascularise</b> only solitary or bilateral injury, warm ischaemia <span class=\"key\">&lt;120 min</span>; unilateral salvage only ~⅓. <b>Left renal vein may be ligated; right cannot</b>. Hypertension after thrombosis repair ≥43% → monitor BP a year. Endovascular stent of intimal flap: anticoagulation is the drawback."], [9, "r", 11, "Ch 94 · Upper Urinary Tract Trauma", "10 · Ureteral injury", "II · Laceration <span class=\"key\">&lt;50%</span> transection"], [9, "r", 11, "Ch 94 · Upper Urinary Tract Trauma", "10 · Ureteral injury", "IV · Complete transection, <span class=\"key\">&lt;2 cm</span> devascularisation"], [9, "p", 11, "Ch 94 · Upper Urinary Tract Trauma", "10 · Ureteral injury", "Ureteral injury is diagnosed by absent contrast beyond it — so time the study for excretion, follow both ureters, and never treat a non-diagnostic study as negative."], [9, "a", 11, "Ch 94 · Upper Urinary Tract Trauma", "10 · Ureteral injury", "<p>Stable at laparotomy → repair now · unstable → damage control, delayed repair · contusion → stent or excise and repair · late or partial → stent → fails → nephrostomy, delayed repair · ureterovaginal fistula → stent first</p>"], [9, "l", 13, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "1 · Overview and epidemiology", "Lifetime prevalence <span class=\"key\">1–15%</span>; US ≈ <span class=\"key\">10%</span> and rising (partly CT detection)."], [9, "l", 13, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "2 · Physicochemistry and stone formation", "Urine holds calcium oxalate at ≈ 4× aqueous solubility; with inhibitors precipitates only at <span class=\"key\">7–11×</span>. Nephron transit 5–7 min: aggregation, not single crystals, occludes tubules. Free- vs fixed-particle (Randall plaque anchor) theories."], [9, "l", 13, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "2 · Physicochemistry and stone formation", "<b>Randall plaque</b> (<span class=\"tag\">MCQ</span> 1937): <b>calcium apatite</b> from <b>thin-limb basement membrane</b> → interstitium → erodes papilla → calcium oxalate grows attached; osteopontin at mineral–organic interface. Vascular hypothesis: vasa recta calcification."], [9, "p", 14, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "2 · Physicochemistry and stone formation", "<b>Plaque vs plug</b>: plaque = idiopathic interstitial apatite anchor; plug = intratubular obstruction with injury from secondary systemic disease. <b>Ductal plugs → search for a secondary cause.</b> Infection or SWL may convert a calcium oxalate former into a brushite former."], [9, "l", 14, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "3 · Inhibitors and promoters", "<b>Matrix</b> ≈ <span class=\"key\">2.5%</span> of stone weight; matrix substance A (formers only)."], [9, "r", 15, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "4 · Mineral metabolism", "Proximal tubule · <span class=\"key\">60–65%</span> · Paracellular; claudin-2"], [9, "r", 15, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "5 · Classification", "Calcium oxalate (pure or with apatite) · <span class=\"key\">60%</span>"], [9, "p", 15, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "5 · Classification", "Classify by the <b>urinary abnormality, not the stone</b>: composition starts the work-up. Fewer than 3% have no abnormality. Work-up <span class=\"xref\">→ Ch 99</span>."], [9, "l", 16, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "6 · Hypercalciuria", "<b>Definition</b>: &gt; <span class=\"key\">200 mg/day</span> after 1 week of 400 mg calcium, 100 mEq sodium diet; or &gt; 4 mg/kg/day; or &gt; 7 (men) / 6 (women) mmol/day."], [9, "p", 16, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "6 · Hypercalciuria", "<b>Fasting urine + PTH separate gut from kidney</b>: renal leak → fasting calcium high, PTH high; absorptive → fasting normal, PTH suppressed."], [9, "l", 16, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "6 · Hypercalciuria", "<b>PHPT</b> ≈ 5% of stones; stones in &lt; 5% of PHPT. Suspect if serum calcium &gt; <span class=\"key\">10.1 mg/dL</span>; repeat with intact PTH; ionised calcium for normocalcaemic PHPT. <b>Thiazide challenge</b> unmasks PHPT (hypercalcaemia without PTH suppression). PTH also causes phosphaturia and mild hyperchloraemic acidosis. Others: thyrotoxicosis, vitamin D toxicity."], [9, "l", 16, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "7 · Hyperoxaluria", "<b>Definition</b>: &gt; <span class=\"key\">40 mg/day</span>. Primary, enteric, dietary, idiopathic."], [9, "a", 17, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "7 · Hyperoxaluria", "<p>Fat malabsorption → fatty acids saponify calcium/magnesium → more free oxalate → <b>colonic hyperabsorption</b> (bile salts ↑ permeability)</p>"], [9, "l", 17, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "8 · Hyperuricosuria, hypocitraturia, hypomagnesiuria", "<b>Hyperuricosuria</b> &gt; <span class=\"key\">600 mg/day</span> (diet, gout, myeloproliferative, HGPRT). Urate promotes calcium oxalate by <b>inhibitor adsorption, salting out, epitaxy</b>; allopurinol cut recurrence (trial below)."], [9, "l", 17, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "8 · Hyperuricosuria, hypocitraturia, hypomagnesiuria", "<b>Hypocitraturia</b> &lt; <span class=\"key\">320 mg/day</span>; <b>acid–base status is main determinant</b>. Causes: distal RTA, chronic diarrhoea, animal protein, thiazides (hypokalaemia), ACE inhibitors."], [9, "p", 17, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "8 · Hyperuricosuria, hypocitraturia, hypomagnesiuria", "Citrate excretion reads proximal-tubular <b>intracellular pH</b>: acidosis, hypokalaemia or acid diet make the tubule reclaim citrate — hence potassium citrate <span class=\"xref\">→ Ch 99</span>."], [9, "p", 18, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "9 · Renal tubular acidosis", "Stone risk in RTA follows citrate and pH: only distal RTA combines fixed alkaline urine with profound hypocitraturia and hypercalciuria — the recipe for <b>calcium phosphate</b> stones."], [9, "l", 18, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "10 · Uric acid stones", "Uric acid pKa <span class=\"key\">5.35</span>; undissociated solubility ≈ 96–100 mg/L; at pH 6.5 &gt; 1200 mg/L soluble. Radiolucent on KUB, visible on NCCT. BMI ≥ 27 predicts urine pH ≤ 5.5."], [9, "a", 18, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "10 · Uric acid stones", "<p>Insulin resistance / renal lipotoxicity (fatty acids not glutamine; ↓ NHE3) → ↓ ammoniagenesis → H⁺ as titratable acid → <b>persistently low urine pH</b> → undissociated uric acid → stone</p>"], [9, "p", 18, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "10 · Uric acid stones", "Uric acid stones are a disease of <b>urine pH, not uric acid</b>. No inhibitor exists, so raising pH above the pKa removes the driver; <span class=\"dag\">†</span>alkalinisation can dissolve stones <span class=\"xref\">→ Ch 99</span>."], [9, "a", 18, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "11 · Cystine and struvite stones", "<p>Urea → (urease) NH₃ + CO₂ → NH₄⁺ + OH⁻ → pH 7.2–8.0 → with magnesium: <b>struvite</b>; with calcium: carbonate apatite</p>"], [9, "p", 19, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "13 · Anatomic predisposition and pregnancy", "Anatomy sets the stage but metabolism writes the stone: anatomical stone formers still need <b>metabolic evaluation</b>; pyeloplasty alone does not prevent recurrence <span class=\"xref\">→ Ch 99</span>."], [9, "l", 20, "Ch 96 · Acute Care of Urinary Lithiasis", "1 · Presentation and diagnosis", "<b>Renal colic</b>: severe flank pain to groin, patient writhes. UVJ stone: tip-of-penis pain, frequency. Haematuria ~<span class=\"key\">90%</span> (absent &gt;10%). <b>Fever → infected obstructed system</b> → urgent intervention."], [9, "r", 20, "Ch 96 · Acute Care of Urinary Lithiasis", "1 · Presentation and diagnosis", "Low-dose NCCT (≤<span class=\"key\">3 mSv</span>) · Equal for stones ≥3 mm · Weak &lt;3 mm, obesity"], [9, "p", 20, "Ch 96 · Acute Care of Urinary Lithiasis", "1 · Presentation and diagnosis", "Unknown diagnosis → NCCT answers everything at once. Known stone → US showing hydronephrosis suffices."], [9, "l", 20, "Ch 96 · Acute Care of Urinary Lithiasis", "3 · Medical expulsive therapy (MET)", "Trial ± MET <span class=\"key\">4–6 weeks</span>. Measure <b>transverse width</b>: 6 mm ≈ 33% pass; mid-ureter ≈ 60%."], [9, "l", 21, "Ch 96 · Acute Care of Urinary Lithiasis", "4 · Urgent intervention", "<b>Stent failure</b>: P-CUT (ureteric diameter at stone − stone width) ≥<span class=\"key\">7.5 mm</span> (strongest); stone ≥9.5 mm; multiple → prefer PCN."], [9, "a", 21, "Ch 96 · Acute Care of Urinary Lithiasis", "4 · Urgent intervention", "<p>Colic → analgesia + NCCT → infection/AUA criterion? Yes → drainage only (stent/PCN) → definitive later. No → stone &lt;10 mm → trial ± MET 4–6 weeks → fails → URS/SWL</p>"], [9, "l", 21, "Ch 96 · Acute Care of Urinary Lithiasis", "5 · Special populations", "Pregnancy: hydronephrosis below iliac vessels suggests stone; resistive index difference ≥<span class=\"key\">0.06</span> = obstruction. ~30% need intervention; change stent/PCN every <span class=\"key\">4–6 weeks</span>; early gestation favours PCN; preterm delivery highest with PCN. <b>URS safe any trimester</b> (ACOG 2019)."], [9, "l", 22, "Ch 97 · Surgical Management of Ureteral Calculi", "1 · Background and indications", "MET controversial after SUSPEND <span class=\"xref\">→ Ch 96</span>; intervene after <span class=\"key\">4–6 weeks</span>. Ladder: SWL → URS → PCNL with antegrade URS."], [9, "p", 22, "Ch 97 · Surgical Management of Ureteral Calculi", "1 · Background and indications", "Why only URS tolerates anticoagulation: SWL and PCNL injure parenchyma where bleeding is unseen and uncontrollable; laser URS works intraluminally under vision."], [9, "r", 22, "Ch 97 · Surgical Management of Ureteral Calculi", "2 · Choosing treatment", "SWL · Historical limit 2 cm; SFR falls above <span class=\"key\">10–15 mm</span>"], [9, "p", 22, "Ch 97 · Surgical Management of Ureteral Calculi", "2 · Choosing treatment", "Constant trade-off: SWL = fewer complications, more sessions; URS = one session, slightly more morbidity."], [9, "r", 22, "Ch 97 · Surgical Management of Ureteral Calculi", "3 · Ureteroscopes", "Cost · Cheap · Repair ~every <span class=\"key\">15</span> cases · Low volume"], [9, "l", 23, "Ch 97 · Surgical Management of Ureteral Calculi", "4 · Access", "<b>Safety wire</b> advised (complexity unpredictable). Difficult ureter → stent, return after <span class=\"key\">2–4 weeks</span> (≥14 days for SFR; ≤4 weeks for lower sepsis)."], [9, "a", 23, "Ch 97 · Surgical Management of Ureteral Calculi", "4 · Access", "<p>Wire will not pass: open-ended catheter 1–2 mm short of stone → RPG → contrast hydrodissection + hydrophilic wire → advance catheter past stone → exchange for stiff wire</p>"], [9, "l", 24, "Ch 97 · Surgical Management of Ureteral Calculi", "5 · Lithotripsy", "<b>Thermal</b>: damage above <span class=\"key\">43 °C</span>; <b>heat tracks power, not laser type</b>. Cap <span class=\"key\">≤10 W in ureter</span>, ≤25 W kidney; sheath, continuous irrigation (stopping it → thermal stricture)."], [9, "l", 24, "Ch 97 · Surgical Management of Ureteral Calculi", "7 · SWL for ureteral calculi", "Technique <span class=\"xref\">→ Ch 98</span>: upper ureter supine, mid-ureter over sacrum <b>prone</b>, distal supine; <span class=\"key\">60–90 shocks/min</span> beats 120; ramp energy. Little gain beyond 2 sessions; salvage URS after failed SWL not harder. α-Blockers ↑ SFR; <b>forced diuresis useless</b>."], [9, "l", 24, "Ch 97 · Surgical Management of Ureteral Calculi", "8 · Special situations", "<b>Pregnancy</b>: conservative first; <b>SWL contraindicated</b>; URS safe with shielded fluoroscopy; stents encrust → change <span class=\"key\">every 4 weeks</span>; retrograde stent before nephrostomy."], [9, "p", 25, "Ch 97 · Surgical Management of Ureteral Calculi", "9 · Complications", "Nearly every serious URS complication is force without vision — blind basketing, forced sheaths, persistence in a tight ureter. Remedy: see, fragment, and when in doubt stop, stent and stage."], [9, "p", 26, "Ch 98 · Surgical Management of Upper Urinary Tract Calculi", "1 · Choosing the approach", "Only the stone domain is changed by choosing a modality; anatomy and patient factors decide which modality is available. Obesity, coagulopathy and pregnancy each exclude <i>a</i> modality, not surgery."], [9, "l", 26, "Ch 98 · Surgical Management of Upper Urinary Tract Calculi", "1 · Choosing the approach", "Truly asymptomatic = no symptoms, no sequelae (incl. no recurrent urinary tract infection [UTI]). <span class=\"key\">~50%</span> have a stone event within <b>5 years</b>."], [9, "l", 26, "Ch 98 · Surgical Management of Upper Urinary Tract Calculi", "1 · Choosing the approach", "Residual fragments <b>&gt;<span class=\"key\">4 mm</span></b> after ureteroscopy (URS) → treat."], [9, "l", 26, "Ch 98 · Surgical Management of Upper Urinary Tract Calculi", "1 · Choosing the approach", "SWL best: density <b>&lt;<span class=\"key\">900 HU</span></b>, skin-to-stone distance (SSD) <b>&lt;<span class=\"key\">10 cm</span></b>."], [9, "l", 27, "Ch 98 · Surgical Management of Upper Urinary Tract Calculi", "2 · Shock wave lithotripsy", "First human SWL 1980 (Dornier); electrohydraulic HM3 = efficacy benchmark <span class=\"tag\">MCQ</span>. Electromagnetic: consistent up to 10<sup>6</sup> shocks. Electrohydraulic focus drifts up to 1 cm."], [9, "l", 27, "Ch 98 · Surgical Management of Upper Urinary Tract Calculi", "2 · Shock wave lithotripsy", "<b>Absolute contraindications</b>: pregnancy; uncorrected coagulopathy/antithrombotics; untreated UTI; severe untreated hypertension; aortic/renal artery aneurysm (aorta &gt;<span class=\"key\">4 cm</span>); obstruction distal to stone; cannot target."], [9, "l", 27, "Ch 98 · Surgical Management of Upper Urinary Tract Calculi", "3 · Ureteroscopy (retrograde intrarenal surgery, RIRS)", "Landmarks <span class=\"tag\">MCQ</span>: Bozzini's Lichtleiter 1806 (first endoscope); Takayasu 1974 first ureteral access sheath (UAS)."], [9, "l", 28, "Ch 98 · Surgical Management of Upper Urinary Tract Calculi", "4 · Percutaneous nephrolithotomy", "Landmarks <span class=\"tag\">MCQ</span>: Fernström and Johansson 1976 first percutaneous stone removal; Wickham 1984 first tubeless; Valdivia-Uría 1987 first supine; Jackman 1998 first mini-perc (13 Fr)."], [9, "a", 29, "Ch 98 · Surgical Management of Upper Urinary Tract Calculi", "4 · Percutaneous nephrolithotomy", "<p>Confirm system and ureter clear → withdraw sheath under vision, safety wire last → compress tract → persistent bleeding: re-inflate balloon or <b>Kaye tamponade catheter</b> → alert anaesthetist → <b>selective angioembolisation</b></p>"], [9, "l", 31, "Ch 99 · Prevention of Urinary Stone Disease", "1 · Stone disease as a chronic condition", "Recurrence up to <span class=\"key\">50%</span> within 5–10 years. <b>ROKS</b> nomogram predicts a second stone (ROKS 2: multiple). Key risk: <b>low urine volume</b> (single most important); also young, male, obesity, family history, low citrate."], [9, "l", 31, "Ch 99 · Prevention of Urinary Stone Disease", "3 · General measures (all formers)", "<b>Fluid</b> — cornerstone. Urine ≥<span class=\"key\">2.5 L/day</span> (≈3 L intake)."], [9, "p", 31, "Ch 99 · Prevention of Urinary Stone Disease", "3 · General measures (all formers)", "Why normal calcium? Dietary calcium binds oxalate in the gut; restricting it frees oxalate for absorption."], [9, "l", 31, "Ch 99 · Prevention of Urinary Stone Disease", "4 · Hypercalciuria — thiazides", "<b>Preferred drug</b> (American Urological Association, AUA): hypercalciuria with recurrent calcium stones, <b>and</b> recurrent calcium stones with normal evaluation. Yendt 1966 <span class=\"tag\">MCQ</span>."], [9, "l", 32, "Ch 99 · Prevention of Urinary Stone Disease", "6 · Hypocitraturia", "<b>pH ≥7</b> → <b>calcium phosphate</b> risk. <b>Alkali citrate, not total citrate, matters</b>; orange juice also raises oxalate; Moonstone supplement acidic <span class=\"tag\">MCQ</span>."], [9, "a", 32, "Ch 99 · Prevention of Urinary Stone Disease", "8 · Cystine stones", "<p><b>Dilute</b> (urine ≥<span class=\"key\">3 L/day</span> including at night; sodium ≤2300 mg/day; moderate protein — not in children) → cystine &lt;<span class=\"key\">250 mg/L</span> → <b>alkalinise</b> with potassium citrate to pH <span class=\"key\">7.0–7.5</span> → <b>thiol</b> (tiopronin)</p>"], [9, "l", 33, "Ch 99 · Prevention of Urinary Stone Disease", "9 · Infection (struvite) stones", "<b>Acetohydroxamic acid (AHA)</b>: urease inhibitor. AUA: only for residual/recurrent struvite after surgical options exhausted. Toxicity ~30%: haemolytic anaemia, <b>deep venous thrombosis</b> (most severe), tremor, headache. Contraindicated: creatinine &gt;<span class=\"key\">2.5 mg/dL</span>, pregnancy."], [9, "a", 33, "Ch 99 · Prevention of Urinary Stone Disease", "10 · Monitoring", "<p>Start therapy
