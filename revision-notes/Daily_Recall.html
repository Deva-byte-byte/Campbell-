<style>
/* Layout: one calm column (max 760px). A sticky bar holds the day switcher and the two views (Today, Book core).
   Palette follows the printed zen timetable: sage, mist blue, clay, mauve on warm paper; yellow marker for numbers to memorise. */
:root{
  --bg:#f6f4ef; --surface:#fffdf9; --fg:#24272a; --muted:#5d636a; --faint:#8a8f95; --line:#e4e0d8;
  --sage:#4f8079; --sage-soft:#e6efed; --mist:#566c99; --clay:#a8743f; --mauve:#86647f; --leaf:#557446;
  --sand:#f4ecdc; --gold:#8f6c22; --mark:#ffe58a; --mark-fg:#24272a; --cloze:#c9c4b8;
  --f-read:"Literata", Georgia, "Times New Roman", serif;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141615; --surface:#1b1e1d; --fg:#e6e8e6; --muted:#a6aca9; --faint:#7d837f; --line:#2c312f;
  --sage:#7fb8af; --sage-soft:#1c2c29; --mist:#94a8d6; --clay:#d9a26b; --mauve:#c49bbd; --leaf:#93bb7f;
  --sand:#2a2519; --gold:#e1bd6b; --mark:#5f5112; --mark-fg:#fff3c4; --cloze:#4a4d4b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141615; --surface:#1b1e1d; --fg:#e6e8e6; --muted:#a6aca9; --faint:#7d837f; --line:#2c312f;
  --sage:#7fb8af; --sage-soft:#1c2c29; --mist:#94a8d6; --clay:#d9a26b; --mauve:#c49bbd; --leaf:#93bb7f;
  --sand:#2a2519; --gold:#e1bd6b; --mark:#5f5112; --mark-fg:#fff3c4; --cloze:#4a4d4b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 80px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--bg)}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:5px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sage);color:var(--surface)}
.daynav{display:flex;align-items:center;gap:4px;margin-left:auto}
.daynav button,.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 11px;cursor:pointer}
.daynav button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:3px solid var(--sage);outline-offset:2px}
.invoc{text-align:center;color:#b3261e;font-family:"Noto Serif Devanagari","Tiro Devanagari Hindi",var(--f-read);font-size:15px;margin:2px 0 8px}
:root[data-theme="dark"] .invoc{color:#ff8a80}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .invoc{color:#ff8a80}}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600}
h1{font-family:var(--f-read);font-weight:400;font-size:clamp(30px,7vw,42px);line-height:1.08;margin:4px 0 2px;text-wrap:balance}
.lede{font-family:var(--f-read);font-style:italic;color:var(--muted);margin:0 0 14px}
.track{display:flex;gap:3px;margin:6px 0 18px}
.track i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.track i.done{background:var(--sage)} .track i.now{background:var(--clay)} .track i.buf{background:var(--sand);outline:1px solid var(--gold)}
.block{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.block h2{font-family:var(--f-read);font-weight:400;font-size:21px;margin:0 0 2px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.block .when{font-size:13px;color:var(--faint);letter-spacing:.04em}
.block p{margin:6px 0}
.tag{display:inline-block;font-size:12px;font-weight:700;border:1.2px solid currentColor;border-radius:999px;padding:0 7px;margin-right:6px;line-height:1.5;vertical-align:1px}
.t0{color:var(--sage)} .t1{color:var(--mist)} .t2{color:var(--clay)} .t3{color:var(--mauve)}
.ranges{font-size:17px}
.ranges .r{display:block;margin:3px 0}
.meta{font-size:13.5px;color:var(--muted)}
.bk{color:var(--leaf);font-weight:600}
a.open{font-size:13.5px;font-weight:600;color:var(--sage);text-decoration:none;border-bottom:1px solid var(--sage-soft)}
a.open:hover{border-bottom-color:var(--sage)}
.done{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none;width:max-content}
.done input{width:18px;height:18px;accent-color:var(--sage)}
.recall-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.toggle{font:inherit;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer}
.toggle[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.src{font-size:13px;color:var(--muted);margin:14px 0 4px;font-weight:600;letter-spacing:.02em}
.ch{font-family:var(--f-read);font-size:16px;font-weight:600;margin:16px 0 2px;color:var(--fg)}
.h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:10px 0 2px;font-weight:600}
ul.core{list-style:none;padding:0;margin:0}
ul.core li{font-family:var(--f-read);font-size:16.5px;padding:7px 0 7px 14px;border-bottom:1px solid var(--line);position:relative}
ul.core li::before{content:"";position:absolute;left:0;top:15px;width:5px;height:5px;border-radius:50%;background:var(--faint)}
ul.core li.k-p::before{background:var(--sage)} ul.core li.k-a::before{background:var(--mist)} ul.core li.k-m::before{background:var(--clay)} ul.core li.k-r::before{background:var(--mauve)}
ul.core li .kind{font-family:var(--f-ui);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.k-p .kind{color:var(--sage)} .k-a .kind{color:var(--mist)} .k-m .kind{color:var(--clay)} .k-r .kind{color:var(--mauve)}
ul.core li .pg{font-family:var(--f-ui);font-size:11.5px;color:var(--faint);margin-left:6px;white-space:nowrap}
ul.core li p{margin:2px 0}
ul.core li ul,ul.core li ol{margin:4px 0 2px 18px;padding:0}
.key{background:var(--mark);color:var(--mark-fg);font-weight:700;padding:0 3px;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.cloze .key{background:var(--cloze);color:transparent;cursor:pointer;user-select:none}
.cloze .key.shown{background:var(--mark);color:var(--mark-fg)}
.dag{color:var(--clay);font-weight:700}
.tagx,.tagm{font-family:var(--f-ui);font-size:10.5px;font-weight:700;color:var(--clay);border:1px solid currentColor;border-radius:4px;padding:0 4px}
.xref{font-family:var(--f-ui);font-size:13px;color:var(--sage)}
.buf{background:var(--sand);border-color:transparent}
.buf h2{color:var(--gold)}
.empty{font-family:var(--f-read);font-style:italic;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip[aria-pressed="true"]{background:var(--sage);border-color:var(--sage);color:var(--surface)}
#q{font:inherit;font-size:15px;width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);margin:4px 0 8px}
.count{font-size:13px;color:var(--muted)}
mark.hit{background:var(--sage);color:var(--surface);border-radius:2px}
.more{font:inherit;font-size:14px;font-weight:600;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:8px;width:100%;margin-top:10px;cursor:pointer}
.hide{display:none!important}
@media (max-width:480px){.daynav{margin-left:0;width:100%;justify-content:space-between}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

p": [["P4", 46, 168]], "np": 123, "cut": "P4 p.150", "nb": 29, "bb": [[15, 1, 29]]}, {"n": 26, "date": "2026-11-24", "pp": [["P4", 169, 291]], "np": 123, "cut": "P4 p.273", "nb": 28, "bb": [[15, 30, 57]]}, {"n": 27, "date": "2026-11-25", "buf": 1}], "items": [[0, "a", 2, "Ch 24 · Basic Principles of Immunology and Immunotherapy in Urologic Oncology", "1 · Innate and adaptive immunity", "<p>Danger signal (TNF-α, TLR ligand) → DC stops antigen uptake → ↑ MHC + B7-1/B7-2 → afferent lymphatics (CCL21 sensed by CCR7) → activates CD4, CD8, B cells in node</p>"], [0, "p", 2, "Ch 24 · Basic Principles of Immunology and Immunotherapy in Urologic Oncology", "2 · Immune editing and escape", "PD-L1 is largely induced by the immune attack itself — a marker of an ongoing but suppressed response, not a fixed tumour trait."], [0, "a", 3, "Ch 24 · Basic Principles of Immunology and Immunotherapy in Urologic Oncology", "4 · BCG in bladder cancer", "<p>Instil 1–5 × 10<sup>8</sup> bacilli → adhere via <b>fibronectin attachment protein</b> → TLR2/TLR4 on urothelium → IL-8 + TNF-α → neutrophil wave (hours) → DC activation → CD4 Th1 in nodes (weeks) → memory</p>"], [0, "l", 3, "Ch 24 · Basic Principles of Immunology and Immunotherapy in Urologic Oncology", "4 · BCG in bladder cancer", "Memory implied by ~<span class=\"key\">50%</span> of NMIBC in durable remission."], [0, "l", 3, "Ch 24 · Basic Principles of Immunology and Immunotherapy in Urologic Oncology", "5 · Cancer vaccines", "Sipuleucel-T: OS <span class=\"key\">+4.1 months</span>, <b>no effect on time to progression</b>; first FDA-approved solid-tumour vaccine."], [0, "l", 3, "Ch 24 · Basic Principles of Immunology and Immunotherapy in Urologic Oncology", "6 · Checkpoint blockade", "First-line pembrolizumab alone (KEYNOTE-052): only cisplatin-ineligible with CPS <span class=\"key\">≥10</span>, or any-platinum-ineligible; CPS &lt;10 did worse than carboplatin."], [0, "p", 4, "Ch 24 · Basic Principles of Immunology and Immunotherapy in Urologic Oncology", "6 · Checkpoint blockade", "Every successful GU immunotherapy either supplies a danger signal (BCG, adjuvant, immunogenic cell death, VEGF inhibition) or removes a brake (PD-1, CTLA-4). Failures cluster where the brake is not limiting — PD-L1-negative, Treg-dominated prostate cancer."], [0, "a", 5, "Ch 25 · Molecular Genetics and Cancer Biology", "3 · Cell cycle", "<p>Hypophosphorylated RB1 binds E2F + HDACs → S-phase genes silent → cyclin D–CDK4/6, cyclin E–CDK2 hyperphosphorylate RB1 → E2F released → S-phase genes transcribed → restriction point passed (irreversible)</p>"], [0, "p", 6, "Ch 25 · Molecular Genetics and Cancer Biology", "3 · Cell cycle", "Cancer must break both RB1 (entry) and TP53 (integrity) — so both pathways are lost in almost every tumour."], [0, "p", 6, "Ch 25 · Molecular Genetics and Cancer Biology", "4 · DNA damage and repair", "Repair defects are targets: HR loss → PARP inhibitor (synthetic lethality); MMR loss → immunotherapy; ERCC2 loss → cisplatin sensitivity."], [0, "l", 7, "Ch 25 · Molecular Genetics and Cancer Biology", "6 · Senescence, telomeres, autophagy", "Telomerase high in <span class=\"key\">85–90%</span> of tumours."], [0, "a", 7, "Ch 25 · Molecular Genetics and Cancer Biology", "8 · Hypoxia, VHL and angiogenesis", "<p>Normoxia: HIF-α prolyl-hydroxylated → bound by VHL (E3 ubiquitin ligase) → proteasomal degradation. Hypoxia or VHL loss: HIF-α accumulates → dimerises with HIF-1β → VEGF, angiopoietin, glycolytic genes</p>"], [0, "p", 7, "Ch 25 · Molecular Genetics and Cancer Biology", "8 · Hypoxia, VHL and angiogenesis", "VHL loss = permanent pseudohypoxia; angiogenesis, Warburg metabolism, invasion and immunosuppression follow — why clear cell RCC responds to VEGF, HIF-2α and immune blockade."], [0, "p", 8, "Ch 25 · Molecular Genetics and Cancer Biology", "9 · GU tumour genomics", "The germline syndrome names the somatic driver (VHL → clear cell, MET → papillary, FH → type 2, BRCA → prostate) and the driver names the drug (HIF-2α, MET TKI, PARP, FGFR inhibitor, immunotherapy for MMR loss)."], [0, "l", 10, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "1 · Normal development and penile size", "<b>Stretched penile length (SPL)</b>: pubis (fat pad compressed) to glans tip; correlates with erect length. Term <span class=\"key\">3.5 ± 0.7 cm</span> (diameter 1.1 cm); adult 13.3 ± 1.6 cm."], [0, "l", 10, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "1 · Normal development and penile size", "Micropenis cut-off (−2.5 SD): <span class=\"key\">1.9 cm</span> term–5 months; 1.5 cm at 30 weeks, 2.0 cm at 34 weeks; ≈ 3.7–3.9 cm at 5–11 years; adult 9.3 cm. Compare with cut-off, not mean."], [0, "l", 10, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "2 · Prepuce: phimosis and paraphimosis", "<b>Physiological phimosis</b> at birth; smegma and erections separate prepuce: ≈ <span class=\"key\">90% retractable by 3 years</span>, &lt; 1% phimotic at 17 years. Forceful retraction → cicatricial (secondary) phimosis."], [0, "l", 11, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "3 · Circumcision", "<b>Benefits</b>: penile cancer almost only in men not circumcised at birth; lower febrile infant UTI (to ≥ 5 years), but <span class=\"key\">111</span> circumcisions prevent one UTI; less epididymitis, balanitis; ≈ <span class=\"key\">60%</span> protection against HIV acquisition in men (no reduction in transmission to partners); lower HSV-2, high-risk HPV; no proven sexual dysfunction. Neonatal more cost-effective."], [0, "l", 11, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "3 · Circumcision", "Amputated glans: re-attach within <span class=\"key\">8 h</span>. Penile necrosis (cautery on clamp): phallic reconstruction vs female reassignment — latter problematic (androgen imprinting)."], [0, "p", 11, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "3 · Circumcision", "Late sequelae are problems of skin quantity (too much → trapped penis, chordee, torsion; too little → redundancy, adhesions) or of the newly exposed meatus (stenosis)."], [0, "p", 11, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "4 · Inconspicuous penis versus micropenis", "<b>Stretched length is the single discriminator.</b> Inconspicuous penis (buried, webbed, trapped) = normal SPL and diameter hidden by skin, fat or scar → anatomical treatment. Micropenis = small but normally formed → endocrine work-up."], [0, "l", 12, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "4 · Inconspicuous penis versus micropenis", "Normally formed, ≥ 2.5 SD below mean (&lt; <span class=\"key\">1.9 cm</span> at term); normal length:girth ratio. Testes often small/cryptorchid."], [0, "a", 12, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "4 · Inconspicuous penis versus micropenis", "<p>History, exam, <b>karyotype</b>, SPL → paediatric endocrinologist → testosterone before/after hCG (± GnRH test) → anterior pituitary screen (glucose, Na/K, cortisol, thyroid) → MRI brain → <b>end-organ response: IM testosterone enanthate × 3 months</b> (short courses do not affect height; prolonged advance bone age); repeat at puberty.</p>"], [0, "l", 14, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "9 · Scrotal anomalies", "<b>Penoscrotal transposition</b>: failed inferomedial migration; partial (shawl, doughnut, prepenile). Associations: perineal/scrotal hypospadias, caudal regression, sex chromosome anomalies, Aarskog–Scott; complete form: <span class=\"key\">up to 75%</span> upper-tract anomalies → renal US + VCUG. Repair (with hypospadias): <b>rotation-flap scrotoplasty</b>."], [0, "a", 15, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "10 · Inguinal hernia and hydrocele", "<p>Skin-crease incision → open external oblique, spare ilioinguinal nerve (young infants: rings coincide — Mitchell-Banks, not opened) → split cremaster → sac anteromedial → separate from vas/vessels → <b>high ligation</b> at internal ring → tighten wide ring → <b>confirm testis scrotal</b>.</p>"], [0, "l", 15, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "10 · Inguinal hernia and hydrocele", "Contralateral patency ≈ 40% infants, but metachronous hernia only ≈ <span class=\"key\">7%</span> → against routine contralateral exploration; laparoscopy via sac &gt; 99% accurate."], [0, "r", 16, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "11 · Acute scrotum", "Orchidectomy risk · <span class=\"key\">≈ 5%</span> · 20% · 40% · 60% · 80% · 90%"], [0, "a", 16, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "11 · Acute scrotum", "<p>Suspected torsion → scrotal exploration → detorse, warm packs → <b>meanwhile fix contralateral testis with non-absorbable suture</b> → reassess: viable → dartos pouch/fixation (non-absorbable); non-viable → orchidectomy; prosthesis later.</p>"], [0, "l", 17, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "12 · Adolescent varicocele", "Prevalence ≈ <span class=\"key\">15%</span>; after 10 years, peaks Tanner 3; tall thin boys; familial."], [0, "p", 17, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "12 · Adolescent varicocele", "<b>Indications for repair</b>: left testis &gt; <span class=\"key\">20%</span> smaller (or bilateral hypotrophy), pain, abnormal semen (Tanner 5 / ≥ 18 y), intratesticular varicocele with asymmetry. Total volume &lt; 30 mL and low total motile count predict poor semen."], [0, "p", 18, "Ch 58 · Management of Abnormalities of the Genitalia in Girls", "2 · Evaluation and classification", "Decision hinge: <b>is it obstructive?</b> Obstruction needs prompt drainage; non-obstructive anomalies wait until intercourse or fertility demands surgery."], [0, "p", 19, "Ch 58 · Management of Abnormalities of the Genitalia in Girls", "4 · Vestibule: the interlabial mass", "Read every mass against the meatus: central (prolapse), displaced (Skene), separate/vaginal (Gartner, ectopic ureter, hymen, tumour). Urethral- or vaginal-origin cyst → <b>always renal US</b>."], [0, "l", 19, "Ch 58 · Management of Abnormalities of the Genitalia in Girls", "5 · Vagina: obstruction and absence", "Renal anomaly ≈ <span class=\"key\">one-third</span>; skeletal 10–20%; no lumbosacral dysraphism. <b>Type A</b>: symmetrical buds, normal tubes, no extra-müllerian anomaly. <b>Type B</b>: asymmetrical, renal/Klippel–Feil/MURCS → full renal and skeletal work-up."], [0, "p", 20, "Ch 58 · Management of Abnormalities of the Genitalia in Girls", "6 · Vaginal replacement", "<b>Cervical atresia</b>: perineum-to-uterus anastomosis loses the endocervical barrier → life-threatening ascending infection. Hysterectomy + neovagina often best; otherwise endometrial suppression and IVF with transmyometrial transfer."], [0, "l", 20, "Ch 58 · Management of Abnormalities of the Genitalia in Girls", "8 · Acquired disorders", "<b>Vaginal rhabdomyosarcoma</b>: grapelike bleeding mass, &lt;2 years; best prognosis of genital primaries (embryonal). Biopsy → CT + marrow → chemotherapy ± resection. IRS trials cut surgery from <span class=\"key\">100% to 13%</span>."], [0, "p", 21, "Ch 59 · Differences of Sexual Development", "2 · Normal sex development", "The testis uses two separate hormones: AMH removes Müllerian ducts, testosterone/DHT builds Wolffian and external structures. A uterus in 46,XY means Sertoli (AMH) failure — dysgenesis, not a synthesis or receptor defect."], [0, "l", 22, "Ch 59 · Differences of Sexual Development", "4 · 46,XX DSD", "Commonest 46,XX DSD and <b>commonest cause of neonatal atypical genitalia</b>. 21-OHD = <span class=\"key\">95%</span> of CAH; AR, ≈ 1 in 15,000. Cortisol ↓ → ACTH ↑ → androgen excess; aldosterone ↓ → <b>salt wasting</b>."], [0, "l", 22, "Ch 59 · Differences of Sexual Development", "4 · 46,XX DSD", "<b>↑17-OHP</b> after <span class=\"key\">36 h</span>; also ↑androstenedione, testosterone, renin; ↓cortisol; cosyntropin test."], [0, "l", 22, "Ch 59 · Differences of Sexual Development", "4 · 46,XX DSD", "<b>Salt-wasting crisis</b> (↓Na, ↑K, acidosis, shock) usually not before <span class=\"key\">day 5–7</span>. Glucocorticoid + mineralocorticoid + salt (<span class=\"dag\">†</span>hydrocortisone ≈ 10–15 mg/m²/day, fludrocortisone, NaCl in infancy; double-to-triple in illness/surgery)."], [0, "r", 23, "Ch 59 · Differences of Sexual Development", "5 · 46,XY DSD", "<b>5α-reductase 2</b> · AR; atypical/female at birth, blind pouch; <b>virilises at puberty</b>, fertility reported; T:DHT <span class=\"key\">&gt;20:1</span>; \"guevedoces\" (Imperato-McGinley 1979)"], [0, "p", 24, "Ch 59 · Differences of Sexual Development", "7 · Evaluation of the newborn with atypical genitalia", "<b>Emergency</b>: atypical genitalia with bilateral impalpable gonads = salt-wasting CAH until proven otherwise. Check electrolytes and 17-OHP; watch for crisis from the end of week 1. Designation and surgery are not emergencies."], [0, "l", 24, "Ch 59 · Differences of Sexual Development", "7 · Evaluation of the newborn with atypical genitalia", "MDT review within <span class=\"key\">24–48 h</span>; \"your baby\", never \"it\". Urologist without a team → transfer early."], [0, "a", 24, "Ch 59 · Differences of Sexual Development", "7 · Evaluation of the newborn with atypical genitalia", "<p>Karyotype (≥45 cells; FISH X/Y in hours) + electrolytes + 17-OHP at ≈ 36 h → pelvic US (uterus, gonads) → at ≈ 1 week: LH, FSH, testosterone, oestrogen, androstenedione, DHT, AMH ± hCG stimulation → genetic panel/microarray/exome → if unclear: MRI, genitography, endoscopy, laparoscopy ± biopsy (<b>no gonadectomy during diagnosis</b>)</p>"], [0, "l", 24, "Ch 59 · Differences of Sexual Development", "7 · Evaluation of the newborn with atypical genitalia", "Precise diagnosis nearly always in 46,XX DSD but <span class=\"key\">&lt;50%</span> of 46,XY. Late presenters: CAIS, Swyer, MRKH, Turner + Y, Klinefelter, 5α-reductase. After puberty: ↑gonadotropins + ↓sex steroid → gonadal failure; ↑LH + ↑testosterone with female genitalia → CAIS. Examine adolescents with few clinicians, only when management may change."], [0, "l", 26, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "2 · Urogenital sinus and cloaca — classification", "CAH: half of all newborn atypical genitalia, <span class=\"key\">90%</span> of 46,XX; salt wasting <span class=\"key\">67–75%</span>; karyotype within <span class=\"key\">48 h</span>."], [0, "p", 26, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "2 · Urogenital sinus and cloaca — classification", "<b>Governing principle</b>: <b>true urethral length</b> (bladder neck → confluence) decides the operation far more than common-channel length, in sinus and cloaca. Confluence level is a continuum, not just \"high\" vs \"low\"."], [0, "l", 26, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "2 · Urogenital sinus and cloaca — classification", "<b>Ganesan concept</b> <span class=\"tag\">MCQ</span>: in CAH the proximal urethra is normal (bladder neck to confluence <span class=\"key\">1.5–2 cm</span> in infants); virilisation lengthens <b>vagina-to-meatus</b> distance, so \"high\" CAH confluence is an illusion."], [0, "l", 26, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "3 · Clinical evaluation", "<b>Huffman index</b> (glans width × length): normal <span class=\"key\">&lt;3.5 mm²</span>, concern <span class=\"key\">&gt;10 mm²</span>. Isolated clitoral hypertrophy in a preterm is not a DSD."], [0, "r", 27, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "3 · Clinical evaluation", "Uterovaginal · Duplication/septation · <span class=\"key\">53–67%</span>"], [0, "p", 27, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "3 · Clinical evaluation", "Two early dangers: <b>adrenal crisis</b> (CAH) and <b>obstructive hydrocolpos</b> (pure sinus, cloaca). Number of perineal orifices tells you which world you are in."], [0, "r", 28, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "5 · DSD reconstruction — timing and consent", "<b>After puberty</b> · Infant stenosis; avoids dilation; consent; delay the small vagina (<span class=\"key\">&lt;3 cm</span>)"], [0, "p", 28, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "5 · DSD reconstruction — timing and consent", "Both camps invoke oestrogen (maternal vs pubertal). Without comparative data the decision is ethical, not evidential; it rests with parents and team. Endocrine Society CAH guideline (2018): families with experienced surgeons decide; 2006 consensus limits surgery to Prader III–IV."], [0, "p", 29, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "6 · Operative principles", "Ask: <b>must the confluence be moved?</b> Flap brings skin to a low vagina; pull-through takes a high vagina off the urethra. Flap on a high confluence is the classic error."], [0, "a", 29, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "7 · Low confluence repair", "<p>Metabolic stability → <b>stress-dose steroids in CAH</b> → antibiotics → endoscopy → <b>Fogarty in vagina</b> + Foley in bladder → total lower-body prep (supine–prone rotation; lithotomy blocks conversion)</p>"], [0, "a", 29, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "7 · Low confluence repair", "<p>Glans traction suture → incise around glans, keep inner prepuce for hood (<b>second only to glans in sensitivity</b>) → strips beside ventral mucosal plate → omega flap → Y-incisions on labia majora → deglove to bifurcation, ventral plate intact</p>"], [0, "a", 29, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "7 · Low confluence repair", "<p>Flap vaginoplasty: omega flap with fat → posterior sinus off rectum (<b>hardest step</b>) → open posterior sinus in midline into posterior vaginal wall → <b>continue to normal-calibre vagina</b> → inset flap</p>"], [0, "p", 29, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "7 · Low confluence repair", "Two fixed points: never touch the dorsal neurovascular bundle; always open back to normal-calibre vagina."], [0, "l", 29, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "8 · High confluence: pull-through", "Only ≈ <span class=\"key\">5%</span> of CAH; commoner in pure sinus."], [0, "a", 30, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "8 · High confluence: pull-through", "<p>Prone → midline between sinus and rectum → divide sinus to normal vagina → retractor inside vagina → anterior wall off urethra <b>under direct vision</b> → close sinus as urethra in 2–3 layers → mobilise vagina → supine: flaps + labioplasty</p>"], [0, "l", 30, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "10 · Outcomes of sinus/DSD surgery", "Infant vaginoplasty → <b>secondary introitoplasty</b> after puberty in <span class=\"key\">25–100%</span> (orifice does not grow); revision easy."], [0, "l", 30, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "10 · Outcomes of sinus/DSD surgery", "<b>Azziz (1986)</b> <span class=\"tag\">MCQ</span>: poor coitus rates, but almost all <b>cut-back</b> — not applicable now."], [0, "l", 30, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "10 · Outcomes of sinus/DSD surgery", "<b>Elmasri meta-analysis (2018)</b>: mean age 2.7 years; female identity ≈ 89%; vaginal stenosis <span class=\"key\">27%</span>; only half comfortable intercourse; no early-vs-late comparison."], [0, "a", 30, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "11 · Cloaca — initial management", "<p>(1) Decompress bowel → (2) decompress genitourinary tract → (3) correct nephron-destructive anomalies → (4) definitive repair</p>"], [0, "l", 31, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "11 · Cloaca — initial management", "<b>Kidneys</b>: structural anomalies <span class=\"key\">60–83%</span>; CKD <span class=\"key\">75%</span>, ESRD <span class=\"key\">17%</span>. Urodynamics abnormal in <span class=\"key\">90%</span>. Reflux managed medically if UTI prevented."], [0, "p", 31, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "12 · Cloaca — definitive repair", "Why 1.5 cm? Urethra &gt;1.5 cm keeps the bladder neck above the urogenital diaphragm; mobilising a shorter one drags it below the continence mechanism → leakage."], [0, "a", 31, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "12 · Cloaca — definitive repair", "<p><b>PSARVUP (Peña)</b>: catheters in each channel → <b>prone jackknife</b> → muscle stimulator marks anal site → midline incision → open rectal fistula, mobilise rectum → TUM or vaginal separation → urethra in 2–3 layers + <b>fat flap</b> → perineal body → rectum centred in sphincter</p>"], [0, "l", 31, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "13 · Cloaca — results and follow-up", "<b>Urinary</b>: about half void spontaneously; Peña: CIC <span class=\"key\">28%</span> (channel &lt;3 cm) vs <span class=\"key\">78%</span> (&gt;3 cm). Lifelong yearly review; LPP &gt;40 cm H₂O common despite normal spinal MRI."], [0, "l", 31, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "13 · Cloaca — results and follow-up", "<b>Gynaecological</b>: introital stenosis, retained septum, fistula, deficient perineal body; about half of outside repairs need redo; vaginal stenosis/obstructed menstruation <span class=\"key\">36–41%</span>; pregnancy possible, <b>caesarean preferred</b>. Leave atretic genitalia."], [0, "a", 32, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "13 · Cloaca — results and follow-up", "<p>US <b>6–9 months after thelarche</b> → repeat every 6–9 months until menses normal</p>"], [0, "p", 33, "Ch 65 · Adolescent and Transitional Urology", "1 · Definitions", "Evidence looks weak because the wrong endpoint is measured. Renal function and HbA1c are expected to worsen, so <b>stability and retention in follow-up</b> are success; fewer are lost when actively transitioned."], [0, "l", 33, "Ch 65 · Adolescent and Transitional Urology", "3 · The process", "Begin ≈ <span class=\"key\">12 years</span> (AAP); complete by late teens–early 20s; <span class=\"key\">26</span> = latest (US parental insurance). If independence unachievable, plan custodianship."], [0, "p", 34, "Ch 65 · Adolescent and Transitional Urology", "3 · The process", "Transfer is not the endpoint: transition ends only when integration into adult care is confirmed."], [0, "l", 34, "Ch 65 · Adolescent and Transitional Urology", "5 · Development and consent", "Phallic–oedipal period (<b>3–6 years</b>) → avoid genital surgery; first year → avoid separation. Genital surgery: theory and 1975 AAP panel favour <span class=\"key\">&lt;6 months</span>."], [0, "l", 35, "Ch 120 · Aging and Geriatric Urology", "1 · Concepts and biology", "\"Geriatrics\" first used clinically by Nascher (1909) <span class=\"tag\">MCQ</span>."], [0, "l", 35, "Ch 120 · Aging and Geriatric Urology", "1 · Concepts and biology", "<b>Cellular senescence</b> (irreversible replication arrest) drives ageing: replicative, via telomere shortening — <b>Hayflick limit</b> (1961) <span class=\"tag\">MCQ</span>; or stress-induced (ROS, radiation, DNA damage)."], [0, "a", 35, "Ch 120 · Aging and Geriatric Urology", "2 · Clinical evaluation", "<p>Frailty screen before elective major surgery (SPAQI) → positive → diagnostic frailty assessment → comprehensive geriatric assessment (CGA)</p>"], [0, "r", 35, "Ch 120 · Aging and Geriatric Urology", "3 · Geriatric syndromes", "Cut-off · Continuous · <span class=\"key\">≥3 frail; 1–2 pre-frail</span>"], [0, "p", 36, "Ch 120 · Aging and Geriatric Urology", "3 · Geriatric syndromes", "Four recurring mechanisms: anticholinergic burden, renal threshold (CrCl &lt;30), warfarin potentiation, sodium disturbance."], [0, "l", 36, "Ch 120 · Aging and Geriatric Urology", "4 · Incontinence management", "UI in three-quarters of long-stay residents; drives admission. Catheter colonisation <span class=\"key\">98%</span> → treating ASB harms."], [0, "p", 37, "Ch 120 · Aging and Geriatric Urology", "4 · Incontinence management", "A positive culture alone never qualifies; catheterised residents cannot report local symptoms, so systemic signs are used."], [0, "l", 37, "Ch 120 · Aging and Geriatric Urology", "6 · Cancer, end of life", "<b>Prostate</b>: USPSTF grade D — no PSA screening &gt;70; life expectancy <span class=\"key\">&lt;10 years</span> → non-curative plan."], [0, "p", 37, "Ch 120 · Aging and Geriatric Urology", "6 · Cancer, end of life", "Undertreatment by age (skipped restaging, withheld cystectomy) is as real a risk as overtreatment. Fitness and life expectancy decide."], [0, "r", 38, "Ch 126 · Management and Considerations in Transgender and Nonbinary Individuals", "2 · Diagnosis and assessment", "Criteria · Marked incongruence ≥<span class=\"key\">6 months</span>, significant distress or impairment, not solely due to prejudice · Marked, persistent incongruence; desire for characteristics/treatment of experienced gender"], [0, "p", 39, "Ch 126 · Management and Considerations in Transgender and Nonbinary Individuals", "2 · Diagnosis and assessment", "SOC-8 replaces gatekeeping with informed, capacity-based consent; capacity and fertility counselling stay firm because consequences are irreversible."], [0, "p", 39, "Ch 126 · Management and Considerations in Transgender and Nonbinary Individuals", "3 · Gender-affirming hormone therapy (GAHT)", "<b>Why the asymmetry?</b> Physiological oestrogen alone does not suppress testosterone to female range → transfeminine therapy needs two components; testosterone suppresses the ovarian axis unaided → one."], [0, "l", 39, "Ch 126 · Management and Considerations in Transgender and Nonbinary Individuals", "3 · Gender-affirming hormone therapy (GAHT)", "<b>Ethinyl oestradiol not recommended</b> (~20-fold thrombosis; unmeasurable). Oral 17β-oestradiol, target <span class=\"key\">100–200 pg/mL</span>. <b>Transdermal if VTE risk</b>: age &gt;45 or previous VTE."], [0, "l", 39, "Ch 126 · Management and Considerations in Transgender and Nonbinary Individuals", "3 · Gender-affirming hormone therapy (GAHT)", "Monitor levels 3-monthly in year 1, then 1–2×/year; target testosterone <span class=\"key\">&lt;50 ng/dL</span>; electrolytes/creatinine on spironolactone; prolactin; stop smoking."], [0, "l", 39, "Ch 126 · Management and Considerations in Transgender and Nonbinary Individuals", "3 · Gender-affirming hormone therapy (GAHT)", "<b>After gonadectomy: reduce oestrogen by <span class=\"key\">50–75%</span></b> (titrate to LH/FSH, bone density) and <b>stop the antiandrogen</b>."], [0, "l", 39, "Ch 126 · Management and Considerations in Transgender and Nonbinary Individuals", "3 · Gender-affirming hormone therapy (GAHT)", "Target testosterone <span class=\"key\">300–1000 ng/dL</span>. Persistent menses → progestin or endometrial ablation."], [0, "r", 40, "Ch 126 · Management and Considerations in Transgender and Nonbinary Individuals", "5 · Fertility preservation", "Standard · <b>Sperm cryopreservation</b>; hold GAHT ≥<span class=\"key\">3 months</span> before collection · <b>Oocyte or embryo cryopreservation</b> after ovarian stimulation"], [0, "l", 40, "Ch 126 · Management and Considerations in Transgender and Nonbinary Individuals", "6 · Cancer screening — screen the organ, not the gender", "<b>Prostate (transfeminine)</b>: rare, may be aggressive (GAHT after 50). Shared decision on PSA at 55–69. <b>On GAHT, upper limit <span class=\"key\">1 ng/mL</span> or rise ≥<span class=\"key\">0.3 ng/mL</span> from nadir</b> <span class=\"dag\">†</span>(androgen suppression lowers PSA). After full-depth vaginoplasty, palpate via <b>anterior neovaginal wall</b>; biopsy transrectal, perineal or transneovaginal."], [0, "r", 42, "Ch 127 · Male-to-Female Gender-Affirming Surgery: Vaginoplasty", "1 · Aim and preparation", "Hormones before gonadectomy · <span class=\"key\">6 months</span> suffices (experience testosterone blockade before irreversible change)"], [0, "p", 42, "Ch 127 · Male-to-Female Gender-Affirming Surgery: Vaginoplasty", "1 · Aim and preparation", "SOC8 replaces thresholds to clear with information to receive; capacity and fertility counselling stay mandatory."], [0, "l", 42, "Ch 127 · Male-to-Female Gender-Affirming Surgery: Vaginoplasty", "1 · Aim and preparation", "Stay within <span class=\"key\">1 hour's drive</span> of hospital for the first <span class=\"key\">3 weeks</span>; record affirmed name/gender; confirm support for dilation."], [0, "l", 42, "Ch 127 · Male-to-Female Gender-Affirming Surgery: Vaginoplasty", "1 · Aim and preparation", "<b>BMI</b>: main factor in wound healing; no proven cut-off, many require <span class=\"key\">≤35 kg/m²</span>; higher may suit vulvoplasty."], [0, "p", 42, "Ch 127 · Male-to-Female Gender-Affirming Surgery: Vaginoplasty", "1 · Aim and preparation", "Plan every orchiectomy as though vaginoplasty will follow — midline scrotal incision, peri-cord fat left for labial bulk."], [0, "a", 43, "Ch 127 · Male-to-Female Gender-Affirming Surgery: Vaginoplasty", "2 · Penile inversion vaginoplasty (PIV)", "<p>Foley, drain → mark adductor longus tendons (clitoral level) and dorsal midline (prevents torsion) → scrotal graft + small posterior rhomboid flap (relieves introital tension) → defat, tubularise → orchiectomy, leave cord fat → disassembly → corporal excision + clitoroplasty → urethroplasty → canal dissection → line canal → labiaplasty → pack</p>"], [0, "l", 43, "Ch 127 · Male-to-Female Gender-Affirming Surgery: Vaginoplasty", "2 · Penile inversion vaginoplasty (PIV)", "Labia majora incision <span class=\"key\">≥1 cm</span> from groin crease (dehiscence). Antibiotic pack + negative-pressure dressing."], [0, "l", 43, "Ch 127 · Male-to-Female Gender-Affirming Surgery: Vaginoplasty", "3 · Abdominoperineal and intestinal options", "<b>Peritoneal (Davydov-type)</b>: proximal canal made robotically; rectal injury <span class=\"key\">~7%</span> historically → ~2.3% (urethral 1.1%). <b>Rectum may mimic seminal vesicles</b>; enter between Denonvilliers leaflets."], [0, "p", 43, "Ch 127 · Male-to-Female Gender-Affirming Surgery: Vaginoplasty", "3 · Abdominoperineal and intestinal options", "Lining ladder: penile/scrotal skin → peritoneum → bowel. Each adds depth and lubrication but imports donor pathology; none removes the duty to dilate."], [0, "r", 44, "Ch 127 · Male-to-Female Gender-Affirming Surgery: Vaginoplasty", "4 · Complications", "<b>Rectovaginal fistula</b> (most devastating) · <span class=\"key\">0.8%</span> primary, 6.3% revision · Intra-op: watertight closure + bulbospongiosus flap ± diversion. Fistula: stop dilating, let canal stenose, revise later <b>or</b> delay closure"], [0, "p", 44, "Ch 127 · Male-to-Female Gender-Affirming Surgery: Vaginoplasty", "4 · Complications", "Three failure modes: violated plane (fistulas), tissue not excised (bulge, engorgement), graft not taken/maintained (dehiscence, stenosis, prolapse). Only the last depends on the patient — dilation is part of the operation."], [0, "l", 44, "Ch 127 · Male-to-Female Gender-Affirming Surgery: Vaginoplasty", "5 · Outcomes and follow-up", "Stay ~<span class=\"key\">5 days</span>; <b>day 5: pack and catheter out</b>, teach dilation. Retention → recatheterise 1 week."], [0, "p", 44, "Ch 127 · Male-to-Female Gender-Affirming Surgery: Vaginoplasty", "5 · Outcomes and follow-up", "The body treats the canal as a defect to close — lifelong stenosis risk. Any narrowing → more dilation, contact surgeon, physiotherapy."], [0, "l", 45, "Ch 128 · Special Urologic Considerations in Transmasculine Individuals", "2 · Preoperative care and consent", "WPATH SOC7: ≥<span class=\"key\">12 months</span> testosterone before genital surgery (<span class=\"dag\">†</span>SOC8: 6 months) — for <b>clitoral hypertrophy</b> (plateaus ≈2 years)."], [0, "a", 45, "Ch 128 · Special Urologic Considerations in Transmasculine Individuals", "3 · Removal of female structures", "<p>Hydrodissect with dilute lidocaine → circumferential introital incision → blunt rectovaginal plane → <b>sharp urethrovaginal dissection, no diathermy</b> (sphincter) → bladder plane; injury → close ± cystoscopy → free levators, control paravaginal plexus → approximate levators (prolapse) → bulbospongiosus over urethra → layered closure</p>"], [0, "r", 46, "Ch 128 · Special Urologic Considerations in Transmasculine Individuals", "4 · Genital reconstruction", "Phallus · Own clitoris, <span class=\"key\">3–8 cm</span> · Flap"], [0, "l", 46, "Ch 128 · Special Urologic Considerations in Transmasculine Individuals", "5 · Postoperative care and catheterisation", "SPC + neourethral catheter; neourethral out at <span class=\"key\">14–21 days</span>; clamp SPC, record PVR until voiding normal."], [0, "a", 46, "Ch 128 · Special Urologic Considerations in Transmasculine Individuals", "5 · Postoperative care and catheterisation", "<p>One gentle Coudé attempt → stylet-guided attempt → any difficulty: stop → flexible cystoscopy, guidewire, open-tip catheter. Emergency: <b>suprapubic catheter</b></p>"], [0, "l", 46, "Ch 128 · Special Urologic Considerations in Transmasculine Individuals", "6 · Urethral complications", "<b>Fistula</b> (commonest at phallic base): keep diversion; small ones close; persisting &gt;<span class=\"key\">3 months</span> → excise, layered closure with fat interposition, catheter 10–12 days."], [0, "l", 46, "Ch 128 · Special Urologic Considerations in Transmasculine Individuals", "6 · Urethral complications", "<b>Stricture</b> (commonest at <b>fixed–phallic anastomosis</b>; also meatus): plateau uroflow → RUG. Treat only after <span class=\"key\">≥6 months</span>; retention → SPC or perineal urethrostomy."], [0, "p", 47, "Ch 128 · Special Urologic Considerations in Transmasculine Individuals", "6 · Urethral complications", "The neourethra is skin in fat without spongiosum: fistulas and strictures cluster at poorly perfused flap ends, heal slowly and resist endoscopic cure."], [0, "l", 47, "Ch 128 · Special Urologic Considerations in Transmasculine Individuals", "7 · Prostheses", "Erectile: ≥<span class=\"key\">1 year</span> after phalloplasty, with <b>protective sensation</b> and stable urethra; one cylinder anchored to pubic periosteum (no tunica). Malleable simpler."], [0, "a", 48, "★ Putting it together", "A · Newborn with atypical genitalia", "<p><b>1. Emergency is adrenal, not genital:</b> CAH commonest (half of all, 90% of 46,XX). Salt wasting (low Na, high K, shock) appears day 5–7 (<span class=\"xref\">→ Ch 59</span>).</p>\n<p><b>2. Tests:</b> karyotype (SRY), 17-OHP after 36 h, electrolytes, pelvic US for uterus.</p>\n<p><b>3. Team:</b> <span class=\"dag\">†</span>defer sex assignment until MDT evaluation.</p>\n<p><b>4. Gonads:</b> dysgenetic with Y (e.g. complete gonadal dysgenesis, 30–45% tumour risk) → prophylactic gonadectomy.</p>"], [0, "p", 48, "★ Putting it together", "B · Urogenital sinus and cloaca", "True urethral length (bladder neck → confluence) outweighs common-channel length. Low confluence → flap; high → pull-through or TUM/PUM. Clitoroplasty only Prader III–IV, sparing dorsal bundle. Cloaca: colostomy, decompress hydrocolpos, cloacogram/MRI + endoscopy, then posterior sagittal repair; seek VACTERL, tethered cord (<span class=\"xref\">→ Ch 60</span>)."], [0, "a", 48, "★ Putting it together", "D · Immunotherapy and hereditary cancer", "<p><b>Checkpoints:</b> tumour IFN-γ induces PD-L1, silencing PD-1+ T cells; CTLA-4 inhibitors act earlier (priming). <span class=\"dag\">†</span>irAEs (colitis, hepatitis, pneumonitis, endocrinopathy): hold drug + steroids for grade ≥2; endocrinopathies need lifelong replacement (<span class=\"xref\">→ Ch 24</span>).</p>\n<p><b>Hereditary:</b> VHL (clear cell; belzutifan), HLRCC (FH; aggressive papillary), Birt–Hogg–Dubé (FLCN; hybrid oncocytic), Lynch (MMR; UTUC). BRCA/HRR prostate → PARP inhibitor; FGFR urothelial → erdafitinib (<span class=\"xref\">→ Ch 25</span>).</p>"], [0, "p", 48, "★ Putting it together", "E · Older patient before surgery", "Function, not age, predicts outcome. Frailty screen → CGA: cognition, delirium, nutrition, falls, polypharmacy. Avoid anticholinergic burden (β3-agonist for OAB). New incontinence: transient causes first (<span class=\"dag\">†</span>DIAPPERS) (<span class=\"xref\">→ Ch 120</span>)."], [0, "a", 49, "★ Putting it together", "F · Transgender and nonbinary patients", "<p>Organ inventory guides screening — retained prostate after vaginoplasty (anterior neovaginal wall; <span class=\"dag\">†</span>PSA lower on oestrogen), retained cervix on testosterone (<span class=\"xref\">→ Ch 126</span>).</p>\n<p>Vaginoplasty: stenosis, rectovaginal fistula (most devastating), urethrovaginal fistula (<span class=\"xref\">→ Ch 127</span>). Phalloplasty: fistula, stricture; no vaginectomy → more fistula (<span class=\"xref\">→ Ch 128</span>).</p>"], [1, "l", 2, "Ch 26 · Infections of the Urinary Tract", "1 · Definitions and classification", "<b>Complicating factors</b>: anatomical/functional abnormality (BPH, diverticula, ureteric obstruction, NGB, BOO, concentrating defects), <b>male sex</b>, pregnancy, elderly, DM, immunosuppression, childhood UTI, recent antibiotics, catheter, instrumentation, hospital-acquired, symptoms &gt;7 days. <span class=\"tag\">MCQ</span> Male sex alone makes UTI complicated."], [1, "r", 2, "Ch 26 · Infections of the Urinary Tract", "1 · Definitions and classification", "Reinfection · New inoculation (~<span class=\"key\">70%</span> of recurrences, often different organism) · Cleared, then new event"], [1, "l", 2, "Ch 26 · Infections of the Urinary Tract", "1 · Definitions and classification", "<b>CAUTI</b>: commonest cause of secondary bacteraemia; ~<span class=\"key\">80%</span> of nosocomial UTIs."], [1, "l", 3, "Ch 26 · Infections of the Urinary Tract", "2 · Pathogenesis", "<b><i>E. coli</i></b>: ~<span class=\"key\">85%</span> community, ~50% hospital UTIs; share falls from ~¾ in uncomplicated cystitis to &lt;½ in complicated UTI/urosepsis."], [1, "l", 3, "Ch 26 · Infections of the Urinary Tract", "2 · Pathogenesis", "<span class=\"tag\">MCQ</span> <i>Enterococcus</i> is a Gram-positive coccus, not an Enterobacteriaceae."], [1, "r", 3, "Ch 26 · Infections of the Urinary Tract", "2 · Pathogenesis", "Tropism · Bladder → cystitis · Kidney → <b>pyelonephritis</b> (~<span class=\"key\">90%</span> of pyelonephritis strains)"], [1, "a", 3, "Ch 26 · Infections of the Urinary Tract", "2 · Pathogenesis", "<p>FimH binds uroplakin → umbrella-cell invasion (15 min–1 h) → <b>intracellular bacterial community (IBC)</b>, biofilm-like (4–16 h) → filamentation, escape, reinvasion (16–24 h) → exfoliation → <b>quiescent intracellular reservoirs (QIRs)</b> (from ~2 weeks)</p>"], [1, "l", 4, "Ch 26 · Infections of the Urinary Tract", "3 · Evaluation and diagnosis", "Dysuria + frequency without discharge → ~<span class=\"key\">90%</span> probability of UTI; haematuria + nitrite → ≥90%. Dysuria is the best single symptom."], [1, "l", 5, "Ch 26 · Infections of the Urinary Tract", "3 · Evaluation and diagnosis", "Microscopy: pyuria = ≥<span class=\"key\">5–10 WBC/high-power field (HPF)</span>; squamous cells = contamination. No pyuria → question diagnosis; culture-positive without pyuria → repeat by catheter."], [1, "r", 5, "Ch 26 · Infections of the Urinary Tract", "3 · Evaluation and diagnosis", "≥<span class=\"key\">10² CFU/mL</span> of a known pathogen · Symptomatic women with cystitis; catheter specimens"], [1, "r", 6, "Ch 26 · Infections of the Urinary Tract", "4 · Antimicrobial principles", "Nitrofurantoin · Urine-only → useless for pyelonephritis, prostate, bacteraemia. Flora-sparing. Toxicity: pulmonary fibrosis, neuropathy, G6PD haemolysis. Beers 2015: avoid if CrCl &lt;<span class=\"key\">30 mL/min</span> (older 50–60); no long-term suppression in elderly."], [1, "p", 7, "Ch 26 · Infections of the Urinary Tract", "4 · Antimicrobial principles", "Narrow, urine-confined, flora-sparing agents (nitrofurantoin, fosfomycin, pivmecillinam) lead in cystitis; broad tissue-penetrating agents (quinolones, cephalosporins, carbapenems) are kept for invasive infection. Resistance is made in the bowel, so breadth, duration and repetition matter more than MIC."], [1, "r", 7, "Ch 26 · Infections of the Urinary Tract", "5 · Asymptomatic bacteriuria", "Either sex · One catheterised · ≥<span class=\"key\">10²</span> CFU/mL"], [1, "p", 8, "Ch 26 · Infections of the Urinary Tract", "5 · Asymptomatic bacteriuria", "ASB is treated only where bacteria are about to reach blood or tissue: pregnancy (hydroureter → pyelonephritis) and mucosa-breaching urological surgery. Elsewhere the resident strain is harmless or protective."], [1, "r", 8, "Ch 26 · Infections of the Urinary Tract", "6 · Cystitis", "First-line · <b>Nitrofurantoin</b> 100 mg twice daily × <span class=\"key\">5 d</span> · Not if pyelonephritis suspected"], [1, "r", 8, "Ch 26 · Infections of the Urinary Tract", "6 · Cystitis", "First-line · <b>TMP-SMX</b> 160/800 mg twice daily × <span class=\"key\">3 d</span> · Avoid if local resistance &gt;<span class=\"key\">20%</span> or used in past 3 months"], [1, "l", 9, "Ch 26 · Infections of the Urinary Tract", "6 · Cystitis", "~<span class=\"key\">90%</span> medical: broad Gram-negative cover, catheter drainage, glucose control; cystectomy/debridement rarely."], [1, "a", 9, "Ch 26 · Infections of the Urinary Tract", "7 · Recurrent UTI", "<p>Confirm recurrent UTI (symptoms + culture) → same organism at short intervals? → evaluate for persistence (upper tract imaging + cystoscopy), remove nidus → reinfection: behavioural (≥1.5 L water, frequent and postcoital voiding, stop spermicide) → cranberry ≥36 mg PAC → coital: <b>postcoital antibiotic</b>; postmenopausal: <b>vaginal oestrogen</b>; neither: <b>methenamine hippurate</b> (normal renal function) → continuous prophylaxis last</p>"], [1, "p", 10, "Ch 26 · Infections of the Urinary Tract", "7 · Recurrent UTI", "Recurrent UTI in women is reinfection in a receptive host, not a hidden focus. Investigate only for features of persistence or complication; prevention targets flora, pH, adhesion and washout rather than repeatedly sterilising urine."], [1, "r", 10, "Ch 26 · Infections of the Urinary Tract", "8 · Kidney infections", "Outpatient, no vomiting · Ciprofloxacin 500 mg twice daily if community quinolone resistance ≤<span class=\"key\">10%</span>; levofloxacin 750 mg daily; TMP-SMX DS twice daily only if known sensitive. ± one IV dose ceftriaxone 1 g or aminoglycoside. · Cipro 7; levo 5; TMP-SMX 14"], [1, "a", 11, "Ch 26 · Infections of the Urinary Tract", "8 · Kidney infections", "<p>Pyelonephritis → no sepsis/vomiting: culture ± US → oral outpatient 7–10 d | sepsis: blood + urine cultures, imaging → IV inpatient → improved by <b>72 h</b>: oral step-down | not improved: repeat cultures + <b>CT</b> → drain obstruction or abscess</p>"], [1, "p", 11, "Ch 26 · Infections of the Urinary Tract", "8 · Kidney infections", "Urine sterilises within hours but fever may lag for days. Fever beyond 72 h means obstruction or an undrained collection until CT proves otherwise. Antibiotics treat the infection; drainage treats the complication."], [1, "p", 12, "Ch 26 · Infections of the Urinary Tract", "8 · Kidney infections", "Fluid is a good sign and streaky gas a bad one: a contained collection can be drained; diffuse gas without fluid means parenchyma is necrosing faster than the host can wall it off."], [1, "l", 12, "Ch 26 · Infections of the Urinary Tract", "8 · Kidney infections", "Renal abscess: ≤<span class=\"key\">3 cm</span> antibiotics; &gt;<span class=\"key\">5 cm</span> percutaneous drainage; any size if immunocompromised/non-responding. Look for skin source 1–8 weeks earlier; aspirate if abscess vs cystic tumour uncertain."], [1, "p", 12, "Ch 26 · Infections of the Urinary Tract", "8 · Kidney infections", "Across renal infections the axis is diffuse inflammation versus contained collection. Pyelonephritis and AFBN need antibiotics; pyonephrosis and large or obstructed abscesses need drainage; when the kidney itself is the infected tissue (XGP, diffuse EPN), the answer is nephrectomy."], [1, "l", 12, "Ch 26 · Infections of the Urinary Tract", "9 · Fournier gangrene and periurethral abscess", "<b>Fournier gangrene</b>: necrotising fasciitis of genitalia, perineum and/or perianal region. Source found in ~<span class=\"key\">95%</span>; age 50–79; male:female ~10:1."], [1, "r", 13, "Ch 26 · Infections of the Urinary Tract", "9 · Fournier gangrene and periurethral abscess", "<b>LRINEC</b> · CRP, WBC, haemoglobin, sodium, creatinine, glucose · ≥<span class=\"key\">6</span> suspicious; ≥<span class=\"key\">8</span> strongly predictive"], [1, "a", 13, "Ch 26 · Infections of the Urinary Tract", "9 · Fournier gangrene and periurethral abscess", "<p>Suspicion → resuscitation + broad IV antibiotics (piperacillin–tazobactam; or carbapenem/vancomycin + clindamycin or metronidazole) → <b>immediate radical debridement</b> to bleeding fascia, leave open → <b>re-look at 24–48 h</b> → suprapubic diversion (urethral source) / colostomy (rectal source) → hyperbaric oxygen (adjunct) → reconstruction</p>"], [1, "r", 13, "Ch 26 · Infections of the Urinary Tract", "10 · Urosepsis †", "Sepsis · Organ dysfunction from dysregulated response to infection: SOFA rise ≥<span class=\"key\">2</span>"], [1, "a", 13, "Ch 26 · Infections of the Urinary Tract", "10 · Urosepsis †", "<p>Hour-1 bundle: lactate → blood + urine cultures → broad IV antibiotic within 1 h → 30 mL/kg crystalloid if hypotension or lactate ≥4 → noradrenaline for MAP ≥65 → <b>source control</b>: decompress (stent or nephrostomy; no definitive stone surgery) → de-escalate by culture</p>"], [1, "l", 13, "Ch 26 · Infections of the Urinary Tract", "11 · Special populations", "GFR +30–50% → creatinine 0.7 → <span class=\"key\">0.5 mg/dL</span>, so 0.8–0.9 may mean impairment; proteinuria abnormal &gt;300 mg/24 h. Kidney +1 cm."], [1, "l", 14, "Ch 26 · Infections of the Urinary Tract", "11 · Special populations", "Catheter &gt;<span class=\"key\">10 years</span> → bladder cancer (often squamous <span class=\"dag\">†</span>) → surveillance."], [1, "l", 14, "Ch 26 · Infections of the Urinary Tract", "11 · Special populations", "Transplant: no ASB screening &gt;1–2 months. Uncomplicated UTI 5–10 days (not 3); pyelonephritis 14–21 days. Stents raise UTI by ~half → remove within <span class=\"key\">4 weeks</span>. Recurrent UTI → PVR, imaging, VCUG, UDS."], [1, "r", 15, "Ch 26 · Infections of the Urinary Tract", "13 · Perioperative antimicrobial prophylaxis", "Timing · Within <span class=\"key\">60 min</span> of incision; vancomycin and quinolones within 120 min"], [1, "r", 15, "Ch 26 · Infections of the Urinary Tract", "13 · Perioperative antimicrobial prophylaxis", "Duration · <b>Single dose</b>; ≤<span class=\"key\">24 h</span> only for PCNL, prostheses, special cases"], [1, "p", 16, "Ch 26 · Infections of the Urinary Tract", "13 · Perioperative antimicrobial prophylaxis", "Prophylaxis is justified by wound contamination × host vulnerability. Where neither is raised (diagnostic cystoscopy, sterile-urine SWL, index UDS), ecological cost outweighs benefit; otherwise give one well-timed, flora-matched dose. Anything longer is treatment."], [1, "l", 17, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "1 · Prostatitis: definitions and classification", "<b>Drach (1978)</b>, built on <b>Meares–Stamey (1968)</b> segmented cultures: acute bacterial, chronic bacterial, nonbacterial, prostatodynia. <span class=\"tag\">MCQ</span> Replaced by <b>NIH (1999)</b>."], [1, "l", 17, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "1 · Prostatitis: definitions and classification", "I + II = <span class=\"key\">5–10%</span>; III = <span class=\"key\">90–95%</span>. <b>IIIA vs IIIB has no clinical significance</b>; VB3/EPS leucocyte microscopy no longer recommended. The prostate may not be the pain source, hence \"CPPS\"."], [1, "l", 17, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "1 · Prostatitis: definitions and classification", "<b>Category III (NIH CPCRN)</b>: pelvic pain <span class=\"key\">≥3 of the previous 6 months</span>. Exclusions: uropathogens, urogenital cancer, prior radiation/chemotherapy, stricture, neurological bladder disease. MAPP term: urologic chronic pelvic pain syndrome."], [1, "l", 17, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "1 · Prostatitis: definitions and classification", "Histological inflammation near-universal (autopsy <span class=\"key\">&gt;70%</span>), so it cannot define disease alone."], [1, "p", 17, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "2 · Category I: acute bacterial prostatitis", "<b>Why young healthy men get ABP:</b> the organism, not the host — virulent UPEC that forms <b>biofilm</b> more often than cystitis/pyelonephritis strains; biofilm blocks antibiotics, so prostatic infection needs longer, well-penetrating therapy."], [1, "l", 18, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "2 · Category I: acute bacterial prostatitis", "Febrile male UTI: <span class=\"key\">&gt;90%</span> show PSA and/or prostate volume rise — prostatic involvement is the rule."], [1, "l", 18, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "2 · Category I: acute bacterial prostatitis", "<b>No PSA</b> acutely; if raised, follow to normal (up to <span class=\"key\">6 months</span>). Image (TRUS/CT) only for suspected abscess; <b>no biopsy</b>."], [1, "l", 18, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "2 · Category I: acute bacterial prostatitis", "<b>EAU</b>, systemic illness: amoxicillin + aminoglycoside; 2nd-gen cephalosporin + aminoglycoside; or 3rd-gen cephalosporin. Ciprofloxacin only if local resistance <span class=\"key\">&lt;10%</span>, fully oral, not hospitalised, or β-lactam anaphylaxis."], [1, "l", 18, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "2 · Category I: acute bacterial prostatitis", "<b>Duration</b>: traditionally 4 weeks; <span class=\"key\">2 weeks</span> ciprofloxacin equivalent. TB prostatitis ≥<span class=\"key\">6 months</span>. Adjuncts: NSAIDs, α-blockers."], [1, "a", 18, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "2 · Category I: acute bacterial prostatitis", "<p>Abscess &lt;1–2 cm → antibiotics → progression → peripheral: US-guided percutaneous drainage (recurrence 15–33%) → large or failed: <b>transurethral unroofing</b> (intra-op US to locate) → extraprostatic extension: open drainage (rare)</p>"], [1, "r", 18, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "3 · Category II: chronic bacterial prostatitis", "<b>2-glass pre/post-massage</b> (current) · Midstream pre-massage + first 10 mL post-massage · Predicts 4-glass in <span class=\"key\">&gt;95%</span>"], [1, "l", 19, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "3 · Category II: chronic bacterial prostatitis", "DRE nodule → cancer. Recheck haematuria 4–6 weeks after clearance. PVR <span class=\"key\">&gt;180 mL</span> raises infection risk."], [1, "l", 19, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "3 · Category II: chronic bacterial prostatitis", "Men <span class=\"key\">&lt;45</span> with first UTI: imaging normal, but check for <b>stricture</b> (up to 41%). Image if DM, stones, voiding/neurological problems, poor response, haematuria."], [1, "p", 19, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "3 · Category II: chronic bacterial prostatitis", "<b>Why fluoroquinolones?</b> Prostatic entry is passive (lipid solubility, ionisation, protein binding, size). FQs are lipid-soluble <b>zwitterions</b> concentrating in alkaline CBP fluid and cover Gram-negatives incl. <i>Pseudomonas</i>, Gram-positives, atypicals. Tetracyclines, macrolides, trimethoprim also penetrate."], [1, "r", 19, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "3 · Category II: chronic bacterial prostatitis", "First line · FQ (ciprofloxacin = levofloxacin) <span class=\"key\">4–6 weeks</span>"], [1, "r", 19, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "3 · Category II: chronic bacterial prostatitis", "FQ-resistant, TMP-SMX-sensitive · TMP-SMX <span class=\"key\">3 months</span> (cure 30–50% vs 60–80% FQ)"], [1, "r", 19, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "4 · CP/CPPS — aetiology", "Pelvic floor · Tenderness, <b>failure to relax</b>; tender in <span class=\"key\">81%</span>"], [1, "l", 19, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "5 · CP/CPPS — clinical features and evaluation", "<b>NIH-CPSI</b> <span class=\"dag\">†</span>0–43 (pain 0–21, urinary 0–10, QOL 0–12); fall of <span class=\"key\">≥6 points</span> = meaningful. No bladder items → <b>GUPI</b>."], [1, "p", 20, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "6 · CP/CPPS — treatment", "<b>Governing fact:</b> no monotherapy has a positive definitive trial — each tested one agent in an unphenotyped population. Start conservative, then give <b>simultaneous, phenotype-directed multimodal therapy</b> with a multidisciplinary team."], [1, "r", 20, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "6 · CP/CPPS — treatment", "<b>Antibiotics</b> · Cipro/levofloxacin trials negative; benefit may be anti-inflammatory (↓ IL-6, TNF-α) or VB3-only bacteria. EAU: quinolone or tetracycline ≥<span class=\"key\">6 weeks</span> only if <b>treatment-naive and &lt;1 year</b>. <b>No repeated courses without positive culture</b>."], [1, "l", 21, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "8 · Acute epididymitis", "Epididymal pain/swelling <span class=\"key\">&lt;6 weeks</span>; <b>ascending</b> (~80% urine concordance)."], [1, "r", 21, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "8 · Acute epididymitis", "Chlamydia/gonorrhoea · Ceftriaxone <span class=\"key\">500 mg IM</span> single (1 g if ≥150 kg) + doxycycline 100 mg bd <span class=\"key\">10 days</span>"], [1, "l", 21, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "9 · Chronic orchitis and epididymitis", "<b>Chronic epididymitis</b> (≥<span class=\"key\">3 months</span>), <b>Nickel classification</b>: inflammatory (infective, post-infective, TB, <b>amiodarone</b>, idiopathic); obstructive (congenital, post-infective, post-vasectomy); epididymalgia (normal epididymis). Culture, US; reassurance."], [1, "l", 22, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "9 · Chronic orchitis and epididymitis", "<b>TB epididymitis</b>: commonest genital site (sole in 45%); painless swelling, <b>sinus</b>. Four drugs ≥<span class=\"key\">6 months</span>; surgery <b>only on anti-TB drugs</b>. <b>Mass not shrinking after 3 weeks → inguinal exploration</b>."], [1, "l", 22, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "10 · Chronic scrotal content pain (CSCP)", "Peak 20–30 y. Post-procedural: <b>inguinal hernia repair</b> (commonest; mesh/recurrent), vasectomy (~<span class=\"key\">1 in 1000</span>, consent figure), scrotal surgery. Others: varicocele, hydrocele, intermittent torsion, referred pain (ureteric stone, disc, aneurysm). Idiopathic 18–25%."], [1, "l", 22, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "10 · Chronic scrotal content pain (CSCP)", "<b>Spermatic cord block</b>: <span class=\"key\">20 mL 0.25% bupivacaine</span> at the <b>pubic tubercle</b>; <b>&gt;50% relief</b> predicts MDSC success."], [1, "a", 22, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "10 · Chronic scrotal content pain (CSCP)", "<p>Identifiable lesion → directed surgery (hydrocelectomy, spermatocelectomy, orchidopexy, <b>microsurgical varicocelectomy</b>) → post-vasectomy → <b>vasectomy reversal</b> (82–93%; ≥3 months) → no lesion + positive block → <b>MDSC</b> → focal epididymal → epididymectomy → last resort: <b>inguinal orchidectomy</b></p>"], [1, "l", 24, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "1 · Definition and nomenclature", "<b>AUA</b>: bladder-related pain, pressure or discomfort with LUTS <span class=\"key\">&gt;6 weeks</span>, no infection/other cause. <span class=\"dag\">†</span> <b>ESSIC (2008)</b>: <span class=\"key\">&gt;6 months</span> + ≥1 urinary symptom; <b>type 3C</b> = classic HL disease (C = inflammatory infiltrate/detrusor mastocytosis/granulation tissue/fibrosis)."], [1, "l", 24, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "1 · Definition and nomenclature", "<b>NIDDK (1987)</b>: research definition; clinically missed <span class=\"key\">~60%</span> → definitions broadened."], [1, "l", 24, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "2 · Epidemiology (headline)", "RICE study: <span class=\"key\">3.3–7.9 million US women</span>, 2.1–4.6 million men with IC/BPS-type symptoms. Mean onset 30–40 years."], [1, "l", 24, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "2 · Epidemiology (headline)", "F:M <span class=\"key\">5:1</span> in clinics but <b>2–3:1</b> in populations → men under-diagnosed. <b>Ask men labelled CP/CPPS about bladder pain</b>; reconsider IC/BPS when CP/CPPS treatment fails."], [1, "l", 24, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "2 · Epidemiology (headline)", "<b>HL prevalence</b> <span class=\"key\">~20%</span> (3.5–56%); rises with age — uncommon &lt;30, &gt;half over 60–70. Same in men."], [1, "p", 24, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "2 · Epidemiology (headline)", "Uncontrolled series \"work\" but RCTs fail: regression to the mean, placebo, extra attention. Expect improvement in the first 3–4 weeks of any treatment."], [1, "p", 25, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "3 · Aetiology and pathophysiology", "Central sensitisation explains why many BPS patients have no physical findings and do not respond to local bladder therapy — the mechanism is systemic, not vesical."], [1, "l", 25, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "5 · Associated conditions", "<b>Regional</b>: <b>HTPFD</b> in <span class=\"key\">~80%</span>; vulvodynia; endometriosis."], [1, "p", 25, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "5 · Associated conditions", "Commonest ≠ most over-represented: IBS is commonest; autoimmune disease shows the greatest relative excess. Widespread pain predicts failure of bladder-directed therapy."], [1, "l", 27, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "7 · Diagnosis — exclusion plus localisation", "<b>PST</b>: <span class=\"key\">0.4 M KCl</span> vs water. <b>Not recommended</b> — painful; negative in ¼ of NIDDK patients, positive in ~⅓ normal men, ¼ OAB, most CP/CPPS. Does not predict PPS response."], [1, "l", 27, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "7 · Diagnosis — exclusion plus localisation", "Under anaesthesia <span class=\"key\">80 cm H₂O for 1–3 min</span> → drain → refill → <b>glomerulations</b>; tears near bladder neck."], [1, "p", 27, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "8 · Phenotype-directed management", "MAPP reanalysis (2023) of two negative NIH RCTs: hydroxyzine/PPS helped <b>localised pelvic pain</b>; amitriptyline helped <b>widespread pain</b>. A trial negative in all-comers can hide a positive result in the right phenotype."], [1, "a", 27, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "9 · Treatment — AUA 2022 principles", "<p>Symptoms ≥6 weeks → history, exam (pelvic floor, Q-tip, DRE), PVR, urinalysis, culture ± cytology → exclude confusable disease → cystoscopy if HL suspected (&gt;50) → HL: fulguration/triamcinolone → refractory: CyA</p><p>No HL → phenotype: pelvic floor → physiotherapy; lidocaine responder → intravesical; widespread → systemic/CBT → behavioural + oral + intravesical → BTX-A or SNM → (rare, bladder-centric, all failed) diversion ± cystectomy</p>"], [1, "l", 28, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "10 · Treatment options (AUA 2022)", "Myofascial PT RCT: 10 sessions vs global massage → <span class=\"key\">59% vs 26%</span>. Adjuncts: reverse Kegels, heat, relaxants, constipation control, trigger-point injections."], [1, "l", 28, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "10 · Treatment options (AUA 2022)", "<b>Amitriptyline</b> (anticholinergic, SNRI-like, potent H1, sedative): <b>10 mg nocte, +10 mg weekly to ~50 mg</b> (25–75). NIH RCT 55% vs 45% (NS); <span class=\"key\">77% vs 53%</span> if ≥50 mg tolerated; independent of HL. <b>CI</b>: long QT, conduction block, recent MI, heart failure, ventricular arrhythmia; caution with incomplete emptying."], [1, "l", 28, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "10 · Treatment options (AUA 2022)", "<b>PPS</b> <b>100 mg three times daily</b>; only <span class=\"key\">3–6%</span> reaches urine; acts in <b>3–6 months</b>; only FDA-approved oral IC drug. Phase IV RCT negative (≈40% both arms); less effective in HL. Adverse (&lt;4%): alopecia, GI upset, rash, bleeding; caution in high breast-cancer risk."], [1, "l", 29, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "10 · Treatment options (AUA 2022)", "<b>AUA Recommendation</b>: fulguration and/or submucosal triamcinolone; biopsy if never biopsied. <span class=\"key\">75–90%</span> improve; repeat at mean 7–12 months (triamcinolone) or 11–29 months (fulguration)."], [1, "a", 29, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "10 · Treatment options (AUA 2022)", "<p>GA → map HLs before distension bleeding → mild distension → biopsy suspicious/trigonal lesions → fulgurate at <b>low volume</b> (Bugbee) from the <b>outer margin inwards</b> → triamcinolone 40 mg/mL (or 1:1 with bupivacaine/lidocaine), 0.5-mL aliquots, 2–3 mm submucosal → fulgurate bleeders → empty, instil lidocaine–bupivacaine</p>"], [1, "p", 29, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "10 · Treatment options (AUA 2022)", "Fulgurate from the margin inward: cautery erythema/oedema spreads peripherally, so the true edge is lost if you start centrally."], [1, "l", 29, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "10 · Treatment options (AUA 2022)", "Anaesthetic capacity <span class=\"key\">&lt;400 mL</span> = bladder-centric phenotype (often HL)."], [1, "p", 30, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "11 · What NOT to do (AUA)", "Nothing is worse than irreversible surgery followed by continued pain — every predictor of surgical success marks bladder-generated pain."], [1, "l", 31, "Ch 29 · Sexually Transmitted Diseases", "1 · Screening, prevention and partner notification", "<b>NAAT</b> is the standard screen; MSM need urethral, rectal and pharyngeal tests. <span class=\"tag\">MCQ</span> Test the pharynx for gonorrhoea, not chlamydia."], [1, "l", 31, "Ch 29 · Sexually Transmitted Diseases", "1 · Screening, prevention and partner notification", "<b>Partner notification</b>: previous <span class=\"key\">60 days</span> for urethritis, chlamydia, <i>M. genitalium</i>; all partners for trichomoniasis; previous month for scabies/lice. Abstain 7 days and until partners treated."], [1, "l", 31, "Ch 29 · Sexually Transmitted Diseases", "2 · Urethritis", "<b>Diagnosis</b> — any one: discharge; Gram stain <span class=\"key\">≥2 white blood cells (WBC) per oil-immersion field</span> (old ≥5 missed many); positive leucocyte esterase on first-void urine; ≥10 WBC/hpf in first-void urine."], [1, "a", 32, "Ch 29 · Sexually Transmitted Diseases", "2 · Urethritis", "<p>Persistent NGU → check adherence and untreated partner → NAAT for <i>M. genitalium</i> ± <i>T. vaginalis</i> → negative → think chronic pelvic pain syndrome</p>"], [1, "p", 32, "Ch 29 · Sexually Transmitted Diseases", "2 · Urethritis", "Men with gonorrhoea usually have symptoms; women are usually silent and present with PID or infertility. Treating the man protects his partner. Chlamydia can also cause reactive arthritis."], [1, "r", 32, "Ch 29 · Sexually Transmitted Diseases", "3 · Epididymitis by age", "Group · Organisms · Empiric regimen (<span class=\"key\">10 days</span>)"], [1, "r", 33, "Ch 29 · Sexually Transmitted Diseases", "4 · Genital ulcer disease", "LGV (<i>C. trachomatis</i> L1–L3) · Small, painless, transient · Painful, matted, fistulae; <span class=\"dag\">†</span>groove sign · Chlamydia NAAT · Doxycycline bd <span class=\"key\">21 days</span>"], [1, "l", 34, "Ch 29 · Sexually Transmitted Diseases", "5 · Syphilis staging and serology", "Significant change = <span class=\"key\">fourfold (two dilutions)</span>; use the same NTT each time."], [1, "a", 34, "Ch 29 · Sexually Transmitted Diseases", "5 · Syphilis staging and serology", "<p><b>Reverse algorithm</b>: TT positive → NTT → NTT negative → second, different TT → positive without past treatment = treat as late latent</p>"], [1, "l", 35, "Ch 29 · Sexually Transmitted Diseases", "8 · HIV for urologists", "PEP (start within <span class=\"key\">72 h</span>) only for mucosal/broken-skin/percutaneous contact with blood or genital fluid — not after 72 h or for urine, saliva, tears. Needlestick (<span class=\"key\">0.3%</span>): three-drug PEP even if source viral load low."], [1, "l", 35, "Ch 29 · Sexually Transmitted Diseases", "8 · HIV for urologists", "Circumcision (<span class=\"key\">50–60%</span>): inner foreskin rich in Langerhans cells; does not protect partners."], [1, "r", 36, "Ch 30 · Cutaneous Diseases of the External Genitalia", "1 · Approach to genital dermatoses", "Papule · Solid, raised, <span class=\"key\">≤0.5 cm</span> · Erosion · Epidermis only → <b>no scar</b>"], [1, "l", 37, "Ch 30 · Cutaneous Diseases of the External Genitalia", "3 · Eczematous dermatoses", "Relapsing, flexural, intensely pruritic, ill-defined border. <span class=\"key\">90%</span> present &lt;5 years; asthma/rhinitis."], [1, "r", 37, "Ch 30 · Cutaneous Diseases of the External Genitalia", "3 · Eczematous derma
