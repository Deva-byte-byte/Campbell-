efractory nocturia", "<ol>\n<li>Take a history, examine, and obtain a diary and basic tests.</li>\n<li>Identify the Sleep CALM factors.</li>\n<li>Optimise each factor, with multidisciplinary help.</li>\n<li>Add conservative measures.</li>\n<li>If nocturia stays refractory, then consider an antidiuretic or a timed diuretic in selected patients.</li>\n<li>Repeat the diary at every step.</li>\n</ol>"], [6, "r", 8, "Ch 112 · Nocturia", "11 · Management algorithm and refractory nocturia", "Dose · 1.66 mcg if &lt;65 with no risk factors; <b>0.83 mcg</b> if ≥65 or at risk · <b>Sex-specific</b>: women <span class=\"key\">25 mcg</span>; men <span class=\"key\">50 mcg</span>"], [6, "l", 9, "Ch 112 · Nocturia", "11 · Management algorithm and refractory nocturia", "Hyponatraemia is defined as sodium &lt;<span class=\"key\">130 mmol/L</span>; most cases occur within <span class=\"key\">3 weeks</span>."], [6, "p", 9, "Ch 112 · Nocturia", "11 · Management algorithm and refractory nocturia", "Refractory nocturia: move urine production out of the night. The price is sodium balance — dose, age and monitoring define safe use."], [6, "p", 10, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "1 · Pathophysiology and device mechanisms", "Every device compresses the urethra or repositions a functioning sphincter. Trap: ATOMS and Virtue are \"slings\" but compress — only the Advance depends absolutely on a coapting residual sphincter."], [6, "l", 11, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "2 · Indications and device selection", "Do not delay surgery beyond <span class=\"key\">6 months</span> for severe SUI, especially when cystoscopy shows a sphincter defect."], [6, "l", 11, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "2 · Indications and device selection", "24-hour pad weight grades severity: mild <span class=\"key\">&lt;150 g</span>, moderate <span class=\"key\">&lt;400 g</span>. AUS is preferred if &gt;250 g or after RT (MASTER trial <span class=\"xref\">See Ch 106</span>)."], [6, "l", 11, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "2 · Indications and device selection", "Counsel: ~1 thin pad/day, AUS lifespan <span class=\"key\">7–10 years</span>; failed slings mostly go to AUS."], [6, "l", 11, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "2 · Indications and device selection", "Radiation cystitis needs hyperbaric oxygen and <span class=\"key\">6 months</span> free of bleeding before AUS."], [6, "p", 11, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "2 · Indications and device selection", "Each device's contraindication mirrors the other's requirement."], [6, "l", 11, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "3 · The high-risk (\"fragile\") urethra", "After a prior erosion, 5-year repeat erosion approaches <span class=\"key\">50%</span>."], [6, "p", 11, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "3 · The high-risk (\"fragile\") urethra", "Erosion = spongiosal ischaemia under constant pressure. Countermeasures add tissue (TC tunica) or lower pressure — never squeeze harder."], [6, "l", 12, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "4 · Operative technique", "Low lithotomy, chlorhexidine–alcohol, sterile urine. Give IV antibiotics within <span class=\"key\">60 min</span> of incision: aminoglycoside 5 mg/kg plus a first/second-generation cephalosporin or vancomycin."], [6, "a", 12, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "4 · Operative technique", "<ol>\n<li>Midline perineal incision; divide bulbospongiosus.</li>\n<li>Incise Buck fascia at the crural divergence and make a 2-cm tunnel around the urethra.</li>\n<li>Measure and place the cuff (usually 4.0–4.5 cm).</li>\n<li>Place the PRB preperitoneally (lower-quadrant incision or via the external ring) and fill it with <span class=\"key\">23 mL</span>.</li>\n<li>Place the pump subdartos in the anterior scrotum.</li>\n<li>Cycle the device; do urethroscopy.</li>\n<li>Leave it <b>deactivated for 4–6 weeks</b>.</li>\n</ol>"], [6, "r", 12, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "4 · Operative technique", "<span class=\"key\">61–70</span> · Standard bulbar cuff"], [6, "l", 12, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "4 · Operative technique", "<b>Transcorporal cuff</b> (Webster 2002 <span class=\"tag\">MCQ</span>): the dissection goes through the corpora, so ventral tunica stays on the dorsal urethra and adds bulk."], [6, "a", 12, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "4 · Operative technique", "<p><b>Advance XP</b>:</p><ol>\n<li>Perineal incision; open bulbospongiosus.</li>\n<li>Divide the perineal body to release the bulb.</li>\n<li>Pass the helical trocar outside-in below the adductor longus tendon.</li>\n<li>Fix the mesh to the spongiosum.</li>\n<li>Tension it under cystoscopy until the mucosa coapts (the bulb moves 3–4 cm proximally).</li>\n</ol>"], [6, "a", 12, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "5 · AUS complications and management", "<p><b>Retention</b>:</p><ol>\n<li>Confirm the cuff is deactivated.</li>\n<li>Insert a small catheter for 24–48 h.</li>\n<li>If the second trial fails, then place a <b>suprapubic cystostomy</b>, avoiding the PRB.</li>\n<li>If retention lasts weeks, then the cuff is undersized: replace it.</li>\n</ol>"], [6, "l", 13, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "5 · AUS complications and management", "<b>Infection</b> occurs in <span class=\"key\">1–3%</span> (up to 10% if high-risk), usually staphylococci. <b>Scrotal pain is the key early sign</b>."], [6, "l", 13, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "5 · AUS complications and management", "<b>Erosion</b> occurs in <span class=\"key\">2–15%</span> (up to 35% with several risk factors). Remove <b>all components</b>."], [6, "l", 13, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "5 · AUS complications and management", "Reimplant after <span class=\"key\">3–6 months</span> at a <b>new site</b>, using a TC cuff with or without a low-pressure PRB."], [6, "p", 13, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "5 · AUS complications and management", "Sudden = device, gradual = urethra. Manage every complication to keep a salvageable urethra for the next cuff."], [6, "a", 15, "★ Putting it together", "A · Nocturia: three diary questions", "<ol>\n<li><b>Global polyuria?</b> If &gt;40 mL/kg/24 h, then think of diabetes, diabetes insipidus or polydipsia; always investigate.</li>\n<li><b>Nocturnal polyuria?</b> If the night fraction is &gt;20% (young) or &gt;33% (older), then look for heart failure, sleep apnoea, oedema, evening fluids; consider desmopressin with sodium checks.</li>\n<li><b>Reduced night capacity?</b> If NBCi &gt;1.3, then treat overactive bladder, obstruction or residual. Screen sleep in all (\"Sleep CALM\") (<span class=\"xref\">See Ch 112</span>).</li>\n</ol>"], [6, "p", 15, "★ Putting it together", "B · Post-prostatectomy stress incontinence", "Pelvic floor training comes first; severe leakage needs surgery by ~6 months. 24-h pad weight: mild &lt;150 g, moderate &lt;400 g. Mild–moderate leakage with a contractile detrusor and no radiotherapy suits a sling. Leakage &gt;250 g, radiotherapy or a failed sling needs an artificial sphincter. Erosion is spongiosal ischaemia (radiotherapy, prior erosion, urethroplasty): add tissue (transcorporal cuff) or lower pressure, never tighten. <span class=\"dag\">†</span> Remove eroded or infected devices (<span class=\"xref\">See Ch 123; Ch 106</span>)."], [7, "p", 2, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "1 · Scrotum", "Scrotal lymph goes to the groin, testicular lymph to the retroperitoneum. <span class=\"dag\">†</span>So scrotal violation in testis cancer adds the inguinal nodes to the at-risk field."], [7, "l", 2, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "2 · Testis", "Volume is <span class=\"key\">15–25 mL</span>, length 4.5–5.1 cm. The capsule is visceral tunica vaginalis, <b>tunica albuginea</b> (with smooth muscle) and tunica vasculosa."], [7, "l", 2, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "2 · Testis", "About 250 lobules hold <span class=\"key\">600–1200 seminiferous tubules</span>, which drain to the rete testis."], [7, "l", 2, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "2 · Testis", "The interstitium is <span class=\"key\">20–30%</span> of volume and holds the <b>Leydig cells</b>. <b>Sertoli</b> tight junctions form the blood–testis barrier."], [7, "p", 3, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "2 · Testis", "<b>Surgical rules</b>: no traction suture through the lower pole. Biopsy the <b>medial or lateral upper pole</b>; the midportion has fewest vessels. After vasectomy the deferential collateral may be gone, so preserve the testicular artery in later cord surgery and counsel about devascularisation."], [7, "l", 4, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "4 · Vas deferens", "It is <span class=\"key\">30–35 cm</span> long with a <span class=\"key\">0.2–0.7 mm</span> lumen and has <b>three muscle layers</b> (longitudinal, circular, longitudinal). Lymph drains to external and internal iliac nodes."], [7, "l", 4, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "5 · Seminal vesicles and ejaculatory ducts", "On <b>transrectal ultrasound (TRUS)</b>, a post-ejaculation anteroposterior (AP) diameter <span class=\"key\">&gt;16 mm</span> or volume <span class=\"key\">&gt;6 mL</span> means obstruction. TRUS also guides aspiration and vesiculography."], [7, "p", 5, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "5 · Seminal vesicles and ejaculatory ducts", "A normal vesicle empties at ejaculation; one that stays large is the imaging signature of ejaculatory duct obstruction."], [7, "l", 5, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "6 · Prostate", "TRUS volume is length × width × height × <span class=\"key\">0.52</span>, which underestimates."], [7, "l", 5, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "6 · Prostate", "The normal gland is <span class=\"key\">~25 mL</span>; the transition zone grows fastest with age. The peripheral zone is hyperechoic on TRUS."], [7, "l", 5, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "8 · Penis", "Sinusoidal smooth muscle is <span class=\"key\">~45%</span> of volume. Endothelial nitric oxide synthase (NOS) sustains erection."], [7, "l", 6, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "8 · Penis", "The <b>dorsal nerve</b> (pudendal, <span class=\"key\">S2–S4</span>) gives sensation; the <b>cavernous nerves</b> (pelvic plexus) give erection."], [7, "p", 6, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "8 · Penis", "Erection is veno-occlusive: filled sinusoids compress subtunical and emissary veins against the inelastic tunica. <span class=\"dag\">†</span>Tunical or smooth-muscle damage defeats this and causes venous leak."], [7, "r", 6, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "8 · Penis", "Peak systolic velocity · <span class=\"key\">&lt;30 cm/s</span> · Arterial insufficiency"], [7, "r", 6, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "8 · Penis", "End-diastolic velocity · <span class=\"key\">&gt;5 cm/s</span> · Veno-occlusive dysfunction"], [7, "r", 6, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "8 · Penis", "Resistive index · <span class=\"key\">&lt;0.80</span> · Veno-occlusive dysfunction"], [7, "l", 7, "Ch 67 · Male Reproductive Physiology", "1 · Hypothalamic–pituitary–gonadal axis", "Gonadotrophin-releasing hormone (GnRH) is a decapeptide from the preoptic and arcuate nuclei. Via the portal system, its only function is LH/FSH release. Half-life is <span class=\"key\">5–7 min</span>."], [7, "l", 7, "Ch 67 · Male Reproductive Physiology", "1 · Hypothalamic–pituitary–gonadal axis", "Its rhythms are pulsatile (every <span class=\"key\">90–120 min</span>), circadian (testosterone peaks early morning) and seasonal."], [7, "l", 8, "Ch 67 · Male Reproductive Physiology", "1 · Hypothalamic–pituitary–gonadal axis", "Testosterone output is ~<span class=\"key\">5 mg/day</span>, pulsatile. 5α-reductase converts it to <b>dihydrotestosterone (DHT)</b>, which is more potent and needed in most peripheral tissues (not testis or muscle). Aromatase converts it to <b>oestradiol</b>, which feeds back especially on FSH."], [7, "p", 8, "Ch 67 · Male Reproductive Physiology", "1 · Hypothalamic–pituitary–gonadal axis", "There are two loops: LH with Leydig cells (testosterone), and FSH with Sertoli cells (inhibin, oestradiol). So <b>LH reports Leydig function, while FSH and inhibin B report the tubules</b>. High FSH with low inhibin B means spermatogenic failure."], [7, "l", 8, "Ch 67 · Male Reproductive Physiology", "2 · Testis", "It has <span class=\"key\">600–1200 tubules</span> and ~<span class=\"key\">700 million Leydig cells</span> in young adults."], [7, "l", 8, "Ch 67 · Male Reproductive Physiology", "2 · Testis", "<b>Countercurrent exchange</b> cools arterial blood <span class=\"key\">2–4 °C</span> below core and recycles testosterone from vein to artery. It is lost in varicocele and cryptorchidism."], [7, "l", 9, "Ch 67 · Male Reproductive Physiology", "3 · Spermatogenesis", "Output is ~<span class=\"key\">123 million/day</span>, about 1000 per heartbeat."], [7, "l", 10, "Ch 67 · Male Reproductive Physiology", "4 · Epididymis", "<b>Transport</b> takes <span class=\"key\">2–12 days</span>, driven mainly by spontaneous rhythmic contraction. Recent ejaculation shortens only cauda transit."], [7, "p", 10, "Ch 67 · Male Reproductive Physiology", "4 · Epididymis", "Pregnancy occurs even after vasoepididymostomy at the efferent ductules, but <b>the more distal the anastomosis, the better the fertility</b>. After vasectomy for &gt;15 years, motility is lower after reversal because of epididymal dysfunction."], [7, "l", 11, "Ch 67 · Male Reproductive Physiology", "5 · Vas deferens, seminal vesicles, ejaculatory ducts", "The <b>seminal vesicle</b> is a 5–7 cm coiled tubule that gives ~<span class=\"key\">80%</span> of seminal volume in the late fractions. Its fluid is alkaline and carries <b>fructose</b> and prostaglandins; <b>semenogelin I</b> forms the coagulum. Semen antioxidants include glutathione peroxidase, superoxide dismutase (SOD) and catalase."], [7, "a", 12, "Ch 67 · Male Reproductive Physiology", "7 · Ejaculation physiology †", "<ol>\n<li><b>Emission</b> (sympathetic, T10–L2 via the hypogastric nerve; α1): vas, seminal vesicle and prostate contract and deliver semen to the posterior urethra.</li>\n<li>The <b>bladder neck closes</b>. If it fails to close, then ejaculation is retrograde.</li>\n<li><b>Expulsion</b> (somatic, S2–S4 pudendal): rhythmic bulbospongiosus and pelvic floor contractions, with a relaxed external sphincter, give an antegrade ejaculate.</li>\n</ol>"], [7, "l", 13, "Ch 68 · Integrated Men's Health: Androgen Deficiency, Cardiovascular Risk and Metabolic Syndrome", "2 · The longevity gap", "Male life expectancy was <span class=\"key\">76.1</span> versus 81.1 years for females (2016)."], [7, "p", 14, "Ch 68 · Integrated Men's Health: Androgen Deficiency, Cardiovascular Risk and Metabolic Syndrome", "4 · Urologic disorders of focus", "<span class=\"dag\">†</span> <b>Fertility caution</b>: exogenous T suppresses LH/FSH and intratesticular T, which causes oligo- or azoospermia. Men wanting children should avoid TRT and use clomiphene, human chorionic gonadotrophin (hCG) or aromatase inhibitors <span class=\"xref\">(see Ch 69)</span>."], [7, "r", 15, "Ch 68 · Integrated Men's Health: Androgen Deficiency, Cardiovascular Risk and Metabolic Syndrome", "5 · Cardiovascular prevention", "LDL-C 70–189, 10-year risk ≥<span class=\"key\">7.5%</span> · Moderate–high intensity statin"], [7, "l", 15, "Ch 68 · Integrated Men's Health: Androgen Deficiency, Cardiovascular Risk and Metabolic Syndrome", "7 · GI, skin and mental health", "Iron deficiency anaemia carries &gt;30-fold GI malignancy risk. Colorectal screening: <span class=\"key\">45–75</span> years. Long-term proton pump inhibitor use: check for Barrett."], [7, "l", 17, "Ch 69 · Male Infertility", "1 · Definition and overview", "Infertility is no pregnancy after <span class=\"key\">1 year</span> of unprotected intercourse. It affects ~15% of couples; male and female factors contribute equally."], [7, "p", 17, "Ch 69 · Male Infertility", "2 · History", "<b>Exogenous testosterone (T) is a contraceptive</b>. It is aromatised to oestradiol (E2), which feeds back on the pituitary and lowers luteinising hormone (LH). Intratesticular T then falls, and spermatogenesis falls with it. Recovery usually takes ≥4 months after stopping (after ≤2 years' use); after longer use it is unknown."], [7, "l", 18, "Ch 69 · Male Infertility", "2 · History", "The American Urological Association (AUA) advises orchidopexy within <span class=\"key\">18 months</span>, because germ cells are lost from 15–18 months. If this was missed, surgery before 10 years still improves later sperm retrieval."], [7, "r", 18, "Ch 69 · Male Infertility", "3 · Physical examination", "Seager caliper (long axis) · <span class=\"key\">≤4.6 cm</span>"], [7, "a", 19, "Ch 69 · Male Infertility", "4 · Endocrine evaluation", "<ol>\n<li>Take a morning sample for total T, sex hormone-binding globulin (SHBG) and albumin, and calculate bioavailable T.</li>\n<li>Measure LH and follicle-stimulating hormone (FSH), then E2.</li>\n<li>Measure prolactin only if indicated.</li>\n</ol>"], [7, "l", 19, "Ch 69 · Male Infertility", "4 · Endocrine evaluation", "Adequate total T is ≥<span class=\"key\">280–300 ng/dL</span>. Low T is common even with density &gt;20 million/mL, so assess every infertile man (not needed above ~66 million/mL)."], [7, "l", 19, "Ch 69 · Male Infertility", "4 · Endocrine evaluation", "A T (ng/dL) to E2 (pg/mL) ratio <span class=\"key\">&lt;10:1</span> means aromatase excess."], [7, "a", 19, "Ch 69 · Male Infertility", "6 · Genetic testing", "<ol>\n<li>If non-obstructive azoospermia (NOA) or density <span class=\"key\">&lt;5 million/mL</span>, then do karyotype and Y-microdeletion testing (ASRM/AUA 2021).</li>\n<li>If CBAVD (or idiopathic EDO), then test CFTR in the man <b>and his partner</b>.</li>\n</ol>"], [7, "r", 20, "Ch 69 · Male Infertility", "8 · Azoospermia: obstructive (OA) vs non-obstructive (NOA)", "FSH · <span class=\"key\">≤7.6 IU/L</span> · &gt;7.6 IU/L"], [7, "a", 20, "Ch 69 · Male Infertility", "8 · Azoospermia: obstructive (OA) vs non-obstructive (NOA)", "<ol>\n<li>If the vasa are absent, then test CFTR in both partners.</li>\n<li>If the vasa are present and volume is &lt;1 mL, then do postejaculatory urinalysis. Sperm in urine means retrograde ejaculation; no sperm means TRUS for EDO.</li>\n<li>If volume is normal, then use FSH and testis size to separate OA from NOA.</li>\n</ol>"], [7, "l", 23, "Ch 70 · Surgical Management of Male Infertility", "2 · Surgical anatomy", "The epididymis can be dissected off the testis (inferior/medial epididymal arteries ligated) if the <b>superior epididymal artery is intact</b>; this gains <span class=\"key\">4–6 cm</span>."], [7, "a", 24, "Ch 70 · Surgical Management of Male Infertility", "3 · Diagnostic testis biopsy", "<ol>\n<li>Give a cord block; choose the larger testis (opposite a varicocele).</li>\n<li>Make a 2 cm incision, open the tunica vaginalis, place stay sutures.</li>\n<li>Incise the albuginea 3–4 mm, using bipolar on crossing vessels.</li>\n<li>Take a pea-sized sample with iris scissors (no forceps).</li>\n<li>Do a touch prep, then a wet prep. If negative, then biopsy the other side.</li>\n<li>Close the tunica vaginalis with continuous 5-0; no antibiotics.</li>\n</ol>"], [7, "a", 24, "Ch 70 · Surgical Management of Male Infertility", "4 · Vasography", "<ol>\n<li>High scrotal incision; find the vas at the straight–convoluted junction; hemivasotomy at 25×.</li>\n<li><b>Examine vasal fluid first.</b> If motile sperm, then barbotage and cryopreserve <b>before any dye</b>.</li>\n<li>Pass a 24-G sheath into the abdominal end and inject 1 mL saline. If flow is easy, then it is patent.</li>\n<li>Rarely, give dilute indigo carmine; blue urine confirms.</li>\n<li>Use formal contrast only for obstruction above the internal ring.</li>\n<li>Close with 10-0 mucosa and 8-0 muscularis.</li>\n</ol>"], [7, "l", 25, "Ch 70 · Surgical Management of Male Infertility", "5 · Vasovasostomy (vasectomy reversal)", "<b>Length</b>, in escalating steps: dissect to the external then internal ring; free the convoluted vas (4–6 cm; <b>do not unravel</b>); reroute beneath the inguinal floor; take the epididymis off the testis. This bridges gaps up to <span class=\"key\">10 cm</span>."], [7, "p", 26, "Ch 70 · Surgical Management of Male Infertility", "5 · Vasovasostomy (vasectomy reversal)", "Clear watery fluid still gets vasovasostomy: the epididymis has not blown out, and sperm usually return. Toothpaste fluid means secondary epididymal blow-out, so open the tunica vaginalis; a discrete level (dilated above, collapsed below) confirms it. When in doubt or inexperienced, do vasovasostomy."], [7, "a", 27, "Ch 70 · Surgical Management of Male Infertility", "6 · Vasoepididymostomy", "<ol>\n<li>Hemitransect the vas at the straight–convoluted junction; sample fluid; confirm patency.</li>\n<li>Open the tunica vaginalis; choose a site <b>above</b> the obstruction where tubules are dilated. If unclear, then puncture distal to proximal until sperm appear.</li>\n<li>Make a 3–4 mm tunic window.</li>\n<li>Bring the vas through the tunica vaginalis, <b>fixed with 5-0 Prolene to the albuginea (tension relief)</b>.</li>\n<li>Place posterior tunic–vas 8-0, then intussusception sutures, then outer tunic–vas adventitia.</li>\n</ol>"], [7, "a", 27, "Ch 70 · Surgical Management of Male Infertility", "7 · TURED", "<ol>\n<li>Use a 24-Fr resectoscope with a finger in the rectum.</li>\n<li>Resect the <b>verumontanum</b> to open the dilated orifices or cyst, sparing bladder neck, sphincter and rectum.</li>\n<li><b>Blue efflux confirms</b> adequacy; coagulate minimally.</li>\n<li>Catheter overnight; 7 days of antibiotics.</li>\n</ol>"], [7, "p", 28, "Ch 70 · Surgical Management of Male Infertility", "8 · Sperm retrieval", "Paradox: in obstruction the <b>most motile sperm are proximal</b> (efferent ductules); distal tubules hold senescent fragments and macrophages. Yet fertilisation is best when the longest epididymis is preserved."], [7, "a", 28, "Ch 70 · Surgical Management of Male Infertility", "8 · Sperm retrieval", "<ol>\n<li>Micro-TESE: general or regional anaesthesia.</li>\n<li>At 10×, find the avascular plane on the anterior albuginea; make a wide equatorial incision and bivalve the testis.</li>\n<li>Excise larger tubules; an andrologist in theatre examines them; map positives.</li>\n<li>If negative, then explore the other testis.</li>\n<li>Close the albuginea with 5-0 and the tunica vaginalis with 4-0.</li>\n</ol>"], [7, "a", 29, "Ch 70 · Surgical Management of Male Infertility", "10 · Varicocelectomy", "<ol>\n<li>Local anaesthesia with sedation; 2–3 cm incision over the external ring.</li>\n<li>Deliver the cord on a Penrose, excluding the ilioinguinal nerve and genital branch.</li>\n<li><b>Map arteries with micro-Doppler before handling.</b></li>\n<li>Open the spermatic fasciae; work at 10–25× with 1% papaverine; loop the artery.</li>\n<li>Ligate <b>all veins except vasal</b>; preserve lymphatics.</li>\n<li>Deliver the testis; ligate external spermatic and gubernacular veins.</li>\n<li>Do the impulse test. If there is no impulse, then a vein was missed.</li>\n</ol>"], [7, "p", 29, "Ch 70 · Surgical Management of Male Infertility", "10 · Varicocelectomy", "Recurrence means a vein was missed; hydrocele, a lymphatic tied; atrophy, an artery tied. Microsurgery with testicular delivery addresses all three."], [7, "l", 30, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "1 · Definition and key concepts", "Milestones <span class=\"tag\">MCQ</span>: Leonardo da Vinci (hanged men) showed erection is blood; the 1990s identified nitric oxide (NO); 1998 brought oral phosphodiesterase type 5 inhibitors (PDE5Is)."], [7, "l", 30, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "2 · Functional anatomy", "Sinusoidal oxygen tension (Po<sub>2</sub>) is venous when flaccid (<span class=\"key\">~35 mm Hg</span>) and arterial when erect (<span class=\"key\">~90 mm Hg</span>)."], [7, "p", 31, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "2 · Functional anatomy", "Arterial and venous anatomy vary widely between men, so the same \"nerve-sparing\" or pelvic operation gives different erectile outcomes."], [7, "l", 31, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "3 · Haemodynamics: phases of erection and detumescence", "Full-erection intracavernous pressure (ICP) plateaus at <span class=\"key\">~100 mm Hg</span>; the rigid phase is suprasystolic. The cavernous (autonomic) nerve drives phases 1–3, and the pudendal nerve, via ischiocavernosus, drives phase 4."], [7, "r", 31, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "4 · Neuroanatomy", "Origin · <span class=\"key\">T11–L2</span> (often T10–T12) · <span class=\"key\">S2–S4</span> intermediolateral columns · S2–S4; motor from <b>Onuf nucleus</b>"], [7, "p", 33, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "4 · Neuroanatomy", "NO synthase (NOS) inhibitors block both apomorphine- and oxytocin-induced erections, so NO is the final common central pathway. <b>Trap</b>: noradrenaline is pro-sexual centrally but the principal anti-erectile transmitter peripherally."], [7, "l", 34, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "5 · Molecular mechanisms of smooth muscle tone", "Acetylcholine acts indirectly (endothelial NO, presynaptic adrenergic inhibition), so <b>atropine does not abolish</b> neural erection <span class=\"tag\">MCQ</span>."], [7, "p", 34, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "5 · Molecular mechanisms of smooth muscle tone", "Corporal tone is a tug-of-war over one phosphorylation site (MLC20): Ca<sup>2+</sup>–calmodulin–MLC kinase and Rho-kinase keep it phosphorylated; NO–cGMP–PKG removes the phosphate. <b>Trap</b>: \"MLCP\" means the phosphatase."], [7, "l", 34, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "7 · Risk factors and endothelial dysfunction", "<b>Artery-size hypothesis</b>: smaller penile arteries become symptomatic first. ED preceded coronary artery disease (CAD) by a mean of <span class=\"key\">~2 years</span>, so ED is a <b>sentinel</b> and needs cardiac risk stratification <span class=\"xref\">see Ch 72</span>."], [7, "r", 35, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "8 · Pathophysiology by type", "Upper cord (above sacral centre) · Preserved in <span class=\"key\">~95%</span>; brief, need continuous stimulation · Lost"], [7, "r", 35, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "8 · Pathophysiology by type", "Lower cord (sacral) · Preserved in only <span class=\"key\">~25%</span> · May occur (thoracolumbar pathway); marginal tumescence"], [7, "l", 35, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "8 · Pathophysiology by type", "AUA: measure <b>morning, fasting</b> T in all men with ED. Low T is <span class=\"key\">&lt;300 ng/dL</span>; treat only with ≥2 low levels and symptoms. Nocturnal erections need ~200 ng/dL."], [7, "l", 35, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "8 · Pathophysiology by type", "Nocturnal erections are androgen-dependent, but erections to visual stimuli are largely independent <span class=\"tag\">MCQ</span>. Dihydrotestosterone (DHT) is the key penile androgen."], [7, "p", 36, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "8 · Pathophysiology by type", "Veno-occlusion is an emergent property of healthy tissue (elastic tunica and fully relaxed trabeculae). So most \"venous leak\" is really cavernosal smooth muscle disease, which is why venous ligation surgery fails and is investigational."], [7, "l", 36, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "8 · Pathophysiology by type", "<b>Chronic kidney disease</b>: up to <span class=\"key\">80%</span> of men with end-stage renal disease have ED, and it persists in ~half after transplant."], [7, "p", 37, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "8 · Pathophysiology by type", "Why ED is a sentinel: nearly every systemic disease reaches the penis through the same three doors — endothelial NO failure, Rho-kinase-driven contraction and TGF-β-driven fibrosis."], [7, "l", 38, "Ch 72 · Evaluation and Management of Erectile Dysfunction", "1 · Definition and significance", "<b>Erectile dysfunction (ED)</b> (American Urological Association, AUA): a consistent or recurrent inability to attain and/or maintain an erection sufficient for sexual satisfaction. Minimum <span class=\"key\">3 months</span>, except after trauma or surgery."], [7, "l", 38, "Ch 72 · Evaluation and Management of Erectile Dysfunction", "1 · Definition and significance", "About <span class=\"key\">20%</span> of adult men have ED (up to 15% at 40–49 y; up to 40% at 60–69 y). One in four new presenters is under 40; half of these are severe."], [7, "p", 39, "Ch 72 · Evaluation and Management of Erectile Dysfunction", "3 · Basic evaluation", "Preserved nocturnal/morning erections prove an intact neurovascular axis, the strongest historical pointer to psychogenic ED."], [7, "p", 39, "Ch 72 · Evaluation and Management of Erectile Dysfunction", "3 · Basic evaluation", "The basic work-up finds the disease behind the ED (undiagnosed DM, dyslipidaemia, hypogonadism, CV risk); it does not prove ED."], [7, "l", 40, "Ch 72 · Evaluation and Management of Erectile Dysfunction", "4 · Hormonal evaluation", "The AUA threshold is <span class=\"key\">300 ng/dL (10.4 nmol/L)</span>; above about 230 ng/dL, sexual function correlates only weakly with T. Order a pituitary magnetic resonance imaging (MRI) scan if T is <span class=\"key\">&lt;150 ng/dL</span>."], [7, "r", 41, "Ch 72 · Evaluation and Management of Erectile Dysfunction", "5 · Specialised testing", "PSV · <span class=\"key\">&lt;25 cm/s</span> (25–35 borderline; &gt;35 normal) · Stays &gt;25 cm/s"], [7, "r", 41, "Ch 72 · Evaluation and Management of Erectile Dysfunction", "5 · Specialised testing", "EDV · — · <span class=\"key\">&gt;5 cm/s</span>"], [7, "r", 41, "Ch 72 · Evaluation and Management of Erectile Dysfunction", "5 · Specialised testing", "Resistive index (RI) = (PSV − EDV)/PSV · — · <span class=\"key\">&lt;0.75</span> (normal &gt;0.9)"], [7, "p", 41, "Ch 72 · Evaluation and Management of Erectile Dysfunction", "5 · Specialised testing", "Venous leak can be diagnosed only with adequate inflow and full smooth muscle relaxation; an anxious patient mimics veno-occlusive dysfunction, so redose first. Anatomical variants (dorsal–cavernous communications, early branching) can falsely suggest arteriogenic ED."], [7, "a", 41, "Ch 72 · Evaluation and Management of Erectile Dysfunction", "6 · Treatment", "<ol>\n<li>Treat reversible causes (lifestyle, drugs, hormones, psychosocial) and stratify CV risk.</li>\n<li>Shared decision: PDE5I, VED, IU alprostadil or ICI. Low-intensity extracorporeal shock wave therapy (Li-ESWT) is investigational.</li>\n<li>If the response is inadequate, then optimise, combine or switch.</li>\n<li>If still inadequate, then offer a penile prosthesis <span class=\"xref\">(see Ch 75)</span>.</li>\n</ol>"], [7, "r", 42, "Ch 72 · Evaluation and Management of Erectile Dysfunction", "6 · Treatment", "Half-life (h) · 3–5 · 4–5 · <span class=\"key\">17.5</span> · 3–5"], [7, "l", 42, "Ch 72 · Evaluation and Management of Erectile Dysfunction", "6 · Treatment", "<b>Nitrates</b> in any form, including amyl nitrite \"poppers\", cause profound hypotension; use more than 2 weeks earlier is not a contraindication. If angina occurs, give no nitrates for <span class=\"key\">24 h</span> (sildenafil, vardenafil) or <span class=\"key\">48 h</span> (tadalafil)."], [7, "l", 46, "Ch 73 · Priapism", "1 · Definition and classification", "<b>Priapism</b> is a full or partial erection lasting <span class=\"key\">≥4 h</span> beyond, or unrelated to, sexual stimulation. It is an emergency because it causes fibrosis, shortening and permanent erectile dysfunction (ED)."], [7, "r", 46, "Ch 73 · Priapism", "1 · Definition and classification", "Share · <span class=\"key\">95%</span> · Subset of ischaemic · &lt;5%"], [7, "p", 46, "Ch 73 · Priapism", "1 · Definition and classification", "Trap: stuttering priapism is <b>ischaemic</b>, so any episode lasting ≥4 h needs the same first-line treatment."], [7, "l", 47, "Ch 73 · Priapism", "2 · Aetiology", "<b>Recurrence after a shunt</b> may mean shunt thrombosis. Give <span class=\"key\">aspirin 325 mg + heparin 5000 U subcutaneously</span> before surgery, then aspirin 81 mg daily for 2 weeks."], [7, "l", 47, "Ch 73 · Priapism", "2 · Aetiology", "Lifetime risk is <span class=\"key\">29–42%</span>; SCD causes 23% of adult and <span class=\"key\">63% of paediatric</span> ischaemic priapism. Onset is about 15 years; stuttering is commoner than major episodes."], [7, "a", 47, "Ch 73 · Priapism", "4 · Evaluation", "<ol>\n<li>History, examination and corporal blood gas.</li>\n<li>If ischaemic, then acute ischaemic algorithm.</li>\n<li>If indeterminate, then penile/perineal PDUS.</li>\n<li>If non-ischaemic, then expectant algorithm.</li>\n</ol>"], [7, "a", 48, "Ch 73 · Priapism", "5 · Acute ischaemic priapism (AUA/SMSNA)", "<ol>\n<li>If &lt;36 h, then aspirate ± irrigate and inject intracavernosal phenylephrine (BP and cardiac monitoring).</li>\n<li>If that fails, then distal shunt ± tunnelling; tunnel if not done.</li>\n<li>If still erect, then proximal shunt or penoscrotal decompression; if refractory, prosthesis.</li>\n<li>If &gt;36 h, then counsel high ED risk with analgesia/follow-up, OR early penile prosthesis.</li>\n</ol>"], [7, "l", 48, "Ch 73 · Priapism", "5 · Acute ischaemic priapism (AUA/SMSNA)", "Dilute to <span class=\"key\">100–500 µg/mL</span>; give <b>1-mL aliquots every 3–5 min</b> for up to <span class=\"key\">1 h</span> before failure; <span class=\"dag\">†</span>maximum ≈1 mg in 1 h (European Association of Urology, EAU)."], [7, "l", 49, "Ch 73 · Priapism", "5 · Acute ischaemic priapism (AUA/SMSNA)", "For priapism <span class=\"key\">&gt;36 h</span> or failed shunts; oedematous corpora dilate easily, while delayed surgery meets dense fibrosis."], [7, "a", 49, "Ch 73 · Priapism", "6 · Non-ischaemic priapism", "<ol>\n<li>Observe and reassess at 4 weeks.</li>\n<li>If it persists, then PDUS (fistula site, size), counsel, and selectively embolise the internal pudendal/cavernosal artery.</li>\n<li>If it recurs, then repeat embolisation with a non-resorbable agent.</li>\n<li>Only after repeated failure, ligate surgically.</li>\n</ol>"], [7, "m", 50, "Ch 73 · Priapism", "9 · MCQ one-liners", "The first case report of priapism was in 1824."], [7, "l", 51, "Ch 74 · Disorders of Male Orgasm and Ejaculation", "2 · Physiology of ejaculation", "Lumbar interneurons at <span class=\"key\">L3–L5</span> form the <b>spinal ejaculation generator</b>. They coordinate thoracolumbar and lumbosacral nuclei under genital and brain input."], [7, "p", 51, "Ch 74 · Disorders of Male Orgasm and Ejaculation", "2 · Physiology of ejaculation", "Serotonin brakes, dopamine accelerates: PE drugs raise synaptic 5-HT; DE drugs are dopaminergic, noradrenergic or anti-serotonergic."], [7, "l", 52, "Ch 74 · Disorders of Male Orgasm and Ejaculation", "3 · Premature ejaculation — definition and classification", "The International Society for Sexual Medicine (ISSM) requires ejaculation within <span class=\"key\">about 1 min</span> (lifelong) or a bothersome fall, often to <span class=\"key\">≤ about 3 min</span> (acquired). It is the first <b>evidence-based</b> definition, for vaginal intercourse only; \"about 1 min\" allows ~90 s. <b>Latency alone never suffices</b>."], [7, "l", 52, "Ch 74 · Disorders of Male Orgasm and Ejaculation", "3 · Premature ejaculation — definition and classification", "<span class=\"tag\">MCQ</span> ICD-10 is the only older definition with a number (≤15 s); Masters and Johnson: partner satisfied in &lt;50% of episodes."], [7, "l", 52, "Ch 74 · Disorders of Male Orgasm and Ejaculation", "3 · Premature ejaculation — definition and classification", "Community stopwatch intravaginal ejaculatory latency time (IELT) is positively skewed, median <span class=\"key\">5.4 min</span>; ≤1 min is statistically abnormal."], [7, "a", 52, "Ch 74 · Disorders of Male Orgasm and Ejaculation", "5 · Premature ejaculation — treatment", "<ol>\n<li>Confirm PE.</li>\n<li>If it is secondary to ED or another dysfunction, then treat that primary cause.</li>\n<li>If lifelong, then SSRI ± behavioural therapy (patient preference).</li>\n<li>If acquired, then treat the cause ± behavioural therapy/SSRI; try withdrawal after 6–8 weeks.</li>\n<li>If variable or subjective, then reassurance, education, psychotherapy.</li>\n</ol>"], [7, "p", 54, "Ch 74 · Disorders of Male Orgasm and Ejaculation", "5 · Premature ejaculation — treatment", "The real limiter in PE is adherence, not efficacy: most stop SSRIs and topicals (cost, lost spontaneity, \"antidepressant\" stigma)."], [7, "a", 54, "Ch 74 · Disorders of Male Orgasm and Ejaculation", "6 · Delayed ejaculation, anejaculation and anorgasmia", "<ol>\n<li>Orgasm? If never or sometimes, then inhibited orgasm (psychosexual therapy) or ageing (reassure, change technique).</li>\n<li>If always but no ejaculate, then look for <b>sperm in post-orgasm urine</b>; if present, RE.</li>\n<li>If absent (aspermia), then failure of emission (neurogenic, drug, metabolic) or ejaculatory duct obstruction (EDO).</li>\n</ol>"], [7, "l", 55, "Ch 74 · Disorders of Male Orgasm and Ejaculation", "7 · Retrograde ejaculation", "Diagnosis: <span class=\"key\">&gt;5–10 sperm/high-power field</span> in urine passed after masturbation confirms RE."], [7, "a", 56, "Ch 74 · Disorders of Male Orgasm and Ejaculation", "8 · Sperm retrieval in SCI", "<ol>\n<li><b>Penile vibratory stimulation (PVS)</b> is first line, with up to ~70% success; it needs an intact reflex at the T12–S1 level.</li>\n<li>If PVS fails, then <b>electroejaculation (EEJ)</b>: a rectal probe stimulates hypogastric sympathetic efferents; effective and safe.</li>\n<li>If EEJ fails, then prostate massage, then surgical retrieval (TESE/TESA/MESA/PESA); testicular sperm extraction succeeds in most.</li>\n</ol>"], [7, "l", 57, "Ch 75 · Surgery for Erectile Dysfunction", "1 · Place of surgery and devices", "Coloplast cylinders are polyurethane (Bioflex), so keep cautery <span class=\"key\">&lt;35 W</span>; Boston and Rigicon silicone–fabric–silicone cylinders tolerate cautery."], [7, "a", 58, "Ch 75 · Surgery for Erectile Dysfunction", "4 · Operative technique (three-piece)", "<ol>\n<li>Catheter; expose the tunica.</li>\n<li>Two 2-0 polydioxanone (PDS) stay sutures per corpus; longitudinal corporotomy.</li>\n<li>Dilate proximal, then distal (Metzenbaum, Hegar/Brooks 7→13 mm).</li>\n<li>Goalpost test; measure (Furlow).</li>\n<li>Cylinders in; test inflation 1. Close corporotomies; test inflation 2.</li>\n<li>Reservoir, then pump; connect; test inflation 3.</li>\n<li>Irrigate and close.</li>\n</ol>"], [7, "p", 59, "Ch 75 · Surgery for Erectile Dysfunction", "5 · Intra-operative problems", "No catheter after distal urethral perforation: the defect is not closed, and the urinary stream draws fluid into the urethra (Bernoulli), so urine does not enter it. Wait 5–6 months for scar to obliterate the false tract. Most intra-operative errors are <b>prevented by instrument direction</b> and <b>detected by symmetry</b> (goalpost test, midline Foley)."], [7, "p", 59, "Ch 75 · Surgery for Erectile Dysfunction", "5 · Intra-operative problems", "After robotic prostatectomy the peritoneum is not replaced and bowel fixes near the internal ring, so a blind inguinal Retzius reservoir can compress bowel. Choose an ectopic site or place it under vision."], [7, "l", 60, "Ch 75 · Surgery for Erectile Dysfunction", "8 · Post-operative care", "Activation is at <span class=\"key\">4–6 weeks</span> with the partner present; then cycle daily. Partners are slightly less satisfied; dissatisfaction is about length and rigidity."], [7, "p", 61, "Ch 76 · Diagnosis and Management of Peyronie Disease", "1 · Definition", "Myths corrected: PD is <b>not rare</b> (3–20%; higher in diabetes and ED). <b>Spontaneous resolution is rare</b>: up to half worsen untreated, so \"wait 6–12 months\" is a myth. It affects teens to 70s, all races; flaccid trauma can trigger it; <b>calcification is not a marker of chronic disease</b>."], [7, "l", 61, "Ch 76 · Diagnosis and Management of Peyronie Disease", "2 · Anatomy and pathophysiology", "The longitudinal layer is thinnest at 3 and 9 o'clock and <b>absent at 5–7 o'clock</b>, so the dorsum buckles; <span class=\"key\">60–70% of plaques are dorsal</span> with septal involvement."], [7, "r", 61, "Ch 76 · Diagnosis and Management of Peyronie Disease", "3 · Clinical features and phases", "Surgery · Not appropriate · When <span class=\"key\">≥12 months from onset and stable ≥6 months</span>"], [7, "l", 62, "Ch 76 · Diagnosis and Management of Peyronie Disease", "5 · Non-surgical management", "<b>Protocol (IMPRESS)</b>: 2 injections of <span class=\"key\">0.58 mg</span> 24–72 h apart, then <b>model</b> the penis 24–72 h after the second. Up to <span class=\"key\">4 cycles, 6 weeks apart</span> (max 8 injections). Modelling is essential."], [7, "l", 62, "Ch 76 · Diagnosis and Management of Peyronie Disease", "5 · Non-surgical management", "<b>AUA criteria</b>: stable disease, curvature <span class=\"key\">&gt;30° and &lt;90°</span> and intact erections (with or without medication). IMPRESS excluded ventral plaques, extensive calcification and disease &lt;12 months."], [7, "a", 64, "Ch 76 · Diagnosis and Management of Peyronie Disease", "6 · Surgery", "<ol>\n<li>Ask: is the erection adequate (with or without a PDE5I)?</li>\n<li>If <b>no</b>, then place an inflatable prosthesis with modelling. If the curve persists, incise with or without a graft (graft if defect &gt;2 cm).</li>\n<li>If <b>yes</b>, do PDDUS. If the curve is simple and &lt;60–70°, with no hourglass or hinge and acceptable length loss, then <b>plicate</b> (if length loss is unacceptable, graft).</li>\n<li>If <b>yes</b> but the curve is complex/multiplanar &gt;60–70°, or there is severe indentation/hourglass, hinge or a short penis (&lt;9 cm stretched), then do <b>plaque incision/partial excision with graft</b> if the ED risk is accepted (otherwise prosthesis).</li>\n</ol>"], [7, "a", 66, "★ Putting it together: andrology decisions", "A · Infertile man: work-up", "<ol>\n<li><b>History and examination</b> (both partners): toxins, testosterone use, mumps, cryptorchidism; testis volume, vasa, varicocele (see Ch 69).</li>\n<li><b>Two semen analyses</b> (abstinence 2–7 days). Low volume with acid pH suggests ejaculatory duct obstruction (EDO) or congenital bilateral absent vas (CBAVD); post-ejaculate urine detects retrograde ejaculation.</li>\n<li><b>Hormones</b> (low count or sexual dysfunction): follicle-stimulating hormone (FSH) and testosterone; if testosterone is low, luteinising hormone (LH) and prolactin.</li>\n<li><b>Genetics</b> (azoospermia, severe oligozoospermia): karyotype, Y microdeletions; CFTR (cystic fibrosis gene) in CBAVD, plus partner.</li>\n</ol>"], [7, "p", 66, "★ Putting it together: andrology decisions", "B · Azoospermia: obstructive or not", "<span class=\"dag\">†</span> Reversal suits a younger partner wanting &gt;1 child; ICSI suits an older partner or female factor. Copious vas fluid (even clear and sperm-free) or sperm/parts means VV; toothpaste-like fluid or none means VE (<span class=\"xref\">see Ch 70</span>)."], [7, "a", 67, "★ Putting it together: andrology decisions", "C · Erectile dysfunction ladder", "<ol>\n<li><b>Assess:</b> International Index of Erectile Function (IIEF-5) or SHIM score, exam, glycated haemoglobin (HbA1c), lipids, morning testosterone. ED is a cardiovascular sentinel: stratify cardiac risk (see Ch 72).</li>\n<li><b>Modify</b> risk factors and drugs; treating hypogonadism rescues phosphodiesterase type 5 inhibitor (PDE5I) failures.</li>\n<li><b>Shared decision:</b> PDE5I (never with nitrates; re-counsel before declaring failure), vacuum, intraurethral alprostadil or intracavernosal injection (alprostadil/trimix).</li>\n<li><b>Penile prosthesis</b> (inflatable three-piece) if others fail; highest satisfaction. Infected: remove all, with or without salvage (see Ch 75).</li>\n<li><b>Young, focal post-traumatic arterial occlusion</b> → revascularisation.</li>\n</ol>"], [7, "p", 67, "★ Putting it together: andrology decisions", "D · Priapism: ischaemic vs non-ischaemic", "Sickle cell: treat as above (no waiting for transfusion); no chilled irrigation; involve haematology. Stuttering priapism: daily PDE5I, nightly pseudoephedrine, or hormonal suppression after puberty (<span class=\"xref\">see Ch 73</span>)."], [7, "a", 67, "★ Putting it together: andrology decisions", "E · Peyronie disease", "<ol>\n<li><b>Active</b>: analgesia, traction. Collagenase (CCH): stable dorsal/lateral 30–90°, intact erections; else verapamil, interferon α-2b.</li>\n<li><b>Surgery</b>: ≥12 months from onset, stable ≥6 months; document stretched penile length (SPL) and erections (see Ch 76).</li>\n<li>If <b>erections are good</b>: simple &lt;60–70°, no hourglass/hinge, adequate length → plication; complex, hourglass/hinge or short → incision/partial excision + graft (more ED).</li>\n<li>If <b>erections are poor</b> despite PDE5I → inflatable prosthesis, with or without modelling.</li>\n</ol>"], [7, "p", 68, "★ Putting it together: andrology decisions", "F · Premature ejaculation (PE)", "Diagnosis: latency (lifelong ≈1 min or less), inability to delay and distress, never latency alone. Treat ED first. Options: stop–start or squeeze, lidocaine–prilocaine spray, on-demand dapoxetine (only licensed oral drug outside the US), daily selective serotonin reuptake inhibitor (SSRI; paroxetine best), tramadol (off-label, addiction risk) (<span class=\"xref\">see Ch 74</span>)."], [8, "p", 2, "Ch 78 · Surgical, Radiographic and Endoscopic Anatomy of the Retroperitoneum", "1 · Definition, boundaries and organs", "Secondarily retroperitoneal organs lie <b>in front of</b> the kidney, so colon, duodenum and pancreas are always in the surgeon's path to the kidney."], [8, "l", 2, "Ch 78 · Surgical, Radiographic and Endoscopic Anatomy of the Retroperitoneum", "2 · Posterior abdominal wall and surface landmarks", "The upper pole is at the 11th rib (left) and 12th (right, lower). The hilum is at <span class=\"key\">L1</span>; the lower pole at L3–L4."], [8, "l", 3, "Ch 78 · Surgical, Radiographic and Endoscopic Anatomy of the Retroperitoneum", "3 · Retroperitoneal fasciae and spaces", "The Toldt (anterior) lamina is thinner; the Zuckerkandl (posterior) lamina is thicker and seen more on imaging. <span class=\"tag\">MCQ</span> Gerota described only the anterior, yet his name covers both."], [8, "p", 4, "Ch 78 · Surgical, Radiographic and Endoscopic Anatomy of the Retroperitoneum", "6 · Lymphatics", "The testis is embryologically retroperitoneal, so it drains to where it began. Crossover is one-way (right to left), so right templates include interaortocaval and some para-aortic tissue. <span class=\"xref\">See Ch 80, 81</span>"], [8, "l", 4, "Ch 78 · Surgical, Radiographic and Endoscopic Anatomy of the Retroperitoneum", "7 · Nerves", "<b>Parasympathetic</b> outflow is craniosacral (III, VII, IX, X, S2–S4), with ganglia in the organ wall. <b>Sympathetic</b> outflow is thoracolumbar, <span class=\"key\">T1–L2</span>."], [8, "l", 5, "Ch 78 · Surgical, Radiographic and Endoscopic Anatomy of the Retroperitoneum", "7 · Nerves", "<b>Ejaculation</b>: <span class=\"dag\">†</span> postganglionic fibres from the <span class=\"key\">T12–L3</span> ganglia cross in front of the aorta and IVC and converge in the hypogastric plexus below the IMA. They drive <b>emission</b> and <b>bladder neck closure</b>, so extensive dissection causes anejaculation or retrograde ejaculation; erection (parasympathetic) is spared. <span class=\"xref\">See Ch 81</span>"], [8, "l", 6, "Ch 79 · Neoplasms of the Testis", "1 · Epidemiology and risk factors", "Over 95% are <b>germ cell tumours (GCTs)</b>: seminoma or non-seminomatous GCT (NSGCT); 95% testicular, 5% extragonadal. Commonest solid malignancy in men <span class=\"key\">20–40 y</span>, peaking at 25–35."], [8, "l", 6, "Ch 79 · Neoplasms of the Testis", "1 · Epidemiology and risk factors", "Cisplatin raised metastatic cure from 5–10% to <span class=\"key\">80–90%</span>, so the aim is <b>minimum toxicity without losing curability</b>. Deaths come from platinum resistance and failure to clear residual disease."], [8, "l", 6, "Ch 79 · Neoplasms of the Testis", "1 · Epidemiology and risk factors", "Bilateral in <span class=\"key\">2%</span>, mostly metachronous; histology discordant in 30–50%. Highest in Scandinavia; rising."], [8, "l", 6, "Ch 79 · Neoplasms of the Testis", "1 · Epidemiology and risk factors", "<b>GCNIS</b> is an arrested fetal gonocyte formed <b>before birth</b>. It lies beside invasive GCT in 80–90% and invades in <span class=\"key\">50% at 5 y</span> and 70% at 7 y. Contralateral GCNIS: 5–9%, ≈36% with atrophy, UDT or age &lt;40."], [8, "p", 6, "Ch 79 · Neoplasms of the Testis", "1 · Epidemiology and risk factors", "GCT is a disease of the arrested gonocyte: UDT, family history and atrophy mark an abnormal developmental field, so orchidopexy reduces but never abolishes risk."], [8, "p", 7, "Ch 79 · Neoplasms of the Testis", "2 · Pathology and classification", "Management follows the most chemoresistant element: EC drives occult metastasis, choriocarcinoma haemorrhage, teratoma surgery."], [8, "l", 8, "Ch 79 · Neoplasms of the Testis", "4 · Diagnosis and initial management", "Half-lives: AFP <span class=\"key\">5–7 days</span>, hCG <span class=\"key\">24–36 h</span>, LDH 24 h."], [8, "l", 8, "Ch 79 · Neoplasms of the Testis", "5 · Staging", "CT abdomen–pelvis for all misses disease in <span class=\"key\">25–35% of CS I NSGCT</span>, so landing-zone nodes of 5–9 mm are suspicious. Equivocal nodes with normal markers: repeat CT in 6–8 weeks."], [8, "p", 9, "Ch 79 · Neoplasms of the Testis", "5 · Staging", "IGCCCG uses markers at the start of chemotherapy, not pre-orchidectomy values, and is invalid at relapse. Seminoma risk depends on NPVM alone; mediastinal NSGCT is always poor risk."], [8, "l", 10, "Ch 79 · Neoplasms of the Testis", "6 · Treatment principles", "Options: orchidectomy, radiotherapy <span class=\"key\">≥20 Gy</span> (&lt;20 Gy allows recurrence) or observation. Radiotherapy spares Leydig cells, yet up to 40% later need testosterone."], [8, "a", 10, "Ch 79 · Neoplasms of the Testis", "7 · NSGCT management", "<ol>\n<li>Assess CS I NSGCT for LVI and EC predominance.</li>\n<li>If low risk (neither), then surveillance.</li>\n<li>If high risk, then surveillance, BEP×1 or expert nerve-sparing RPLND, chosen by preference and toxicity.</li>\n</ol>"], [8, "p", 10, "Ch 79 · Neoplasms of the Testis", "7 · NSGCT management", "Surveillance maximises quality-adjusted survival when relapse risk is &lt;≈1/3. All options cure ≈100%; they differ in overtreatment versus difficulty of salvage."], [8, "l", 11, "Ch 79 · Neoplasms of the Testis", "7 · NSGCT management", "With normal markers and a residual mass <span class=\"key\">&gt;1 cm</span>, do <b>PC-RPLND</b> with a full bilateral template. Histology: necrosis ≈40%, teratoma ≈45%, viable tumour ≈15%."], [8, "l", 12, "Ch 79 · Neoplasms of the Testis", "8 · Seminoma management", "CS I is ≈80%. Risk factors are tumour <span class=\"key\">&gt;4 cm</span> and rete testis invasion (relapse 12/16/32% with 0/1/2), but they are not validated, so surveillance is preferred for all."], [8, "a", 12, "Ch 79 · Neoplasms of the Testis", "8 · Seminoma management", "<ol>\n<li>If the residual seminoma mass is &lt;3 cm, then observe.</li>\n<li>If &gt;3 cm, then FDG-PET ≥6 weeks after chemotherapy (earlier scans give false positives).</li>\n<li>If PET-negative, then observe.</li>\n<li>If PET-positive, then template PC-RPLND (or repeat PET/observe). Mass-only excision gives 33% local relapse.</li>\n</ol>"], [8, "p", 12, "Ch 79 · Neoplasms of the Testis", "10 · Treatment sequelae and follow-up", "Because cure is expected, late cardiovascular disease and second cancers, which rise with each added modality, decide between equally curative options."], [8, "l", 14, "Ch 80 · Surgery of Testicular Tumours", "1 · Evaluation of the testis mass", "History, then examination (supraclavicular, breasts, abdomen, scrotum). Scrotal ultrasound (US) mainly checks the <b>contralateral testis</b> (bilateral synchronous ≈ <span class=\"key\">1%</span>). Markers, alpha-fetoprotein (AFP), β-human chorionic gonadotrophin (β-hCG) and lactate dehydrogenase (LDH), give diagnosis, stage and post-orchidectomy baseline."], [8, "a", 14, "Ch 80 · Surgery of Testicular Tumours", "2 · Radical inguinal orchidectomy", "<ol>\n<li>Make a 3–5 cm incision over the canal and open the external oblique.</li>\n<li><b>Preserve the ilioinguinal nerve</b>.</li>\n<li>Mobilise the cord at the pubic tubercle and apply a <b>Penrose early clamp</b>.</li>\n<li>Deliver the testis and divide the gubernaculum.</li>\n<li>Dissect the cord to the internal ring.</li>\n</ol>"], [8, "l", 14, "Ch 80 · Surgery of Testicular Tumours", "2 · Radical inguinal orchidectomy", "<b>High ligation</b>: ligate vas and gonadal vessels <b>separately</b> with <b>non-absorbable</b> suture, leaving a <span class=\"key\">1–2 cm</span> tail. This marks the stump for excision at retroperitoneal lymph node dissection (RPLND); the vas can stay."], [8, "p", 14, "Ch 80 · Surgery of Testicular Tumours", "2 · Radical inguinal orchidectomy", "<b><span class=\"dag\">†</span> Scrotal violation</b>: inguinal exploration, high cord ligation, excise the scrotal scar. Routine hemiscrotectomy is unnecessary; chemotherapy-era outcomes are not compromised."], [8, "l", 14, "Ch 80 · Surgery of Testicular Tumours", "2 · Radical inguinal orchidectomy", "Masses <span class=\"key\">&lt;5 mm</span> with negative markers: low malignancy, so selective surveillance is an option."], [8, "l", 14, "Ch 80 · Surgery of Testicular Tumours", "2 · Radical inguinal orchidectomy", "Needs <b>all three</b>: polar, <span class=\"key\">≤2 cm</span>, contralateral testis compromised/absent. <b>Never elective with a normal contralateral testis.</b>"], [8, "l", 14, "Ch 80 · Surgery of Testicular Tumours", "2 · Radical inguinal orchidectomy", "Cold ischaemia can be omitted if resection takes <span class=\"key\">&lt;30 min</span>."], [8, "l", 14, "Ch 80 · Surgery of Testicular Tumours", "2 · Radical inguinal orchidectomy", "GCNIS options: completion orchidectomy, <span class=\"key\">18–20 Gy</span> or observation. <b>Local recurrence always needs completion orchidectomy</b>."], [8, "r", 15, "Ch 80 · Surgery of Testicular Tumours", "3 · RPLND — terminology and indications", "Post-chemotherapy (PC-RPLND) · After induction; residual <span class=\"key\">&gt;1 cm</span>, normal markers"], [8, "r", 15, "Ch 80 · Surgery of Testicular Tumours", "3 · RPLND — terminology and indications", "Late relapse · <span class=\"key\">&gt;24 months</span> after complete response"], [8, "l", 15, "Ch 80 · Surgery of Testicular Tumours", "3 · RPLND — terminology and indications", "CT within <span class=\"key\">6 weeks</span>, markers within <span class=\"key\">7–10 days</span>; note vascular variants; no bowel prep."], [8, "l", 15, "Ch 80 · Surgery of Testicular Tumours", "4 · Templates", "Bilateral template limits: renal vessels, ureters, common iliac arteries. No randomised trial of extent. A modified post-chemotherapy template needs a lesion <span class=\"key\">≤5 cm</span>."], [8, "p", 16, "Ch 80 · Surgery of Testicular Tumours", "5 · Open RPLND technique", "Identify fibres <b>prospectively, before dividing anything</b>; loop them and pass the packet beneath. Avoid traction, which causes neuropraxia and transient anejaculation."], [8, "l", 16, "Ch 80 · Surgery of Testicular Tumours", "5 · Open RPLND technique", "Optionally close the mesenteric root (volvulus). No routine drain; if one is used, remove it at <span class=\"key\">&lt;100 mL/24 h</span> on diet. No nasogastric (NG) tube; low-fat diet on days 1–2; mobilise on day 1; home on days 3–5."], [8, "l", 16, "Ch 80 · Surgery of Testicular Tumours", "6 · Auxiliary procedures (PC-RPLND 23–45%)", "<b>Nephrectomy</b> is commonest, usually <b>left</b>. The strongest predictor is a residual mass <span class=\"key\">&gt;10 cm</span>. Risk rises from fibrosis to teratoma to viable tumour, and in salvage, desperation and redo cases. It may affect future cisplatin eligibility."], [8, "l", 16, "Ch 80 · Surgery of Testicular Tumours", "6 · Auxiliary procedures (PC-RPLND 23–45%)", "<b>IVC</b>: narrowing <span class=\"key\">&lt;25%</span> is repaired by venorrhaphy, &gt;25% by patch or graft. Ligation is acceptable (collaterals); grafts thrombose. With a mass &gt;5 cm, ≈20% need IVC work. <b>The aorta is never ligated</b>; duodenal injury with an aortic graft risks aortoduodenal fistula."], [8, "l", 16, "Ch 80 · Surgery of Testicular Tumours", "6 · Auxiliary procedures (PC-RPLND 23–45%)", "<b>Liver</b>: histology is discordant in ≈half; resect, or use microwave ablation if <span class=\"key\">&lt;3 cm</span> and unresectable. <b>Thorax</b>: 25–50% discordant, so do RPLND first, then resect lesions &gt;1 cm unless the retroperitoneum shows fibrosis only (which predicts thoracic necrosis in ≈89%). <b>Pelvis</b>: mostly teratoma. <b>Retrocrural</b>: approach transdiaphragmatically along the right crus."], [8, "r", 17, "Ch 80 · Surgery of Testicular Tumours", "8 · Histology of residual mass after chemotherapy", "Fibrosis/necrosis · <span class=\"key\">≈40%</span> · Relapse-free (RFS) and cancer-specific survival (CSS) ≈95%; no adjuvant"], [8, "r", 17, "Ch 80 · Surgery of Testicular Tumours", "8 · Histology of residual mass after chemotherapy", "Teratoma · <span class=\"key\">≈45%</span> · RFS 80–90%; must be resected"], [8, "r", 17, "Ch 80 · Surgery of Testicular Tumours", "8 · Histology of residual mass after chemotherapy", "Viable GCT · <span class=\"key\">≈15%</span> · Survival 50–70%; consider 2 adjuvant cycles"], [8, "p", 17, "Ch 80 · Surgery of Testicular Tumours", "8 · Histology of residual mass after chemotherapy", "<b>Resect every NSGCT residual &gt;1 cm</b>: no imaging (including PET <span class=\"dag\">†</span>) or marker separates necrosis from teratoma, and teratoma is chemoresistant, grows, relapses late and transforms. Surgery is both staging and the only treatment; histology decides further therapy."], [8, "l", 17, "Ch 80 · Surgery of Testicular Tumours", "10 · Unique situations", "<b>Seminoma residual</b>: dense desmoplasia, no teratoma, viable ≈10%. If <span class=\"key\">&lt;3 cm</span>, observe; if <span class=\"key\">&gt;3 cm</span>, do FDG-PET (≥6 weeks <span class=\"dag\">†</span>). If avid, choose selected PC-RPLND, salvage chemotherapy or HDCT."], [8, "l", 17, "Ch 80 · Surgery of Testicular Tumours", "11 · Outcomes, fertility and complications", "<b>Ejaculation</b>: template or nerve sparing preserves antegrade ejaculation in <span class=\"key\">&gt;90%</span> (primary) at no oncological cost. <span class=\"dag\">†</span> If lost: pseudoephedrine/imipramine, post-ejaculatory urine sperm, electroejaculation, testicular sperm extraction."], [8, "r", 18, "Ch 80 · Surgery of Testicular Tumours", "11 · Outcomes, fertility and complications", "Pulmonary (bleomycin) · PC 3–5%, acute respiratory distress syndrome. Low FiO₂, restrictive fluids; tachycardia alone is no fluid trigger; accept SpO₂ <span class=\"key\">88–90%</span>"], [8, "a", 18, "Ch 80 · Surgery of Testicular Tumours", "11 · Outcomes, fertility and complications", "<ol>\n<li>Paracentesis; drain if it reaccumulates.</li>\n<li>Very-low-fat, high-protein diet with medium-chain triglycerides (MCT) and octreotide.</li>\n<li>If no response, nil by mouth with total parenteral nutrition (TPN).</li>\n<li>If refractory, lymphangiography with or without embolisation, peritoneovenous shunt or exploration.</li>\n<li>Continue a low-fat diet ≥<span class=\"key\">4 weeks</span> after resolution.</li>\n</ol>"], [8, "l", 19, "Ch 81 · Minimally Invasive Retroperitoneal Lymph Node Dissection", "", "Benchmark recurrence-free ≈<span class=\"key\">85%</span> for limited pN+ without adjuvant chemotherapy; low MI recurrence is <b>confounded</b> by high pN0 and adjuvant rates."], [8, "l", 19, "Ch 81 · Minimally Invasive Retroperitoneal Lymph Node Dissection", "1 · Indications and rationale", "<b>Primary</b> RPLND (retroperitoneal lymph node dissection) is for marker-negative clinical stage (CS) I non-seminomatous germ cell tumour (NSGCT), and small-volume stage II NSGCT and seminoma. It stages and cures occult disease, and spares chemotherapy in the <span class=\"key\">20–30%</span> with enlarged nodes who prove pN0."], [8, "l", 19, "Ch 81 · Minimally Invasive Retroperitoneal Lymph Node Dissection", "1 · Indications and rationale", "<b>Post-chemotherapy (PC-RPLND)</b> is for NSGCT residual <span class=\"key\">&gt;1 cm</span> and select seminomas."], [8, "p", 19, "Ch 81 · Minimally Invasive Retroperitoneal Lymph Node Dissection", "1 · Indications and rationale", "Much recovery gain came from Enhanced Recovery After Surgery (ERAS) pathways, which help every approach, so the benefit of access alone is smaller than it looks."], [8, "l", 19, "Ch 81 · Minimally Invasive Retroperitoneal Lymph Node Dissection", "2 · Guidelines and controversy", "Concerns: staging-only dissection (no lumbar division, low yields, excess adjuvant chemotherapy even in pIIA, so dual therapy; residual teratoma causing late relapse); wrong patients (stage IA operated; pN0 up to 83%); great-vessel surgery from a console by surgeons lacking open skills, with conversion <span class=\"key\">≈5%</span>; no series &gt; 5 years, and peritoneal carcinomatosis reported."], [8, "l", 19, "Ch 81 · Minimally Invasive Retroperitoneal Lymph Node Dissection", "3 · Patient selection", "<b>Suited to MIS</b>: chemo-naive high-risk IB; small-volume II (1–2 landing-zone nodes, none <span class=\"key\">&gt;3 cm</span>); PC solitary landing-zone mass with a small response (suggests teratoma) and little desmoplasia."], [8, "l", 20, "Ch 81 · Minimally Invasive Retroperitoneal Lymph Node Dissection", "4 · Unchanging operative principles", "Imaging within <span class=\"key\">≈4 weeks</span>, markers within <span class=\"key\">1–2 weeks</span>."], [8, "a", 20, "Ch 81 · Minimally Invasive Retroperitoneal Lymph Node Dissection", "4 · Unchanging operative principles", "<ol>\n<li>Safe entry and exposure.</li>\n<li><b>Split-and-roll</b> nodal removal.</li>\n<li>Prospective nerve sparing.</li>\n<li><b>Lumbar vessel division</b>.</li>\n<li>Spermatic cord removal, then closure.</li>\n</ol>"], [8, "l", 20, "Ch 81 · Minimally Invasive Retroperitoneal Lymph Node Dissection", "6 · Operative steps", "Lower pneumoperitoneum to check haemostasis; bag packets; <b>no routine drain</b>; discharge at <span class=\"key\">1–2 days</span>."], [8, "a", 21, "Ch 81 · Minimally Invasive Retroperitoneal Lymph Node Dissection", "7 · Complications and management", "<ol>\n<li>Major vascular injury: apply pressure and raise the pneumoperitoneum.</li>\n<li>Inform anaesthesia, get blood and call vascular help.</li>\n<li>If uncontrolled, keep pressure, undock and convert.</li>\n</ol>"], [8, "l", 21, "Ch 81 · Minimally Invasive Retroperitoneal Lymph Node Dissection", "7 · Complications and management", "Antegrade ejaculation is kept in <span class=\"key\">≥90%</span> after primary nerve-sparing."], [8, "l", 21, "Ch 81 · Minimally Invasive Retroperitoneal Lymph Node Dissection", "8 · Outcomes vs open", "Robotic node yields approach the open benchmark of <span class=\"key\">≈30</span>, but adjuvant chemotherapy is still too frequent."], [8, "l", 22, "Ch 82 · Tumours of the Penis", "1 · Overview", "Squamous cell carcinoma (SCC) is <span class=\"key\">~95%</span> of penile malignancy, and <span class=\"key\">0.4–0.6%</span> of male cancers in North America and Europe, but up to <span class=\"key\">10%</span> in parts of Asia, Africa and South America."], [8, "l", 22, "Ch 82 · Tumours of the Penis", "2 · Premalignant lesions: penile intraepithelial neoplasia (PeIN)", "Erythroplasia of Queyrat (EQ) is a red velvety glans lesion in uncircumcised men, mimicking balanitis; it progresses in <span class=\"key\">10–33%</span>."], [8, "l", 22, "Ch 82 · Tumours of the Penis", "2 · Premalignant lesions: penile intraepithelial neoplasia (PeIN)", "Bowen disease is a scaly shaft plaque mimicking psoriasis, eczema or superficial basal cell carcinoma (BCC); it progresses in <span class=\"key\">~5%</span>."], [8, "r", 22, "Ch 82 · Tumours of the Penis", "3 · Aetiology and risk factors of SCC", "<b>Phimosis</b> · Present in <span class=\"key\">25–75%</span>; <span class=\"key\">7–10×</span> risk. It mediates the non-circumcision risk: smegma causes inflammation, which leads to fibrosis"], [8, "r", 22, "Ch 82 · Tumours of the Penis", "3 · Aetiology and risk factors of SCC", "<b>HPV</b> · Low risk 6, 11; high risk <b>16, 18</b>, 31, 33, 45, 52, 58; <b>HPV 16 commonest</b>. Present in <span class=\"key\">~50%</span>; wives have ~3× cervical cancer risk"], [8, "r", 23, "Ch 82 · Tumours of the Penis", "3 · Aetiology and risk factors of SCC", "<b>Lichen sclerosus (LS)</b> · Cancer in <span class=\"key\">2.3–9%</span>; HPV-<b>independent</b> SCC"], [8, "p", 23, "Ch 82 · Tumours of the Penis", "3 · Aetiology and risk factors of SCC", "Two routes converge on the preputial sac: HPV-driven (E6/E7, p16-positive, basaloid/warty) and inflammation-driven HPV-independent (phimosis, smegma, LS). Neonatal circumcision, hygiene and vaccination each prevent part; adult circumcision prevents almost none."], [8, "l", 23, "Ch 82 · Tumours of the Penis", "4 · Natural history and spread", "Distant metastases are uncommon (<span class=\"key\">1–10%</span>) and late. Untreated, death comes within <span class=\"key\">2 years</span> (femoral erosion haemorrhage, sepsis); there is no spontaneous remission."], [8, "r", 24, "Ch 82 · Tumours of the Penis", "6 · Histology", "Usual (keratinising) <span class=\"key\">45–65%</span> · Independent · Usually grade II; lymphovascular (LVI) or perineural invasion (PNI) in ~⅓ · 25–40%"], [8, "p", 25, "Ch 82 · Tumours of the Penis", "8 · Staging: TNM 8th edition (2017)", "Traps: T1b and T2 share stage IIA; any N3 or T4 is stage IV even without metastases; cN counts palpable nodes, pN counts metastases (pN1 allows two). The primary is staged by tissue, the groin by surgery."], [8, "l", 25, "Ch 82 · Tumours of the Penis", "9 · Management of the primary tumour", "<b>Penectomy</b> is the oncological gold standard (local recurrence <span class=\"key\">0–8%</span>); over half of patients are ≤60, so preserve where safe."], [8, "l", 25, "Ch 82 · Tumours of the Penis", "9 · Management of the primary tumour", "<b>Organ preservation</b> suits PeIN, Ta, T1, grade I–II in <b>compliant</b> men. <b>Against</b>: size <span class=\"key\">≥4 cm</span>, grade III, deep cavernosal invasion, or unfit for salvage."], [8, "l", 25, "Ch 82 · Tumours of the Penis", "9 · Management of the primary tumour", "<b>Margins</b>: microscopic spread is <span class=\"key\">~5 mm</span> for grade I–II and <span class=\"key\">~10 mm</span> for grade III. Only margins <span class=\"key\">&lt;1 mm</span> raised recurrence, so a <b>negative frozen-section margin (&gt;1 mm) is enough</b>; the 2-cm dogma is abandoned."], [8, "p", 26, "Ch 82 · Tumours of the Penis", "9 · Management of the primary tumour", "Margin width depends on grade, not a fixed 2 cm. Low-grade tumours spread millimetres and their recurrences are salvageable, so preservation is safe; in high-grade or cavernosal disease local relapse is lethal and amputation regains its place."], [8, "l", 26, "Ch 82 · Tumours of the Penis", "10 · Inguinal nodes (see Ch 84)", "Cure is ~<span class=\"key\">80%</span> with ≤2 unilateral nodes, no ENE or pelvic nodes; with positive pelvic nodes, 5-year survival after surgery alone is ~<span class=\"key\">14%</span>."], [8, "l", 26, "Ch 82 · Tumours of the Penis", "10 · Inguinal nodes (see Ch 84)", "Occult nodes: PeIN/Ta/T1a <span class=\"key\">0–18%</span>; T1b+ one-third to over half; corporal invasion ~60%."], [8, "a", 26, "Ch 82 · Tumours of the Penis", "10 · Inguinal nodes (see Ch 84)", "<ol>\n<li><b>cN0, low risk</b>: surveillance. If a node appears, do fine-needle aspiration cytology (FNAC); if positive, inguinal lymph node dissection (ILND) and contralateral staging.</li>\n<li><b>cN0, high risk (T1b+)</b>: bilateral dynamic sentinel node biopsy (<b>DSNB</b>) or superficial/fascia-sparing/minimally invasive ILND. If positive, completion ILND.</li>\n<li><b>cN1–2, mobile, &lt;4 cm</b>: biopsy, then ILND and contralateral staging. If &gt;2 nodes or ENE, add pelvic lymph node dissection (PLND).</li>\n<li><b>Fixed, ≥4 cm or pelvic</b>: neoadjuvant TIP (cisplatin-eligible) or chemoradiation, then resect responders.</li>\n<li><b>Adjuvant therapy</b> if &gt;2 nodes, bilateral nodes, ENE or pelvic nodes.</li>\n</ol>"], [8, "l", 27, "Ch 82 · Tumours of the Penis", "11 · Radiotherapy", "<b>External-beam RT (EBRT)</b>: <span class=\"key\">≥66 Gy in 2-Gy fractions over ~6.5 weeks</span>, with a wax or Perspex block acting as <b>bolus</b>; ~55% are recurrence-free at 5 years. Better: &gt;60 Gy, ≤45 days, ≥2 Gy per fraction; worse: T3, &gt;4 cm, high grade."], [8, "l", 29, "Ch 84 · Inguinal Node Dissection", "1 · Why the groin matters in penile cancer", "Early versus delayed inguinal lymph node dissection (ILND) for impalpable T2–3 nodes: ENE ≈20% vs ≈95%; 3-year disease-specific survival ≈84% vs ≈35%. So manage the groins within <span class=\"key\">3 months</span> of diagnosis."], [8, "l", 29, "Ch 84 · Inguinal Node Dissection", "1 · Why the groin matters in penile cancer", "An adequate dissection removes ≥<span class=\"key\">8 nodes per side</span>. Omitting groin surgery predicts mortality."], [8, "l", 29, "Ch 84 · Inguinal Node Dissection", "2 · Indications and risk groups", "With unilateral palpable nodes, the other side has micrometastasis in ≈<span class=\"key\">30%</span>, so stage it."], [8, "p", 30, "Ch 84 · Inguinal Node Dissection", "3 · Staging work-up", "Every groin test fails toward <b>false negatives</b>; a negative result never ends the pathway."], [8, "a", 31, "Ch 84 · Inguinal Node Dissection", "6 · Open radical ILND", "<ol>\n<li>Frog-leg position; incision ≈2 cm below and parallel to the inguinal ligament.</li>\n<li>Raise flaps 3 cm above the ligament to the apex; divide the saphenous at the apex (spare if disease minimal).</li>\n<li>Open fascia lata over sartorius and adductor longus; dissect cephalad on the femoral vessels.</li>\n<li>Divide the saphenous at the junction; clear deep nodes up to the femoral canal.</li>\n<li><b>Sartorius transposition</b>; close the femoral canal (inguinal to Cooper's ligament).</li>\n<li>Suction drains; tack the flaps.</li>\n</ol>"], [8, "r", 31, "Ch 84 · Inguinal Node Dissection", "9 · Complications and post-op care", "Lymphocele / seroma · Unsealed lymphatics · Sealing devices; drain until <span class=\"key\">&lt;30 mL/day</span>; drain symptomatic or infected collections <span class=\"dag\">†</span>"], [8, "p", 33, "Ch 83 · Tumours of the Urethra", "2 · Anatomy, histology and lymphatics", "Site predicts histology (distal SCC, proximal UC), histology predicts behaviour, and the same anterior–posterior line fixes the nodal basin. In women it is also the <b>continence boundary</b>: the distal third can be excised without incontinence."], [8, "p", 35, "Ch 83 · Tumours of the Urethra", "5 · Male posterior (prostatic) urethral cancer", "The only question is \"stroma breached?\" TURP before BCG debulks, improves contact and stages. Ductal disease is not T2, so do not jump to cystectomy."], [8, "l", 36, "Ch 83 · Tumours of the Urethra", "8 · Urethral recurrence (UR) after radical cystectomy", "Risk is <span class=\"key\">1–15%</span> (~5%); most occur within 2 years, but ~11% after 5 years."], [8, "l", 38, "Ch 85 · Benign Disorders of the Penis and Urethra", "1 · Reconstructive surgical technique", "<b>Sutures</b> are always <b>absorbable</b> (permanent ones form a stone nidus); monofilament polydioxanone (PDS) is preferred. Support is needed for <span class=\"key\">30–60 days</span>; chromic lasts 14 days, so avoid it. Use <span class=\"key\">5-0</span> for most urethral work and <span class=\"key\">6-0</span> for a single-layer mucosal anastomosis (non-transecting excision and primary anastomosis, EPA), on an RB-1 taper needle."], [8, "l", 38, "Ch 85 · Benign Disorders of the Penis and Urethra", "2 · Tissue transfer: grafts and flaps", "Oral mucosa graft (OMG) has a <b>panlaminar plexus</b> and sacculates less than skin. Buccal mucosa graft (BMG) gives more early swelling and numbness, lingual gives speech difficulty, labial the worst morbidity. Buccal onlay failures occur in the <span class=\"key\">first 12 months</span>."], [8, "p", 38, "Ch 85 · Benign Disorders of the Penis and Urethra", "2 · Tissue transfer: grafts and flaps", "Graft trade-off: a dense fine plexus and low mass favour take, while carried dermis or lamina propria gives durability and resists contraction. This explains STSG vs FTSG, the failure of extragenital FTSG, the Wolfe exception, and why OMG is ideal."], [8, "p", 39, "Ch 85 · Benign Disorders of the Penis and Urethra", "3 · Surgical anatomy", "Two envelopes, two vascular worlds: dartos carries the skin supply (so skin flaps are raised on dartos); Buck's encloses the erectile bodies fed by the common penile artery."], [8, "l", 39, "Ch 85 · Benign Disorders of the Penis and Urethra", "4 · Lichen sclerosus (LS)", "Malignant transformation reaches up to <span class=\"key\">8%</span>, mostly squamous cell carcinoma (SCC)."], [8, "p", 39, "Ch 85 · Benign Disorders of the Penis and Urethra", "4 · Lichen sclerosus (LS)", "LS is a progressive skin disease sparing the proximal urethra: hence meatus as sentinel, retrograde urethrography (RUG) before meatotomy, oral mucosa not skin, high recurrence, and easy perineal urethrostomy."], [8, "a", 40, "Ch 85 · Benign Disorders of the Penis and Urethra", "6 · Prepuce and meatus", "<ol>\n<li>Penile block. Foreskin retracted: mark the cuff incision across the frenular base; incise to Buck's.</li>\n<li>Foreskin advanced: mark the coronal incision, with or without frenuloplasty.</li>\n<li>Excise the sleeve using <b>bipolar</b>, because adult vessels do not seal by pressure.</li>\n<li>Quadrant dartos sutures, then skin closure.</li>\n</ol>"], [8, "l", 40, "Ch 85 · Benign Disorders of the Penis and Urethra", "6 · Prepuce and meatus", "<b>Human immunodeficiency virus (HIV)</b>: the foreskin has many CD4+ cells and microtears. Circumcision lowers female-to-male HIV by ~<span class=\"key\">60%</span>, and also lowers herpes simplex (HSV) and human papillomavirus (HPV). In men who have sex with men (MSM), benefit is mainly for insertive partners."], [8, "a", 41, "Ch 85 · Benign Disorders of the Penis and Urethra", "7 · Penile curvature", "<ol>\n<li>Excise ventral dysgenetic tissue; mobilise spongiosum from glans to perineum.</li>\n<li>Artificial erection; ventral midline septotomy.</li>\n<li>If still curved, do dorsal tunical ellipse excision or plication under the elevated neurovascular bundle (dorsal arteries may be the dominant glans supply).</li>\n</ol>"], [8, "a", 41, "Ch 85 · Benign Disorders of the Penis and Urethra", "9 · Adult acquired buried penis (AABP)", "<ol>\n<li>Slit the phimotic ring and place glans traction.</li>\n<li>Circumcising incision; excise non-viable skin.</li>\n<li>Do escutcheonectomy (harvest the graft from it; keep 2–3 cm of skin at the base).</li>\n<li>Tack Scarpa to the rectus fascia or pubis; place drains.</li>\n<li>Cover with STSG (0.012–0.020 inch), fibrin glue and a bolster for 5–7 days.</li>\n</ol>"], [8, "p", 43, "Ch 86 · Urethral Stricture Disease", "1 · Definitions, anatomy, aetiology", "Retrograde glans flow allows the bulb to be transected and mobilised. Where it is lost (hypospadias, common penile artery injury), mobilisation causes ischaemia, which links vessel-sparing excision and PFUI repair failure."], [8, "p", 43, "Ch 86 · Urethral Stricture Disease", "1 · Definitions, anatomy, aetiology", "Aetiology predicts biology: iatrogenic and straddle strictures are focal ischaemic or crush scars suited to excision; LS is a progressive skin disease that recurs in any skin used to repair it."], [8, "l", 44, "Ch 86 · Urethral Stricture Disease", "2 · Presentation and evaluation", "<b>Urethral rest</b> with a suprapubic tube for <span class=\"key\">6–8 weeks</span> reveals the true length. At surgery, calibrate the whole urethra (bougie à boule)."], [8, "a", 44, "Ch 86 · Urethral Stricture Disease", "3 · Decision making", "<ol>\n<li>If bulbar, &lt;1.5 cm, without dense spongiofibrosis and untreated, then dilate or do one internal urethrotomy; if
