dder Pain Syndrome and Related Disorders", "2 · Epidemiology (headline)", "<b>HL prevalence</b> is <span class=\"key\">~20%</span> (3.5–56%). It rises with age (uncommon under 30, over half above 60–70), equally in men."], [1, "p", 30, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "2 · Epidemiology (headline)", "Uncontrolled series \"work\" but randomised controlled trials (RCTs) fail: regression to the mean, placebo, extra attention. Expect improvement in the first 3–4 weeks of any treatment."], [1, "p", 30, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "3 · Aetiology and pathophysiology", "Central sensitisation explains why many BPS patients have no physical findings and do not respond to local bladder therapy — the mechanism is systemic, not vesical."], [1, "l", 31, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "5 · Associated conditions", "<b>Regional</b>: <b>high-tone pelvic floor dysfunction (HTPFD)</b> in <span class=\"key\">~80%</span>; vulvodynia; endometriosis."], [1, "p", 31, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "5 · Associated conditions", "Commonest is not the same as most over-represented: IBS is commonest; autoimmune disease shows the greatest relative excess. Widespread pain predicts failure of bladder-directed therapy."], [1, "l", 32, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "7 · Diagnosis — exclusion plus localisation", "The <b>potassium sensitivity test</b> uses <span class=\"key\">0.4 M KCl</span> vs water. <b>Not recommended</b>: painful; negative in ¼ of NIDDK patients; positive in ~⅓ of normal men, ¼ of OAB and most CP/CPPS; does not predict PPS response."], [1, "l", 33, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "7 · Diagnosis — exclusion plus localisation", "Under anaesthesia, fill at <span class=\"key\">80 cm H₂O for 1–3 min</span>, drain and refill to see <b>glomerulations</b> and tears near the bladder neck."], [1, "p", 33, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "8 · Phenotype-directed management", "MAPP reanalysis (2023) of two negative NIH RCTs: hydroxyzine/PPS helped <b>localised pelvic pain</b>; amitriptyline helped <b>widespread pain</b>. A trial negative in all-comers can hide a positive result in the right phenotype."], [1, "a", 34, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "9 · Treatment — AUA 2022 principles", "<ol>\n<li>If symptoms last ≥6 weeks, take a history, examine (pelvic floor, Q-tip, DRE), and check PVR, urinalysis and culture, with cytology if indicated.</li>\n<li>Exclude confusable disease.</li>\n<li>If HL is suspected (especially &gt;50), then do cystoscopy. If HL is found, then fulgurate or inject triamcinolone; if refractory, give CyA.</li>\n<li>If there is no HL, then match the phenotype: pelvic floor, physiotherapy; lidocaine responder, intravesical therapy; widespread pain, systemic therapy and CBT.</li>\n<li>Combine behavioural, oral and intravesical treatment as needed, then BTX-A or sacral neuromodulation (SNM).</li>\n<li>Only if bladder-centred and all else fails (rare), consider diversion with or without cystectomy.</li>\n</ol>"], [1, "l", 34, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "10 · Treatment options (AUA 2022)", "In the myofascial physiotherapy RCT, 10 sessions beat global massage, <span class=\"key\">59% vs 26%</span>. Adjuncts are reverse Kegels, heat, muscle relaxants, treating constipation and trigger-point injections."], [1, "l", 34, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "10 · Treatment options (AUA 2022)", "<b>Amitriptyline</b> (anticholinergic, reuptake-blocking, H1-blocking, sedative): start <b>10 mg at night, adding 10 mg weekly to ~50 mg</b> (25–75). In the NIH RCT it gave 55% vs 45% (not significant), but <span class=\"key\">77% vs 53%</span> if ≥50 mg was tolerated, regardless of HL. <b>Contraindications</b>: long QT, conduction block, recent myocardial infarction, heart failure, ventricular arrhythmia; use caution with incomplete emptying."], [1, "l", 34, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "10 · Treatment options (AUA 2022)", "<b>PPS</b> <b>100 mg three times daily</b>: only <span class=\"key\">3–6%</span> reaches urine; acts in <b>3–6 months</b>; the only US Food and Drug Administration (FDA)-approved oral IC drug. Phase IV RCT negative (≈40% both arms); less effective in HL. Side effects (&lt;4%): alopecia, gut upset, rash, bleeding; caution with high breast-cancer risk."], [1, "l", 35, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "10 · Treatment options (AUA 2022)", "<b>AUA Recommendation</b>: fulguration and/or submucosal triamcinolone, with biopsy if never biopsied. <span class=\"key\">75–90%</span> improve; repeat treatment is needed at a mean of 7–12 months (triamcinolone) or 11–29 months (fulguration)."], [1, "a", 35, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "10 · Treatment options (AUA 2022)", "<ol>\n<li>Under general anaesthesia, map the HLs before distension causes bleeding.</li>\n<li>Distend mildly and biopsy suspicious or trigonal lesions.</li>\n<li>Fulgurate at <b>low volume</b> (Bugbee electrode), working from the <b>outer margin inwards</b>.</li>\n<li>Inject triamcinolone 40 mg/mL (or 1:1 with bupivacaine/lidocaine) in 0.5-mL aliquots, 2–3 mm submucosally.</li>\n<li>Fulgurate bleeders, empty the bladder and instil lidocaine–bupivacaine.</li>\n</ol>"], [1, "p", 36, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "10 · Treatment options (AUA 2022)", "Fulgurate from the margin inward: cautery erythema/oedema spreads peripherally, so the true edge is lost if you start centrally."], [1, "l", 36, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "10 · Treatment options (AUA 2022)", "An anaesthetic capacity <span class=\"key\">&lt;400 mL</span> marks a bladder-centred phenotype, often HL."], [1, "p", 37, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "11 · What NOT to do (AUA)", "Nothing is worse than irreversible surgery followed by continued pain — every predictor of surgical success marks bladder-generated pain."], [1, "l", 38, "Ch 29 · Sexually Transmitted Diseases", "1 · Screening, prevention and partner notification", "The nucleic acid amplification test (<b>NAAT</b>) is the standard screen. Men who have sex with men (MSM) need urethral, rectal and pharyngeal tests. <span class=\"tag\">MCQ</span> Test the pharynx for gonorrhoea, not chlamydia."], [1, "l", 38, "Ch 29 · Sexually Transmitted Diseases", "1 · Screening, prevention and partner notification", "<b>Partner notification</b> covers the previous <span class=\"key\">60 days</span> for urethritis, chlamydia and <i>Mycoplasma genitalium</i>; all partners for trichomoniasis; and the previous month for scabies or lice. Abstain for 7 days and until partners are treated."], [1, "l", 38, "Ch 29 · Sexually Transmitted Diseases", "2 · Urethritis", "<b>Diagnosis</b> needs any one: discharge; Gram stain with <span class=\"key\">≥2 white blood cells (WBC) per oil-immersion field</span> (old ≥5 missed many); positive leucocyte esterase on first-void urine; or ≥10 WBC/hpf in first-void urine."], [1, "a", 39, "Ch 29 · Sexually Transmitted Diseases", "2 · Urethritis", "<ol>\n<li>Persistent NGU: check adherence and look for an untreated partner.</li>\n<li>Send NAAT for <i>M. genitalium</i>, with or without <i>T. vaginalis</i>.</li>\n<li>If negative, then think of chronic pelvic pain syndrome.</li>\n</ol>"], [1, "p", 39, "Ch 29 · Sexually Transmitted Diseases", "2 · Urethritis", "Men with gonorrhoea usually have symptoms; women are usually silent and present with pelvic inflammatory disease (PID) or infertility. Treating the man protects his partner. Chlamydia can also cause reactive arthritis."], [1, "r", 39, "Ch 29 · Sexually Transmitted Diseases", "3 · Epididymitis by age", "Group · Organisms · Empiric regimen (<span class=\"key\">10 days</span>)"], [1, "r", 40, "Ch 29 · Sexually Transmitted Diseases", "4 · Genital ulcer disease", "Lymphogranuloma venereum, LGV (<i>C. trachomatis</i> L1–L3) · Small, painless, transient · Painful, matted, fistulae; <span class=\"dag\">†</span>groove sign · Chlamydia NAAT · Doxycycline bd <span class=\"key\">21 days</span>"], [1, "l", 41, "Ch 29 · Sexually Transmitted Diseases", "5 · Syphilis staging and serology", "A significant change is <span class=\"key\">fourfold (two dilutions)</span>. Use the same NTT each time."], [1, "a", 41, "Ch 29 · Sexually Transmitted Diseases", "5 · Syphilis staging and serology", "<p><b>Reverse algorithm</b></p><ol>\n<li>Start with a TT. If positive, then do an NTT.</li>\n<li>If the NTT is negative, then do a second, different TT.</li>\n<li>If that is positive and there is no past treatment, then treat as late latent syphilis.</li>\n</ol>"], [1, "l", 43, "Ch 29 · Sexually Transmitted Diseases", "8 · HIV for urologists", "Start PEP within <span class=\"key\">72 h</span>, and only for mucosal, broken-skin or percutaneous contact with blood or genital fluid. Needlestick risk is <span class=\"key\">0.3%</span>."], [1, "l", 43, "Ch 29 · Sexually Transmitted Diseases", "8 · HIV for urologists", "Circumcision cuts heterosexual acquisition by <span class=\"key\">50–60%</span> (inner foreskin is rich in Langerhans cells); it does not protect partners."], [1, "r", 44, "Ch 30 · Cutaneous Diseases of the External Genitalia", "1 · Approach to genital dermatoses", "Papule · Solid, raised, <span class=\"key\">≤0.5 cm</span> · Erosion · Loss of epidermis only, so <b>no scar</b>"], [1, "l", 45, "Ch 30 · Cutaneous Diseases of the External Genitalia", "3 · Eczematous dermatoses", "AD is relapsing, flexural, intensely pruritic and ill-defined. <span class=\"key\">90%</span> present before 5 years, often with asthma or rhinitis."], [1, "r", 45, "Ch 30 · Cutaneous Diseases of the External Genitalia", "3 · Eczematous dermatoses", "Share · ~<span class=\"key\">80%</span> · Minority; genital ACD is rare (2.4%)"], [1, "l", 45, "Ch 30 · Cutaneous Diseases of the External Genitalia", "3 · Eczematous dermatoses", "SD gives pink-yellow greasy-scaled plaques in sebaceous areas (including glans, pubis), mainly in uncircumcised men; <i>Malassezia</i> is implicated. It affects up to <span class=\"key\">83%</span> of patients with acquired immunodeficiency syndrome (AIDS) and is common in Parkinson disease, so <b>extensive SD should prompt an HIV test</b>."], [1, "r", 46, "Ch 30 · Cutaneous Diseases of the External Genitalia", "4 · Papulosquamous disorders", "First-line · Low-potency steroid (hydrocortisone butyrate 0.1%) continuously for <span class=\"key\">≤2 weeks</span>; triamcinolone 0.1% for thick plaque"], [1, "l", 47, "Ch 30 · Cutaneous Diseases of the External Genitalia", "5 · Lichen sclerosus (LS) / BXO", "LS is 6–10× commoner in females; males are usually &gt;60. <span class=\"key\">15–20%</span> have extragenital disease. In men the <b>perianal skin is spared</b>, and purpura may mask the whiteness."], [1, "a", 47, "Ch 30 · Cutaneous Diseases of the External Genitalia", "5 · Lichen sclerosus (LS) / BXO", "<ol>\n<li>Biopsy.</li>\n<li>Give a <b>potent steroid (clobetasol 0.05%) for 3 months</b>, then taper.</li>\n<li>Continue twice-weekly maintenance (or mometasone 0.1% or a calcineurin inhibitor).</li>\n<li>Lifelong surveillance of non-healing fissures, ulcers, nodules.</li>\n</ol>"], [1, "l", 47, "Ch 30 · Cutaneous Diseases of the External Genitalia", "5 · Lichen sclerosus (LS) / BXO", "Recurrence is <span class=\"key\">40–50%</span>, so maintain proactively. Calcineurin inhibitors are inferior; refractory disease gets retinoids or PDT. <span class=\"dag\">†</span>Meatal disease needs meatotomy or meatoplasty."], [1, "p", 47, "Ch 30 · Cutaneous Diseases of the External Genitalia", "5 · Lichen sclerosus (LS) / BXO", "Steroid strength tracks the scarring and malignant stakes of the disease. LS is the single exception to the short-course rule."], [1, "r", 47, "Ch 30 · Cutaneous Diseases of the External Genitalia", "6 · Vesiculobullous and drug eruptions", "Lesion · Symmetric <b>targets</b>; palms, soles, mouth · Prodrome, then macules, blisters and necrosis; genitals involved in ~<span class=\"key\">60%</span> · Solitary violaceous plaque with a halo, often on the glans"], [1, "r", 47, "Ch 30 · Cutaneous Diseases of the External Genitalia", "6 · Vesiculobullous and drug eruptions", "Course · Self-limited, recurs · 4–6 weeks; mortality up to ~<span class=\"key\">30%</span> (overlap with toxic epidermal necrolysis, TEN) · <b>Recurs at the same site within 24 h</b> of re-exposure"], [1, "a", 47, "Ch 30 · Cutaneous Diseases of the External Genitalia", "6 · Vesiculobullous and drug eruptions", "<p><b>SJS</b></p><ol>\n<li>Stop the offending drug.</li>\n<li>Give burn-type supportive care in an intensive care or burn unit (lowers mortality), with multispecialty wound care.</li>\n<li>Limited data support cyclosporine 3–5 mg/kg/day, etanercept, plasmapheresis or intravenous immunoglobulin (IVIG); systemic steroids are controversial.</li>\n</ol>"], [1, "p", 48, "Ch 30 · Cutaneous Diseases of the External Genitalia", "6 · Vesiculobullous and drug eruptions", "One drug class can cause a trivial FDE or a lethal SJS; extent and systemic illness separate them. Genital FDE mimics herpes; \"same spot each time\" is the clue."], [1, "a", 49, "Ch 30 · Cutaneous Diseases of the External Genitalia", "8 · Infections", "<ol>\n<li>Remove irritants and improve hygiene.</li>\n<li>Give a topical antibiotic or antifungal, then a short low-potency steroid.</li>\n<li>If this fails, then <b>biopsy</b> (neoplasia, Zoon, psoriasis, HPV, HSV).</li>\n<li>If recurrent with phimosis, then <b>circumcision</b>.</li>\n</ol>"], [1, "p", 49, "Ch 30 · Cutaneous Diseases of the External Genitalia", "8 · Infections", "Fournier gangrene is fascial, so skin shows a fraction of the necrosis; testes are spared (own blood supply). Imaging (CT is best for gas) must never delay surgery. Debride to bleeding tissue, with a second look at 24–48 h."], [1, "r", 50, "Ch 30 · Cutaneous Diseases of the External Genitalia", "8 · Infections", "Treat · Topical imidazole <span class=\"key\">≥2 weeks</span>; occasional fluconazole 150 mg; test for diabetes · Topical azole or allylamine; deep infection: terbinafine 250 mg/day for 1 week; no steroids · Antibacterial soap, clindamycin 1%, miconazole; oral erythromycin if severe · Low-potency steroid"], [1, "p", 50, "Ch 30 · Cutaneous Diseases of the External Genitalia", "8 · Infections", "Azoles cover yeast and dermatophyte, so use them when unsure. Nystatin misses tinea; allylamines are weaker on <i>Candida</i>. A negative KOH from an untreated lesion means rethink the diagnosis."], [1, "r", 51, "Ch 30 · Cutaneous Diseases of the External Genitalia", "9 · Premalignant and malignant lesions", "SCC in situ (SCCis) — accessible (scrotum) · Excision with a <span class=\"key\">5-mm margin</span> (favoured)"], [1, "p", 51, "Ch 30 · Cutaneous Diseases of the External Genitalia", "9 · Premalignant and malignant lesions", "HPV mapping: types 6 and 11 cause condyloma and verrucous carcinoma (locally destructive, rarely metastasises); type 16 causes bowenoid papulosis and SCCis."], [1, "r", 52, "Ch 30 · Cutaneous Diseases of the External Genitalia", "9 · Premalignant and malignant lesions", "Extramammary Paget · Red plaque at apocrine sites; CEA and EMA positive; underlying carcinoma in <span class=\"key\">10–30%</span> (urethra, prostate, bladder, rectum) · <b>Mandatory search for internal malignancy</b>; excision or Mohs; imiquimod, 5-FU, radiotherapy"], [1, "p", 52, "Ch 30 · Cutaneous Diseases of the External Genitalia", "10 · Benign male genital lesions", "Zoon balanitis and erythroplasia of Queyrat are both red glans plaques in uncircumcised men: one benign and cured by circumcision, the other SCCis. A persistent red glans plaque always needs biopsy."], [1, "l", 53, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "1 · Urogenital tuberculosis — organism and pathogenesis", "UG TB is <span class=\"key\">15–20%</span> of pulmonary TB in developing countries. Infection stays latent in 90–95%; lifetime reactivation is <span class=\"key\">5–15%</span>."], [1, "l", 53, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "1 · Urogenital tuberculosis — organism and pathogenesis", "Ascending spread: intravesical BCG causes UG TB in <span class=\"key\">~1%</span>."], [1, "p", 53, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "1 · Urogenital tuberculosis — organism and pathogenesis", "UG TB is blood-borne and lands in the two best-perfused UG organs, kidney and epididymis. Blood-borne seeding gives parenchymal disease; descending urinary spread gives luminal disease (distal ureteric stricture, cystitis). Healing by fibrosis turns an infection into an obstruction."], [1, "l", 53, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "2 · Clinical features and pathology by site", "It is indolent; patients are repeatedly treated for urinary tract infection (UTI) or investigated for cancer. Constitutional symptoms occur in <span class=\"key\">&lt; 20%</span>. <b>Lower urinary tract symptoms (LUTS) dominate</b>; haematuria or flank pain occurs in ~⅓ and colic in &lt;10%. <b>The hallmark is sterile pyuria</b> (&gt;90%)."], [1, "r", 53, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "2 · Clinical features and pathology by site", "Kidney · <span class=\"key\">80%</span>, haematogenous · Caseating cavities, then autonephrectomy (up to ⅓); \"putty\" kidney; end-stage renal failure ~7%; pelvic squamous metaplasia gives squamous cell carcinoma (SCC) risk"], [1, "a", 54, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "3 · Diagnosis", "<p><b>Hierarchy of proof</b></p><ol>\n<li>If culture or MTBC DNA is positive, then the diagnosis is made.</li>\n<li>If negative, then caseating granulomas on tissue in the right context confirm it.</li>\n<li>If still negative, then a compatible picture, exposure and response to empirical treatment suffice.</li>\n<li>Always look for coexisting pulmonary TB (up to one-fifth): chest radiograph in every patient.</li>\n</ol>"], [1, "l", 54, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "3 · Diagnosis", "Culture sensitivity is 10–90% (intermittent shedding). The Ziehl–Neelsen (ZN) smear detects <span class=\"key\">&lt; 50%</span>. Acidic urine inhibits mycobacteria: culture promptly."], [1, "l", 55, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "3 · Diagnosis", "Tuberculin skin test (<b>TST</b>) cut-offs: <span class=\"key\">≥ 5 mm</span> for contacts and the immunosuppressed; <span class=\"key\">≥ 10 mm</span> for immigrants, high-risk workers and drug injectors; <span class=\"key\">≥ 15 mm</span> with no risk factors. False negatives: 10–25%. Interferon-γ release assay (<b>IGRA</b>) has no BCG false positives and is the preferred screen for people from endemic countries. Both show exposure only."], [1, "p", 55, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "3 · Diagnosis", "Imaging signs are fibrosis made visible: destruction (moth-eaten calyx, cavities) heals by scarring (phantom calyx, Kerr's kink, pipe-stem ureter, golf-hole orifice, thimble bladder). So obstruction is the commonest finding and must be watched during treatment."], [1, "a", 55, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "4 · Medical treatment", "<p><b>Standard 6-month short course (2HRZE / 4HR)</b></p><ol>\n<li>Intensive, 2 months: daily INH (H), rifampicin (R), pyrazinamide (Z) and ethambutol (E); stop E once fully susceptible.</li>\n<li>Continuation, 4 months: HR daily (or thrice weekly by DOT; twice weekly no longer recommended) to eradicate persisters.</li>\n<li>Give pyridoxine throughout.</li>\n</ol>"], [1, "l", 56, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "5 · Surgical treatment", "<b>Timing: <span class=\"key\">4–6 weeks</span> after starting chemotherapy</b>, except in emergencies."], [1, "a", 56, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "5 · Surgical treatment", "<ol>\n<li>If uraemia or sepsis, then decompress urgently.</li>\n<li>Try a retrograde double-J stent first (preferred; succeeds in &lt; half, 41%).</li>\n<li>If that fails, then try an antegrade stent.</li>\n<li>If that fails, then percutaneous nephrostomy (PCN); loculated systems may need several.</li>\n<li>Then repair definitively; if the kidney is unsalvageable, then nephrectomy.</li>\n</ol>"], [1, "r", 57, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "5 · Surgical treatment", "Moderate gap · Psoas hitch · Up to <span class=\"key\">5 cm</span>; needs good capacity; avoid genitofemoral and femoral nerves"], [1, "r", 57, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "5 · Surgical treatment", "Long gap · Boari flap, with or without hitch · <span class=\"key\">10–15 cm</span>; poor in a contracted bladder"], [1, "p", 57, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "5 · Surgical treatment", "Trap: in TB the bladder may itself be contracted, ruling out psoas hitch and Boari flap. Assess capacity first; ileal ureter, with or without augmentation, is then the option."], [1, "l", 57, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "5 · Surgical treatment", "Contracted bladder: operate for intolerable symptoms or capacity <span class=\"key\">&lt; 100 mL</span>, once chemotherapy controls disease; a thimble bladder needs orthotopic substitution. Incise a bladder neck contracture."], [1, "l", 57, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "6 · BCG-related infection, relapse, special situations", "<b>Relapse</b> occurs in <span class=\"key\">6.3–22%</span> (pulmonary 2–6%), at a mean of ~5 years. Follow up for <b>10 years</b> and culture any recurrence."], [1, "a", 57, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "7 · Schistosomiasis (bilharzia)", "<p><b>Life cycle</b></p><ol>\n<li>Fork-tailed cercariae penetrate intact skin in fresh water, become schistosomulae and pass via the lungs to the liver, where they pair (female in the male's gynaecophoric canal).</li>\n<li>Paired adults move to the vesical plexus (80–110 days) and live 3–5 years.</li>\n<li>Eggs (~140 µm, <b>terminal spine</b>) cross the bladder wall into urine and hatch as miracidia.</li>\n<li>Miracidia infect <i>Bulinus</i>, which releases cercariae.</li>\n</ol>"], [1, "p", 59, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "7 · Schistosomiasis (bilharzia)", "Trap: a negative urine egg count does not exclude severe disease; the most damaged kidneys belong to egg-negative, often asymptomatic, inactive-stage patients."], [1, "l", 59, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "7 · Schistosomiasis (bilharzia)", "<b>Praziquantel (PZQ)</b> is the only WHO-listed drug: <span class=\"key\">40 mg/kg once</span>, or 20 mg/kg twice 6–8 h apart. Cure or egg reduction is 60–90%; pregnancy FDA category B. Add steroids for Katayama fever. PZQ is weak on schistosomulae, so repeat after several weeks. Artemisinins act on schistosomulae but are avoided where malaria is co-endemic."], [1, "a", 62, "★ Putting it together: infection decisions", "B · Beyond antibiotics", "<ol>\n<li><b>Image</b> (ultrasound or CT): no response by 72 h, sepsis, obstruction/stone, gas, febrile men, recurrent pyelonephritis.</li>\n<li><b>Drain</b> any obstructed infected kidney (stent or nephrostomy); treat the stone later.</li>\n<li>Renal abscess: if ≤3 cm, then antibiotics alone; 3–5 cm, variable; if &gt;5 cm, then percutaneous drainage.</li>\n<li><b>Emphysematous pyelonephritis</b> (CT class): gas within kidney: antibiotics and drainage; if beyond it (poor prognosis), then nephrectomy (<span class=\"xref\">see Ch 26</span>).</li>\n<li><b>Fournier:</b> antibiotics and <b>urgent repeated radical debridement</b>; scores never delay surgery.</li>\n</ol>"], [1, "a", 62, "★ Putting it together: infection decisions", "C · Recurrent UTI in women", "<ol>\n<li>Confirm each episode by culture.</li>\n<li>Behaviour, hydration; vaginal oestrogen if postmenopausal.</li>\n<li>Methenamine, cranberry, D-mannose, immunostimulants.</li>\n<li>Self-start or post-coital antibiotic; finally continuous low-dose prophylaxis.</li>\n</ol>"], [1, "a", 63, "★ Putting it together: infection decisions", "E · GU tuberculosis in four lines", "<ol>\n<li><b>Suspect:</b> sterile pyuria, contracted bladder, beaded vas, epididymal mass.</li>\n<li><b>Confirm:</b> three early-morning urines: AFB, culture, GeneXpert.</li>\n<li><b>Treat:</b> 2 months HRZE, then 4 months HR; watch for ureteric stricture.</li>\n<li><b>Operate</b> after ≥4–6 weeks of drugs: nephrectomy (non-functioning), reimplantation (stricture), augmentation (contracted bladder) (<span class=\"xref\">see Ch 31</span>).</li>\n</ol>"], [2, "l", 2, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "3 · Primary vs secondary VUR", "In spina bifida, VUR occurs in up to <span class=\"key\">30%</span>: start early clean intermittent catheterisation (CIC) and an anticholinergic or β3-agonist. Seek occult dysraphism: sacral dimple, hairy patch, gluteal cleft anomaly, refractory constipation."], [2, "p", 2, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "3 · Primary vs secondary VUR", "Primary and secondary are not exclusive: \"primary\" VUR often has a treatable secondary component (overactivity, bladder and bowel dysfunction). Remove it and only true primary VUR remains."], [2, "l", 2, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "4 · Epidemiology", "VUR is found in <span class=\"key\">~30%</span> of children with UTI and ~17% of those imaged for hydronephrosis. It is present in <span class=\"key\">38.6%</span> under 2 years versus 7.6% at 12–21 years."], [2, "l", 3, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "6 · Diagnosis", "<b>Top-down</b>: dimercaptosuccinic acid (DMSA) scan first, VCUG only if abnormal. A normal DMSA leaves a <span class=\"key\">&lt;1%</span> chance of high-grade VUR, but misses ~1/3 of (mostly low-grade) VUR."], [2, "l", 4, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "7 · Congenital dysplasia vs acquired scar", "Hypertension develops in <span class=\"key\">34–38%</span> of scarred children. <b>Correcting VUR does not lower blood pressure (BP)</b>; removing a small kidney or segment may."], [2, "l", 4, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "8 · Bladder and bowel dysfunction (BBD)", "<b>Phimosis</b>: in boys with VUR, circumcision cuts the number needed to treat (NNT) to prevent one UTI from ~111 to <span class=\"key\">~4</span>. Topical steroid is equivalent."], [2, "l", 5, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "10 · Medical management — continuous antibiotic prophylaxis (CAP)", "Two-year BUTI on CAP is <span class=\"key\">8.6% low, 26% intermediate, 62.5% high</span> risk. ~2/3 of children are low risk."], [2, "a", 5, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "11 · Practical algorithm (AUA-based, risk-stratified)", "<ol>\n<li>Confirm true febrile UTIs; do RBUS. If multiple febrile UTIs, admissions or upper-tract findings, then VCUG. If afebrile or doubtful UTI with normal US, then conservative care.</li>\n<li>In all, treat BBD (constipation first), with hygiene and timed voiding.</li>\n<li>If low risk (grade I–II, no BBD, male, older), then observe with or without CAP, and treat any febrile UTI promptly.</li>\n<li>If high risk (grade ≥III, girl, BBD, febrile presentation, scars, infant), then give CAP.</li>\n<li>If breakthrough febrile UTI, new scars, high grade with poor function, or persistent VUR with low infection tolerance, then correct (endoscopic or reimplant).</li>\n</ol>"], [2, "l", 5, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "12 · Surgical correction", "Open correction succeeds in <span class=\"key\">&gt;95%</span>; robotic correction is probably less morbid. Neither beats medical therapy for scarring or growth (IRSC, Birmingham)."], [2, "l", 6, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "14 · Sibling screening", "Sibling prevalence is ~<span class=\"key\">30%</span> (up to 50%), higher when younger."], [2, "l", 6, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "15 · Follow-up and adulthood", "<b>Pregnancy</b>: VUR leads to pyelonephritis in ~1/3. Scars bring ~3× hypertension and <span class=\"key\">~8× pre-eclampsia</span>. <b>Scarring, not VUR, drives morbidity.</b> Reimplanted women keep a UTI risk but no excess miscarriage."], [2, "r", 7, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "16 · Landmark trials", "Swedish Reflux Trial · 1–2 y, grade III–IV; CAP vs endoscopic vs surveillance · Girls febrile UTI: 19% CAP, 23% endoscopic, <span class=\"key\">57%</span> surveillance; no new scars on CAP; boys no difference · Treat girls with dilating VUR"], [2, "r", 7, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "16 · Landmark trials", "RIVUR · 607 children, grade I–IV after first/second UTI; TMP-SMX vs placebo · Recurrent UTI <span class=\"key\">12.9% vs 23.6%</span>; scarring unchanged; most benefit with febrile index UTI/BBD · CAP prevents UTI, not scars"], [2, "p", 7, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "16 · Landmark trials", "Trials disagree because of population risk: RIVUR was diluted by low-risk children (~8% grade IV); reanalysis gives NNT 5 high-risk vs 18 low-risk. CAP cuts infection in proportion to baseline risk; neither CAP nor surgery prevents scarring better."], [2, "p", 8, "Ch 49 · Anomalies of the Kidney and Collecting System", "1 · Embryology that explains everything", "Every anomaly of number is a failure of UB–MM induction: timing and extent set the phenotype. An early insult drags the WD/MD with it (genital anomalies). Arrested ascent leaves an unrotated kidney with anterior pelvis and fetal blood supply; fusion freezes kidneys where they meet."], [2, "l", 8, "Ch 49 · Anomalies of the Kidney and Collecting System", "2 · Bilateral renal agenesis (BRA)", "It occurs in <span class=\"key\">≈1 in 5000</span> births, <b>75% male</b>. First-degree relatives carry ≈1000× risk, so <b>scan parents and siblings by ultrasound (US)</b> of any infant with unilateral agenesis (URA), BRA or dysgenesis."], [2, "p", 8, "Ch 49 · Anomalies of the Kidney and Collecting System", "2 · Bilateral renal agenesis (BRA)", "BRA is lethal through the lungs, not the kidneys. Amnioinfusion replaces only the amniotic step, so it converts pulmonary deaths into neonatal end-stage renal disease (ESRD)."], [2, "l", 9, "Ch 49 · Anomalies of the Kidney and Collecting System", "3 · Unilateral renal agenesis (URA) and the solitary functioning kidney (SFK)", "URA occurs in <span class=\"key\">1 in 1200</span>, male 1.8:1, slightly more on the left. Many apparent URAs are an <b>involuted multicystic dysplastic kidney (MCDK)</b> (curvilinear calcification on computed tomography, CT; colonic flexure in normal place). Renal aplasia may be the commonest cause of congenital solitary kidney. At 20 weeks, adrenal or spleen may be mistaken for kidney."], [2, "l", 9, "Ch 49 · Anomalies of the Kidney and Collecting System", "3 · Unilateral renal agenesis (URA) and the solitary functioning kidney (SFK)", "<b>Contralateral kidney</b>: vesicoureteral reflux (VUR) <span class=\"key\">≈30%</span>, pelviureteric junction (PUJ) obstruction ≈11%, vesicoureteric junction (VUJ) obstruction ≈7%."], [2, "l", 10, "Ch 49 · Anomalies of the Kidney and Collecting System", "5 · Ectopia (anomalies of ascent)", "It occurs in <span class=\"key\">1 in 900</span> at autopsy and is bilateral in ≈10%. <b>Pelvic is commonest</b>, then lumbar, abdominal, cephalad and thoracic. Aberrant vessels are a consequence of ectopia, not its cause."], [2, "l", 11, "Ch 49 · Anomalies of the Kidney and Collecting System", "6 · Fusion anomalies", "It is the <b>commonest fusion anomaly</b>: <span class=\"key\">1 in 400</span> (0.25%), male 2:1. <b>Lower-pole fusion occurs in 95%</b>, before rotation."], [2, "p", 12, "Ch 49 · Anomalies of the Kidney and Collecting System", "6 · Fusion anomalies", "<span class=\"dag\">†</span> PUJ obstruction in horseshoe kidney: dismembered pyeloplasty with dependent anterior anastomosis; symphysiotomy not routinely needed."], [2, "l", 12, "Ch 49 · Anomalies of the Kidney and Collecting System", "7 · Malrotation and vascular anomalies", "Treat an aneurysm for rupture, growth, pregnancy, size <span class=\"key\">&gt;2 cm</span> or symptoms. An acquired AVF may close within months, so observe it."], [2, "p", 13, "Ch 49 · Anomalies of the Kidney and Collecting System", "8 · Collecting system anomalies", "Collecting-system anomalies split on one question — is there obstruction? Dilatation without obstruction (bifid, extrarenal pelvis, megacalycosis) needs nothing; stasis (diverticulum, hydrocalycosis) is treated for symptoms; infundibulopelvic stenosis threatens function through bilateral dysplasia."], [2, "p", 15, "Ch 50 · Renal Dysgenesis and Cystic Disease of the Kidney", "2 · Dysgenesis: dysplasia vs hypoplasia", "The ureteric orifice predicts the kidney: a bud from the wrong place on the wolffian duct meets the wrong blastema, so ectopia, obstruction and dysplasia travel together."], [2, "p", 16, "Ch 50 · Renal Dysgenesis and Cystic Disease of the Kidney", "5 · ADPKD — paediatric focus", "ADPKD is a volume disease: cyst growth stretches vessels (hypertension), compresses nephrons and hides stones and tumours. Every therapy is judged by whether it slows total kidney volume."], [2, "a", 18, "Ch 50 · Renal Dysgenesis and Cystic Disease of the Kidney", "8 · Multicystic dysplastic kidney (MCDK)", "<ol>\n<li>For a prenatally detected MCDK, do US on day 2–3 and at 1 month to assess the contralateral kidney and bladder.</li>\n<li>If the diagnosis is in doubt, do a dimercaptosuccinic acid (DMSA) or mercaptoacetyltriglycine (MAG3) scan.</li>\n<li>If there is a urinary tract infection (UTI) or an abnormal contralateral kidney or bladder, then do a voiding cystourethrogram (VCUG); otherwise do not.</li>\n<li>Hand over to primary care to check BP, mass and UTI.</li>\n</ol>"], [2, "p", 18, "Ch 50 · Renal Dysgenesis and Cystic Disease of the Kidney", "8 · Multicystic dysplastic kidney (MCDK)", "MCDK removes itself; management looks to the solitary contralateral kidney and its reflux or obstruction. Mistaking a non-functioning PUJ kidney for MCDK costs little."], [2, "l", 20, "Ch 51 · Pathophysiology of Urinary Tract Obstruction", "1 · Definition and classification", "It affects ≈ <span class=\"key\">1 in 500</span> live births; high-grade obstruction carries a lifetime end-stage renal disease (ESRD) risk of up to <span class=\"key\">30%</span>."], [2, "p", 20, "Ch 51 · Pathophysiology of Urinary Tract Obstruction", "1 · Definition and classification", "Trap: <b>detrusor hypertrophy</b> is a lower-tract cause of upper-tract (UVJ) obstruction, because the thick wall narrows the intramural ureter. Neurogenic bladder obstructs without an anatomical lesion."], [2, "l", 21, "Ch 51 · Pathophysiology of Urinary Tract Obstruction", "2 · Haemodynamic changes", "<b>Hypertension</b> is renin–angiotensin driven: bilateral ≈ <span class=\"key\">77%</span>, unilateral ≈ <span class=\"key\">20%</span> (renin lateralises)."], [2, "l", 21, "Ch 51 · Pathophysiology of Urinary Tract Obstruction", "4 · Pathology and fibrosis", "<b>Bladder</b>: hypertrophy, then compensation, then decompensation; IL-6, TNF-α and monocyte chemoattractant protein-1 reduce compliance. Storage pressure &gt; <span class=\"key\">40 cm H₂O</span> injures the kidneys."], [2, "a", 21, "Ch 51 · Pathophysiology of Urinary Tract Obstruction", "6 · Post-obstructive diuresis (POD)", "<ol>\n<li>Monitor intake, output, and serum and urine electrolytes.</li>\n<li>Replace losses and correct electrolytes.</li>\n<li><b>Do not over-replace</b>: it perpetuates POD.</li>\n<li>Expect resolution within <span class=\"key\">24 h</span>; it seldom lasts &gt; 48 h.</li>\n</ol>"], [2, "l", 22, "Ch 51 · Pathophysiology of Urinary Tract Obstruction", "7 · Fetus and child", "Second-trimester oligo- or anhydramnios carries <span class=\"key\">60–80%</span> mortality."], [2, "l", 22, "Ch 51 · Pathophysiology of Urinary Tract Obstruction", "7 · Fetus and child", "Whitaker test: obstructed if pelvic pressure &gt; <span class=\"key\">12 cm H₂O</span> or rises continuously. Cystatin C GFR is most accurate in children."], [2, "p", 24, "Ch 52 · Ectopic Ureter, Ureterocele and Ureteral Anomalies", "3 · Ectopic ureter — sites and sex asymmetry", "Why does only the girl leak? The female ureter may open distal to the external sphincter and leaks continuously; the male ureter, confined to wolffian derivatives above it, presents as infection or obstruction."], [2, "a", 27, "Ch 52 · Ectopic Ureter, Ureterocele and Ureteral Anomalies", "6 · Management principles", "<ol>\n<li>After prenatal hydronephrosis, do postnatal ultrasound.</li>\n<li>If there is significant hydroureteronephrosis, start prophylaxis.</li>\n<li>Do VCUG (optional if it will not change the decision to decompress), then a renal scan after 2 months.</li>\n<li>If the ureterocele is small, with minimal hydronephrosis and no obstruction, then observe.</li>\n<li>If obstruction is significant and parenchyma is at risk, then do TUI (or a cutaneous distal ureterostomy if endoscopy is impossible, until old enough for reimplant).</li>\n<li>If sepsis does not respond, then do TUI (ureterocele) or nephrostomy or end ureterostomy (ectopic ureter); elective drainage is still needed later.</li>\n</ol>"], [2, "l", 27, "Ch 52 · Ectopic Ureter, Ureterocele and Ureteral Anomalies", "7 · Operative options", "TUI relieves obstruction in <span class=\"key\">78–97%</span>. It is the choice in <b>sepsis</b> and in the <b>infant</b>."], [2, "l", 27, "Ch 52 · Ectopic Ureter, Ureterocele and Ureteral Anomalies", "7 · Operative options", "A well child needs no catheter and goes home the same day. Do ultrasound and VCUG at <span class=\"key\">4–6 weeks</span>."], [2, "l", 27, "Ch 52 · Ectopic Ureter, Ureterocele and Ureteral Anomalies", "7 · Operative options", "New reflux occurs in <span class=\"key\">0–50%</span>. <b>Intravesical</b> ureteroceles decompress without reflux in 70–80%; <b>extravesical</b> ones need secondary surgery in up to 70%. Reoperation risk ratio is 1.74 with lower pole reflux and 2.78 if extravesical (not additive). Single systems do better than duplex."], [2, "p", 28, "Ch 52 · Ectopic Ureter, Ureterocele and Ureteral Anomalies", "7 · Operative options", "Why TUI first even if half need more surgery? Outpatient, may be definitive, defers the second operation to an older child, and decompression often avoids tapering at reimplant. Less appealing in an older child with a massive non-functioning upper pole — definitive surgery at diagnosis."], [2, "l", 28, "Ch 52 · Ectopic Ureter, Ureterocele and Ureteral Anomalies", "7 · Operative options", "Outcomes: for ectopic ureter it is usually curative. For ureterocele, lower pole reflux resolves in up to 20%, new reflux appears in <span class=\"key\">15–50%</span>, and secondary surgery is needed in <span class=\"key\">40–50%</span>."], [2, "l", 29, "Ch 52 · Ectopic Ureter, Ureterocele and Ureteral Anomalies", "7 · Operative options", "Reflux persists in <span class=\"key\">5–10%</span>, more often after tapering."], [2, "a", 29, "Ch 52 · Ectopic Ureter, Ureterocele and Ureteral Anomalies", "8 · Decision summary", "<ol>\n<li>If the upper pole is worth keeping and the lower pole refluxes, then do a common sheath reimplant, or a lower pole reimplant with distal ureteroureterostomy.</li>\n<li>If the upper pole is worth keeping and there is no lower pole reflux, then do a proximal or distal ureteroureterostomy.</li>\n<li>If function is unclear, or there is massive dilation or sepsis, then do a temporary end ureterostomy, then DMSA, then reconstruct or remove.</li>\n<li>If removal is chosen (marked dilation, preference), then do upper pole nephrectomy with ureterectomy.</li>\n</ol>"], [2, "p", 30, "Ch 52 · Ectopic Ureter, Ureterocele and Ureteral Anomalies", "8 · Decision summary", "VUR is the pivot: without VUR choose an upper tract solution; with VUR, a bladder-level solution, except in the infant, where TUI defers bladder surgery. Upper pole function then picks nephrectomy vs ureteroureterostomy. TUI failure costs little and may simplify the next operation."], [2, "l", 30, "Ch 52 · Ectopic Ureter, Ureterocele and Ureteral Anomalies", "10 · Other ureteral anomalies", "It occurs in ~<span class=\"key\">1 in 125</span> (0.8%) at autopsy, F:M 1.6:1, and is unilateral 6× more often than bilateral. <b>Look for contralateral duplication</b>: an occult second ectopic ureter explains persistent wetting."], [2, "l", 30, "Ch 52 · Ectopic Ureter, Ureterocele and Ureteral Anomalies", "10 · Other ureteral anomalies", "Smith types: 1, three separate ureters (<span class=\"key\">35%</span>, commonest); 2, incomplete with two orifices (21%); 3, trifid with one orifice (31%); 4, two ureters with three orifices (13%). Weigert–Meyer usually holds, but is violated in quadruplication."], [2, "l", 31, "Ch 52 · Ectopic Ureter, Ureterocele and Ureteral Anomalies", "10 · Other ureteral anomalies", "A <b>fibroepithelial polyp</b> is commonest at the <b>UPJ</b>, <span class=\"key\">89% male, 78% left</span>; only 22% are seen before surgery (as a filling defect). At the UPJ, do pyeloplasty; elsewhere, <b>remove it ureteroscopically</b>."], [2, "l", 32, "Ch 53 · Surgery of the Ureter in Children", "1 · Pelviureteric junction (PUJ) obstruction — definition and aetiology", "Paediatric hydronephrosis is a pelvic anteroposterior diameter (APD) of <span class=\"key\">12 mm</span>, but hydronephrosis is not obstruction. Koff's definition is retrospective, so every surgical indication tries to predict harm before function is lost."], [2, "l", 32, "Ch 53 · Surgery of the Ureter in Children", "1 · Pelviureteric junction (PUJ) obstruction — definition and aetiology", "<b>Lower-moiety PUJ obstruction in a duplex</b>: with incomplete duplication, do ureteropyelostomy to the lower-pole pelvis; with complete duplication, a standard pyeloplasty. If the moiety has ≤ <span class=\"key\">5–10%</span> function, do partial nephrectomy."], [2, "l", 32, "Ch 53 · Surgery of the Ureter in Children", "2 · Diagnosis and indications", "Neonatal renogram washout is confounded by immaturity, hydration, diuretic timing, posture and pelvic compliance, with false positives up to <span class=\"key\">44%</span>. So decide on the trend in differential renal function (DRF) and on dilatation, not on half-time (T½) alone."], [2, "a", 33, "Ch 53 · Surgery of the Ureter in Children", "3 · Anderson–Hynes dismembered pyeloplasty", "<ol>\n<li>Expose the PUJ and free the lower pole, looking for an accessory vessel.</li>\n<li>Use bipolar diathermy sparingly and place stay sutures.</li>\n<li>Decompress the pelvis with a 21-G needle, then dismember, with or without pelvic reduction.</li>\n<li><b>Spatulate laterally</b> into healthy ureter, keeping the stenotic segment as a \"no-touch\" handle.</li>\n<li>Bring the apex of the spatulation to the inferior pelvis and make a tension-free, watertight 6-0/5-0 absorbable anastomosis.</li>\n<li>Excise the stenotic segment last, irrigate out clot and cover with perinephric fat.</li>\n</ol>"], [2, "p", 33, "Ch 53 · Surgery of the Ureter in Children", "3 · Anderson–Hynes dismembered pyeloplasty", "Every variant answers two questions: is there a crossing vessel (dismember), and is the gap too long for tension-free anastomosis (flap, mobilisation)?"], [2, "p", 33, "Ch 53 · Surgery of the Ureter in Children", "3 · Anderson–Hynes dismembered pyeloplasty", "One fixed principle, many routes: dismember, excise, spatulate, anastomose without tension. Access, stent and robot are choices of convenience; failure is managed by repeating the principle."], [2, "p", 35, "Ch 53 · Surgery of the Ureter in Children", "6 · Primary megaureter", "Why not rely on the renogram? Neonatal washout depends on immature function, hydration and a huge ureter's capacity, so serial DRF, diameter and infection history drive surgery. Megaureter is the PUJ problem moved to the bottom of the ureter: an immature adynamic segment that usually matures."], [2, "a", 35, "Ch 53 · Surgery of the Ureter in Children", "6 · Primary megaureter", "<ol>\n<li>Excise the stenotic distal segment and straighten the ureter.</li>\n<li>Taper if needed.</li>\n<li>Reimplant non-refluxing at a <span class=\"key\">5:1</span> tunnel length:diameter.</li>\n<li>Stent with a feeding tube for 7 days or a double-J for 4 weeks.</li>\n</ol>"], [2, "p", 35, "Ch 53 · Surgery of the Ureter in Children", "7 · Surgery for vesicoureteral reflux", "<b>Principles</b>: exclude/treat bladder causes first · handle ureter (blood supply) and bladder (haematuria, spasm) gently · tension-free mobilisation · tunnel length:diameter <span class=\"key\">5:1</span> (Paquin) · straight course at empty and full bladder."], [2, "r", 35, "Ch 53 · Surgery of the Ureter in Children", "7 · Surgery for vesicoureteral reflux", "<b>Cohen</b> · Intravesical; cross-trigonal · Commonest; success &gt; <span class=\"key\">98%</span>; thick bladder; with bladder-neck reconstruction · Difficult later retrograde catheterisation"], [2, "r", 36, "Ch 53 · Surgery of the Ureter in Children", "7 · Surgery for vesicoureteral reflux", "<b>Lich–Gregoir</b> · Extravesical detrusorotomy ≈ 5 cm · No haematuria/spasm; short catheter · Transient voiding dysfunction/retention up to <span class=\"key\">10%</span>, esp. bilateral"], [2, "a", 36, "Ch 53 · Surgery of the Ureter in Children", "7 · Surgery for vesicoureteral reflux", "<ol>\n<li>Open the bladder vertically and put a feeding tube in the orifice as a handle.</li>\n<li>Circumscribe the orifice and free the ureter, preserving its distal blood supply, until it reaches the contralateral wall without tension.</li>\n<li>Make a submucosal tunnel across the trigone, with the new orifice above the contralateral one.</li>\n<li>Suture mucosa to mucosa with 6-0, with a detrusor hitch at 6 o'clock.</li>\n</ol>"], [2, "a", 36, "Ch 53 · Surgery of the Ureter in Children", "7 · Surgery for vesicoureteral reflux", "<ol>\n<li>With the bladder one-third full, divide the obliterated umbilical artery.</li>\n<li>Free the ureter <b>hugging it</b>, only as far as the UVJ.</li>\n<li>Distend the bladder and mark a 5-cm tunnel; incise the detrusor down to mucosa and raise wide flaps.</li>\n<li>Lay the ureter in and close the detrusor caudocranially, catching adventitia at the apex.</li>\n<li>Leave a Foley catheter for 12–48 h.</li>\n</ol>"], [2, "p", 36, "Ch 53 · Surgery of the Ureter in Children", "7 · Surgery for vesicoureteral reflux", "Why voiding dysfunction? The pelvic plexus lies ≈ 1.5–2 cm dorsomedial to the UVJ. Stay on the ureter, avoid the dorsomedial UVJ, stop at the UVJ. The Zaontz modification (detrusorotomy around the UVJ) is now avoided."], [2, "l", 36, "Ch 53 · Surgery of the Ureter in Children", "7 · Surgery for vesicoureteral reflux", "In the American Urological Association (AUA) meta-analysis, open success is <span class=\"key\">95.9%</span>; minimally invasive results are converging."], [2, "p", 37, "Ch 53 · Surgery of the Ureter in Children", "7 · Surgery for vesicoureteral reflux", "Early complications are tissue reactions — drain and wait. Late ones are design errors (blood supply, hiatus position, tunnel ratio) or an untreated bladder; reimplanting into an abnormal bladder worsens dilatation."], [2, "l", 38, "Ch 56 · Hypospadias", "1 · Definition, diagnosis and embryology", "The <b>triad</b> is a proximal (ventral) ectopic meatus, ventral curvature and a dorsally hooded foreskin (curvature and hood not always present). Incidence is ≈ <span class=\"key\">1 in 150–300</span> male births; diagnosis is clinical."], [2, "l", 38, "Ch 56 · Hypospadias", "1 · Definition, diagnosis and embryology", "Ventral prepuce fusion awaits urethral fold fusion (≈ 20 weeks), so an ectopic meatus has an incomplete foreskin in <span class=\"key\">95%</span>."], [2, "l", 38, "Ch 56 · Hypospadias", "1 · Definition, diagnosis and embryology", "The critical window is <span class=\"key\">weeks 8–16</span>, and closure runs from the anus to the glans tip. The two-zipper theory is Kurzrock's (current). <span class=\"tag\">MCQ</span>"], [2, "p", 38, "Ch 56 · Hypospadias", "1 · Definition, diagnosis and embryology", "Hypospadias is an arrest of the androgen-dependent closing zipper: the meatus stops where closure stopped, the prepuce cannot close ventrally over an open urethra, and unfused dysplastic ventral tissue tethers the shaft into curvature."], [2, "l", 38, "Ch 56 · Hypospadias", "3 · Classification and severity", "Distal forms (glanular, coronal, distal shaft) are <span class=\"key\">70–85%</span>; proximal forms 10–25%."], [2, "l", 39, "Ch 56 · Hypospadias", "4 · Associated anomalies and DSD work-up", "<b>Disorder of sex development (DSD) work-up</b> is needed for UDT with proximal hypospadias, a perineal meatus or atypical genitalia. Since 2006 severe hypospadias is classed as 46,XY DSD. DSD risk is ≈ <span class=\"key\">50%</span> with a non-palpable vs 15% with a palpable testis, and 64% proximal vs 7% distal."], [2, "p", 39, "Ch 56 · Hypospadias", "4 · Associated anomalies and DSD work-up", "Hypospadias with cryptorchidism signals a systemic androgen problem, not a local one — hence karyotype before surgery."], [2, "l", 39, "Ch 56 · Hypospadias", "5 · Pre-operative assessment", "<b>Timing</b>: genital awareness starts ≈ 18 months. The American Academy of Pediatrics (AAP, 1996) advises 6–12 months; the authors <span class=\"key\">6–18 months</span>. A systematic review (&gt;16,000) found fewer complications when younger. One short anaesthetic is low-risk."], [2, "l", 39, "Ch 56 · Hypospadias", "5 · Pre-operative assessment", "<b>Androgen</b>: glans width <span class=\"key\">&lt;14 mm</span> means more complications. Give testosterone cypionate <b>2 mg/kg intramuscularly at 5 and 2 weeks</b> before surgery if the glans is &lt;15 mm (≈ 4 mm gain); dihydrotestosterone (DHT) or human chorionic gonadotropin are alternatives. Two randomised trials showed fewer complications; meta-analyses are inconclusive. Side effects (aggression, erections, pigmentation) resolve within 6 months."], [2, "a", 40, "Ch 56 · Hypospadias", "7 · Curvature", "<ol>\n<li>Deglove to the penoscrotal junction and excise dysplastic dartos.</li>\n<li>Make an <b>artificial erection</b> (Gittes–McLaughlin, corporal compression or prostaglandin).</li>\n<li>If straight, then proceed to urethroplasty.</li>\n<li>If residual curvature is &lt;30°, then do dorsal plication.</li>\n<li>If &gt;30°, then divide the urethral plate.</li>\n<li>If still &gt;30°, then do ventral corporal lengthening (usually staged).</li>\n</ol>"], [2, "p", 41, "Ch 56 · Hypospadias", "8 · Urethroplasty", "Why proximal repairs fail — Poiseuille: resistance is proportional to length / radius⁴. A long, rigid, spongiosum-free tube ending in a non-distensible glans raises proximal pressure, causing fistula, diverticulum and stricture. 25–75% need extra procedures after planned two-stage repair."], [2, "l", 41, "Ch 56 · Hypospadias", "9 · Post-operative care", "Leave a compressive dressing ≈ <span class=\"key\">72 h</span>. Divert urine <span class=\"key\">3–21 days</span> by complexity (dripping stent; suprapubic for older or redo); short distal repairs need no stent."], [2, "r", 41, "Ch 56 · Hypospadias", "10 · Complications", "Meatal stenosis · Obstructive symptoms and <span class=\"key\">&lt;8 Fr</span> prepubertal / &lt;12 Fr postpubertal"], [2, "r", 41, "Ch 56 · Hypospadias", "10 · Complications", "Recurrent curvature · <span class=\"key\">&gt;30°</span> on erection"], [2, "l", 42, "Ch 56 · Hypospadias", "10 · Complications", "<b>Balanitis xerotica obliterans (BXO) / lichen sclerosus</b>: steroids usually fail, so excise all of it and do a staged buccal or preputial graft. Recurrence is up to <span class=\"key\">40%</span>, and it can invade buccal grafts."], [2, "p", 42, "Ch 56 · Hypospadias", "10 · Complications", "Nearly every complication traces to distal obstruction, ischaemia or tension — so fistula/diverticulum repair begins by calibrating the distal urethra."], [2, "r", 44, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "2 · Embryology of descent", "Inguinoscrotal · <span class=\"key\">20–28 weeks</span> · The canal widens and the processus forms; rapid passage through the canal (rarely before 22 weeks); the gubernaculum then regresses. Most are scrotal after 27 weeks. · Androgen via the genitofemoral nerve (<b>GFN</b>), which releases calcitonin gene-related peptide (<b>CGRP</b>); cremaster myogenesis (Wnt)"], [2, "p", 44, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "2 · Embryology of descent", "Outgrowth creates the canal; regression lets the testis follow — a defect in either gives the same phenotype. INSL3 and androgen act on one target (gubernacular/cremaster myogenesis), hence one clinical picture whichever fails."], [2, "l", 44, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "3 · Epidemiology, aetiology and associations", "Prevalence is <span class=\"key\">2–4% at birth</span> (term), falling to <span class=\"key\">1–2% at 3 months</span>; up to 45% in preterm boys."], [2, "l", 46, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "5 · Malignancy", "TGCT risk is <span class=\"key\">2–5×</span> (pooled odds ratio (OR) ≈ 4). About 1% of cryptorchid men get TGCT; 5–10% of TGCT patients had a UDT. Contralateral OR ≈ 1.5."], [2, "l", 46, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "5 · Malignancy", "In the <b>Swedish population study</b> the OR was 3.2: about 2.8 if diagnosed before puberty vs about 5.0 after. <span class=\"dag\">†</span> Pettersson 2007: relative risk (RR) 2.23 if operated before 13 years vs 5.40 at 13 or older. A meta-analysis gave RR <span class=\"key\">5.8</span> for orchidopexy after 10–11 years."], [2, "a", 47, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "6 · Diagnosis", "<ol>\n<li>Warm room and hands, distraction. Examine supine, then cross-legged, squatting or standing; thigh abduction inhibits the cremaster.</li>\n<li>With lubricant on the fingers, sweep one hand from the anterior superior iliac spine (ASIS) along the canal; palpate the lowest position with the other.</li>\n<li>Compress the canal and invaginate the scrotum to feel the SIP.</li>\n<li>Apply sustained traction to fatigue the cremaster. If it <b>stays, it is retractile; if it springs back, it is undescended</b>.</li>\n</ol>"], [2, "l", 47, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "6 · Diagnosis", "About <span class=\"key\">80% palpable</span>; 60–70% are unilateral. At surgery a non-palpable testis is abdominal/peeping in 25–50%, vanished in 15–40% and a missed extra-abdominal testis in 10–30%."], [2, "l", 48, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "7 · Management principles and timing", "<b>Timing</b>: observe to <span class=\"key\">6 months</span> (corrected age), then refer; operate at <b>6–18 months</b>, preferably by 12. A preterm boy is observed to 6 months beyond the due date (1 year if marginal)."], [2, "p", 48, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "7 · Management principles and timing", "Hormones fail on both claims for one reason: position, not endocrinology, is the modifiable variable — descent is not androgen-limited after fetal life, and germ cells track age at scrotal placement."], [2, "a", 49, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "8 · Surgery for the palpable testis", "<ol>\n<li>EUA, skin-crease incision, check the SIP.</li>\n<li>Open the external oblique, sparing the ilioinguinal nerve.</li>\n<li>Free the testis; divide the gubernaculum distal to the sac (protect a long-looping vas).</li>\n<li><b>Separate the patent processus from vas and vessels without skeletonising; high-ligate it at the internal ring</b> (main length gain).</li>\n<li>If short, divide lateral spermatic bands and dissect retroperitoneally through the transversalis fascia; then the <b>Prentiss manoeuvre</b> (medial to the inferior epigastric vessels).</li>\n<li>Transverse scrotal incision and <b>subdartos pouch</b>; pass the testis untwisted.</li>\n<li>Excise appendages, inspect the epididymis, close dartos around the cord (transalbugineal sutures unnecessary — 98.7% success without). Local, ilioinguinal or caudal block.</li>\n</ol>"], [2, "a", 49, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "9 · The non-palpable testis", "<ol>\n<li>EUA: if now palpable, do an inguinal or scrotal orchidopexy.</li>\n<li>If <b>still non-palpable, do diagnostic laparoscopy</b> (ring patency, vessels, vas, testis).</li>\n<li>If <b>blind-ending vessels</b> (with or without vas) lie above a closed ring, the testis has vanished: stop (the only unequivocal endpoint).</li>\n<li>If <b>vessels and vas enter the ring</b>, explore the groin/scrotum and excise the nubbin (viable tubules 5–15%).</li>\n<li>If the testis is <b>intra-abdominal</b>, do a primary laparoscopic or Fowler–Stephens (one- or two-stage) orchidopexy; orchidectomy if postpubertal or dysgenetic.</li>\n<li>If it is peeping at the ring, do a laparoscopic or inguinal orchidopexy.</li>\n<li>If neither vas nor vessels are seen, search the perivesical area and retroperitoneum to the kidney (a perirenal testis may accompany renal dysplasia/agenesis).</li>\n</ol>"], [2, "a", 50, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "9 · The non-palpable testis", "<ol>\n<li>Empty bladder and stomach. Open (Hasson) umbilical 5-mm port; carbon dioxide (CO<sub>2</sub>) 8–12 mmHg. Inspect both rings; add 2–3-mm working ports.</li>\n<li>Divide the gubernaculum distal to the ring and use it as a handle.</li>\n<li>Incise peritoneum lateral to the vessels and distal to the vas; mobilise the vessels, <b>preserving the peritoneal triangle between vas and vessels</b> (keeps Fowler–Stephens possible).</li>\n<li>Make a new hiatus medial to the inferior epigastric vessels and lateral to the medial umbilical ligament.</li>\n<li>Bring the testis through a trans-scrotal port to a subdartos pouch; avoid tension.</li>\n</ol>"], [2, "l", 50, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "9 · The non-palpable testis", "Two-stage FS: clip the vessels high (1.5–3 cm above the testis), wait about <span class=\"key\">6 months</span>, then mobilise on a wide peritoneal pedicle. Two-stage is slightly favoured (better position, similar atrophy)."], [2, "p", 50, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "9 · The non-palpable testis", "Every abdominal technique answers one question: how to gain length without losing blood supply. FS sacrifices the testicular artery; traction gains length over time while keeping it — vessel division is the last resort."], [2, "l", 52, "Ch 61 · Urologic Considerations in Pediatric Renal Transplantation", "1 · Causes of ESKD in children", "Older children: focal segmental glomerulosclerosis (FSGS), neuropathic bladder. Commonest age at transplant: <span class=\"key\">13–17 years</span>."], [2, "p", 52, "Ch 61 · Urologic Considerations in Pediatric Renal Transplantation", "1 · Causes of ESKD in children", "<b>Five goals</b>: unimpeded drainage · capacious low-pressure reservoir with social continence · volitional emptying · no infection · fewest operations. Chronic rejection is unavoidable, but every added insult accelerates it."], [2, "a", 52, "Ch 61 · Urologic Considerations in Pediatric Renal Transplantation", "2 · Pre-transplant evaluation", "<ol>\n<li>Positive history: US and VCUG. If dynamics are abnormal, urodynamics.</li>\n<li>Treat with drugs and clean intermittent catheterisation (CIC), with or without bladder cycling, then reassess.</li>\n<li>If still unsafe, augment; then clear for transplant.</li>\n</ol>"], [2, "l", 52, "Ch 61 · Urologic Considerations in Pediatric Renal Transplantation", "3 · Bladder management", "<b>Target</b>: expected capacity at detrusor pressure <span class=\"key\">&lt; 40 cm H₂O</span>, with social continence."], [2, "l", 53, "Ch 61 · Urologic Considerations in Pediatric Renal Transplantation", "3 · Bladder management", "<b>Augment</b> if unable to reach &gt; <span class=\"key\">75%</span> of expected capacity at &lt; 40 cm H₂O with CIC no more often than every <span class=\"key\">3–4 h</span> despite maximal therapy. It does not clearly raise transplant complications. PUV: <b>postpone</b>; neuropathic: <b>earlier</b>."], [2, "l", 53, "Ch 61 · Urologic Considerations in Pediatric Renal Transplantation", "3 · Bladder management", "Reconstruct <b>before</b> transplant, allowing <span class=\"key\">6–12 weeks</span> to heal; exception: transplant before 2 years (before continence is expected)."], [2, "l", 53, "Ch 61 · Urologic Considerations in Pediatric Renal Transplantation", "5 · Transplant into the abnormal bladder", "Gibson retroperitoneal incision; a child &lt; <span class=\"key\">15 kg</span> may need the aorta/vena cava and a transperitoneal approach. Know where the augment pedicle lies."], [2, "l", 53, "Ch 61 · Urologic Considerations in Pediatric Renal Transplantation", "5 · Transplant into the abnormal bladder", "Stent if difficult: double-J out at <span class=\"key\">4–6 weeks</span>, and early removal at 5–7 days may cut infection. Use the largest urethral catheter tolerated."], [2, "r", 53, "Ch 61 · Urologic Considerations in Pediatric Renal Transplantation", "6 · Urological complications", "Ureteric stenosis · <span class=\"key\">6%</span> · Most within 100 days; distal, ischaemic. Focal: balloon and stent for 4–6 weeks; otherwise open repair (native ureter, bladder flap); do not delay."], [2, "r", 53, "Ch 61 · Urologic Considerations in Pediatric Renal Transplantation", "6 · Urological complications", "Urine leak · <span class=\"key\">3%</span> · Early. Drain-fluid creatinine; check catheter, then US, then MAG3 (mercaptoacetyltriglycine) scan or cystogram. Small: observe; large: drain or explore. Short necrosis: reimplant; long: native ureter, psoas hitch or flap."], [2, "a", 54, "Ch 61 · Urologic Considerations in Pediatric Renal Transplantation", "6 · Urological complications", "<ol>\n<li>Indwelling catheter for 1–2 weeks: if creatinine falls, the bladder is the cause.</li>\n<li>If not, stent and keep the catheter; biopsy if rejection is suspected.</li>\n<li>If retrograde stenting fails, nephrostomy and antegrade study.</li>\n</ol>"], [2, "l", 55, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "1 · Wilms tumour (WT): epidemiology and genetics", "WT is <span class=\"key\">6–7%</span> of childhood cancers and <span class=\"key\">95%</span> of kidney cancers under 15 y; median age <span class=\"key\">3.5 y</span>, younger if bilateral/syndromic."], [2, "r", 55, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "1 · Wilms tumour (WT): epidemiology and genetics", "High (&gt; 20%) · WAGR, DDS (<span class=\"key\">50%</span>); Fanconi D1 (BRCA2); Perlman (DIS3L2); mosaic variegated aneuploidy"], [2, "p", 55, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "1 · Wilms tumour (WT): epidemiology and genetics", "Trap: BWS is the <b>commonest</b> predisposing syndrome but only moderate risk; WAGR/DDS are rarer and highest."], [2, "a", 55, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "1 · Wilms tumour (WT): epidemiology and genetics", "<ol>\n<li>If WT risk is &gt; 1%, do a renal ultrasound (US) every <b>3–4 months</b> until <b>7 y</b>.</li>\n<li>If a lesion looks suspicious, do computed tomography (CT) or magnetic resonance imaging (MRI).</li>\n</ol>"], [2, "l", 56, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "2 · Pathology", "<b>Anaplasia</b>: nuclei ≥ <span class=\"key\">3×</span> neighbours, hyperchromasia, abnormal mitoses. Seen in ~2% under 2 y and ~13% over 5 y; acquired (absent from rests)."], [2, "l", 56, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "2 · Pathology", "Nephrogenic rests are found in &gt; 1/3 of WT kidneys and <span class=\"key\">&gt; 90%</span> of bilateral cases; most regress."], [2, "p", 56, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "4 · Staging and COG vs SIOP", "COG stage is surgical-pathological, so the surgeon — not the scan — decides chemotherapy intensity and irradiation: one spill converts stage I/II to III."], [2, "l", 57, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "5 · Surgical principles", "Sample nodes (COG <span class=\"key\">≥5 nodes</span>; skip metastases occur interaortocaval). Omission is the commonest protocol violation (10–20%) and under-stages."], [2, "a", 57, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "5 · Surgical principles", "<ol>\n<li>Synchronous bilateral WT: <b>no upfront nephrectomy, no biopsy</b>.</li>\n<li>Give VCR, AMD and DOX for 6 weeks, then re-image.</li>\n<li>If NSS is feasible, operate.</li>\n<li>If not, give more chemotherapy, but do <b>surgery by week 12</b>.</li>\n<li>If the tumour does not respond, do a <b>bilateral open biopsy</b>.</li>\n</ol>"], [2, "l", 57, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "5 · Surgical principles", "Unilateral NSS suits syndromic children or a solitary kidney; UMBRELLA criteria: <span class=\"key\">&lt;300 mL</span>, adequate remnant, negative nodes."], [2, "l", 57, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "6 · Relapse and late effects", "Late effects track <b>RT and anthracycline</b>: heart failure 4.4% after DOX (rare below <span class=\"key\">150 mg/m²</span>), second cancers 1% at 10 y, gonadal failure."], [2, "p", 58, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "7 · Other renal tumours", "Age points to diagnosis: a neonate has CMN, a toddler WT or rhabdoid, an adolescent RCC. Metastatic site sets staging tests: lung (WT), bone (CCSK), brain (rhabdoid/CCSK)."], [2, "l", 58, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "8 · Neuroblastoma", "Urinary vanillylmandelic acid and homovanillic acid (<b>VMA/HVA</b>) are raised in <span class=\"key\">90–95%</span>. Marrow: two aspirates and two biopsies. MRI is best for intraspinal extension."], [2, "r", 59, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "8 · Neuroblastoma", "MS · Age <span class=\"key\">&lt;18 months</span>; skin, liver, marrow (&lt; 10%) only; no bone (INSS 4S: &lt; 12 months)"], [2, "p", 59, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "8 · Neuroblastoma", "Trap: diploid is bad, hyperdiploid good. Stage 4S/MS: OS 80–88%, frequent regression; deaths in infants &lt; 2 months from massive hepatomegaly (respiratory compromise) or coagulopathy."], [2, "p", 59, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "8 · Neuroblastoma", "Surgical value runs inversely with biology: favourable tumours are cured by little or no resection; unfavourable ones are not rescued by radical resection — vital structures are never traded for margin."], [2, "p", 60, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "9 · Adrenocortical tumours", "Why open? Cure needs complete removal of an intact tumour; capsular rupture seeds the retroperitoneum, with poor salvage."], [2, "l", 61, "Ch 64 · Paediatric Urological Oncology: Pelvis, Bladder, Testis and Genitalia", "1 · Rhabdomyosarcoma (RMS): biology", "GU sites: bladder/prostate (BP), paratesticular (PT), vulvovaginal (VV). GU-RMS 5-y survival is <span class=\"key\">&gt;80%</span>; 16% are metastatic at diagnosis."], [2, "p", 61, "Ch 64 · Paediatric Urological Oncology: Pelvis, Bladder, Testis and Genitalia", "1 · Rhabdomyosarcoma (RMS): biology", "Fusion status predicts outcome better than histology, so trials assign risk by <b>fusion status</b>. MYOD1 mutation and circulating tumour DNA are emerging adverse markers."], [2, "a", 61, "Ch 64 · Paediatric Urological Oncology: Pelvis, Bladder, Testis and Genitalia", "2 · Presentation and work-up", "<ol>\n<li>Start with US.</li>\n<li>CT or MRI of the primary and its nodal basin: BP, pelvic and retroperitoneal nodes up to the renal vessels; PT, retroperitoneal; VV, inguinal, pelvic and retroperitoneal.</li>\n<li><b>Chest CT</b> (lung is the commonest metastatic site).</li>\n<li>Bone scan and bilateral marrow sampling; omit these in fusion-negative ERMS without nodal or lung disease.</li>\n</ol>"], [2, "p", 62, "Ch 64 · Paediatric Urological Oncology: Pelvis, Bladder, Testis and Genitalia", "3 · Stage, group and risk", "An organ-preserving <b>biopsy</b> places BP-RMS in group III, which means <b>intermediate risk</b>; PT-RMS (resected by orchidectomy) is almost always low risk. Age &lt; 1 y or &gt; 10 y is independently adverse. Trap: most distal node positive = IIc, not IIb."], [2, "l", 62, "Ch 64 · Paediatric Urological Oncology: Pelvis, Bladder, Testis and Genitalia", "4 · Treatment principles", "Primary exenteration fell from almost all cases (Intergroup Rhabdomyosarcoma Study, IRS-I) to <span class=\"key\">13%</span> (IRS-IV), with overall survival (OS) unchanged (78–83%)."], [2, "l", 63, "Ch 64 · Paediatric Urological Oncology: Pelvis, Bladder, Testis and Genitalia", "4 · Treatment principles", "Do an <b>ipsilateral nerve-sparing retroperitoneal lymph node dissection (RPLND)</b> before chemotherapy if <span class=\"key\">age ≥10 y</span> or nodes are radiologically N1. Remove ≥ 7–13 nodes up to the renal vessels."], [2, "p", 63, "Ch 64 · Paediatric Urological Oncology: Pelvis, Bladder, Testis and Genitalia", "4 · Treatment principles", "Why age, not CT? Older boys have far more retroperitoneal disease and CT has a high false-negative rate for nodes."], [2, "l", 63, "Ch 64 · Paediatric Urological Oncology: Pelvis, Bladder, Testis and Genitalia", "5 · Other bladder tumours", "<b>Spina bifida/exstrophy</b>: lifetime bladder cancer <span class=\"key\">2–4%</span>, aggressive, and <b>not increased by augmentation</b>. Screening asymptomatic patients is ineffective, so evaluate haematuria promptly."], [2, "r", 64, "Ch 64 · Paediatric Urological Oncology: Pelvis, Bladder, Testis and Genitalia", "6 · Testicular tumours", "Half-life · <span class=\"key\">5 days</span> · <span class=\"key\">24 h</span>"], [2, "a", 64, "Ch 64 · Paediatric Urological Oncology: Pelvis, Bladder, Testis and Genitalia", "6 · Testicular tumours", "<ol>\n<li>Use an inguinal approach.</li>\n<li>If markers are normal and US looks benign, do a <b>testis-sparing partial orchidectomy</b> with frozen section.</li>\n<li>If benign, close.</li>\n<li>If frozen section shows germ cell malignancy, or AFP is raised, do a radical inguinal orchidectomy.</li>\n</ol>"], [2, "l", 64, "Ch 64 · Paediatric Urological Oncology: Pelvis, Bladder, Testis and Genitalia", "6 · Testicular tumours", "<b>YST</b>: radical inguinal orchidectomy; <span class=\"key\">90%</span> are stage I. Stage with CT; follow AFP decline by half-life. Stage I: <b>surveillance, no RPLND or chemotherapy</b>. Scrotal violation makes it stage II (chemotherapy, no hemiscrotectomy)."], [2, "p", 65, "Ch 64 · Paediatric Urological Oncology: Pelvis, Bladder, Testis and Genitalia", "6 · Testicular tumours", "Trap: <b>complete</b> androgen insensitivity is intermediate (not high) risk; partial is high."], [2, "a", 66, "★ Putting it together: common paediatric decisions", "A · VUR after febrile UTI", "<ol>\n<li>Renal–bladder ultrasound (US); voiding cystourethrogram (VCUG) if febrile urinary tract infections (UTIs) recur or need admission, or US is abnormal.</li>\n<li>Treat bladder and bowel dysfunction (BBD), constipation first.</li>\n<li>Low risk (grade I–II, no BBD, boy, older): observe with or without continuous antibiotic prophylaxis (CAP). High risk (grade ≥ III, girl, BBD, scars, infant): CAP.</li>\n<li>Breakthrough UTI, new scars, or persistent high grade with poor function: correct the vesicoureteral reflux (VUR) by injection or reimplant (<span class=\"xref\">see Ch 41, 53</span>).</li>\n</ol>"], [2, "a", 66, "★ Putting it together: common paediatric decisions", "C · Undescended testis", "<ol>\n<li><b>Palpable</b>: orchidopexy at <span class=\"key\">6–18 months</span> (ideally by 12); no imaging.</li>\n<li><b>Non-palpable</b>: examination under anaesthesia, then laparoscopy. Blind-ending vessels: stop. Vessels and vas entering the ring: groin exploration. Intra-abdominal testis: laparoscopic orchidopexy (primary/Fowler–Stephens).</li>\n<li><b>Bilateral non-palpable, or undescended testis with hypospadias</b>: disorder of sex development (DSD) work-up first <span class=\"xref\">(see Ch 59)</span>.</li>\n</ol>"], [2, "p", 67, "★ Putting it together: common paediatric decisions", "E · Newborn with atypical genitalia", "Bilateral impalpable gonads with atypical genitalia = salt-wasting congenital adrenal hyperplasia (CAH) until proven otherwise. Check electrolytes, 17-hydroxyprogesterone (after 36 h) and karyotype; crisis at days 5–7. Sex assignment and surgery are not emergencies (multidisciplinary team)."], [3, "l", 2, "Ch 32 · Embryology of the Human Genitourinary Tract", "1 · Overview", "The <b>indifferent stage</b> lasts to about <span class=\"key\">8–9 wk</span>; then androgens drive the sexes apart."], [3, "p", 2, "Ch 32 · Embryology of the Human Genitourinary Tract", "2 · Kidney and ureter", "One defect gives both dysplasia and an abnormal orifice: bud position on the Wolffian duct sets where it meets the blastema (kidney quality) and where its orifice lands in the bladder."], [3, "l", 3, "Ch 32 · Embryology of the Human Genitourinary Tract", "4 · Gonads", "<b>Sex-determining region Y (SRY)</b> makes Sertoli cells enclose primordial germ cells (PGCs) in cords at about <span class=\"key\">6 wk</span>. Leydig cells appear from 8 wk."], [3, "l", 3, "Ch 32 · Embryology of the Human Genitourinary Tract", "4 · Gonads", "<b>Müllerian-inhibiting substance (MIS)</b>, also called anti-Müllerian hormone (AMH), from Sertoli cells, makes the Müllerian ducts regress at <span class=\"key\">8–10 wk</span>. Without it, the uterus and tubes persist."], [3, "p", 3, "Ch 32 · Embryology of the Human Genitourinary Tract", "4 · Gonads", "Two independent testicular signals act on two independent duct systems: MIS decides Müllerian, testosterone decides Wolffian and external genitalia. Every DSD is a combination of the two."], [3, "l", 4, "Ch 32 · Embryology of the Human Genitourinary Tract", "6 · Genital ducts", "The <b>prostate</b> buds at <span class=\"key\">10 wk</span> from FOXA1-positive urogenital sinus (UGS) epithelium below the ureteric insertion. Most lie lateral to the <b>verumontanum</b>, where Wolffian ducts and utricle open."], [3, "l", 4, "Ch 32 · Embryology of the Human Genitourinary Tract", "7 · External genitalia", "The shaft is fused by <span class=\"key\">16 wk</span>; the prepuce depends on the glanular urethra."], [3, "p", 6, "Ch 32 · Embryology of the Human Genitourinary Tract", "9 · Clinical correlations", "Homologues: Littre and Skene; Cowper and Bartholin; spongiosum and vestibular bulb; gubernaculum and the ovarian plus round ligaments; labioscrotal swellings and labia majora. Traps: the vagina is UGS-derived; the appendix testis is Müllerian and the appendix epididymis Wolffian."], [3, "l", 7, "Ch 33 · Urologic Aspects of Pediatric Nephrology", "1 · Renal function in the child", "Glomerular filtration rate (GFR) doubles in 2 weeks, reaching adult level by <span class=\"key\">2 years</span>; at term it is about 40 mL/min/1.73 m²."], [3, "l", 7, "Ch 33 · Urologic Aspects of Pediatric Nephrology", "1 · Renal function in the child", "Creatinine in the first 48 h is <b>maternal</b>; by day 7 it is the neonate's own (<span class=\"key\">&lt;0.5 mg/dL</span> at term)."], [3, "p", 7, "Ch 33 · Urologic Aspects of Pediatric Nephrology", "1 · Renal function in the child", "The neonatal kidney is \"hormonally deaf\": maternal creatinine, week-1 salt wasting, hyperkalaemia (aldosterone-unresponsive tubule), low bicarbonate and poor concentration (antidiuretic hormone-unresponsive) reflect immaturity, not disease."], [3, "l", 7, "Ch 33 · Urologic Aspects of Pediatric Nephrology", "2 · Haematuria", "Microscopic haematuria is <span class=\"key\">&gt;5 red blood cells (RBCs)/high-power field</span> (fresh spun urine); about 1% of school children, mostly resolving."], [3, "l", 7, "Ch 33 · Urologic Aspects of Pediatric Nephrology", "3 · Proteinuria", "Normal urine protein-to-creatinine ratio (UPCR): <span class=\"key\">&lt;0.2 mg/mg</span> (&lt;0.7 in newborns); timed &lt;4 mg/m²/h; adolescents &lt;150 mg/24 h."], [3, "l", 8, "Ch 33 · Urologic Aspects of Pediatric Nephrology", "4 · Glomerular disease", "Proteinuria <span class=\"key\">&gt;40 mg/m²/h or UPCR &gt;2.0</span> with hypoalbuminaemia and hyperlipidaemia."], [3, "l", 8, "Ch 33 · Urologic Aspects of Pediatric Nephrology", "4 · Glomerular disease", "<b>Post-streptococcal GN</b> follows pharyngitis or pyoderma by weeks. C3 normalises by <span class=\"key\">8–12 weeks</span>; if it stays low, biopsy."], [3, "l", 9, "Ch 33 · Urologic Aspects of Pediatric Nephrology", "7 · Hypertension", "Hypertension: repeated BP <span class=\"key\">&gt;95th percentile</span> for age, sex and height; adolescents normal below 120/80. Up to a quarter are white-coat."], [3, "l", 9, "Ch 33 · Urologic Aspects of Pediatric Nephrology", "7 · Hypertension", "Lifestyle for stage 1 without end-organ damage; drugs for stage 2, symptoms, end-organ damage or a secondary cause. Target &lt;90th percentile, or <span class=\"key\">&lt;50th</span> in chronic kidney disease (CKD)."], [3, "l", 9, "Ch 33 · Urologic Aspects of Pediatric Nephrology", "8 · Acute kidney injury", "Fractional excretion of sodium (FeNa) <span class=\"key\">&lt;1%</span> means prerenal, &gt;3% intrinsic; on diuretics use fractional urea &lt;35%."], [3, "l", 10, "Ch 33 · Urologic Aspects of Pediatric Nephrology", "9 · Chronic kidney disease", "CKD is abnormality lasting &gt;3 months; stages (age &gt;2 years) by GFR: I ≥90, II 60–89, III 30–59, IV 15–29, V <span class=\"key\">&lt;15</span> or dialysis."], [3, "l", 10, "Ch 33 · Urologic Aspects of Pediatric Nephrology", "10 · Dialysis and transplantation", "Peritoneal dialysis (PD) is first choice if <span class=\"key\">&lt;9 years / &lt;20 kg</span>. Vesicostomy is acceptable; omphalocele, gastroschisis, diaphragmatic hernia and exstrophy contraindicate it."], [3, "l", 10, "Ch 33 · Urologic Aspects of Pediatric Nephrology", "10 · Dialysis and transplantation", "Transplant is often pre-emptive living-related; many await <span class=\"key\">≥10 kg and 65 cm</span> because of graft thrombosis."], [3, "l", 11, "Ch 34 · Perinatal Urology", "1 · Fetal
