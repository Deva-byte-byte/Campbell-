<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm column (max 760px). A sticky bar holds the day switcher and the two views (Today, Book core).
   Palette follows the printed zen timetable: sage, mist blue, clay, mauve on warm paper; yellow marker for numbers to memorise. */
:root{
  --bg:#f6f4ef; --surface:#fffdf9; --fg:#24272a; --muted:#5d636a; --faint:#8a8f95; --line:#e4e0d8;
  --sage:#4f8079; --sage-soft:#e6efed; --mist:#566c99; --clay:#a8743f; --mauve:#86647f; --leaf:#557446;
  --sand:#f4ecdc; --gold:#8f6c22; --mark:#ffe58a; --mark-fg:#24272a; --cloze:#c9c4b8;
  --f-read:"Literata", Georgia, "Times New Roman", serif;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141615; --surface:#1b1e1d; --fg:#e6e8e6; --muted:#a6aca9; --faint:#7d837f; --line:#2c312f;
  --sage:#7fb8af; --sage-soft:#1c2c29; --mist:#94a8d6; --clay:#d9a26b; --mauve:#c49bbd; --leaf:#93bb7f;
  --sand:#2a2519; --gold:#e1bd6b; --mark:#5f5112; --mark-fg:#fff3c4; --cloze:#4a4d4b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141615; --surface:#1b1e1d; --fg:#e6e8e6; --muted:#a6aca9; --faint:#7d837f; --line:#2c312f;
  --sage:#7fb8af; --sage-soft:#1c2c29; --mist:#94a8d6; --clay:#d9a26b; --mauve:#c49bbd; --leaf:#93bb7f;
  --sand:#2a2519; --gold:#e1bd6b; --mark:#5f5112; --mark-fg:#fff3c4; --cloze:#4a4d4b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 80px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--bg)}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:5px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sage);color:var(--surface)}
.daynav{display:flex;align-items:center;gap:4px;margin-left:auto}
.daynav button,.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 11px;cursor:pointer}
.daynav button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:3px solid var(--sage);outline-offset:2px}
.invoc{text-align:center;color:#b3261e;font-family:"Noto Serif Devanagari","Tiro Devanagari Hindi",var(--f-read);font-size:15px;margin:2px 0 8px}
:root[data-theme="dark"] .invoc{color:#ff8a80}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .invoc{color:#ff8a80}}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600}
h1{font-family:var(--f-read);font-weight:400;font-size:clamp(30px,7vw,42px);line-height:1.08;margin:4px 0 2px;text-wrap:balance}
.lede{font-family:var(--f-read);font-style:italic;color:var(--muted);margin:0 0 14px}
.track{display:flex;gap:3px;margin:6px 0 18px}
.track i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.track i.done{background:var(--sage)} .track i.now{background:var(--clay)} .track i.buf{background:var(--sand);outline:1px solid var(--gold)}
.block{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.block h2{font-family:var(--f-read);font-weight:400;font-size:21px;margin:0 0 2px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.block .when{font-size:13px;color:var(--faint);letter-spacing:.04em}
.block p{margin:6px 0}
.tag{display:inline-block;font-size:12px;font-weight:700;border:1.2px solid currentColor;border-radius:999px;padding:0 7px;margin-right:6px;line-height:1.5;vertical-align:1px}
.t0{color:var(--sage)} .t1{color:var(--mist)} .t2{color:var(--clay)} .t3{color:var(--mauve)}
.ranges{font-size:17px}
.ranges .r{display:block;margin:3px 0}
.meta{font-size:13.5px;color:var(--muted)}
.bk{color:var(--leaf);font-weight:600}
a.open{font-size:13.5px;font-weight:600;color:var(--sage);text-decoration:none;border-bottom:1px solid var(--sage-soft)}
a.open:hover{border-bottom-color:var(--sage)}
.done{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none;width:max-content}
.done input{width:18px;height:18px;accent-color:var(--sage)}
.recall-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.toggle{font:inherit;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer}
.toggle[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.src{font-size:13px;color:var(--muted);margin:14px 0 4px;font-weight:600;letter-spacing:.02em}
.ch{font-family:var(--f-read);font-size:16px;font-weight:600;margin:16px 0 2px;color:var(--fg)}
.h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:10px 0 2px;font-weight:600}
ul.core{list-style:none;padding:0;margin:0}
ul.core li{font-family:var(--f-read);font-size:16.5px;padding:7px 0 7px 14px;border-bottom:1px solid var(--line);position:relative}
ul.core li::before{content:"";position:absolute;left:0;top:15px;width:5px;height:5px;border-radius:50%;background:var(--faint)}
ul.core li.k-p::before{background:var(--sage)} ul.core li.k-a::before{background:var(--mist)} ul.core li.k-m::before{background:var(--clay)} ul.core li.k-r::before{background:var(--mauve)}
ul.core li .kind{font-family:var(--f-ui);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.k-p .kind{color:var(--sage)} .k-a .kind{color:var(--mist)} .k-m .kind{color:var(--clay)} .k-r .kind{color:var(--mauve)}
ul.core li .pg{font-family:var(--f-ui);font-size:11.5px;color:var(--faint);margin-left:6px;white-space:nowrap}
ul.core li p{margin:2px 0}
ul.core li ul,ul.core li ol{margin:4px 0 2px 18px;padding:0}
.key{background:var(--mark);color:var(--mark-fg);font-weight:700;padding:0 3px;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.cloze .key{background:var(--cloze);color:transparent;cursor:pointer;user-select:none}
.cloze .key.shown{background:var(--mark);color:var(--mark-fg)}
.dag{color:var(--clay);font-weight:700}
.tagx,.tagm{font-family:var(--f-ui);font-size:10.5px;font-weight:700;color:var(--clay);border:1px solid currentColor;border-radius:4px;padding:0 4px}
.xref{font-family:var(--f-ui);font-size:13px;color:var(--sage)}
.buf{background:var(--sand);border-color:transparent}
.buf h2{color:var(--gold)}
.empty{font-family:var(--f-read);font-style:italic;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip[aria-pressed="true"]{background:var(--sage);border-color:var(--sage);color:var(--surface)}
#q{font:inherit;font-size:15px;width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);margin:4px 0 8px}
.count{font-size:13px;color:var(--muted)}
mark.hit{background:var(--sage);color:var(--surface);border-radius:2px}
.more{font:inherit;font-size:14px;font-weight:600;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:8px;width:100%;margin-top:10px;cursor:pointer}
.hide{display:none!important}
@media (max-width:480px){.daynav{margin-left:0;width:100%;justify-content:space-between}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

 {"n": 8, "date": "2026-11-06", "pp": [["P2", 339, 429], ["P3", 1, 23]], "np": 114, "cut": "P3 p.7", "nb": 33, "bb": [[3, 50, 82]]}, {"n": 9, "date": "2026-11-07", "pp": [["P3", 24, 137]], "np": 114, "cut": "P3 p.121", "nb": 37, "bb": [[3, 83, 91], [4, 1, 28]]}, {"n": 10, "date": "2026-11-08", "pp": [["P3", 138, 250]], "np": 113, "cut": "P3 p.234", "nb": 31, "bb": [[4, 29, 59]]}, {"n": 11, "date": "2026-11-09", "pp": [["P3", 251, 300], ["P4", 1, 64]], "np": 114, "cut": "P4 p.48", "nb": 37, "bb": [[4, 60, 75], [5, 1, 21]]}, {"n": 12, "date": "2026-11-10", "pp": [["P4", 65, 177]], "np": 113, "cut": "P4 p.161", "nb": 30, "bb": [[5, 22, 51]]}, {"n": 13, "date": "2026-11-11", "pp": [["P4", 178, 291]], "np": 114, "cut": "P4 p.275", "nb": 37, "bb": [[6, 1, 15], [7, 1, 22]]}, {"n": 14, "date": "2026-11-12", "buf": 1}, {"n": 15, "date": "2026-11-13", "pp": [["P1", 1, 123]], "np": 123, "cut": "P1 p.105", "nb": 34, "bb": [[7, 23, 56]]}, {"n": 16, "date": "2026-11-14", "pp": [["P1", 124, 246]], "np": 123, "cut": "P1 p.228", "nb": 33, "bb": [[7, 57, 68], [8, 1, 21]]}, {"n": 17, "date": "2026-11-15", "pp": [["P1", 247, 369]], "np": 123, "cut": "P1 p.351", "nb": 34, "bb": [[8, 22, 55]]}, {"n": 18, "date": "2026-11-16", "pp": [["P1", 370, 457], ["P2", 1, 35]], "np": 123, "cut": "P2 p.17", "nb": 36, "bb": [[9, 1, 36]]}, {"n": 19, "date": "2026-11-17", "pp": [["P2", 36, 158]], "np": 123, "cut": "P2 p.140", "nb": 38, "bb": [[9, 37, 60], [10, 1, 14]]}, {"n": 20, "date": "2026-11-18", "pp": [["P2", 159, 281]], "np": 123, "cut": "P2 p.263", "nb": 29, "bb": [[10, 15, 43]]}, {"n": 21, "date": "2026-11-19", "pp": [["P2", 282, 405]], "np": 124, "cut": "P2 p.387", "nb": 37, "bb": [[10, 44, 55], [11, 1, 25]]}, {"n": 22, "date": "2026-11-20", "pp": [["P2", 406, 429], ["P3", 1, 99]], "np": 123, "cut": "P3 p.81", "nb": 38, "bb": [[11, 26, 50], [12, 1, 13]]}, {"n": 23, "date": "2026-11-21", "pp": [["P3", 100, 222]], "np": 123, "cut": "P3 p.204", "nb": 33, "bb": [[12, 14, 23], [13, 1, 19], [14, 1, 4]]}, {"n": 24, "date": "2026-11-22", "pp": [["P3", 223, 300], ["P4", 1, 45]], "np": 123, "cut": "P4 p.27", "nb": 33, "bb": [[14, 5, 37]]}, {"n": 25, "date": "2026-11-23", "pp": [["P4", 46, 168]], "np": 123, "cut": "P4 p.150", "nb": 35, "bb": [[15, 1, 35]]}, {"n": 26, "date": "2026-11-24", "pp": [["P4", 169, 291]], "np": 123, "cut": "P4 p.273", "nb": 35, "bb": [[15, 36, 70]]}, {"n": 27, "date": "2026-11-25", "buf": 1}], "items": [[0, "a", 2, "Ch 24 · Basic Principles of Immunology and Immunotherapy in Urologic Oncology", "1 · Innate and adaptive immunity", "<ol>\n<li>Danger signal (TNF-α, TLR ligand) reaches a dendritic cell (DC).</li>\n<li>DC stops antigen uptake; raises MHC and B7-1/B7-2.</li>\n<li>DC enters afferent lymphatics (CCL21 sensed by CCR7).</li>\n<li>In the node it activates CD4, CD8 and B cells.</li>\n</ol>"], [0, "p", 2, "Ch 24 · Basic Principles of Immunology and Immunotherapy in Urologic Oncology", "2 · Immune editing and escape", "PD-L1 is largely induced by the immune attack itself — a marker of an ongoing but suppressed response, not a fixed tumour trait."], [0, "a", 3, "Ch 24 · Basic Principles of Immunology and Immunotherapy in Urologic Oncology", "4 · BCG in bladder cancer", "<ol>\n<li>Instil 1–5 × 10<sup>8</sup> bacilli.</li>\n<li>A fraction adheres via <b>fibronectin attachment protein</b>.</li>\n<li>Urothelial TLR2/TLR4 release IL-8 and TNF-α.</li>\n<li>Neutrophil wave (hours), then DC activation.</li>\n<li>CD4 Th1 response in nodes (weeks), then memory.</li>\n</ol>"], [0, "l", 3, "Ch 24 · Basic Principles of Immunology and Immunotherapy in Urologic Oncology", "4 · BCG in bladder cancer", "Memory explains ~<span class=\"key\">50%</span> of non-muscle-invasive bladder cancer (NMIBC) in durable remission."], [0, "l", 4, "Ch 24 · Basic Principles of Immunology and Immunotherapy in Urologic Oncology", "5 · Cancer vaccines", "Sipuleucel-T prolongs overall survival (OS) by <span class=\"key\">+4.1 months</span> but has <b>no effect on time to progression</b>; it was the first FDA-approved solid-tumour vaccine."], [0, "l", 4, "Ch 24 · Basic Principles of Immunology and Immunotherapy in Urologic Oncology", "6 · Checkpoint blockade", "First-line pembrolizumab alone (KEYNOTE-052) needs cisplatin-ineligibility with combined positive score (CPS) <span class=\"key\">≥10</span>, or platinum-ineligibility; with CPS &lt;10 it did worse than carboplatin."], [0, "p", 5, "Ch 24 · Basic Principles of Immunology and Immunotherapy in Urologic Oncology", "6 · Checkpoint blockade", "Every successful GU immunotherapy either supplies a danger signal (BCG, adjuvant, immunogenic cell death, VEGF inhibition) or removes a brake (PD-1, CTLA-4). Failures cluster where the brake is not limiting — PD-L1-negative, Treg-dominated prostate cancer."], [0, "a", 7, "Ch 25 · Molecular Genetics and Cancer Biology", "3 · Cell cycle", "<ol>\n<li>Hypophosphorylated RB1 binds E2F and histone deacetylases (HDACs), so S-phase genes stay silent.</li>\n<li>Cyclin D–CDK4/6 and cyclin E–CDK2 hyperphosphorylate RB1.</li>\n<li>E2F is released, S-phase genes are transcribed, and the restriction point is passed (irreversible).</li>\n</ol>"], [0, "p", 7, "Ch 25 · Molecular Genetics and Cancer Biology", "3 · Cell cycle", "Cancer must break both RB1 (entry) and TP53 (integrity) — so both pathways are lost in almost every tumour."], [0, "p", 8, "Ch 25 · Molecular Genetics and Cancer Biology", "4 · DNA damage and repair", "Repair defects are targets: HR loss means PARP inhibitor sensitivity (synthetic lethality); MMR loss means immunotherapy; ERCC2 loss means cisplatin sensitivity."], [0, "l", 8, "Ch 25 · Molecular Genetics and Cancer Biology", "6 · Senescence, telomeres, autophagy", "Telomerase is high in <span class=\"key\">85–90%</span> of tumours."], [0, "a", 9, "Ch 25 · Molecular Genetics and Cancer Biology", "8 · Hypoxia, VHL and angiogenesis", "<ol>\n<li>In normoxia, hypoxia-inducible factor-α (HIF-α) is prolyl-hydroxylated.</li>\n<li>Von Hippel-Lindau protein (VHL, an E3 ubiquitin ligase) binds it, and the proteasome degrades it.</li>\n<li>If there is hypoxia or VHL loss, then HIF-α accumulates and dimerises with HIF-1β.</li>\n<li>This switches on VEGF, angiopoietin and glycolytic genes.</li>\n</ol>"], [0, "p", 9, "Ch 25 · Molecular Genetics and Cancer Biology", "8 · Hypoxia, VHL and angiogenesis", "VHL loss = permanent pseudohypoxia; angiogenesis, Warburg metabolism, invasion and immunosuppression follow — why clear cell RCC responds to VEGF, HIF-2α and immune blockade."], [0, "p", 10, "Ch 25 · Molecular Genetics and Cancer Biology", "9 · GU tumour genomics", "The germline syndrome names the somatic driver (VHL: clear cell; MET: papillary; FH: type 2; BRCA: prostate) and the driver names the drug (HIF-2α, MET TKI, PARP, FGFR inhibitor, immunotherapy for MMR loss)."], [0, "l", 12, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "1 · Normal development and penile size", "<b>Stretched penile length (SPL)</b> runs from pubis (fat pad compressed) to glans tip and correlates with erect length. At term it is <span class=\"key\">3.5 ± 0.7 cm</span> (diameter 1.1 cm); in adults 13.3 ± 1.6 cm."], [0, "l", 12, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "1 · Normal development and penile size", "The micropenis cut-off is −2.5 standard deviations (SD): <span class=\"key\">1.9 cm</span> from term to 5 months; 1.5 cm at 30 weeks; 2.0 cm at 34 weeks; ≈ 3.7–3.9 cm at 5–11 years; 9.3 cm in adults. Compare with the cut-off, not the mean."], [0, "l", 12, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "2 · Prepuce: phimosis and paraphimosis", "<b>Physiological phimosis</b> is normal at birth. Smegma and erections separate it: ≈ <span class=\"key\">90% retractable by 3 years</span>, and &lt; 1% remain phimotic at 17 years."], [0, "a", 12, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "2 · Prepuce: phimosis and paraphimosis", "<ol>\n<li>Compress the glans with distal traction; this succeeds in most.</li>\n<li>If it fails, reduce oedema: iced glove 5 min, granulated sugar 1–2 h, or punctures.</li>\n<li>If still irreducible, do a dorsal slit, then circumcision.</li>\n</ol>"], [0, "l", 13, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "3 · Circumcision", "<b>Benefits</b>: penile cancer occurs almost only in men not circumcised at birth. Febrile infant UTI falls (to ≥ 5 years), but <span class=\"key\">111</span> circumcisions prevent one UTI."], [0, "l", 13, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "3 · Circumcision", "Epididymitis and balanitis are rarer, and there is ≈ <span class=\"key\">60%</span> protection against HIV acquisition in men, but no reduction in transmission to partners."], [0, "l", 13, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "3 · Circumcision", "An amputated glans should be re-attached within <span class=\"key\">8 h</span>."], [0, "p", 13, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "3 · Circumcision", "Late sequelae are problems of skin quantity (too much removed: trapped penis, chordee, torsion; too little: redundancy, adhesions) or of the newly exposed meatus (stenosis)."], [0, "p", 14, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "4 · Inconspicuous penis versus micropenis", "<b>Stretched length is the single discriminator.</b> Inconspicuous penis (buried, webbed, trapped) = normal SPL and diameter hidden by skin, fat or scar, so treatment is anatomical. Micropenis = small but normally formed, so it needs an endocrine work-up."], [0, "l", 14, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "4 · Inconspicuous penis versus micropenis", "Micropenis is normally formed but ≥ 2.5 SD below the mean (&lt; <span class=\"key\">1.9 cm</span> at term), with a normal length-to-girth ratio. Testes are often small or cryptorchid."], [0, "a", 15, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "4 · Inconspicuous penis versus micropenis", "<ol>\n<li>History, examination, SPL and <b>karyotype</b>.</li>\n<li>Refer to a paediatric endocrinologist; measure testosterone before and after hCG, with or without a gonadotrophin-releasing hormone (GnRH) test.</li>\n<li>Screen the anterior pituitary (glucose, Na/K, cortisol, thyroid); then MRI brain.</li>\n<li>Test <b>end-organ response: intramuscular testosterone enanthate × 3 months</b>. Short courses spare height; prolonged ones advance bone age. Repeat at puberty.</li>\n</ol>"], [0, "l", 17, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "9 · Scrotal anomalies", "Associations: perineal/scrotal hypospadias, caudal regression, sex chromosome anomalies and Aarskog–Scott. In the complete form, <span class=\"key\">up to 75%</span> have upper-tract anomalies, so do renal US and VCUG."], [0, "a", 18, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "10 · Inguinal hernia and hydrocele", "<ol>\n<li>Skin-crease incision; open the external oblique, sparing the ilioinguinal nerve (young infants: rings coincide, Mitchell-Banks, not opened).</li>\n<li>Split the cremaster and find the sac anteromedially; separate it from the vas and vessels.</li>\n<li>Perform <b>high ligation</b> at the internal ring and tighten a wide ring.</li>\n<li>Finally, <b>confirm the testis is scrotal</b>.</li>\n</ol>"], [0, "l", 19, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "10 · Inguinal hernia and hydrocele", "Contralateral patency is ≈ 40% in infants, but a metachronous hernia develops in only ≈ <span class=\"key\">7%</span>. So routine contralateral exploration is not advised; laparoscopy via the sac is &gt; 99% accurate."], [0, "r", 19, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "11 · Acute scrotum", "Orchidectomy risk · <span class=\"key\">≈ 5%</span> · 20% · 40% · 60% · 80% · 90%"], [0, "a", 19, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "11 · Acute scrotum", "<ol>\n<li>If torsion is suspected, explore the scrotum.</li>\n<li>Detorse and apply warm packs. <b>Meanwhile fix the contralateral testis with non-absorbable suture</b>.</li>\n<li>Reassess. If viable, then fix in a dartos pouch or with non-absorbable sutures. If non-viable, then do an orchidectomy; offer a prosthesis later.</li>\n</ol>"], [0, "l", 20, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "12 · Adolescent varicocele", "Prevalence is ≈ <span class=\"key\">15%</span>; it appears after 10 years, peaks at Tanner 3, favours tall thin boys and is familial."], [0, "p", 20, "Ch 55 · Management of Abnormalities of the External Genitalia in Males", "12 · Adolescent varicocele", "<b>Indications for repair</b>: left testis &gt; <span class=\"key\">20%</span> smaller (or bilateral hypotrophy), pain, abnormal semen (Tanner 5 / ≥ 18 y), intratesticular varicocele with asymmetry. Total volume &lt; 30 mL and low total motile count predict poor semen."], [0, "p", 22, "Ch 58 · Management of Abnormalities of the Genitalia in Girls", "2 · Evaluation and classification", "Decision hinge: <b>is it obstructive?</b> Obstruction needs prompt drainage; non-obstructive anomalies wait until intercourse or fertility demands surgery."], [0, "p", 23, "Ch 58 · Management of Abnormalities of the Genitalia in Girls", "4 · Vestibule: the interlabial mass", "Read every mass against the meatus: central (prolapse), displaced (Skene), separate/vaginal (Gartner, ectopic ureter, hymen, tumour). Any cyst of urethral or vaginal origin needs a <b>renal US, always</b>."], [0, "l", 24, "Ch 58 · Management of Abnormalities of the Genitalia in Girls", "5 · Vagina: obstruction and absence", "Renal anomaly occurs in ≈ <span class=\"key\">one-third</span>, skeletal in 10–20%; no lumbosacral dysraphism. <b>Type A</b>: symmetrical buds, normal tubes, no extra-müllerian anomaly. <b>Type B</b>: asymmetrical with renal, Klippel–Feil or MURCS anomalies; needs full renal and skeletal work-up."], [0, "p", 24, "Ch 58 · Management of Abnormalities of the Genitalia in Girls", "6 · Vaginal replacement", "<b>Cervical atresia</b>: a perineum-to-uterus anastomosis loses the endocervical barrier, causing life-threatening ascending infection. Hysterectomy with neovagina is often best; otherwise endometrial suppression and in vitro fertilisation with transmyometrial transfer."], [0, "l", 24, "Ch 58 · Management of Abnormalities of the Genitalia in Girls", "8 · Acquired disorders", "<b>Vaginal rhabdomyosarcoma</b>: grapelike bleeding mass under 2 years; best prognosis of genital primaries (embryonal). Biopsy, then computed tomography (CT) and marrow, then chemotherapy with or without resection. Intergroup Rhabdomyosarcoma Study (IRS) trials cut surgery from <span class=\"key\">100% to 13%</span>."], [0, "p", 26, "Ch 59 · Differences of Sexual Development", "2 · Normal sex development", "The testis uses two separate hormones: AMH removes Müllerian ducts, testosterone/DHT builds Wolffian and external structures. A uterus in 46,XY means Sertoli (AMH) failure — dysgenesis, not a synthesis or receptor defect."], [0, "l", 27, "Ch 59 · Differences of Sexual Development", "4 · 46,XX DSD", "CAH is the commonest 46,XX DSD and <b>commonest cause of neonatal atypical genitalia</b>. 21-OHD is <span class=\"key\">95%</span> of CAH; autosomal recessive, ≈ 1 in 15,000."], [0, "l", 27, "Ch 59 · Differences of Sexual Development", "4 · 46,XX DSD", "<b>17-hydroxyprogesterone (17-OHP) is raised</b>; measure after <span class=\"key\">36 h</span>. Androstenedione, testosterone and renin rise and cortisol falls; a cosyntropin test helps."], [0, "l", 27, "Ch 59 · Differences of Sexual Development", "4 · 46,XX DSD", "A <b>salt-wasting crisis</b> (low sodium, high potassium, acidosis, shock) usually comes no earlier than <span class=\"key\">day 5–7</span>."], [0, "r", 28, "Ch 59 · Differences of Sexual Development", "5 · 46,XY DSD", "<b>5α-reductase 2</b> · Autosomal recessive; atypical/female at birth, blind pouch; <b>virilises at puberty</b>, fertility reported; testosterone:DHT <span class=\"key\">&gt;20:1</span>; \"guevedoces\" (Imperato-McGinley 1979)"], [0, "p", 29, "Ch 59 · Differences of Sexual Development", "7 · Evaluation of the newborn with atypical genitalia", "<b>Emergency</b>: atypical genitalia with bilateral impalpable gonads = salt-wasting CAH until proven otherwise. Check electrolytes and 17-OHP; watch for crisis from the end of week 1. Designation and surgery are not emergencies."], [0, "l", 30, "Ch 59 · Differences of Sexual Development", "7 · Evaluation of the newborn with atypical genitalia", "A multidisciplinary team (MDT) reviews within <span class=\"key\">24–48 h</span>. Say \"your baby\", never \"it\". A urologist without a team transfers early."], [0, "a", 30, "Ch 59 · Differences of Sexual Development", "7 · Evaluation of the newborn with atypical genitalia", "<ol>\n<li>Send karyotype (≥45 cells, for mosaicism; fluorescence in situ hybridisation for X/Y in hours), electrolytes, and 17-OHP at ≈ 36 h.</li>\n<li>Pelvic ultrasonography for uterus and gonads.</li>\n<li>At ≈ 1 week: LH, follicle-stimulating hormone (FSH), testosterone, oestrogen, androstenedione, DHT, AMH, with or without hCG stimulation.</li>\n<li>Genetic panel, microarray or exome.</li>\n<li>If still unclear, then magnetic resonance imaging, genitography, endoscopy, laparoscopy with or without biopsy (<b>no gonadectomy during diagnosis</b>).</li>\n</ol>"], [0, "l", 30, "Ch 59 · Differences of Sexual Development", "7 · Evaluation of the newborn with atypical genitalia", "A precise diagnosis is nearly always made in 46,XX DSD but in <span class=\"key\">&lt;50%</span> of 46,XY."], [0, "l", 32, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "2 · Urogenital sinus and cloaca — classification", "CAH causes half of all newborn atypical genitalia and <span class=\"key\">90%</span> of 46,XX cases. Salt wasting occurs in <span class=\"key\">67–75%</span>; get a karyotype within <span class=\"key\">48 h</span>."], [0, "p", 32, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "2 · Urogenital sinus and cloaca — classification", "<b>Governing principle</b>: <b>true urethral length</b> (from bladder neck to confluence) decides the operation far more than common-channel length, in sinus and cloaca. Confluence level is a continuum, not just \"high\" or \"low\"."], [0, "l", 32, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "2 · Urogenital sinus and cloaca — classification", "<b>Ganesan concept</b> <span class=\"tag\">MCQ</span>: in CAH the proximal urethra is normal (bladder neck to confluence <span class=\"key\">1.5–2 cm</span> in infants). Virilisation lengthens the <b>vagina-to-meatus</b> distance, so a \"high\" CAH confluence is an illusion."], [0, "l", 33, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "3 · Clinical evaluation", "The <b>Huffman index</b> (glans width × length) is normally <span class=\"key\">&lt;3.5 mm²</span>; <span class=\"key\">&gt;10 mm²</span> is a concern. Isolated clitoral hypertrophy in a preterm is not a DSD."], [0, "r", 33, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "3 · Clinical evaluation", "Uterovaginal · Duplication/septation · <span class=\"key\">53–67%</span>"], [0, "p", 33, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "3 · Clinical evaluation", "Two early dangers: <b>adrenal crisis</b> (CAH) and <b>obstructive hydrocolpos</b> (pure sinus, cloaca). Number of perineal orifices tells you which world you are in."], [0, "r", 34, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "4 · Imaging and endoscopy", "Common channel (Peña) · <span class=\"key\">&lt;3 cm</span> · &gt;3 cm"], [0, "r", 34, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "5 · DSD reconstruction — timing and consent", "<b>After puberty</b> · Infant repairs stenose; avoids dilation; allows consent; delay for the small vagina (<span class=\"key\">&lt;3 cm</span>)"], [0, "p", 34, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "5 · DSD reconstruction — timing and consent", "Both camps invoke oestrogen (maternal vs pubertal). Without comparative data the decision is ethical, not evidential; it rests with parents and team. Endocrine Society CAH guideline (2018): families with experienced surgeons decide; 2006 consensus limits surgery to Prader III–IV."], [0, "p", 35, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "6 · Operative principles", "Ask: <b>must the confluence be moved?</b> Flap brings skin to a low vagina; pull-through takes a high vagina off the urethra. Flap on a high confluence is the classic error."], [0, "a", 35, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "7 · Low confluence repair", "<ol>\n<li>Ensure metabolic stability; give <b>stress-dose steroids in CAH</b> and antibiotics.</li>\n<li>Do endoscopy; place a <b>Fogarty catheter in the vagina</b> and a Foley in the bladder.</li>\n<li>Prepare the whole lower body for supine–prone rotation (lithotomy blocks conversion).</li>\n</ol>"], [0, "a", 36, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "7 · Low confluence repair", "<ol>\n<li>Place a glans traction suture.</li>\n<li>Incise around the glans, keeping the inner prepuce for the hood (<b>second only to the glans in sensitivity</b>).</li>\n<li>Cut strips beside the ventral mucosal plate; raise the omega flap; make Y-incisions on the labia majora.</li>\n<li>Deglove to the bifurcation, keeping the ventral plate intact.</li>\n</ol>"], [0, "a", 36, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "7 · Low confluence repair", "<ol>\n<li>Flap vaginoplasty: raise the omega flap with its fat.</li>\n<li>Free the posterior sinus off the rectum (<b>hardest step</b>).</li>\n<li>Open the posterior sinus in the midline into the posterior vaginal wall, and <b>continue to normal-calibre vagina</b>.</li>\n<li>Inset the flap.</li>\n</ol>"], [0, "p", 36, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "7 · Low confluence repair", "Two fixed points: never touch the dorsal neurovascular bundle; always open back to normal-calibre vagina."], [0, "l", 36, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "8 · High confluence: pull-through", "Only ≈ <span class=\"key\">5%</span> of CAH cases are high; they are commoner in pure sinus."], [0, "a", 36, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "8 · High confluence: pull-through", "<ol>\n<li>Position prone; incise in the midline between sinus and rectum.</li>\n<li>Divide the sinus up to normal vagina and place a retractor inside the vagina.</li>\n<li>Free the anterior wall off the urethra <b>under direct vision</b>.</li>\n<li>Close the sinus as the urethra in 2–3 layers; mobilise the vagina.</li>\n<li>Turn supine for flaps and labioplasty.</li>\n</ol>"], [0, "l", 37, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "10 · Outcomes of sinus/DSD surgery", "After infant vaginoplasty, <b>secondary introitoplasty</b> is needed after puberty in <span class=\"key\">25–100%</span>, because the orifice does not grow; revision is easy."], [0, "l", 37, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "10 · Outcomes of sinus/DSD surgery", "<b>Azziz (1986)</b> <span class=\"tag\">MCQ</span> reported poor coitus rates, but almost all were <b>cut-backs</b>, so it does not apply now."], [0, "l", 37, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "10 · Outcomes of sinus/DSD surgery", "<b>Elmasri meta-analysis (2018)</b>: mean age 2.7 years; female identity ≈ 89%; vaginal stenosis <span class=\"key\">27%</span>; only half had comfortable intercourse; no early-vs-late comparison."], [0, "a", 38, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "11 · Cloaca — initial management", "<ol>\n<li>Decompress the bowel.</li>\n<li>Decompress the genitourinary tract.</li>\n<li>Correct nephron-destructive anomalies.</li>\n<li>Then do the definitive repair.</li>\n</ol>"], [0, "l", 38, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "11 · Cloaca — initial management", "<b>Kidneys</b>: structural anomalies occur in <span class=\"key\">60–83%</span>; chronic kidney disease (CKD) in <span class=\"key\">75%</span> and end-stage renal disease in <span class=\"key\">17%</span>. Urodynamics are abnormal in <span class=\"key\">90%</span>."], [0, "p", 38, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "12 · Cloaca — definitive repair", "Why 1.5 cm? A urethra &gt;1.5 cm keeps the bladder neck above the urogenital diaphragm; mobilising a shorter one drags the bladder neck below the continence mechanism, which causes leakage."], [0, "a", 38, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "12 · Cloaca — definitive repair", "<ol>\n<li><b>PSARVUP (Peña; posterior sagittal anorectovaginourethroplasty)</b>: place catheters in each channel; position <b>prone jackknife</b>.</li>\n<li>Mark the anal site with a muscle stimulator; incise in the midline.</li>\n<li>Open the rectal fistula and mobilise the rectum.</li>\n<li>Do TUM or vaginal separation.</li>\n<li>Close the urethra in 2–3 layers with a <b>fat flap</b>; rebuild the perineal body; centre the rectum in the sphincter.</li>\n</ol>"], [0, "l", 39, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "13 · Cloaca — results and follow-up", "<b>Urinary</b>: about half void spontaneously. Peña: CIC in <span class=\"key\">28%</span> (channel &lt;3 cm) vs <span class=\"key\">78%</span> (&gt;3 cm)."], [0, "l", 39, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "13 · Cloaca — results and follow-up", "Vaginal stenosis or obstructed menstruation occurs in <span class=\"key\">36–41%</span>. Pregnancy is possible, with <b>caesarean preferred</b>. Leave atretic genitalia alone."], [0, "a", 39, "Ch 60 · Surgical Management of Differences of Sexual Differentiation and Cloacal and Anorectal Malformations", "13 · Cloaca — results and follow-up", "<ol>\n<li>Do US <b>6–9 months after thelarche</b>.</li>\n<li>Repeat every 6–9 months until menses are normal.</li>\n</ol>"], [0, "p", 40, "Ch 65 · Adolescent and Transitional Urology", "1 · Definitions", "Evidence looks weak because the wrong endpoint is measured. Renal function and glycated haemoglobin (HbA1c) are expected to worsen, so <b>stability and retention in follow-up</b> are success; fewer are lost when actively transitioned."], [0, "l", 41, "Ch 65 · Adolescent and Transitional Urology", "3 · The process", "Begin at about <span class=\"key\">12 years</span> (American Academy of Pediatrics, AAP); complete by the late teens–early 20s. Age <span class=\"key\">26</span> is the latest (US parental insurance ends). If independence is unachievable, plan custodianship."], [0, "p", 41, "Ch 65 · Adolescent and Transitional Urology", "3 · The process", "Transfer is not the endpoint: transition ends only when integration into adult care is confirmed."], [0, "l", 41, "Ch 65 · Adolescent and Transitional Urology", "5 · Development and consent", "Avoid genital surgery in the phallic–oedipal period (<b>3–6 years</b>) and separation in the first year. Theory and the 1975 AAP panel favour genital surgery at <span class=\"key\">&lt;6 months</span>."], [0, "l", 43, "Ch 120 · Aging and Geriatric Urology", "1 · Concepts and biology", "\"Geriatrics\" was first used clinically by Nascher (1909) <span class=\"tag\">MCQ</span>."], [0, "l", 43, "Ch 120 · Aging and Geriatric Urology", "1 · Concepts and biology", "<b>Cellular senescence</b> (irreversible arrest of replication) drives ageing. It is replicative, via telomere shortening (<b>Hayflick limit</b>, 1961) <span class=\"tag\">MCQ</span>, or stress-induced (reactive oxygen species, radiation, DNA damage)."], [0, "a", 43, "Ch 120 · Aging and Geriatric Urology", "2 · Clinical evaluation", "<ol>\n<li>Screen for frailty before elective major surgery (Society for Perioperative Assessment and Quality Improvement, SPAQI).</li>\n<li>If the screen is positive, do a diagnostic frailty assessment.</li>\n<li>Then do a comprehensive geriatric assessment (CGA).</li>\n</ol>"], [0, "r", 44, "Ch 120 · Aging and Geriatric Urology", "3 · Geriatric syndromes", "Cut-off · Continuous · <span class=\"key\">≥3 frail; 1–2 pre-frail</span>"], [0, "p", 44, "Ch 120 · Aging and Geriatric Urology", "3 · Geriatric syndromes", "Four recurring mechanisms: anticholinergic burden, renal threshold (CrCl &lt;30), warfarin potentiation, sodium disturbance."], [0, "l", 45, "Ch 120 · Aging and Geriatric Urology", "4 · Incontinence management", "UI affects three-quarters of long-stay residents and drives admission. Catheter colonisation is <span class=\"key\">98%</span>, so treating asymptomatic bacteriuria (ASB) causes harm."], [0, "p", 45, "Ch 120 · Aging and Geriatric Urology", "4 · Incontinence management", "A positive culture alone never qualifies; catheterised residents cannot report local symptoms, so systemic signs are used."], [0, "l", 45, "Ch 120 · Aging and Geriatric Urology", "6 · Cancer, end of life", "<b>Prostate</b>: USPSTF grade D, so no prostate-specific antigen (PSA) screening &gt;70. With life expectancy <span class=\"key\">&lt;10 years</span>, plan non-curative care."], [0, "p", 46, "Ch 120 · Aging and Geriatric Urology", "6 · Cancer, end of life", "Undertreatment by age (skipped restaging, withheld cystectomy) is as real a risk as overtreatment. Fitness and life expectancy decide."], [0, "r", 47, "Ch 126 · Management and Considerations in Transgender and Nonbinary Individuals", "2 · Diagnosis and assessment", "Criteria · Marked incongruence for ≥<span class=\"key\">6 months</span>, significant distress or impairment, not solely due to prejudice · Marked, persistent incongruence; desire for characteristics/treatment of experienced gender"], [0, "p", 48, "Ch 126 · Management and Considerations in Transgender and Nonbinary Individuals", "2 · Diagnosis and assessment", "SOC-8 replaces gatekeeping with informed, capacity-based consent; capacity and fertility counselling stay firm because consequences are irreversible."], [0, "p", 48, "Ch 126 · Management and Considerations in Transgender and Nonbinary Individuals", "3 · Gender-affirming hormone therapy (GAHT)", "<b>Why the asymmetry?</b> Physiological oestrogen alone does not suppress testosterone to the female range, so transfeminine therapy needs two components. Testosterone suppresses the ovarian axis on its own, so transmasculine therapy needs one."], [0, "l", 48, "Ch 126 · Management and Considerations in Transgender and Nonbinary Individuals", "3 · Gender-affirming hormone therapy (GAHT)", "<b>Ethinyl oestradiol is not recommended</b> (~20-fold thrombosis; cannot be measured). Use oral 17β-oestradiol, target <span class=\"key\">100–200 pg/mL</span>. <b>Use transdermal if there is venous thromboembolism (VTE) risk</b>: age &gt;45 or previous VTE."], [0, "l", 49, "Ch 126 · Management and Considerations in Transgender and Nonbinary Individuals", "3 · Gender-affirming hormone therapy (GAHT)", "Monitor levels 3-monthly in year 1, then 1–2 times a year. Target testosterone <span class=\"key\">&lt;50 ng/dL</span>. Check electrolytes/creatinine on spironolactone, and prolactin; stop smoking."], [0, "l", 49, "Ch 126 · Management and Considerations in Transgender and Nonbinary Individuals", "3 · Gender-affirming hormone therapy (GAHT)", "<b>After gonadectomy, reduce oestrogen by <span class=\"key\">50–75%</span></b> (titrate to luteinising hormone [LH], follicle-stimulating hormone [FSH] and bone density) and <b>stop the antiandrogen</b>."], [0, "l", 49, "Ch 126 · Management and Considerations in Transgender and Nonbinary Individuals", "3 · Gender-affirming hormone therapy (GAHT)", "Target testosterone <span class=\"key\">300–1000 ng/dL</span>. Persistent menses: progestin or endometrial ablation."], [0, "r", 50, "Ch 126 · Management and Considerations in Transgender and Nonbinary Individuals", "5 · Fertility preservation", "Standard · <b>Sperm cryopreservation</b>; hold GAHT for ≥<span class=\"key\">3 months</span> before collection · <b>Oocyte or embryo cryopreservation</b> after ovarian stimulation"], [0, "l", 50, "Ch 126 · Management and Considerations in Transgender and Nonbinary Individuals", "6 · Cancer screening — screen the organ, not the gender", "<b>Prostate (transfeminine)</b>: rare but may be aggressive (GAHT begun after 50). Shared decision-making on prostate-specific antigen (PSA) at 55–69. <b>On GAHT, the upper limit is <span class=\"key\">1 ng/mL</span>, or a rise of ≥<span class=\"key\">0.3 ng/mL</span> from nadir</b>, <span class=\"dag\">†</span>because androgen suppression lowers PSA. After full-depth vaginoplasty, feel the prostate through the <b>anterior neovaginal wall</b>. Biopsy is transrectal, perineal or transneovaginal."], [0, "r", 51, "Ch 127 · Male-to-Female Gender-Affirming Surgery: Vaginoplasty", "1 · Aim and preparation", "Hormones before gonadectomy · <span class=\"key\">6 months</span> suffices (experience testosterone blockade before irreversible change)"], [0, "p", 51, "Ch 127 · Male-to-Female Gender-Affirming Surgery: Vaginoplasty", "1 · Aim and preparation", "SOC8 replaces thresholds to clear with information to receive; capacity and fertility counselling stay mandatory."], [0, "l", 51, "Ch 127 · Male-to-Female Gender-Affirming Surgery: Vaginoplasty", "1 · Aim and preparation", "Stay within <span class=\"key\">1 hour's drive</span> of hospital for the first <span class=\"key\">3 weeks</span>; record affirmed name and gender; confirm support for dilation."], [0, "l", 51, "Ch 127 · Male-to-Female Gender-Affirming Surgery: Vaginoplasty", "1 · Aim and preparation", "<b>Body mass index (BMI)</b> mainly determines wound healing; no cut-off is proven, many require <span class=\"key\">≤35 kg/m²</span>; a higher BMI may suit vulvoplasty."], [0, "p", 52, "Ch 127 · Male-to-Female Gender-Affirming Surgery: Vaginoplasty", "1 · Aim and preparation", "Plan every orchiectomy as though vaginoplasty will follow: use a midline scrotal incision and leave peri-cord fat for labial bulk."], [0, "a", 52, "Ch 127 · Male-to-Female Gender-Affirming Surgery: Vaginoplasty", "2 · Penile inversion vaginoplasty (PIV)", "<ol>\n<li>Foley and drain; mark adductor longus tendons (clitoral level) and dorsal midline (prevents torsion).</li>\n<li>Harvest scrotal graft and small posterior rhomboid flap (relieves introital tension); defat, tubularise.</li>\n<li>Orchiectomy, leaving cord fat; penile disassembly; corporal excision and clitoroplasty.</li>\n<li>Urethroplasty, then canal dissection; line canal, labiaplasty, pack.</li>\n</ol>"], [0, "l", 52, "Ch 127 · Male-to-Female Gender-Affirming Surgery: Vaginoplasty", "2 · Penile inversion vaginoplasty (PIV)", "Keep the labia majora incision <span class=\"key\">≥1 cm</span> from the groin crease (dehiscence). Finish with an antibiotic pack and negative-pressure dressing."], [0, "l", 52, "Ch 127 · Male-to-Female Gender-Affirming Surgery: Vaginoplasty", "3 · Abdominoperineal and intestinal options", "<b>Peritoneal (Davydov-type)</b>: the proximal canal is made robotically, and rectal injury fell from <span class=\"key\">~7%</span> historically to ~2.3% (urethral 1.1%). The <b>rectum may mimic seminal vesicles</b>; enter between the Denonvilliers leaflets."], [0, "p", 53, "Ch 127 · Male-to-Female Gender-Affirming Surgery: Vaginoplasty", "3 · Abdominoperineal and intestinal options", "Lining ladder: penile and scrotal skin first, then peritoneum, then bowel. Each adds depth and lubrication but imports donor pathology; none removes the duty to dilate."], [0, "r", 53, "Ch 127 · Male-to-Female Gender-Affirming Surgery: Vaginoplasty", "4 · Complications", "<b>Rectovaginal fistula</b> (most devastating) · <span class=\"key\">0.8%</span> primary, 6.3% revision · Intra-op: watertight closure and bulbospongiosus flap, with or without diversion. Fistula: stop dilating, let canal stenose, revise later, <b>or</b> delay closure"], [0, "p", 53, "Ch 127 · Male-to-Female Gender-Affirming Surgery: Vaginoplasty", "4 · Complications", "Three failure modes: violated plane (fistulas), tissue not excised (bulge, engorgement), graft not taken or maintained (dehiscence, stenosis, prolapse). Only the last depends on the patient — dilation is part of the operation."], [0, "l", 53, "Ch 127 · Male-to-Female Gender-Affirming Surgery: Vaginoplasty", "5 · Outcomes and follow-up", "Stay is ~<span class=\"key\">5 days</span>; on <b>day 5 pack and catheter come out</b> and dilation is taught. Retention: recatheterise for 1 week."], [0, "p", 54, "Ch 127 · Male-to-Female Gender-Affirming Surgery: Vaginoplasty", "5 · Outcomes and follow-up", "The body treats the canal as a defect to close, so stenosis is a lifelong risk. Any narrowing means more dilation, contacting the surgeon and physiotherapy."], [0, "l", 55, "Ch 128 · Special Urologic Considerations in Transmasculine Individuals", "2 · Preoperative care and consent", "WPATH Standards of Care 7 (SOC7) requires ≥<span class=\"key\">12 months</span> of testosterone before genital surgery (<span class=\"dag\">†</span>SOC8: 6 months) for <b>clitoral hypertrophy</b>, which plateaus at ≈2 years."], [0, "a", 56, "Ch 128 · Special Urologic Considerations in Transmasculine Individuals", "3 · Removal of female structures", "<ol>\n<li>Hydrodissect (dilute lidocaine); circumferential introital incision.</li>\n<li>Blunt rectovaginal plane; urethrovaginal plane <b>sharply, with no diathermy</b> (protects sphincter), then the bladder plane.</li>\n<li>If bladder injured: close, with or without cystoscopy.</li>\n<li>Free levators, control paravaginal plexus; approximate levators (prevents prolapse).</li>\n<li>Bulbospongiosus over urethra; layered closure.</li>\n</ol>"], [0, "r", 56, "Ch 128 · Special Urologic Considerations in Transmasculine Individuals", "4 · Genital reconstruction", "Phallus · Own clitoris, <span class=\"key\">3–8 cm</span> · Flap"], [0, "l", 56, "Ch 128 · Special Urologic Considerations in Transmasculine Individuals", "5 · Postoperative care and catheterisation", "Suprapubic (SPC) and neourethral catheters are placed; the neourethral one comes out at <span class=\"key\">14–21 days</span>. Clamp the SPC, recording PVR until voiding is normal."], [0, "a", 56, "Ch 128 · Special Urologic Considerations in Transmasculine Individuals", "5 · Postoperative care and catheterisation", "<ol>\n<li>One gentle Coudé attempt, then one stylet-guided attempt.</li>\n<li>If any difficulty, stop: flexible cystoscopy, guidewire, open-tip catheter.</li>\n<li>In an emergency, place a <b>suprapubic catheter</b>.</li>\n</ol>"], [0, "l", 57, "Ch 128 · Special Urologic Considerations in Transmasculine Individuals", "6 · Urethral complications", "<b>Fistula</b> is commonest at the phallic base. Keep diversion; small ones close. If persisting &gt;<span class=\"key\">3 months</span>, excise, close in layers with fat interposition, catheter 10–12 days."], [0, "l", 57, "Ch 128 · Special Urologic Considerations in Transmasculine Individuals", "6 · Urethral complications", "<b>Stricture</b> is commonest at the <b>fixed–phallic anastomosis</b>, also the meatus. A plateau uroflow prompts retrograde urethrography (RUG). Treat after <span class=\"key\">≥6 months</span>; retention needs SPC or perineal urethrostomy."], [0, "p", 57, "Ch 128 · Special Urologic Considerations in Transmasculine Individuals", "6 · Urethral complications", "The neourethra is skin in fat without spongiosum: fistulas and strictures cluster at poorly perfused flap ends, heal slowly and resist endoscopic cure."], [0, "l", 57, "Ch 128 · Special Urologic Considerations in Transmasculine Individuals", "7 · Prostheses", "Erectile prosthesis: ≥<span class=\"key\">1 year</span> after phalloplasty, with <b>protective sensation</b> and a stable urethra. One cylinder is anchored to pubic periosteum (no tunica); malleable is simpler."], [0, "a", 58, "★ Putting it together", "A · Newborn with atypical genitalia", "<ol>\n<li><b>Emergency is adrenal:</b> congenital adrenal hyperplasia (CAH) is commonest (half of all; 90% of 46,XX). Salt wasting (low Na, high K, shock) appears at day 5–7 (<span class=\"xref\">see Ch 59</span>).</li>\n<li><b>Tests:</b> karyotype (SRY), 17-hydroxyprogesterone after 36 h, electrolytes, pelvic ultrasound for uterus.</li>\n<li><b>Team:</b> <span class=\"dag\">†</span>defer sex assignment until multidisciplinary team evaluation.</li>\n<li><b>Gonads:</b> if dysgenetic with Y (e.g. complete gonadal dysgenesis, 30–45% tumour risk), then prophylactic gonadectomy.</li>\n</ol>"], [0, "p", 58, "★ Putting it together", "B · Urogenital sinus and cloaca", "True urethral length (bladder neck to confluence) outweighs common-channel length. Low confluence needs a flap; high needs pull-through or total or partial urogenital mobilisation. Clitoroplasty only for Prader III–IV, sparing the dorsal bundle. Cloaca: colostomy, decompress hydrocolpos, cloacogram or MRI with endoscopy, then posterior sagittal repair; seek VACTERL and tethered cord (<span class=\"xref\">see Ch 60</span>)."], [0, "a", 59, "★ Putting it together", "D · Immunotherapy and hereditary cancer", "<ol>\n<li><b>Checkpoints:</b> tumour interferon-γ induces programmed death ligand-1 (PD-L1), silencing PD-1-positive T cells; CTLA-4 inhibitors act earlier, at priming. <span class=\"dag\">†</span>Immune-related adverse events (colitis, hepatitis, pneumonitis, endocrinopathy): if grade ≥2, hold drug, give steroids; endocrinopathies need lifelong replacement (<span class=\"xref\">see Ch 24</span>).</li>\n<li><b>Hereditary:</b> von Hippel–Lindau (VHL; clear cell; belzutifan), hereditary leiomyomatosis and renal cell cancer (fumarate hydratase; aggressive papillary), Birt–Hogg–Dubé (FLCN; hybrid oncocytic), Lynch (mismatch repair; upper-tract urothelial cancer).</li>\n<li>BRCA or homologous-repair-deficient prostate cancer: PARP inhibitor. FGFR-altered urothelial cancer: erdafitinib (<span class=\"xref\">see Ch 25</span>).</li>\n</ol>"], [0, "p", 59, "★ Putting it together", "E · Older patient before surgery", "Function, not age, predicts outcome. Screen frailty, then comprehensive geriatric assessment: cognition, delirium, nutrition, falls, polypharmacy. Avoid anticholinergic burden (β3-agonist for overactive bladder). New incontinence: transient causes first (<span class=\"dag\">†</span>DIAPPERS) (<span class=\"xref\">see Ch 120</span>)."], [0, "a", 59, "★ Putting it together", "F · Transgender and nonbinary patients", "<ol>\n<li>Organ inventory guides screening: retained prostate after vaginoplasty (via anterior neovaginal wall; <span class=\"dag\">†</span>PSA is lower on oestrogen), retained cervix on testosterone (<span class=\"xref\">see Ch 126</span>).</li>\n<li>Vaginoplasty: stenosis, rectovaginal fistula (most devastating), urethrovaginal fistula (<span class=\"xref\">see Ch 127</span>).</li>\n<li>Phalloplasty: fistula and stricture; without vaginectomy, more fistula (<span class=\"xref\">see Ch 128</span>).</li>\n</ol>"], [1, "l", 2, "Ch 26 · Infections of the Urinary Tract", "1 · Definitions and classification", "<b>Complicating factors</b> are an anatomical or functional abnormality (benign prostatic hyperplasia [BPH], diverticula, ureteric obstruction, neurogenic bladder [NGB], bladder outlet obstruction [BOO], concentrating defects), <b>male sex</b>, pregnancy, old age, diabetes mellitus (DM), immunosuppression, childhood UTI, recent antibiotics, catheter, instrumentation, hospital acquisition and symptoms &gt;7 days. <span class=\"tag\">MCQ</span> Male sex alone makes a UTI complicated."], [1, "r", 2, "Ch 26 · Infections of the Urinary Tract", "1 · Definitions and classification", "Reinfection · New inoculation (~<span class=\"key\">70%</span> of recurrences, often different organism) · Cleared, then new event"], [1, "l", 3, "Ch 26 · Infections of the Urinary Tract", "1 · Definitions and classification", "<b>Catheter-associated UTI (CAUTI)</b> is the commonest cause of secondary bacteraemia and accounts for ~<span class=\"key\">80%</span> of nosocomial UTIs."], [1, "l", 3, "Ch 26 · Infections of the Urinary Tract", "2 · Pathogenesis", "<b><i>E. coli</i></b> causes ~<span class=\"key\">85%</span> of community and ~50% of hospital UTIs. Its share falls from ~¾ in uncomplicated cystitis to &lt;½ in complicated UTI and urosepsis."], [1, "l", 3, "Ch 26 · Infections of the Urinary Tract", "2 · Pathogenesis", "<span class=\"tag\">MCQ</span> <i>Enterococcus</i> is a Gram-positive coccus, not an Enterobacteriaceae."], [1, "r", 4, "Ch 26 · Infections of the Urinary Tract", "2 · Pathogenesis", "Tropism · Bladder, causing cystitis · Kidney, causing <b>pyelonephritis</b> (~<span class=\"key\">90%</span> of pyelonephritis strains)"], [1, "a", 4, "Ch 26 · Infections of the Urinary Tract", "2 · Pathogenesis", "<ol>\n<li>FimH binds uroplakin and the bacterium invades the umbrella cell (15 min–1 h).</li>\n<li>It multiplies into an <b>intracellular bacterial community (IBC)</b>, which behaves like a biofilm (4–16 h).</li>\n<li>Bacteria filament, escape and reinvade neighbouring cells (16–24 h).</li>\n<li>Infected cells exfoliate, exposing deeper layers.</li>\n<li><b>Quiescent intracellular reservoirs (QIRs)</b> form (from ~2 weeks).</li>\n</ol>"], [1, "l", 5, "Ch 26 · Infections of the Urinary Tract", "3 · Evaluation and diagnosis", "Dysuria with frequency and no vaginal discharge gives a ~<span class=\"key\">90%</span> probability of UTI; haematuria with a positive nitrite gives ≥90%. Dysuria is the best single symptom."], [1, "l", 5, "Ch 26 · Infections of the Urinary Tract", "3 · Evaluation and diagnosis", "On microscopy, pyuria is ≥<span class=\"key\">5–10 WBC/high-power field (HPF)</span>, and squamous cells mean contamination. No pyuria: question the diagnosis. Positive culture without pyuria: repeat on a catheter sample."], [1, "r", 5, "Ch 26 · Infections of the Urinary Tract", "3 · Evaluation and diagnosis", "≥<span class=\"key\">10² CFU/mL</span> of a known pathogen · Symptomatic women with cystitis; catheter specimens"], [1, "r", 7, "Ch 26 · Infections of the Urinary Tract", "4 · Antimicrobial principles", "Nitrofurantoin · Acts in urine only, so it is useless for pyelonephritis, prostatitis and bacteraemia. Spares bowel flora. Toxicity: pulmonary fibrosis, neuropathy, haemolysis in glucose-6-phosphate dehydrogenase (G6PD) deficiency. Beers 2015: avoid if creatinine clearance (CrCl) &lt;<span class=\"key\">30 mL/min</span> (older advice 50–60); no long-term suppression in the elderly."], [1, "p", 8, "Ch 26 · Infections of the Urinary Tract", "4 · Antimicrobial principles", "Narrow, urine-confined, flora-sparing agents (nitrofurantoin, fosfomycin, pivmecillinam) lead in cystitis; broad tissue-penetrating agents (quinolones, cephalosporins, carbapenems) are kept for invasive infection. Resistance is made in the bowel, so breadth, duration and repetition matter more than MIC."], [1, "r", 8, "Ch 26 · Infections of the Urinary Tract", "5 · Asymptomatic bacteriuria", "Either sex · One catheterised · ≥<span class=\"key\">10²</span> CFU/mL"], [1, "p", 9, "Ch 26 · Infections of the Urinary Tract", "5 · Asymptomatic bacteriuria", "ASB is treated only where bacteria are about to reach blood or tissue: pregnancy (hydroureter leading to pyelonephritis) and mucosa-breaching urological surgery. Elsewhere the resident strain is harmless or protective."], [1, "r", 9, "Ch 26 · Infections of the Urinary Tract", "6 · Cystitis", "First-line · <b>Nitrofurantoin</b> 100 mg twice daily × <span class=\"key\">5 d</span> · Not if pyelonephritis suspected"], [1, "r", 9, "Ch 26 · Infections of the Urinary Tract", "6 · Cystitis", "First-line · <b>TMP-SMX</b> 160/800 mg twice daily × <span class=\"key\">3 d</span> · Avoid if local resistance &gt;<span class=\"key\">20%</span> or used in past 3 months"], [1, "l", 10, "Ch 26 · Infections of the Urinary Tract", "6 · Cystitis", "~<span class=\"key\">90%</span> settle medically with broad Gram-negative cover, catheter drainage and glucose control; cystectomy or debridement is rarely needed."], [1, "a", 11, "Ch 26 · Infections of the Urinary Tract", "7 · Recurrent UTI", "<ol>\n<li>Confirm recurrent UTI with symptoms and culture.</li>\n<li>If the same organism returns at short intervals, then evaluate for persistence (upper tract imaging and cystoscopy) and remove the nidus.</li>\n<li>If it is reinfection, then start behavioural measures: ≥1.5 L water a day, frequent and postcoital voiding, stop spermicide.</li>\n<li>Add cranberry ≥36 mg proanthocyanidin (PAC).</li>\n<li>If UTIs follow intercourse, then give a <b>postcoital antibiotic</b>. If postmenopausal, then give <b>vaginal oestrogen</b>. If neither, then consider <b>methenamine hippurate</b> (normal renal function).</li>\n<li>Use continuous antibiotic prophylaxis last.</li>\n</ol>"], [1, "p", 12, "Ch 26 · Infections of the Urinary Tract", "7 · Recurrent UTI", "Recurrent UTI in women is reinfection in a receptive host, not a hidden focus. Investigate only for features of persistence or complication; prevention targets flora, pH, adhesion and washout rather than repeatedly sterilising urine."], [1, "r", 12, "Ch 26 · Infections of the Urinary Tract", "8 · Kidney infections", "Outpatient, no vomiting · Ciprofloxacin 500 mg twice daily if community quinolone resistance ≤<span class=\"key\">10%</span>; levofloxacin 750 mg daily; TMP-SMX double-strength twice daily only if known sensitive. With or without one IV dose of ceftriaxone 1 g or an aminoglycoside. · Cipro 7; levo 5; TMP-SMX 14"], [1, "a", 12, "Ch 26 · Infections of the Urinary Tract", "8 · Kidney infections", "<ol>\n<li>If there is no sepsis or vomiting, then send a culture, with or without US, and treat as an outpatient with oral drugs for 7–10 d.</li>\n<li>If there is sepsis, then take blood and urine cultures, image, and admit for IV treatment.</li>\n<li>If improved by <b>72 h</b>, then step down to oral treatment.</li>\n<li>If not improved, then repeat cultures and get a <b>CT</b>, and drain any obstruction or abscess.</li>\n</ol>"], [1, "p", 13, "Ch 26 · Infections of the Urinary Tract", "8 · Kidney infections", "Urine sterilises within hours but fever may lag for days. Fever beyond 72 h means obstruction or an undrained collection until CT proves otherwise. Antibiotics treat the infection; drainage treats the complication."], [1, "p", 13, "Ch 26 · Infections of the Urinary Tract", "8 · Kidney infections", "Fluid is a good sign and streaky gas a bad one: a contained collection can be drained; diffuse gas without fluid means parenchyma is necrosing faster than the host can wall it off."], [1, "l", 14, "Ch 26 · Infections of the Urinary Tract", "8 · Kidney infections", "A renal abscess ≤<span class=\"key\">3 cm</span> is treated with antibiotics; one &gt;<span class=\"key\">5 cm</span> needs percutaneous drainage; drain any size if the patient is immunocompromised or not responding. Aspirate if you cannot tell an abscess from a cystic tumour."], [1, "p", 14, "Ch 26 · Infections of the Urinary Tract", "8 · Kidney infections", "Across renal infections the axis is diffuse inflammation versus contained collection. Pyelonephritis and AFBN need antibiotics; pyonephrosis and large or obstructed abscesses need drainage; when the kidney itself is the infected tissue (XGP, diffuse EPN), the answer is nephrectomy."], [1, "l", 14, "Ch 26 · Infections of the Urinary Tract", "9 · Fournier gangrene and periurethral abscess", "<b>Fournier gangrene</b> is necrotising fasciitis of the genitalia, perineum or perianal region. A source is found in ~<span class=\"key\">95%</span>; patients are usually aged 50–79, and the male:female ratio is ~10:1."], [1, "r", 15, "Ch 26 · Infections of the Urinary Tract", "9 · Fournier gangrene and periurethral abscess", "<b>Laboratory Risk Indicator for Necrotising Fasciitis (LRINEC)</b> · CRP, WBC, haemoglobin, sodium, creatinine, glucose · ≥<span class=\"key\">6</span> suspicious; ≥<span class=\"key\">8</span> strongly predictive"], [1, "a", 15, "Ch 26 · Infections of the Urinary Tract", "9 · Fournier gangrene and periurethral abscess", "<ol>\n<li>On suspicion, resuscitate and start broad IV antibiotics (piperacillin–tazobactam; or a carbapenem or vancomycin with clindamycin or metronidazole).</li>\n<li>Perform <b>immediate radical debridement</b> back to bleeding fascia and leave the wound open.</li>\n<li>Take the patient back for a <b>re-look at 24–48 h</b>.</li>\n<li>If the source is urethral, then add suprapubic diversion; if rectal, then a colostomy.</li>\n<li>Consider hyperbaric oxygen as an adjunct, then reconstruct.</li>\n</ol>"], [1, "r", 15, "Ch 26 · Infections of the Urinary Tract", "10 · Urosepsis †", "Sepsis · Organ dysfunction from a dysregulated response to infection: rise in Sequential Organ Failure Assessment (SOFA) score ≥<span class=\"key\">2</span>"], [1, "a", 16, "Ch 26 · Infections of the Urinary Tract", "10 · Urosepsis †", "<ol>\n<li>Hour-1 bundle: measure lactate and take blood and urine cultures.</li>\n<li>Give a broad IV antibiotic within 1 h.</li>\n<li>If hypotensive or lactate ≥4, then give 30 mL/kg crystalloid.</li>\n<li>If still hypotensive, then start noradrenaline for MAP ≥65.</li>\n<li>Achieve <b>source control</b>: decompress with a stent or nephrostomy; no definitive stone surgery now.</li>\n<li>De-escalate antibiotics by culture.</li>\n</ol>"], [1, "l", 16, "Ch 26 · Infections of the Urinary Tract", "11 · Special populations", "GFR rises by 30–50%, so creatinine falls from 0.7 to <span class=\"key\">0.5 mg/dL</span>; a \"normal\" 0.8–0.9 may mean impairment. Proteinuria is abnormal above 300 mg/24 h. The kidney grows by 1 cm."], [1, "l", 17, "Ch 26 · Infections of the Urinary Tract", "11 · Special populations", "A catheter for &gt;<span class=\"key\">10 years</span> raises the risk of bladder cancer (often squamous <span class=\"dag\">†</span>), so these patients need surveillance."], [1, "l", 17, "Ch 26 · Infections of the Urinary Tract", "11 · Special populations", "After transplant, do not screen for ASB beyond 1–2 months. Treat uncomplicated UTI for 5–10 days (not 3) and pyelonephritis for 14–21 days. Stents raise UTI by ~half, so remove them within <span class=\"key\">4 weeks</span>. Recurrent UTI needs PVR, imaging, VCUG and UDS."], [1, "r", 17, "Ch 26 · Infections of the Urinary Tract", "13 · Perioperative antimicrobial prophylaxis", "Timing · Within <span class=\"key\">60 min</span> of incision; vancomycin and quinolones within 120 min"], [1, "r", 18, "Ch 26 · Infections of the Urinary Tract", "13 · Perioperative antimicrobial prophylaxis", "Duration · <b>Single dose</b>; ≤<span class=\"key\">24 h</span> only for PCNL, prostheses, special cases"], [1, "p", 19, "Ch 26 · Infections of the Urinary Tract", "13 · Perioperative antimicrobial prophylaxis", "Prophylaxis is justified by wound contamination × host vulnerability. Where neither is raised (diagnostic cystoscopy, sterile-urine SWL, index UDS), ecological cost outweighs benefit; otherwise give one well-timed, flora-matched dose. Anything longer is treatment."], [1, "l", 21, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "1 · Prostatitis: definitions and classification", "<b>Drach (1978)</b>, built on <b>Meares–Stamey (1968)</b> segmented cultures, had four types: acute bacterial, chronic bacterial, nonbacterial, prostatodynia. <span class=\"tag\">MCQ</span> National Institutes of Health (<b>NIH, 1999</b>) replaced it."], [1, "l", 21, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "1 · Prostatitis: definitions and classification", "I and II are <span class=\"key\">5–10%</span>; III is <span class=\"key\">90–95%</span>. <b>IIIA vs IIIB has no clinical significance</b>; VB3/EPS leucocyte microscopy is no longer advised. The prostate may not be the pain source, hence \"CPPS\"."], [1, "l", 21, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "1 · Prostatitis: definitions and classification", "<b>Category III (NIH Chronic Prostatitis Collaborative Research Network [CPCRN])</b> needs pelvic pain for <span class=\"key\">≥3 of the previous 6 months</span>, excluding uropathogens, urogenital cancer, prior radiation/chemotherapy, stricture and neurological bladder disease. The Multidisciplinary Approach to Pelvic Pain (MAPP) term is urologic chronic pelvic pain syndrome."], [1, "l", 21, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "1 · Prostatitis: definitions and classification", "Histological inflammation is near-universal (<span class=\"key\">&gt;70%</span> at autopsy), so it cannot define disease."], [1, "p", 22, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "2 · Category I: acute bacterial prostatitis", "<b>Why young healthy men get ABP:</b> the organism, not the host — virulent uropathogenic <i>E. coli</i> (UPEC) that forms <b>biofilm</b> more often than cystitis/pyelonephritis strains; biofilm blocks antibiotics, so prostatic infection needs longer, well-penetrating therapy."], [1, "l", 22, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "2 · Category I: acute bacterial prostatitis", "In febrile male UTI, <span class=\"key\">&gt;90%</span> show raised PSA or prostate volume, so the prostate is usually involved."], [1, "l", 22, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "2 · Category I: acute bacterial prostatitis", "<b>No PSA</b> acutely; if raised, follow to normal (up to <span class=\"key\">6 months</span>). Use transrectal ultrasound (TRUS) or computed tomography (CT) only for suspected abscess; <b>no biopsy</b>."], [1, "l", 22, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "2 · Category I: acute bacterial prostatitis", "Systemic illness, European Association of Urology (<b>EAU</b>): amoxicillin or a 2nd-generation cephalosporin with an aminoglycoside, or a 3rd-generation cephalosporin. Ciprofloxacin only if local resistance <span class=\"key\">&lt;10%</span> and fully oral outpatient care, or β-lactam anaphylaxis."], [1, "l", 22, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "2 · Category I: acute bacterial prostatitis", "<b>Duration</b>: traditionally 4 weeks, but <span class=\"key\">2 weeks</span> ciprofloxacin is equivalent; TB prostatitis ≥<span class=\"key\">6 months</span>. Non-steroidal anti-inflammatory drugs (NSAIDs) and α-blockers are useful adjuncts."], [1, "a", 23, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "2 · Category I: acute bacterial prostatitis", "<ol>\n<li>If the abscess is &lt;1–2 cm, then treat with antibiotics.</li>\n<li>If it progresses and lies peripherally, then perform US-guided percutaneous drainage (recurrence 15–33%).</li>\n<li>If it is large or drainage fails, then perform <b>transurethral unroofing</b>, using intra-operative US to locate it.</li>\n<li>If it extends outside the prostate, then drain it openly (rare).</li>\n</ol>"], [1, "r", 23, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "3 · Category II: chronic bacterial prostatitis", "<b>2-glass pre/post-massage</b> (current) · Midstream pre-massage and first 10 mL post-massage · Predicts 4-glass in <span class=\"key\">&gt;95%</span>"], [1, "l", 23, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "3 · Category II: chronic bacterial prostatitis", "A DRE nodule needs cancer work-up. Recheck haematuria 4–6 weeks after clearance. PVR <span class=\"key\">&gt;180 mL</span> raises infection risk."], [1, "l", 23, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "3 · Category II: chronic bacterial prostatitis", "Men <span class=\"key\">&lt;45</span> with a first UTI have normal imaging, but check for <b>stricture</b> (up to 41%). Image for diabetes, stones, voiding or neurological problems, poor response or haematuria."], [1, "p", 23, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "3 · Category II: chronic bacterial prostatitis", "<b>Why fluoroquinolones?</b> Prostatic entry is passive (lipid solubility, ionisation, protein binding, size). FQs are lipid-soluble <b>zwitterions</b> that concentrate in alkaline CBP fluid and cover Gram-negatives including <i>Pseudomonas</i>, Gram-positives and atypicals. Tetracyclines, macrolides and trimethoprim also penetrate."], [1, "r", 23, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "3 · Category II: chronic bacterial prostatitis", "First line · FQ (ciprofloxacin = levofloxacin) <span class=\"key\">4–6 weeks</span>"], [1, "r", 23, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "3 · Category II: chronic bacterial prostatitis", "FQ-resistant, TMP-SMX-sensitive · TMP-SMX <span class=\"key\">3 months</span> (cure 30–50% vs 60–80% with FQ)"], [1, "r", 24, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "4 · CP/CPPS — aetiology", "Pelvic floor · Tenderness and <b>failure to relax</b>; tender in <span class=\"key\">81%</span>"], [1, "l", 24, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "5 · CP/CPPS — clinical features and evaluation", "The <b>NIH Chronic Prostatitis Symptom Index (NIH-CPSI)</b> <span class=\"dag\">†</span> scores 0–43 (pain 0–21, urinary 0–10, quality of life [QOL] 0–12). A <span class=\"key\">≥6 points</span> fall is meaningful. It lacks bladder items, which the Genitourinary Pain Index (<b>GUPI</b>) adds."], [1, "p", 25, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "6 · CP/CPPS — treatment", "<b>Governing fact:</b> no monotherapy has a positive definitive trial — each tested one agent in an unphenotyped population. Start conservative, then give <b>simultaneous, phenotype-directed multimodal therapy</b> with a multidisciplinary team."], [1, "r", 25, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "6 · CP/CPPS — treatment", "<b>Antibiotics</b> · Ciprofloxacin/levofloxacin trials negative; benefit may be anti-inflammatory (lowered IL-6, tumour necrosis factor-α [TNF-α]) or VB3-only bacteria. EAU: quinolone or tetracycline ≥<span class=\"key\">6 weeks</span> only if <b>treatment-naive and &lt;1 year</b>. <b>No repeated courses without a positive culture</b>."], [1, "l", 26, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "8 · Acute epididymitis", "Epididymal pain and swelling for <span class=\"key\">&lt;6 weeks</span>; infection is <b>ascending</b> (~80% urine concordance)."], [1, "r", 26, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "8 · Acute epididymitis", "Chlamydia/gonorrhoea · Ceftriaxone <span class=\"key\">500 mg IM</span> (intramuscular) single dose (1 g if ≥150 kg) and doxycycline 100 mg twice daily <span class=\"key\">10 days</span>"], [1, "l", 27, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "9 · Chronic orchitis and epididymitis", "<b>Chronic epididymitis</b> (≥<span class=\"key\">3 months</span>) has a <b>Nickel classification</b>: inflammatory (infective, post-infective, TB, <b>amiodarone</b>, idiopathic), obstructive (congenital, post-infective, post-vasectomy) and epididymalgia (normal epididymis). Culture, US, reassurance."], [1, "l", 27, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "9 · Chronic orchitis and epididymitis", "<b>TB epididymitis</b> is the commonest genital site (sole site in 45%): painless swelling, <b>sinus</b>. Four drugs ≥<span class=\"key\">6 months</span>; surgery <b>only on anti-TB drugs</b>. <b>A mass not shrinking after 3 weeks needs inguinal exploration</b>."], [1, "l", 27, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "10 · Chronic scrotal content pain (CSCP)", "Peak 20–30 y. Post-procedural: <b>inguinal hernia repair</b> (commonest; mesh/recurrent), vasectomy (~<span class=\"key\">1 in 1000</span>, consent figure), scrotal surgery. Others: varicocele, hydrocele, intermittent torsion, referred pain (ureteric stone, disc, aneurysm). Idiopathic 18–25%."], [1, "l", 27, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "10 · Chronic scrotal content pain (CSCP)", "A <b>spermatic cord block</b> uses <span class=\"key\">20 mL 0.25% bupivacaine</span> at the <b>pubic tubercle</b>. <b>&gt;50% relief</b> predicts success of microsurgical denervation of the spermatic cord (MDSC)."], [1, "a", 27, "Ch 27 · Inflammatory and Pain Conditions of the Lower Genitourinary Tract: Prostatitis, Orchitis, Epididymitis and Scrotal Pain", "10 · Chronic scrotal content pain (CSCP)", "<ol>\n<li>If there is an identifiable lesion, then do directed surgery (hydrocelectomy, spermatocelectomy, orchidopexy, <b>microsurgical varicocelectomy</b>).</li>\n<li>If the pain followed vasectomy, then offer <b>vasectomy reversal</b> (82–93%; wait ≥3 months).</li>\n<li>If there is no lesion and the block is positive, then perform <b>MDSC</b>.</li>\n<li>If the epididymis is focally affected, then perform epididymectomy.</li>\n<li>Last resort: <b>inguinal orchidectomy</b>.</li>\n</ol>"], [1, "l", 29, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "1 · Definition and nomenclature", "The <b>AUA</b> defines it as bladder-related pain, pressure or discomfort with lower urinary tract symptoms (LUTS) for <span class=\"key\">&gt;6 weeks</span>, with no infection or other cause. <span class=\"dag\">†</span> The European Society for the Study of Interstitial Cystitis (<b>ESSIC, 2008</b>) requires <span class=\"key\">&gt;6 months</span> and ≥1 urinary symptom; <b>type 3C</b> is classic HL disease (C = inflammatory infiltrate, detrusor mastocytosis, granulation tissue or fibrosis)."], [1, "l", 29, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "1 · Definition and nomenclature", "The National Institutes of Health/National Institute of Diabetes and Digestive and Kidney Diseases (<b>NIH/NIDDK, 1987</b>) criteria were for research; used clinically they missed <span class=\"key\">~60%</span>, so definitions were broadened."], [1, "l", 29, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "2 · Epidemiology (headline)", "RICE study: <span class=\"key\">3.3–7.9 million US women</span> and 2.1–4.6 million men have IC/BPS-type symptoms. Mean onset is 30–40 years."], [1, "l", 29, "Ch 28 · Interstitial Cystitis/Bladder Pain Syndrome and Related Disorders", "2 · Epidemiology (headline)", "Female:male is <span class=\"key\">5:1</span> in clinics but <b>2–3:1</b> in populations, so men are under-diagnosed. <b>Ask men labelled CP/CPPS about bladder pain</b>, and reconsider IC/BPS when CP/CPPS treatment fails."], [1, "l", 29, "Ch 28 · Interstitial Cystitis/Bla
