bleed suddenly: use pressure, clips, sutures."], [4, "r", 27, "Ch 116 · Retropubic Suspension Surgery for Incontinence in Females", "4 · Burch colposuspension", "Open (Pfannenstiel) · Cure <span class=\"key\">85–90% at 1 y, ≈70% at 5 y</span>"], [4, "p", 27, "Ch 116 · Retropubic Suspension Surgery for Incontinence in Females", "5 · Other retropubic procedures", "AUS in women is second-line for ISD (recurrent or neurogenic). Place it at the bladder neck, preferably <b>abdominally</b>; transvaginal placement raises infection and erosion."], [4, "l", 28, "Ch 116 · Retropubic Suspension Surgery for Incontinence in Females", "6 · Perioperative care", "For incomplete emptying, use clean intermittent catheterisation (CIC), preferred to suprapubic, until PVR is consistently <span class=\"key\">&lt;150 mL</span>."], [4, "l", 29, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "1 · How slings work — theories of continence", "Supporting integral theory, incontinent women have ≈<span class=\"key\">40% less collagen</span> in skin and round ligament <span class=\"tag\">MCQ</span>."], [4, "l", 30, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "2 · Preoperative assessment and patient selection", "Q-tip movement <span class=\"key\">&gt;30°</span> on straining defines hypermobility."], [4, "l", 30, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "2 · Preoperative assessment and patient selection", "An MUCP <span class=\"key\">&lt;20 cm H₂O</span> defines type 3 SUI, that is <b>ISD</b>. An abdominal or Valsalva leak point pressure (ALPP/VLPP) <span class=\"key\">&lt;60 cm H₂O</span> also means ISD; a value <span class=\"key\">&gt;90</span> means little or no ISD."], [4, "l", 31, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "4 · Pubovaginal sling", "Width <span class=\"key\">&lt;2 cm</span> compresses without a constricting band."], [4, "r", 31, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "4 · Pubovaginal sling", "Synthetic at bladder neck · Urethral perforation <span class=\"key\">15×</span> and vaginal exposure <span class=\"key\">14×</span> other materials (especially woven polyester) · <b>No longer used at bladder neck</b>"], [4, "p", 31, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "4 · Pubovaginal sling", "<b>Fibrosis paradox</b>: more fibrosis should mean better support, but the inflammation that drives it also degrades the sling and causes erosion. Autologous fascia remodels with minimal inflammation, which is the ideal balance."], [4, "a", 32, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "5 · Autologous PVS — operative procedure", "<ol>\n<li>Through a 6–7 cm Pfannenstiel incision, mark and excise a <b>2 × 8 cm</b> rectus graft.</li>\n<li>Close the fascia with No. 1 polydioxanone (PDS).</li>\n<li>Clean the graft, stitch No. 1 PDS to each end and keep it in saline.</li>\n</ol>"], [4, "l", 32, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "5 · Autologous PVS — operative procedure", "Keep a transverse incision <span class=\"key\">≥2 cm above the symphysis</span> for tension-free closure; if impossible (rare), bridge with mesh or biologic."], [4, "a", 32, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "5 · Autologous PVS — operative procedure", "<ol>\n<li>With the bladder empty, pass Stamey needles <b>from above</b>, on the back of the pubis, into the vaginal incision.</li>\n<li>Perform <b>cystoscopy (70° lens)</b>. If there is an injury, repass <b>more laterally</b> and re-scope after each pass.</li>\n<li>Confirm ureteric efflux, centre the graft and tag its ends above.</li>\n</ol>"], [4, "l", 32, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "5 · Autologous PVS — operative procedure", "<b>Tension:</b> tie the sutures over the rectus with <span class=\"key\">two fingerbreadths</span> of slack, deliberately <b>loose</b>. Tighter only if lifelong CIC is planned."], [4, "l", 32, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "5 · Autologous PVS — operative procedure", "Postoperatively: liberal fluids; pack and catheter out with a voiding trial on day 1; if it fails, Foley or CIC and retry within 5 days. No lifting &gt;10 lb and no intercourse for <span class=\"key\">6 weeks</span>."], [4, "p", 33, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "7 · PVS complications and management", "<b>The key diagnostic criterion is the temporal relationship</b> between surgery and symptoms, not a urodynamic number. Preoperative UDS does not predict obstruction (SISTEr)."], [4, "a", 33, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "7 · PVS complications and management", "<ol>\n<li>Most transient retention resolves within <b>10 days</b>: use catheter or CIC, timed voiding, PFMT, anticholinergic.</li>\n<li>Autologous obstruction often improves, so wait up to <span class=\"key\">3 months</span>.</li>\n<li>If retention is complete, act earlier: at <b>&lt;6 weeks</b>, loosen the sling under anaesthesia by downward urethral traction.</li>\n<li>If <b>&gt;6 weeks</b> or conservative care fails, then do sling incision or urethrolysis.</li>\n</ol>"], [4, "l", 34, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "7 · PVS complications and management", "Mortality is ≈<span class=\"key\">3 per 10,000</span> anti-incontinence procedures; harvest-site <b>incisional hernia</b> ≈1%."], [4, "p", 34, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "8 · Mid-urethral sling — mechanism and materials", "<b>Why does a loose tape work?</b> At rest it does not touch the urethra, so voiding is unobstructed. On coughing the mobile urethra descends onto the tape; the posterior wall is arrested, the urethra kinks and closes. A fixed urethra never meets the tape, and tightening the tape to compensate obstructs."], [4, "l", 34, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "8 · Mid-urethral sling — mechanism and materials", "The material is <b>type 1 (Amid) macroporous monofilament polypropylene</b> with pores <span class=\"key\">&gt;75 µm</span>, which admits macrophages and fibrovascular ingrowth. UraTape and ObTape (&lt;50 µm) had high exposure and were withdrawn."], [4, "a", 35, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "9 · MUS operative procedures", "<ol>\n<li>Infiltrate local; make two suprapubic stabs ≈2 cm from midline.</li>\n<li>Make a 1.5 cm midline vaginal incision 1.5 cm from the meatus.</li>\n<li>Make minimal lateral tunnels to the endopelvic fascia, <b>not perforating</b> it (unlike PVS).</li>\n<li>The catheter guide deflects the bladder to the opposite side.</li>\n<li>Pass the trocar through Retzius and rectus, <b>hugging the back of the pubis</b>; repeat on the other side.</li>\n<li>Perform cystoscopy.</li>\n<li>Tension loosely (clamp between tape and urethra), remove sheath, trim.</li>\n</ol>"], [4, "r", 35, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "9 · MUS operative procedures", "Bladder perforation · <span class=\"key\">4.5%</span> · <span class=\"key\">0.6%</span> · Rare"], [4, "p", 37, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "12 · MUS complications and management", "<b>Concurrent or staged sling at POP repair</b>. Concurrent: one operation and less SUI (≈39% falls to 8–19%), but more obstruction, storage symptoms and mesh events; tensioning is hard if SUI is only occult. Staged: avoids an unnecessary sling but commits a third to a second operation (usually within 12 months). Decide after testing for occult SUI with the prolapse reduced."], [4, "a", 37, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "12 · MUS complications and management", "<ol>\n<li>Retention or high PVR: CIC or catheter; most resolve within 2 weeks.</li>\n<li>If obstruction persists, perform a <b>transvaginal midline sling incision at 2–4 weeks</b>.</li>\n<li>Beyond 3 months the tape is fixed, so excise its lateral portion.</li>\n<li>Formal urethrolysis is rarely needed.</li>\n</ol>"], [4, "p", 37, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "12 · MUS complications and management", "<b>Why is the timing different from PVS?</b> Fascial obstruction often settles, so one waits up to 3 months. Mesh is fixed by ingrowth and rarely loosens; late release needs wider dissection and causes more recurrent SUI, so release within ≈4 weeks."], [4, "a", 38, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "14 · Assessing the failed or troublesome sling", "<ol>\n<li>Define the symptom: SUI, storage, voiding, or pain/discharge.</li>\n<li>Establish the <b>timeline</b> in relation to surgery.</li>\n<li>Examine for exposure, POP, urethral mobility and tenderness over the tape.</li>\n<li>Check PVR and urine culture, perform <b>cystoscopy</b>, and add UDS selectively.</li>\n<li>Tailor treatment to the cause.</li>\n</ol>"], [4, "p", 41, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "2 · Choice of procedure by compartment", "Only paravaginal repair and uterosacral suspension are done by both routes. McCall is vaginal; Halban (linear sutures) and Moschcowitz (purse-string, which may angulate the ureter) are abdominal."], [4, "a", 41, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "3 · Anterior compartment", "<ol>\n<li>In lithotomy, catheterise, hydrodissect and incise in the midline from apex to bladder neck.</li>\n<li>Dissect the epithelium off the pubocervical fascia laterally to the ATFP and reduce the bladder.</li>\n<li>Plicate with interrupted 2-0/3-0 delayed-absorbable sutures from bladder neck to apex.</li>\n<li>Trim judiciously and close; give intravenous (IV) dye, do <b>cystoscopy</b> and pack.</li>\n</ol>"], [4, "l", 41, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "3 · Anterior compartment", "Anterior repair is abandoned for stress urinary incontinence (SUI): American Urological Association (AUA) meta-analysis failure approached <span class=\"key\">40%</span>."], [4, "r", 41, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "3 · Anterior compartment", "De novo SUI · Rises with stage: stage 2 <span class=\"key\">41%</span>, early 3 <span class=\"key\">53%</span>, advanced 3–4 <span class=\"key\">66%</span>; point Ba predicts it"], [4, "p", 42, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "3 · Anterior compartment", "<b>Confirming ureteric efflux</b>: indigo carmine (blue, IV), fluorescein 10% (green, IV) or phenazopyridine (orange, oral). No efflux: ureteric catheter or retrograde study, or remove plication sutures. Under-hydration delays efflux, but never close without proving patency."], [4, "l", 42, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "3 · Anterior compartment", "Lateral recurrence is 2–8%, but central recurrence is ~<span class=\"key\">22%</span>, so these are independent failures. Abdominal is more durable."], [4, "p", 42, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "4 · Occult SUI and the concomitant sling", "<b>A sling also helps the prolapse</b>: distal anterior support makes the cystocele repair last. <b>Why not everyone?</b> In OPUS it caused more bladder perforation, UTI, bleeding and incomplete emptying, with unchanged pelvic floor scores. Weigh per patient."], [4, "a", 43, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "4 · Occult SUI and the concomitant sling", "<ol>\n<li>In advanced anterior POP, do a reduction stress test, with or without urodynamic studies (UDS).</li>\n<li>If SUI is symptomatic, occult or urodynamic, then offer a concomitant procedure.</li>\n<li>If she is continent and the test is negative, then weigh individual risk and benefit (OPUS calculator).</li>\n<li>The sling is <b>selective, not routine</b>.</li>\n</ol>"], [4, "a", 43, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "5 · Apical compartment", "<ol>\n<li>After vaginal hysterectomy, place cuff stays at 3 and 9 o'clock, excise the enterocele sac, pack bowel and palpate the spines.</li>\n<li>Place Allis clamps at 5 and 7 o'clock and pass <b>2–4</b> non-absorbable sutures per side.</li>\n<li>Do any anterior repair or sling now.</li>\n<li>Bring the sutures through the apical pubocervical and rectovaginal fascia and tie.</li>\n<li>Perform <b>cystoscopy after tying, before trimming</b>. If there is no efflux, remove the most lateral ipsilateral suture first.</li>\n</ol>"], [4, "l", 43, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "5 · Apical compartment", "Apical success is ~98% and anterior ~81%; ureteric kinking or injury occurs in <span class=\"key\">1–11%</span>. Absorbable sutures are non-inferior; premenopausal women recur more; de novo dyspareunia can occur."], [4, "l", 43, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "5 · Apical compartment", "The <b>safe zone</b> is <span class=\"key\">1.5–3.0 cm medial to the ischial spine</span>, into the ligament, at limited depth. Too lateral risks the pudendal bundle; too medial hits weak ligament and sacral nerves."], [4, "a", 44, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "5 · Apical compartment", "<ol>\n<li>Mark the apex, incise in the midline, enter the perirectal space (rectum medial) and palpate spine and ligament.</li>\n<li>Place retractors and pass 2 sutures (Capio or Miya hook).</li>\n<li>Complete other repairs, then attach the sutures to the apex (pulley stitch if permanent).</li>\n<li>Close the vagina halfway and tie the apex flush, with <b>no suture bridge</b>.</li>\n<li>Do cystoscopy and close.</li>\n</ol>"], [4, "l", 44, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "5 · Apical compartment", "Gluteal pain occurs in <span class=\"key\">15%</span> and resolves in 2–3 months (local anaesthetic injection if needed). Also pudendal injury, rectal injury (repair primarily), haemorrhage."], [4, "p", 44, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "5 · Apical compartment", "Both ligaments are safest in their <b>middle third</b> and dangerous at their bony ends: the intermediate portion for USLS, and 1.5–3 cm medial to the spine for SSLF."], [4, "a", 44, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "5 · Apical compartment", "<ol>\n<li>Low lithotomy with a vaginal stent or EEA (end-to-end anastomosis) sizer; sigmoid to the left.</li>\n<li>Incise the peritoneum over the promontory and along the <b>right</b> of the rectum (watch the right ureter) down to the anterior longitudinal ligament.</li>\n<li>If there is a large enterocele, then add a Halban culdoplasty.</li>\n<li>Dissect the bladder off the anterior vagina (6–8 cm) and the rectum off the posterior wall.</li>\n<li>Attach a Y-mesh to both walls <b>without entering the lumen</b>, tension it, and fix it with 2–3 permanent sutures at <b>S1</b>.</li>\n<li><b>Retroperitonealise</b> the mesh, add an anti-incontinence procedure if indicated, and perform cystoscopy.</li>\n</ol>"], [4, "r", 45, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "5 · Apical compartment", "Mesh exposure · <span class=\"key\">~10% by 7 years</span> (E-CARE); mean onset 14 months; more with microporous mesh (Gore-Tex pores let bacteria in but keep macrophages out); excision <span class=\"xref\">see Ch 119</span>"], [4, "a", 45, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "5 · Apical compartment", "<ol>\n<li>If she is elderly or comorbid and not sexually active, then offer colpocleisis.</li>\n<li>If she is fit, has primary prolapse and prefers the vaginal route, then offer USLS or SSLF, with or without vaginal hysterectomy or hysteropexy.</li>\n<li>If young or sexually active, or with recurrence, short vagina or high stage, then offer SCP (minimally invasive).</li>\n</ol>"], [4, "l", 46, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "7 · Obliterative surgery — colpocleisis", "Spare ≥<span class=\"key\">1.5 cm</span> of distal anterior wall (urethral traction causes SUI). Add a sling for SUI or occult SUI; in the frail consider SPC."], [4, "l", 46, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "7 · Obliterative surgery — colpocleisis", "Success is ~90–98% and satisfaction &gt;90%, but regret reaches <span class=\"key\">13%</span>. 43% are over 80, so optimisation matters most."], [4, "a", 46, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "8 · Posterior compartment", "<ol>\n<li>Repair anterior and apical compartments first; hydrodissect and incise in the midline.</li>\n<li>Dissect the rectovaginal fascia off the epithelium; if the hernia is large, place a purse-string at its base.</li>\n<li>Plicate in the midline (2-0 absorbable), incorporate the perineal body, trim and close.</li>\n</ol>"], [4, "p", 48, "Ch 119 · Genitourinary Complications of Mesh and Their Repair", "1 · Mesh, terminology and regulation", "<b>Why pore size matters</b>: bacteria (~1 µm) enter pores that macrophages (~50 µm) cannot, so infection is sealed from immunity. Large pores (~1500 µm) allow fibrocollagenous integration. Woven polypropylene (Marlex) is stiff and extrudes. Mesh adds no cancer or autoimmunity."], [4, "a", 49, "Ch 119 · Genitourinary Complications of Mesh and Their Repair", "3 · Evaluation", "<ol>\n<li>History and <b>prior operative notes</b>.</li>\n<li>Speculum and pelvic exam: exposure, bands, point tenderness, levator hypertonicity.</li>\n<li>If haematuria, recurrent urinary tract infection (UTI), storage lower urinary tract symptoms (LUTS) or voiding pain, then cystourethroscopy.</li>\n<li>If voiding dysfunction, then urodynamics (UDS).</li>\n<li>Translabial ultrasound for a sling; <b>MRI</b> for sacrocolpopexy mesh (invisible on CT); CT for haematoma.</li>\n</ol>"], [4, "l", 49, "Ch 119 · Genitourinary Complications of Mesh and Their Repair", "4 · Midurethral sling complications", "<b>Excision</b>: hydrodissect, incise or raise an inverted-U flap, locate the mesh (sound, ultrasound) and expose its full width. Pass an instrument behind, divide, excise at least <span class=\"key\">1 cm</span> around the defect and close. Avoid blind lateral dissection, which causes vulval haematoma, especially after transobturator (TO) slings."], [4, "l", 50, "Ch 119 · Genitourinary Complications of Mesh and Their Repair", "4 · Midurethral sling complications", "After excision, SUI occurs in <span class=\"key\">42%</span>, fewer with a simultaneous fascial sling."], [4, "p", 50, "Ch 119 · Genitourinary Complications of Mesh and Their Repair", "4 · Midurethral sling complications", "<b>How much to remove</b>: retention needs midline division; exposure at least 1 cm each side; pain maximal vaginal removal, rarely arms. <b>Never remove asymptomatic mesh</b>; more removal means more bleeding and more POP and SUI recurrence."], [4, "l", 51, "Ch 119 · Genitourinary Complications of Mesh and Their Repair", "6 · Sacrocolpopexy mesh", "Exposure is ~<span class=\"key\">10.5% at 7 years</span>, higher with total hysterectomy (23% vs 5%) and stage 3–4. Cervix-sparing surgery has low risk."], [4, "p", 52, "Ch 121 · Urinary Tract Fistulae", "1 · Definition and universal principles", "Trap: a fistula may be the only sign of recurrent cancer, so biopsy the tract after prior malignancy or radiation."], [4, "r", 52, "Ch 121 · Urinary Tract Fistulae", "2 · Vesicovaginal fistula (VVF) — aetiology", "Cause · Obstructed labour; young, small pelvis, poor nutrition · Unrecognised surgical injury; <span class=\"key\">&gt;75%</span> after hysterectomy"], [4, "l", 53, "Ch 121 · Urinary Tract Fistulae", "2 · Vesicovaginal fistula (VVF) — aetiology", "<b>Radiation</b> causes obliterative endarteritis and fibrosis, then necrosis. VVF follows 0.6–2% of cervical cancer radiotherapy, typically <span class=\"key\">1.5–2 years</span> later (up to 30); risk is dose-dependent, worse in smokers."], [4, "p", 53, "Ch 121 · Urinary Tract Fistulae", "3 · Classification of VVF", "Trap: Goh type 1 is farthest from the meatus (best) and type 4 closest (worst); closer means worse closure and continence. Goh predicts closure better. Always describe size, location (trigonal vs supratrigonal), tissue loss, and ureteric and urethral involvement."], [4, "l", 53, "Ch 121 · Urinary Tract Fistulae", "4 · Diagnosis of VVF", "<b>Timing points to mechanism</b>: a missed cystotomy leaks in the first days, thermal or crush injury at <span class=\"key\">7–10 days</span>, and radiation after years. Fever, flank pain or ileus suggest urinoma or ureteric injury."], [4, "l", 54, "Ch 121 · Urinary Tract Fistulae", "4 · Diagnosis of VVF", "<b>Upper tract imaging is mandatory</b>, because ureteric injury coexists in up to <span class=\"key\">12%</span>. Use CT urography (CTU) with a delayed phase, or MR urography if contrast allergy or renal failure. <b>Partial ureteric obstruction with VVF means UVF until proven otherwise.</b> If unclear, do retrograde pyelogram and stent, or percutaneous nephrostomy (PCN) if that fails."], [4, "p", 54, "Ch 121 · Urinary Tract Fistulae", "4 · Diagnosis of VVF", "Work-up order: is it urine (creatinine), where is it from (dye tests, endoscopy), and what else is damaged (hence compulsory upper tract imaging). A preoperative PCN also allows antegrade ureteroscopy to find the ureter in scar."], [4, "r", 54, "Ch 121 · Urinary Tract Fistulae", "5 · VVF — timing, conservative care, repair", "Radiation-induced · ≥<span class=\"key\">12 months</span> after radiation ends · Late injury still evolving"], [4, "l", 54, "Ch 121 · Urinary Tract Fistulae", "5 · VVF — timing, conservative care, repair", "<b>Catheter</b> drainage is favourable for tracts &lt;1 cm catheterised within <span class=\"key\">3 weeks</span>; it is unfavourable at ≥6 weeks or with radiation or malignancy (never heal). The EAU trial lasts ≥<span class=\"key\">12 weeks</span>. Sealants are possible for &lt;1 cm in poor surgical candidates (risks: catheter adherence, spasm, stone on glue)."], [4, "l", 54, "Ch 121 · Urinary Tract Fistulae", "5 · VVF — timing, conservative care, repair", "<b>Location</b>: within <span class=\"key\">1 cm</span> of a ureter, stent it; if the ureter is involved, reimplant (abdominal). Bladder neck involvement needs reconstruction, plus a pubovaginal sling if needed."], [4, "l", 55, "Ch 121 · Urinary Tract Fistulae", "5 · VVF — timing, conservative care, repair", "<b>Route</b>: there are no RCTs; first-attempt closure is ≈ <span class=\"key\">90%</span> either way. Transvaginal repair has less blood loss, pain and stay; some call it gold standard."], [4, "a", 55, "Ch 121 · Urinary Tract Fistulae", "5 · VVF — timing, conservative care, repair", "<p><b>Transvaginal flap-splitting (Table 121.5)</b></p><ol>\n<li>Cystoscopy: stent close ureters; wire through the tract.</li>\n<li>Suprapubic catheter (SPC) and urethral catheter; episiotomy if narrow.</li>\n<li>Foley ≥8 Fr through the fistula for traction; hydrodissect.</li>\n<li><b>J- or U-incision</b> with a 1–3 mm cuff; raise wide anterior and posterior flaps.</li>\n<li>Layer 1: 3-0/4-0 delayed absorbable. Layer 2: <b>perpendicular</b> to layer 1.</li>\n<li>Leak test 200–300 mL; Martius or peritoneal flap if needed.</li>\n<li>Advance the opposite flap ≥2 cm beyond (layer 3); cystoscopy for efflux.</li>\n</ol>"], [4, "a", 55, "Ch 121 · Urinary Tract Fistulae", "5 · VVF — timing, conservative care, repair", "<p><b>O'Conor (Table 121.7)</b></p><ol>\n<li>Ureteric catheters; low midline extraperitoneal approach.</li>\n<li>Sagittal dome cystotomy; <b>bivalve</b> down around the fistula; excise the tract.</li>\n<li>Separate bladder from vagina ≥2–3 cm beyond; close the vagina.</li>\n<li>Place <b>omentum or peritoneum</b> beyond the vaginal suture line.</li>\n<li>Close bladder in 1–2 layers; SPC with or without urethral catheter; fill test.</li>\n<li>Drain 10–14 days, then cystogram.</li>\n</ol>"], [4, "l", 56, "Ch 121 · Urinary Tract Fistulae", "7 · Ureterovaginal fistula (UVF)", "Up to <span class=\"key\">25%</span> of VVF have a coexisting UVF; delayed recognition raises fistula risk ~4-fold. Ileal ureter or nephropexy adds length; early and ≥6-week repair succeed equally."], [4, "a", 56, "Ch 121 · Urinary Tract Fistulae", "7 · Ureterovaginal fistula (UVF)", "<ol>\n<li>Suspect UVF; exclude VVF; confirm with CTU or retrograde pyelogram.</li>\n<li>Stent; remove at 4–6 weeks and reimage.</li>\n<li>If resolved, stop. If persistent or stenting fails, then do ureteroneocystostomy.</li>\n</ol>"], [4, "p", 56, "Ch 121 · Urinary Tract Fistulae", "7 · Ureterovaginal fistula (UVF)", "UVF: wet but voids normally. The ureter heals over a stent if reached early, so the detection-to-stent interval largely decides whether surgery is needed."], [4, "l", 57, "Ch 121 · Urinary Tract Fistulae", "11 · Vesicoenteric fistula (VEF)", "Colovesical is commonest. M : F is <span class=\"key\">3 : 1</span> because the uterus shields the bladder; affected women often had a hysterectomy."], [4, "p", 58, "Ch 121 · Urinary Tract Fistulae", "11 · Vesicoenteric fistula (VEF)", "VEF is a bowel disease presenting in the bladder: remove the diseased bowel, and the bladder usually heals itself."], [4, "l", 58, "Ch 121 · Urinary Tract Fistulae", "12 · Urocutaneous fistulae", "<b>Urethrocutaneous</b> fistula is the commonest hypospadias complication (up to 20%). Wait ≥<span class=\"key\">6 months</span> and exclude distal stricture. Close &lt;1 cm locally; ≥1 cm or redo needs vascularised flaps (<b>tunica vaginalis</b> better than dartos). Massive loss needs gracilis; neurogenic patients with pressure ulcers need an ileal conduit."], [4, "l", 60, "Ch 122 · Bladder and Female Urethral Diverticula", "1 · Bladder diverticula — definition and pathology", "About 90% occur in adults; M : F ≈ <span class=\"key\">9 : 1</span>. Cellules, saccules and diverticula form a pressure continuum."], [4, "l", 60, "Ch 122 · Bladder and Female Urethral Diverticula", "1 · Bladder diverticula — definition and pathology", "Acquired cases are due to benign prostatic hyperplasia in ~<span class=\"key\">70%</span>, also bladder neck obstruction and stricture; in women, dysfunctional voiding, prolapse, primary bladder neck obstruction and post-sling obstruction."], [4, "p", 60, "Ch 122 · Bladder and Female Urethral Diverticula", "1 · Bladder diverticula — definition and pathology", "Congenital: weak wall, normal pressure. Acquired: normal wall, high pressure, so an acquired diverticulum sends the search back to the outlet."], [4, "p", 61, "Ch 122 · Bladder and Female Urethral Diverticula", "2 · Bladder diverticula — evaluation", "Two jobs: find the cause (outlet or neurogenic) and exclude cancer in a sac each test sees imperfectly, so tests are combined."], [4, "l", 61, "Ch 122 · Bladder and Female Urethral Diverticula", "3 · Malignancy in bladder diverticula", "Stasis and inflammation drive it; prevalence 0.8–10%, peak 65–75 years. Urothelial carcinoma is <span class=\"key\">70–80%</span> and squamous cell carcinoma (SCC) 20–25%."], [4, "p", 61, "Ch 122 · Bladder and Female Urethral Diverticula", "3 · Malignancy in bladder diverticula", "Treat a diverticular tumour as potentially invasive from the outset; missing muscle explains early spread, perforation risk and inaccurate staging."], [4, "a", 62, "Ch 122 · Bladder and Female Urethral Diverticula", "4 · Bladder diverticula — management", "<ol>\n<li>Assess with history, cystoscopy, cytology and VCUG.</li>\n<li>If a lesion is suspicious, then biopsy and give cancer therapy.</li>\n<li>If not, image the upper tract. If HUN or symptoms, then do urodynamics and treat BOO, then reassess.</li>\n<li>If a problem from the diverticulum persists: fit → diverticulectomy; unfit → clean intermittent catheterisation (CIC).</li>\n<li>If asymptomatic and uncomplicated, then survey.</li>\n</ol>"], [4, "l", 63, "Ch 122 · Bladder and Female Urethral Diverticula", "6 · UD — presentation and evaluation", "All three Ds occur in only ~<span class=\"key\">5%</span>. Features: irritative LUTS, pain, recurrent UTI, mass (~⅓), incontinence (~⅓), haematuria, discharge, retention; 10–20% are asymptomatic. <b>Size does not track symptoms</b>, and UD is misdiagnosed for years (interstitial cystitis, vulvodynia), so examine."], [4, "p", 63, "Ch 122 · Bladder and Female Urethral Diverticula", "6 · UD — presentation and evaluation", "UD symptoms mimic common LUTS and do not track size, so suspicion and examination make the diagnosis. Imaging confirms and <b>maps</b> it, especially extension towards the bladder neck (bladder or ureteric injury, postoperative incontinence)."], [4, "p", 64, "Ch 122 · Bladder and Female Urethral Diverticula", "7 · Differential diagnosis of periurethral masses", "Two questions sort most periurethral masses: does it communicate (only UD), and where is it relative to the meatus (Skene, prolapse and caruncle lie at the meatus)? A firm, mobile, solid mass is a leiomyoma."], [4, "l", 64, "Ch 122 · Bladder and Female Urethral Diverticula", "8 · Classification and SUI", "Significant de novo stress urinary incontinence (SUI) occurs in <span class=\"key\">7–16%</span>; risks are size ≥30 mm, proximal or circumferential sac, and short urethra. Most settles within 12 months."], [4, "a", 65, "Ch 122 · Bladder and Female Urethral Diverticula", "9 · Surgical repair of UD", "<ol>\n<li>Lithotomy and Foley; suprapubic catheter (<b>SPC) at the start</b>, never the end (it would cross the repair).</li>\n<li>Make an <b>inverted-U incision</b> and raise the vaginal flap off the fascia.</li>\n<li>Incise the fascia <b>transversely</b> and raise fascial flaps.</li>\n<li>Excise the entire sac to the ostium, including the inflamed urethral edge.</li>\n<li>Close the urethra watertight over a catheter (as small as 12 Fr).</li>\n<li>Close fascia <b>perpendicular</b> to it, obliterating dead space.</li>\n<li>If tissue is poor or fascia attenuated, then add a <b>Martius</b> flap.</li>\n<li>Advance the vaginal flap (3 layers; 4 with Martius); antibiotic pack.</li>\n</ol>"], [4, "r", 65, "Ch 122 · Bladder and Female Urethral Diverticula", "10 · Complications", "Recurrent UD · <span class=\"key\">10–22%</span> (pooled ~10%) · Incomplete excision, dead space; circumferential, complex, proximal, multiple"], [4, "p", 65, "Ch 122 · Bladder and Female Urethral Diverticula", "10 · Complications", "Complete sac removal, watertight closure, off-axis fascia and obliterated dead space prevent the three failures: recurrence, fistula, incontinence."], [4, "l", 66, "Ch 77 · Sexual Function and Dysfunction in the Female", "1 · Functional anatomy", "<b>Skene</b> glands are the prostate homologue (prostate-specific antigen positive); <b>Bartholin</b> glands are the bulbourethral homologue. <span class=\"tag\">MCQ</span> The G-spot has no agreed anatomical basis."], [4, "a", 66, "Ch 77 · Sexual Function and Dysfunction in the Female", "2 · Physiology of the sexual response", "<ol>\n<li>Touch on the clitoral complex travels in pudendal (somatic) afferents to <b>S2–S4</b>.</li>\n<li>Parasympathetic efferents (nervi erigentes, then cavernous nerves) dilate arterioles, causing engorgement and lubrication.</li>\n</ol>"], [4, "p", 67, "Ch 77 · Sexual Function and Dysfunction in the Female", "2 · Physiology of the sexual response", "Pudendal injury removes the <b>trigger</b>; pelvic plexus or cavernous nerve injury removes the <b>response</b>."], [4, "a", 67, "Ch 77 · Sexual Function and Dysfunction in the Female", "2 · Physiology of the sexual response", "<ol>\n<li>Neuronal nitric oxide synthase (nNOS) makes nitric oxide (NO), which activates guanylate cyclase to make cyclic GMP (cGMP).</li>\n<li>cGMP lowers Ca²⁺, so smooth muscle relaxes and tissue engorges.</li>\n<li>Phosphodiesterase type 5 (PDE5) degrades cGMP; arginase consumes NOS substrate; vasoactive intestinal polypeptide (VIP) works with NO.</li>\n</ol>"], [4, "r", 67, "Ch 77 · Sexual Function and Dysfunction in the Female", "2 · Physiology of the sexual response", "Deficiency · Thin, dry, fibrotic vagina, causing dyspareunia; risk rises at oestradiol <span class=\"key\">≤50 pg/mL</span> · Lower libido, arousal, sensation, orgasm"], [4, "p", 67, "Ch 77 · Sexual Function and Dysfunction in the Female", "2 · Physiology of the sexual response", "Under Basson, lack of <i>spontaneous</i> desire (common after menopause) is not a dysfunction, which is why DSM-5 merged desire and arousal."], [4, "r", 67, "Ch 77 · Sexual Function and Dysfunction in the Female", "3 · Classification", "Desire and arousal · HSDD; female sexual arousal disorder (FSAD); sexual aversion disorder · <b>Female sexual interest/arousal disorder (FSIAD)</b>: <span class=\"key\">≥3 of 6</span>: less interest; fewer fantasies; less initiation/receptivity; less pleasure, response to cues, sensation (in 75–100% of encounters). Aversion dropped"], [4, "r", 68, "Ch 77 · Sexual Function and Dysfunction in the Female", "3 · Classification", "Orgasm · Female orgasmic disorder (FOD) after normal excitement · FOD: delay, infrequency, absence <b>or lower intensity</b> in <span class=\"key\">75–100%</span>; normal-excitement requirement removed"], [4, "l", 68, "Ch 77 · Sexual Function and Dysfunction in the Female", "3 · Classification", "About <span class=\"key\">40%</span> have a lifetime sexual problem; ~<span class=\"key\">8–12%</span> a distressing disorder. <b>HSDD is commonest</b>, FOD second."], [4, "l", 68, "Ch 77 · Sexual Function and Dysfunction in the Female", "4 · Causes (biopsychosocial)", "<span class=\"tag\">MCQ</span> Combined hormonal contraceptives lower ovarian testosterone and raise SHBG; oral oestrogens, tamoxifen and thyroxine also raise SHBG."], [4, "a", 68, "Ch 77 · Sexual Function and Dysfunction in the Female", "5 · Evaluation", "<ol>\n<li><b>P</b>ermission.</li>\n<li><b>L</b>imited <b>I</b>nformation: cycle, ageing, drugs.</li>\n<li><b>S</b>pecific <b>S</b>uggestions: lubricants, <b>vaginal oestrogen</b>, positions, vibrators.</li>\n<li><b>I</b>ntensive <b>T</b>herapy means <b>referral</b> (PLISSIT).</li>\n</ol>"], [4, "a", 69, "Ch 77 · Sexual Function and Dysfunction in the Female", "6 · Hypoactive sexual desire disorder", "<ol>\n<li>Screen (DSDS), then history and examination.</li>\n<li><b>Correct modifiable factors</b>: drugs, depression, GSM, pain, partner's ED.</li>\n<li>Education; sex or couples therapy.</li>\n<li>If <b>generalised acquired</b> HSDD persists, then drug; review at 8 weeks.</li>\n<li><b>Refer</b> if situational HSDD fails counselling, or psychiatric illness or sexual trauma.</li>\n</ol>"], [4, "r", 69, "Ch 77 · Sexual Function and Dysfunction in the Female", "6 · Hypoactive sexual desire disorder", "Dose · <span class=\"key\">100 mg at bedtime</span> daily; ~half respond by 8 weeks · <span class=\"key\">1.75 mg subcutaneous</span> ≥45 min before sex; ≤1/24 h, <span class=\"key\">≤8/month</span>"], [4, "l", 70, "Ch 77 · Sexual Function and Dysfunction in the Female", "8 · Female orgasmic disorder", "<b>Education is the cornerstone</b>, with directed masturbation, sensate focus and mindfulness. If arousal is intact, increase stimulation (vibrators; <span class=\"tag\">MCQ</span> EROS clitoral vacuum is the only FDA-cleared FSD device). Give hormones for postmenopausal deficiency; operate for clitoral phimosis or adhesions."], [4, "a", 70, "Ch 77 · Sexual Function and Dysfunction in the Female", "8 · Female orgasmic disorder", "<ol>\n<li><b>SSRI-induced dysfunction</b>: was it present before treatment?</li>\n<li>If not, wait for tolerance (~4 months).</li>\n<li>If it persists at 3–6 months, then lower the dose, or switch to or add <b>bupropion</b> or mirtazapine; consider sildenafil.</li>\n</ol>"], [4, "l", 71, "Ch 77 · Sexual Function and Dysfunction in the Female", "9 · Genito-pelvic pain / penetration disorder", "<b>Vulvodynia</b>: vulval (burning) pain for <span class=\"key\">≥3 months</span>, no cause; localised or generalised, provoked or unprovoked."], [4, "l", 71, "Ch 77 · Sexual Function and Dysfunction in the Female", "9 · Genito-pelvic pain / penetration disorder", "<b>Provoked vestibulodynia (PVD)</b> is commonest (~<span class=\"key\">10–12%</span> of women; linked to irritable bowel syndrome, fibromyalgia). Primary PVD starts at first penetration (nulliparity, family history, enuresis, dysmenorrhoea). Secondary (~⅔) follows pain-free sex; its area is larger, and the hood is often most painful."], [4, "a", 71, "Ch 77 · Sexual Function and Dysfunction in the Female", "9 · Genito-pelvic pain / penetration disorder", "<ol>\n<li>Education and vulval care.</li>\n<li>Lidocaine 5% or EMLA <b>10 min before intercourse</b>.</li>\n<li><b>Multimodal pelvic floor physical therapy</b> (myofascial release, trigger points, down-training, biofeedback, graded <b>dilators</b>, electrical stimulation) with psychological/couples therapy.</li>\n<li>If hypo-oestrogenic, then vestibular oestrogen.</li>\n<li>If localised PVD is refractory, then <b>vestibulectomy</b>.</li>\n</ol>"], [4, "a", 71, "Ch 77 · Sexual Function and Dysfunction in the Female", "9 · Genito-pelvic pain / penetration disorder", "<ol>\n<li>Non-hormonal lubricants/moisturisers and regular activity (NAMS first line).</li>\n<li>Then <b>low-dose vaginal oestrogen</b> (<span class=\"dag\">†</span>minimal absorption, no progestogen) or <span class=\"dag\">†</span>vaginal DHEA (prasterone 6.5 mg nightly).</li>\n<li>If vaginal products are impossible, then <span class=\"dag\">†</span>ospemifene 60 mg orally (SERM, vaginal agonist; VTE risk).</li>\n<li>If vasomotor symptoms, then systemic hormone therapy.</li>\n</ol>"], [4, "p", 71, "Ch 77 · Sexual Function and Dysfunction in the Female", "9 · Genito-pelvic pain / penetration disorder", "<span class=\"dag\">†</span>After <b>breast cancer</b>, use non-hormonal measures first; vaginal oestrogen only after oncology discussion (aromatase inhibitors)."], [4, "l", 72, "Ch 77 · Sexual Function and Dysfunction in the Female", "10 · Pelvic surgery and sexual function", "<b>Genital-sparing</b> cystectomy (if oncologically safe) lets sex resume at <span class=\"key\">~6 vs 14 weeks</span>; diversion type is irrelevant. A third of cancer patients want sex-therapy referral. <b>Never trade oncological control.</b> <span class=\"xref\">See Ch 101</span>"], [4, "a", 74, "★ Putting it together: female pelvic decisions", "A · Incontinent woman", "<ol>\n<li><b>Classify</b> (history, diary): stress (SUI), urgency (UUI), mixed, overflow, functional. Check stress test, mobility, prolapse (POP), residual and urinalysis (<span class=\"xref\">Ch 105</span>).</li>\n<li><b>Urodynamics</b> are not needed for uncomplicated demonstrable SUI (VALUE). If mixed or unclear, voiding dysfunction, prior surgery, neurological or high-grade POP, then use them.</li>\n<li><b>Conservative first:</b> weight, fluids/caffeine, supervised pelvic floor training, bladder training, pessary, postmenopausal vaginal oestrogen (<span class=\"xref\">Ch 114</span>).</li>\n<li>If this fails, then <b>SUI surgery</b> (<span class=\"xref\">Ch 116, 118</span>); for UUI, drugs, botulinum toxin, neuromodulation.</li>\n</ol>"], [4, "a", 74, "★ Putting it together: female pelvic decisions", "C · Prolapse: which repair?", "<ol>\n<li><b>POP-Q</b> stages the leading edge; stage II is within 1 cm of the hymen (<span class=\"xref\">Ch 105</span>).</li>\n<li>If asymptomatic, then observe; if symptomatic, then pessary or surgery.</li>\n<li><b>Support the apex</b>: uterosacral/sacrospinous suspension or sacrocolpopexy (most durable) (<span class=\"xref\">Ch 117</span>).</li>\n<li>If <b>frail, not sexually active</b>, then colpocleisis.</li>\n<li>If <b>occult SUI</b>, then discuss a concomitant sling (OPUS: fewer leaks, more complications).</li>\n</ol>"], [4, "p", 75, "★ Putting it together: female pelvic decisions", "D · Vesicovaginal fistula", "Do a double-dye test, upper tract imaging, and biopsy after radiation or cancer. Post-hysterectomy fistulae are supratrigonal and mostly repaired vaginally (Latzko or layered); go abdominal if the ureter is involved, the fistula is large or high, or vaginal repair failed. Use tension-free watertight layers, non-overlapping lines, a vascularised flap (Martius vaginally, omentum abdominally) for poor or irradiated tissue, continuous drainage, then a cystogram (<span class=\"xref\">See Ch 121</span>)."], [4, "a", 75, "★ Putting it together: female pelvic decisions", "E · Mesh complications", "<ol>\n<li>If suspected, then speculum and cystoscopy.</li>\n<li>If the exposure is small, then oestrogen with or without trimming; if larger or symptomatic, then excise and close.</li>\n<li>If mesh is in bladder or urethra, then remove and repair; no new mesh then.</li>\n<li>Remove enough to solve the problem; never asymptomatic mesh (<span class=\"xref\">Ch 119</span>).</li>\n</ol>"], [5, "l", 2, "Ch 102 · Surgical, Radiographic and Endoscopic Anatomy of the Male Pelvis", "1 · Bony pelvis", "The pelvic brim is <span class=\"key\">50–60°</span> to horizontal. The <b>arcuate line</b> (promontory to pubis) separates false from true pelvis. The iliac crest is at <b>L4</b>."], [5, "l", 2, "Ch 102 · Surgical, Radiographic and Endoscopic Anatomy of the Male Pelvis", "2 · Lower abdominal wall", "It is <span class=\"key\">4 cm</span> long, carrying the <b>spermatic cord and ilioinguinal nerve</b>. The deep ring is midway between anterior superior iliac spine (ASIS) and pubic tubercle, <b>lateral to the inferior epigastric vessels</b>; the superficial ring is superolateral to the tubercle."], [5, "l", 3, "Ch 102 · Surgical, Radiographic and Endoscopic Anatomy of the Male Pelvis", "4 · Perineum", "Perineal prostatectomy <span class=\"tag\">MCQ</span>: <b>Young</b> divides the central tendon, leaving the external sphincter on the rectum; <b>Belt</b> passes <b>under</b> it."], [5, "p", 4, "Ch 102 · Surgical, Radiographic and Endoscopic Anatomy of the Male Pelvis", "6 · Pelvic nerves", "Anterior scrotum is L1 (ilioinguinal, genitofemoral); posterior scrotum is sacral (pudendal, posterior femoral cutaneous)."], [5, "l", 4, "Ch 102 · Surgical, Radiographic and Endoscopic Anatomy of the Male Pelvis", "6 · Pelvic nerves", "The NVB lies at <span class=\"key\">5 and 7 o'clock</span> at the apex; injury at prostatectomy or rectal resection causes ED."], [5, "l", 5, "Ch 102 · Surgical, Radiographic and Endoscopic Anatomy of the Male Pelvis", "7 · Pelvic viscera", "The intramural ureter runs <span class=\"key\">1.5–2 cm</span> obliquely in <b>Waldeyer's sheath</b>; being narrow, it traps stones."], [5, "a", 5, "Ch 102 · Surgical, Radiographic and Endoscopic Anatomy of the Male Pelvis", "8 · Endoscopic anatomy", "<ol>\n<li>Under local anaesthetic, inspect bladder, orifices and trigone with a flexible cystoscope.</li>\n<li>Retroflex at the neck: intravesical prostatic protrusion, hidden tumours.</li>\n<li>Find the verumontanum and ejaculatory ducts; the external sphincter coapts just distal, then the bulbar urethra.</li>\n</ol>"], [5, "p", 5, "Ch 102 · Surgical, Radiographic and Endoscopic Anatomy of the Male Pelvis", "8 · Endoscopic anatomy", "The verumontanum is the sentinel at transurethral resection of the prostate (TURP): resection distal to it injures the external sphincter and causes incontinence."], [5, "l", 6, "Ch 102 · Surgical, Radiographic and Endoscopic Anatomy of the Male Pelvis", "9 · Radiographic anatomy", "Malignant nodes are rounded, heterogeneous; size is most specific at ≥<span class=\"key\">1 cm</span> short axis."], [5, "l", 6, "Ch 102 · Surgical, Radiographic and Endoscopic Anatomy of the Male Pelvis", "9 · Radiographic anatomy", "<b>CT urogram</b> excretory images are at <span class=\"key\">7–10 min</span>; iliac-crossing narrowing and peristaltic gaps are normal."], [5, "l", 6, "Ch 102 · Surgical, Radiographic and Endoscopic Anatomy of the Male Pelvis", "9 · Radiographic anatomy", "Magnetic resonance imaging (<b>MRI</b>) has the best soft-tissue contrast: T1 for bone and gadolinium, T2 for anatomy, prostate, pelvic floor. A distended bladder wall over <span class=\"key\">3 mm</span> is thickened. The external sphincter is a T2-dark doughnut below the apex."], [5, "p", 7, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "1 · Overview", "<b>Why single-organ therapy fails:</b> bladder and urethra act reciprocally, so boosting contractility in detrusor underactivity fails unless the urethra also relaxes. Afferent modulation acts on both (reduce it for overactivity, augment it for underactivity), which makes it the most promising therapeutic lever."], [5, "l", 7, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "2 · Functional anatomy", "The wall is about <span class=\"key\">50% collagen, 2% elastin</span>, mainly types I, III and IV."], [5, "r", 8, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "2 · Functional anatomy", "Where · Intramural rhabdosphincter — <span class=\"key\">~50% of static urethral resistance</span> · Periurethral pelvic floor (mixed)"], [5, "r", 8, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "2 · Functional anatomy", "Rhabdosphincter mix · Male <span class=\"key\">65% slow / 35% fast</span>; female <span class=\"key\">87% slow / 13% fast</span>"], [5, "p", 8, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "3 · Urothelium: barrier and sensor", "Damaged urothelium causes symptoms twice over: by <b>solute leak</b> into the lamina propria and by <b>altered signalling</b> (more ATP, less NO) to afferents."], [5, "a", 9, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "4 · Detrusor smooth muscle physiology", "<ol>\n<li>ACh binds <b>M3</b> receptors (Gq).</li>\n<li>Intracellular Ca²⁺ rises via L-type entry and phospholipase C (PLC), whose IP3 releases sarcoplasmic reticulum (SR) Ca²⁺.</li>\n<li>Ca²⁺–calmodulin activates myosin light chain kinase (MLCK), which phosphorylates MLC20.</li>\n<li>Cross-bridges cycle and the muscle contracts.</li>\n<li>As Ca²⁺ falls, myosin light chain phosphatase (MLCP) dephosphorylates MLC20 and the muscle relaxes.</li>\n</ol>"], [5, "p", 9, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "4 · Detrusor smooth muscle physiology", "<b>Motor–sensory coupling:</b> spontaneous micromotions generate afferent bursts perceived as urgency. Antimuscarinics and mirabegron reduce non-voiding contractions and so reduce sensory input; efferent and afferent functions are inseparable."], [5, "l", 11, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "6 · Peripheral innervation", "Parasympathetic outflow is <span class=\"key\">S2–S4</span>; sympathetic is <span class=\"dag\">†</span><span class=\"key\">T10–L2</span>, relaying in chain, inferior mesenteric and pelvic ganglia."], [5, "p", 11, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "7 · Central control", "<b>Lesion localisation:</b> a forebrain lesion removes tonic inhibition, giving DO with preserved coordination. A pontine lesion gives retention. A suprasacral cord lesion gives DO with detrusor–sphincter dyssynergia (<b>DSD</b>). A sacral or cauda lesion gives a decentralised, acontractile bladder <span class=\"xref\">(see Ch 104)</span>."], [5, "a", 12, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "8 · Storage and emptying phases", "<ol>\n<li>Tension-receptor (Aδ) firing exceeds threshold.</li>\n<li>If the cortex permits, the PAG/PMC switch flips.</li>\n<li>Sympathetic and pudendal outflow switch off; the <b>urethral sphincter relaxes first</b>, and urethral smooth muscle relaxes (NO).</li>\n<li>The detrusor contracts (parasympathetic) and flow begins.</li>\n<li>Urethral afferents reinforce the contraction until the bladder is empty.</li>\n</ol>"], [5, "l", 12, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "8 · Storage and emptying phases", "Women with SUI void at Pdet at Qmax ≈ <span class=\"key\">19 cmH₂O</span>, healthy men ≈ <span class=\"key\">60–70 cmH₂O</span>. Low pressure in women does not mean impaired contractility; male nomograms are invalid in women."], [5, "l", 12, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "9 · Urethral closure mechanisms", "Nicotinic blockade rarely lowers urethral tone by &gt;40%, but α-blockade lowers urethral pressure by about <span class=\"key\">one third</span>, so smooth muscle (α1A) tone matters."], [5, "p", 12, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "9 · Urethral closure mechanisms", "Continence = <b>active muscle tone + passive anatomical coaptation</b>. The integral theory led to the mid-urethral sling (MUS), the SUI standard, yet DeLancey's data suggest intrinsic sphincter function matters more than support <span class=\"xref\">(see Ch 109)</span>."], [5, "l", 13, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "10 · Compliance", "Normal filling keeps pressure <span class=\"key\">&lt;10 cmH₂O</span>. Determinants are viscoelasticity, active tone and geometry; <b>type III collagen straightens</b> with filling."], [5, "l", 13, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "10 · Compliance", "<span class=\"dag\">†</span>A detrusor leak point pressure (DLPP) ≥ <span class=\"key\">40 cmH₂O</span> in a low-compliance neurogenic bladder predicts upper tract damage <span class=\"xref\">(see Ch 104)</span>."], [5, "l", 13, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "11 · Pathophysiology links", "A post-void residual (PVR) ≥ <span class=\"key\">300 mL</span> warrants evaluation, as do bothersome LUTS, hydronephrosis, renal insufficiency or culture-proven urinary tract infection (UTI); PVR &lt;300 mL does not prove normal contractility."], [5, "p", 16, "Ch 104 · Pathophysiology and Classification of Lower Urinary Tract Dysfunction", "2 · Pathophysiology", "Urinary incontinence (UI) can occur from ISD alone, but <b>never from hypermobility alone</b>. In <b>DeLancey's hammock</b>, a firm suburethral layer lets abdominal pressure compress the urethra. In half of continent women the continence point is the <b>mid-urethra</b>. Male sphincteric incontinence resembles ISD."], [5, "p", 16, "Ch 104 · Pathophysiology and Classification of Lower Urinary Tract Dysfunction", "3 · Functional classification (Wein) — 2 × 2 table", "<ul>\n<li>Bladder underactivity appears under <b>both</b> storage (overflow) and emptying. <span class=\"tag\">MCQ</span></li>\n<li>An α-agonist tightens the outlet (storage); an α-blocker relaxes it (emptying).</li>\n<li>OnabotulinumtoxinA in the detrusor treats storage; in the sphincter it treats emptying.</li>\n<li>Naming the failure names the treatment family.</li>\n</ul>"], [5, "l", 17, "Ch 104 · Pathophysiology and Classification of Lower Urinary Tract Dysfunction", "6 · Nocturia and neurogenic dysfunction", "<b>Polyuria</b> is &gt;<span class=\"key\">40 mL/kg/24 h</span>. <b>Nocturnal polyuria</b> is a night-to-24-h volume ratio &gt;<span class=\"key\">20% young, &gt;33% elderly</span>; causes are loss of the nocturnal vasopressin rise and sleep apnoea."], [5, "p", 17, "Ch 104 · Pathophysiology and Classification of Lower Urinary Tract Dysfunction", "6 · Nocturia and neurogenic dysfunction", "DSD needs an intact sacral arc <b>disconnected from the pons</b>, so it is suprasacral, never suprapontine."], [5, "r", 18, "Ch 106 · Evaluation and Management of Males With Urinary Incontinence", "2 · Types", "UUI: with urgency · Detrusor overactivity (DO) overcomes a normal outlet · ~<span class=\"key\">90%</span> have DO on urodynamics; it is \"wet\" overactive bladder (OAB)"], [5, "r", 18, "Ch 106 · Evaluation and Management of Males With Urinary Incontinence", "2 · Types", "With chronic retention · Residual ≥<span class=\"key\">300 mL</span> · \"Overflow\" is no longer an ICS term; spinal cord injury (SCI) at or above T6 risks autonomic dysreflexia"], [5, "l", 19, "Ch 106 · Evaluation and Management of Males With Urinary Incontinence", "3 · Evaluation", "<b>Bladder diary</b>: only the ICIQ Bladder Diary (ICIQ-BD) is fully validated. <b><span class=\"key\">3 days</span> equal 7 days</b>; include a weekend."], [5, "p", 19, "Ch 106 · Evaluation and Management of Males With Urinary Incontinence", "3 · Evaluation", "Every man: history, examination, BMI, dipstick, diary, questionnaire, flow, PVR. Optional: PSA, bloods, imaging, endoscopy, invasive UDS, usually just before surgery."], [5, "a", 19, "Ch 106 · Evaluation and Management of Males With Urinary Incontinence", "4 · Urgency urinary incontinence", "<ol>\n<li>Lifestyle, bladder training and pelvic floor muscle training (PFMT) ≥6 weeks (ideally 3 months).</li>\n<li>Antimuscarinic or β3-agonist, or both.</li>\n<li>Urodynamics optional; then onabotulinumtoxinA, sacral neuromodulation (SNM) or posterior tibial nerve stimulation (PTNS).</li>\n<li>Last resort: augmentation or ileal conduit.</li>\n</ol>"], [5, "l", 19, "Ch 106 · Evaluation and Management of Males With Urinary Incontinence", "4 · Urgency urinary incontinence", "Cut fluid by <span class=\"key\">25%</span> if intake is &gt;1 L/day; avoid caffeine and fizzy drinks; lose weight."], [5, "r", 20, "Ch 106 · Evaluation and Management of Males With Urinary Incontinence", "4 · Urgency urinary incontinence", "Drawback · Retention in ~<span class=\"key\">10%</span>, so the man must accept self-catheterisation · Most invasive, costliest · Frequent visits"], [5, "l", 20, "Ch 106 · Evaluation and Management of Males With Urinary Incontinence", "4 · Urgency urinary incontinence", "If the SNM test gives ≥<span class=\"key\">50%</span> improvement, a permanent generator is implanted <span class=\"xref\">(see Ch 115)</span>. No head-to-head trials exist."], [5, "a", 20, "Ch 106 · Evaluation and Management of Males With Urinary Incontinence", "5 · Stress urinary incontinence", "<ol>\n<li>Supervised PFMT ≥3 months, with or without biofeedback and electrical stimulation (better started pre-op); consider duloxetine.</li>\n<li>Exclude anastomotic or urethral stricture and bladder dysfunction (UDS).</li>\n<li>Choose surgery by severity.</li>\n</ol>"], [5, "l", 20, "Ch 106 · Evaluation and Management of Males With Urinary Incontinence", "5 · Stress urinary incontinence", "After radical prostatectomy wait <b><span class=\"key\">6–12 months</span></b>; avoid a long-term urethral catheter (traumatic hypospadias)."], [5, "l", 20, "Ch 106 · Evaluation and Management of Males With Urinary Incontinence", "5 · Stress urinary incontinence", "The <b>AUS is the gold standard</b>, ~80% continence (Scott 1973 <span class=\"tag\">MCQ</span>), activated at ~6 weeks; <span class=\"dag\">†</span>deactivate it before catheterisation or endoscopy to prevent erosion."], [5, "p", 22, "Ch 107 · Urodynamic and Videourodynamic Evaluation of the Lower Urinary Tract", "1 · Definition and role", "<b>Box 107.1 — Urodynamic risk factors</b> (treat even if asymptomatic): impaired compliance; detrusor–external sphincter dyssynergia (DESD); detrusor–internal sphincter dyssynergia (DISD); high-pressure detrusor overactivity (DO) throughout filling; detrusor leak point pressure (DLPP) <span class=\"key\">&gt; 40 cmH₂O</span>; poor emptying with high storage pressure. Each causes sustained high intravesical pressure."], [5, "l", 22, "Ch 107 · Urodynamic and Videourodynamic Evaluation of the Lower Urinary Tract", "2 · Preparation", "<b>ICS pre-invasive work-up</b>: symptom and bother score, <span class=\"key\">3-day frequency–volume chart</span>, free flow and postvoid residual (PVR). A normal free flow lets an abnormal invasive flow be recognised as artefact."], [5, "l", 23, "Ch 107 · Urodynamic and Videourodynamic Evaluation of the Lower Urinary Tract", "3 · Non-invasive components", "Minimum voided volume is <span class=\"key\">VV 150 mL</span>, because maximum flow (Qmax) is linear above it and hyperbolic below."], [5, "p", 23, "Ch 107 · Urodynamic and Videourodynamic Evaluation of the Lower Urinary Tract", "4 · Equipment, transducers and quality control", "<b>Quality control <span class=\"dag\">†</span></b> (ICS Good Urodynamic Practice): zero to atmosphere; flush air; resting Pves and Pabd physiological and similar (Pdet near 0). <b>Cough test</b> before filling, at intervals and before voiding: equal spikes confirm transmission; a biphasic Pdet spike means re-flush or reposition. Artefacts: rectal contractions (unexplained fall in Pdet), catheter displacement, kinked tubing, stream hitting the funnel edge."], [5, "l", 24, "Ch 107 · Urodynamic and Videourodynamic Evaluation of the Lower Urinary Tract", "5 · Filling cystometry (CMG)", "Standard adult filling is <span class=\"key\">30–100 mL/min</span>; <span class=\"dag\">†</span>the ICS physiological rate is &lt; body weight (kg)/4 mL/min. Neurogenic bladders: physiological rate, body-warm saline (European Association of Urology, EAU). DO is commoner upright."], [5, "l", 24, "Ch 107 · Urodynamic and Videourodynamic Evaluation of the Lower Urinary Tract", "5 · Filling cystometry (CMG)", "Absence does not exclude it: <span class=\"key\">up to 50%</span> of women with urgency urinary incontinence (UUI) show no DO. Some asymptomatic volunteers do show it."], [5, "l", 24, "Ch 107 · Urodynamic and Videourodynamic Evaluation of the Lower Urinary Tract", "5 · Filling cystometry (CMG)", "Storage pressure <span class=\"key\">&gt; 40 cmH₂O</span> itself leads to upper-tract damage."], [5, "r", 24, "Ch 107 · Urodynamic and Videourodynamic Evaluation of the Lower Urinary Tract", "6 · Leak point pressures", "<span class=\"key\">&lt; 60</span> · ISD"], [5, "l", 25, "Ch 107 · Urodynamic and Videourodynamic Evaluation of the Lower Urinary Tract", "6 · Leak point pressures", "<span class=\"key\">DLPP &gt; 40 cmH₂O</span> is not a validated safe cut-off (20 is more sensitive in children), so aim <b>as low as achievable</b>."], [5, "l", 25, "Ch 107 · Urodynamic and Videourodynamic Evaluation of the Lower Urinary Tract", "7 · Urethral pressure profilometry (UPP)", "<span class=\"key\">MUCP ≤ 20 cmH₂O</span> means ISD (\"type III\" SUI) and predicts sling or suspension failure."], [5, "r", 25, "Ch 107 · Urodynamic and Videourodynamic Evaluation of the Lower Urinary Tract", "8 · Pressure–flow studies (PFS)", "<b>Bladder outlet obstruction index (BOOI)</b> · PdetQmax − 2Qmax · <span class=\"key\">&gt; 40 obstructed · 20–40 equivocal · &lt; 20 unobstructed</span>"], [5, "r", 25, "Ch 107 · Urodynamic and Videourodynamic Evaluation of the Lower Urinary Tract", "8 · Pressure–flow studies (PFS)", "<b>Bladder contractility index (BCI)</b> · PdetQmax + 5Qmax · <span class=\"key\">&gt; 150 strong · 100–150 normal · &lt; 100 weak</span>"], [5, "l", 26, "Ch 107 · Urodynamic and Videourodynamic Evaluation of the Lower Urinary Tract", "8 · Pressure–flow studies (PFS)", "<span class=\"tag\">MCQ</span> Bethanechol supersensitivity test (Lapides; Cannon's law): 2.5 mg subcutaneously; a rise <span class=\"key\">≥ 15 cmH₂O</span> at 100 mL is positive (neurogenic). Unreliable."], [5, "p", 28, "Ch 109 · Neuromuscular Dysfunction of the Lower Urinary Tract", "1 · Principles and classification", "Dyssynergia appears only when the lesion lies <b>between the pons and the sacral cord</b>. An open bladder neck marks autonomic (MSA, radical pelvic surgery, myelodysplasia) or sacral damage. PD and MSA share the detrusor pattern but <b>not the outlet</b>."], [5, "l", 30, "Ch 109 · Neuromuscular Dysfunction of the Lower Urinary Tract", "3 · Spinal cord disease", "Spinal shock usually lasts <span class=\"key\">6–12 weeks</span>. Reflexes return together with the lower-limb deep tendon reflexes."], [5, "l", 30, "Ch 109 · Neuromuscular Dysfunction of the Lower Urinary Tract", "3 · Spinal cord disease", "Smooth sphincter dyssynergia occurs with cord lesions at <span class=\"key\">T7–T8</span> (column T6) or above."], [5, "a", 31, "Ch 109 · Neuromuscular Dysfunction of the Lower Urinary Tract", "3 · Spinal cord disease", "<ol>\n<li><span class=\"dag\">†</span>Sit the patient upright and loosen clothing.</li>\n<li><b>Remove the stimulus</b>: drain the bladder, unblock the catheter, empty the rectum.</li>\n<li>If blood pressure stays high, apply nitroglycerin 2% paste above the lesion (first line).</li>\n<li>If it still persists, give labetalol or intravenous nitroprusside.</li>\n<li>For prophylaxis, give terazosin or prazosin (α1-blockers).</li>\n<li>If intractable, consider sacral rhizotomy, sympathectomy or cordectomy.</li>\n</ol>"], [5, "l", 31, "Ch 109 · Neuromuscular Dysfunction of the Lower Urinary Tract", "4 · Lesions distal to the cord", "<b>Decompression within <span class=\"key\">48 h</span></b> gives better urinary and rectal recovery. The sphincter recovers before the detrusor."], [5, "p", 32, "Ch 109 · Neuromuscular Dysfunction of the Lower Urinary Tract", "4 · Lesions distal to the cord", "Distal lesions hit the peripheral reflex arc, giving areflexia with a non-relaxing or fixed outlet. Compliance falls only when preganglionic parasympathetic motor fibres are damaged. Hence urgent decompression, waiting and CIC outrank outlet surgery."], [5, "l", 32, "Ch 109 · Neuromuscular Dysfunction of the Lower Urinary Tract", "5 · Specific functional and miscellaneous conditions", "<b>Non-neurogenic chronic retention</b> is PVR ≥<span class=\"key\">300 mL</span> persisting ≥6 months on ≥2 occasions. High-risk patients (hydronephrosis, chronic kidney disease, urinary tract infection [UTI]) need drainage; suprapubic is better than urethral long term."], [5, "p", 33, "Ch 109 · Neuromuscular Dysfunction of the Lower Urinary Tract", "6 · Evaluation and risk stratification", "Low risk needs no routine imaging, renal function or UDS. DO alone fits low risk (suprapontine, synergic); high risk means DO with infrapontine pressure consequences. Risk is judged by <b>pressure, compliance and upper tracts</b>, not by diagnosis."], [5, "a", 34, "Ch 109 · Neuromuscular Dysfunction of the Lower Urinary Tract", "7 · Management", "<ol>\n<li>Aim for low-pressure storage with regular emptying: CIC with an antimuscarinic or β3 agonist.</li>\n<li>If refractory, give intradetrusor onabotulinumtoxinA.</li>\n<li>In selected patients, try neuromodulation.</li>\n<li>If these fail, do augmentation or continent diversion.</li>\n<li>As a last resort, do bladder neck closure with a suprapubic catheter, ileovesicostomy or incontinent diversion.</li>\n</ol>"], [5, "l", 34, "Ch 109 · Neuromuscular Dysfunction of the Lower Urinary Tract", "7 · Management", "<b>CIC is the gold standard</b>; keep volumes &lt;<span class=\"key\">500 mL</span>. Credé and Valsalva are not recommended."], [5, "r", 35, "Ch 110 · Overactive Bladder", "1 · Definitions and terminology", "Increased daytime frequency · Patient considers they void too often by day; upper normal <span class=\"key\">7</span> voids"], [5, "l", 35, "Ch 110 · Overactive Bladder", "1 · Definitions and terminology", "<b>Bother</b>: <b>urgency urinary incontinence (UUI) is the most bothersome lower urinary tract symptom (LUTS) in both sexes</b>. Frequency bothers at ≥<span class=\"key\">8</span> daytime voids, nocturia at ≥<span class=\"key\">2</span>."], [5, "l", 36, "Ch 110 · Overactive Bladder", "2 · Epidemiology and burden", "Adult OAB affects ≈ <span class=\"key\">12–29%</span>: the loosest definition (EpiLUTS) gives the highest figure, strict ICS (EPIC) the lowest."], [5, "l", 36, "Ch 110 · Overactive Bladder", "2 · Epidemiology and burden", "Fewer than half tell a clinician. ~<span class=\"key\">92%</span> stop the first antimuscarinic within 2 years, because of <b>unmet expectations</b> more than side effects, and side effects more than cost."], [5, "l", 36, "Ch 110 · Overactive Bladder", "3 · Pathophysiology", "<b>DO is no longer the sine qua non</b>: only ~half with DO have urgency, and <span class=\"key\">44–69%</span> with urgency show DO."], [5, "p", 36, "Ch 110 · Overactive Bladder", "3 · Pathophysiology", "Final common pathway: more afferent signal reaches awareness. The bladder or a neighbour turns it up, or the CNS fails to turn it down. Hence DO and obstruction correlate only loosely with OAB."], [5, "l", 36, "Ch 110 · Overactive Bladder", "5 · Clinical assessment", "<b>History</b>: bother; SUI; voiding symptoms; haematuria; fluids and caffeine; occult neurology (new OAB with erectile dysfunction or tremor); pelvic surgery or radiotherapy; bowel (faecal incontinence in ~<span class=\"key\">50%</span> of women with OAB); drugs; polyuria (diabetes, sleep apnoea, lithium)."], [5, "l", 37, "Ch 110 · Overactive Bladder", "5 · Clinical assessment", "Questionnaires: ICIQ-OAB with ICIQ-OABqol; AUA/SUFU suggest UDI-6, IIQ or OAB-q. <span class=\"tag\">MCQ</span> OAB-V8 is a screening tool, not a severity score."], [5, "l", 37, "Ch 110 · Overactive Bladder", "6 · Urodynamics (UDS)", "<b>Assess emptying</b>: each <span class=\"key\">10 mL</span> of PVR raises the risk of catheterisation after onabotulinumtoxinA by <span class=\"key\">27%</span>. DO persists in up to <span class=\"key\">60%</span> after transurethral resection of the prostate (TURP)."], [5, "l", 37, "Ch 110 · Overactive Bladder", "7 · Management", "Set <b>realistic expectations</b>: improvement, not cure. AUA/SUFU lines are <b>not a compulsory sequence</b>; allow <span class=\"key\">4–12 weeks</span> per therapy."], [5, "a", 38, "Ch 110 · Overactive Bladder", "7 · Management", "<ol>\n<li>Confirm OAB and exclude mimics.</li>\n<li>Educate, then start conservative measures.</li>\n<li>If not enough, add drugs.</li>\n<li>If drugs fail, offer tibial nerve stimulation, sacral neuromodulation or onabotulinumtoxinA.</li>\n<li>Rarely, do augmentation or diversion.</li>\n<li>Reassess at every step.</li>\n</ol>"], [5, "l", 38, "Ch 110 · Overactive Bladder", "7 · Management", "Reducing fluid by ~<span class=\"key\">25%</span> helps. Cutting caffeine improves urgency and frequency, but not consistently UUI."], [5, "l", 38, "Ch 110 · Overactive Bladder", "7 · Management", "Pelvic floor muscle training (PFMT) with bladder training reduces leaks by <span class=\"key\">50–80%</span>."], [5, "l", 38, "Ch 110 · Overactive Bladder", "7 · Management", "In <b>dementia</b>, antimuscarinic use &gt;<span class=\"key\">3 months</span> raises risk by 10–65%, so prefer a β3 agonist."], [5, "p", 38, "Ch 110 · Overactive Bladder", "7 · Management", "Escalate by invasiveness and reversibility, not severity alone. OAB is benign, so patient goals, frailty and PVR decide how far to climb."], [5, "l", 39, "Ch 111 · Underactive Detrusor", "1 · Definitions and symptoms", "A significant postvoid residual (PVR) is not agreed; one proposal is over <span class=\"key\">40%</span> of functional capacity (voided plus PVR)."], [5, "p", 39, "Ch 111 · Underactive Detrusor", "1 · Definitions and symptoms", "<b>Sensation decides the picture.</b> Absent sensation makes an infrequent voider; with poor emptying, overflow is worse at night because the urethra relaxes in sleep. Preserved sensation makes a frequent voider with incomplete emptying and nocturia. DUA may be asymptomatic."], [5, "l", 39, "Ch 111 · Underactive Detrusor", "2 · Epidemiology", "UDS series find DUA in men under 50 in <span class=\"key\">9–28%</span>, men over 70 in ~<span class=\"key\">48%</span> and women in 12–45%."], [5, "r", 41, "Ch 111 · Underactive Detrusor", "4 · Diagnosis", "<b>Bladder contractility index (BCI)</b> (Abrams) · Pdet@Qmax + 5Qmax · &gt;150 strong; 100–150 normal; <span class=\"key\">&lt;100 weak</span>; male-derived"], [5, "a", 41, "Ch 111 · Underactive Detrusor", "5 · Management", "<ol>\n<li>Evaluate: diary, digital rectal examination, urinalysis, flow, PVR.</li>\n<li>If there is a neurological deficit, then do spinal MRI.</li>\n<li>Stop offending drugs; treat constipation.</li>\n<li>Timed or double voiding.</li>\n<li>Lower outlet resistance where relevant.</li>\n<li>If PVR is high, then ISC; if ISC is impossible, then a suprapubic catheter.</li>\n<li>Selected patients: sacral neuromodulation (SNM), outlet surgery, diversion.</li>\n</ol>"], [5, "p", 42, "Ch 111 · Underactive Detrusor", "5 · Management", "Every therapy needs a surviving link: Brindley needs efferents and muscle; neuromodulation and electrotherapy need afferents and muscle. <b>Preserved sensation predicts response</b> to bethanechol, toxin and electrotherapy."], [5, "l", 42, "Ch 111 · Underactive Detrusor", "5 · Management", "Outcome in retention is poor with voiding pressure under <span class=\"key\">45</span> cm H₂O, age over <span class=\"key\">80</span> or PVR over <span class=\"key\">1500 mL</span>."], [5, "l", 43, "Ch 113 · Pharmacologic Management of Lower Urinary Tract Storage and Emptying Failure", "2 · Antimuscarinics and β3-agonists", "Mirabegron goes from 25 to 50 mg od; avoid in severe uncontrolled hypertension (≥<span class=\"key\">180/110</span> mm Hg). Vibegron needs no titration and had no blood pressure (BP) effect."], [5, "a", 44, "Ch 113 · Pharmacologic Management of Lower Urinary Tract Storage and Emptying Failure", "2 · Antimuscarinics and β3-agonists", "<ol>\n<li><span class=\"dag\">†</span>OAB: behavioural therapy, then an antimuscarinic <i>or</i> a β3-agonist; if elderly or at cognitive risk, then choose the β3-agonist first.</li>\n<li>If the response is poor, then switch or combine.</li>\n<li>If refractory, then onabotA 100 U, sacral neuromodulation (SNM) or percutaneous tibial nerve stimulation (PTNS).</li>\n<li>Last resort: augmentation cystoplasty.</li>\n</ol>"], [5, "p", 44, "Ch 113 · Pharmacologic Management of Lower Urinary Tract Storage and Emptying Failure", "3 · Combination therapy", "Combination beats solifenacin 5 mg and either drug alone. In non-responders it <b>equals</b> solifenacin 10 mg with less dry mouth: it gains <b>tolerability, not efficacy</b>, over dose escalation. Heart rate, BP, QT and PVR are unchanged; constipation roughly doubles. Benefit holds at age ≥65 or ≥75."], [5, "l", 44, "Ch 113 · Pharmacologic Management of Lower Urinary Tract Storage and Emptying Failure", "4 · Intradetrusor onabotulinumtoxinA (onabotA)", "The dose is <span class=\"key\">100 U</span> for idiopathic OAB and <span class=\"key\">200 U</span> for neurogenic detrusor overactivity (NDO)."], [5, "l", 45, "Ch 113 · Pharmacologic Management of Lower Urinary Tract Storage and Emptying Failure", "5 · Nocturia: desmopressin †", "Low-dose sublingual: women 25 µg, men 50 µg; key risk rises at age ≥<span class=\"key\">65</span>."], [5, "l", 47, "Ch 115 · Electrical Stimulation and Neuromodulation in Storage and Emptying Failure", "1 · Evolution and mechanism", "Milestones <span class=\"tag\">MCQ</span>: sacral neuromodulation (SNM) ~1985 (Tanagho, Schmidt); first tibial nerve stimulation 1983 (McGuire); percutaneous tibial nerve stimulation (PTNS) from acupuncture point <b>SP6</b>; first tibial implant 2006."], [5, "l", 48, "Ch 115 · Electrical Stimulation and Neuromodulation in Storage and Emptying Failure", "2 · Sacral neuromodulation", "Test success is ≥<span class=\"key\">50%</span> improvement in ≥1 diary parameter against a 3–5-day baseline; in retention, catheterisation falls ≥50%, ideally to none."], [5, "l", 48, "Ch 115 · Electrical Stimulation and Neuromodulation in Storage and Emptying Failure", "2 · Sacral neuromodulation", "Battery: non-rechargeable ≥<span class=\"key\">10 years</span>, rechargeable ≥15 years. Devices are whole-body <b>MRI</b>-conditional at <span class=\"key\">1.5 and 3 T</span>; at replacement remove all old components."], [5, "a", 48, "Ch 115 · Electrical Stimulation and Neuromodulation in Storage and Emptying Failure", "3 · Tibial nerve stimulation", "<ol>\n<li>Supine; insert a 34-gauge needle ≈3–4 cm above the medial malleolus, behind the tibia, at 60–90°; ground pad on the same leg.</li>\n<li>Stimulate at 20 Hz, 200 μs, 0–10 mA.</li>\n<li>Confirm <b>great-toe flexion/toe fanning</b> or sole tingling.</li>\n<li>Give <b><span class=\"key\">12 weekly sessions × 30 min</span></b>, then taper to maintenance.</li>\n</ol>"], [5, "p", 50, "★ Putting it together: voiding dysfunction decisions", "B · Lesion level and urodynamics", "Dyssynergia occurs only with lesions between pons and sacral cord. A leak point or storage pressure ≥40 cmH₂O, or poor compliance, threatens the kidneys: treat <span class=\"xref\">(see Ch 107, 109)</span>."], [5, "a", 50, "★ Putting it together: voiding dysfunction decisions", "C · OAB ladder", "<ol>\n<li>Behavioural: fluids/caffeine, bladder training, PFMT, constipation, drug review.</li>\n<li>Antimuscarinic or β3-agonist; β3 or low-CNS agent in the elderly. If partial response, then combine. Check postvoid residual (PVR) in obstructed men <span class=\"xref\">(see Ch 113)</span>.</li>\n<li>If refractory, then onabotulinumtoxinA (100 U idiopathic, 200 U neurogenic; warn about CIC), tibial nerve stimulation or SNM (staged test, ≥50% improvement) <span class=\"xref\">(see Ch 115)</span>.</li>\n<li>Last resort: augmentation or diversion.</li>\n</ol>"], [5, "a", 51, "★ Putting it together: voiding dysfunction decisions", "D · SCI bladder", "<ol>\n<li><b>Spinal shock</b>: catheter until reflexes return.</li>\n<li><b>Then</b> urodynamics; CIC plus antimuscarinic for high-pressure neurogenic overactivity; toxin.</li>\n<li>If CIC is impossible, then sphincterotomy or diversion. Survey upper tracts lifelong.</li>\n<li><b>AD</b> (lesion above T6): hypertension, bradycardia, headache, flushing. Sit up, loosen clothing, remove the stimulus (catheter, bladder, bowel), short-acting antihypertensive <span class=\"xref\">(see Ch 109)</span>.</li>\n</ol>"], [6, "l", 2, "Ch 112 · Nocturia", "2 · Why nocturia matters", "<b>It is common</b>: up to <span class=\"key\">3 in 5</span> people &gt;70 years void ≥2 times nightly, and age is the most robust correlate."], [6, "l", 2, "Ch 112 · Nocturia", "2 · Why nocturia matters", "The Boston Area Community Health survey <span class=\"tag\">MCQ</span> found higher rates in Black and Hispanic people, partly explained by socio-economic status."], [6, "l", 3, "Ch 112 · Nocturia", "2 · Why nocturia matters", "<b>Bother</b> is reported by most people with ≥<span class=\"key\">2</span> voids, but <b>any nocturia that brings a patient to a urologist is clinically significant</b>."], [6, "l", 3, "Ch 112 · Nocturia", "2 · Why nocturia matters", "Most first voids occur within <span class=\"key\">2–3 h</span> of sleep onset, so they break slow-wave sleep and cause daytime fatigue."], [6, "p", 3, "Ch 112 · Nocturia", "2 · Why nocturia matters", "The first void breaks restorative slow-wave sleep; the symptom may be the visible edge of systemic disease."], [6, "r", 3, "Ch 112 · Nocturia", "3 · Pathophysiology — production, capacity and sleep", "NPi (ICS) · &gt;<span class=\"key\">20%</span> in young adults to &gt;<span class=\"key\">33%</span> in older adults · Most used, but discriminates poorly"], [6, "r", 3, "Ch 112 · Nocturia", "3 · Pathophysiology — production, capacity and sleep", "NUP (ICS alternative) · &gt;<span class=\"key\">90 mL/h</span> · More specific for production-driven nocturia"], [6, "r", 3, "Ch 112 · Nocturia", "3 · Pathophysiology — production, capacity and sleep", "Global polyuria · &gt;<span class=\"key\">40 mL/kg/24 h</span> (&gt;2.8 L at 70 kg) · Uncommon but serious; <b>always investigate</b>"], [6, "l", 3, "Ch 112 · Nocturia", "3 · Pathophysiology — production, capacity and sleep", "<b>Krimpen study</b> <span class=\"tag\">MCQ</span>: NPi &gt;33% was found in 92% of older men with ≥2 voids, but also in 70% of men <b>without</b> nocturia."], [6, "l", 3, "Ch 112 · Nocturia", "3 · Pathophysiology — production, capacity and sleep", "Normal capacity is usually &gt;300–400 mL. A capacity of <span class=\"key\">150–300 mL</span> suggests diminished capacity."], [6, "a", 3, "Ch 112 · Nocturia", "3 · Pathophysiology — production, capacity and sleep", "<p>Worked example:</p><ol>\n<li>NUV is 800 mL and MVV is 200 mL, so Ni = 4.</li>\n<li>PNV = Ni − 1 = 3.</li>\n<li>The diary shows 6 night voids, so NBCi = 6 − 3 = <b>3</b>: the patient voids well below capacity.</li>\n</ol>"], [6, "a", 4, "Ch 112 · Nocturia", "4 · The bladder diary", "<ol>\n<li>Give the patient a measuring container.</li>\n<li>Record the time and volume of every void.</li>\n<li>Record the time, volume and type of every drink.</li>\n<li>Mark bedtime (intending to sleep) and rising time.</li>\n<li>Grade urgency and note leakage for each void.</li>\n</ol>"], [6, "l", 4, "Ch 112 · Nocturia", "4 · The bladder diary", "Duration: EAU advises <span class=\"key\">3 days</span> (Male guideline: at least 3). Because of \"diary fatigue\", fewer than half complete it."], [6, "p", 4, "Ch 112 · Nocturia", "4 · The bladder diary", "Every cause works through production against capacity, gated by sleep; their ratio (Ni) predicts severity better than either alone."], [6, "l", 5, "Ch 112 · Nocturia", "6 · Sleep disorders", "CPAP reduces nocturia by up to ≈<span class=\"key\">2 voids</span> in moderate–severe OSA, which is among the <b>largest effects of any intervention</b>. EAU Female (strong): refer suspected OSA to a sleep clinic."], [6, "l", 5, "Ch 112 · Nocturia", "6 · Sleep disorders", "<b>STOP-BANG</b> scores Snoring, Tired, Observed apnoea, Pressure, BMI &gt;<span class=\"key\">35</span>, Age &gt;<span class=\"key\">50</span>, Neck &gt;<span class=\"key\">40 cm</span> and Gender male. A score ≥<span class=\"key\">3</span> means high risk; the tool is highly sensitive."], [6, "p", 5, "Ch 112 · Nocturia", "6 · Sleep disorders", "OSA raises production, lowers capacity and fragments sleep — hence one of the largest nocturia responses to treatment."], [6, "l", 6, "Ch 112 · Nocturia", "7 · Comorbidities", "<b>Hypertension</b>: blood pressure normally dips <span class=\"key\">10–20%</span> in sleep. <b>Non-dipping</b>, from renin–angiotensin–aldosterone dysregulation, causes <b>nocturnal natriuresis</b>."], [6, "p", 6, "Ch 112 · Nocturia", "7 · Comorbidities", "Comorbidity acts through the kidney (third-spaced fluid, nocturnal natriuresis, failed antidiuresis). Global polyuria and non-bothersome nocturia both warrant looking beyond urology."], [6, "l", 6, "Ch 112 · Nocturia", "8 · Actions — lifestyle and behaviour", "Restrict fluid, caffeine and alcohol from <span class=\"key\">3–4 h</span> before sleep. Older adults should drink more by day. Patients with high baseline intake gain most."], [6, "l", 6, "Ch 112 · Nocturia", "9 · Lower urinary tract dysfunction", "Nocturia accompanies bladder outlet obstruction (BOO), OAB (up to <span class=\"key\">85%</span> of trial participants), detrusor underactivity, neurogenic bladder and genitourinary syndrome of menopause (GSM) <span class=\"xref\">See Voiding Dysfunction book, Ch 110</span>."], [6, "r", 7, "Ch 112 · Nocturia", "9 · Lower urinary tract dysfunction", "5ARI · Offer with LUTS and prostate &gt;<span class=\"key\">40 mL</span> (weak) · —"], [6, "p", 7, "Ch 112 · Nocturia", "9 · Lower urinary tract dysfunction", "LUT drugs act on capacity and outflow, but most nocturia is production-driven — effects are statistically significant, clinically small. Treat the mechanism, not the organ."], [6, "a", 8, "Ch 112 · Nocturia", "11 · Management algorithm and r
