iverticula", "Treat a diverticular tumour as potentially invasive from the outset — missing muscle explains early spread, perforation risk and inaccurate staging."], [4, "a", 52, "Ch 122 · Bladder and Female Urethral Diverticula", "4 · Bladder diverticula — management", "<p>Diverticulum → history, cystoscopy, cytology, VCUG → suspicious lesion: biopsy → cancer therapy; none: upper tract imaging → HUN or symptoms → urodynamics → treat BOO → reassess → persistent problem from diverticulum → fit: diverticulectomy; unfit: CIC → asymptomatic, uncomplicated: surveillance</p>"], [4, "l", 53, "Ch 122 · Bladder and Female Urethral Diverticula", "6 · UD — presentation and evaluation", "All three Ds in only ~<span class=\"key\">5%</span>. Irritative LUTS, pain, recurrent UTI; mass (~⅓), incontinence (~⅓), haematuria, discharge, retention; 10–20% asymptomatic. <b>Size does not track symptoms</b>; misdiagnosed for years (IC, vulvodynia) — examine."], [4, "p", 53, "Ch 122 · Bladder and Female Urethral Diverticula", "6 · UD — presentation and evaluation", "UD symptoms mimic common LUTS and do not track size — suspicion and examination make the diagnosis; imaging must confirm and <b>map</b>, especially extension towards the bladder neck (bladder/ureteric injury, postoperative incontinence)."], [4, "p", 54, "Ch 122 · Bladder and Female Urethral Diverticula", "7 · Differential diagnosis of periurethral masses", "Two questions sort most periurethral masses: does it communicate (only UD), and where is it relative to the meatus (Skene, prolapse, caruncle at the meatus); firm mobile solid = leiomyoma."], [4, "l", 54, "Ch 122 · Bladder and Female Urethral Diverticula", "8 · Classification and SUI", "De novo significant SUI <span class=\"key\">7–16%</span>; risk: ≥30 mm, proximal, circumferential, short urethra. Most settles within 12 months."], [4, "a", 54, "Ch 122 · Bladder and Female Urethral Diverticula", "9 · Surgical repair of UD", "<p>Lithotomy, Foley; <b>SPC at the start</b> (never end — crosses repair) → <b>inverted-U incision</b> → raise vaginal flap off fascia → incise fascia <b>transversely</b>, raise flaps → excise entire sac to ostium incl. inflamed urethral edge → watertight urethral closure over catheter (as small as 12 Fr) → fascia <b>perpendicular</b>, obliterating dead space → ± <b>Martius</b> (poor tissue, attenuated fascia) → advance vaginal flap (3 layers; 4 with Martius) → antibiotic pack</p>"], [4, "r", 55, "Ch 122 · Bladder and Female Urethral Diverticula", "10 · Complications", "Recurrent UD · <span class=\"key\">10–22%</span> (pooled ~10%) · Incomplete excision, dead space; circumferential, complex, proximal, multiple"], [4, "p", 55, "Ch 122 · Bladder and Female Urethral Diverticula", "10 · Complications", "Complete sac removal, watertight closure, off-axis fascia and obliterated dead space all prevent the three failures: recurrence, fistula, incontinence."], [4, "l", 56, "Ch 77 · Sexual Function and Dysfunction in the Female", "1 · Functional anatomy", "<b>Skene</b> = prostate homologue (PSA-positive); <b>Bartholin</b> = bulbourethral homologue. <span class=\"tag\">MCQ</span> G-spot has no agreed anatomical basis."], [4, "a", 56, "Ch 77 · Sexual Function and Dysfunction in the Female", "2 · Physiology of the sexual response", "<p>Touch on clitoral complex → pudendal (somatic) afferents → <b>S2–S4</b> → parasympathetic efferents (nervi erigentes → cavernous nerves) → arteriolar dilatation → engorgement + lubrication</p>"], [4, "p", 56, "Ch 77 · Sexual Function and Dysfunction in the Female", "2 · Physiology of the sexual response", "Pudendal injury removes the <b>trigger</b>; pelvic plexus/cavernous nerve injury removes the <b>response</b>."], [4, "a", 56, "Ch 77 · Sexual Function and Dysfunction in the Female", "2 · Physiology of the sexual response", "<p>nNOS → NO → guanylate cyclase → cGMP → ↓ Ca²⁺ → smooth muscle relaxation → engorgement. PDE5 degrades cGMP; arginase consumes NOS substrate; VIP works with NO.</p>"], [4, "r", 57, "Ch 77 · Sexual Function and Dysfunction in the Female", "2 · Physiology of the sexual response", "Deficiency · Thin, dry, fibrotic vagina → dyspareunia; risk ↑ at oestradiol <span class=\"key\">≤50 pg/mL</span> · ↓ Libido, arousal, sensation, orgasm"], [4, "p", 57, "Ch 77 · Sexual Function and Dysfunction in the Female", "2 · Physiology of the sexual response", "Under Basson, lack of <i>spontaneous</i> desire (common after menopause) is not a dysfunction — the reason DSM-5 merged desire and arousal."], [4, "r", 57, "Ch 77 · Sexual Function and Dysfunction in the Female", "3 · Classification", "Desire + arousal · HSDD; FSAD; sexual aversion disorder · <b>FSIAD</b>: <span class=\"key\">≥3 of 6</span> — ↓ interest; ↓ fantasies; ↓ initiation/receptivity; ↓ pleasure, ↓ response to cues, ↓ sensation (in 75–100% of encounters). Aversion dropped"], [4, "r", 57, "Ch 77 · Sexual Function and Dysfunction in the Female", "3 · Classification", "Orgasm · FOD after normal excitement · FOD: delay, infrequency, absence <b>or ↓ intensity</b> in <span class=\"key\">75–100%</span>; normal-excitement requirement removed"], [4, "l", 57, "Ch 77 · Sexual Function and Dysfunction in the Female", "3 · Classification", "~<span class=\"key\">40%</span> lifetime sexual problem; ~<span class=\"key\">8–12%</span> distressing disorder. <b>HSDD commonest</b>, FOD second."], [4, "l", 57, "Ch 77 · Sexual Function and Dysfunction in the Female", "4 · Causes (biopsychosocial)", "<b>Drugs</b>: SSRIs, SNRIs, antipsychotics (↑ prolactin); β-blockers, ACE inhibitors, CCBs, thiazides, spironolactone; antiandrogens, GnRH agonists; opiates, alcohol. <span class=\"tag\">MCQ</span> Combined hormonal contraceptives: ↓ ovarian testosterone + ↑ SHBG; oral oestrogens, tamoxifen, thyroxine also ↑ SHBG."], [4, "a", 58, "Ch 77 · Sexual Function and Dysfunction in the Female", "5 · Evaluation", "<p><b>PLISSIT</b>: <b>P</b>ermission → <b>L</b>imited <b>I</b>nformation (cycle, ageing, drugs) → <b>S</b>pecific <b>S</b>uggestions (lubricants, <b>vaginal oestrogen</b>, positions, vibrators) → <b>I</b>ntensive <b>T</b>herapy = <b>referral</b></p>"], [4, "a", 58, "Ch 77 · Sexual Function and Dysfunction in the Female", "6 · Hypoactive sexual desire disorder", "<p>Screen (DSDS) → history + examination → <b>correct modifiable factors</b> (drugs, depression, GSM, pain, partner's ED) → education / sex or couples therapy → persistent <b>generalised acquired</b> HSDD → drug → review at 8 weeks. <b>Refer</b>: situational HSDD failing counselling, psychiatric illness, sexual trauma</p>"], [4, "r", 59, "Ch 77 · Sexual Function and Dysfunction in the Female", "6 · Hypoactive sexual desire disorder", "Dose · <span class=\"key\">100 mg at bedtime</span> daily; ~half respond by 8 weeks · <span class=\"key\">1.75 mg subcutaneous</span> ≥45 min before sex; ≤1/24 h, <span class=\"key\">≤8/month</span>"], [4, "l", 59, "Ch 77 · Sexual Function and Dysfunction in the Female", "8 · Female orgasmic disorder", "<b>Education is the cornerstone</b>; directed masturbation, sensate focus, mindfulness. Arousal intact → more stimulation (vibrators; <span class=\"tag\">MCQ</span> EROS clitoral vacuum = only FDA-cleared FSD device). Hormones if postmenopausal deficiency; surgery for clitoral phimosis/adhesions."], [4, "a", 59, "Ch 77 · Sexual Function and Dysfunction in the Female", "8 · Female orgasmic disorder", "<p><b>SSRI-induced dysfunction</b>: present before treatment? → wait for tolerance (~4 months) → persists 3–6 months: lower dose or switch/add <b>bupropion</b> or mirtazapine; consider sildenafil</p>"], [4, "l", 60, "Ch 77 · Sexual Function and Dysfunction in the Female", "9 · Genito-pelvic pain / penetration disorder", "<b>Vulvodynia</b>: vulval (burning) pain <span class=\"key\">≥3 months</span>, no cause; localised/generalised, provoked/unprovoked."], [4, "l", 60, "Ch 77 · Sexual Function and Dysfunction in the Female", "9 · Genito-pelvic pain / penetration disorder", "<b>Provoked vestibulodynia (PVD)</b> commonest (~<span class=\"key\">10–12%</span> of women; IBS, fibromyalgia). Primary: from first penetration (nulliparity, family history, enuresis, dysmenorrhoea). Secondary (~⅔): after pain-free sex; larger area, hood often most painful."], [4, "a", 60, "Ch 77 · Sexual Function and Dysfunction in the Female", "9 · Genito-pelvic pain / penetration disorder", "<p>Education + vulval care → lidocaine 5% or EMLA <b>10 min before intercourse</b> → <b>multimodal pelvic floor physical therapy</b> (myofascial release, trigger points, down-training, biofeedback, graded <b>dilators</b>, electrical stimulation) + psychological/couples therapy → vestibular oestrogen if hypo-oestrogenic → <b>vestibulectomy</b> for refractory localised PVD</p>"], [4, "a", 60, "Ch 77 · Sexual Function and Dysfunction in the Female", "9 · Genito-pelvic pain / penetration disorder", "<p>Non-hormonal lubricants/moisturisers + regular activity (NAMS first line) → <b>low-dose vaginal oestrogen</b> (<span class=\"dag\">†</span>minimal absorption, no progestogen) or <span class=\"dag\">†</span>vaginal DHEA (prasterone 6.5 mg nightly) or <span class=\"dag\">†</span>ospemifene 60 mg orally (SERM, vaginal agonist; if vaginal products impossible; VTE risk) → systemic HT if vasomotor symptoms</p>"], [4, "p", 60, "Ch 77 · Sexual Function and Dysfunction in the Female", "9 · Genito-pelvic pain / penetration disorder", "<span class=\"dag\">†</span>After <b>breast cancer</b>: non-hormonal first; vaginal oestrogen only after oncology discussion (aromatase inhibitors)."], [4, "l", 60, "Ch 77 · Sexual Function and Dysfunction in the Female", "10 · Pelvic surgery and sexual function", "<b>Radical cystectomy</b>: loss of desire &gt; orgasm &gt; dyspareunia &gt; lubrication; ~half can have intercourse. Preserve: (1) retrograde dissection saving NVBs on <b>lateral vaginal walls</b>; (2) divide urethra at <b>bladder neck</b> (clitoral supply); (3) keep vaginal dimensions. <b>Genital-sparing</b> (if oncologically safe): sex resumes <span class=\"key\">~6 vs 14 weeks</span>; diversion type irrelevant. A third of cancer patients want sex-therapy referral. <b>Never trade oncological control.</b> <span class=\"xref\">→ Ch 101</span>"], [4, "a", 62, "★ Putting it together: female pelvic decisions", "A · Incontinent woman", "<p><b>1. Classify</b> (history, diary): SUI, UUI, MUI, overflow, functional. Stress test, mobility, POP, PVR, urinalysis (<span class=\"xref\">→ Ch 105</span>).</p>\n<p><b>2. Urodynamics</b> not needed for uncomplicated demonstrable SUI (VALUE); use if mixed/unclear, voiding dysfunction, prior surgery, neurological, high-grade POP.</p>\n<p><b>3. Conservative first:</b> weight, fluids/caffeine, supervised PFMT, bladder training, pessary, postmenopausal vaginal oestrogen (<span class=\"xref\">→ Ch 114</span>).</p>\n<p><b>4. SUI surgery</b> if failed (<span class=\"xref\">→ Ch 116, 118</span>); UUI → drugs, botulinum toxin, neuromodulation.</p>"], [4, "a", 62, "★ Putting it together: female pelvic decisions", "C · Prolapse: which repair?", "<p><b>POP-Q</b>: leading edge stages; II = within 1 cm of hymen (<span class=\"xref\">→ Ch 105</span>).</p>\n<p>Asymptomatic → observe; symptomatic → pessary or surgery.</p>\n<p><b>Support the apex</b>: uterosacral/sacrospinous suspension or sacrocolpopexy (most durable) (<span class=\"xref\">→ Ch 117</span>).</p>\n<p><b>Frail, not sexually active</b> → colpocleisis.</p>\n<p><b>Occult SUI:</b> discuss concomitant sling (OPUS: fewer leaks, more complications).</p>"], [4, "p", 62, "★ Putting it together: female pelvic decisions", "D · Vesicovaginal fistula", "Double-dye, upper tract imaging, biopsy after radiation/cancer. Post-hysterectomy: supratrigonal, mostly vaginal (Latzko or layered); abdominal if ureter involved, large/high, or failed vaginal repair. Tension-free watertight layers, non-overlapping lines, vascularised flap (Martius vaginally, omentum abdominally) for poor/irradiated tissue, continuous drainage, then cystogram (<span class=\"xref\">→ Ch 121</span>)."], [4, "a", 63, "★ Putting it together: female pelvic decisions", "E · Mesh complications", "<p>1. Speculum + cystoscopy if suspected; may appear years later.</p>\n<p>2. Small exposure → oestrogen ± trimming; larger/symptomatic → excise, close.</p>\n<p>3. Mesh in bladder/urethra → remove, repair; no new mesh then.</p>\n<p>4. Remove enough to solve the problem; never asymptomatic mesh (<span class=\"xref\">→ Ch 119</span>).</p>"], [5, "l", 2, "Ch 102 · Surgical, Radiographic and Endoscopic Anatomy of the Male Pelvis", "1 · Bony pelvis", "Pelvic brim <span class=\"key\">50–60°</span> to horizontal. <b>Arcuate line</b> (promontory → pubis) separates false from true pelvis. Iliac crest at <b>L4</b>."], [5, "l", 2, "Ch 102 · Surgical, Radiographic and Endoscopic Anatomy of the Male Pelvis", "2 · Lower abdominal wall", "~<span class=\"key\">4 cm</span>; transmits <b>spermatic cord and ilioinguinal nerve</b>. Deep ring midway ASIS–pubic tubercle, <b>lateral to inferior epigastric vessels</b>; superficial ring superolateral to pubic tubercle."], [5, "l", 3, "Ch 102 · Surgical, Radiographic and Endoscopic Anatomy of the Male Pelvis", "4 · Perineum", "Perineal prostatectomy <span class=\"tag\">MCQ</span>: <b>Young</b> divides central tendon, leaves external sphincter on rectum; <b>Belt</b> passes <b>under</b> the external sphincter."], [5, "p", 4, "Ch 102 · Surgical, Radiographic and Endoscopic Anatomy of the Male Pelvis", "6 · Pelvic nerves", "Anterior scrotum is L1 (ilioinguinal, genitofemoral); posterior scrotum is sacral (pudendal, posterior femoral cutaneous)."], [5, "l", 4, "Ch 102 · Surgical, Radiographic and Endoscopic Anatomy of the Male Pelvis", "6 · Pelvic nerves", "NVB at <span class=\"key\">5 and 7 o'clock</span> at the apex; injury at prostatectomy or rectal resection → ED."], [5, "l", 4, "Ch 102 · Surgical, Radiographic and Endoscopic Anatomy of the Male Pelvis", "7 · Pelvic viscera", "Intramural ureter in <b>Waldeyer's sheath</b> <span class=\"key\">1.5–2 cm</span> oblique; narrow → stone impaction."], [5, "a", 5, "Ch 102 · Surgical, Radiographic and Endoscopic Anatomy of the Male Pelvis", "8 · Endoscopic anatomy", "<p>Flexible cystoscopy (local) → bladder, orifices, trigone → retroflex at neck (intravesical prostatic protrusion, hidden tumours) → verumontanum with ejaculatory ducts → external sphincter coapts just distal → bulbar urethra</p>"], [5, "p", 5, "Ch 102 · Surgical, Radiographic and Endoscopic Anatomy of the Male Pelvis", "8 · Endoscopic anatomy", "Verumontanum = sentinel at TURP: resection distal to it injures the external sphincter → incontinence."], [5, "l", 5, "Ch 102 · Surgical, Radiographic and Endoscopic Anatomy of the Male Pelvis", "9 · Radiographic anatomy", "Malignant node: rounded, heterogeneous; size most specific at ≥<span class=\"key\">1 cm</span> short axis."], [5, "l", 5, "Ch 102 · Surgical, Radiographic and Endoscopic Anatomy of the Male Pelvis", "9 · Radiographic anatomy", "<b>CT urogram</b>: excretory images at <span class=\"key\">7–10 min</span>; iliac-crossing narrowing, peristaltic gaps normal."], [5, "l", 5, "Ch 102 · Surgical, Radiographic and Endoscopic Anatomy of the Male Pelvis", "9 · Radiographic anatomy", "<b>MRI</b>: best soft-tissue contrast; T1 bone/gadolinium, T2 anatomy, prostate, pelvic floor. Distended bladder wall &gt;<span class=\"key\">3 mm</span> = thickening. External sphincter = T2-dark doughnut below apex."], [5, "p", 6, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "1 · Overview", "<b>Why single-organ therapy fails:</b> bladder and urethra act reciprocally — boosting contractility in detrusor underactivity fails unless the urethra relaxes. Afferent modulation acts on both (reduce for overactivity, augment for underactivity) → most promising therapeutic lever."], [5, "l", 6, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "2 · Functional anatomy", "Wall ≈ <span class=\"key\">50% collagen, 2% elastin</span>; types I, III, IV."], [5, "r", 6, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "2 · Functional anatomy", "Where · Intramural rhabdosphincter — <span class=\"key\">~50% of static urethral resistance</span> · Periurethral pelvic floor (mixed)"], [5, "r", 6, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "2 · Functional anatomy", "Rhabdosphincter mix · Male <span class=\"key\">65% slow / 35% fast</span>; female <span class=\"key\">87% slow / 13% fast</span>"], [5, "p", 7, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "3 · Urothelium: barrier and sensor", "Damaged urothelium causes symptoms twice over — <b>solute leak</b> into lamina propria and <b>altered signalling</b> (more ATP, less NO) to afferents."], [5, "a", 7, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "4 · Detrusor smooth muscle physiology", "<p>ACh → <b>M3</b> (Gq) → ↑ [Ca²⁺]i (L-type Ca²⁺ entry + PLC → IP3 → SR release) → Ca²⁺–calmodulin → MLCK → phosphorylates MLC20 → cross-bridge cycling → contraction → MLCP dephosphorylates as Ca²⁺ falls → relaxation</p>"], [5, "p", 8, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "4 · Detrusor smooth muscle physiology", "<b>Motor–sensory coupling:</b> spontaneous micromotions generate afferent bursts perceived as urgency. Antimuscarinics and mirabegron reduce non-voiding contractions and so sensory input — efferent and afferent functions are inseparable."], [5, "l", 9, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "6 · Peripheral innervation", "Parasympathetic <span class=\"key\">S2–S4</span>; sympathetic <span class=\"dag\">†</span><span class=\"key\">T10–L2</span>. Sympathetic ganglia: chain → inferior mesenteric → pelvic."], [5, "p", 9, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "7 · Central control", "<b>Lesion localisation:</b> forebrain → loss of tonic inhibition → DO, coordination preserved; pontine → retention; suprasacral cord → DO + <b>DSD</b>; sacral/cauda → decentralised, acontractile bladder <span class=\"xref\">→ Ch 104</span>."], [5, "a", 10, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "8 · Storage and emptying phases", "<p>Tension-receptor (Aδ) firing exceeds threshold → PAG/PMC switch flips (if cortex permits) → sympathetic and pudendal outflow off → <b>urethral sphincter relaxes first</b> + urethral smooth muscle relaxes (NO) → detrusor contracts (parasympathetic) → flow → urethral afferents reinforce contraction until empty</p>"], [5, "l", 10, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "8 · Storage and emptying phases", "SUI women void at Pdet at Qmax ≈ <span class=\"key\">19 cmH₂O</span>; healthy men ≈ <span class=\"key\">60–70 cmH₂O</span>. Low pressure in women ≠ impaired contractility; male nomograms not valid in women."], [5, "l", 10, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "9 · Urethral closure mechanisms", "Nicotinic blockade rarely lowers tone &gt;40%; α-blockade lowers urethral pressure by about <span class=\"key\">one third</span> → smooth muscle (α1A) tone matters."], [5, "p", 10, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "9 · Urethral closure mechanisms", "Continence = <b>active muscle tone + passive anatomical coaptation</b>. Integral theory → mid-urethral sling (MUS), the SUI standard, yet DeLancey's data suggest intrinsic sphincter function matters more than support <span class=\"xref\">→ Ch 109</span>."], [5, "l", 10, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "10 · Compliance", "Physiological filling keeps pressure <span class=\"key\">&lt;10 cmH₂O</span>. Determinants: passive viscoelasticity, active tone, geometry; <b>type III collagen straightens</b> with filling."], [5, "l", 11, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "10 · Compliance", "<span class=\"dag\">†</span>DLPP ≥ <span class=\"key\">40 cmH₂O</span> in low-compliance neurogenic bladder predicts upper tract damage <span class=\"xref\">→ Ch 104</span>."], [5, "l", 11, "Ch 103 · Physiology and Pharmacology of the Bladder and Urethra", "11 · Pathophysiology links", "<b>UAB</b> = symptom complex; detrusor underactivity = urodynamic finding; afferent loss may contribute. PVR ≥ <span class=\"key\">300 mL</span> warrants evaluation (also bothersome LUTS, hydronephrosis, renal insufficiency, culture-proven UTI); PVR &lt;300 mL does not prove normal contractility."], [5, "p", 12, "Ch 104 · Pathophysiology and Classification of Lower Urinary Tract Dysfunction", "2 · Pathophysiology", "UI can occur from ISD alone, <b>never from hypermobility alone</b>. <b>DeLancey's hammock</b>: firm suburethral layer lets abdominal pressure compress the urethra. In half of continent women the continence point is the <b>mid-urethra</b>. Male sphincteric incontinence resembles ISD."], [5, "p", 13, "Ch 104 · Pathophysiology and Classification of Lower Urinary Tract Dysfunction", "3 · Functional classification (Wein) — 2 × 2 table", "<ul>\n<li>Bladder underactivity appears under <b>both</b> storage (overflow) and emptying. <span class=\"tag\">MCQ</span></li>\n<li>α-agonist tightens outlet (storage); α-blocker relaxes it (emptying).</li>\n<li>OnabotulinumtoxinA: intradetrusor → storage; sphincteric → emptying.</li>\n<li>Naming the failure names the treatment family.</li>\n</ul>"], [5, "l", 14, "Ch 104 · Pathophysiology and Classification of Lower Urinary Tract Dysfunction", "6 · Nocturia and neurogenic dysfunction", "<b>Polyuria</b> &gt;<span class=\"key\">40 mL/kg/24 h</span>. <b>Nocturnal polyuria</b>: night ÷ 24-h volume &gt;<span class=\"key\">20% young, &gt;33% elderly</span>; loss of nocturnal vasopressin rise or sleep apnoea."], [5, "p", 14, "Ch 104 · Pathophysiology and Classification of Lower Urinary Tract Dysfunction", "6 · Nocturia and neurogenic dysfunction", "DSD needs an intact sacral arc <b>disconnected from the pons</b> — hence suprasacral, never suprapontine."], [5, "r", 15, "Ch 106 · Evaluation and Management of Males With Urinary Incontinence", "2 · Types", "UUI — with urgency · DO overcomes normal outlet · ~<span class=\"key\">90%</span> have DO on urodynamics; = wet OAB"], [5, "r", 15, "Ch 106 · Evaluation and Management of Males With Urinary Incontinence", "2 · Types", "With chronic retention · Residual ≥<span class=\"key\">300 mL</span> · \"Overflow\" no longer ICS term; SCI ≥T6 → autonomic dysreflexia risk"], [5, "l", 15, "Ch 106 · Evaluation and Management of Males With Urinary Incontinence", "3 · Evaluation", "<b>Bladder diary</b>: only fully validated = ICIQ-BD; <b><span class=\"key\">3 days</span> = 7 days</b>, include a weekend."], [5, "p", 16, "Ch 106 · Evaluation and Management of Males With Urinary Incontinence", "3 · Evaluation", "Every man: history, examination, BMI, dipstick, diary, questionnaire, flow, PVR. Optional: PSA, bloods, imaging, endoscopy, invasive UDS — usually just before surgery."], [5, "a", 16, "Ch 106 · Evaluation and Management of Males With Urinary Incontinence", "4 · Urgency urinary incontinence", "<p>Lifestyle + bladder training + PFMT ≥6 weeks (ideally 3 months) → antimuscarinic or β3-agonist (± combination) → UDS optional → onabotulinumtoxinA / SNM / PTNS → augmentation or ileal conduit</p>"], [5, "l", 16, "Ch 106 · Evaluation and Management of Males With Urinary Incontinence", "4 · Urgency urinary incontinence", "Cut fluid by <span class=\"key\">25%</span> (if intake &gt;1 L/day); avoid caffeine, fizzy drinks; weight loss."], [5, "r", 16, "Ch 106 · Evaluation and Management of Males With Urinary Incontinence", "4 · Urgency urinary incontinence", "Drawback · Retention ~<span class=\"key\">10%</span> → must accept self-catheterisation · Most invasive, costliest · Frequent visits"], [5, "l", 16, "Ch 106 · Evaluation and Management of Males With Urinary Incontinence", "4 · Urgency urinary incontinence", "SNM test: ≥<span class=\"key\">50%</span> improvement → permanent generator <span class=\"xref\">→ Ch 115</span>. No head-to-head trials."], [5, "a", 16, "Ch 106 · Evaluation and Management of Males With Urinary Incontinence", "5 · Stress urinary incontinence", "<p>Supervised PFMT ≥3 months (± biofeedback, electrical stimulation; better started pre-op) → ± duloxetine → exclude anastomotic/urethral stricture and bladder dysfunction (UDS) → surgery by severity</p>"], [5, "l", 17, "Ch 106 · Evaluation and Management of Males With Urinary Incontinence", "5 · Stress urinary incontinence", "After radical prostatectomy wait <b><span class=\"key\">6–12 months</span></b>; avoid long-term urethral catheter (traumatic hypospadias)."], [5, "l", 17, "Ch 106 · Evaluation and Management of Males With Urinary Incontinence", "5 · Stress urinary incontinence", "<b>AUS = gold standard</b>, ~80% continence (Scott 1973 <span class=\"tag\">MCQ</span>); activate ~6 weeks; <span class=\"dag\">†</span>deactivate before catheterisation/endoscopy (erosion)."], [5, "p", 18, "Ch 107 · Urodynamic and Videourodynamic Evaluation of the Lower Urinary Tract", "1 · Definition and role", "<b>Box 107.1 — Urodynamic risk factors</b> (treat even if asymptomatic): impaired compliance; DESD; DISD; high-pressure DO throughout filling; DLPP <span class=\"key\">&gt; 40 cmH₂O</span>; poor emptying with high storage pressure — each a route to sustained high intravesical pressure."], [5, "l", 18, "Ch 107 · Urodynamic and Videourodynamic Evaluation of the Lower Urinary Tract", "2 · Preparation", "<b>ICS pre-invasive work-up</b>: symptom/bother score, <span class=\"key\">3-day frequency–volume chart</span>, free flow and PVR (normal free flow lets an abnormal invasive flow be recognised as artefact)."], [5, "l", 19, "Ch 107 · Urodynamic and Videourodynamic Evaluation of the Lower Urinary Tract", "3 · Non-invasive components", "Minimum <span class=\"key\">VV 150 mL</span> (Qmax linear above, hyperbolic below). <span class=\"dag\">†</span>Qmax &gt; 15 mL/s men (&lt; 10 suggests obstruction), &gt; 20 mL/s women."], [5, "p", 19, "Ch 107 · Urodynamic and Videourodynamic Evaluation of the Lower Urinary Tract", "4 · Equipment, transducers and quality control", "<b>Quality control <span class=\"dag\">†</span></b> (ICS Good Urodynamic Practice): zero to atmosphere; flush air; resting Pves and Pabd physiological and similar (Pdet near 0); <b>cough test</b> before filling, at intervals and before voiding — equal spikes confirm transmission (biphasic Pdet spike → re-flush/reposition). Artefacts: rectal contractions (unexplained fall in Pdet), catheter displacement, kinked tubing, stream hitting funnel edge."], [5, "l", 19, "Ch 107 · Urodynamic and Videourodynamic Evaluation of the Lower Urinary Tract", "5 · Filling cystometry (CMG)", "Rates: standard adult <span class=\"key\">30–100 mL/min</span>; <span class=\"dag\">†</span>ICS physiological &lt; body weight (kg)/4 mL/min. Neurogenic: physiological rate, body-warm saline (EAU). DO commoner upright."], [5, "l", 19, "Ch 107 · Urodynamic and Videourodynamic Evaluation of the Lower Urinary Tract", "5 · Filling cystometry (CMG)", "Absence doesn't exclude: <span class=\"key\">up to 50%</span> of women with UUI show no DO. Seen in some asymptomatic volunteers."], [5, "l", 20, "Ch 107 · Urodynamic and Videourodynamic Evaluation of the Lower Urinary Tract", "5 · Filling cystometry (CMG)", "Storage pressure <span class=\"key\">&gt; 40 cmH₂O</span> → upper-tract damage. Outlet pop-off may appear only after sling/AUS → occlude outlet."], [5, "r", 20, "Ch 107 · Urodynamic and Videourodynamic Evaluation of the Lower Urinary Tract", "6 · Leak point pressures", "<span class=\"key\">&lt; 60</span> · Intrinsic sphincter deficiency (ISD)"], [5, "l", 20, "Ch 107 · Urodynamic and Videourodynamic Evaluation of the Lower Urinary Tract", "6 · Leak point pressures", "<span class=\"key\">DLPP &gt; 40 cmH₂O</span>: not a validated safe cut-off (20 more sensitive in children) — aim <b>as low as achievable</b>; lower bladder pressure (or outlet, e.g. sphincterotomy for DESD) and repeat UDS."], [5, "l", 20, "Ch 107 · Urodynamic and Videourodynamic Evaluation of the Lower Urinary Tract", "7 · Urethral pressure profilometry (UPP)", "<span class=\"key\">MUCP ≤ 20 cmH₂O</span> → ISD (\"type III\" SUI), predicted sling/suspension failure."], [5, "r", 21, "Ch 107 · Urodynamic and Videourodynamic Evaluation of the Lower Urinary Tract", "8 · Pressure–flow studies (PFS)", "<b>BOOI</b> · PdetQmax − 2Qmax · <span class=\"key\">&gt; 40 obstructed · 20–40 equivocal · &lt; 20 unobstructed</span>"], [5, "r", 21, "Ch 107 · Urodynamic and Videourodynamic Evaluation of the Lower Urinary Tract", "8 · Pressure–flow studies (PFS)", "<b>BCI</b> · PdetQmax + 5Qmax · <span class=\"key\">&gt; 150 strong · 100–150 normal · &lt; 100 weak</span>"], [5, "l", 21, "Ch 107 · Urodynamic and Videourodynamic Evaluation of the Lower Urinary Tract", "8 · Pressure–flow studies (PFS)", "<span class=\"tag\">MCQ</span> Bethanechol supersensitivity test (Lapides; Cannon's law): 2.5 mg SC; rise <span class=\"key\">≥ 15 cmH₂O</span> at 100 mL = positive (neurogenic); unreliable."], [5, "p", 23, "Ch 109 · Neuromuscular Dysfunction of the Lower Urinary Tract", "1 · Principles and classification", "Dyssynergia appears only when the lesion lies <b>between the pons and the sacral cord</b>; an open bladder neck marks autonomic (MSA, radical pelvic surgery, myelodysplasia) or sacral damage. PD and MSA share the detrusor pattern but <b>not the outlet</b>."], [5, "l", 25, "Ch 109 · Neuromuscular Dysfunction of the Lower Urinary Tract", "3 · Spinal cord disease", "Spinal shock usually <span class=\"key\">6–12 weeks</span>; reflexes return with lower-limb deep tendon reflexes. Smooth sphincter dyssynergia with cord <span class=\"key\">T7–T8</span> (column T6) or above."], [5, "a", 25, "Ch 109 · Neuromuscular Dysfunction of the Lower Urinary Tract", "3 · Spinal cord disease", "<p><span class=\"dag\">†</span>Sit upright, loosen clothing → <b>remove stimulus</b> (drain bladder, unblock catheter, rectum) → persistent: nitroglycerin 2% paste above lesion (first line) → labetalol / IV nitroprusside → prophylaxis terazosin or prazosin (α1) → intractable: sacral rhizotomy, sympathectomy, cordectomy</p>"], [5, "l", 26, "Ch 109 · Neuromuscular Dysfunction of the Lower Urinary Tract", "4 · Lesions distal to the cord", "<b>Cauda equina syndrome</b>: saddle anaesthesia, loss of voluntary sphincter control and sexual response; acontractile detrusor. <b>Decompression within <span class=\"key\">48 h</span></b> → better urinary/rectal recovery. Sphincter recovers before detrusor."], [5, "p", 26, "Ch 109 · Neuromuscular Dysfunction of the Lower Urinary Tract", "4 · Lesions distal to the cord", "Distal lesions hit the peripheral reflex arc → areflexia with a non-relaxing/fixed outlet; compliance falls only when preganglionic parasympathetic motor fibres are damaged. Hence urgent decompression, waiting and CIC outrank outlet surgery."], [5, "l", 26, "Ch 109 · Neuromuscular Dysfunction of the Lower Urinary Tract", "5 · Specific functional and miscellaneous conditions", "<b>Non-neurogenic chronic retention</b>: PVR ≥<span class=\"key\">300 mL</span> persisting ≥6 months on ≥2 occasions. High risk (hydronephrosis, CKD, UTI) → drainage; suprapubic &gt; urethral long term."], [5, "p", 27, "Ch 109 · Neuromuscular Dysfunction of the Lower Urinary Tract", "6 · Evaluation and risk stratification", "Low risk needs no routine imaging, renal function or UDS. DO alone fits low risk (suprapontine, synergic); high risk means DO with infrapontine pressure consequences. Risk is judged by <b>pressure, compliance and upper tracts</b>, not diagnosis."], [5, "a", 27, "Ch 109 · Neuromuscular Dysfunction of the Lower Urinary Tract", "7 · Management", "<p>Low-pressure storage + regular emptying: CIC + antimuscarinic / β3 agonist → intradetrusor onabotulinumtoxinA → neuromodulation (selected) → augmentation / continent diversion → bladder neck closure + suprapubic catheter / ileovesicostomy / incontinent diversion (last resort)</p>"], [5, "l", 28, "Ch 109 · Neuromuscular Dysfunction of the Lower Urinary Tract", "7 · Management", "<b>CIC gold standard</b>; volumes &lt;<span class=\"key\">500 mL</span>; Credé/Valsalva not recommended. CIC beats indwelling urethral catheter (less pyelonephritis, epididymo-orchitis, urosepsis); chronic catheter → <b>suprapubic &gt; urethral</b>."], [5, "r", 29, "Ch 110 · Overactive Bladder", "1 · Definitions and terminology", "Increased daytime frequency · Patient considers they void too often by day; upper normal <span class=\"key\">7</span> voids"], [5, "l", 29, "Ch 110 · Overactive Bladder", "1 · Definitions and terminology", "<b>Bother</b>: <b>urgency urinary incontinence (UUI) is the most bothersome LUTS in both sexes</b>. Frequency bothers at ≥<span class=\"key\">8</span> daytime voids; nocturia at ≥<span class=\"key\">2</span>."], [5, "l", 29, "Ch 110 · Overactive Bladder", "2 · Epidemiology and burden", "Adult OAB ≈ <span class=\"key\">12–29%</span>: loosest definition (EpiLUTS) highest, strict ICS (EPIC) lowest."], [5, "l", 29, "Ch 110 · Overactive Bladder", "2 · Epidemiology and burden", "&lt;Half tell a clinician. ~<span class=\"key\">92%</span> stop the first antimuscarinic within 2 years; reasons: <b>unmet expectations</b> &gt; side effects &gt; cost."], [5, "l", 30, "Ch 110 · Overactive Bladder", "3 · Pathophysiology", "<b>DO no longer the sine qua non</b>: only ~half with DO have urgency; <span class=\"key\">44–69%</span> with urgency show DO."], [5, "p", 30, "Ch 110 · Overactive Bladder", "3 · Pathophysiology", "Final common pathway: more afferent signal reaches awareness — the bladder or a neighbour turns it up, or the CNS fails to turn it down. Hence DO and obstruction correlate only loosely with OAB."], [5, "l", 30, "Ch 110 · Overactive Bladder", "5 · Clinical assessment", "<b>History</b>: bother; SUI; voiding symptoms; haematuria; fluids/caffeine; occult neurology (new OAB with ED or tremor); pelvic surgery/radiotherapy; bowel (faecal incontinence ~<span class=\"key\">50%</span> of women with OAB); drugs; polyuria (diabetes, sleep apnoea, lithium)."], [5, "l", 30, "Ch 110 · Overactive Bladder", "5 · Clinical assessment", "PROMs: ICIQ-OAB + ICIQ-OABqol; AUA/SUFU: UDI-6, IIQ or OAB-q. <span class=\"tag\">MCQ</span> OAB-V8 = screening tool, not severity score."], [5, "l", 31, "Ch 110 · Overactive Bladder", "6 · Urodynamics (UDS)", "<b>Assess emptying</b>: each <span class=\"key\">10 mL</span> PVR raises catheterisation risk after onabotulinumtoxinA by <span class=\"key\">27%</span>; DO persists in up to <span class=\"key\">60%</span> after TURP."], [5, "l", 31, "Ch 110 · Overactive Bladder", "7 · Management", "<b>Realistic expectations</b> — improvement, not cure. AUA/SUFU lines <b>not compulsory sequence</b>; allow <span class=\"key\">4–12 weeks</span> per therapy."], [5, "a", 31, "Ch 110 · Overactive Bladder", "7 · Management", "<p>Confirm OAB, exclude mimics → education → conservative → drugs → tibial nerve stimulation / sacral neuromodulation / onabotulinumtoxinA → augmentation or diversion; reassess at every step</p>"], [5, "l", 31, "Ch 110 · Overactive Bladder", "7 · Management", "Conservative: fluid ↓ ~<span class=\"key\">25%</span>; caffeine ↓ improves urgency/frequency, not consistently UUI; PFMT + bladder training: leaks ↓ <span class=\"key\">50–80%</span>."], [5, "l", 31, "Ch 110 · Overactive Bladder", "7 · Management", "Drugs <span class=\"xref\">→ Ch 113</span>: response idiosyncratic — switch or combine before invasive work-up. <b>Dementia</b>: antimuscarinic &gt;<span class=\"key\">3 months</span> → 10–65% higher risk → β3 agonist. BPH + OAB: α1-blocker + antimuscarinic; retention ~3% → caution if PVR raised."], [5, "p", 32, "Ch 110 · Overactive Bladder", "7 · Management", "Escalate by invasiveness and reversibility, not severity alone: OAB is benign, so patient goals, frailty and PVR decide how far to climb."], [5, "l", 33, "Ch 111 · Underactive Detrusor", "1 · Definitions and symptoms", "Significant postvoid residual (PVR) not agreed; proposal &gt;<span class=\"key\">40%</span> of functional capacity (voided volume + PVR)."], [5, "p", 33, "Ch 111 · Underactive Detrusor", "1 · Definitions and symptoms", "<b>Sensation decides the picture.</b> Absent sensation → infrequent voider; poor emptying → overflow worse at night (urethra relaxes in sleep). Preserved sensation → frequent voider with incomplete emptying and nocturia. DUA may be asymptomatic."], [5, "l", 33, "Ch 111 · Underactive Detrusor", "2 · Epidemiology", "UDS series: men &lt;50 <span class=\"key\">9–28%</span>; men &gt;70 ~<span class=\"key\">48%</span>; women 12–45%; highest in institutionalised elderly, often <b>detrusor hyperactivity with impaired contractility (DHIC)</b> — involuntary contraction emptying &lt;half the bladder."], [5, "r", 34, "Ch 111 · Underactive Detrusor", "4 · Diagnosis", "<b>Bladder contractility index (BCI)</b> (Abrams) · Pdet@Qmax + 5Qmax · &gt;150 strong; 100–150 normal; <span class=\"key\">&lt;100 weak</span>; male-derived"], [5, "a", 35, "Ch 111 · Underactive Detrusor", "5 · Management", "<p>Evaluate (diary, DRE, urinalysis, flow, PVR; neurological deficit → spinal MRI; stop offending drugs; treat constipation) → timed/double voiding → lower outlet resistance where relevant → ISC for high PVR (suprapubic if ISC impossible) → selected: sacral neuromodulation, outlet surgery, diversion</p>"], [5, "p", 35, "Ch 111 · Underactive Detrusor", "5 · Management", "Every therapy needs a surviving link: Brindley needs efferents and muscle; neuromodulation and electrotherapy need afferents and muscle. <b>Preserved sensation predicts response</b> (bethanechol, toxin, electrotherapy)."], [5, "l", 36, "Ch 111 · Underactive Detrusor", "5 · Management", "Poor outcome in retention: voiding pressure &lt;<span class=\"key\">45</span> cm H₂O, age &gt;<span class=\"key\">80</span>, PVR &gt;<span class=\"key\">1500 mL</span>."], [5, "l", 37, "Ch 113 · Pharmacologic Management of Lower Urinary Tract Storage and Emptying Failure", "2 · Antimuscarinics and β3-agonists", "Mirabegron 25 → 50 mg od; avoid in severe uncontrolled hypertension (≥<span class=\"key\">180/110</span> mm Hg). Vibegron: no titration, no BP effect in trials."], [5, "a", 37, "Ch 113 · Pharmacologic Management of Lower Urinary Tract Storage and Emptying Failure", "2 · Antimuscarinics and β3-agonists", "<p><span class=\"dag\">†</span> OAB: behavioural therapy → antimuscarinic <i>or</i> β3-agonist (β3 first in elderly/cognitive risk) → switch or combine → onabotA 100 U / SNM / PTNS → augmentation cystoplasty</p>"], [5, "p", 38, "Ch 113 · Pharmacologic Management of Lower Urinary Tract Storage and Emptying Failure", "3 · Combination therapy", "Combination beats solifenacin 5 mg and either monotherapy; in non-responders it <b>equals</b> solifenacin 10 mg with less dry mouth — <b>tolerability, not efficacy</b>, over dose escalation. No change in heart rate, BP, QT or PVR; constipation roughly doubles. Benefit irrespective of age ≥65 or ≥75."], [5, "l", 38, "Ch 113 · Pharmacologic Management of Lower Urinary Tract Storage and Emptying Failure", "4 · Intradetrusor onabotulinumtoxinA (onabotA)", "Doses: <span class=\"key\">100 U</span> idiopathic OAB; <span class=\"key\">200 U</span> NDO. DIGNITY: equal efficacy in anticholinergic users and non-users; EMBARK: refractory only."], [5, "l", 38, "Ch 113 · Pharmacologic Management of Lower Urinary Tract Storage and Emptying Failure", "5 · Nocturia — desmopressin †", "Low-dose sublingual: women 25 µg, men 50 µg; key risk rises at age ≥<span class=\"key\">65</span>."], [5, "l", 40, "Ch 115 · Electrical Stimulation and Neuromodulation in Storage and Emptying Failure", "1 · Evolution and mechanism", "Milestones <span class=\"tag\">MCQ</span>: SNM ~1985 (Tanagho, Schmidt); first tibial nerve stimulation 1983 (McGuire); PTNS from acupuncture point <b>SP6</b>; first tibial implant 2006."], [5, "l", 40, "Ch 115 · Electrical Stimulation and Neuromodulation in Storage and Emptying Failure", "2 · Sacral neuromodulation", "Test success: ≥<span class=\"key\">50%</span> improvement in ≥1 diary parameter vs 3–5-day baseline; retention — catheterisation ↓ ≥50%, ideally none."], [5, "l", 41, "Ch 115 · Electrical Stimulation and Neuromodulation in Storage and Emptying Failure", "2 · Sacral neuromodulation", "Battery: non-rechargeable ≥<span class=\"key\">10 years</span>, rechargeable ≥15 years. <b>MRI</b>-conditional whole-body at <span class=\"key\">1.5 and 3 T</span>; at replacement remove all old components."], [5, "a", 41, "Ch 115 · Electrical Stimulation and Neuromodulation in Storage and Emptying Failure", "3 · Tibial nerve stimulation", "<p>Supine → 34-gauge needle ≈3–4 cm above medial malleolus, behind tibia, at 60–90° → ground pad same leg → 20 Hz, 200 μs, 0–10 mA → confirm <b>great-toe flexion/toe fanning</b> or sole tingling → <b><span class=\"key\">12 weekly sessions × 30 min</span></b> → taper → maintenance</p>"], [5, "p", 43, "★ Putting it together: voiding dysfunction decisions", "B · Lesion level and urodynamics", "Dyssynergia only with lesions between pons and sacral cord. Leak point/storage pressure ≥40 cmH₂O or poor compliance threatens kidneys — treat (<span class=\"xref\">→ Ch 107, 109</span>)."], [5, "a", 43, "★ Putting it together: voiding dysfunction decisions", "C · OAB ladder", "<p><b>1.</b> Behavioural: fluids/caffeine, bladder training, PFMT, constipation, drug review.</p>\n<p><b>2.</b> Antimuscarinic or β3-agonist (β3/low-CNS in elderly); combine if partial; PVR in obstructed men (<span class=\"xref\">→ Ch 113</span>).</p>\n<p><b>3.</b> OnabotulinumtoxinA (100 U idiopathic, 200 U neurogenic; warn CIC), PTNS, or SNM (staged test, ≥50% improvement) (<span class=\"xref\">→ Ch 115</span>).</p>\n<p><b>4.</b> Augmentation or diversion.</p>"], [5, "a", 43, "★ Putting it together: voiding dysfunction decisions", "D · SCI bladder", "<p><b>Spinal shock</b>: catheter until reflexes return.</p>\n<p><b>Then</b> UDS; CIC + antimuscarinic for high-pressure NDO; toxin; sphincterotomy/diversion if CIC impossible; lifelong upper-tract surveillance.</p>\n<p><b>AD</b> (above T6): hypertension, bradycardia, headache, flushing → sit up, loosen clothing, remove stimulus (catheter, bladder, bowel), short-acting antihypertensive (<span class=\"xref\">→ Ch 109</span>).</p>"], [6, "l", 2, "Ch 112 · Nocturia", "2 · Why nocturia matters", "<b>Common</b>: up to <span class=\"key\">3 in 5</span> people &gt;70 years void ≥2 times nightly; age is the most robust correlate. Boston Area Community Health survey <span class=\"tag\">MCQ</span>: higher in Black and Hispanic people, partly via socio-economic status."], [6, "l", 2, "Ch 112 · Nocturia", "2 · Why nocturia matters", "<b>Bother</b>: most with ≥<span class=\"key\">2</span> voids; but <b>any nocturia that brings a patient to a urologist is clinically significant</b>."], [6, "l", 2, "Ch 112 · Nocturia", "2 · Why nocturia matters", "<b>Sleep</b>: <b>commonest cause of adult sleep disruption</b>. Restorative slow-wave sleep (N3) clusters early; most first voids occur within <span class=\"key\">2–3 h</span> of sleep onset and break it → daytime fatigue."], [6, "p", 3, "Ch 112 · Nocturia", "2 · Why nocturia matters", "The first void breaks restorative slow-wave sleep; the symptom may be the visible edge of systemic disease."], [6, "r", 3, "Ch 112 · Nocturia", "3 · Pathophysiology — production, capacity and sleep", "NPi (ICS) · &gt;<span class=\"key\">20%</span> young to &gt;<span class=\"key\">33%</span> older adults · Most used; poor discrimination"], [6, "r", 3, "Ch 112 · Nocturia", "3 · Pathophysiology — production, capacity and sleep", "NUP (ICS alternative) · &gt;<span class=\"key\">90 mL/h</span> · More specific for production-driven nocturia"], [6, "r", 3, "Ch 112 · Nocturia", "3 · Pathophysiology — production, capacity and sleep", "Global polyuria · &gt;<span class=\"key\">40 mL/kg/24 h</span> (&gt;2.8 L at 70 kg) · Uncommon, serious — <b>always investigate</b>"], [6, "l", 3, "Ch 112 · Nocturia", "3 · Pathophysiology — production, capacity and sleep", "<b>Krimpen study</b> <span class=\"tag\">MCQ</span>: NPi &gt;33% in 92% of older men with ≥2 voids but also 70% <b>without</b> nocturia."], [6, "l", 3, "Ch 112 · Nocturia", "3 · Pathophysiology — production, capacity and sleep", "Normal capacity usually &gt;300–400 mL; <span class=\"key\">150–300 mL</span> suggests diminished capacity — <b>24-h</b> (all voids small) or <b>night-specific</b> (partly convenience voids)."], [6, "a", 3, "Ch 112 · Nocturia", "3 · Pathophysiology — production, capacity and sleep", "<p>NUV 800 mL, MVV 200 mL → Ni = 4 → PNV = 3 → diary shows 6 night voids → NBCi = <b>3</b> (voiding well below capacity)</p>"], [6, "a", 3, "Ch 112 · Nocturia", "4 · The bladder diary", "<p>Measuring container → time and volume of every void → time, volume, type of every drink → mark bedtime (intending sleep) and rising → urgency grade and leakage per void</p>"], [6, "l", 3, "Ch 112 · Nocturia", "4 · The bladder diary", "Duration: EAU <span class=\"key\">3 days</span> (Male: at least 3). \"Diary fatigue\": fewer than half complete."], [6, "p", 4, "Ch 112 · Nocturia", "4 · The bladder diary", "Every cause works through production against capacity, gated by sleep; their ratio (Ni) predicts severity better than either alone."], [6, "l", 4, "Ch 112 · Nocturia", "6 · Sleep disorders", "CPAP reduces nocturia by up to ≈<span class=\"key\">2 voids</span> in moderate–severe OSA — among the <b>largest effects of any intervention</b>. EAU Female (strong): suspected OSA → sleep clinic."], [6, "l", 4, "Ch 112 · Nocturia", "6 · Sleep disorders", "<b>STOP-BANG</b>: Snoring, Tired, Observed apnoea, Pressure, BMI &gt;<span class=\"key\">35</span>, Age &gt;<span class=\"key\">50</span>, Neck &gt;<span class=\"key\">40 cm</span>, Gender male; ≥<span class=\"key\">3</span> = high risk; highly sensitive."], [6, "p", 4, "Ch 112 · Nocturia", "6 · Sleep disorders", "OSA raises production, lowers capacity and fragments sleep — hence one of the largest nocturia responses to treatment."], [6, "l", 5, "Ch 112 · Nocturia", "7 · Comorbidities", "<b>Hypertension</b>: blood pressure normally dips <span class=\"key\">10–20%</span> in sleep; <b>non-dipping</b> (renin–angiotensin–aldosterone dysregulation) → <b>nocturnal natriuresis</b>. Hydrochlorothiazide helped men with α-blocker-refractory LUTS."], [6, "p", 5, "Ch 112 · Nocturia", "7 · Comorbidities", "Comorbidity acts through the kidney (third-spaced fluid, nocturnal natriuresis, failed antidiuresis). Global polyuria and non-bothersome nocturia both warrant looking beyond urology."], [6, "l", 5, "Ch 112 · Nocturia", "8 · Actions — lifestyle and behaviour", "Restrict fluid, caffeine, alcohol from <span class=\"key\">3–4 h</span> before sleep; older adults drink more by day. High baseline intake gains most."], [6, "l", 5, "Ch 112 · Nocturia", "9 · Lower urinary tract dysfunction", "Nocturia accompanies bladder outlet obstruction (BOO), OAB (up to <span class=\"key\">85%</span> of trial participants), detrusor underactivity, neurogenic bladder and genitourinary syndrome of menopause (GSM) <span class=\"xref\">→ Voiding Dysfunction book, Ch 110</span>."], [6, "r", 6, "Ch 112 · Nocturia", "9 · Lower urinary tract dysfunction", "5ARI · Offer with LUTS and prostate &gt;<span class=\"key\">40 mL</span> (weak) · —"], [6, "p", 6, "Ch 112 · Nocturia", "9 · Lower urinary tract dysfunction", "LUT drugs act on capacity and outflow, but most nocturia is production-driven — effects are statistically significant, clinically small. Treat the mechanism, not the organ."], [6, "a", 6, "Ch 112 · Nocturia", "11 · Management algorithm and refractory nocturia", "<p>History + examination + diary + basic tests → identify Sleep CALM factors → optimise them (multidisciplinary) → conservative measures → antidiuretic or timed diuretic in selected refractory patients — diary at every step</p>"], [6, "r", 7, "Ch 112 · Nocturia", "11 · Management algorithm and refractory nocturia", "Dose · 1.66 mcg if &lt;65, no risk; ≥65 or at risk → <b>0.83 mcg</b> · <b>Sex-specific</b>: women <span class=\"key\">25 mcg</span>; men <span class=\"key\">50 mcg</span>"], [6, "l", 7, "Ch 112 · Nocturia", "11 · Management algorithm and refractory nocturia", "Hyponatraemia defined as sodium &lt;<span class=\"key\">130 mmol/L</span>; most within <span class=\"key\">3 weeks</span>."], [6, "p", 7, "Ch 112 · Nocturia", "11 · Management algorithm and refractory nocturia", "Refractory nocturia: move urine production out of the night. The price is sodium balance — dose, age and monitoring define safe use."], [6, "p", 9, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "1 · Pathophysiology and device mechanisms", "Every device compresses the urethra or repositions a functioning sphincter. Trap: ATOMS and Virtue are \"slings\" but compress — only the Advance depends absolutely on a coapting residual sphincter."], [6, "l", 9, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "2 · Indications and device selection", "Indication: <b>irreversible sphincter incompetence</b>, bothersome incontinence (UI) after conservative care. Do not delay beyond <span class=\"key\">6 months</span> for severe SUI, especially with a cystoscopic sphincter defect."], [6, "l", 9, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "2 · Indications and device selection", "24-h pad weight: mild <span class=\"key\">&lt;150 g</span>, moderate <span class=\"key\">&lt;400 g</span>. AUS preferred if &gt;250 g or after RT (MASTER <span class=\"xref\">→ Ch 106</span>)."], [6, "l", 10, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "2 · Indications and device selection", "Counsel: ~1 thin pad/day; AUS lifespan <span class=\"key\">7–10 years</span>; failed slings mostly go to AUS."], [6, "l", 10, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "2 · Indications and device selection", "Radiation cystitis: hyperbaric oxygen and <span class=\"key\">6 months</span> bleeding-free before AUS."], [6, "p", 10, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "2 · Indications and device selection", "Each device's contraindication mirrors the other's requirement."], [6, "l", 10, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "3 · The high-risk (\"fragile\") urethra", "Prior erosion: 5-year repeat erosion approaches <span class=\"key\">50%</span>. Urethroplasty worse than RT — transection divides bulbourethral arteries."], [6, "p", 10, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "3 · The high-risk (\"fragile\") urethra", "Erosion = spongiosal ischaemia under constant pressure. Countermeasures add tissue (TC tunica) or lower pressure — never squeeze harder."], [6, "l", 10, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "4 · Operative technique", "Low lithotomy, chlorhexidine–alcohol; sterile urine. IV antibiotics within <span class=\"key\">60 min</span> of incision: aminoglycoside 5 mg/kg + first/second-generation cephalosporin or vancomycin."], [6, "a", 10, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "4 · Operative technique", "<p>Midline perineal incision → bulbospongiosus divided → incise Buck fascia at crural divergence → 2-cm tunnel round urethra → measure → cuff (usually 4.0–4.5 cm) → PRB preperitoneal (lower-quadrant or via external ring), filled <span class=\"key\">23 mL</span> → pump subdartos in anterior scrotum → cycle; urethroscopy → leave <b>deactivated 4–6 weeks</b></p>"], [6, "r", 11, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "4 · Operative technique", "<span class=\"key\">61–70</span> · Standard bulbar cuff"], [6, "l", 11, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "4 · Operative technique", "<b>Transcorporal cuff</b> (Webster 2002 <span class=\"tag\">MCQ</span>): dissects through corpora so ventral tunica stays on dorsal urethra, adding bulk. For urethra &lt;3.5 cm, revisions, prior erosion/urethroplasty. Erections usually preserved; more transient retention; erosion benefit unproven."], [6, "a", 11, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "4 · Operative technique", "<p><b>Advance XP</b>: perineal incision → open bulbospongiosus → divide perineal body (releases bulb) → helical trocar outside-in below adductor longus tendon → mesh fixed to spongiosum → tension under cystoscopy until mucosa coapts (bulb moves 3–4 cm proximally)</p>"], [6, "a", 11, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "5 · AUS complications and management", "<p><b>Retention</b>: confirm cuff deactivated → small catheter 24–48 h → fails second trial → <b>suprapubic cystostomy</b> (avoid PRB) → weeks of retention = undersized cuff → replace cuff</p>"], [6, "l", 11, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "5 · AUS complications and management", "<b>Infection</b> <span class=\"key\">1–3%</span> (up to 10% high-risk); staphylococci. <b>Scrotal pain = key early sign</b>. Antibiotics fail → explant all; reimplant 3–6 months. Immediate salvage (remove, irrigate, new device) only if not eroded, septic or immunosuppressed. Coated devices have not reduced infection."], [6, "l", 11, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "5 · AUS complications and management", "<b>Erosion</b> <span class=\"key\">2–15%</span> (up to 35% with several risk factors): remove <b>all components</b>. Urethral loss &lt;50% → catheter ~3 weeks; &gt;50% → in situ ventral approximation or anastomosis. Post-erosion stricture 8–35%. Reimplant at <span class=\"key\">3–6 months</span> at a <b>new site</b>, TC ± low-pressure PRB."], [6, "p", 11, "Ch 123 · Surgical Procedures for Sphincteric Incontinence in the Male: Artificial Urinary Sphincter and Perineal Slings", "5 · AUS complications and management", "Sudden = device, gradual = urethra. Manage every complication to keep a salvageable urethra for the next cuff."], [6, "a", 13, "★ Putting it together", "A · Nocturia: three diary questions", "<p><b>1. Global polyuria?</b> &gt;40 mL/kg/24 h → diabetes, insipidus, polydipsia; always investigate.</p>\n<p><b>2. Nocturnal polyuria?</b> Night fraction &gt;20% (young), &gt;33% (older) → heart failure, sleep apnoea, oedema, evening fluids; desmopressin with sodium checks.</p>\n<p><b>3. Reduced night capacity?</b> NBCi &gt;1.3 → overactive bladder, obstruction, residual; treat it. Screen sleep in all (\"Sleep CALM\") (<span class=\"xref\">→ Ch 112</span>).</p>"], [6, "p", 13, "★ Putting it together", "B · Post-prostatectomy stress incontinence", "Pelvic floor training first; severe leakage → surgery by ~6 months. 24-h pad weight: mild &lt;150 g, moderate &lt;400 g. Mild–moderate, contractile detrusor, no radiotherapy → sling; &gt;250 g, radiotherapy or failed sling → artificial sphincter. Erosion = spongiosal ischaemia (radiotherapy, prior erosion, urethroplasty): add tissue (transcorporal cuff) or lower pressure, not tighter. <span class=\"dag\">†</span> Remove eroded/infected devices (<span class=\"xref\">→ Ch 123; Ch 106</span>)."], [7, "p", 2, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "1 · Scrotum", "Scrotal lymph goes to the groin, testicular lymph to the retroperitoneum — <span class=\"dag\">†</span>so scrotal violation in testis cancer adds inguinal nodes to the at-risk field."], [7, "l", 2, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "2 · Testis", "Volume <span class=\"key\">15–25 mL</span>, length 4.5–5.1 cm. Capsule: visceral tunica vaginalis → <b>tunica albuginea</b> (smooth muscle) → tunica vasculosa."], [7, "l", 2, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "2 · Testis", "~250 lobules; <span class=\"key\">600–1200 seminiferous tubules</span> → rete testis. Interstitium <span class=\"key\">20–30%</span> of volume — <b>Leydig cells</b>. <b>Sertoli</b> tight junctions = blood–testis barrier."], [7, "p", 2, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "2 · Testis", "<b>Surgical rules</b>: no traction suture through the lower pole; biopsy the <b>medial or lateral upper pole</b>; midportion has fewest vessels. After vasectomy the deferential collateral may be gone → preserve testicular artery in later cord surgery; counsel about devascularisation."], [7, "l", 4, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "4 · Vas deferens", "Length <span class=\"key\">30–35 cm</span>; lumen <span class=\"key\">0.2–0.7 mm</span>; <b>three muscle layers</b> (longitudinal–circular–longitudinal). Lymph → external and internal iliac."], [7, "l", 4, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "5 · Seminal vesicles and ejaculatory ducts", "<b>Transrectal ultrasound (TRUS)</b>: post-ejaculation AP diameter <span class=\"key\">&gt;16 mm</span> or volume <span class=\"key\">&gt;6 mL</span> = obstruction; guides aspiration/vesiculography. <b>MRI</b> modality of choice; CT for stones. Vesiculoscopy (4.5–6.9 Fr)."], [7, "p", 4, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "5 · Seminal vesicles and ejaculatory ducts", "A normal vesicle empties at ejaculation; one that stays large is the imaging signature of ejaculatory duct obstruction."], [7, "l", 4, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "6 · Prostate", "Normal <span class=\"key\">~25 mL</span>; transition zone grows fastest with age. Internal (preprostatic) sphincter → continence at rest. Peripheral zone hyperechoic on TRUS."], [7, "l", 4, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "6 · Prostate", "TRUS volume = L × W × H × <span class=\"key\">0.52</span> (underestimates). <b>Multiparametric MRI</b>: T2, diffusion, dynamic contrast; PI-RADS v2.1; targeted biopsy reduces insignificant-cancer detection."], [7, "l", 5, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "8 · Penis", "Sinusoidal smooth muscle <span class=\"key\">~45%</span> of volume; endothelial NOS sustains erection."], [7, "l", 5, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "8 · Penis", "<b>Dorsal nerve</b> (pudendal, <span class=\"key\">S2–S4</span>) — sensation. <b>Cavernous nerves</b> (pelvic plexus) — erection."], [7, "p", 5, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "8 · Penis", "Erection is veno-occlusive: filled sinusoids compress subtunical and emissary veins against the inelastic tunica; <span class=\"dag\">†</span>tunical or smooth-muscle damage → venous leak."], [7, "r", 5, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "8 · Penis", "Peak systolic velocity · <span class=\"key\">&lt;30 cm/s</span> · Arterial insufficiency"], [7, "r", 5, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "8 · Penis", "End-diastolic velocity · <span class=\"key\">&gt;5 cm/s</span> · Veno-occlusive dysfunction"], [7, "r", 5, "Ch 66 · Surgical, Radiographic and Endoscopic Anatomy of the Male Reproductive System", "8 · Penis", "Resistive index · <span class=\"key\">&lt;0.80</span> · Veno-occlusive dysfunction"], [7, "l", 6, "Ch 67 · Male Reproductive Physiology", "1 · Hypothalamic–pituitary–gonadal axis", "GnRH: decapeptide (preoptic, arcuate nuclei) → portal system; sole function LH/FSH release. Half-life <span class=\"key\">5–7 min</span>."], [7, "l", 6, "Ch 67 · Male Reproductive Physiology", "1 · Hypothalamic–pituitary–gonadal axis", "Rhythms: pulsatile (every <span class=\"key\">90–120 min</span>), circadian (testosterone highest early morning), seasonal."], [7, "l", 6, "Ch 67 · Male Reproductive Physiology", "1 · Hypothalamic–pituitary–gonadal axis", "Testosterone ~<span class=\"key\">5 mg/day</span>, pulsatile. <b>DHT</b> via 5α-reductase — more potent, needed in most peripheral tissues (not testis/muscle); <b>oestradiol</b> via aromatase — feedback especially on FSH."], [7, "p", 7, "Ch 67 · Male Reproductive Physiology", "1 · Hypothalamic–pituitary–gonadal axis", "Two loops: LH ↔ Leydig (testosterone) and FSH ↔ Sertoli (inhibin, oestradiol). <b>LH reports Leydig function; FSH and inhibin B report the tubules</b> — high FSH with low inhibin B = spermatogenic failure."], [7, "l", 7, "Ch 67 · Male Reproductive Physiology", "2 · Testis", "<span class=\"key\">600–1200 tubules</span>; ~<span class=\"key\">700 million Leydig cells</span> in young adults."], [7, "l", 7, "Ch 67 · Male Reproductive Physiology", "2 · Testis", "<b>Countercurrent exchange</b> cools arterial blood <span class=\"key\">2–4 °C</span> below core and recycles testosterone vein → artery; lost in varicocele, cryptorchidism."], [7, "l", 8, "Ch 67 · Male Reproductive Physiology", "3 · Spermatogenesis", "Output ~<span class=\"key\">123 million/day</span> (~1000 per heartbeat). <span class=\"dag\">†</span>Needs high intratesticular testosterone → exogenous testosterone suppresses spermatogenesis."], [7, "l", 9, "Ch 67 · Male Reproductive Physiology", "4 · Epididymis", "<b>Transport</b>: <span class=\"key\">2–12 days</span>, mainly spontaneous rhythmic contraction. Recent ejaculation shortens only cauda transit."], [7, "p", 9, "Ch 67 · Male Reproductive Physiology", "4 · Epididymis", "Pregnancy occurs even after vasoepididymostomy at the efferent ductules, but <b>the more distal the anastomosis, the better the fertility</b>. Vasectomy &gt;15 years → lower motility after reversal (epididymal dysfunction)."], [7, "l", 9, "Ch 67 · Male Reproductive Physiology", "5 · Vas deferens, seminal vesicles, ejaculatory ducts", "<b>Seminal vesicle</b>: 5–7 cm coiled tubule; ~<span class=\"key\">80%</span> of seminal volume (late fractions); alkaline, <b>fructose</b>, prostaglandins; <b>semenogelin I</b> → coagulum. Antioxidants: glutathione peroxidase, SOD, catalase."], [7, "a", 10, "Ch 67 · Male Reproductive Physiology", "7 · Ejaculation physiology †", "<p><b>Emission</b> (sympathetic, T10–L2, hypogastric; α1): vas, seminal vesicle, prostate contract → posterior urethra; <b>bladder neck closes</b> → <b>Expulsion</b> (somatic, S2–S4 pudendal): rhythmic bulbospongiosus/pelvic floor contractions, relaxed external sphincter → antegrade ejaculate.</p>"], [7, "l", 11, "Ch 68 · Integrated Men's Health: Androgen Deficiency, Cardiovascular Risk and Metabolic Syndrome", "2 · The longevity gap", "Life expectancy: males <span class=\"key\">76.1</span> vs females 81.1 years (2016)."], [7, "p", 12, "Ch 68 · Integrated Men's Health: Androgen Deficiency, Cardiovascular Risk and Metabolic Syndrome", "4 · Urologic disorders of focus", "<span class=\"dag\">†</span> <b>Fertility caution</b>: exogenous T suppresses LH/FSH and intratesticular T → oligo/azoospermia. Men wanting children: avoid TRT; use clomiphene, hCG or aromatase inhibitors <span class=\"xref\">→ Ch 69</span>."], [7, "r", 12, "Ch 68 · Integrated Men's Health: Androgen Deficiency, Cardiovascular Risk and Metabolic Syndrome", "5 · Cardiovascular prevention", "LDL-C 70–189, 10-year risk ≥<span class=\"key\">7.5%</span> · Moderate–high intensity statin"], [7, "l", 13, "Ch 68 · Integrated Men's Health: Androgen Deficiency, Cardiovascular Risk and Metabolic Syndrome", "7 · GI, skin and mental health", "Iron deficiency anaemia: &gt;30-fold GI malignancy risk. Colorectal screening <span class=\"key\">45–75</span> years. Long-term PPI → check for Barrett."], [7, "l", 14, "Ch 69 · Male Infertility", "1 · Definition and overview", "Infertility: no pregnancy after <span class=\"key\">1 year</span> unprotected intercourse; ~15% of couples; male and female contribute equally — always evaluate the man. Most conceptions in first 3–6 cycles → may evaluate after 6 months."], [7, "p", 14, "Ch 69 · Male Infertility", "2 · History", "<b>Exogenous testosterone (T) is a contraceptive</b>: aromatised to E2 → pituitary feedback → ↓ LH → ↓ intratesticular T → ↓ spermatogenesis. Recovery usually ≥4 months after stopping (≤2 years' use); after longer use, unknown."], [7, "l", 15, "Ch 69 · Male Infertility", "2 · History", "Orchidopexy within <span class=\"key\">18 months</span> (AUA); germ cells lost from 15–18 months. If missed, surgery before 10 years improves later retrieval."], [7, "r", 15, "Ch 69 · Male Infertility", "3 · Physical examination", "Seager caliper (long axis) · <span class=\"key\">≤4.6 cm</span>"], [7, "a", 15, "Ch 69 · Male Infertility", "4 · Endocrine evaluation", "<p>Morning: total T + SHBG + albumin → calculated bioavailable T → LH, FSH → E2; prolactin only if indicated</p>"], [7, "l", 15, "Ch 69 · Male Infertility", "4 · Endocrine evaluation", "Adequate: total T ≥<span class=\"key\">280–300 ng/dL</span>. Low T common even with density &gt;20 million/mL → assess every infertile man (not needed above ~66 million/mL)."], [7, "l", 15, "Ch 69 · Male Infertility", "4 · Endocrine evaluation", "T (ng/dL) : E2 (pg/mL) <span class=\"key\">&lt;10:1</span> → aromatase excess."], [7, "a", 16, "Ch 69 · Male Infertility", "6 · Genetic testing", "<p>NOA or density <span class=\"key\">&lt;5 million/mL</span> → karyotype + Y-microdeletion (ASRM/AUA 2021) · CBAVD (or idiopathic EDO) → CFTR testing of man <b>and partner</b></p>"], [7, "r", 16, "Ch 69 · Male Infertility", "8 · Azoospermia: obstructive (OA) vs non-obstructive (NOA)", "FSH · <span class=\"key\">≤7.6 IU/L</span> · &gt;7.6 IU/L"], [7, "a", 16, "Ch 69 · Male Infertility", "8 · Azoospermia: obstructive (OA) vs non-obstructive (NOA)", "<p>Azoospermia → vasa absent? Yes → CFTR (both partners) · No → volume &lt;1 mL? Yes → postejaculatory urinalysis: sperm → retrograde ejaculation; none → TRUS for EDO · Normal volume → FSH + testis size → OA vs NOA</p>"], [7, "l", 19, "Ch 70 · Surgical Management of Male Infertility", "2 · Surgical anatomy", "Epididymis can be dissected off the testis (inferior/medial epididymal arteries ligated) if the <b>superior epididymal artery is intact</b> → gains <span class=\"key\">4–6 cm</span>."], [7, "a", 19, "Ch 70 · Surgical Management of Male Infertility", "3 · Diagnostic testis biopsy", "<p>Cord block → larger testis (contralateral to varicocele) → 2 cm incision → open tunica vaginalis → stay sutures → 3–4 mm albugineal incision, bipolar crossing vessels → pea-sized sample, iris scissors (no forceps) → touch prep → wet prep → negative: other side → close tunica vaginalis continuous 5-0; no antibiotics</p>"], [7, "a", 20, "Ch 70 · Surgical Management of Male Infertility", "4 · Vasography", "<p>High scrotal incision → vas at straight–convoluted junction → hemivasotomy at 25× → <b>vasal fluid examined first</b> → motile sperm: barbotage, cryopreserve <b>before any dye</b> → 24-G sheath into abdominal end, 1 mL saline: easy flow = patent → (rarely) dilute indigo carmine, blue urine confirms → formal contrast only for obstruction above internal ring → close 10-0 mucosa, 8-0 muscularis</p>"], [7, "l", 20, "Ch 70 · Surgical Management of Male Infertility", "5 · Vasovasostomy (vasectomy reversal)", "<b>Length</b>, escalating: dissect to external then internal ring → free convoluted vas (4–6 cm; <b>do not unravel</b>) → reroute beneath inguinal floor → epididymis off testis → gaps up to <span class=\"key\">10 cm</span>."], [7, "p", 21, "Ch 70 · Surgical Management of Male Infertility", "5 · Vasovasostomy (vasectomy reversal)", "Clear watery fluid still gets vasovasostomy: epididymis not yet blown out; sperm usually return. Toothpaste fluid = secondary epididymal blow-out → open tunica vaginalis; discrete level (dilated above, collapsed below) confirms. When in doubt or inexperienced, do vasovasostomy."], [7, "a", 22, "Ch 70 · Surgical Management of Male Infertility", "6 · Vasoepididymostomy", "<p>Vas hemitransected at straight–convoluted junction, fluid sampled, patency confirmed → open tunica vaginalis → site <b>above</b> obstruction where tubules dilated (else puncture distal → proximal until sperm) → 3–4 mm tunic window → vas through tunica vaginalis, <b>fixed with 5-0 Prolene to albuginea (tension relief)</b> → posterior tunic–vas 8-0 → intussusception sutures → outer tunic–vas adventitia</p>"], [7, "a", 22, "Ch 70 · Surgical Management of Male Infertility", "7 · TURED", "<p>24-Fr resectoscope; finger in rectum → resect the <b>verumontanum</b> to open dilated orifices/cyst → spare bladder neck, sphincter, rectum → <b>blue efflux confirms</b>; minimal coagulation → catheter overnight, 7 days antibiotics</p>"], [7, "p", 23, "Ch 70 · Surgical Management of Male Infertility", "8 · Sperm retrieval", "Paradox: in obstruction the <b>most motile sperm are proximal</b> (efferent ductules); distal tubules hold senescent fragments and macrophages. Yet fertilisation is best when the longest epididymis is preserved."], [7, "a", 23, "Ch 70 · Surgical Management of Male Infertility", "8 · Sperm retrieval", "<p>Micro-TESE: general/regional → 10× avascular plane on anterior albuginea → wide equatorial incision → bivalve → excise larger tubules → in-theatre andrologist examines → map positives → negative: contralateral → close albuginea 5-0, tunica vaginalis 4-0</p>"], [7, "a", 23, "Ch 70 · Surgical Management of Male Infertility", "10 · Varicocelectomy", "<p>Local + sedation → 2–3 cm incision over external ring → cord on Penrose (exclude ilioinguinal, genital branch) → <b>micro-Doppler maps arteries before handling</b> → open spermatic fasciae → 10–25×, 1% papaverine → artery looped → <b>all veins except vasal ligated</b> → lymphatics preserved → deliver testis: ligate external spermatic, gubernacular veins → impulse test</p>"], [7, "p", 24, "Ch 70 · Surgical Management of Male Infertility", "10 · Varicocelectomy", "Recurrence = a vein missed; hydrocele = a lymphatic tied; atrophy = an artery tied. Microsurgery with testicular delivery addresses all three."], [7, "l", 25, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "1 · Definition and key concepts", "Milestones <span class=\"tag\">MCQ</span>: Leonardo da Vinci (hanged men) – erection is blood; 1990s – NO; 1998 – oral PDE5 inhibitors (PDE5Is)."], [7, "l", 25, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "2 · Functional anatomy", "Sinusoidal Po<sub>2</sub>: flaccid venous <span class=\"key\">~35 mm Hg</span>; erect arterial <span class=\"key\">~90 mm Hg</span>."], [7, "p", 26, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "2 · Functional anatomy", "Arterial and venous anatomy vary widely between men — so the same \"nerve-sparing\" or pelvic operation gives different erectile outcomes."], [7, "l", 26, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "3 · Haemodynamics: phases of erection and detumescence", "Full erection plateau ICP <span class=\"key\">~100 mm Hg</span>; rigid phase suprasystolic. Cavernous (autonomic) nerve drives phases 1–3; pudendal → ischiocavernosus drives phase 4."], [7, "r", 26, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "4 · Neuroanatomy", "Origin · <span class=\"key\">T11–L2</span> (often T10–T12) · <span class=\"key\">S2–S4</span> intermediolateral columns · S2–S4; motor from <b>Onuf nucleus</b>"], [7, "p", 27, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "4 · Neuroanatomy", "NOS inhibitors block both apomorphine- and oxytocin-induced erections → NO is the final common central pathway. <b>Trap</b>: noradrenaline is pro-sexual centrally but the principal anti-erectile transmitter peripherally."], [7, "l", 28, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "5 · Molecular mechanisms of smooth muscle tone", "Acetylcholine acts indirectly (endothelial NO, presynaptic adrenergic inhibition); <b>atropine does not abolish</b> neural erection <span class=\"tag\">MCQ</span>."], [7, "p", 28, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "5 · Molecular mechanisms of smooth muscle tone", "Corporal tone is a tug-of-war over one phosphorylation site (MLC20): Ca<sup>2+</sup>–calmodulin–MLC kinase and Rho-kinase keep it phosphorylated; NO–cGMP–PKG removes the phosphate. <b>Trap</b>: \"MLCP\" = the phosphatase."], [7, "l", 28, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "7 · Risk factors and endothelial dysfunction", "<b>Artery-size hypothesis</b>: smaller penile arteries become symptomatic first; ED preceded CAD by a mean of <span class=\"key\">~2 years</span> → ED is a <b>sentinel</b>; stratify cardiac risk <span class=\"xref\">→ Ch 72</span>."], [7, "r", 29, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "8 · Pathophysiology by type", "Upper cord (above sacral centre) · Preserved in <span class=\"key\">~95%</span>; brief, need continuous stimulation · Lost"], [7, "r", 29, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "8 · Pathophysiology by type", "Lower cord (sacral) · Preserved in only <span class=\"key\">~25%</span> · May occur (thoracolumbar pathway); marginal tumescence"], [7, "l", 29, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "8 · Pathophysiology by type", "AUA: <b>morning, fasting</b> T in all men with ED; low T = <span class=\"key\">&lt;300 ng/dL</span>; treat only with ≥2 low levels + symptoms. Nocturnal erections need ~200 ng/dL."], [7, "l", 29, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "8 · Pathophysiology by type", "Nocturnal erections androgen-dependent; visual-stimulus erections largely independent <span class=\"tag\">MCQ</span>. DHT is the key penile androgen."], [7, "p", 30, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "8 · Pathophysiology by type", "Veno-occlusion is an emergent property of healthy tissue (elastic tunica + fully relaxed trabeculae), so most \"venous leak\" is really cavernosal smooth muscle disease — why venous ligation surgery fails and is investigational."], [7, "l", 30, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "8 · Pathophysiology by type", "<b>CKD</b>: up to <span class=\"key\">80%</span> of ESRD men have ED; persists in ~half after transplant."], [7, "p", 31, "Ch 71 · Physiology of Penile Erection and Pathophysiology of Erectile Dysfunction", "8 · Pathophysiology by type", "Why ED is a sentinel: nearly every systemic disease reaches the penis through the same three doors — endothelial NO failure, Rho-kinase-driven contraction, and TGF-β-driven fibrosis."], [7, "l", 32, "Ch 72 · Evaluation and Management of Erectile Dysfunction", "1 · Definition and significance", "<b>ED</b> (AUA): consistent or recurrent inability to attain and/or maintain an erection sufficient for sexual satisfaction; minimum duration <span class=\"key\">3 months</span> (except trauma/surgery-induced ED)."], [7, "l", 32, "Ch 72 · Evaluation and Management of Erectile Dysfunction", "1 · Definition and significance", "Prevalence ~<span class=\"key\">20%</span> of adult men (40–49 y up to 15%; 60–69 y up to 40%). One in four new presenters is &lt;40 y, half severe."], [7, "p", 33, "Ch 72 · Evaluation and Management of Erectile Dysfunction", "3 · Basic evaluation", "Preserved nocturnal/morning erections prove an intact neurovascular axis — the strongest historical pointer to psychogenic ED."], [7, "p", 33, "Ch 72 · Evaluation and Management of Erectile Dysfunction", "3 · Basic evaluation", "The basic work-up finds the disease behind the ED — undiagnosed DM, dyslipidaemia, hypogonadism, CV risk — not proof of ED."], [7, "l", 33, "Ch 72 · Evaluation and Management of Erectile Dysfunction", "4 · Hormonal evaluation", "AUA threshold <span class=\"key\">300 ng/dL (10.4 nmol/L)</span>; sexual function correlates weakly with T above ~230 ng/dL. Pituitary MRI if T <span class=\"key\">&lt;150 ng/dL</span>."], [7, "r", 34, "Ch 72 · Evaluation and Management of Erectile Dysfunction", "5 · Specialised testing", "PSV · <span class=\"key\">&lt;25 cm/s</span> (25–35 borderline; &gt;35 normal) · Persistently &gt;25 cm/s"], [7, "r", 34, "Ch 72 · Evaluation and Management of Erectile Dysfunction", "5 · Specialised testing", "EDV · — · <span class=\"key\">&gt;5 cm/s</span>"], [7, "r", 34, "Ch 72 · Evaluation and Management of Erectile Dysfunction", "5 · Specialised testing", "RI = (PSV − EDV)/PSV · — · <span class=\"key\">&lt;0.75</span> (normal &gt;0.9)"], [7, "p", 34, "Ch 72 · Evaluation and Management of Erectile Dysfunction", "5 · Specialised testing", "Venous leak can be diagnosed only with adequate inflow and full smooth muscle relaxation — an anxious patient mimics veno-occlusive dysfunction, so redose first. Anatomical variants (dorsal–cavernous communications, early branching) can falsely suggest arteriogenic ED."], [7, "a", 35, "Ch 72 · Evaluation and Management of Erectile Dysfunction", "6 · Treatment", "<p>Treat reversible causes (lifestyle, drugs, hormones, psychosocial) + CV risk stratification → shared decision: PDE5I | VED | IU alprostadil | ICI | (Li-ESWT investigational) → inadequate response: optimise, combine, switch → penile prosthesis <span class=\"xref\">→ Ch 75</span></p>"], [7, "r", 35, "Ch 72 · Evaluation and Management of Erectile Dysfunction", "6 · Treatment", "Half-life (h) · 3–5 · 4–5 · <span class=\"key\">17.5</span> · 3–5"], [7, "l", 36, "Ch 72 · Evaluation and Management of Erectile Dysfunction", "6 · Treatment", "<b>Nitrates</b> in any form (incl. amyl nitrite \"poppers\") → profound hypotension; use &gt;2 weeks earlier not a contraindication. If angina: no nitrates for <span class=\"key\">24 h</span> (sildenafil, vardenafil) or <span class=\"key\">48 h</span> (tadalafil). Hypotension: Trendelenburg → IV fluids → phenylephrine → intra-aortic balloon pump; no antidote."], [7, "l", 39, "Ch 73 · Priapism", "1 · Definition and classification", "<b>Priapism</b>: full or partial erection lasting <span class=\"key\">≥4 h</span> beyond or unrelated to sexual stimulation. Emergency: fibrosis, shortening, permanent ED."], [7, "r", 39, "Ch 73 · Priapism", "1 · Definition and classification", "Share · <span class=\"key\">95%</span> · Subset of ischaemic · &lt;5%"], [7, "p", 39, "Ch 73 · Priapism", "1 · Definition and classification", "Trap: stuttering priapism is <b>ischaemic</b> — episodes ≥4 h need the same first-line treatment."], [7, "l", 39, "Ch 73 · Priapism", "2 · Aetiolog
