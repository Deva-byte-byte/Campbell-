y for Renal Tumours", "8 · Complications & management", "Major (Clavien ≥3) <span class=\"key\">≤5%</span>, fewer than PN; percutaneous &lt; laparoscopic; MWA lowest (network meta-analysis). Complications follow probe path and thermal field → prevention is planning."], [11, "l", 38, "Ch 144 · Treatment of Advanced Renal Cell Carcinoma", "1 · Overview", "About <span class=\"key\">1/3</span> present with metastases; a further <span class=\"key\">20–40%</span> of localised tumours metastasise later. mRCC 5-yr survival ≈ <span class=\"key\">12%</span>; 10-yr &lt;5%."], [11, "r", 38, "Ch 144 · Treatment of Advanced Renal Cell Carcinoma", "2 · Prognostic models", "Corrected calcium · <span class=\"key\">&gt;10 mg/dL</span> · &gt; ULN"], [11, "r", 38, "Ch 144 · Treatment of Advanced Renal Cell Carcinoma", "2 · Prognostic models", "LDH · <span class=\"key\">&gt;1.5 × ULN</span> · —"], [11, "r", 38, "Ch 144 · Treatment of Advanced Renal Cell Carcinoma", "2 · Prognostic models", "Time factor · No prior nephrectomy · <span class=\"key\">&lt;1 yr</span> diagnosis → systemic therapy"], [11, "p", 38, "Ch 144 · Treatment of Advanced Renal Cell Carcinoma", "2 · Prognostic models", "Both score host reserve, tumour systemic effects and pace of disease; three factors shared. IMDC swaps LDH and prior nephrectomy for neutrophilia, thrombocytosis and short interval. The IMDC risk group <b>decides the first-line regimen</b>."], [11, "r", 39, "Ch 144 · Treatment of Advanced Renal Cell Carcinoma", "3 · Biology and drug targets", "Sunitinib · VEGFR2, PDGFR-β, c-KIT, FLT3; <span class=\"key\">50 mg, 4 wk on / 2 off</span> · Diarrhoea, HFS, fatigue, HTN, thrombocytopenia, <b>hypothyroidism</b>"], [11, "a", 39, "Ch 144 · Treatment of Advanced Renal Cell Carcinoma", "4 · Surgery in metastatic disease", "<p>mRCC → histology + IMDC risk + PS + metastatic burden</p><p>Fit, low burden, favourable features, resectable primary → consider upfront CN → systemic therapy</p><p>Intermediate/poor risk or high burden → systemic therapy first → deferred CN in responders</p>"], [11, "p", 39, "Ch 144 · Treatment of Advanced Renal Cell Carcinoma", "4 · Surgery in metastatic disease", "CN helps only patients fit enough, and with disease slow enough, to reach effective systemic therapy; operating first on poor-risk patients mainly delays it."], [11, "r", 40, "Ch 144 · Treatment of Advanced Renal Cell Carcinoma", "5 · Systemic therapy for ccRCC", "Durable complete response (CR) · &lt;2% · <span class=\"key\">7–9%</span>; &gt;60% of CRs stay disease-free"], [11, "r", 40, "Ch 144 · Treatment of Advanced Renal Cell Carcinoma", "5 · Systemic therapy for ccRCC", "Regimen · Schedule/route immaterial · <span class=\"key\">600,000–720,000 IU/kg</span> IV bolus 8-hourly, max 15 doses"], [11, "p", 40, "Ch 144 · Treatment of Advanced Renal Cell Carcinoma", "5 · Systemic therapy for ccRCC", "<b>Choosing</b>: IO/TKI → higher response and PFS, better tolerated; IO/IO → deeper durable responses (CR 9%) with autoimmune toxicity; never compared directly. Ipilimumab + nivolumab restricted to intermediate/poor (favourable did better on sunitinib in CheckMate 214). Avelumab + axitinib not NCCN-preferred (no OS benefit). PD-L1 does not select. TKI or temsirolimus if IO contraindicated."], [11, "l", 40, "Ch 144 · Treatment of Advanced Renal Cell Carcinoma", "5 · Systemic therapy for ccRCC", "<b>Ipilimumab + nivolumab</b> toxicity: grade 3–4 <span class=\"key\">46%</span>; high-dose steroids 35%; discontinuation 22%; dose nivolumab 3 mg/kg + ipilimumab 1 mg/kg 3-weekly × 4 (CheckMate 016). Nivolumab alone vs everolimus grade 3–4: 19% vs 37%. Autoimmune events with ipilimumab predicted response."], [11, "p", 41, "Ch 144 · Treatment of Advanced Renal Cell Carcinoma", "6 · Non-clear cell RCC", "In nccRCC the syndrome names the driver, and the driver names the drug: VHL → VEGF/mTOR/HIF-2α; MET → MET inhibitors; FH → glucose restriction."], [11, "r", 43, "★ Putting it together", "A · Small renal mass", "Best for · Frail, life expectancy &lt;5 y; solid &lt;2 cm or mainly cystic · cT1a <span class=\"key\">≤3 cm</span>, comorbid; biopsy first · cT1a standard; imperative if solitary, bilateral, hereditary, CKD · Only if high complexity + no CKD/proteinuria + new eGFR <span class=\"key\">&gt;45</span>"], [11, "a", 44, "★ Putting it together", "E · Metastatic RCC", "<p><b>1. IMDC (6 factors)</b>: KPS &lt;80%, Hb &lt; LLN, calcium/neutrophils/platelets &gt; ULN, &lt;1 yr to therapy → 0 favourable, 1–2 intermediate, ≥3 poor.</p>\n<p><b>2. First line</b>: IO + TKI (pembro + axitinib, nivo + cabozantinib, pembro + lenvatinib) any risk; ipi + nivo intermediate/poor.</p>\n<p><b>3. CN</b>: upfront only if fit, low burden, favourable; else deferred in responders (CARMENA, SURTIME).</p>\n<p><b>4. Later lines</b>: switch mechanism; belzutifan (HIF-2α) after IO + TKI.</p>"], [12, "l", 2, "Ch 145 · Surgical and Radiographic Anatomy of the Adrenals", "1 · Embryology", "At birth gland is <span class=\"key\">2×</span> adult weight; <b>fetal zone involutes in year 1</b>, replaced by ZG/ZF under ACTH. Zona reticularis (ZR) reaches adult volume at 6–8 y."], [12, "l", 2, "Ch 145 · Surgical and Radiographic Anatomy of the Adrenals", "2 · Zones and hormones", "Glomerulosa ~15% (aldosterone; small clustered cells); fasciculata <span class=\"key\">~80%</span> (cortisol; lipid-laden \"clear cells\"); reticularis 5–7% (DHEAS; anastomosing cords); medulla ~10% (chromaffin cells)."], [12, "p", 2, "Ch 145 · Surgical and Radiographic Anatomy of the Adrenals", "3 · Relations and blood supply", "Right side is riskier: high, retrocaval, short vein — little working length; avulsion tears the cava."], [12, "l", 2, "Ch 145 · Surgical and Radiographic Anatomy of the Adrenals", "5 · Imaging appearance", "<b>CT</b>: best spatial resolution; inverted <b>V/Y</b>, limbs 3–6 mm (thinner than crus). Unenhanced <span class=\"key\">≤10 HU</span> = lipid-rich. Morphology only."], [12, "l", 3, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "1 · Applied anatomy and physiology", "Anomalous venous drainage in up to <span class=\"key\">9%</span> – matters for adrenal vein sampling (AVS). Triple supply → partial adrenalectomy rarely infarcts remnant."], [12, "p", 3, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "2 · Evaluation of an adrenal mass – principles", "Two questions: <b>(1) Is it malignant?</b> – imaging. <b>(2) Is it hormonally active?</b> – biochemistry. Either = treat (usually resect). Imaging cannot tell functional adenomas, so biochemistry is never omitted."], [12, "l", 3, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "3 · Imaging", "<b>Unenhanced CT</b>: <span class=\"key\">≤10 Hounsfield units (HU)</span> = lipid-rich adenoma (no known malignancy); &gt;70% of adenomas. ≤0 HU 100% specific but insensitive."], [12, "l", 3, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "3 · Imaging", "Up to <span class=\"key\">7%</span> of metastases are &lt;10 HU → biochemistry for every lesion."], [12, "l", 3, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "3 · Imaging", "<b>CT washout</b> (gold standard for lipid-poor lesions, ≈30% of adenomas; phases 0, 60 s, 15 min): adenoma if APW <span class=\"key\">&gt;60%</span>, RPW <span class=\"key\">&gt;40%</span>. RCC/hepatoma metastases can wash out."], [12, "a", 4, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "3 · Imaging", "<p>Mass → unenhanced CT ≤10 HU or MRI drop-out → adenoma │ &gt;10 HU → 15-min washout CT → APW &gt;60% / RPW &gt;40% = adenoma; below = adenoma very unlikely → manage as indeterminate</p>"], [12, "p", 4, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "4 · Hormonal work-up (all lesions >1 cm)", "Every incidentaloma: <b>1-mg dexamethasone suppression test (DST) + metanephrines</b>; add <b>aldosterone-to-renin ratio (ARR)</b> if hypertension or unexplained hypokalaemia. &gt;10% are functional. <b>Never biopsy, sample or excise before excluding phaeochromocytoma</b>. CUA allows omitting metanephrines in asymptomatic &lt;10 HU lesions."], [12, "l", 4, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "4 · Hormonal work-up (all lesions >1 cm)", "1-mg DST: <span class=\"key\">≤1.8 µg/dL (50 nmol/L)</span> excludes; 1.8–5.0 possible autonomy; <span class=\"key\">&gt;5.0 µg/dL (140 nmol/L)</span> &gt;95% specific. The 5.0 cut-off misses up to 18% of Cushing syndrome."], [12, "a", 5, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "5 · Biopsy and incidentaloma management", "<p>Imaging characterises it? → no biopsy │ functional? → no biopsy │ ACC suspected? → no biopsy │ will result change management (e.g., known primary) and justify risk? → biopsy, <b>after excluding phaeochromocytoma</b></p>"], [12, "l", 5, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "6 · Primary aldosteronism (PA)", "<b>ARR</b>: morning, seated, PAC (ng/dL) ÷ PRA (ng/mL/h). Positive: <span class=\"key\">ARR &gt;20–30 with PAC &gt;15–20 ng/dL</span>. Floor PRA at 0.2. Correct K⁺."], [12, "l", 6, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "6 · Primary aldosteronism (PA)", "<b>AVS</b> (sensitivity 95%, specificity 100% if done well): K⁺ corrected, morning, both adrenal veins + IVC, aldosterone and cortisol. <b>Selectivity</b>: adrenal vein/IVC cortisol &gt;1.1–5:1 (higher with cosyntropin). <b>Lateralisation</b>: cortisol-corrected A/C ratio <span class=\"key\">&gt;2–4:1</span> → ipsilateral adrenalectomy."], [12, "a", 6, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "6 · Primary aldosteronism (PA)", "<p>Indication → ARR + → confirm → (family history/onset &lt;20 → FH-I test) → surgical candidate? No → MRA │ Yes → CT → age &lt;40 + unilateral &gt;1 cm nodule → adrenalectomy; otherwise → AVS → lateralised → laparoscopic adrenalectomy; not lateralised → MRA</p>"], [12, "a", 7, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "7 · Cushing syndrome and cortisol excess", "<p>Exclude exogenous steroid → screen (1-mg DST / LNSC ×2 / UFC ×2) → abnormal → endocrinologist confirms → <b>morning ACTH</b>: low → adrenal (CT) │ normal/high → pituitary MRI + <b>inferior petrosal sinus sampling after CRH</b> (central:peripheral gradient = Cushing disease; none = ectopic)</p>"], [12, "p", 7, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "8 · Phaeochromocytoma and paraganglioma (PPGL)", "The rule of 10s is outdated – every patient with PPGL should be offered genetic counselling/testing (Endocrine Society 2014)."], [12, "p", 8, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "8 · Phaeochromocytoma and paraganglioma (PPGL)", "<b>Why never β before α?</b> β-blockade removes β2-mediated arteriolar dilatation; catecholamines then act unopposed on α1 → hypertensive crisis. Hence selective β1 agents."], [12, "l", 9, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "11 · Adrenal metastases", "With known malignancy, <span class=\"key\">&gt;50%</span> of new adrenal lesions are metastases. RCC/hepatoma may wash out → growth and biopsy decide. <b>Still exclude phaeochromocytoma</b>."], [12, "p", 10, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "12 · Adrenal insufficiency", "<span class=\"dag\">†</span> <b>Adrenal crisis</b>: don't wait – draw cortisol/ACTH, <b>hydrocortisone 100 mg IV bolus</b>, then 200 mg/24 h (infusion or 50 mg 6-hourly); 0.9% saline (1 L first hour) + dextrose; treat precipitant; taper over 1–3 days. Fludrocortisone unnecessary while hydrocortisone &gt;50 mg/day. Sick-day rules, steroid card."], [12, "m", 10, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "15 · MCQ one-liners", "Commonest ectopic ACTH source: bronchial carcinoid."], [12, "l", 11, "Ch 147 · Surgery of the Adrenal Glands", "1 · Surgical anatomy (essentials)", "<b>Right</b>: behind bare area of liver (fused in ~10%). Vein <span class=\"key\">&lt;1 cm</span>, into <b>posterior IVC at 45°</b>; variants into right hepatic or right renal vein."], [12, "r", 11, "Ch 147 · Surgery of the Adrenal Glands", "2 · Indications", "Size · <span class=\"key\">≥4 cm</span>; &gt;2 cm growing ≥1 cm in 12 months"], [12, "r", 11, "Ch 147 · Surgery of the Adrenal Glands", "2 · Indications", "Imaging · Non-contrast CT <span class=\"key\">&gt;10 HU</span>; washout &lt;50% with delayed &gt;35 HU; chemical-shift MRI not adenoma; FDG-PET uptake ≥ liver"], [12, "p", 11, "Ch 147 · Surgery of the Adrenal Glands", "2 · Indications", "Trap: bilateral hyperplasia causing aldosteronism is <b>not</b> surgical — hence AVS before adrenalectomy for aldosteronism."], [12, "l", 11, "Ch 147 · Surgery of the Adrenal Glands", "2 · Indications", "Inert, ≤4 cm, ≤10 HU, homogeneous → repeat CT at 12 months. Myelolipoma (≤ −20 HU): operate only if <span class=\"key\">&gt;7 cm</span>, symptomatic or atypical; still exclude PCC."], [12, "r", 11, "Ch 147 · Surgery of the Adrenal Glands", "4 · Pre-operative preparation", "<b>PCC</b> · α-blockade <span class=\"key\">2 weeks</span> (phenoxybenzamine; doxazosin, CCB, metyrosine alternatives) → β <b>only after α</b> → volume expansion · Contracted patients collapse once vein tied. ECG, echo"], [12, "a", 12, "Ch 147 · Surgery of the Adrenal Glands", "6 · Operative steps", "<p><b>Right</b>: elevate liver → Kocher → expose IVC → up from renal vein (inferior limit) → short adrenal vein → <b>warn anaesthesia</b>, clip early → superior/lateral dissection → psoas (posterior limit) → bag, intact.</p>"], [12, "a", 12, "Ch 147 · Surgery of the Adrenal Glands", "6 · Operative steps", "<p><b>Left</b>: reflect colon at Toldt, outside Gerota → spleen/pancreas up → follow left renal (or gonadal) vein to adrenal vein → clip after warning → protect pancreas and splenic artery → divide ganglion nexus superomedially → bag.</p>"], [12, "p", 12, "Ch 147 · Surgery of the Adrenal Glands", "6 · Operative steps", "Ligate the vein early in PCC to limit catecholamine surge; hypotension follows — tell anaesthesia first."], [12, "l", 13, "Ch 147 · Surgery of the Adrenal Glands", "10 · Outcomes", "PCC: lifelong recurrence up to <span class=\"key\">16%</span> → annual BP and metanephrines."], [12, "l", 13, "Ch 147 · Surgery of the Adrenal Glands", "10 · Outcomes", "Cushing: insulin resistance may persist. ACC advanced-stage 5-year survival <span class=\"key\">&lt;15%</span>."], [12, "p", 14, "Ch 140 · Retroperitoneal Tumours", "1 · Anatomy of the retroperitoneum", "The operative problem is usually the neighbouring structure, not the tumour: RP tumours grow silently (resected sarcomas average <span class=\"key\">&gt;15 cm</span>) and present with multi-organ involvement."], [12, "l", 15, "Ch 140 · Retroperitoneal Tumours", "4 · Mesenchymal tumours (sarcoma)", "Soft-tissue sarcoma &lt;1% of adult cancers; <span class=\"key\">15–20%</span> arise in the RP."], [12, "r", 15, "Ch 140 · Retroperitoneal Tumours", "4 · Mesenchymal tumours (sarcoma)", "<b>WD/DD liposarcoma</b> (commonest, <span class=\"key\">~60%</span>) · Fat density; <b>MDM2/CDK4 (12q) amplification</b>, ring chromosomes; S100+ · Radical compartmental resection"], [12, "r", 15, "Ch 140 · Retroperitoneal Tumours", "4 · Mesenchymal tumours (sarcoma)", "<b>Leiomyosarcoma</b> (<span class=\"key\">~20%</span>) · From vessel media (IVC); no fat; SMA, desmin, h-caldesmon+ · Negative margins + adjuvant"], [12, "l", 15, "Ch 140 · Retroperitoneal Tumours", "4 · Mesenchymal tumours (sarcoma)", "<b>Liposarcoma</b>: DD = higher-grade non-lipogenic component; <b>dense nodules in fatty mass = de-differentiation</b> (biopsy target). WD: local recurrence up to 40%, rarely metastasises; DD: distant up to 20%, 5-year mortality ~30%. Mean time to recurrence ~<span class=\"key\">2 years</span> → lifelong surveillance."], [12, "p", 15, "Ch 140 · Retroperitoneal Tumours", "4 · Mesenchymal tumours (sarcoma)", "MDM2 amplified (WD/DD) = local disease won or lost at the margin; absent (pleomorphic) = systemic disease. Infiltrative types (Ewing, DSRCT) need chemotherapy — no margin achievable."], [12, "p", 16, "Ch 140 · Retroperitoneal Tumours", "6 · Germ cell, haematological, cystic, unknown primary", "Histology decides first treatment: exclude chemotherapy-first entities (GCT, lymphoma, Ewing, midline unknown primary) before planning sarcoma resection."], [12, "l", 16, "Ch 140 · Retroperitoneal Tumours", "7 · Surgery for RP sarcoma", "Nephrectomy in up to <span class=\"key\">55%</span>; rarely dialysis — <span class=\"dag\">†</span> split renogram first. ~5% lose femoral/obturator nerve → knee brace."], [12, "l", 17, "Ch 140 · Retroperitoneal Tumours", "8 · RPLND in germ cell tumours", "Primary RPLND survival ~100% with either template. PC-RPLND: full bilateral infrahilar standard; unilateral only if <span class=\"key\">≤5 cm</span> in landing zone, normal markers, IGCCCG good/intermediate risk."], [12, "l", 17, "Ch 140 · Retroperitoneal Tumours", "8 · RPLND in germ cell tumours", "Nerve-sparing (L1–L4 fibres, superior hypogastric plexus below IMA) → antegrade ejaculation <span class=\"key\">90–100%</span>; temporary anejaculation = neuropraxia."], [12, "a", 17, "Ch 140 · Retroperitoneal Tumours", "9 · Complications", "<p><b>Chylous ascites</b>: paracentesis + MCT diet ± octreotide → drain → NBM + TPN → &gt;100 mL/day: peritoneovenous (LeVeen) shunt or ligation → MCT diet 1–3 months after resolution.</p>"], [12, "a", 18, "★ Putting it together: adrenal and retroperitoneal decisions", "A · Adrenal incidentaloma: two questions", "<p><b>1. Malignant?</b> Unenhanced CT ≤10 HU or MRI drop-out → adenoma. &gt;10 HU → washout CT (APW &gt;60% / RPW &gt;40% = adenoma). &gt;4 cm, suspicious or growth &gt;1 cm → consider resection (<span class=\"xref\">→ Ch 146</span>).</p>\n<p><b>2. Functioning?</b> All: 1-mg DST, metanephrines; ARR if hypertensive/hypokalaemic.</p>\n<p><b>Silent, &lt;4 cm, benign</b> → no follow-up.</p>"], [12, "p", 18, "★ Putting it together: adrenal and retroperitoneal decisions", "C · Adrenalectomy approach", "Laparoscopic (transperitoneal or retroperitoneoscopic) for benign tumours. Open for large suspected ACC or invasion (rupture → spill, recurrence). Right: short vein into IVC — control carefully. Partial adrenalectomy for bilateral/hereditary disease (<span class=\"xref\">→ Ch 147</span>)."], [12, "a", 18, "★ Putting it together: adrenal and retroperitoneal decisions", "D · Retroperitoneal mass", "<p><b>Image</b> → <b>exclude</b> paraganglioma (metanephrines), GCT (testis, markers), lymphoma before biopsy.</p>\n<p><b>Core biopsy</b>, retroperitoneal route, if it changes treatment.</p>\n<p><b>Sarcoma:</b> en bloc R0 at first operation (multivisceral if needed), specialist centre; never enucleate. Lifelong CT, especially liposarcoma (<span class=\"xref\">→ Ch 140</span>).</p>"], [13, "l", 2, "Ch 88 · Surgical, Radiologic and Endoscopic Anatomy of the Kidney and Ureter", "1 · Kidney: position and relations", "≈<span class=\"key\">11 cm</span>, 125–170 g (male); T12–L3, <b>right 1–2 cm lower</b>; descends ≈3 cm on inspiration/standing."], [13, "l", 2, "Ch 88 · Surgical, Radiologic and Endoscopic Anatomy of the Kidney and Ureter", "3 · Parenchyma and its imaging", "GFR ≈<span class=\"key\">125 mL/min</span>; ≈99% of filtrate reabsorbed. Urothelium calyces → urethra → urothelial carcinoma at any level."], [13, "r", 2, "Ch 88 · Surgical, Radiologic and Endoscopic Anatomy of the Kidney and Ureter", "3 · Parenchyma and its imaging", "<b>Nephrographic</b> · <span class=\"key\">80–120 s</span> · <b>Best for renal masses</b>"], [13, "p", 3, "Ch 88 · Surgical, Radiologic and Endoscopic Anatomy of the Kidney and Ureter", "5 · Percutaneous puncture and vessels", "Why the fornix? Arteries run on the anterior and posterior faces of the infundibula; a forniceal puncture through the papilla avoids them. If an infundibulum is unavoidable, choose the lower pole. Vascular injury → haemorrhage, AV fistula, pseudoaneurysm, loss of function."], [13, "p", 4, "Ch 88 · Surgical, Radiologic and Endoscopic Anatomy of the Kidney and Ureter", "8 · Radiologic anatomy of the ureter", "<b>Weigert–Meyer rule</b>: upper-moiety orifice <b>inferior and medial</b> → ureterocele, obstruction; lower moiety → VUR."], [13, "l", 4, "Ch 88 · Surgical, Radiologic and Endoscopic Anatomy of the Kidney and Ureter", "10 · Endoscopic anatomy", "Lower-pole infundibulum needs ≈<span class=\"key\">140°</span> deflection. Ducts of Bellini dilate with obstruction."], [13, "a", 4, "Ch 88 · Surgical, Radiologic and Endoscopic Anatomy of the Kidney and Ureter", "10 · Endoscopic anatomy", "<p>Infundibulotomy: superior → inferior → posterior quadrants; <b>never anterior</b></p>"], [13, "l", 5, "Ch 90 · Fundamentals of Nephrology", "1 · Why a urologist needs nephrology", "<b>Nephron</b>: ≈<span class=\"key\">1 million</span> per kidney; number fixed at birth; reduced nephron mass (nephrectomy, agenesis) → <b>hyperfiltration</b> of the rest."], [13, "p", 5, "Ch 90 · Fundamentals of Nephrology", "1 · Why a urologist needs nephrology", "Surgery, obstruction, its relief and drug dosing all change volume, electrolytes and acid–base. Glomerulus = pressure filter set by arteriolar tone; tubule = energy-hungry, near-hypoxic — most disorders fail one or the other."], [13, "p", 5, "Ch 90 · Fundamentals of Nephrology", "2 · Measuring kidney function", "Trap: after cystectomy or bladder repair, rising SCr with ascites may be <b>intraperitoneal urine leak</b> reabsorbed across the peritoneum — not kidney injury."], [13, "l", 5, "Ch 90 · Fundamentals of Nephrology", "3 · Acute kidney injury", "Net filtration pressure ≈<span class=\"key\">10 mm Hg</span> = glomerular hydrostatic 60 − Bowman's 18 − oncotic 32."], [13, "r", 6, "Ch 90 · Fundamentals of Nephrology", "3 · Acute kidney injury", "1 · Rise ≥<span class=\"key\">0.3 mg/dL</span> (within 48 h<span class=\"dag\">†</span>) or ×1.5 baseline (within 7 days<span class=\"dag\">†</span>) · &lt;0.5 mL/kg/h for 6 h"], [13, "l", 6, "Ch 90 · Fundamentals of Nephrology", "3 · Acute kidney injury", "MAP &gt;<span class=\"key\">65 mm Hg</span>; elderly vasculopaths need more."], [13, "l", 6, "Ch 90 · Fundamentals of Nephrology", "3 · Acute kidney injury", "SCr rise within <span class=\"key\">48 h</span> of IV iodinated contrast. Risk: age, diabetes, CKD, anaemia, arterial route."], [13, "l", 6, "Ch 90 · Fundamentals of Nephrology", "3 · Acute kidney injury", "<b>Gadolinium</b>: groups I and III → <b>NSF</b> — avoid in AKI, eGFR &lt;<span class=\"key\">30</span>, dialysis. Group II (gadobenate, gadoteridol, gadobutrol, gadoterate) allowed. <b>Group III (gadoxetate) treated as group I.</b>"], [13, "l", 7, "Ch 90 · Fundamentals of Nephrology", "3 · Acute kidney injury", "Days–weeks after drug; think of it in unexplained hospital AKI with <b>sterile pyuria</b>. Urine eosinophils insensitive, non-specific <span class=\"tag\">MCQ</span>."], [13, "l", 7, "Ch 90 · Fundamentals of Nephrology", "3 · Acute kidney injury", "Non-recovery ≥<span class=\"key\">90 days</span> = CKD/ESKD."], [13, "l", 7, "Ch 90 · Fundamentals of Nephrology", "5 · Chronic kidney disease", "<b>KDIGO</b>: abnormal structure or function ≥<span class=\"key\">3 months</span>; structure alone qualifies (atrophic kidney, normal GFR). Classify by <b>cause, GFR, albuminuria</b>."], [13, "l", 8, "Ch 90 · Fundamentals of Nephrology", "5 · Chronic kidney disease", "HbA1c &lt;7.5%; BP &lt;<span class=\"key\">130/80</span>; agent matters only in proteinuric disease → RAAS blockade."], [13, "l", 8, "Ch 90 · Fundamentals of Nephrology", "6 · Haematuria and proteinuria — when to involve a nephrologist", "<span class=\"dag\">†</span>Microhaematuria ≥<span class=\"key\">3</span> RBC/HPF on microscopy; dipstick needs confirmation."], [13, "a", 8, "Ch 90 · Fundamentals of Nephrology", "6 · Haematuria and proteinuria — when to involve a nephrologist", "<p>Haematuria ± proteinuria → microscopy + ACR + SCr/eGFR → casts, dysmorphic cells, AKI or systemic features → <b>urgent nephrology</b>; isolated non-glomerular haematuria → urological evaluation; isolated albuminuria → stage CKD, refer per criteria.</p>"], [13, "l", 8, "Ch 90 · Fundamentals of Nephrology", "7 · Electrolyte and acid–base disorders", "Of 1 L: D5 → <span class=\"key\">83 mL</span> intravascular; 0.9% saline 250 mL; 5% albumin 1000 mL."], [13, "l", 9, "Ch 90 · Fundamentals of Nephrology", "7 · Electrolyte and acid–base disorders", "<b>Rate</b>: chronic → ≤<span class=\"key\">8–12 mEq/L per 24 h</span>, else <b>osmotic demyelination</b>. Highest risk: resuscitated hypovolaemia → water diuresis; overcorrection → DDAVP + free water. Severe symptoms → <b>3% saline to raise 4–6 mEq/L</b>, then slow."], [13, "l", 9, "Ch 90 · Fundamentals of Nephrology", "7 · Electrolyte and acid–base disorders", "Free water; chronic → fall ≤<span class=\"key\">0.5 mEq/L/h</span> (else cerebral oedema)."], [13, "a", 9, "Ch 90 · Fundamentals of Nephrology", "7 · Electrolyte and acid–base disorders", "<p><b>Stabilise</b> (any ECG change): calcium gluconate 10% 10 mL IV → <b>shift</b>: insulin 10 U + 50 mL 50% dextrose; nebulised salbutamol 20 mg → <b>remove</b>: haemodialysis if oliguric/ESKD; loop diuretic if non-oliguric; bicarbonate if acidotic; binder → stop culprit drugs.</p>"], [13, "l", 9, "Ch 90 · Fundamentals of Nephrology", "7 · Electrolyte and acid–base disorders", "Treat if symptomatic or ≥<span class=\"key\">14 mg/dL</span>: <b>isotonic saline</b> 200 mL/h to urine 100–150 mL/h; loop only if overloaded; calcitonin (rapid, tachyphylaxis 48 h); IV bisphosphonate; denosumab."], [13, "l", 9, "Ch 90 · Fundamentals of Nephrology", "7 · Electrolyte and acid–base disorders", "<span class=\"tag\">MCQ</span> Laxative abuse → negative urine AG, urine pH &gt;5.8 → <b>ammonium acid urate stones</b>. <span class=\"dag\">†</span>Ileal/colonic conduits, neobladders → hyperchloraemic non-AG acidosis (NH₄Cl absorbed)."], [13, "a", 10, "Ch 90 · Fundamentals of Nephrology", "8 · Urinary tract obstruction and post-obstructive diuresis", "<p>Relieve obstruction → free oral fluids, no routine IV → persistently high output, hypovolaemia or obtunded/nil by mouth → panel every <span class=\"key\">4–6 h</span> (Na, K, phosphate, Ca, Mg) → replace ≈<span class=\"key\">75%</span> of output with <b>0.45% saline</b> + electrolytes.</p>"], [13, "p", 10, "Ch 90 · Fundamentals of Nephrology", "8 · Urinary tract obstruction and post-obstructive diuresis", "Why not replace all output? The diuresis is mostly appropriate excretion of retained salt, water and urea; <span class=\"dag\">†</span>full replacement keeps the patient expanded and sustains it."], [13, "l", 10, "Ch 90 · Fundamentals of Nephrology", "8 · Urinary tract obstruction and post-obstructive diuresis", "Small stone, low-grade obstruction: observe <span class=\"key\">2–4 weeks</span> safely; beyond 4 weeks unpredictable (recovery up to 5 months)."], [13, "l", 11, "Ch 91 · Renal Transplantation", "1 · End-stage disease and why transplant", "KDIGO <b>G5 (eGFR &lt;<span class=\"key\">15</span> mL/min/1.73 m²)</b> = ESRD <span class=\"xref\">→ Ch 90</span>."], [13, "l", 11, "Ch 91 · Renal Transplantation", "1 · End-stage disease and why transplant", "<span class=\"tag\">MCQ</span> First successful kidney transplant: identical twins, 1954."], [13, "p", 11, "Ch 91 · Renal Transplantation", "2 · Recipient evaluation", "Two questions: will the patient survive the operation, and will immunosuppression unmask something dormant (infection, cancer)?"], [13, "l", 11, "Ch 91 · Renal Transplantation", "2 · Recipient evaluation", "Evaluate before dialysis; deceased-donor listing at eGFR ≤<span class=\"key\">20</span>."], [13, "a", 12, "Ch 91 · Renal Transplantation", "4 · Deceased donation", "<p>Procurement: midline + sternotomy → bowel off retroperitoneum → control aorta, IVC → find aberrant/accessory arteries <b>before cannulation</b> → perfuse; ice via opened Gerota → <b>periureteric tissue preserved</b> → en bloc → back-table separation, cold storage</p>"], [13, "l", 12, "Ch 91 · Renal Transplantation", "5 · Living donation", "Donor mortality <span class=\"key\">3/10,000</span>; more gestational hypertension/pre-eclampsia; independent donor advocate mandatory."], [13, "a", 13, "Ch 91 · Renal Transplantation", "6 · The operation", "<p><b>Vein first</b>: end-to-side external iliac vein, 5-0/6-0 polypropylene → artery end-to-side external iliac (punch, avoid calcified clamp sites) → reperfuse → position without kink or stretch</p>"], [13, "a", 13, "Ch 91 · Renal Transplantation", "6 · The operation", "<p><b>Lich–Gregoir</b> extravesical: fill bladder → myotomy → open mucosa distally → spatulate → mucosa-to-mucosa 5-0/6-0 absorbable ± stent → loose detrusor closure as short tunnel</p>"], [13, "a", 14, "★ Putting it together: kidney function and transplant decisions", "A · Rising creatinine after urological surgery", "<p><b>1. Postrenal first:</b> catheter, bladder/renal scan. After cystectomy/bladder repair, rise + ascites = possible urine leak; drain creatinine ≫ serum (<span class=\"xref\">→ Ch 90</span>).</p>\n<p><b>2. Prerenal vs intrinsic:</b> FeNa &lt;1%, bland urine → volume depletion; &gt;1% + granular casts → ATN. Stop nephrotoxins, RAAS blockers, metformin.</p>\n<p><b>3. Dialysis</b> only for refractory \"AEIOU\": acidosis, electrolytes (K), intoxication, overload, uraemia.</p>"], [13, "p", 14, "★ Putting it together: kidney function and transplant decisions", "B · Post-obstructive diuresis", "After bilateral (or solitary-kidney) relief monitor output, electrolytes. Mostly physiological; <span class=\"dag\">†</span>pathological if it persists after euvolaemia. <span class=\"dag\">†</span>Don't replace every millilitre. If unable to drink, replace ≈75% with 0.45% saline (<span class=\"xref\">→ Ch 90</span>)."], [13, "a", 15, "★ Putting it together: kidney function and transplant decisions", "E · Child going for transplant", "<p>Mostly CAKUT, chiefly valves. Make the bladder safe: age-appropriate capacity at detrusor pressure &lt;40 cm H₂O (antimuscarinics, CIC, augmentation if needed). Remove refluxing ureters/kidneys causing infection, polyuria, hypertension. A poor bladder destroys the graft (<span class=\"xref\">→ Ch 92/61</span>).</p>"], [14, "r", 2, "Ch 148 · Anatomy and Development of the Prostate", "1 · Development (embryology)", "<span class=\"key\">10</span> · Epithelial buds invade mesenchyme; fix adult ductal pattern"], [14, "p", 2, "Ch 148 · Anatomy and Development of the Prostate", "1 · Development (embryology)", "McNeal: <b>re-awakening of embryonic induction</b> in ageing TZ stroma may initiate new glands → BPH."], [14, "l", 2, "Ch 148 · Anatomy and Development of the Prostate", "2 · Zonal anatomy (McNeal)", "Urethra bends <span class=\"key\">≈35°</span> at verumontanum; <b>13–15</b> ducts open dorsolaterally at the verumontanum — distal limit of TURP/enucleation."], [14, "p", 3, "Ch 148 · Anatomy and Development of the Prostate", "2 · Zonal anatomy (McNeal)", "Trap: CZ (around ejaculatory ducts) ≠ TZ. Short proximal ducts <b>enlarge</b> (BPH); long distal ducts <b>transform</b> (cancer). Enlarging TZ compresses PZ into the <b>surgical (pseudo)capsule</b> — the enucleation plane <span class=\"xref\">→ Ch 152</span>."], [14, "l", 3, "Ch 148 · Anatomy and Development of the Prostate", "5 · Secretions and clinical markers", "Prostatic fluid: <span class=\"key\">37–44%</span> of semen, acidic (pH ≈6.3); seminal vesicle fluid (majority, alkaline) supplies semenogelins."], [14, "l", 3, "Ch 148 · Anatomy and Development of the Prostate", "5 · Secretions and clinical markers", "Liquefaction by kallikreins within <span class=\"key\">20–30 min</span>; nonliquefaction if incomplete by 60 min."], [14, "p", 3, "Ch 148 · Anatomy and Development of the Prostate", "5 · Secretions and clinical markers", "Benign: high zinc blocks aconitase → citrate exported. Cancer: <b>zinc lost</b>, citrate oxidised → low citrate (<span class=\"dag\">†</span>basis of MR spectroscopy)."], [14, "l", 4, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "1 · Definitions and the four overlapping entities", "\"<b>Prostatism</b>\" obsolete; Paul Abrams coined \"LUTS\" <span class=\"tag\">MCQ</span>. \"Hypertrophy\" wrong: ↑ cell <b>number</b>."], [14, "l", 4, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "1 · Definitions and the four overlapping entities", "<span class=\"dag\">†</span>BOOI = PdetQmax − 2Qmax: <span class=\"key\">&gt;40 obstructed, 20–40 equivocal, &lt;20 unobstructed</span>."], [14, "p", 4, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "1 · Definitions and the four overlapping entities", "Viva: \"Is every man with LUTS and a big prostate obstructed?\" No. Size, symptoms, flow and obstruction are separate; obstruction is diagnosed only by pressure–flow."], [14, "l", 4, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "2 · Epidemiology", "Autopsy: <b>no BPH under 30</b>; ≈ <span class=\"key\">50% in the 50s</span><span class=\"dag\">†</span>, <span class=\"key\">88% in the 80s</span>. <b>Similar across all ethnic/geographic groups</b>."], [14, "l", 4, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "2 · Epidemiology", "Three axes: <b>symptoms</b> (IPSS), <b>enlargement</b>, <b>obstruction</b> (+ bother, QoL). Proposed volume cut-off <span class=\"key\">&gt;30 mL</span>; community composite IPSS &gt;7, Qmax &lt;15 mL/s, volume &gt;20 mL."], [14, "l", 4, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "2 · Epidemiology", "TPV ≈ <span class=\"key\">25 mL in the 30s → 35–45 mL in the 70s</span>; TZV ≈ 15 → 25 mL."], [14, "p", 5, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "3 · Aetiology", "BPH is an <b>accumulation</b> disease: volume = proliferation − death. Established BPH: equal/↓ replication, ↑ bcl-2; androgens act chiefly by <b>suppressing cell death</b> → withdrawal shrinks gland. Early BPH may involve rapid proliferation."], [14, "l", 5, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "3 · Aetiology", "Serum testosterone falls with age but <b>intraprostatic DHT and AR stay high</b>; DHT <b>maintained, not elevated</b> (old \"raised DHT\" used cadaveric controls) <span class=\"tag\">MCQ</span>."], [14, "a", 5, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "3 · Aetiology", "<p>Testosterone → stromal cell → <b>type 2 5α-reductase</b> (nuclear membrane, interstitial fibroblast) → DHT → autocrine on stroma or paracrine to epithelium → DHT–AR → DNA → growth factors → epithelial survival/growth</p>"], [14, "l", 5, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "3 · Aetiology", "≈ <span class=\"key\">90%</span> of prostatic androgen is testicular DHT; ≈10% adrenal. DHT: higher AR affinity, more stable complex."], [14, "l", 5, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "3 · Aetiology", "SRD5A2 on <span class=\"key\">chromosome 2p23</span> <span class=\"tag\">MCQ</span>: V89L ↓, A49T ↑ activity; BPH links inconsistent. Promoter methylation in up to 30% of BPH."], [14, "l", 6, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "3 · Aetiology", "<b>Waist circumference</b> predicts prostatectomy/LUTS independent of BMI. BMI &gt;35 vs &lt;25: OR <span class=\"key\">3.5</span> for prostate ≥40 mL. NAFLD associated."], [14, "l", 7, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "3 · Aetiology", "Young men with large glands (&gt;37 g): first-degree relatives ≈ <span class=\"key\">4-fold</span> risk of surgery (brothers ≈6–8-fold). <b>Autosomal dominant</b>; ≈ <span class=\"key\">50%</span> operated before 60 heritable vs ≈9% after 60."], [14, "l", 7, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "4 · Pathology", "<b>Middle lobe</b> is <b>periurethral</b> (no TZ at bladder neck) <span class=\"tag\">MCQ</span>. Patterns: middle, lateral, trilobar, posterior commissural (median bar)."], [14, "p", 7, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "4 · Pathology", "Human-only <b>capsule</b> transmits expansion onto the urethra; dog gets BPH but rarely obstructs (no capsule). TUIP relieves obstruction without volume change. Hence <b>size does not correlate with obstruction</b>."], [14, "a", 8, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "5 · Pathophysiology of obstruction", "<p>Hyperplasia → ↑ urethral resistance (static + dynamic) → detrusor compensation → cost in storage function → storage LUTS ± impaired emptying → (minority) decompensation</p>"], [14, "l", 8, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "5 · Pathophysiology of obstruction", "Many LUTS arise from <b>obstruction-induced bladder change</b>. ≈ <span class=\"key\">One-third</span> keep voiding dysfunction (mostly storage) after relief."], [14, "a", 8, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "5 · Pathophysiology of obstruction", "<p><b>Three-stage remodelling</b>: smooth muscle hypertrophy → compensation → decompensation (underactive bladder)</p>"], [14, "p", 8, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "5 · Pathophysiology of obstruction", "Storage LUTS persist after TURP because the collagen-rich, overactive detrusor does not reverse — counsel men with DO preoperatively. AUR is <b>not</b> the inevitable end: many in AUR have adequate detrusor and a precipitant."], [14, "l", 8, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "6 · Natural history", "≈ <span class=\"key\">40%</span> improve without treatment (watchful waiting = placebo); active drug ≈ twice placebo improvement in each stratum."], [14, "l", 8, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "6 · Natural history", "<b>Olmsted County</b>: IPSS ≈ <span class=\"key\">0.2–0.34 points/year</span> (steepest in 60s); Qmax ≈ <span class=\"key\">2.1%/year</span> fall (rapid if age ≥70, Qmax &lt;10); volume ≈ <span class=\"key\">0.6 mL/year</span> (≈1.9%/year, faster with higher PSA/volume). Volume &gt;50 mL ≈3.5-fold odds of moderate–severe LUTS."], [14, "l", 9, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "6 · Natural history", "<b>MTOPS</b> placebo: <span class=\"key\">4.5 per 100 patient-years</span> (17% at 4 yr); mostly <b>IPSS rise ≥4</b> (14%); AUR 2%; invasive therapy 5%; <b>no renal insufficiency</b>."], [14, "p", 9, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "6 · Natural history", "PSA = cheap surrogate for volume, the main driver of AUR and surgery; &gt;100-predictor models barely beat PSA alone."], [14, "p", 9, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "7 · Complications", "Death, renal failure, stones, infection are now rare. Common: <b>AUR and surgery</b>, predicted by age, symptoms, low flow and large gland (PSA)."], [14, "r", 9, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "7 · Complications", "Later surgery · <span class=\"key\">75%</span> · <span class=\"key\">26%</span>"], [14, "l", 9, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "7 · Complications", "Incidence: community ≈ <span class=\"key\">4.5–6.8/1000 person-years</span>; VA watchful waiting 9.6; PLESS placebo 18; MTOPS 6. Constant hazard."], [14, "l", 9, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "7 · Complications", "<b>Bladder stones</b>: ≈ <span class=\"key\">8×</span> commoner, renal stones not (stasis)."], [14, "p", 11, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "1 · Definitions and the diagnostic problem", "Bothersome LUTS ≠ BPH-related BOO until assessed. Aims: <b>grade severity/bother</b> and <b>identify the cause</b>. Symptoms, flow, PVR, volume and cystoscopy cannot separate obstruction from bladder dysfunction; only the <b>pressure–flow study</b> can (gold standard, reserved for when it changes surgery)."], [14, "l", 11, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "2 · History and symptom assessment", "AUASI/IPSS total <span class=\"key\">0–35</span>: mild <span class=\"key\">0–7</span>, moderate <span class=\"key\">8–19</span>, severe <span class=\"key\">20–35</span>."], [14, "l", 11, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "2 · History and symptom assessment", "Minimum perceptible change <span class=\"key\">3 points</span>; with severe baseline, <b>percentage</b> reduction more reliable."], [14, "l", 11, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "3 · Examination and DRE", "PV does not correlate with symptoms/obstruction, but <span class=\"key\">30 mL</span> and <span class=\"key\">50 mL</span> cut-offs predict treatment response and progression."], [14, "l", 12, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "4 · Frequency–volume charts and nocturia", "<b>Indication</b>: predominant <b>storage LUTS or nocturia</b>; more accurate than recall. <b>Duration</b> <span class=\"key\">3 days</span> (adherence falls at 7). Has a training effect — keep routine."], [14, "l", 12, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "4 · Frequency–volume charts and nocturia", "<b>Nocturia</b>: waking ≥1× to void. <b>Nocturnal polyuria</b>: night output <span class=\"key\">&gt;20%</span> of 24 h (young), <span class=\"key\">&gt;33%</span> over 65."], [14, "a", 12, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "4 · Frequency–volume charts and nocturia", "<p><b>Nocturia</b>: FVC → <span class=\"dag\">†</span>global polyuria (&gt;40 mL/kg/24 h → diabetes, intake) / nocturnal polyuria (heart failure, sleep apnoea, evening fluids, diuretic timing) / reduced capacity (OAB, BOO) → treat cause → persistent → consider <b>sleep apnoea</b> (AUA).</p>"], [14, "l", 12, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "5 · Laboratory tests", "<b>PSA</b> — PCa risk, volume surrogate, progression predictor. Only if life expectancy <span class=\"key\">&gt;10 years</span> and result changes management."], [14, "l", 12, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "5 · Laboratory tests", "PSA predicting <b>PV &gt;40 mL</b>: <span class=\"key\">&gt;1.6</span> (50s), <span class=\"key\">&gt;2.0</span> (60s), <span class=\"key\">&gt;2.3 ng/mL</span> (70s); AUC ≈0.76–0.78. Baseline PSA predicts AUR, surgery, symptom/Qmax change."], [14, "l", 12, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "6 · Instrumental investigations", "<span class=\"key\">&lt;30 mL</span> insignificant; persistently <span class=\"key\">&gt;50 mL</span> important; <span class=\"key\">200–300 mL</span> may mean DUA, poorer response; <span class=\"key\">&gt;300 mL</span> = significant chronic retention."], [14, "l", 12, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "6 · Instrumental investigations", "<b>Qmax</b>, voided volume, pattern (average flow less accurate). Inaccurate if voided volume <span class=\"key\">&lt;150 mL</span> → repeat; void in preferred position."], [14, "l", 12, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "6 · Instrumental investigations", "<b>Cannot distinguish BOO from DUA</b> (DUA 9–48%). Qmax <span class=\"key\">10 mL/s</span> more specific; <span class=\"key\">15 mL/s</span> more sensitive."], [14, "l", 13, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "6 · Instrumental investigations", "PFS indications (EAU): failed invasive treatment; cannot void <span class=\"key\">&gt;150 mL</span>; PVR <span class=\"key\">&gt;300 mL</span>; age <span class=\"key\">&gt;80</span> or <span class=\"key\">&lt;50 years</span> with voiding LUTS; neurological disease, pelvic surgery. AUA: before surgery if <b>Qmax &gt;10 mL/s</b>."], [14, "l", 13, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "6 · Instrumental investigations", "<b>IPP</b> <span class=\"key\">≥10 mm</span> = high grade; predicts need for therapy and <b>failed TWOC</b>; not a PFS substitute. BWT (2 mm), DWT, UEBW, penile cuff, NIRS: accurate but <b>none replaces PFS</b>."], [14, "a", 13, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "7 · Evaluation algorithms", "<p><b>EAU (≥40 yr)</b>: history (incl. sexual) → symptom score → exam + DRE → urinalysis → PVR → PSA (if LE &gt;10 yr). Abnormal DRE/PSA/urinalysis or neurological → relevant guideline. Not bothersome → no work-up. Significant PVR → renal US ± function. Bothersome → FVC (storage/nocturia) → prostate US + uroflow if treating → medical algorithm. Surgery → endoscopy if it alters choice; PFS for specific indications.</p>"], [14, "a", 13, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "7 · Evaluation algorithms", "<p><b>AUA</b>: history, exam, IPSS, urinalysis ± PVR/flow; <b>PVR &gt;300 mL → non-neurogenic chronic retention</b> → counsel (behavioural, medical, procedural) → reassess <span class=\"key\">4–12 weeks</span>: improved → follow-up; nocturia → FVC + drug; incomplete → FVC, PVR/flow, UDS, cystoscopy → OAB pathway, surgery, or both.</p>"], [14, "l", 13, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "8 · Watchful waiting (WW)", "Lifestyle: fluids <span class=\"key\">1.5–2 L/day</span>, none 2 h before bed; less caffeine/evening alcohol; retime diuretics; <b>double voiding</b>, <b>urethral milking</b>; avoid constipation; bladder retraining (suppress urge, target ≥3 h or 200–400 mL)."], [14, "p", 13, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "8 · Watchful waiting (WW)", "Treatment is driven by <b>bother and complicating features</b>, not score or size alone."], [14, "a", 14, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "9 · Medical therapy — choice", "<p><b>EAU</b>: not bothersome → WW | nocturnal polyuria → lifestyle ± desmopressin | storage → antimuscarinic or β3-agonist | <b>PV &gt;40 mL, long-term</b> → 5-ARI ± α1-blocker/PDE5I | otherwise α1-blocker or PDE5I → residual storage → add antimuscarinic/β3-agonist.</p>\n<p><b>AUA</b>: α-blocker (PDE5I if ED) → <b>prostate &gt;30 mL</b> → add 5-ARI → PDE5I trial → surgery.</p>"], [14, "p", 14, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "9 · Medical therapy — choice", "<b>Reading trials</b>: placebo improves scores and flow (4-week run-in ideal); judge by 3-point/percentage threshold; Qmax as %. Goals: relieve symptoms, reduce BOO, improve emptying, <b>prevent progression</b>."], [14, "p", 14, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "10 · α1-Blockers", "<b>Titration</b>: α1b blockade → <b>first-dose hypotension</b>/syncope; bedtime start + titration avoid it. Uroselectives fixed-dose; doxazosin GITS starts 4 mg untitrated."], [14, "p", 15, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "10 · α1-Blockers", "<b>IFIS</b>: <b>billowing iris, iris prolapse, progressive miosis</b>. α1a blockade → dilator atrophy → occurs <b>years after stopping</b>; stopping pre-op does <b>not</b> help. <b>Tamsulosin</b> highest, then alfuzosin, doxazosin, naftopidil. <span class=\"dag\">†</span>Awaiting cataract surgery → defer α1-blocker."], [14, "p", 15, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "10 · α1-Blockers", "One efficacy, three toxicities: <b>α1b → vascular</b> (terazosin, doxazosin); <b>α1a → ejaculation, IFIS</b> (silodosin, tamsulosin); <b>α1d → storage benefit</b> (naftopidil)."], [14, "l", 15, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "11 · 5α-Reductase inhibitors", "<b>Slow</b>: maximum shrinkage at <span class=\"key\">6 months</span>; benefit needs ≥6 months."], [14, "l", 15, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "11 · 5α-Reductase inhibitors", "<b>Volume dependent</b>: best at <span class=\"key\">&gt;40 mL</span> (PLESS PV &gt;55 mL → 70% reduction). Indication: EAU &gt;40 mL, AUA &gt;30 mL, moderate–severe LUTS."], [14, "p", 15, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "11 · 5α-Reductase inhibitors", "5-ARIs treat the gland: slow, volume-dependent, modest for symptoms, but prevent AUR and surgery — and halve PSA (trap and tool)."], [14, "p", 16, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "12 · Antimuscarinics", "Antimuscarinics treat the bladder, so every recommendation is anchored to a PVR ceiling (200 mL)."], [14, "l", 16, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "13 · β3-Agonists", "<b>Mirabegron</b> <span class=\"key\">25 mg</span> → <span class=\"key\">50 mg</span>; BOO safety trial: PVR rose only at 100 mg; less dry mouth."], [14, "l", 16, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "13 · β3-Agonists", "AEs: nasopharyngitis, headache, BP ≤1 mm Hg. <b>Contraindicated</b> in uncontrolled hypertension <span class=\"key\">≥180/110 mm Hg</span>; QT at 200 mg; moderate CYP2D6 inhibitor<span class=\"dag\">†</span>."], [14, "l", 16, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "15 · Combination therapy", "<b>Indication</b>: high risk — PV <span class=\"key\">&gt;30–40 mL</span>, PSA <span class=\"key\">&gt;1.5 ng/mL</span>. <b>SMART</b>: stop α-blocker after 6 months."], [14, "p", 16, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "15 · Combination therapy", "<b>α-blockers prevent symptomatic progression only; 5-ARIs prevent AUR and surgery.</b> α-blocker = fast dynamic relief; 5-ARI = slow static shrinkage."], [14, "a", 17, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "17 · Follow-up", "<p><span class=\"key\">4–12 weeks</span> (α-blocker response, AEs) → <span class=\"key\">6 months</span> (5-ARI) → <b>annually</b>: score, flow, PVR; PSA on 5-ARI if LE &gt;10 yr. WW: yearly.</p>"], [14, "a", 17, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "18 · Acute urinary retention", "<p>Catheter (<span class=\"dag\">†</span>suprapubic if fails) → <b>α1-blocker</b> → <b>TWOC ~3–5 days</b> → voids: continue (+5-ARI if large) → fails: up to <b>3 TWOCs</b> → recurrent/failure → PFS and surgery <span class=\"xref\">→ Ch 151</span>.</p>"], [14, "l", 17, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "18 · Acute urinary retention", "Emergency surgery more morbid → TWOC first; success ≈ <span class=\"key\">60%</span>; recurrence mostly within <b>6 months</b>."], [14, "l", 17, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "18 · Acute urinary retention", "Failure predictors: age, severe LUTS, drained <span class=\"key\">&gt;1 L</span>, spontaneous AUR, high-grade IPP."], [14, "p", 17, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "18 · Acute urinary retention", "<b>α-blocker rescues the TWOC</b> (dynamic); <b>5-ARI prevents the next episode</b> (static)."], [14, "p", 19, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "1 · Scope and principles", "Volume predicts progression (AUR, surgery) but correlates poorly with symptoms. <b>Symptoms decide whether to operate; size and shape decide which operation.</b> Gland &gt;30 cc triples AUR risk (Olmsted County)."], [14, "l", 19, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "2 · Work-up and indications for surgery", "History, examination, IPSS, urinalysis at baseline (St 1); repeat IPSS after treatment (St 3). Bands: <span class=\"key\">0–7 mild, 8–19 moderate, 20–35 severe</span>."], [14, "p", 20, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "3 · Choosing the operation", "Only enucleation spans every size band; only simple prostatectomy joins it above 80 cc. TUIP alone is confined to small glands. MISTs and RWT live in 30–80 cc — so volume and median lobe assessment precede every recommendation."], [14, "l", 20, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "4 · Monopolar TURP (m-TURP) — the benchmark", "AUA: TURP for &lt;30 and 30–80 cc (St 28); monopolar or bipolar by expertise (St 29). Monopolar irrigant non-ionic (water, <span class=\"key\">1.5% glycine</span><span class=\"dag\">†</span>, sorbitol) and <b>hypo-osmolar</b> → TUR syndrome."], [14, "a", 20, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "4 · Monopolar TURP (m-TURP) — the benchmark", "<p>Inspect bladder (tumour → resect it, defer TURP) → orifices, neck, trigone, veru, sphincter (indigo carmine/methylene blue if orifices hidden) → median lobe → lateral lobes → anterior and apex last → evacuate chips → haemostasis → large three-way catheter</p>"], [14, "l", 20, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "4 · Monopolar TURP (m-TURP) — the benchmark", "Post-op: even routine TURP absorbs <span class=\"key\">800–1000 mL</span> irrigant. Catheter out 24–48 h; stool softeners 2–4 weeks; no cycling 4–6 weeks; no sex ≥2 weeks."], [14, "l", 20, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "4 · Monopolar TURP (m-TURP) — the benchmark", "Warn: dysuria for weeks; eschar bleeding at <span class=\"key\">1–4 weeks</span>; storage symptoms → antimuscarinic/β3-agonist once emptying confirmed (detrusor overactivity may take months). Outcomes durable ~10 years."], [14, "l", 20, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "5 · TURP complications", "Risk: gland <span class=\"key\">&gt;45 cc</span>, resection <span class=\"key\">&gt;90 min</span>, perforation, irrigant height (keep ≈ <span class=\"key\">60 cm</span>; venous pressure ≈ <span class=\"key\">10 mm Hg</span>). Severe: Na<sup>+</sup> <span class=\"key\">&lt;120 mEq/L</span>."], [14, "a", 20, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "5 · TURP complications", "<p>Suspect → stop/expedite, haemostasis, stop irrigation → Na<sup>+</sup> → <span class=\"dag\">†</span>loop diuretic if overloaded → severe CNS: <b>3% saline 100 mL</b> (+2–3 mEq/L), repeat ×2 at 10 min (max 300 mL); target +4–6 mEq/L; ≤12 mEq/L in 24 h (≤8–10 if presentation &gt;48 h) → HDU</p>"], [14, "p", 21, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "5 · TURP complications", "Acute post-TURP hyponatraemia is safer to correct than chronic: brain has not yet shed organic osmolytes, so osmotic demyelination less likely. Bipolar saline TURP eliminates TUR syndrome."], [14, "r", 21, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "5 · TURP complications", "<b>Retrograde ejaculation</b> · About <span class=\"key\">two-thirds</span> · Counsel; erection, orgasm, desire unaffected"], [14, "a", 21, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "7 · TUIP", "<p>Collins knife / loop / Ho–Tm laser → 5 and/or 7 o'clock incision from distal to orifice, through bladder neck, to proximal to veru → deepen to capsule (± fat) → cautery → catheter out, home day 0–1</p>"], [14, "p", 22, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "8 · Bipolar TUVP", "Vaporisation trades haemostasis for a coagulated, specimen-free bed: coagulum → dysuria and retention; no anatomical plane → weaker durability. Same trade with PVP."], [14, "a", 22, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "11 · HoLEP", "<p>5 and 7 o'clock bladder-neck incisions (6 o'clock if no median lobe) → to veru, enucleate median lobe → perimontanal inverted-U, apical plane → sweep anteriorly to 11–1 o'clock → incise apical mucosal strip (no sphincter traction) → anterior plane to neck (\"Baleen\" sign = bladder) → lobes into bladder → defocused haemostasis → morcellation via nephroscope → 22 Fr three-way, ~60 mL balloon</p>"], [14, "l", 22, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "11 · HoLEP", "Retrograde ejaculation ≈ <span class=\"key\">three-quarters</span>; median-lobe-only ~90% preserved. Erections unchanged/improved. Retreatment rare (whole TZ removed, unlike TURP's peripheral rim); durable to 18 years. Anticoagulated: slightly longer LOS/CBI; warfarin worse than DOACs."], [14, "l", 23, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "13 · MISTs", "PUL: typically <span class=\"key\">4–6 implants</span> anterolaterally between dorsal veins and NVBs; FDA ≤100 cc not adopted by AUA. Encrusted implants → endoscopic graspers."], [14, "p", 23, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "13 · MISTs", "PUL moves tissue; WVTT ablates it. Hence PUL cannot treat a median lobe, needs no catheter, minimal dysuria; WVTT treats median lobes at the cost of catheter and weeks of irritation. Both preserve bladder neck → antegrade ejaculation."], [14, "l", 23, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "15 · True MISTs and temporary devices", "<b>iTind (TIPD)</b>: three nitinol struts (12, 5, 7 o'clock) + 6 o'clock anchor; left <span class=\"key\">5–7 days</span> → ischaemic remodelling; removed via 18 Fr catheter. St 41: 25–75 cc, no obstructing median lobe. Sham RCT: responder end point met, absolute IPSS difference not significant."], [14, "a", 24, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "16 · Prostate artery embolisation (PAE)", "<p>Femoral access, local anaesthesia → pelvic angiography → catheter balloon as landmark → 1.9–2.4 Fr microcatheter into prostatic arteries (mostly from internal pudendal; often duplicated) → microspheres to stasis — bilateral better</p>"], [14, "p", 25, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "17 · Overall comparison", "\"Gold standard\" for a given man = operation meeting his goals safely: shared decision on bothersome symptoms, size/shape, bleeding risk, ejaculation wishes, surgeon expertise."], [14, "l", 26, "Ch 152 · Simple Prostatectomy: Open, Laparoscopic and Robotic", "1 · Definition and surgical anatomy", "Enucleation of BPH adenoma only; gold standard for outlet obstruction with glands <span class=\"key\">&gt;80 g</span>."], [14, "l", 26, "Ch 152 · Simple Prostatectomy: Open, Laparoscopic and Robotic", "1 · Definition and surgical anatomy", "Eponyms <span class=\"tag\">MCQ</span>: <b>Freyer</b> suprapubic transvesical; <b>Millin (1945)</b> retropubic; first laparoscopic (Mariano) 2002, robotic (Sotelo) 2008."], [14, "l", 26, "Ch 152 · Simple Prostatectomy: Open, Laparoscopic and Robotic", "2 · Indications", "Gland <span class=\"key\">&gt;80–100 g</span> with bothersome LUTS refractory to medical/endoscopic therapy."], [14, "p", 26, "Ch 152 · Simple Prostatectomy: Open, Laparoscopic and Robotic", "3 · Pre-operative evaluation", "Work-up asks: big enough (TRUS)? cancer (DRE, PSA, MRI)? will the bladder empty (urodynamics)?"], [14, "p", 26, "Ch 152 · Simple Prostatectomy: Open, Laparoscopic and Robotic", "4 · Open techniques", "All open variants = enter → pseudocapsular plane → divide urethra at apex <b>proximal to verumontanum</b>, no sphincter traction → 5/7 o'clock haemostasis + bladder neck mucosal advancement."], [14, "a", 27, "Ch 152 · Simple Prostatectomy: Open, Laparoscopic and Robotic", "5 · Haemostasis", "<p>Postoperative bleeding → catheter traction (50 mL balloon) ± CBI → exclude coagulopathy → endoscopic clot evacuation + fulguration → reopen fossa if severe</p>"], [14, "a", 27, "Ch 152 · Simple Prostatectomy: Open, Laparoscopic and Robotic", "7 · Laparoscopic and robotic", "<p>Vertical cystotomy → orifices → bladder neck incision 3→9 o'clock under median lobe → <b>posterior plane</b> to apex → lobes → anterior commissure, see veru → transect urethra <b>just proximal to veru</b> → 5/7 barbed sutures → <b>vesicourethral mucosal advancement</b> (double-armed from 6 o'clock) → two-layer closure</p>"], [14, "p", 28, "Ch 152 · Simple Prostatectomy: Open, Laparoscopic and Robotic", "8 · Outcomes and comparisons", "Minimally invasive routes improve perioperative morbidity only; function identical because enucleation identical. Open transfusion now <span class=\"key\">&lt;5%</span>."], [14, "r", 28, "Ch 152 · Simple Prostatectomy: Open, Laparoscopic and Robotic", "9 · Complications", "Bladder neck contracture · Open <span class=\"key\">2–6%</span>; minimally invasive &lt;1% · Dilation or Collings knife incision to 22 Fr"], [14, "r", 28, "Ch 152 · Simple Prostatectomy: Open, Laparoscopic and Robotic", "9 · Complications", "Erectile dysfunction · <span class=\"key\">3–5%</span> · —"], [14, "r", 28, "Ch 152 · Simple Prostatectomy: Open, Laparoscopic and Robotic", "9 · Complications", "<b>Retrograde ejaculation</b> · <span class=\"key\">80–90%</span> · Counsel pre-op"], [14, "p", 28, "Ch 152 · Simple Prostatectomy: Open, Laparoscopic and Robotic", "9 · Complications", "Adenoma lies inside pseudocapsule, proximal to veru: bladder neck lost (retrograde ejaculation); sphincter and NVBs spared (incontinence, ED rare)."], [14, "a", 29, "★ Putting it together: the BPH pathway", "A · Man with LUTS", "<p><b>1. Assess:</b> IPSS (0–7 mild, 8–19 moderate, 20–35 severe), DRE, urinalysis, PSA if management changes, voiding diary if nocturia; uroflow + PVR before intervention <span class=\"xref\">→ Ch 150</span>.</p>\n<p><b>2. Complications → surgery:</b> refractory retention, recurrent UTI, stones, prostatic haematuria, renal impairment.</p>\n<p><b>3. Mild</b> → watchful waiting. <b>4. Bothersome</b> → drugs (B); failure → procedure (C).</p>"], [14, "p", 29, "★ Putting it together: the BPH pathway", "D · TURP complications", "TUR syndrome (glycine absorption): confusion, visual change, hyponatraemia → stop, check sodium, diuretic if overloaded, 3% saline if severe, correct slowly; bipolar prevents. Late: retrograde ejaculation (~two-thirds), stricture (meatus, bulb), bladder neck contracture (small gland, over-resection; ~6 months), incontinence (pelvic floor → sling/AUS) <span class=\"xref\">→ Ch 151</span>."], [15, "l", 2, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "1 · Epidemiology — the headline", "Worldwide: <b>second commonest</b> non-skin cancer, <b>fifth</b> cause of cancer death in men; 2020 ≈ <span class=\"key\">1.4 million cases, 375,000 deaths</span>."], [15, "l", 2, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "1 · Epidemiology — the headline", "Incidence varies ~13-fold (South Central Asia lowest, Northern Europe highest); US lifetime risk ≈ <span class=\"key\">1 in 8</span>; 5-year survival 97%, yet second cause of cancer death in US men."], [15, "l", 2, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "1 · Epidemiology — the headline", "<b>Incidence and mortality are decoupled.</b> Incidence tracks screening and wealth; mortality peaks where African ancestry meets poor access — <b>Caribbean has the highest mortality in the world</b> <span class=\"tag\">MCQ</span>. Asia lowest on both, but rising."], [15, "l", 2, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "1 · Epidemiology — the headline", "<b>Latent (autopsy) cancer</b>: ~5% &lt;30 y → 29% at 60–69 → <span class=\"key\">59% &gt;79 y</span>; higher in Black men at every age."], [15, "p", 2, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "1 · Epidemiology — the headline", "Aetiology is hard to study: in a PSA-screened population a diagnosis mostly means a man \"happened to have a PSA test\", so risk-factor studies may find determinants of <i>being tested</i>. Preferred end point: <b>aggressive disease</b> (advanced, metastatic, death). <b>Healthy-user bias</b>: health-conscious men seek PSA tests, so healthy habits spuriously raise incidence while lowering mortality."], [15, "l", 2, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "2 · Established risk factors", "<b>Race</b>: Black men have highest incidence (172.6/100,000 US) and <span class=\"key\">twice</span> the cancer-specific mortality of White men, younger and more metastatic at presentation. Drivers: unequal access, comorbidity and <b>8q24</b> (and 17q21) alleles. <b>Equal access → equal outcome</b> in non-metastatic disease."], [15, "l", 2, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "2 · Established risk factors", "<b>Family history</b>: ~20% of patients; twin heritability up to <span class=\"key\">58%</span> — genes outweigh shared lifestyle."], [15, "r", 2, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "2 · Established risk factors", "Both father and brother · <span class=\"key\">9×</span>"], [15, "l", 3, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "5 · Possible risk factors — body, metabolism, lifestyle", "<b>Adult serum testosterone does <i>not</i> predict risk</b> <span class=\"tag\">MCQ</span>; genetically higher free testosterone, IGF-1 and early puberty modestly do."], [15, "l", 3, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "5 · Possible risk factors — body, metabolism, lifestyle", "<b>Composite healthy lifestyle</b> → <span class=\"key\">30–50%</span> lower lethal cancer; in highest polygenic-risk quartile lifetime lethal risk 5.3% → 1.6%."], [15, "l", 4, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "5 · Possible risk factors — body, metabolism, lifestyle", "Transgender women on oestrogen: median PSA ≈ <span class=\"key\">0.02 ng/mL</span> (50-fold lower) → lower the cut-points."], [15, "p", 4, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "6 · Supplements", "Vitamin E worked in ATBC but failed in SELECT: ATBC used a tenfold lower dose in <b>heavy smokers</b> with little PSA screening (aggressive cancers); SELECT used 400 IU in non-smokers with widespread screening (indolent cancers). Different disease, different answer."], [15, "p", 4, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "7 · Chemoprevention", "Cardiovascular disease kills more men with non-metastatic prostate cancer than the cancer does — lifestyle advice benefits both."], [15, "l", 4, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "8 · PSA screening", "Screening ↓ cancer death ~<span class=\"key\">20–30%</span>, building with time."], [15, "r", 5, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "9 · Landmark trials", "<b>PCPT</b> · 18,882, PSA ≤3; finasteride 5 mg 7 y · Cancer ↓ <span class=\"key\">24.8%</span> (18.4 vs 24.4%); Gleason 7–10 6.4 vs 5.1%; 18-y death ↓ 25% (NS) · Fewer cancers, more high-grade"], [15, "r", 5, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "9 · Landmark trials", "<b>REDUCE</b> · PSA 2.5–10, prior negative biopsy; dutasteride 0.5 mg 4 y · Cancer ↓ <span class=\"key\">22.8%</span>; Gleason 8–10 0.9 vs 0.6% (years 3–4: 12 vs 1) · FDA warning"], [15, "l", 6, "Ch 154 · Prostate Cancer Biomarkers", "2 · PSA biology", "PSA = <b>hK3</b>, gene KLK3 on <b>19q13</b>; androgen-regulated serine protease that <b>liquefies semen</b> (cleaves semenogelin). Half-life <span class=\"key\">2–3 days</span>."], [15, "l", 6, "Ch 154 · Prostate Cancer Biomarkers", "2 · PSA biology", "Biopsy: rise lasts ≥<span class=\"key\">4 weeks</span>; cycling &gt;55 km ~10%; ejaculation transient (24 h) — repeat after abstinence."], [15, "l", 6, "Ch 154 · Prostate Cancer Biomarkers", "2 · PSA biology", "<b>5ARIs</b>: PSA falls ~<span class=\"key\">50%</span> by 12 months → <b>double</b> it (overestimates first 6 months, underestimates after years)."], [15, "r", 6, "Ch 154 · Prostate Cancer Biomarkers", "3 · PSA derivatives", "<b>PSA density</b> · PSA ÷ volume; cut-off <span class=\"key\">0.15</span> (0.08–0.15) · After negative/equivocal MRI; ≤0.15 = Johns Hopkins AS entry; predicts AS reclassification"], [15, "p", 6, "Ch 154 · Prostate Cancer Biomarkers", "3 · PSA derivatives", "%fPSA was validated against <i>any</i> cancer, not GG ≥2, so it overestimates significant risk. Risk calculators (PCPT, Prostate Biopsy Collaborative Group) include it."], [15, "r", 7, "Ch 154 · Prostate Cancer Biomarkers", "4 · Blood and urine tests (NCCN 2023 pre-biopsy)", "<b>4Kscore</b> · Blood: tPSA, fPSA, iPSA, <b>hK2</b> + age, DRE, prior biopsy · <span class=\"key\">7.5%</span>: sensitivity 94%, NPV 95%; ≤7.5% = low long-term metastasis risk"], [15, "l", 7, "Ch 154 · Prostate Cancer Biomarkers", "4 · Blood and urine tests (NCCN 2023 pre-biopsy)", "<b>TMPRSS2:ERG</b>: <span class=\"key\">~100% specific</span> but in ~half of tumours → combined with PCA3."], [15, "p", 7, "Ch 154 · Prostate Cancer Biomarkers", "4 · Blood and urine tests (NCCN 2023 pre-biopsy)", "Urine tests follow a DRE because cancer RNA comes only from shed cells massaged into the urethra. ExoDx avoids this: exosomes are shed spontaneously. Urinary markers are highly specific; weakness is coverage → panels."], [15, "a", 8, "Ch 154 · Prostate Cancer Biomarkers", "7 · Clinical algorithm", "<p>Raised PSA → repeat (exclude infection, instrumentation, ejaculation, 5ARI) → MRI and/or biomarker (PHI, 4Kscore, IsoPSA, SelectMDx, EPI, MPS; PSA density) → biopsy if risk high</p>\n<p>Negative biopsy, persistent suspicion → MRI, %fPSA, PCA3/EPI/MPS (repeat thresholds), ConfirmMDx → targeted re-biopsy</p>\n<p>Favourable-risk → PSA density, Prolaris/Oncotype/Decipher → AS vs treatment</p>\n<p>After RP → <span class=\"dag\">†</span> PSA undetectable; ≥0.2 ng/mL confirmed = biochemical recurrence → Decipher/PORTOS for adjuvant/salvage RT</p>"], [15, "l", 9, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "1 · Indications and contraindications", "<b>Repeat</b>: rising PSA; ASAP (<span class=\"key\">≈50%</span> cancer risk); atypical intraductal proliferation; positive PCA3/ConfirmMDx; suspicious MRI; recurrence after ablation; AS."], [15, "l", 9, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "1 · Indications and contraindications", "PSA density <span class=\"key\">&gt;0.15 ng/mL/cc</span> suggests cancer. Volume = π/6 × transverse × AP × length; 1 cm³ ≈ 1 g."], [15, "p", 9, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "2 · Pre-biopsy mpMRI", "DCE never creates or downgrades PI-RADS 4–5 and never upgrades a TZ lesion. mpMRI misses a minority of significant cancers (mostly 3+4): MRI-invisible lesions, reader discordance, registration/needle error, small lesion in large gland — so systematic cores remain relevant."], [15, "l", 10, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "5 · Antibiotic prophylaxis", "Transrectal: every patient. AUA 2019: fluoroquinolone; 1st/2nd-generation cephalosporin ± aminoglycoside; or 3rd-generation cephalosporin. ≥1 h before; duration <span class=\"key\">≤24 h</span>."], [15, "l", 10, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "5 · Antibiotic prophylaxis", "Infection risk: antibiotics within <span class=\"key\">6 months</span> (most consistent), diabetes, immunosuppression, prior UTI/biopsy infection, many prior biopsies, travel (India, South-East Asia), health-care worker, rectal resistant <i>E. coli</i> → augmented or swab-targeted prophylaxis, or TP."], [15, "r", 11, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "7 · Complications and management", "Sepsis · <span class=\"key\">0.3–3.1%</span> · Carbapenem until cultures"], [15, "a", 11, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "7 · Complications and management", "<p><b>Post-biopsy fever</b> → assess sepsis → cultures → <b>no empirical fluoroquinolone</b> (resistant <i>E. coli</i>, also to co-trimoxazole, ampicillin) → carbapenem (or amikacin/3rd-generation cephalosporin per sensitivity) → resuscitate.</p>"], [15, "a", 11, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "7 · Complications and management", "<p><b>Persistent rectal bleeding</b> → pressure → tamponade (sheath or Foley balloon) → endoscopy with adrenaline/sclerosant → angioembolisation → transrectal suture.</p>"], [15, "p", 11, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "7 · Complications and management", "Commonest complication: bleeding overall; infection among serious ones/admissions (1.0% → 4.1% in the resistance era). Frequent-trivial vs rare-dangerous → universal prophylaxis, move to perineum."], [15, "l", 11, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "8 · Repeat and saturation biopsy", "Yield falls each round: ERSPC <span class=\"key\">22% → 10% → 5% → 4%</span> on biopsies 2–4. Third/fourth only for high suspicion; now mpMRI ± targeted, ConfirmMDx, anterior/TZ cores, TP route. Transurethral biopsy obsolete."], [15, "m", 11, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "10 · MCQ one-liners", "Commonest false-positive hypoechoic lesion: BPH foci and prostatitis."], [15, "m", 11, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "10 · MCQ one-liners", "Significant cancer in PROMIS: Grade Group ≥3 or core length ≥6 mm."], [15, "m", 11, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "10 · MCQ one-liners", "Absent seminal vesicle: ipsilateral renal agenesis in 79%."], [15, "m", 11, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "10 · MCQ one-liners", "Müllerian cysts midline; wolffian cysts lateral."], [15, "l", 12, "Ch 156 · Pathology of Prostatic Neoplasia", "1 · Precursor and intraductal lesions", "~<span class=\"key\">20%</span> of HGPIN carries <b>TMPRSS2:ERG</b>. No repeat biopsy for isolated HGPIN (unifocal or multifocal, or on TUR) once mpMRI, DRE and PSA are considered."], [15, "l", 12, "Ch 156 · Pathology of Prostatic Neoplasia", "1 · Precursor and intraductal lesions", "<b>IDC-P</b>: atypia beyond HGPIN (dense cribriform), <b>basal cells retained</b>; usually <b>retrograde spread of high-grade invasive cancer</b>. Prevalence ~2% low risk → &gt;50% metastatic. Independently predicts early BCR. GG1 + IDC-P → upgraded at RP in <span class=\"key\">&gt;80%</span>. Strict (Guo–Epstein) criteria license definitive therapy without proven invasion."], [15, "p", 12, "Ch 156 · Pathology of Prostatic Neoplasia", "1 · Precursor and intraductal lesions", "HGPIN is a weak risk marker; IDC-P usually marks high-grade cancer already present. Traps: re-biopsy for HGPIN; surveillance for GG1 with IDC-P."], [15, "l", 12, "Ch 156 · Pathology of Prostatic Neoplasia", "2 · Adenocarcinoma: location, spread, staging", "<b>Zones (McNeal)</b>: <span class=\"dag\">†</span>PZ ~70% of gland and ~70% of cancers — main mass in T2 and <span class=\"key\">85%</span> of T1c; posterolateral, palpable. <span class=\"dag\">†</span>TZ ~5% of gland, ~20% of cancers — BPH origin; anterior, impalpable, under-sampled, lower grade. <span class=\"dag\">†</span>CZ ~25% of gland, ~5% of cancers — around ejaculatory ducts; rare but aggressive (SVI). Periurethral glands &lt;1% (median lobe)."], [15, "l", 12, "Ch 156 · Pathology of Prostatic Neoplasia", "2 · Adenocarcinoma: location, spread, staging", "EPE uncommon &lt;<span class=\"key\">0.5 cm³</span>; nodes/SVI uncommon &lt;<span class=\"key\">4 cm³</span>."], [15, "r", 13, "Ch 156 · Pathology of Prostatic Neoplasia", "3 · Grading: Gleason and grade groups", "1 · 3+3 · 0% · <span class=\"key\">96%</span>"], [15, "r", 13, "Ch 156 · Pathology of Prostatic Neoplasia", "3 · Grading: Gleason and grade groups", "2 · 3+4 · 0.6% · <span class=\"key\">88%</span>"], [15, "r", 13, "Ch 156 · Pathology of Prostatic Neoplasia", "3 · Grading: Gleason and grade groups", "3 · 4+3 · 4.3% · <span class=\"key\">63%</span>"], [15, "r", 13, "Ch 156 · Pathology of Prostatic Neoplasia", "3 · Grading: Gleason and grade groups", "4 · 4+4, 3+5, 5+3 · — · <span class=\"key\">48%</span>"], [15, "r", 13, "Ch 156 · Pathology of Prostatic Neoplasia", "3 · Grading: Gleason and grade groups", "5 · 9–10 · — · <span class=\"key\">26%</span>"], [15, "p", 13, "Ch 156 · Pathology of Prostatic Neoplasia", "3 · Grading: Gleason and grade groups", "Steep drop between GG2 and GG3 — never lump \"7\". 3+5 and 5+3 are GG4; GG5 starts at 9. Pure GG1 cannot metastasise, so calling it \"cancer\" is debated."], [15, "p", 13, "Ch 156 · Pathology of Prostatic Neoplasia", "3 · Grading: Gleason and grade groups", "<span class=\"dag\">†</span>Cribriform and IDC-P mark aggressive disease and argue against AS even in GG2, so they must be reported. Aggregate grading of a targeted lesion avoids under-grading (one core) and over-grading (highest core)."], [15, "r", 13, "Ch 156 · Pathology of Prostatic Neoplasia", "3 · Grading: Gleason and grade groups", "Biopsy GG1 → RP · ~<span class=\"key\">⅓</span>"], [15, "l", 14, "Ch 156 · Pathology of Prostatic Neoplasia", "4 · Needle biopsy assessment", "<b>ASAP</b>: ~5% of biopsies; cancer ~<span class=\"key\">40%</span>, PSA does not stratify; ~80% GG1, ~5% GG4–5. <b>Expert review before re-biopsy</b>, then re-biopsy sampling the atypical site."], [15, "p", 14, "Ch 156 · Pathology of Prostatic Neoplasia", "4 · Needle biopsy assessment", "Sampling error is one-directional: a bad biopsy is believed, a good one is provisional, an atypical one is re-examined before it is repeated."], [15, "l", 14, "Ch 156 · Pathology of Prostatic Neoplasia", "5 · TUR and RP specimens", "<b>EPE</b>: focal vs nonfocal predicts progression. <b>SVI</b>: <span class=\"key\">65%</span> 5-yr progression."], [15, "l", 14, "Ch 156 · Pathology of Prostatic Neoplasia", "5 · TUR and RP specimens", "<b>Margins</b>: ~15% positive (robotic); only ~50% progress. Distance to ink irrelevant. Report <b>extent (focal
