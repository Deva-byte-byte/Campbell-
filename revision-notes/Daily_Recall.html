rinciples of Perioperative Management in Children", "4 · Anaesthesia considerations", "FDA warning (2016): repeated or lengthy (<span class=\"key\">&gt; 3 h</span>) anaesthesia at <span class=\"key\">&lt; 3 years</span> or third-trimester pregnancy may affect brain development — based on animal neuroapoptosis."], [3, "l", 30, "Ch 38 · Core Principles of Perioperative Management in Children", "4 · Anaesthesia considerations", "<b>Autonomic dysreflexia</b> (lesion ≥ <span class=\"key\">T6</span>): bladder distension/noxious stimulus → severe hypertension, bradycardia, stroke. <span class=\"dag\">†</span> Stop stimulus, drain bladder, sit up, rapid antihypertensive."], [3, "l", 30, "Ch 38 · Core Principles of Perioperative Management in Children", "5 · Fluid and electrolyte management", "<b>Holliday–Segar 4-2-1</b>: <span class=\"key\">4 mL/kg/h</span> first 10 kg + <span class=\"key\">2 mL/kg/h</span> next 10 kg + <span class=\"key\">1 mL/kg/h</span> per kg above 20. 22 kg → 40 + 20 + 2 = 62 mL/h."], [3, "p", 31, "Ch 38 · Core Principles of Perioperative Management in Children", "5 · Fluid and electrolyte management", "<b>Why isotonic?</b> Surgical stress, pain, nausea, hypoxia → non-osmotic ADH release → aquaporin-2 water retention. Hypotonic fluid adds free water → hyponatraemia (&lt; 135 mmol/L). <span class=\"dag\">†</span> Large brain-to-skull ratio → little room for cerebral oedema; encephalopathy can be fatal."], [3, "l", 31, "Ch 38 · Core Principles of Perioperative Management in Children", "6 · Blood loss and transfusion †", "Transfuse at haemoglobin <span class=\"key\">&lt; 7 g/dL</span> in stable children (higher in neonates, cyanotic heart disease, active bleeding); 10–15 mL/kg raises haemoglobin ≈ 2–3 g/dL."], [3, "l", 31, "Ch 38 · Core Principles of Perioperative Management in Children", "8 · Antibiotic prophylaxis and intraoperative crises", "<b>Timing</b>: within <span class=\"key\">60 min</span> of incision; vancomycin and fluoroquinolones within <span class=\"key\">120 min</span>."], [3, "l", 31, "Ch 38 · Core Principles of Perioperative Management in Children", "8 · Antibiotic prophylaxis and intraoperative crises", "Doses: cefazolin <span class=\"key\">30 mg/kg</span> (redose 4 h); ampicillin 50 mg/kg (2 h); gentamicin 2.5 mg/kg, vancomycin 15 mg/kg, metronidazole 15 mg/kg, ciprofloxacin 10 mg/kg (not redosed)."], [3, "l", 33, "Ch 39 · Principles of Laparoscopic and Robotic Surgery in Children", "1 · Evolution and indications", "First paediatric urological laparoscopy: non-palpable testis, <span class=\"key\">1976</span>. Intracorporeal suturing was the bottleneck; the wristed robot removed it → growth in <b>reconstruction</b> (pyeloplasty commonest; reimplantation, (hemi)nephrectomy, intra-abdominal testis, urachal/diverticulum excision; deep pelvis — utricle, urogenital sinus, bladder neck)."], [3, "r", 33, "Ch 39 · Principles of Laparoscopic and Robotic Surgery in Children", "2 · Physiology of pneumoperitoneum", "Maximum IAP · <span class=\"key\">≤ 6</span> · <span class=\"key\">≤ 8</span> · <span class=\"key\">≤ 10</span> · <span class=\"key\">≤ 12 mm Hg</span>"], [3, "l", 34, "Ch 39 · Principles of Laparoscopic and Robotic Surgery in Children", "6 · Robotics in children", "<b>Working space</b> ≈ <span class=\"key\">1 L at 1 year vs 6 L in adults</span> → collisions. Aids: wide port spacing, linear placement, \"burping\" ports, minimal inhalational agent, enema and rectal tube."], [3, "l", 34, "Ch 39 · Principles of Laparoscopic and Robotic Surgery in Children", "6 · Robotics in children", "<b>Limitations</b>: no 5-mm robotic ports; single-port needs a 25-mm cannula and ≈ <span class=\"key\">10 cm</span> to target — prohibitive in small children; no haptics; cost; training."], [3, "p", 35, "Ch 39 · Principles of Laparoscopic and Robotic Surgery in Children", "7 · Complications", "<b>Ergonomics</b>: laparoscopy strains hands, thumb, shoulders → table at 70–80% elbow height, monitor at eye level. Robot offloads the arm but fixes the neck; use the clutch to keep elbows on the armrest."], [3, "l", 36, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "1 · Principles and terminology", "<b>Expected bladder capacity (EBC)</b>: infant ≤1 y = <span class=\"key\">weight (kg) × 7 mL</span>; older = <span class=\"key\">(age in years + 2) × 30 mL</span>. Small &lt;65% EBC; large &gt;150% (some &gt;130%). Functional capacity (largest diary void, or void + PVR) normal ≈70–115% EBC."], [3, "l", 36, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "2 · History", "<b>Secondary enuresis</b> = wetting after <span class=\"key\">≥6 months</span> dry → look for stressors."], [3, "a", 36, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "2 · History", "<p>BBD: Rome IV → 7-day diary + urinalysis + pelvic US → <b>treat bowel first</b> → LUTS persist → uroflow + EMG → urotherapy → anticholinergic → β3-agonist → botulinum toxin / biofeedback / neuromodulation.</p>"], [3, "l", 37, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "5 · Non-invasive urodynamics", "Uroflow valid only if toilet-trained, voided volume <span class=\"key\">≥50% EBC</span> (pattern needs ≈50–100 mL), &gt;1 curve; emptying data only."], [3, "p", 37, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "5 · Non-invasive urodynamics", "Curve = detrusor vs outlet. Too much detrusor → tower; too much outlet → plateau; intermittent outlet activity → staccato; intermittent detrusor effort → interrupted. Patch EMG tells which side is at fault."], [3, "l", 37, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "5 · Non-invasive urodynamics", "<b>Pelvic US</b>: bladder wall abnormal <span class=\"key\">&gt;3 mm full / &gt;5 mm empty</span>; rectal diameter <span class=\"key\">&gt;30 mm</span> without urge = faecal loading."], [3, "l", 37, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "5 · Non-invasive urodynamics", "<b>PVR</b> (repeat — variable): abnormal at 4–6 y <span class=\"key\">&gt;30 mL or &gt;21%</span> of capacity; 7–12 y <span class=\"key\">&gt;20 mL or &gt;15%</span>; repeated &gt;20 mL abnormal. Valid only if <b>&lt;5 min</b> after void with bladder 50–115% EBC — late or over-distended = invalid, not abnormal."], [3, "l", 37, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "6 · Invasive urodynamics", "Routine culture/prophylaxis not needed — post-study UTI ≈ <span class=\"key\">1.4%</span>"], [3, "l", 37, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "6 · Invasive urodynamics", "<b>Stop filling</b> at strong urge, discomfort, voiding, leak &gt; fill rate, Pdet persistently <span class=\"key\">&gt;40 cmH₂O</span>, or volume <span class=\"key\">&gt;150% EBC</span>."], [3, "l", 38, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "6 · Invasive urodynamics", "<b>Compliance = ΔV/ΔPdet</b>, calculate every study: <span class=\"key\">&gt;20 normal; 10–20 moderately; &lt;10 severely impaired</span>. In small contracted bladders absolute Pdet (&lt;30–40) is the better guide; an <b>early</b> rise means most of the day at high pressure."], [3, "l", 38, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "6 · Invasive urodynamics", "DLPP threshold <span class=\"key\">&gt;40 cmH₂O</span> (or no leak at high pressure) = danger; ALPP has no paediatric norms."], [3, "p", 38, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "6 · Invasive urodynamics", "<b>McGuire (1981)</b>, myelodysplasia: leak pressure &gt;40 cmH₂O → hydronephrosis or secondary VUR in <span class=\"key\">85%</span>; pressure is transmitted up the ureters. Aim for the lowest achievable pressure."], [3, "l", 38, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "6 · Invasive urodynamics", "Normal Pdet at Qmax ≈ boys 66, girls 57 cmH₂O; infant boys up to 118 (physiological) <span class=\"tag\">MCQ</span>."], [3, "p", 38, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "6 · Invasive urodynamics", "<b>Upper-tract threats</b>: compliance &lt;20 (esp. &lt;10); DLPP &gt;40 cmH₂O; sustained high filling Pdet; DSD with poor emptying; high voiding pressure with poor flow. Interobserver agreement poor."], [3, "r", 38, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "7 · Evaluation in specific conditions", "Spinal dysraphism · UMPIRE risk by DLPP/end-fill Pdet: <span class=\"key\">&lt;25 low; 25–39 or DO intermediate; ≥40 high</span> · Baseline, serial, pre-surgery"], [3, "p", 39, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "7 · Evaluation in specific conditions", "UMPIRE dropped DSD from high risk because reviewers could not agree who had it — not proof DSD is benign. Neurogenic bladder goals: normal capacity, low storage pressure, complete emptying, upper-tract protection."], [3, "l", 40, "Ch 42 · Bladder Anomalies in Children", "2 · Fetal bladder on ultrasound", "Wall ≤3 mm; seen in nearly all by 13 weeks. Empties every <span class=\"key\">15–20 min</span> → if not seen, <b>repeat in the same sitting</b>. Amniotic fluid mainly fetal urine after <span class=\"key\">16 weeks</span>."], [3, "r", 40, "Ch 42 · Bladder Anomalies in Children", "3 · Megacystis", "10–14 weeks · Length ≤6 mm; &lt;10% of CRL · <span class=\"key\">≥8 mm</span>; ≥13% of CRL"], [3, "l", 40, "Ch 42 · Bladder Anomalies in Children", "3 · Megacystis", "Euploid 7–15 mm → most resolve; <span class=\"key\">&gt;15 mm</span> → none (all obstructive). Resolution before 23 weeks → no postnatal surgery; after → most need intervention. <b>Persistent megacystis + oligohydramnios = LUTO.</b>"], [3, "p", 41, "Ch 42 · Bladder Anomalies in Children", "3 · Megacystis", "Female fetus with megacystis cannot have PUV → think MMIHS, cloacal anomaly, urethral atresia."], [3, "a", 41, "Ch 42 · Bladder Anomalies in Children", "4 · Bladder duplication", "<p>relieve obstruction, prevent infection → later: both sphincters competent → join distal urethras; one incompetent → close that bladder neck, excise its urethra; vaginas joined + vulvoplasty</p>"], [3, "a", 41, "Ch 42 · Bladder Anomalies in Children", "6 · Urachal anomalies", "<p>infected → drain + antibiotics first → infraumbilical incision → circumscribe at umbilicus (preserve) → extraperitoneal to dome → excise with <b>bladder cuff</b> → two-layer closure → catheter overnight</p>"], [3, "r", 42, "Ch 42 · Bladder Anomalies in Children", "7 · Acquired lesions", "Nephrogenic adenoma · Female 5:1; after infection, stones, surgery, augmentation · TUR; <span class=\"key\">80% recur</span> → surveillance cystoscopy"], [3, "p", 44, "Ch 43 · Exstrophy–Epispadias Complex", "3 · Variants", "Superior vesical fissure inflated the belief that variants do better. All others need formal closure and follow-up like CBE."], [3, "a", 44, "Ch 43 · Exstrophy–Epispadias Complex", "5 · Newborn care and selection", "<p>tie cord with 2-0 silk (no clamp) → non-adherent plastic wrap → saline irrigation at each nappy change → cardiopulmonary assessment, renal US → transfer to exstrophy centre; MDT counselling</p>"], [3, "l", 44, "Ch 43 · Exstrophy–Epispadias Complex", "5 · Newborn care and selection", "<b>Assess</b> template (≥<span class=\"key\">3 × 3 cm</span> suitable), diastasis and malleability under anaesthesia, urethral plate, penile length. Plate that <b>bulges on crying or indents under anaesthesia</b> is adequate."], [3, "p", 45, "Ch 43 · Exstrophy–Epispadias Complex", "6 · Surgical philosophies", "Erlangen, Kelly and CPRE claim to avoid BNR, yet almost all still need an outlet procedure — compressed reconstruction adds ischaemic and outlet risk without removing that need."], [3, "a", 45, "Ch 43 · Exstrophy–Epispadias Complex", "7 · Primary closure (MSRE stage 1)", "<p>GA + <b>epidural</b> (T10–T12) → 2-cm mucosal strip trigone → mid-shaft/vaginal orifice → incise bladder–skin junction → free from rectus, peritoneum off dome → <b>divide urogenital diaphragm fibres sharply to levator hiatus</b> → free corpora from rami → close bladder, neck, posterior urethra; <b>taper over 12-Fr sound</b> → suprapubic Malecot (4 weeks) + ureteric stents; <b>urethra unstented</b> → <b>No. 2 nylon horizontal mattress</b> pubic suture, knot away from neourethra → neoumbilicus</p>"], [3, "l", 45, "Ch 43 · Exstrophy–Epispadias Complex", "8 · Osteotomy and immobilisation", "Osteotomy if: closure <span class=\"key\">&gt;72 h</span>, diastasis <span class=\"key\">&gt;4 cm</span>, stiff pelvis, large template, <b>failed closure</b>, <b>cloacal exstrophy</b>. Diastasis &gt;6 cm → staged closure with fixator."], [3, "r", 46, "Ch 43 · Exstrophy–Epispadias Complex", "8 · Osteotomy and immobilisation", "Spica cast · 47% · 30% · <span class=\"key\">66%</span>"], [3, "r", 46, "Ch 43 · Exstrophy–Epispadias Complex", "8 · Osteotomy and immobilisation", "External fixation + traction · <span class=\"key\">7.5%</span> · 8% · — (few)"], [3, "l", 46, "Ch 43 · Exstrophy–Epispadias Complex", "9 · After primary closure", "Capacity <span class=\"key\">&lt;30 mL at 1–2 years</span> → continence procedure may not be feasible."], [3, "l", 47, "Ch 43 · Exstrophy–Epispadias Complex", "11 · Bladder neck reconstruction (stage 3)", "<b>Prerequisites</b>: capacity <span class=\"key\">≥100 mL</span> (under anaesthesia), stable urodynamics, motivated child (5–7 years), voiding programme ≥6 months, psychology review. Earlier reimplant for pyelonephritis, worsening hydronephrosis or falling function."], [3, "a", 47, "Ch 43 · Exstrophy–Epispadias Complex", "11 · Bladder neck reconstruction (stage 3)", "<p><b>Modified YDL</b>: transverse neck incision → <b>Cohen cross-trigonal reimplant</b> → posterior mucosal strip <span class=\"key\">15 × 30 mm</span> → denude lateral muscle triangles (no cephalad transverse cut) → tube → <b>double-breast muscle flaps</b> → suspend to rectus fascia; suprapubic tube 3 weeks, clamp trials</p>"], [3, "l", 47, "Ch 43 · Exstrophy–Epispadias Complex", "11 · Bladder neck reconstruction (stage 3)", "MSRE: ~<span class=\"key\">70–75%</span> dry by day (&gt;3 h); CPRE + YDL lowest (~56%)."], [3, "a", 48, "Ch 43 · Exstrophy–Epispadias Complex", "15 · Epispadias", "<p>Female (6–12 months): vertical incision through urethral wall at 9 and 3 o'clock → excise urethral roof (dorsal wedge taper) → close over 10-Fr Foley → unite clitoral halves and labia minora, mons fat over suture line → catheter 5–7 days → BNR at 4–5 years</p>"], [3, "l", 49, "Ch 43 · Exstrophy–Epispadias Complex", "15 · Epispadias", "Female continence after BNR ~<span class=\"key\">87%</span> — as good as CBE girls. Epispadias outperforms exstrophy (bladder never exposed)."], [3, "r", 49, "Ch 43 · Exstrophy–Epispadias Complex", "16 · Cloacal exstrophy", "Spinal defects · Uncommon · <span class=\"key\">85–100%</span> (lipomeningocele commonest)"], [3, "a", 49, "Ch 43 · Exstrophy–Epispadias Complex", "16 · Cloacal exstrophy", "<p>Stage 1 (newborn): close omphalocele → separate caecal plate → join hemibladders → colostomy → Stage 2: bladder closure + <b>combined osteotomy</b> + fixation 6–8 weeks → 5–7 years: YDL only if &gt;100 mL (rare), usually augmentation + continent stoma</p>"], [3, "l", 50, "Ch 44 · Prune-Belly Syndrome", "1 · Definition and aetiology", "<b>Triad</b> (Eagle–Barrett): deficient abdominal wall muscle; bilateral intra-abdominal testes; dilated urinary tract. Incidence ~<span class=\"key\">1 in 29,000–44,000</span> (≈ exstrophy); <span class=\"key\">95% male</span>; more in twins, African ancestry, young mothers. Name given by <b>Osler</b> <span class=\"tag\">MCQ</span>."], [3, "l", 50, "Ch 44 · Prune-Belly Syndrome", "1 · Definition and aetiology", "Heredity: 1 in 23 PBS children is a twin, but most twins discordant; chromosomal associations (Turner, trisomy 13/18, monosomy 16, Beckwith–Wiedemann) exceptional. No inheritance pattern; multiplex families: smooth muscle genes <b>MYOCD</b>, <b>FLNA</b> <span class=\"tag\">MCQ</span>. Theories: early urethral obstruction, lateral plate mesoderm defect, intrinsic urinary tract defect, yolk sac defect."], [3, "p", 50, "Ch 44 · Prune-Belly Syndrome", "1 · Definition and aetiology", "Obstruction theory weakness: most have <b>no obstruction postnatally</b>. The tract is <b>dilated, collagen-rich and largely non-obstructed</b> — this drives management."], [3, "l", 50, "Ch 44 · Prune-Belly Syndrome", "2 · Genitourinary pathology", "<b>Kidneys</b>: dysplasia ~<span class=\"key\">50%</span>, often asymmetric; worst with outlet obstruction <b>without urachal decompression</b>. Dilation <b>does not correlate</b> with dysplasia; <b>infection, not obstruction, is the main threat</b>."], [3, "l", 50, "Ch 44 · Prune-Belly Syndrome", "2 · Genitourinary pathology", "<b>Ureters</b>: distal worse; <b>proximal preserved</b> in reconstruction. VUR ~<span class=\"key\">75%</span>; PUJ/VUJ obstruction uncommon. <b>Failed pump, not blocked pipe</b> → stasis → infection."], [3, "l", 50, "Ch 44 · Prune-Belly Syndrome", "2 · Genitourinary pathology", "<b>Bladder</b>: massive, <b>thick but smooth</b> (no trabeculation), urachal pseudodiverticulum; urachus patent at birth <span class=\"key\">25–30%</span>. Splayed trigone, lateral orifices, wide neck. <b>Normal compliance, large capacity, poor sensation</b>; \"unbalanced voiding\"; ~half void normally but may deteriorate → reassess."], [3, "p", 51, "Ch 44 · Prune-Belly Syndrome", "3 · Extragenitourinary anomalies", "Two mechanisms: <b>oligohydramnios</b> (lung hypoplasia, limb deformity, knee dimples) and <b>absent abdominal wall pressure</b> (weak cough, atelectasis, constipation)."], [3, "l", 51, "Ch 44 · Prune-Belly Syndrome", "4 · Presentation and spectrum", "Abdominal wall is <b>not</b> a sorting criterion. <b>RUBACE</b>: severity score for survivors; renal the heaviest domain <span class=\"tag\">MCQ</span>."], [3, "a", 51, "Ch 44 · Prune-Belly Syndrome", "5 · Evaluation", "<p>Team → <b>cardiorespiratory first</b> (CXR) → creatinine/BUN trend (day-1 value maternal) → renal–bladder US → prophylaxis + circumcision → selective imaging</p>"], [3, "l", 52, "Ch 44 · Prune-Belly Syndrome", "6 · Management philosophy", "Delay major reconstruction to <span class=\"key\">≥3–6 months</span> (lungs). Single-stage comprehensive surgery (reconstruction + orchidopexy + abdominoplasty + circumcision) adds no morbidity. Correct high-grade VUR."], [3, "a", 53, "Ch 44 · Prune-Belly Syndrome", "9 · Abdominoplasty", "<p><b>Monfort</b>: skin ellipse, umbilicus spared → incise central plate at lateral rectus borders → GU surgery → score peritoneum over lateral muscle → suture plate edges to scored line → overlap lateral flaps over drains</p>"], [3, "l", 53, "Ch 44 · Prune-Belly Syndrome", "10 · Long-term outcome", "Creatinine <span class=\"key\">&lt;0.7 mg/dL at 1 year</span> → stable unless pyelonephritis/obstruction. Up to <span class=\"key\">30%</span> CRF (drivers: <b>pyelonephritis, dysplasia, polyuria</b>)."], [3, "p", 53, "Ch 44 · Prune-Belly Syndrome", "10 · Long-term outcome", "Long-term care is a contest against <b>stasis</b>: lowering residual and infection protects kidneys; dysplasia and polyuria set the ceiling surgery cannot raise."], [3, "p", 55, "Ch 45 · Posterior Urethral Valves", "2 · Pathophysiology", "Every pop-off is false reassurance: normal creatinine in a growing infant hides an abnormal GFR. Follow VURD as closely as any PUV child."], [3, "l", 55, "Ch 45 · Posterior Urethral Valves", "3 · Diagnosis", "<b>US</b> first: bladder wall thick if <span class=\"key\">&gt;3 mm distended / &gt;5 mm empty</span>; perirenal fluid = urinoma."], [3, "r", 55, "Ch 45 · Posterior Urethral Valves", "4 · Fetal intervention", "Sodium / chloride · <span class=\"key\">&lt;100 / &lt;90 mEq/L</span>"], [3, "r", 55, "Ch 45 · Posterior Urethral Valves", "4 · Fetal intervention", "Osmolality · <span class=\"key\">&lt;200 mOsm/L</span>"], [3, "r", 55, "Ch 45 · Posterior Urethral Valves", "4 · Fetal intervention", "β2-microglobulin · <span class=\"key\">&lt;6 mg/L</span> (most sensitive)"], [3, "l", 56, "Ch 45 · Posterior Urethral Valves", "4 · Fetal intervention", "Both: <span class=\"key\">40–50%</span> pregnancy loss. Deliver at a neonatal surgical centre. Paediatric urologist counsels: diagnosis, alternatives, outcomes — start of lifelong care."], [3, "p", 56, "Ch 45 · Posterior Urethral Valves", "4 · Fetal intervention", "Fetal intervention can rescue the lung, not the kidney: fluid deficiency is still in progress, but dysplasia is already established."], [3, "a", 56, "Ch 45 · Posterior Urethral Valves", "5 · Neonatal presentation and initial management", "<p>Stabilise airway → <b>5–7 Fr feeding tube</b> (coudé, curved stylet, or rectal finger if it curls) → confirm on US → minimal balloon fill → creatinine, electrolytes, fluids → US, then VCUG → antibiotic prophylaxis → ablation when stable</p>"], [3, "p", 57, "Ch 45 · Posterior Urethral Valves", "7 · VUR in PUV", "VUR in valves is a pressure gauge, not a lesion: fix the pressure, not the reading."], [3, "a", 57, "Ch 45 · Posterior Urethral Valves", "8 · Bladder dysfunction and valve bladder syndrome", "<p>High-pressure voiding → fibrosis, weaker contraction → rising PVR + nephrogenic polyuria → upper tracts store and refill bladder → bladder never empty → pressure back-transmitted → renal decline → more polyuria</p>"], [3, "l", 58, "Ch 45 · Posterior Urethral Valves", "9 · Prognosis for renal function", "Lifetime ESRD <span class=\"key\">20–50%</span>. Risk: age at diagnosis, dysplasia ± VUR, <b>year-1 nadir creatinine</b>, recurrent UTI, bladder dysfunction."], [3, "r", 58, "Ch 45 · Posterior Urethral Valves", "9 · Prognosis for renal function", "&lt;0.4 / 0.4–0.69 / 0.7–0.99 / &gt;1.0 mg/dL · <span class=\"key\">0% / 2% / 27% / 100%</span>"], [3, "l", 58, "Ch 45 · Posterior Urethral Valves", "9 · Prognosis for renal function", "<span class=\"key\">0.7 mg/dL is the watershed</span> — risk leaps. 1-year beats 1-month value; 30-day creatinine velocity also predicts."], [3, "l", 60, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "1 · Definition and causes", "Commonest cause: <b>NTD</b> (≈ spina bifida, SB). Survival ≈90% to 10 years → <b>renal failure</b> a leading late cause of morbidity; <span class=\"key\">10%</span> of SB deaths urological."], [3, "l", 60, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "2 · Myelodysplasia (NTD)", "Neural tube closes by <span class=\"key\">day 35</span>. Prenatal detection: maternal AFP + US."], [3, "l", 60, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "2 · Myelodysplasia (NTD)", "<b>Folic acid</b> cuts NTDs 50–70%: <span class=\"key\">400 µg/day</span> for all women of child-bearing age, ≥4 weeks before conception through first month; <span class=\"key\">4–5 mg/day</span> if the woman has SB."], [3, "l", 60, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "2 · Myelodysplasia (NTD)", "Recurrence <span class=\"key\">5%</span> after one affected child; offspring 3.7% if one parent has SB (≈15% if both)."], [3, "p", 60, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "2 · Myelodysplasia (NTD)", "<b>MOMS</b>: prenatal repair (&lt;26 weeks) reduced death or shunt need (RR 0.70), better motor/cognitive scores at 30 months; cost: prematurity (34 vs 37 weeks), uterine-scar thinning/dehiscence (⅓), more re-tethering. Rationale: \"two-hit\" in-utero injury."], [3, "p", 60, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "2 · Myelodysplasia (NTD)", "Every pattern = detrusor (over/under) × outlet (competent/incompetent/dyssynergic). Dangerous: <b>overactive or poorly compliant detrusor against a closed or dyssynergic outlet</b> → high storage pressure → VUR, hydroureteronephrosis. An incompetent outlet \"pops off\" — wet but kidney-safe."], [3, "a", 61, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "2 · Myelodysplasia (NTD)", "<p>Birth → renal–bladder US before discharge + PVR (need for CIC) → creatinine after week 1 → urodynamics once stable, <b>safe from ≈3 months</b> (within 3 months: ICCS, SBA, EAU) → cystography (ideally videourodynamics, or VCUG) → ± baseline DMSA (EAU) → US at 6, 12, 18, 24 months then yearly.</p>"], [3, "l", 61, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "2 · Myelodysplasia (NTD)", "UMPIRE (CDC) baseline: US normal 56%, mild hydronephrosis 40%, moderate–severe 4%; dilating VUR <span class=\"key\">7%</span>; DMSA defects ≈8%."], [3, "r", 61, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "2 · Myelodysplasia (NTD)", "<b>Hostile / high</b> · DLPP or end-filling pressure <span class=\"key\">≥40 cmH₂O</span>; NDO with DSD (DSD removed in UMPIRE revision — poor agreement)"], [3, "p", 62, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "3 · Proactive (early) management", "Proactive won because it treats the cause (pressure, failure to empty) before the consequence (reflux, dilatation, scarring, renal failure)."], [3, "a", 62, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "4 · Management ladder", "<p>CIC + antimuscarinic (± β3-agonist) → intradetrusor botulinum toxin → (vesicostomy as bridge if CIC impossible) → augmentation ± catheterisable channel ± outlet procedure <span class=\"xref\">→ Ch 48</span></p>"], [3, "l", 62, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "4 · Management ladder", "GA, rigid cystoscopy, <span class=\"key\">≈10 U/kg (max 360 U)</span>, ≈30 sites, <b>trigone spared</b>; usual minimum age 2 y."], [3, "l", 63, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "8 · Other causes", "<b>Autonomic dysreflexia</b> (lesion <span class=\"key\">≥T6</span>): filling → sympathetic surge → severe hypertension, stroke, seizures. Monitor BP, α-blockers ready during urodynamics."], [3, "l", 63, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "8 · Other causes", "Coordinated UMN: continence late; urgency; NDO 30–61%, DSD ≈12%; ⅓ normal. Upper-tract risk <span class=\"key\">&lt;5%</span>; urodynamics only if conservative care fails, DSD symptoms or recurrent UTI."], [3, "p", 64, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "8 · Other causes", "Lesion level predicts pattern: <b>suprapontine</b> (CP) → coordinated overactivity, low risk; <b>suprasacral cord</b> (SCI, myelitis, tethering) → NDO + DSD, high risk; <b>sacral/peripheral</b> → underactivity. Myelodysplasia is mixed and unpredictable."], [3, "l", 65, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "1 · Normal bladder and bowel function", "<b>Infancy</b>: voiding pressures often <span class=\"key\">&gt;100 cm H<sub>2</sub>O</span> and interrupted voiding normal, gone by <span class=\"key\">~2 yr</span>; infants arouse before voiding. Later dyscoordination = <b>dysfunction, not immaturity</b>."], [3, "p", 65, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "1 · Normal bladder and bowel function", "Bladder and bowel are one unit: shared pelvic space (\"zero-sum\" volume) and converging dorsal-root afferents (cross-organ sensitisation). Loaded rectum → overactivity, poor emptying; treating constipation improves LUTS; anticholinergics for the bladder can recreate the constipation that drove the symptoms."], [3, "r", 65, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "2 · Definitions — ICCS", "Storage · Increased frequency · <span class=\"key\">≥8 voids/day</span>"], [3, "r", 65, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "2 · Definitions — ICCS", "Decreased frequency · <span class=\"key\">≤3 voids/day</span>"], [3, "l", 65, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "2 · Definitions — ICCS", "<b>Daytime urinary incontinence (DUI)</b>: leakage awake, <span class=\"key\">≥5 yr</span>. <b>Enuresis</b>: intermittent leakage asleep, ≥5 yr — <b>MNE</b> (no other LUTS) vs <b>NMNE</b> (any LUTS)."], [3, "p", 66, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "2 · Definitions — ICCS", "<b>Trap:</b> dysfunctional voiding (neurologically intact) ≠ DSD (neurological lesion). Use \"LUT dysfunction\", not \"voiding dysfunction\". Urgency incontinence ≠ OAB: a voiding postponer also leaks with urge, and anticholinergics help briefly then worsen emptying."], [3, "l", 67, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "4 · Evaluation", "<b>Urinalysis</b>: SG &gt;1.005 makes DI unlikely; persistent protein ≥1+ → first-morning protein:creatinine (&gt;<span class=\"key\">0.2 mg/mg</span> abnormal)."], [3, "a", 67, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "4 · Evaluation", "<p>≥2 of, ≥1/week for ≥1 month, IBS criteria not met: ≤2 defecations in toilet/week · ≥1 faecal incontinence/week · retentive posturing/withholding · painful or hard stools · large rectal faecal mass · large-diameter stools that may block the toilet</p>"], [3, "l", 67, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "4 · Evaluation", "No routine labs or <b>plain radiograph</b> (only if impaction suspected and exam impossible, or refractory). Rectal diameter <span class=\"key\">≥30 mm</span> on US suggests constipation (EAU/ESPU); gastroenterology advises against routine US."], [3, "a", 68, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "5 · Management of daytime incontinence", "<p>History + exam + urinalysis + PVR ± uroflow → exclude neurogenic, diabetes, CKD, anatomical → optimise neurodevelopmental disorder → <b>treat constipation first</b> → night-only? treat as MNE → else <b>standard urotherapy</b> (≥4 wk) → re-evaluate → <b>specific urotherapy</b> by diagnosis → refractory: botulinum toxin, neuromodulation</p>"], [3, "r", 68, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "5 · Management of daytime incontinence", "<b>Oxybutynin</b> (non-selective) · IR <span class=\"key\">0.3–0.6 mg/kg/day</span> in 2–3 doses (max 15 mg); ER 5–20 mg/day (do not crush); patch 3.9 mg/day. Only US-approved drug for paediatric non-neurogenic OAB. Dry mouth, flushing, constipation, cognition."], [3, "l", 68, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "5 · Management of daytime incontinence", "<b>Intradetrusor onabotulinumtoxinA</b> (refractory): <span class=\"key\">5 units/kg, max 100 units</span>; lasts ~12 months; retention needing CIC rare."], [3, "l", 69, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "6 · Nocturnal enuresis", "Prevalence <span class=\"key\">5–10% at 7 yr</span>; ~15%/yr resolve; ~2% adults; loci chromosomes 6 and 13."], [3, "l", 69, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "6 · Nocturnal enuresis", "<b>NMNE</b>: treat bothersome daytime LUTS and constipation first. <b>MNE</b>: treat from <span class=\"key\">~6 yr</span>."], [3, "r", 69, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "6 · Nocturnal enuresis", "Use · Nightly; parent wakes child; until <span class=\"key\">14 consecutive dry nights</span> · <span class=\"key\">0.2–0.4 mg</span> tablet or 120–240 µg melt ~1 h before bed; stop if no effect ~1 week"], [3, "a", 69, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "6 · Nocturnal enuresis", "<p>MNE ≥6 yr → alarm or desmopressin → failure → check use → switch or <b>combine</b> → re-evaluate: hidden daytime LUTS, constipation, sleep-disordered breathing, neurodevelopmental disorder; uroflow + PVR → <b>add anticholinergic</b> to desmopressin → refractory: imipramine, β3-agonist, specialist drugs</p>"], [3, "a", 70, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "7 · Functional constipation — treatment", "<p>Impaction? → <b>disimpact</b> (oral PEG or enemas) → education, diary, toilet sitting, <b>maintenance PEG</b> → review 2 wk → failing: adherence, dose, impaction, mental health → <b>≥2 months</b> → wean when ≥1 month symptom-free, ≥3 stools/week, Rome IV not met → relapse: reinstate / gastroenterology</p>"], [3, "r", 70, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "7 · Functional constipation — treatment", "PEG 3350 — disimpaction · <span class=\"key\">1–1.5 g/kg/day × 3–6 days</span> (&gt;3 yr)"], [3, "r", 70, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "7 · Functional constipation — treatment", "PEG 3350 — maintenance · <span class=\"key\">0.2–0.8 g/kg/day</span>, start 0.4 (&gt;6 months)"], [3, "l", 70, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "8 · Recurrent UTI and BBD", "RIVUR/CUTIE recurrence: <span class=\"key\">BBD + VUR 51% &gt; BBD alone 35% &gt; VUR alone 20%</span>. Wider caecal diameter → more recurrence."], [3, "p", 71, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "1 · Goals and principles", "Every reconstructive step trades storage for emptying. Raising capacity or outlet resistance turns a leaking, self-venting system into one wholly dependent on emptying. A continent uncatheterised reservoir → hydronephrosis, sepsis, perforation — incontinence can be \"protective\"; CIC and motivation are prerequisites."], [3, "l", 71, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "2 · Patient selection and preoperative evaluation", "<b>Storage</b>: chronic filling pressure <span class=\"key\">&gt;40 cm H<sub>2</sub>O</span> → hydroureteronephrosis, falling GFR, acquired VUR. Anticholinergics + CIC first; persistent poor compliance → <b>augmentation</b>."], [3, "l", 71, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "2 · Patient selection and preoperative evaluation", "Fill at <span class=\"key\">≤10% of predicted capacity per minute</span> (fast filling falsely lowers compliance); body-temperature fluid. UMPIRE standardises care."], [3, "l", 71, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "2 · Patient selection and preoperative evaluation", "Electrolytes, BUN, creatinine; raised → nephrology, 24-h urine incl. <b>volume</b> — reservoir must hold <span class=\"key\">3–4 h</span> of output."], [3, "l", 72, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "4 · Bladder augmentation (enterocystoplasty)", "<b>Always detubularise</b> and <b>reconfigure into a sphere</b>: intact bowel contracts at <span class=\"key\">60–100 cm H<sub>2</sub>O</span>; sphere maximises volume per area."], [3, "l", 72, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "4 · Bladder augmentation (enterocystoplasty)", "Length: ileum <span class=\"key\">20–40 cm</span>, colon <span class=\"key\">~20 cm</span>; err large."], [3, "l", 72, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "4 · Bladder augmentation (enterocystoplasty)", "<b>Ileocystoplasty</b>: at least <span class=\"key\">15–20 cm proximal to ileocaecal valve</span> (B12, <span class=\"dag\">†</span>bile salts); open antimesenterically; U, S, W fold or cup patch."], [3, "p", 73, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "4 · Bladder augmentation (enterocystoplasty)", "Augmentation is needed less now: early anticholinergics, CIC, botulinum toxin and neuromodulation (immediate vs expectant: 17% vs 41% augmented). Not RCT-proven, but the rationale for treating at diagnosis."], [3, "l", 73, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "5 · Continent catheterisable channels", "Flap valve: supple narrow tube tunnelled into a <b>low-pressure</b> reservoir is <b>compressed</b> as pressure rises; appendix needs only <span class=\"key\">~2 cm</span>. Nipple valves (Kock, Mainz, Hanna) <b>effaced</b> (~85% vs &gt;90–95% continent). Flap valve = <b>no pop-off</b>."], [3, "a", 73, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "5 · Continent catheterisable channels", "<p>Detach appendix with caecal cuff (less stenosis; caecal flap lengthens) → preserve mesoappendix → tunnel <b>distal end</b> submucosally → caecal end to skin, no tension/twist → <b>skin flap</b> into stoma → <b>short, straight</b> channel; bladder fixed to wall → test catheterisation after each step → stent 6–12 Fr 10–14 days → surgeon does first catheterisation → CIC ≥4-hourly by day</p>"], [3, "p", 74, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "6 · Bladder outlet procedures", "Choosing the outlet: voids → AUS (only option preserving voiding). On CIC and being augmented → sling (girls) or flap-valve lengthening + channel. Failed repairs → bladder neck closure + Mitrofanoff. Always re-study the bladder after."], [3, "l", 75, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "9 · Complications of augmentation", "Counsel <span class=\"key\">~9%</span>; mostly myelodysplasia; <b>outlet procedures double risk</b>; missed CIC, substance abuse. Overdistension → wall ischaemia; recurrence common."], [3, "l", 75, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "9 · Complications of augmentation", "Ureterosigmoidostomy adenocarcinoma at anastomosis, latency <span class=\"key\">~26 yr</span> (urine + faeces → N-nitroso compounds); augmentation from <span class=\"key\">4 yr</span>, highest after <b>gastrocystoplasty</b>, aggressive, often metastatic. SB bladder cancer ~2–4%, mostly stage III–IV. Nephrogenic adenoma (benign) commonest tumour. Annual cystoscopy: no consensus; consider in gastrocystoplasty, exstrophy, transplant. <span class=\"dag\">†</span> Investigate any haematuria."], [3, "a", 77, "★ Putting it together: common paediatric pathways", "A · Antenatal UTD", "<p><b>Prenatal:</b> A1 before 28 weeks → US after 32 weeks. A2–3 → US 4-weekly. Male, thick bladder, bilateral → PUV?</p>\n<p><b>Postnatal:</b> first US <b>after 48 hours</b>, except suspected PUV or bilateral severe dilation — before discharge.</p>\n<p>Normal (APD &lt;10 mm) → discharge · mild → repeat US · moderate–severe or dilated ureter → VCUG, MAG3, consider CAP (<span class=\"xref\">→ Ch 34</span>).</p>"], [3, "a", 77, "★ Putting it together: common paediatric pathways", "B · First febrile UTI", "<p><b>Diagnose:</b> catheter/suprapubic if not toilet-trained; bag only rules out.</p>\n<p><b>Treat:</b> within 48 h (&gt;72 h doubles new scarring); oral if well.</p>\n<p><b>Image:</b> US all; VCUG if US abnormal, atypical or recurrent (AAP 2–24 months); DMSA at 4–6 months if scarring matters.</p>\n<p><b>Prevent:</b> treat BBD/constipation; CAP if high risk; circumcision lowers infant UTI (<span class=\"xref\">→ Ch 37, 41</span>).</p>"], [3, "a", 77, "★ Putting it together: common paediatric pathways", "C · Newborn with PUV", "<p>Stabilise breathing → 5–7 Fr feeding tube (minimal/no balloon) → creatinine, electrolytes, fluids → US then VCUG → prophylaxis → <b>endoscopic ablation</b> when stable; vesicostomy if urethra small.</p>\n<p>Prognosis: first-year nadir creatinine (&lt;0.8 mg/dL good). Lifelong: valve bladder, CKD, BP; transplant → Ch 61 (book 1) (<span class=\"xref\">→ Ch 45</span>).</p>"], [3, "a", 78, "★ Putting it together: common paediatric pathways", "E · Daytime wetting and bedwetting", "<p>Urinalysis, PVR ± uroflow → exclude neurogenic/anatomical/medical → <b>constipation first</b> → urotherapy ≥4 weeks → specific (OAB antimuscarinic, dysfunctional voiding biofeedback) → refractory: toxin, neuromodulation.</p>\n<p><b>MNE:</b> alarm or desmopressin (no fluids 1 h before to morning); combine if partial (<span class=\"xref\">→ Ch 47</span>).</p>"], [3, "p", 78, "★ Putting it together: common paediatric pathways", "F · Augmentation segment", "Reconstruction trades storage for emptying: an unreliably catheterised continent reservoir → hydronephrosis, sepsis, perforation, so CIC commitment first. Perforation = pain + sepsis; urgent (<span class=\"xref\">→ Ch 48</span>)."], [4, "l", 2, "Ch 101 · Surgical, Radiographic and Endoscopic Anatomy of the Female Pelvis", "1 · Perineum and external genitalia", "Urethral meatus <span class=\"key\">1 cm</span> anterior to the vaginal opening."], [4, "l", 3, "Ch 101 · Surgical, Radiographic and Endoscopic Anatomy of the Female Pelvis", "4 · Endopelvic fascia and visceral ligaments", "<b>Infundibulopelvic</b> (ovarian vessels; ureter beneath) vs <b>ovarian ligament</b> (ovary → uterus) <span class=\"tag\">MCQ</span>."], [4, "p", 3, "Ch 101 · Surgical, Radiographic and Endoscopic Anatomy of the Female Pelvis", "4 · Endopelvic fascia and visceral ligaments", "Support ligaments are connective tissue condensed around vessels and nerves — the best anchors (uterosacral, cardinal) are exactly where sutures injure ureter, pelvic plexus and sacral nerves. <span class=\"xref\">→ Ch 108</span>"], [4, "l", 3, "Ch 101 · Surgical, Radiographic and Endoscopic Anatomy of the Female Pelvis", "5 · Urethra and continence anatomy", "Length <span class=\"key\">4.7–5.1 cm</span>; behind symphysis; suspended by posterior pubourethral ligaments; rests on anterior vaginal wall."], [4, "a", 3, "Ch 101 · Surgical, Radiographic and Endoscopic Anatomy of the Female Pelvis", "6 · Bladder and ureter", "<p><b>Ureteric danger points</b>: pelvic brim (infundibulopelvic ligament) → under uterine artery (hysterectomy) → beside cardinal/uterosacral near cervix → anterior vaginal fornix (vaginal surgery) → sacral promontory (right ureter, sacrocolpopexy)</p>"], [4, "p", 4, "Ch 101 · Surgical, Radiographic and Endoscopic Anatomy of the Female Pelvis", "7 · Nerves at surgical risk", "Post-lithotomy foot drop is peripheral (fibular head), not pelvic. Leg pain and swelling after long lithotomy → <b>compartment syndrome</b>: emergency (<span class=\"dag\">†</span> fasciotomy)."], [4, "l", 4, "Ch 101 · Surgical, Radiographic and Endoscopic Anatomy of the Female Pelvis", "8 · Vessels and lymphatics", "<b>Presacral plexus</b>: valveless, high pressure (worse in lithotomy); a 1–2 mm vein can bleed &gt; <span class=\"key\">1 L/min</span>."], [4, "a", 4, "Ch 101 · Surgical, Radiographic and Endoscopic Anatomy of the Female Pelvis", "8 · Vessels and lymphatics", "<p><b>Sacrocolpopexy</b>: expose ALL at promontory over L5/S1 disc → open peritoneum distally → suture into ALL over <b>S1</b> (strongest; less discitis) → avoid left common iliac vein, middle sacral vessels, presacral plexus, right ureter (each ≈ 2.7 cm from mid-promontory)</p>"], [4, "a", 5, "Ch 101 · Surgical, Radiographic and Endoscopic Anatomy of the Female Pelvis", "9 · Endoscopic anatomy", "<p>Distal urethra (glands, diverticular ostia, mesh, stones) → mid-urethral coaptation (external sphincter) → bladder neck coaptation → trigone and orifices (30° lens) → whole-mucosa survey</p>"], [4, "l", 6, "Ch 108 · Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology", "1 · Definitions and terminology", "<b>OAB</b>: urgency ± UUI, usually with frequency and nocturia; <b>defined by urgency</b>. Frequency ≥ <span class=\"key\">8 voids/24 h</span> is abnormal once polyuria excluded."], [4, "l", 6, "Ch 108 · Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology", "2 · Epidemiology of female UI", "<b>Pregnancy</b>: commonest cause of incident UI in young women (≈ <span class=\"key\">40%</span>, mostly SUI). &gt;30% leak at 1 year; UI at 3 months usually persists. PFMT during/after pregnancy reduces UI."], [4, "r", 6, "Ch 108 · Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology", "3 · Risk factors for female UI", "<b>Vaginal delivery</b> · Causes later <b>SUI, not UUI</b>. CS protects only if <b>every</b> delivery is CS; NNT <span class=\"key\">13</span> to prevent one moderate–severe UI. Elective CS &lt; CS after labour. Baby ≥4 kg: OR ≈1.5."], [4, "p", 7, "Ch 108 · Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology", "3 · Risk factors for female UI", "Obstetric injury and loss of support → <b>stress</b> UI; ageing, neurological, metabolic and lifestyle factors → <b>urgency</b>. So dominant type moves from stress to urge with age."], [4, "l", 7, "Ch 108 · Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology", "3 · Risk factors for female UI", "<b>UUI &gt; MUI &gt; SUI</b>; male SUI almost always iatrogenic (RP, pelvic surgery) or neurological. Remission up to <span class=\"key\">40%</span>."], [4, "l", 7, "Ch 108 · Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology", "4 · Physiology of continence", "<b>Female</b>: continence zone <b>proximal and mid-urethra</b>; bladder neck often incompetent in continent women. Oestrogen-sensitive spongy submucosa gives up to <span class=\"key\">30%</span> of closure."], [4, "p", 7, "Ch 108 · Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology", "4 · Physiology of continence", "The female outlet relies on a <b>single</b> mid-urethral sphincter against a mobile backing — continence needs support, intrinsic urethral properties and muscle together."], [4, "l", 8, "Ch 108 · Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology", "6 · Pathophysiology of female SUI", "ISD described with the autologous pubovaginal sling, usually after previous surgery; = <b>type III SUI</b> (Blaivas) <span class=\"tag\">MCQ</span>."], [4, "l", 8, "Ch 108 · Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology", "6 · Pathophysiology of female SUI", "<b>VLPP</b>: abdominal pressure causing leak (invalid during detrusor contraction or poor compliance). <b>VLPP &lt; <span class=\"key\">60 cm H₂O</span> = ISD</b>; historically → bulking or pubovaginal sling."], [4, "p", 8, "Ch 108 · Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology", "6 · Pathophysiology of female SUI", "<b>Slings work in hypermobility but Burch fails in ISD</b>: almost all SUI includes some ISD, so sphincter-directed procedures (PVS, MUS, bulking) work in hypermobile women; Burch, correcting only hypermobility, is weak with severe ISD and a fixed urethra."], [4, "a", 10, "Ch 108 · Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology", "11 · Pathophysiology of POP", "<p><b>POP sequence</b>: levator trauma/denervation (labour) → loss of tone → widened hiatus → fascia/ligaments carry whole load → stretch and fail (ageing, straining, hysterectomy) → POP → hiatus widens further</p>"], [4, "l", 10, "Ch 108 · Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology", "11 · Pathophysiology of POP", "Levator defects on MRI in up to <span class=\"key\">20%</span> of primiparas (none in nulliparas); <b>avulsion</b> → advanced, multicompartment POP."], [4, "a", 10, "Ch 108 · Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology", "12 · POP and UI interaction", "<p>Cystocele → urethral kink → obstruction masks SUI → POP repair relieves kink → SUI unmasked. Detect by UDS / stress test <b>with prolapse reduced</b> (pessary or speculum).</p>"], [4, "l", 11, "Ch 105 · Evaluation and Management of Women With Urinary Incontinence and Pelvic Organ Prolapse", "2 · History", "SUI coexists in ~<span class=\"key\">40%</span> with POP; patients often expect repair to cure leakage → counsel."], [4, "l", 12, "Ch 105 · Evaluation and Management of Women With Urinary Incontinence and Pelvic Organ Prolapse", "3 · Physical examination", "Q-tip now mostly teaching/trials; vaginal swab test equivalent; <b>visual urethral mobility</b> (meatal rotation &lt; or <span class=\"key\">&gt;30°</span>) is routine."], [4, "p", 12, "Ch 105 · Evaluation and Management of Women With Urinary Incontinence and Pelvic Organ Prolapse", "3 · Physical examination", "Stage II = 2-cm window around the hymen. III/IV boundary depends on tvl. Example: tvl 8, Bp +5 → between +1 and +6 → <b>stage III</b>."], [4, "l", 12, "Ch 105 · Evaluation and Management of Women With Urinary Incontinence and Pelvic Organ Prolapse", "3 · Physical examination", "<b>Bulbocavernosus reflex</b> (S2–S4) present in only ~<span class=\"key\">70%</span> of normal women → absence alone not pathological."], [4, "a", 13, "Ch 105 · Evaluation and Management of Women With Urinary Incontinence and Pelvic Organ Prolapse", "5 · Management pathway", "<p>History + examination + UA + PVR → exclude DIAPPERS, UTI, obstruction, tumour → classify, grade bother → red flags (pain, haematuria, recurrent UTI, pelvic mass, prior radiation/pelvic surgery, prolapse beyond introitus, fistula) → specialist work-up; otherwise initial management → reassess → extra tests only if they change management → surgery.</p>"], [4, "p", 15, "Ch 114 · Conservative Management of Urinary Incontinence: Behavioural and Pelvic Floor Therapy, Urethral and Pelvic Devices", "1 · Definition and principles", "Why first-line if surgery cures SUI more often? Conservative therapy is risk free and at least as effective as drugs — this asymmetry of harm drives every recommendation."], [4, "l", 15, "Ch 114 · Conservative Management of Urinary Incontinence: Behavioural and Pelvic Floor Therapy, Urethral and Pelvic Devices", "3 · Lifestyle modifications", "<b>Inadequate intake is more common</b> than excess (self-restriction → dehydration, UTI, constipation, concentrated irritant urine, reduced capacity). Excess (~3.7 L/day) worsens frequency → reduce if 24-h output &gt;~<span class=\"key\">2100 mL</span>."], [4, "l", 16, "Ch 114 · Conservative Management of Urinary Incontinence: Behavioural and Pelvic Floor Therapy, Urethral and Pelvic Devices", "3 · Lifestyle modifications", "<b>Target</b>: six to eight 8-oz glasses, or <span class=\"key\">30 mL/kg/day</span>, minimum <span class=\"key\">1500 mL</span>, at set times (IOM 2.7 L/day includes food water)."], [4, "l", 16, "Ch 114 · Conservative Management of Urinary Incontinence: Behavioural and Pelvic Floor Therapy, Urethral and Pelvic Devices", "3 · Lifestyle modifications", "Caffeine: <b>diuretic and irritant</b>; raises filling detrusor pressure, risk factor for DO. ~<span class=\"key\">250 mg/day</span> (≈2 cups) associated with moderate–severe UI in men; coffee not linked to nocturia."], [4, "l", 16, "Ch 114 · Conservative Management of Urinary Incontinence: Behavioural and Pelvic Floor Therapy, Urethral and Pelvic Devices", "4 · Pelvic floor muscle training (PFMT)", "Cornerstone for SUI, UUI, MUI, urgency, frequency. <b>Arnold Kegel (1948)</b> <span class=\"tag\">MCQ</span>."], [4, "a", 17, "Ch 114 · Conservative Management of Urinary Incontinence: Behavioural and Pelvic Floor Therapy, Urethral and Pelvic Devices", "4 · Pelvic floor muscle training (PFMT)", "<p>Empty bladder → <b>lying</b>: 5 quick (1–2 s) + 5 sustained (5 → 10 s) → <b>sitting</b> → <b>standing</b> (= 30) → rest as long as each contraction (work:rest <b>1:1 to 1:2</b>) → twice daily = <b>60/day</b>.</p>"], [4, "a", 17, "Ch 114 · Conservative Management of Urinary Incontinence: Behavioural and Pelvic Floor Therapy, Urethral and Pelvic Devices", "5 · Urge suppression", "<p>Urge → do not rush → stand still/sit, relax → several quick PFM squeezes → distract → urge subsides (a wave) → walk normally to void → once mastered, wait 5 min, then extend.</p>"], [4, "l", 17, "Ch 114 · Conservative Management of Urinary Incontinence: Behavioural and Pelvic Floor Therapy, Urethral and Pelvic Devices", "5 · Urge suppression", "Stand-alone for UUI: mean <span class=\"key\">60–80%</span> reduction in incontinence; also urgency, frequency, nocturia. <b>Nocturia</b>: suppress on waking; void if not passed in 1–2 min."], [4, "r", 18, "Ch 114 · Conservative Management of Urinary Incontinence: Behavioural and Pelvic Floor Therapy, Urethral and Pelvic Devices", "7 · Electrical stimulation (E-stim)", "UUI · <span class=\"key\">5–20 Hz</span> (low)"], [4, "r", 18, "Ch 114 · Conservative Management of Urinary Incontinence: Behavioural and Pelvic Floor Therapy, Urethral and Pelvic Devices", "7 · Electrical stimulation (E-stim)", "SUI (incl. post-prostatectomy) · <span class=\"key\">20–50 Hz</span> (higher)"], [4, "p", 18, "Ch 114 · Conservative Management of Urinary Incontinence: Behavioural and Pelvic Floor Therapy, Urethral and Pelvic Devices", "7 · Electrical stimulation (E-stim)", "E-stim dosed by goal: sub-sensory, low-frequency, prolonged → detrusor inhibition; near-painful, higher-frequency, brief → sphincter contraction. Volitional PFMT does both, so E-stim earns its place only where volitional contraction is absent."], [4, "a", 18, "Ch 114 · Conservative Management of Urinary Incontinence: Behavioural and Pelvic Floor Therapy, Urethral and Pelvic Devices", "8 · Bladder training and scheduled voiding", "<p>Diary → initial interval ~1 h awake (30 min if needed) → void on waking, at each interval and bedtime, not between → increase <b>15–30 min/week</b> if leaks and urgency controlled → target <b>3–4 h</b> → weekly review with reinforcement.</p>"], [4, "l", 20, "Ch 114 · Conservative Management of Urinary Incontinence: Behavioural and Pelvic Floor Therapy, Urethral and Pelvic Devices", "12 · Adherence, prevention and delivery", "<b>Prevention</b>: older women — group classes; <b>childbearing</b> — supervised antenatal PFMT (12 weeks from 16–24 weeks' gestation) prevents late-pregnancy and early postpartum UI (A); postnatal programme after forceps or baby ≥<span class=\"key\">4000 g</span>; antenatal PFMT does <b>not</b> prevent postnatal prolapse; <b>prostatectomy</b> — pre ± early post-op PFMT shortens time to continence."], [4, "p", 22, "Ch 116 · Retropubic Suspension Surgery for Incontinence in Females", "1 · Mechanism", "Suspension corrects <b>hypermobility, not the sphincter</b>: it lifts and stabilises bladder neck and proximal urethra, so presupposes a mobile urethra. A fixed ISD urethra needs compression (sling, AUS)."], [4, "r", 22, "Ch 116 · Retropubic Suspension Surgery for Incontinence in Females", "2 · Patient selection", "Immobile urethra (negative Q-tip ≈ <span class=\"key\">5-fold</span> failure) → sling or AUS · Obesity, menopause, age &gt;60"], [4, "a", 22, "Ch 116 · Retropubic Suspension Surgery for Incontinence in Females", "4 · Burch colposuspension", "<p>Low lithotomy, prep incl. vagina, Foley → Pfannenstiel/low midline (± Cherney) → enter Retzius, sweep fat laterally → bladder neck by Foley balloon + vaginal finger → dissect bladder off vagina <b>laterally</b> → expose Cooper's → sutures → cystoscopy</p>"], [4, "l", 22, "Ch 116 · Retropubic Suspension Surgery for Incontinence in Females", "4 · Burch colposuspension", "Sutures medial → lateral; tie <b>distal first</b>, <b>loosely</b> (Tanagho) — <span class=\"key\">≈ 2 fingerbreadths</span> between bladder neck and pubis; over-tightening → obstruction."], [4, "p", 23, "Ch 116 · Retropubic Suspension Surgery for Incontinence in Females", "4 · Burch colposuspension", "<b>Danger points</b>: never dissect midline over urethra/bladder neck (Santorini bleeding, injury, obstruction if sutures medial). Passing through Cooper's may bleed suddenly — pressure, clips, sutures."], [4, "r", 23, "Ch 116 · Retropubic Suspension Surgery for Incontinence in Females", "4 · Burch colposuspension", "Open (Pfannenstiel) · Cure <span class=\"key\">85–90% at 1 y, ≈70% at 5 y</span>"], [4, "p", 23, "Ch 116 · Retropubic Suspension Surgery for Incontinence in Females", "5 · Other retropubic procedures", "AUS in women: second-line for ISD (recurrent/neurogenic). At bladder neck, preferably <b>abdominally</b>; transvaginal raises infection and erosion."], [4, "l", 23, "Ch 116 · Retropubic Suspension Surgery for Incontinence in Females", "6 · Perioperative care", "Incomplete emptying: CIC (preferred to suprapubic) until PVR consistently <span class=\"key\">&lt;150 mL</span>."], [4, "l", 25, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "1 · How slings work — theories of continence", "Integral theory support: incontinent women have ≈ <span class=\"key\">40% less collagen</span> in skin/round ligament biopsies <span class=\"tag\">MCQ</span>."], [4, "l", 25, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "2 · Preoperative assessment and patient selection", "Q-tip hypermobility = <span class=\"key\">&gt;30°</span> on straining."], [4, "l", 26, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "2 · Preoperative assessment and patient selection", "MUCP <span class=\"key\">&lt;20 cm H₂O</span> = type 3 SUI = <b>ISD</b>; ALPP/VLPP <span class=\"key\">&lt;60 cm H₂O</span> = ISD; <span class=\"key\">&gt;90</span> = little/no ISD."], [4, "l", 26, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "4 · Pubovaginal sling", "Width <span class=\"key\">&lt;2 cm</span> — compresses without a constricting band."], [4, "r", 27, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "4 · Pubovaginal sling", "Synthetic at bladder neck · Urethral perforation <span class=\"key\">15×</span>, vaginal exposure <span class=\"key\">14×</span> (esp. woven polyester) · <b>No longer used at bladder neck</b>"], [4, "p", 27, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "4 · Pubovaginal sling", "<b>Fibrosis paradox</b>: more fibrosis should mean better support, but the inflammation driving it also degrades the sling → erosion. Autologous fascia remodels with minimal inflammation — the ideal balance."], [4, "a", 27, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "5 · Autologous PVS — operative procedure", "<p>Pfannenstiel 6–7 cm → mark <b>2 × 8 cm</b> rectus graft → excise → close fascia (No. 1 PDS) → clean graft → No. 1 PDS stitched to each end → saline</p>"], [4, "l", 27, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "5 · Autologous PVS — operative procedure", "Transverse incision <span class=\"key\">≥2 cm above the symphysis</span> for tension-free closure; if impossible (rare) bridge with mesh/biologic."], [4, "a", 27, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "5 · Autologous PVS — operative procedure", "<p>Bladder empty → Stamey needles <b>from above</b> on back of pubis into vaginal incision → <b>cystoscopy (70° lens)</b> → injury: repass <b>more laterally</b>, re-scope each pass → confirm ureteric efflux → graft centred → ends tagged above</p>"], [4, "l", 27, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "5 · Autologous PVS — operative procedure", "<b>Tension</b>: tie over rectus with <span class=\"key\">two fingerbreadths</span> slack — deliberately <b>loose</b>; tighter only if lifelong CIC planned."], [4, "l", 27, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "5 · Autologous PVS — operative procedure", "Postop: liberal fluids; pack and catheter out, trial of void day 1; failure → Foley/CIC, retrial within 5 days. No lifting &gt;10 lb or intercourse for <span class=\"key\">6 weeks</span>."], [4, "p", 28, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "7 · PVS complications and management", "<b>Key diagnostic criterion is the temporal relationship</b> between surgery and symptoms, not a urodynamic number. Preoperative UDS does not predict obstruction (SISTEr)."], [4, "a", 28, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "7 · PVS complications and management", "<p>Transient retention (most void within <b>10 days</b>) → catheter/CIC, timed voiding, PFMT, anticholinergic → autologous obstruction often improves: wait up to <span class=\"key\">3 months</span> → complete retention, earlier: <b>&lt;6 weeks</b> loosen autologous sling under anaesthesia (downward urethral traction) → <b>&gt;6 weeks</b> or failed care → sling incision or urethrolysis</p>"], [4, "l", 29, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "7 · PVS complications and management", "Mortality ≈ <span class=\"key\">3 per 10,000</span> anti-incontinence procedures. Harvest-site <b>incisional hernia</b> ≈1%."], [4, "p", 29, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "8 · Mid-urethral sling — mechanism and materials", "<b>Why does a loose tape work?</b> At rest it doesn't touch the urethra, so voiding is unobstructed. On coughing the mobile urethra descends onto the tape, the posterior wall is arrested, the urethra kinks and closes. A fixed urethra never meets the tape; tightening to compensate obstructs."], [4, "l", 29, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "8 · Mid-urethral sling — mechanism and materials", "Material: <b>type 1 (Amid) macroporous monofilament polypropylene</b>, pore <span class=\"key\">&gt;75 µm</span> (macrophage entry, fibrovascular ingrowth). UraTape and ObTape (&lt;50 µm) → high exposure → withdrawn."], [4, "a", 30, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "9 · MUS operative procedures", "<p>Local infiltration → two suprapubic stabs ≈2 cm from midline → 1.5 cm midline vaginal incision 1.5 cm from meatus → minimal lateral tunnels to endopelvic fascia (<b>not perforated</b>, unlike PVS) → catheter guide deflects bladder to opposite side → trocar through Retzius and rectus, <b>hugging the back of the pubis</b> → repeat → cystoscopy → tension loosely (clamp between tape and urethra) → remove sheath → trim</p>"], [4, "r", 30, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "9 · MUS operative procedures", "Bladder perforation · <span class=\"key\">4.5%</span> · <span class=\"key\">0.6%</span> · Rare"], [4, "p", 31, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "12 · MUS complications and management", "<b>Concurrent vs staged sling at POP repair</b>. Concurrent: one operation, less SUI (≈39% → 8–19%), but more obstruction, storage symptoms, mesh events; tensioning hard if SUI occult. Staged: avoids unnecessary sling but commits a third to a second operation (usually within 12 months). Decide after testing for occult SUI with prolapse reduced."], [4, "a", 32, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "12 · MUS complications and management", "<p>Retention/high PVR → CIC or catheter (most resolve within 2 weeks) → persistent obstruction → <b>transvaginal midline sling incision at 2–4 weeks</b> → &gt;3 months: tape fixed → excise lateral portion → rarely formal urethrolysis</p>"], [4, "p", 32, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "12 · MUS complications and management", "<b>Why different timing from PVS?</b> Fascial obstruction often settles (wait up to 3 months). Mesh is fixed by ingrowth, rarely loosens; late release needs wider dissection and causes more recurrent SUI — release within ≈4 weeks."], [4, "a", 32, "Ch 118 · Slings: Autologous, Biologic, Synthetic and Mid-Urethral", "14 · Assessing the failed or troublesome sling", "<p>Symptom after sling → define: persistent SUI vs storage vs voiding vs pain/discharge → <b>timeline</b> → exam (exposure, POP, mobility, tenderness over tape) → PVR, urine culture → <b>cystoscopy</b> → UDS selectively → tailored treatment</p>"], [4, "p", 35, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "2 · Choice of procedure by compartment", "Only paravaginal repair and uterosacral suspension are done by both routes. McCall = vaginal; Halban (linear sutures) and Moschcowitz (purse-string — may angulate the ureter) = abdominal."], [4, "a", 35, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "3 · Anterior compartment", "<p>Lithotomy → catheter → hydrodissection → midline incision apex → bladder neck → dissect epithelium off pubocervical fascia laterally to ATFP → reduce bladder → interrupted 2-0/3-0 delayed-absorbable plication, bladder neck → apex → trim judiciously → close → IV dye + <b>cystoscopy</b> → pack.</p>"], [4, "l", 35, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "3 · Anterior compartment", "Abandoned for SUI: AUA meta-analysis failure approaching <span class=\"key\">40%</span>."], [4, "r", 35, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "3 · Anterior compartment", "De novo SUI · Rises with stage: 2 <span class=\"key\">41%</span>, early 3 <span class=\"key\">53%</span>, advanced 3–4 <span class=\"key\">66%</span>; point Ba predicts"], [4, "p", 35, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "3 · Anterior compartment", "<b>Confirming ureteric efflux</b>: indigo carmine (blue, IV), fluorescein 10% (green, IV), phenazopyridine (orange, oral). No efflux → ureteric catheter/retrograde or remove plication sutures. Under-hydration can delay efflux — never close without proving patency."], [4, "l", 35, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "3 · Anterior compartment", "Lateral recurrence 2–8% but central ~<span class=\"key\">22%</span> → two independent failures. Abdominal more durable."], [4, "p", 36, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "4 · Occult SUI and the concomitant sling", "<b>Sling also helps the prolapse</b>: adds distal anterior support → more durable cystocele repair. <b>Why not everyone</b>: OPUS — more bladder perforation, UTI, bleeding, incomplete emptying; pelvic floor symptom scores unchanged. Weigh per patient."], [4, "a", 36, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "4 · Occult SUI and the concomitant sling", "<p>Advanced anterior POP → reduction stress test ± UDS → symptomatic/occult/urodynamic SUI → offer concomitant procedure → continent, test negative → individual risk–benefit (OPUS calculator); <b>selective, not routine</b>.</p>"], [4, "a", 36, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "5 · Apical compartment", "<p>After vaginal hysterectomy: cuff stays at 3 and 9 o'clock → excise enterocele sac → pack bowel → palpate spines → Allis at 5 and 7 o'clock → <b>2–4</b> non-absorbable sutures per side → anterior repair/sling now → through apical pubocervical and rectovaginal fascia → tie → <b>cystoscopy after tying, before trimming</b> → no efflux: remove most lateral ipsilateral suture first.</p>"], [4, "l", 37, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "5 · Apical compartment", "Apical success ~98%, anterior ~81%; ureteric kinking/injury <span class=\"key\">1–11%</span>. Absorbable non-inferior. Premenopausal ↑ recurrence. De novo dyspareunia possible."], [4, "l", 37, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "5 · Apical compartment", "<b>Safe zone</b>: <span class=\"key\">1.5–3.0 cm medial to the ischial spine</span>, into the ligament, limited depth. Too lateral → pudendal; too medial → weak ligament + sacral nerves."], [4, "a", 37, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "5 · Apical compartment", "<p>Mark apex → midline incision → enter perirectal space, rectum medial → palpate spine/ligament → retractors → 2 sutures (Capio/Miya hook) → other repairs → sutures to apex (pulley stitch if permanent) → close vagina halfway → tie apex flush (<b>no suture bridge</b>) → cystoscopy → close.</p>"], [4, "l", 37, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "5 · Apical compartment", "Gluteal pain <span class=\"key\">15%</span>, resolves in 2–3 months (local anaesthetic injection if needed); pudendal injury; rectal injury (repair primarily); haemorrhage."], [4, "p", 37, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "5 · Apical compartment", "Both ligaments are safest in their <b>middle third</b>, dangerous at bony ends: USLS intermediate portion; SSLF 1.5–3 cm medial to spine."], [4, "a", 37, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "5 · Apical compartment", "<p>Low lithotomy, vaginal stent/EEA sizer → sigmoid left → incise peritoneum over promontory, along <b>right</b> of rectum (right ureter) → anterior longitudinal ligament → (Halban if large enterocele) → dissect bladder off anterior vagina (6–8 cm) and rectum off posterior → Y-mesh to both walls <b>without entering lumen</b> → tension → 2–3 permanent sutures at <b>S1</b> → <b>retroperitonealise</b> → anti-incontinence procedure if indicated → cystoscopy.</p>"], [4, "r", 38, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "5 · Apical compartment", "Mesh exposure · <span class=\"key\">~10% by 7 years</span> (E-CARE); mean onset 14 months; more with microporous (Gore-Tex: bacteria enter pores macrophages can't); excision <span class=\"xref\">→ Ch 119</span>"], [4, "a", 38, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "5 · Apical compartment", "<p>Elderly/comorbid, not sexually active → colpocleisis → fit, primary, wants vaginal → USLS or SSLF ± vaginal hysterectomy or hysteropexy → young/active, recurrent, short vagina, high stage → SCP (minimally invasive).</p>"], [4, "l", 39, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "7 · Obliterative surgery — colpocleisis", "Spare ≥<span class=\"key\">1.5 cm</span> distal anterior wall (urethral traction SUI); sling if SUI/occult SUI; frail → consider SPC."], [4, "l", 39, "Ch 117 · Vaginal and Abdominal Reconstructive Surgery for Pelvic Organ Prolapse", "7 · Obliterative surgery — colpocleisis", "Success ~90–98%, satisfaction &gt;90%, regret up to <span class=\"key\">13%</span>; 43% &gt;80 years — optimisation matters most."], [4, "p", 41, "Ch 119 · Genitourinary Complications of Mesh and Their Repair", "1 · Mesh, terminology and regulation", "<b>Why pore size matters</b>: bacteria (~1 µm) enter pores that macrophages (~50 µm) cannot — infection sealed from immunity. Large pores (~1500 µm) allow fibrocollagenous integration. Woven polypropylene (Marlex) is stiff and extrudes. No excess cancer or autoimmune disease with mesh."], [4, "a", 42, "Ch 119 · Genitourinary Complications of Mesh and Their Repair", "3 · Evaluation", "<p>History + <b>prior operative notes</b> → speculum/pelvic exam (exposure, bands, point tenderness, levator hypertonicity) → cystourethroscopy if haematuria, recurrent UTI, storage LUTS, voiding pain → UDS if voiding dysfunction → translabial ultrasound for sling; <b>MRI</b> for sacrocolpopexy mesh (invisible on CT); CT for haematoma.</p>"], [4, "l", 42, "Ch 119 · Genitourinary Complications of Mesh and Their Repair", "4 · Midurethral sling complications", "<b>Excision</b>: hydrodissect → incision or inverted-U flap → locate (sound, ultrasound) → expose full width → pass instrument behind, divide → excise ≥<span class=\"key\">1 cm</span> around defect → avoid blind lateral dissection (vulval haematoma, esp. transobturator) → close."], [4, "l", 42, "Ch 119 · Genitourinary Complications of Mesh and Their Repair", "4 · Midurethral sling complications", "After excision: SUI <span class=\"key\">42%</span> (fewer with simultaneous fascial sling)."], [4, "p", 43, "Ch 119 · Genitourinary Complications of Mesh and Their Repair", "4 · Midurethral sling complications", "<b>How much to remove</b>: retention — midline division; exposure — ≥1 cm each side; pain — maximal vaginal removal, rarely arms. <b>Never remove asymptomatic mesh</b>; more removal = more bleeding, POP and SUI recurrence."], [4, "l", 43, "Ch 119 · Genitourinary Complications of Mesh and Their Repair", "6 · Sacrocolpopexy mesh", "Exposure ~<span class=\"key\">10.5% at 7 years</span>; total hysterectomy 23% vs 5%; stage 3–4. Cervix-sparing low risk."], [4, "p", 44, "Ch 121 · Urinary Tract Fistulae", "1 · Definition and universal principles", "Trap: a fistula may be the only sign of recurrent cancer — biopsy the tract after prior malignancy or radiation."], [4, "r", 44, "Ch 121 · Urinary Tract Fistulae", "2 · Vesicovaginal fistula (VVF) — aetiology", "Cause · Obstructed labour; young, small pelvis, poor nutrition · Unrecognised surgical injury; <span class=\"key\">&gt;75%</span> after hysterectomy"], [4, "l", 44, "Ch 121 · Urinary Tract Fistulae", "2 · Vesicovaginal fistula (VVF) — aetiology", "<b>Radiation</b>: obliterative endarteritis + fibrosis → necrosis. 0.6–2% after cervical cancer radiotherapy; typically <span class=\"key\">1.5–2 years</span> later (up to 30); dose-dependent, worse in smokers."], [4, "p", 45, "Ch 121 · Urinary Tract Fistulae", "3 · Classification of VVF", "Trap: Goh type 1 is farthest from the meatus (best), type 4 closest (worst) — closer = worse closure and continence. Goh predicts closure better. Always describe size, location (trigonal vs supratrigonal), tissue loss, ureteric and urethral involvement."], [4, "l", 45, "Ch 121 · Urinary Tract Fistulae", "4 · Diagnosis of VVF", "<b>Timing points to mechanism</b>: missed cystotomy → first days; thermal/crush → <span class=\"key\">7–10 days</span>; radiation → years. Fever, flank pain, ileus → urinoma/ureteric injury."], [4, "l", 45, "Ch 121 · Urinary Tract Fistulae", "4 · Diagnosis of VVF", "<b>Upper tract imaging mandatory</b> — ureteric injury in up to <span class=\"key\">12%</span>. CTU with delayed phase (MR urography if contrast allergy/renal failure). <b>Partial ureteric obstruction with VVF = UVF until proven otherwise.</b> Unclear → retrograde pyelogram + stent; fails → PCN."], [4, "p", 46, "Ch 121 · Urinary Tract Fistulae", "4 · Diagnosis of VVF", "Work-up order: is it urine (creatinine), where from (dye tests, endoscopy), what else is damaged (hence compulsory upper tract imaging). A preoperative PCN also allows antegrade ureteroscopy to find the ureter in scar."], [4, "r", 46, "Ch 121 · Urinary Tract Fistulae", "5 · VVF — timing, conservative care, repair", "Radiation-induced · ≥<span class=\"key\">12 months</span> after radiation ends · Late injury still evolving"], [4, "l", 46, "Ch 121 · Urinary Tract Fistulae", "5 · VVF — timing, conservative care, repair", "<b>Catheter</b>: favourable &lt;1 cm, within <span class=\"key\">3 weeks</span>; unfavourable ≥6 weeks, radiation, malignancy (never heal). EAU trial ≥<span class=\"key\">12 weeks</span>. Sealants possible for &lt;1 cm in poor surgical candidates (catheter adherence, spasm, stone on glue)."], [4, "l", 46, "Ch 121 · Urinary Tract Fistulae", "5 · VVF — timing, conservative care, repair", "<b>Location</b>: within <span class=\"key\">1 cm</span> of ureter → stent; ureter involved → reimplant (abdominal); bladder neck → reconstruction ± pubovaginal sling; apical (8–10 cm from introitus) beyond Martius reach → peritoneal/omental flap."], [4, "l", 46, "Ch 121 · Urinary Tract Fistulae", "5 · VVF — timing, conservative care, repair", "Route: no RCTs; first-attempt closure ≈ <span class=\"key\">90%</span> either. Transvaginal (less blood loss, pain, stay) — some call gold standard. Abdominal: large (≥4 cm primary, ≥2 cm recurrent), urethral/bladder-neck/ureteric involvement, non-capacious vagina, radiation, cannot be placed in lithotomy; vaginal suits dense abdominal adhesions, no GA. Vaginal risks shortening/dyspareunia (esp. Latzko); abdominal leaves sexual function unchanged."], [4, "a", 46, "Ch 121 · Urinary Tract Fistulae", "5 · VVF — timing, conservative care, repair", "<p><b>Transvaginal flap-splitting (Table 121.5)</b>: cystoscopy (stent close ureters; wire through tract) → SPC + urethral catheter → episiotomy if narrow → Foley ≥8 Fr through fistula for traction → hydrodissect → <b>J/U-incision</b> with 1–3 mm cuff → wide anterior/posterior flaps → layer 1: 3-0/4-0 delayed absorbable → layer 2 <b>perpendicular</b> → leak test 200–300 mL → ± Martius/peritoneal flap → advance opposite flap ≥2 cm beyond (layer 3) → cystoscopy for efflux</p>"], [4, "a", 47, "Ch 121 · Urinary Tract Fistulae", "5 · VVF — timing, conservative care, repair", "<p><b>O'Conor (Table 121.7)</b>: ureteric catheters → low midline, extraperitoneal → sagittal dome cystotomy → <b>bivalve</b> down around fistula → excise tract → separate bladder from vagina ≥2–3 cm beyond → close vagina → <b>omentum/peritoneum</b> beyond vaginal line → close bladder 1–2 layers → SPC ± urethral, fill test → 10–14 days, cystogram</p>"], [4, "l", 47, "Ch 121 · Urinary Tract Fistulae", "7 · Ureterovaginal fistula (UVF)", "Up to <span class=\"key\">25%</span> of VVF have a coexisting UVF; delayed recognition ~4-fold fistula risk. Preoperative IVP does not help; prophylactic stents selective (e.g. caesarean hysterectomy for placenta accreta). Ileal ureter/nephropexy for length; early vs ≥6-week repair equal."], [4, "a", 47, "Ch 121 · Urinary Tract Fistulae", "7 · Ureterovaginal fistula (UVF)", "<p>Suspect UVF → exclude VVF + CTU/retrograde pyelogram → stent → remove 4–6 weeks → reimage → resolved, or persistent/stent fails → ureteroneocystostomy</p>"], [4, "p", 47, "Ch 121 · Urinary Tract Fistulae", "7 · Ureterovaginal fistula (UVF)", "UVF: wet but voids normally; the ureter heals over a stent if reached early, so detection-to-stent interval largely decides whether surgery is needed."], [4, "l", 48, "Ch 121 · Urinary Tract Fistulae", "11 · Vesicoenteric fistula (VEF)", "Colovesical commonest; M : F <span class=\"key\">3 : 1</span> (uterus shields; prior hysterectomy common in affected women)."], [4, "p", 49, "Ch 121 · Urinary Tract Fistulae", "11 · Vesicoenteric fistula (VEF)", "VEF is a bowel disease presenting in the bladder — remove the diseased bowel; the bladder usually heals itself."], [4, "l", 49, "Ch 121 · Urinary Tract Fistulae", "12 · Urocutaneous fistulae", "<b>Urethrocutaneous</b>: commonest hypospadias complication (up to 20%). Wait ≥<span class=\"key\">6 months</span>; exclude distal stricture. &lt;1 cm → local closure; ≥1 cm/redo → vascularised flaps; <b>tunica vaginalis</b> &gt; dartos; massive loss → gracilis; neurogenic with pressure ulcers → ileal conduit."], [4, "l", 51, "Ch 122 · Bladder and Female Urethral Diverticula", "1 · Bladder diverticula — definition and pathology", "~90% in adults; M : F ≈ <span class=\"key\">9 : 1</span>. Cellules → saccules → diverticula: a pressure continuum."], [4, "l", 51, "Ch 122 · Bladder and Female Urethral Diverticula", "1 · Bladder diverticula — definition and pathology", "Acquired: ~<span class=\"key\">70%</span> BPH; also bladder neck obstruction, stricture. Women: dysfunctional voiding, prolapse, primary bladder neck obstruction, post-sling obstruction."], [4, "p", 51, "Ch 122 · Bladder and Female Urethral Diverticula", "1 · Bladder diverticula — definition and pathology", "Congenital = weak wall at normal pressure; acquired = normal wall at high pressure — an acquired diverticulum sends the search back to the outlet."], [4, "p", 52, "Ch 122 · Bladder and Female Urethral Diverticula", "2 · Bladder diverticula — evaluation", "Two jobs: find the cause (outlet or neurogenic) and exclude cancer in a sac each test sees imperfectly — so tests are combined."], [4, "l", 52, "Ch 122 · Bladder and Female Urethral Diverticula", "3 · Malignancy in bladder diverticula", "Stasis + inflammation; prevalence 0.8–10%, peak 65–75 years. Urothelial <span class=\"key\">70–80%</span>, SCC 20–25%."], [4, "p", 52, "Ch 122 · Bladder and Female Urethral Diverticula", "3 · Malignancy in bladder d
