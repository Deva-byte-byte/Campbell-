→ 24-hour urine within <span class=\"key\">6 months</span> → then at least yearly urine + blood for side effects → new stone: <b>re-analyse</b> → periodic imaging</p>"], [9, "r", 34, "Ch 100 · Lower Urinary Tract Calculi", "1 · Bladder calculi", "Patient · Children; peak <span class=\"key\">2–4 years</span>; male ≫ female · Men &gt;60 with outlet obstruction"], [9, "p", 34, "Ch 100 · Lower Urinary Tract Calculi", "1 · Bladder calculi", "Primary stone is a disease of the urine (normal bladder); secondary is a disease of the bladder (stasis, nidus, infection). Do not hunt for outlet obstruction in the endemic child."], [9, "l", 34, "Ch 100 · Lower Urinary Tract Calculi", "3 · Special situations", "<b>Spinal cord injury</b>: risk peaks <span class=\"key\">3 months</span> after injury; 15–30% within 10 years. <b>CIC beats indwelling catheters</b>; suprapubic = urethral. ≤4 cm transurethral laser; larger percutaneous/open; ESWL for anaesthetic risk or autonomic dysreflexia."], [9, "l", 36, "Ch 54 · Management of Paediatric Kidney Stone Disease", "1 · Epidemiology", "Early onset = &lt; <span class=\"key\">24 years</span>; rising fastest in <b>adolescent girls</b>; ~50% recur within 3–5 years."], [9, "r", 36, "Ch 54 · Management of Paediatric Kidney Stone Disease", "1 · Epidemiology", "Calcium oxalate (CaOx) · ≈ <span class=\"key\">80%</span> — mostly idiopathic, on Randall's plaques · 75–80%"], [9, "p", 36, "Ch 54 · Management of Paediatric Kidney Stone Disease", "1 · Epidemiology", "Stone formers get more CKD, hypertension, fracture; childhood is the bone-accrual window — seek low BMD early."], [9, "a", 36, "Ch 54 · Management of Paediatric Kidney Stone Disease", "2 · Diagnosis and imaging", "<p>Suspected stone → <b>ultrasound (US)</b> grey-scale + colour Doppler → negative + high suspicion or hydronephrosis → <b>low-dose non-contrast computed tomography (NCCT)</b> → negative + low suspicion: stop.</p>"], [9, "r", 36, "Ch 54 · Management of Paediatric Kidney Stone Disease", "3 · Metabolic evaluation — every child", "Calcium · &lt; <span class=\"key\">4 mg/kg/day</span>; spot Ca : creatinine &lt; 0.8 (0–6 mo), &lt; 0.6 (7–12 mo), &lt; <span class=\"key\">0.21</span> (&gt; 2 y)"], [9, "p", 37, "Ch 54 · Management of Paediatric Kidney Stone Disease", "3 · Metabolic evaluation — every child", "Never use adult limits: infants excrete more calcium, so the school-age 0.21 ratio overcalls them. Citrate's abnormality is too <i>little</i>."], [9, "l", 37, "Ch 54 · Management of Paediatric Kidney Stone Disease", "5 · Management principles", "Residual fragment threshold: <span class=\"key\">4 mm on US</span> (2 mm CT + ≈ 2 mm US overestimate)."], [9, "r", 37, "Ch 54 · Management of Paediatric Kidney Stone Disease", "5 · Management principles", "Uncomplicated ureteric ≤ <span class=\"key\">10 mm</span> · Observation ± α-blocker"], [9, "r", 38, "Ch 54 · Management of Paediatric Kidney Stone Disease", "5 · Management principles", "Renal ≤ <span class=\"key\">20 mm</span> · SWL or URS"], [9, "a", 38, "Ch 54 · Management of Paediatric Kidney Stone Disease", "6 · Ureteroscopy", "<p>Sterile culture → lithotomy → cystoscopy → retrograde pyelogram + safety wire → calibrate orifice with 8/10 Fr coaxial dilator → <b>if it will not pass: 4.6–4.8 Fr stent ≥ 14 days, return later</b> → URS → stent if long case, many passes, trauma/oedema.</p>"], [9, "a", 38, "Ch 54 · Management of Paediatric Kidney Stone Disease", "8 · Percutaneous nephrolithotomy", "<p>Prevent hypothermia → ureteric catheter → prone (latex precautions in myelomeningocele) → US/fluoroscopic puncture of posterior calyx → serial dilators → 18 Fr sheath (24 Fr staghorn) → nephroscope + ultrasonic/laser → flexible check → nephrostomy (7 Fr infant to 16 Fr adolescent).</p>"], [9, "a", 40, "Ch 125 · Genital and Lower Urinary Tract Trauma", "2 · Penile fracture", "<p>Prompt exploration → ventral penoscrotal (or small lateral) incision → evacuate haematoma → identify tear (artificial erection) → irrigate → close tunica with interrupted <b>2-0/3-0 absorbable</b> → repair urethra if injured</p>"], [9, "l", 40, "Ch 125 · Genital and Lower Urinary Tract Trauma", "3 · Penetrating, bite, amputation, zipper and strangulation", "<b>Gunshot</b>: explore immediately (do not delay for imaging) → irrigate → remove foreign matter → antibiotics → close tunica; artificial erection confirms closure. Almost never isolated. Urethral injury <span class=\"key\">15–50%</span> → RUG or intraoperative dye. Viable tissue → primary repair; tissue loss (high-velocity) → suprapubic diversion, staged repair."], [9, "a", 40, "Ch 125 · Genital and Lower Urinary Tract Trauma", "3 · Penetrating, bite, amputation, zipper and strangulation", "<p>Suprapubic cystostomy → debride → tunica 2-0 absorbable → urethra over catheter 4-0 → dorsal artery <b>11-0</b>, dorsal vein <b>9-0</b>, dorsal nerve <b>10-0</b> nylon → skin cover</p>"], [9, "a", 41, "Ch 125 · Genital and Lower Urinary Tract Trauma", "4 · Testicular injury", "<p>Explore → remove necrotic/extruded tubules → close tunica with small absorbable sutures → large defect: tunica vaginalis flap/graft (no synthetic) → drain</p>"], [9, "l", 41, "Ch 125 · Genital and Lower Urinary Tract Trauma", "4 · Testicular injury", "Salvage <span class=\"key\">&gt;90%</span> if repaired within <b>72 h</b>; non-operative care → infection, atrophy, late orchidectomy."], [9, "p", 42, "Ch 125 · Genital and Lower Urinary Tract Trauma", "6 · Bladder injury", "Immediate repair: intraperitoneal, penetrating, bladder neck, rectal/vaginal injury, bone fragments in bladder, clots/poor drainage, iatrogenic urological injury, laparotomy for other reasons."], [9, "a", 43, "Ch 125 · Genital and Lower Urinary Tract Trauma", "7 · Posterior urethral injury (PFUI)", "<p>Blood at meatus → RUG before catheter: 16-Fr catheter in fossa navicularis, balloon 3 mL → penile traction → oblique → 20 mL contrast → image during injection</p>"], [9, "r", 44, "Ch 62 · Paediatric Genitourinary Trauma", "1 · Renal injury: how the child differs", "Blood pressure · Maintained until ≈ <span class=\"key\">25–30% volume loss</span> — hypotension late · Falls earlier"], [9, "l", 44, "Ch 62 · Paediatric Genitourinary Trauma", "2 · Indications for imaging", "Paediatric triggers: fall &gt; <span class=\"key\">10 feet (3 m)</span>, high-speed collision, flank blow; rib, spine, femur or pelvic fracture. All four markers together → &gt; <span class=\"key\">98% sensitivity</span>."], [9, "p", 44, "Ch 62 · Paediatric Genitourinary Trauma", "2 · Indications for imaging", "Trap: \"no haematuria, so no imaging\". Haematuria is one of four routes into imaging; in children both adult markers fail, so mechanism drives the decision."], [9, "p", 45, "Ch 62 · Paediatric Genitourinary Trauma", "4 · Grading", "Grades 1–3 differ only in depth (1 cm) and never involve the collecting system — entry makes grade 4. Shattered kidney: grade 5 (1989), grade 4 (2011)."], [9, "r", 45, "Ch 62 · Paediatric Genitourinary Trauma", "4 · Grading", "Perirenal haematoma &gt; 3.5 cm adult, &gt; <span class=\"key\">2.2 cm child</span> · Bleeding needing angioembolisation"], [9, "a", 45, "Ch 62 · Paediatric Genitourinary Trauma", "5 · Non-operative management (NOM)", "<p>Confirm stability → grade → bed rest → serial haemoglobin + abdominal examination → mobilise when gross haematuria resolves and counts stable.</p>"], [9, "l", 45, "Ch 62 · Paediatric Genitourinary Trauma", "5 · Non-operative management (NOM)", "Grade 3 (devitalised) to 5: ≈ <span class=\"key\">25%</span> embolisation, ≈ <span class=\"key\">15%</span> urinoma intervention, ≈ 5% exploration."], [9, "l", 45, "Ch 62 · Paediatric Genitourinary Trauma", "6 · Complications during NOM", "<b>Urine leak</b>: grade 4–5 only; up to <span class=\"key\">85%</span> resolve. Urinoma triad: <b>flank pain, ileus, low-grade fever</b>. No distal ureteric contrast → cystoscopy + retrograde pyelography (RPG). Escalate: <b>stent + Foley</b> (AUA first line, ≈ 90%; out 4–6 weeks) → percutaneous drain → nephrostomy → open repair."], [9, "r", 45, "Ch 62 · Paediatric Genitourinary Trauma", "6 · Complications during NOM", "Timing · From injury · Typically <span class=\"key\">1–2 weeks</span> (up to 1 month)"], [9, "a", 46, "Ch 62 · Paediatric Genitourinary Trauma", "7 · Operative management", "<p>Contralateral kidney confirmed → open Gerota → control vessels → debride → close collecting system → parenchyma over bolster → drain. Penetrating: inspect ureter.</p>"], [9, "r", 46, "Ch 62 · Paediatric Genitourinary Trauma", "9 · Ureteral trauma", "II / III · &lt; 50% / ≥ <span class=\"key\">50%</span> transection"], [9, "r", 46, "Ch 62 · Paediatric Genitourinary Trauma", "9 · Ureteral trauma", "V · Avulsion, &gt; <span class=\"key\">2 cm</span> devascularisation"], [9, "p", 47, "Ch 62 · Paediatric Genitourinary Trauma", "10 · Bladder injury", "Bladder neck avulsion is commoner in children; girls depend more on the bladder neck for continence, so outcome is poor — many need secondary procedures, even closure and diversion."], [9, "a", 47, "Ch 62 · Paediatric Genitourinary Trauma", "11 · Urethral injury", "<p>Suprapubic diversion → wait several months → cystogram + RUG ± endoscopy → transperineal excision and primary anastomosis (pubectomy if tension) → catheter 2–3 weeks → cystogram → suprapubic tube out.</p>"], [9, "p", 47, "Ch 62 · Paediatric Genitourinary Trauma", "12 · Genital injury", "Most are accidental, but <b>abuse must always be assessed</b> (≈ 1 in 7 boys, 1 in 3 girls abused). Examine anus and rectum; involve social services before discharge."], [9, "a", 49, "★ Putting it together", "A · Renal colic", "<p><b>1.</b> NSAID (ketorolac 30 mg) unless renal failure, bleeding, pregnancy. Non-contrast computed tomography (NCCT) confirms; ultrasound first in pregnancy and children (<span class=\"xref\">→ Ch 96</span>).</p>\n<p><b>2. Decompress now</b> (stent or nephrostomy, equal) if infected, bilateral, solitary kidney, immunosuppressed, renal deterioration, refractory pain/vomiting. Never lithotripsy when infected.</p>\n<p><b>3. Otherwise</b> &lt;10 mm → passage trial ± α-blocker (distal 5–10 mm) 4–6 weeks → fails: ureteroscopy (URS) or shock wave lithotripsy (SWL) (<span class=\"xref\">→ Ch 97</span>).</p>"], [9, "p", 49, "★ Putting it together", "B · Stone operation", "SWL absolute contraindications: pregnancy, coagulopathy/antithrombotics, untreated infection, uncontrolled hypertension, arterial aneurysm, distal obstruction. No routine stent after SWL/uncomplicated URS (<span class=\"xref\">→ Ch 98</span>)."], [9, "a", 49, "★ Putting it together", "C · Prevention", "<p><b>All:</b> urine ≥2.5 L/day <span class=\"dag\">†</span>, normal calcium, low sodium, less animal protein (<span class=\"xref\">→ Ch 99</span>).</p>\n<p><b>High risk</b> → 24-hour urines → targeted therapy → repeat within 6 months.</p>"], [9, "a", 50, "★ Putting it together", "D · Renal trauma", "<p><b>Image</b> (delayed-phase CT): gross haematuria, microhaematuria + shock, deceleration, penetrating (<span class=\"xref\">→ Ch 94</span>).</p>\n<p><b>Stable grade I–IV, selected V</b> → non-operative (&gt;90%). Blush → embolise. Symptomatic leak → stent.</p>\n<p><b>Explore</b> if unstable or expanding haematoma; one-shot pyelogram (2 mL/kg, 10 min) confirms other kidney.</p>"], [9, "p", 50, "★ Putting it together", "G · Children", "<b>Stones:</b> ultrasound first; full metabolic evaluation after first stone. Renal ≤20 mm → SWL or URS; &gt;20 mm → PCNL (<span class=\"xref\">→ Ch 54</span>). <b>Trauma:</b> image by mechanism (fall &gt;3 m, deceleration) — blood pressure falls late; perirenal haematoma &gt;2.2 cm predicts embolisation (<span class=\"xref\">→ Ch 62</span>)."], [10, "l", 2, "Ch 129 · Tumours of the Urinary Bladder", "1 · Epidemiology (headline)", "Median age <span class=\"key\">73</span>; ~9 in 10 after 55. <b>M:F ≈ 3:1</b>."], [10, "l", 2, "Ch 129 · Tumours of the Urinary Bladder", "2 · Risk factors", "<b>Smoking</b>: <span class=\"key\">30–40%</span> of UC; risk <span class=\"key\">2–3×</span>; pipes, cigars, e-cigarettes too. <b>N-acetyltransferase 2 (NAT2) slow acetylators</b> highest risk (acetylation detoxifies amines). Near never-smokers after <span class=\"key\">&gt;15 years</span> quit. ~20% still smoke at diagnosis → more non-muscle-invasive (NMIBC) recurrence and muscle-invasive (MIBC) cancer death."], [10, "r", 3, "Ch 129 · Tumours of the Urinary Bladder", "3 · Pathology", "Dysplasia · Loss of polarity, umbrella cells kept; CK20, p53 · 14–19% progress; <span class=\"key\">60%</span> → CIS if prior cancer"], [10, "p", 4, "Ch 129 · Tumours of the Urinary Bladder", "3 · Pathology", "Small cell = systemic: primary cystectomy gives poor DFS not rescued by adjuvant chemotherapy; neoadjuvant markedly improves cancer-specific survival. SCC in spinal cord injury fell after switch to intermittent self-catheterisation – inflammation drives it."], [10, "l", 5, "Ch 129 · Tumours of the Urinary Bladder", "4 · Molecular biology", "TCGA: luminal-infiltrated – poor cisplatin NAC response (try immunotherapy); neuronal → etoposide–cisplatin; APOBEC-high survives better. <span class=\"tag\">MCQ</span> Micropapillary maps to luminal."], [10, "l", 5, "Ch 129 · Tumours of the Urinary Bladder", "5 · Clinical presentation and evaluation", "<b>Painless gross haematuria in <span class=\"key\">85%</span></b>; microscopic in nearly all. Irritative symptoms suggest CIS."], [10, "a", 5, "Ch 129 · Tumours of the Urinary Bladder", "5 · Clinical presentation and evaluation", "<p>Positive high-grade cytology + negative cystoscopy → random bladder and prostatic urethral biopsies → selective upper-tract washings ± ureteroscopy</p>"], [10, "l", 6, "Ch 129 · Tumours of the Urinary Bladder", "6 · Staging and risk groups", "<b>2017 change</b>: regional nodes without M1 = stage III (was IV). <span class=\"tag\">MCQ</span> Common iliac = N3, not M1a."], [10, "l", 7, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "1 · Definition and natural history", "<b>NMIBC</b>: urothelial carcinoma (UC) not invading detrusor – Ta, T1, carcinoma in situ (CIS). <span class=\"key\">70–80%</span> of new bladder cancers: Ta 60–70%, T1 20–30%, CIS ~10% <span class=\"xref\">→ Ch 129</span>."], [10, "l", 7, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "1 · Definition and natural history", "Recurrence <span class=\"key\">40–60%</span>; progression ~6% (low-grade [LG] Ta) to 17% (high-grade [HG] T1)."], [10, "l", 7, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "1 · Definition and natural history", "<b>Grade, not stage, is the strongest predictor of progression</b>; CIS second. HG Ta and HG T1 progress similarly. Primary CIS progresses in <span class=\"key\">&gt;50%</span>; untreated CIS reaches muscle in 40–83%."], [10, "l", 7, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "1 · Definition and natural history", "<b>Understaging</b>: cystectomy for presumed NMIBC shows worse disease in <span class=\"key\">one-third to one-half</span>; clinical T1 unreliable."], [10, "p", 7, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "1 · Definition and natural history", "NMIBC is two diseases: LG = <b>recurrence</b> problem, HG = <b>progression</b> problem. Chemotherapy treats recurrence, bacille Calmette-Guérin (BCG) treats progression, cystectomy is for uncontrollable progression."], [10, "r", 7, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "2 · Risk stratification", "Low · LG solitary Ta <span class=\"key\">≤3 cm</span>; PUNLMP · Single post-op chemotherapy instillation"], [10, "r", 7, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "2 · Risk stratification", "High · HG T1; recurrent HG Ta; HG Ta &gt;3 cm or multifocal; <b>any CIS</b>; any BCG failure in HG; <b>any variant histology</b>; <b>any lymphovascular invasion (LVI)</b>; any HG prostatic urethral involvement · Induction BCG + maintenance to <span class=\"key\">3 yr</span>. BCG-unresponsive: radical cystectomy (RC), pembrolizumab, nadofaragene, gemcitabine–docetaxel"], [10, "l", 7, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "2 · Risk stratification", "EORTC <b>overestimates</b> (little maintenance BCG, perioperative mitomycin C [MMC] or re-TURBT); CUETO derived in BCG-treated patients → fits better. <span class=\"tag\">MCQ</span> Both use <b>WHO 1973</b>."], [10, "l", 8, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "3 · Endoscopic management", "Image upper tracts at diagnosis (CTU or retrograde): tumours <span class=\"key\">&lt;5%</span>; risk: trigonal, CIS, high risk."], [10, "r", 8, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "3 · Endoscopic management", "Recommended (within <span class=\"key\">6 weeks</span>, include muscularis propria) · Consider"], [10, "l", 8, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "3 · Endoscopic management", "Small (<span class=\"key\">≤1 cm</span>) LG recurrences: office fulguration/laser – needs <b>prior LG diagnosis and negative cytology</b> (no tissue). <b>Active surveillance</b> of small LG tumours safe in selected."], [10, "r", 8, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "3 · Endoscopic management", "Gain · ~<span class=\"key\">one-third more CIS</span>; smaller papillary · More papillary tumours and CIS"], [10, "l", 8, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "4 · Single post-operative instillation", "MMC within <span class=\"key\">6 h</span>; level 1 evidence; limited gain in recurrent/multiple tumours. Thiotepa ineffective."], [10, "a", 9, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "6 · Bacille Calmette-Guérin (BCG)", "<p>Wait <span class=\"key\">2–4 weeks</span> after TURBT (re-epithelialisation) → urinalysis before each dose (exclude infection, gross bleeding) → 1 vial in 50 mL saline by catheter → retain 1–2 h (restrict fluids, diuretics, caffeine before). Traumatic catheterisation → delay several days.</p>"], [10, "l", 9, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "6 · Bacille Calmette-Guérin (BCG)", "CIS initial CR up to <span class=\"key\">84%</span>; ~half durable; only ~30% free of recurrence/progression at 10 yr."], [10, "a", 10, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "6 · Bacille Calmette-Guérin (BCG)", "<p><b>SWOG (Lamm 2000)</b>: induction weekly ×6 → 3 weekly instillations at <span class=\"key\">3 and 6 months, then every 6 months to 3 yr</span>. High risk: full dose 3 yr. Intermediate: 1 yr (EORTC 30962).</p>"], [10, "l", 10, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "6 · Bacille Calmette-Guérin (BCG)", "<span class=\"tag\">MCQ</span> BCG resistant to <b>pyrazinamide</b>. Avoid cycloserine (psychiatric). Asymptomatic granulomatous prostatitis: no treatment."], [10, "a", 10, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "6 · Bacille Calmette-Guérin (BCG)", "<p>Prioritise high risk → reduce dose (especially maintenance) → split vials → chemotherapy for intermediate (single agent) and high risk (Gem/Doce) → early RC for highest risk.</p>"], [10, "p", 10, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "7 · Recurrence after BCG", "<b>Trap:</b> HG T1 at 3 months after induction alone = unresponsive. CIS or HG Ta at 3 months = \"resistant\" → more BCG."], [10, "l", 11, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "8 · Early radical cystectomy in high-risk NMIBC", "T1 failing BCG at 3 months: <span class=\"key\">82%</span> progress; CIS ~50%. Prolonged intravesical therapy: ~¼ alive with bladder at 15 yr. Immediate RC for clinical T1: 10-yr DFS <span class=\"key\">92%</span>, 64% if understaged. Even 12-week delay worsens survival."], [10, "a", 11, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "8 · Early radical cystectomy in high-risk NMIBC", "<p><b>Strongly consider RC</b>: BCG-unresponsive HG · persistent HG T1 on re-resection · T1 with CIS, LVI or variant histology · deep lamina propria invasion · diffuse CIS · diverticular HG tumour · distal ureteric or prostatic ductal involvement · tumour unresectable completely · patient preference.</p>"], [10, "r", 11, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "9 · Surveillance", "Low · 3 months → annually from 12 months; consider stopping at <span class=\"key\">≥5 yr</span> · Consider · Only if haematuria"], [10, "r", 11, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "9 · Surveillance", "High · <span class=\"key\">3–4-monthly for 2 yr</span> → 6-monthly 2 yr → annually <b>for life</b> · Same schedule · Annually 2 yr, then lengthen"], [10, "l", 13, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "1 · Natural history and histology", "<span class=\"key\">20–30%</span> of new bladder cancers are muscle-invasive (MIBC); <span class=\"key\">~12%</span> node-positive or metastatic."], [10, "l", 13, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "1 · Natural history and histology", "<b>Primary MIBC</b> = invasive at diagnosis; <b>secondary</b> (<span class=\"key\">~20%</span>) = progressed from NMIBC → worse: more understaging, lower response to neoadjuvant chemotherapy (NAC)."], [10, "l", 13, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "1 · Natural history and histology", "Most deaths after local therapy: within <span class=\"key\">2 years</span>, systemic (micrometastases) → add systemic therapy."], [10, "l", 13, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "2 · Clinical staging", "HG T1 or no muscle → repeat TUR within <span class=\"key\">6 weeks</span> (&gt;40% upstaged without muscle)."], [10, "l", 13, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "2 · Clinical staging", "<b>Prostatic urethral biopsy</b> (trigone/bladder-neck tumour, CIS, multifocal): full-thickness loop mid-prostate to verumontanum at <span class=\"key\">5 and 7 o'clock</span> (densest ducts, commonest CIS). Stromal involvement affects NAC, urethrectomy, diversion choice."], [10, "l", 14, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "2 · Clinical staging", "<b>Image before TUR</b> (post-resection inflammation mimics T3). CT nodal sensitivity only <span class=\"key\">30–50%</span>. Hydronephrosis → extravesical disease likely."], [10, "l", 14, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "2 · Clinical staging", "MRI: poor renal function/contrast allergy; best local T-staging. <b>VI-RADS</b> (muscularis line): intact 1–3, interrupted 4, into fat 5; <span class=\"key\">≥3</span> suspicious (equivocal = positive)."], [10, "l", 14, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "4 · Radical cystectomy: principles and extent", "<b>RC + bilateral pelvic lymph node dissection (PLND) = standard for resectable MIBC</b>, ideally after cisplatin NAC. Delay &gt;<span class=\"key\">12 weeks</span> → more extravesical/nodal disease, worse survival."], [10, "p", 15, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "4 · Radical cystectomy: principles and extent", "Spare an organ only where oncologically silent: men – prostatic urethra and bladder neck; women – bladder neck, base, anterior vaginal wall."], [10, "l", 15, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "5 · Pelvic lymph node dissection", "~<span class=\"key\">25%</span> node-positive at RC; nodal status strongest survival predictor. Recurrence <span class=\"key\">70–80%</span> N+ vs ~30% N0. Rises with T (≤pT1 1–7% … pT4 up to 80%)."], [10, "l", 15, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "7 · Outcomes after RC", "<span class=\"key\">~50%</span> ultimately die of bladder cancer, mostly metastases within 2 years."], [10, "l", 15, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "7 · Outcomes after RC", "<b>Pelvic recurrence</b>: low (≤pT2) 5–8%; intermediate (pT3–4, negative margins, ≥10 nodes) 15–21%; high (pT3–4 + positive margins or &lt;10 nodes) <span class=\"key\">39–46%</span>."], [10, "r", 16, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "8 · Neoadjuvant therapy", "Renal · GFR <span class=\"key\">&lt;60 mL/min</span> · CrCl &lt;30 mL/min"], [10, "l", 16, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "10 · Bladder preservation", "<b>Dose</b>: continuous to <span class=\"key\">60–66 Gy</span>, restage at 3–4 months (commonest); split course historical; <span class=\"key\">55 Gy in 20 fractions</span> non-inferior."], [10, "p", 16, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "10 · Bladder preservation", "TMT contains cystectomy rather than replacing it: salvage RC is the built-in safety net, so selection and lifelong cystoscopy decide success. Complete TUR cuts need for cystectomy (~11% vs 42%)."], [10, "a", 17, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "11 · Metastatic urothelial carcinoma", "<p>Platinum-eligible → GC/ddMVAC (or gemcitabine–carboplatin; or EV + pembrolizumab) → response/stable → avelumab maintenance → progression → pembrolizumab, or erdafitinib if FGFR-altered → EV → sacituzumab govitecan. Platinum-ineligible → pembrolizumab → EV.</p>"], [10, "l", 18, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "12 · Follow-up", "<b>After bladder preservation</b>: cystoscopy 3–4-monthly years 1–2, 6-monthly years 3–4, yearly to <span class=\"key\">10 years</span>; CTU + chest CT 3–6-monthly 2 years, yearly to 5."], [10, "l", 19, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "2 · Transurethral resection of bladder tumour (TURBT)", "Upper tracts: CTU, MRI, or ultrasound + retrograde. Iodinated contrast if GFR <span class=\"key\">≥60</span> mL/min; gadolinium if GFR <span class=\"key\">&gt;30</span>."], [10, "a", 19, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "2 · Transurethral resection of bladder tumour (TURBT)", "<p>Lithotomy → antibiotic within 1 h (avoid fluoroquinolones) → 30° lens (urethra, orifices) → 70° (bladder neck, dome, anterior wall) → 120° if incomplete → map → blue-light/NBI if available (more tumours, less recurrence; CIS)</p>"], [10, "l", 19, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "2 · Transurethral resection of bladder tumour (TURBT)", "Remove all visible tumour with <b>detrusor in specimen</b>; loop, cutting current; <span class=\"key\">~2 cm</span> margin of normal tissue where possible."], [10, "p", 20, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "2 · Transurethral resection of bladder tumour (TURBT)", "Perforation can follow adequate resection of advanced tumour; it <b>rules out immediate intravesical chemotherapy</b> (extravesical leak)."], [10, "l", 20, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "2 · Transurethral resection of bladder tumour (TURBT)", "Single mitomycin C/epirubicin <span class=\"key\">within 24 h</span>: ~<span class=\"key\">13%</span> absolute fall in recurrence (meta-analysis). Gemcitabine 2 g (S0337): 12% at 4 years, no grade 4–5 toxicity."], [10, "l", 20, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "2 · Transurethral resection of bladder tumour (TURBT)", "<b>BCG never immediately</b>: wait <span class=\"key\">2–4 weeks</span>, no gross haematuria (<span class=\"dag\">†</span> systemic absorption)."], [10, "l", 20, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "3 · Radical cystectomy: preparation", "<b>VTE prophylaxis</b>: compression + pharmacological from <b>before induction</b>; extend <span class=\"key\">4 weeks</span> (28 vs 8 days → fewer major VTE, no extra bleeding). Enoxaparin standard; apixaban equally effective, better compliance."], [10, "a", 20, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "4 · Open radical cystectomy: technique", "<p>Lower midline → Retzius → urachus divided; peritoneum incised lateral to medial umbilical ligaments → vas/round ligament divided → caecum, small-bowel root, left Toldt mobilised → <b>retrosigmoid window</b> (left ureter) → retractor (check vena cava) → ureters freed with adventitia, obliterated umbilical artery divided for length, ureters divided → PLND → vesical pedicles stapled/clipped/sealed</p>"], [10, "a", 20, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "4 · Open radical cystectomy: technique", "<p>Peritoneum over seminal vesicles incised → rectum separated, Denonvilliers incised → posterior pedicles → endopelvic fascia → dorsal venous complex ligated → urethra divided</p>"], [10, "a", 21, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "4 · Open radical cystectomy: technique", "<p>Ovarian vessels ligated → posterior fornix incised → pedicles → urethra excised from above or introitus → <b>clamshell vaginal closure</b> (keeps girth, loses length), watertight 2-0 polyglactin → pack out day 2</p>"], [10, "l", 21, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "5 · Pelvic lymphadenectomy", "Protect obturator nerve; seal lymphatics. <span class=\"key\">≥10 nodes</span> → better survival (NMIBC at RC: &gt;20)."], [10, "a", 21, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "6 · Partial cystectomy", "<p>PLND → cystotomy away from tumour → full-thickness excision with fat, 1–2 cm frozen-section margin → reimplant ureter if needed → 2–3-layer watertight closure → warm water irrigation (seeding) → drain → cystogram day 7, remove catheter</p>"], [10, "p", 22, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "7 · Robotic radical cystectomy (RARC)", "No effective salvage exists: urine spillage, poor PLND or positive soft-tissue margin → near-uniformly fatal recurrence, so robotics is judged on oncology first."], [10, "a", 22, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "7 · Robotic radical cystectomy (RARC)", "<p>Sigmoid released → presacral plane → cul-de-sac/prostate apex → Retzius → anterior pedicle → ureters freed (<b>never grasp</b>) → <b>extended PLND with ureters intact</b> → ureters clipped, margin sent, left ureter under sigmoid → posterior pedicles → DVC → urethra (clip proximally only if neobladder)</p>"], [10, "l", 23, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "1 · Surgical anatomy", "<b>Small bowel</b> ~22 ft: proximal 2/5 jejunum (wider, single arcades, thin mesentery), distal 3/5 ileum (multiple arcades). Do not rely on more than <span class=\"key\">8 cm</span> of bowel surviving away from a straight vessel → clear ≤8 cm of mesentery at a segment end."], [10, "p", 23, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "1 · Surgical anatomy", "Watershed zones are fed by the smallest terminal branches of two arteries → ischaemic first in hypotension/embolism → site anastomoses to one side."], [10, "l", 23, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "2 · Segment selection", "<b>B12</b>: liver stores last <span class=\"key\">3–5 yr</span>; clinical deficiency rare; markers homocysteine, methylmalonic acid; empirical parenteral B12 after 5–7 yr of ileal diversion."], [10, "l", 24, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "3 · Bowel preparation and enhanced recovery", "Oral antibiotics cut concentration to ~10<sup>2</sup>/g; descending colon <span class=\"key\">10<sup>10–12</sup>/g</span>. Kanamycin = best single agent."], [10, "l", 24, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "4 · Intestinal anastomoses", "<b>Ogilvie syndrome</b>: dilated caecum; water-soluble enema excludes obstruction; caecum <span class=\"key\">&gt;12 cm</span> or rising white count → neostigmine/colonoscopic decompression; surgery for ischaemia, peritonitis, refractory."], [10, "p", 25, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "5 · Ureterointestinal anastomoses", "Conduit pressure is damped by ureteric peristalsis. Reflux harms the kidney only with impaired peristalsis plus infection or obstruction. Antireflux tunnels stricture more and do not stop colonisation → stented refluxing anastomosis is default; reflux allows loopogram imaging of upper tracts."], [10, "l", 25, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "5 · Ureterointestinal anastomoses", "Open reanastomosis most durable; endoincision ~50–60% at 2 yr; balloon not durable. Poor endourology: stricture &lt;1 yr post-op, <span class=\"key\">≥1.5 cm</span>, left-sided. Metal stents only for limited life expectancy."], [10, "a", 25, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "6 · Conduit diversion", "<p>Segment <span class=\"key\">10–15 cm</span>, 10–15 cm from ileocaecal valve → keep major arcade, windows ~5 cm → ileoileostomy, segment caudal → close mesenteric window → flush → left ureter behind sigmoid mesentery → stented anastomoses → fix base retroperitoneally, RLQ → stoma</p>"], [10, "r", 26, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "8 · Renal function", "Creatinine + urine protein · <span class=\"key\">&lt;2.0 mg/dL</span>, no proteinuria"], [10, "r", 26, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "8 · Renal function", "GFR · <span class=\"key\">&gt;35 mL/min</span>"], [10, "r", 26, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "8 · Renal function", "Ammonium chloride load · Urine pH <span class=\"key\">≤5.8</span>"], [10, "r", 26, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "8 · Renal function", "Water deprivation · Osmolality <span class=\"key\">≥600 mOsm/kg</span>"], [10, "p", 27, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "9 · Metabolic complications", "Stomach secretes HCl (alkalosis, low Cl); jejunum secretes NaCl (low Na, Cl; high K); ileum/colon absorb NH<sub>4</sub>Cl (high Cl). <b>Only jejunum is hyperkalaemic</b>."], [10, "l", 27, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "9 · Metabolic complications", "<b>Gastric alkalosis</b>: usually trivial; severe with renal failure/dehydration (vomiting → aldosterone ↑ → bicarbonate retained). <b>Gastrin</b> above <span class=\"key\">120 ng/L</span>: small rises → large bicarbonate rises; distension stimulates gastrin. Rehydrate + H2 blocker → arginine HCl if life-threatening → omeprazole → remove segment."], [10, "l", 27, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "9 · Metabolic complications", "<b>Ureterosigmoidostomy</b>: 6–29% (mean 11%) after <span class=\"key\">10–20 yr</span>; defunctioned anastomoses still develop cancer → <b>excise, do not ligate</b>."], [10, "p", 29, "Ch 134 · Continent Urinary Diversion", "1 · Definition and basic principles", "Continence is a pressure balance: low reservoir pressure (detubularisation) against adequate outlet resistance (sphincter or efferent valve). Failure of either → leakage. Camey I (tubular ileum) failed because its pressure was too high."], [10, "a", 29, "Ch 134 · Continent Urinary Diversion", "2 · Patient selection", "<p>eGFR &gt;40 → intact external sphincter → adequate bowel → not frail/no severe liver, cardiac or psychological disease → men: no cancer at distal prostatic urethra; women: no palpable anterior vaginal tumour or cervical invasion → willing to self-catheterise → offer orthotopic</p>"], [10, "l", 30, "Ch 134 · Continent Urinary Diversion", "2 · Patient selection", "<b>Renal function</b> — key contraindication: creatinine &lt;<span class=\"key\">1.7–2.2 mg/dL</span> or eGFR &gt;<span class=\"key\">35–40 mL/min</span>. eGFR 40–59 is safe (decline no faster than conduit); obstructive uraemia often reverses. All: hydration, avoid nephrotoxins, oral bicarbonate. <span class=\"xref\">→ Ch 133</span>"], [10, "a", 30, "Ch 134 · Continent Urinary Diversion", "3 · Preserving continence at cystectomy", "<p>Endopelvic fascia → slightly incise puboprostatic ligaments → ligate DVC close to apex → incise anterior urethra → place sutures → posterior sutures through rectourethralis → divide posterior urethra → tag until after ureteroenteric anastomosis</p>"], [10, "a", 31, "Ch 134 · Continent Urinary Diversion", "3 · Preserving continence at cystectomy", "<p>Posterior pedicles → plane off anterior vagina → Foley balloon marks junction → free bladder neck and first 0.5 cm urethra → clamp bladder neck → divide just distal → frozen section</p>"], [10, "l", 31, "Ch 134 · Continent Urinary Diversion", "4 · Choice of bowel and ureteric reflux", "<b>Antireflux unnecessary</b>: Valsalva raises pressure equally; every valve can obstruct. Direct (Wallace/Leadbetter) stricture <span class=\"key\">3–6%</span> vs Le Duc 7–29%. <b>Obstruction, not reflux, destroys kidneys.</b> Kock nipple failures are late (&gt;10 yr), silent until bilateral hydronephrosis."], [10, "a", 31, "Ch 134 · Continent Urinary Diversion", "5 · Orthotopic neobladder designs", "<p><b>Studer:</b> ileum 15–20 cm proximal to ileocaecal valve → discard ~5 cm proximally → 40–44 cm reservoir (two 20–22 cm limbs) + afferent limb → open, oversew back wall → fold opposite way → stented end-to-side ureteroileal → urethral anastomosis at dependent point</p>"], [10, "p", 31, "Ch 134 · Continent Urinary Diversion", "5 · Orthotopic neobladder designs", "Hautmann vs Studer = capacity trade-off: bigger initial pouch is continent sooner but empties worse and absorbs more later."], [10, "l", 32, "Ch 134 · Continent Urinary Diversion", "7 · Perioperative care", "<b>Drainage</b>: 7 Fr single-J stents + 24 Fr urethral catheter, irrigated for mucus; catheter out at <span class=\"key\">3 weeks</span>; pouchogram only if drain output significant. Then timed voids, lengthened progressively, + pelvic floor exercises. Robotic <span class=\"xref\">→ Ch 135</span>."], [10, "l", 32, "Ch 134 · Continent Urinary Diversion", "8 · Results and complications", "Day continence over <b>3–6 months</b>, ultimately <span class=\"key\">80–90%</span>; night lags into year 2, persistent nocturnal incontinence <span class=\"key\">20–50%</span>. Risk: age &gt;65, colon, diabetes, no nerve sparing, hysterectomy."], [10, "p", 33, "Ch 134 · Continent Urinary Diversion", "8 · Results and complications", "Men fail by <b>leaking</b> (sphincter without reflexes) → augment sphincter. Women fail by <b>not emptying</b> (unsupported pouch kinks) → support the pouch."], [10, "l", 34, "Ch 135 · Minimally Invasive Urinary Diversion", "1 · Context", "IRCC: ICUD rose ≈<span class=\"key\">11%/year</span>, driven by <b>ileal conduit</b> (commonest robotic diversion)."], [10, "r", 34, "Ch 135 · Minimally Invasive Urinary Diversion", "2 · Patient selection", "Neobladder (absolute) · Urethral involvement distal to prostate; creatinine <span class=\"key\">&gt;2 mg/dL</span>; poor hepatic function — as open"], [10, "a", 34, "Ch 135 · Minimally Invasive Urinary Diversion", "2 · Patient selection", "<p>Pasadena Consensus learning pathway: RARC + extracorporeal diversion → intracorporeal conduit (≈30–100 cases) → continent (≈25–50 cases). Target time: <span class=\"key\">≤4 h conduit, ≤5 h neobladder</span>.</p>"], [10, "r", 34, "Ch 135 · Minimally Invasive Urinary Diversion", "3 · Perioperative bundle", "Thromboprophylaxis · Pneumatic compression + stockings; LMWH before and up to <span class=\"key\">4 weeks</span> after"], [10, "r", 34, "Ch 135 · Minimally Invasive Urinary Diversion", "3 · Perioperative bundle", "Antibiotics · Broad-spectrum IV within <span class=\"key\">1 h</span>"], [10, "r", 35, "Ch 135 · Minimally Invasive Urinary Diversion", "5 · Nerve sparing", "Sphincter · One-third overlapped by DVC; dorsal penile nerve branches within <span class=\"key\">3 mm</span> of apex · Mainly mid–distal third; continence survives loss of bladder neck"], [10, "a", 35, "Ch 135 · Minimally Invasive Urinary Diversion", "6 · Intracorporeal ileal conduit", "<p>Left ureter under sigmoid mesentery to right → 12 cm ileum, 15–20 cm from ileocaecal valve → marionette stitch → isolate with 45-mm stapler → ureteroileal anastomoses (left first) + stents → bowel reanastomosis → stoma.</p>"], [10, "a", 36, "Ch 135 · Minimally Invasive Urinary Diversion", "7 · Intracorporeal neobladder", "<p>Urethral anastomosis (Van Velthoven barbed suture) → detubularise distal 40 cm (cold scissors) → posterior plate → ureters to afferent limb/chimney, stented → close anterior wall after 22-Fr catheter confirmed.</p>"], [10, "a", 36, "Ch 135 · Minimally Invasive Urinary Diversion", "7 · Intracorporeal neobladder", "<p>Mobilise right colon → divide ileum 15 cm from ileocaecal junction and transverse colon proximal to middle colic → restore ileocolic continuity immediately → detubularise along anterior taenia, fold → ureters through posterior plate, double-J; 24-Fr caecostomy via appendiceal stump → taper ileum over 14 Fr, imbricate valve → umbilical stoma.</p>"], [10, "p", 36, "Ch 135 · Minimally Invasive Urinary Diversion", "7 · Intracorporeal neobladder", "Capacity from detubularised right colon; continence from tapered ileum + imbricated ileocaecal valve."], [10, "r", 36, "Ch 135 · Minimally Invasive Urinary Diversion", "8 · Postoperative care", "Neobladder catheter · <span class=\"key\">3–4 weeks</span>, after leak-free pouchogram"], [10, "l", 36, "Ch 135 · Minimally Invasive Urinary Diversion", "9 · Outcomes", "<b>Operative time</b> = quality measure; strongest determinant diversion type (conduit ≈70 min shorter); ICUD ≈ ECUD time. Proficiency ≥<span class=\"key\">66 RARCs</span>."], [10, "p", 37, "Ch 135 · Minimally Invasive Urinary Diversion", "9 · Outcomes", "Night continence is worse because the urethrosphincteric guarding reflex is inactive in deep sleep → continence depends on reservoir capacity (detubularisation, nerve/sphincter preservation, night alarm, limit nocturnal output). Assess at 6–12 months."], [10, "p", 38, "Ch 124 · Bladder Surgery for Benign Disease", "1 · Surgical anatomy essentials", "Three landmarks organise every benign bladder operation: Retzius for access, the peritoneal reflection for the posterior bladder, the distal ureter for safety — they decide whether surgery stays extraperitoneal."], [10, "p", 38, "Ch 124 · Bladder Surgery for Benign Disease", "1 · Surgical anatomy essentials", "Common aftercare: watertight <b>two-layer 2-0 polyglactin</b> closure (mucosa, then seromuscular), leak test, large-bore Foley ≈ <span class=\"key\">1 week</span>, self-suction drain out at ≈ <span class=\"key\">48 h</span> if output low, <b>cystogram before catheter removal</b>. High drain output → drain creatinine above serum = urine leak."], [10, "l", 39, "Ch 124 · Bladder Surgery for Benign Disease", "2 · Bladder diverticula", "Treat the cause at the same sitting: transurethral prostate surgery, or simple prostatectomy for glands <span class=\"key\">&gt;80 cc</span>; augmentation for neurogenic bladder. <b>Endoscopic outlet surgery first</b> — later irrigation would disrupt fresh suture lines."], [10, "a", 39, "Ch 124 · Bladder Surgery for Benign Disease", "2 · Bladder diverticula", "<p>Open intravesical: ASIS at table break → 18 Fr Foley, fill ≈200 mL → lower midline, split recti, incise transversalis fascia → sweep peritoneum off dome → vertical cystotomy, 2-0 stays → identify orifices (5 Fr ureteral catheter if concern) → excise sac → 20–22 Fr Foley, two-layer closure, leak test → optional suprapubic catheter → pelvic drain.</p>"], [10, "r", 39, "Ch 124 · Bladder Surgery for Benign Disease", "2 · Bladder diverticula", "Delivery · Allis clamp everts sac; or sac dissected from pseudocapsule from inside; mucosal incision ≈ <span class=\"key\">0.5 cm</span> round neck · Finger in sac pushes it out; extravesical neck incised circumferentially"], [10, "l", 39, "Ch 124 · Bladder Surgery for Benign Disease", "2 · Bladder diverticula", "Lithotomy, steep Trendelenburg; cystoscopy first. Pneumoperitoneum <span class=\"key\">15 mm Hg</span>; assistant port contralateral to sac."], [10, "a", 39, "Ch 124 · Bladder Surgery for Benign Disease", "2 · Bladder diverticula", "<p>Asymptomatic leak → keep Foley and drain → symptomatic collection → percutaneous drain → cystogram before removal → persistent → nephrostomies vs exploration and closure.</p>"], [10, "p", 40, "Ch 124 · Bladder Surgery for Benign Disease", "2 · Bladder diverticula", "Diverticulectomy is a dissection problem: find the sac, stay in the sac–pseudocapsule plane, keep the ureter in view, close the seromuscular defect securely — and fix the outlet first."], [10, "l", 40, "Ch 124 · Bladder Surgery for Benign Disease", "3 · Bladder stones, foreign bodies and fistulae", "<b>Percutaneous</b>: 1-cm incision two fingerbreadths above symphysis → needle under ultrasound/cystoscopic vision → dilate to <span class=\"key\">30 Fr</span> sheath → 24–26 Fr nephroscope; stones &lt;1 cm grasped intact, larger fragmented. Suprapubic catheter clamped at 24–48 h."], [10, "l", 40, "Ch 124 · Bladder Surgery for Benign Disease", "3 · Bladder stones, foreign bodies and fistulae", "<b>Transvesical laparoscopy</b>: pneumovesicum <span class=\"key\">8–12 mm Hg</span>; avoids peritoneum; suits eroded mesh. Transperitoneal laparoscopic/robotic cystolithotomy allows simultaneous prostatectomy or diverticulectomy. Aftercare: Foley ≈1 week, cystogram."], [10, "l", 41, "Ch 124 · Bladder Surgery for Benign Disease", "4 · Partial cystectomy for benign disease and urachal surgery", "Full-thickness excision with ≈ <span class=\"key\">2-cm margin</span> if capacity allows; frozen-section margins; reimplant if orifice involved; 22 Fr Foley, two-layer closure, drain. Minimally invasive: flexible cystoscopic transillumination or laparoscopic ultrasound to outline the margin; ureteral catheter protects ureter."], [10, "p", 41, "Ch 124 · Bladder Surgery for Benign Disease", "4 · Partial cystectomy for benign disease and urachal surgery", "Leiomyoma, paraganglioma and endometriosis infiltrate and recur after incomplete excision, so benign partial cystectomy borrows cancer discipline (exclude cancer, no spillage, margin). Urachal surgery is the exception: the whole tract matters, not a wide margin."], [10, "p", 42, "Ch 124 · Bladder Surgery for Benign Disease", "6 · Ureteral reimplantation in adults", "Refluxing is acceptable in adults: VUR is rarely the indication, and refluxing anastomoses show no faster renal decline, more stenosis or more infection than tunnelled ones, while needing less ureter and less bladder mobilisation."], [10, "r", 42, "Ch 124 · Bladder Surgery for Benign Disease", "6 · Ureteral reimplantation in adults", "Tunnel · <span class=\"key\">3–5 × ureteric diameter</span> (5:1 robotically) · None"], [10, "l", 43, "Ch 124 · Bladder Surgery for Benign Disease", "6 · Ureteral reimplantation in adults", "Full-thickness ureteric sutures, mucosa plus some detrusor on bladder, knots outside lumen. Stent: <span class=\"key\">6 Fr × 26–28 cm double-J</span>."], [10, "l", 43, "Ch 124 · Bladder Surgery for Benign Disease", "6 · Ureteral reimplantation in adults", "Primary reimplant for defects up to <span class=\"key\">4 cm</span>; longer → psoas hitch/Boari; renal descent adds up to <span class=\"key\">5 cm</span>. More bladder reach: divide contralateral medial umbilical ligament, free peritoneum off dome, ligate contralateral pedicle."], [10, "l", 43, "Ch 124 · Bladder Surgery for Benign Disease", "6 · Ureteral reimplantation in adults", "Aftercare: Foley 1 week with cystogram; stent <span class=\"key\">≈6 weeks</span>."], [10, "p", 43, "Ch 124 · Bladder Surgery for Benign Disease", "6 · Ureteral reimplantation in adults", "Reimplantation fails from ischaemia or tension. Every rule (preserve adventitia, spatulate, enter superior-medial toward the bladder neck, bridge rather than stretch) prevents one or the other. The robot mainly eases intracorporeal suturing."], [10, "r", 43, "Ch 124 · Bladder Surgery for Benign Disease", "7 · Bridging distal ureteral defects", "<b>Boari flap</b> · Up to <span class=\"key\">15 cm</span> · Base ≥<span class=\"key\">4 cm</span>, apex ≥<span class=\"key\">3 cm</span>, length:base ≤<span class=\"key\">3:1</span>"], [10, "p", 44, "Ch 124 · Bladder Surgery for Benign Disease", "7 · Bridging distal ureteral defects", "The bladder is the donor tissue: hitch first, flap second — every flap rule (base width, 3:1, measure empty) protects the flap's blood supply and bladder capacity."], [10, "r", 44, "Ch 124 · Bladder Surgery for Benign Disease", "8 · Enterocystoplasty (augmentation)", "<b>Ileum</b> (commonest) · 25 cm taken <span class=\"key\">≈20 cm</span> proximal to ileocaecal valve (spares B12/bile salts); acidosis risk"], [10, "a", 44, "Ch 124 · Bladder Surgery for Benign Disease", "8 · Enterocystoplasty (augmentation)", "<p>Isolate ileum, check reach to dome → transilluminate mesentery, staple, broad mesenteric base → side-to-side anastomosis, close window → <b>detubularise</b> on antimesenteric border, fold into U → <b>bivalve bladder widely</b> → wide-mouthed anastomosis → suprapubic tube ± Foley → leak test, drain.</p>"], [10, "l", 44, "Ch 124 · Bladder Surgery for Benign Disease", "8 · Enterocystoplasty (augmentation)", "Stones commonest long-term complication. Neoplasia → surveillance endoscopy from <span class=\"key\">10 years</span>. Irrigation may reduce mucus. Routine metabolic/vitamin bloods. Long-term continence and satisfaction high, but secondary procedures often needed."], [10, "p", 45, "Ch 124 · Bladder Surgery for Benign Disease", "8 · Enterocystoplasty (augmentation)", "Augmentation exchanges a pressure problem for a lifelong bowel-in-bladder problem: detubularisation and a wide-mouthed anastomosis win the pressure battle; catheterisation, irrigation, bloods and endoscopic surveillance pay the price."], [10, "a", 45, "Ch 124 · Bladder Surgery for Benign Disease", "9 · Continent catheterisable channels", "<p>Minimally invasive appendicovesicostomy: detach appendix with caecal cuff → spatulate → ≈4-cm submucosal detrusor tunnel → anastomose with 4-0 polydioxanone → stoma right lower quadrant or umbilicus; bladder drained <span class=\"key\">2–4 weeks</span>; continence <span class=\"key\">&gt;95%</span>.</p>"], [10, "p", 45, "Ch 124 · Bladder Surgery for Benign Disease", "9 · Continent catheterisable channels", "Use the appendix when present and long enough; reconfigure ileum when not. Continence comes from tunnel length through detrusor; missed catheterisation risks the bladder, not just the channel."], [10, "r", 46, "★ Putting it together", "C · Choosing the diversion → Ch 133–135", "Must have · Usable (non-irradiated) ileum · eGFR <span class=\"key\">&gt;35–40</span>; intact sphincter; negative urethral frozen section; will catheterise · eGFR &gt;35–40; dexterity; efferent limb (appendix, tapered ileum)"], [10, "a", 47, "★ Putting it together", "E · Metastatic urothelial carcinoma", "<p><b>1. Fitness</b>: cisplatin-, platinum-only or platinum-ineligible.</p>\n<p><b>2. First line</b>: EV + pembrolizumab (EV-302); else gem–cis (gem–carbo if cisplatin-ineligible).</p>\n<p><b>3. Non-progression on platinum</b>: avelumab maintenance (JAVELIN Bladder 100).</p>\n<p><b>4. Later</b>: pembrolizumab; erdafitinib (FGFR-altered); EV; sacituzumab govitecan. Platinum-ineligible: pembrolizumab first. <span class=\"xref\">→ Ch 131</span></p>"], [11, "l", 2, "Ch 136 · Benign Renal Tumours", "1 · The benign small renal mass", "Up to <span class=\"key\">~25%</span> of surgically treated small renal masses (SRMs) are benign."], [11, "l", 2, "Ch 136 · Benign Renal Tumours", "2 · Renal cysts and the Bosniak classification", "<b>Simple cyst</b>: any size, homogeneous, <span class=\"key\">≤20 Hounsfield units (HU)</span> → no further imaging. Otherwise → Bosniak."], [11, "r", 2, "Ch 136 · Benign Renal Tumours", "2 · Renal cysts and the Bosniak classification", "I · Thin (<span class=\"key\">≤2 mm</span>) smooth wall (may enhance); simple fluid; no septa or calcification · Benign · No follow-up"], [11, "r", 2, "Ch 136 · Benign Renal Tumours", "2 · Renal cysts and the Bosniak classification", "II · Thin wall plus (a) <span class=\"key\">≤3</span> thin enhancing septa, any calcification; or (b) homogeneous marked T2 hyperintensity; or (c) marked T1 hyperintensity · Highly likely benign · No follow-up"], [11, "r", 2, "Ch 136 · Benign Renal Tumours", "2 · Renal cysts and the Bosniak classification", "IIF · Minimally thickened (<span class=\"key\">3 mm</span>) enhancing wall/septum, or <span class=\"key\">≥4</span> thin septa; or heterogeneous T1 hyperintensity on fat-saturated MRI · Likely benign · Active surveillance up to <span class=\"key\">5 yr</span>"], [11, "r", 2, "Ch 136 · Benign Renal Tumours", "2 · Renal cysts and the Bosniak classification", "III · Enhancing thick (<span class=\"key\">≥4 mm</span>) or irregular (≤3 mm obtuse-margined protrusion) wall/septum · <span class=\"key\">~50%</span> · ≤2 cm: surveillance preferred; 2–4 cm: surveillance or excision (shared decision); &gt;4 cm: excision, partial (PN) over radical nephrectomy (RN) when feasible"], [11, "r", 2, "Ch 136 · Benign Renal Tumours", "2 · Renal cysts and the Bosniak classification", "IV · Enhancing nodule: ≥4 mm obtuse-margined, or any-size acute-margined protrusion · <span class=\"key\">~90%</span>"], [11, "p", 2, "Ch 136 · Benign Renal Tumours", "2 · Renal cysts and the Bosniak classification", "Ladder: wall ≤2 → 3 → ≥4 mm → irregular → nodule. Traps: any calcification fits II; I wall may enhance; large hyperdense cysts no longer IIF; I/II growth not malignant."], [11, "p", 2, "Ch 136 · Benign Renal Tumours", "2 · Renal cysts and the Bosniak classification", "<b>Why surveil small III/IV?</b> III has low PPV; cystic RCC indolent (mostly fluid, size predicts poorly; proposed <b>pT1c</b>) → very high number needed to treat."], [11, "l", 2, "Ch 136 · Benign Renal Tumours", "2 · Renal cysts and the Bosniak classification", "ACKD: cysts from proximal tubule; <span class=\"key\">80%</span> by 10 yr of dialysis; RCC risk <span class=\"key\">≥10×</span> (multifocal, bilateral, papillary commoner; distinct WHO 2022 entity)."], [11, "l", 3, "Ch 136 · Benign Renal Tumours", "2 · Renal cysts and the Bosniak classification", "ADPKD: RCC not commoner but earlier, sarcomatoid, harder to diagnose. PKD1 relatives 15–29: <span class=\"key\">≥3 cysts</span>; normal scan excludes only from age 40. Cyst infection: FDG-PET."], [11, "p", 3, "Ch 136 · Benign Renal Tumours", "3 · Oncocytoma", "<b>Why can a core not clear oncocytoma?</b> Sampling error; chRCC has oncocytic areas — a minority of biopsy \"oncocytomas\" are RCC. EAU: no definitive core diagnosis; CK7 and cytogenetics help."], [11, "a", 3, "Ch 136 · Benign Renal Tumours", "4 · Angiomyolipoma", "<p><b>Spontaneous retroperitoneal haemorrhage</b> (Wunderlich<span class=\"dag\">†</span>) → resuscitate → <b>SAE</b> → nephrectomy only if SAE unavailable/unsuitable</p>\n<p><b>Symptomatic</b> (pain, haematuria, barriers to care) → SAE → NSS or RN → ablation in selected cases</p>\n<p><b>Asymptomatic sporadic</b>: &gt;<span class=\"key\">6 cm</span>, aneurysm <span class=\"key\">≥5 mm</span>, growth &gt;<span class=\"key\">0.25 cm/yr</span>, childbearing age/pregnancy → treat; otherwise surveil</p>\n<p><b>TSC</b>: &gt;<span class=\"key\">3 cm</span> or growing → everolimus first line; SAE or kidney-sparing resection second</p>"], [11, "p", 3, "Ch 136 · Benign Renal Tumours", "4 · Angiomyolipoma", "<b>Why abandon 4 cm?</b> Poorly specific → overtreatment. &lt;4 cm → surveil; observed ≥4 cm → CT angiography for aneurysm. \"Barriers to care\": surveillance needs access to imaging/emergency care. Pregnancy → treat before conception."], [11, "l", 3, "Ch 136 · Benign Renal Tumours", "5 · Other benign epithelial and mesenchymal tumours", "<b>Papillary adenoma</b>: unencapsulated, <span class=\"key\">≤15 mm</span>; shares +7, +17, −Y with papillary RCC; cannot metastasise; acceptable in donor kidney."], [11, "r", 4, "Ch 136 · Benign Renal Tumours", "6 · Landmark trial", "EXIST-2 · Phase III RCT, everolimus vs placebo, TSC/LAM AML · ≥50% volume reduction <span class=\"key\">42% vs 0%</span>; no bleeding needing embolisation · Approved; mTOR inhibition first line in TSC"], [11, "p", 5, "Ch 137 · Malignant Renal Tumours", "2 · Classification & pathology", "Trap: epithelioid AML is malignant; classic AML, papillary adenoma, oncocytoma benign. Papillary type 1/2 split <b>abandoned</b> — \"type 2\" was several diseases (MET-altered, MiT translocation, FH-deficient) with different prognoses → WHO moved to molecular definitions."], [11, "p", 6, "Ch 137 · Malignant Renal Tumours", "2 · Classification & pathology", "Localised clear cell does worse than papillary/chromophobe (intrinsically aggressive), yet metastatic clear cell does better: VHL-driven angiogenesis and immunogenicity → responds to TKIs and immune checkpoint inhibitors (ICIs)."], [11, "a", 7, "Ch 137 · Malignant Renal Tumours", "3 · Molecular biology & hereditary syndromes", "<p>Normoxia: VHL + elongin B/C + cullin-2 + RBX1 = E3 ligase → HIF-1α/2α degraded</p>\n<p>VHL loss or hypoxia → <b>HIF-2α</b> + ARNT → ↑ VEGF, PDGF, TGF-α, GLUT1, EPO, CA-IX → hypervascular clear cell RCC</p>"], [11, "a", 8, "Ch 137 · Malignant Renal Tumours", "5 · Diagnosis", "<p>Simple cyst → observe</p>\n<p>Complex/solid: eGFR &gt;45 → CT or MRI with/without contrast · eGFR 30–45 → hydrate, same · eGFR &lt;30 → non-contrast CT or gadolinium MRI · contrast allergy → USG/contrast USG or MRI</p>\n<p>Fat → AML · complex cyst → Bosniak · solid enhancing → management options ± renal mass biopsy</p>"], [11, "p", 9, "Ch 137 · Malignant Renal Tumours", "6 · Staging & prognosis", "TNM limitation: stage is set by the single worst feature, so co-existing adverse features (e.g. adrenal invasion plus supradiaphragmatic thrombus) are lost — record all; use integrated nomograms."], [11, "p", 12, "Ch 137 · Malignant Renal Tumours", "10 · Other renal malignancies", "Non-RCC malignancies are almost all <b>hypovascular</b>; key decision is surgical (sarcoma, carcinoid) vs medical (lymphoma, metastasis — biopsy, don't resect). RCC nodes: interaortocaval (right), para-aortic (left); nodes elsewhere suggest lymphoma. A solitary enhancing mass years after organ-confined non-renal cancer is more likely primary RCC."], [11, "l", 14, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "1 · Epidemiology & risk factors", "UTUC = <span class=\"key\">5–10%</span> of urothelial cancers; Balkans <span class=\"key\">40%</span> of renal neoplasms. Bilateral ≤5%; multifocal <span class=\"key\">10–20%</span>; concomitant CIS 11–36%; concurrent bladder cancer <span class=\"key\">17%</span>. ~60% invasive, 7–9% metastatic at diagnosis."], [11, "l", 14, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "1 · Epidemiology & risk factors", "After UTUC: bladder recurrence <span class=\"key\">22–47%</span>, contralateral upper tract 2–6%."], [11, "p", 14, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "1 · Epidemiology & risk factors", "<b>Why UTUC presents invasive:</b> thin (mesodermal) muscle layer → reaches muscle, parenchyma or periureteric fat earlier than bladder tumours."], [11, "l", 14, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "1 · Epidemiology & risk factors", "<b>Smoking</b>: RR <span class=\"key\">2.5–7</span>, ureter &gt; pelvis; stopping &gt;10 yr cuts risk 60–70%. Occupational exposure ≈7 yr. Chronic infection/stones RR 1.5–2 (SCC). Iatrogenic: cyclophosphamide (acrolein), anthranoid laxatives &gt;1 yr, pelvic radiotherapy."], [11, "p", 14, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "1 · Epidemiology & risk factors", "All four behave as a <b>field disease</b> (multiple, bilateral recurrences) → kidney-sparing more attractive, but BEN patients often have renal insufficiency. Analgesic abuse history in 22% of pelvic and 11% of ureteric tumours."], [11, "l", 14, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "1 · Epidemiology & risk factors", "<b>Lynch</b>: UTUC risk ≈<span class=\"key\">14×</span>, ≈<span class=\"key\">75×</span> in MSH2. <b>EAU: screen at first interview</b> if age &lt;60, personal LS-spectrum cancer, FDR &lt;50 with LS cancer, or two FDRs with LS cancer → germline sequencing → surveillance for colorectal/endometrial cancer, family counselling. MMR loss on IHC → germline testing."], [11, "l", 14, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "2 · Pathology & molecular biology", "&gt;90% UC; variant histology ≈<span class=\"key\">25%</span> (squamous, glandular, sarcomatoid, micropapillary, neuroendocrine, lymphoepithelial) = aggressive; <b>micropapillary</b> independently adverse. CIS easily missed."], [11, "l", 14, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "2 · Pathology & molecular biology", "Ureteric inverted papilloma: malignancy ≈<span class=\"key\">18%</span> → follow ≥2 yr."], [11, "l", 15, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "3 · Diagnosis", "<b>CTU</b> first line (EAU prefers to MRU): sensitivity ≈<span class=\"key\">92%</span>, specificity ≈95%; filling defect 50–75%; misses flat lesions; UC ≈46 HU vs uric acid stone ≈100 HU. Hydronephrosis = invasive ureteric tumour in up to 80%."], [11, "p", 15, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "3 · Diagnosis", "<b>Why URS biopsy cannot stage:</b> small, shallow samples → Ta biopsy often T3 at resection. Stage is <b>inferred</b> from grade, appearance, hydronephrosis and cytology → kidney-sparing patients need intensive follow-up."], [11, "l", 15, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "5 · Prognosis & risk stratification", "Pre-op: age (never alone a reason to deny RNU), smoking, ASA/ECOG, obesity, low albumin, high NLR/CRP; <b>RNU within <span class=\"key\">12 wk</span></b> for invasive disease. Size <span class=\"key\">2 cm</span> best cut-off for ≥pT2."], [11, "p", 16, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "5 · Prognosis & risk stratification", "Every pre-op factor is a stand-in for invasion; one adverse feature = high risk. <b>Trap:</b> small, low-grade, unifocal tumour <b>with hydronephrosis is high risk</b>."], [11, "l", 16, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "6 · Recurrence patterns", "Upper tract after bladder cancer: 2–4%, late (median &gt;3 yr); 0.75–6.4% after cystectomy; ≈<span class=\"key\">30%</span> of BCG-treated bladder CIS (or cystectomised for BCG-refractory disease) develop UTUC. Risk: distal ureter/orifice tumour, multifocal/recurrent NMIBC, CIS, reflux."], [11, "p", 16, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "6 · Recurrence patterns", "<b>Asymmetric recurrence:</b> antegrade seeding → bladder recurrences common, early, monoclonal; field effect → multifocal tumours of different clones. Both operate."], [11, "a", 16, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "7 · Management overview & follow-up", "<p>Cystoscopy + CTU ± URS biopsy/cytology + contralateral function → LS screening → risk-stratify</p>\n<p><b>Low risk</b> → kidney-sparing (endoscopic or segmental) + intensive surveillance</p>\n<p><b>High risk</b> → RNU + bladder cuff ± LND, within 12 wk</p>\n<p><b>cN+</b> → systemic chemotherapy first → surgery if response</p>\n<p>After RNU → single intravesical chemotherapy dose → cystoscopic follow-up for all</p>"], [11, "p", 18, "Ch 139 · Surgical Management of Upper Urinary Tract Urothelial Tumours", "1 · Principles & patient selection", "Low grade ≠ automatic ablation: obstruction or multifocality makes an LG tumour unfavourable, where RNU keeps a role."], [11, "p", 18, "Ch 139 · Surgical Management of Upper Urinary Tract Urothelial Tumours", "1 · Principles & patient selection", "Two axes — tumour risk and renal reserve. High risk + adequate reserve → extirpation; low risk → preservation; imperative indications are where they conflict."], [11, "a", 18, "Ch 139 · Surgical Management of Upper Urinary Tract Urothelial Tumours", "1 · Principles & patient selection", "<p>Imaging suspicion → CT/MR urogram → endoscopy + biopsy + cytology → risk group + shared decision</p>\n<p>High risk + adequate GFR → RNU ± neoadjuvant chemotherapy · Low risk or poor GFR → kidney-sparing</p>"], [11, "l", 19, "Ch 139 · Surgical Management of Upper Urinary Tract Urothelial Tumours", "2 · Endoscopic (kidney-sparing) management", "<b>Grade</b> is the key selector and strongest recurrence predictor; HG results poor. AUA/SUO: tumours <span class=\"key\">&lt;1.5 cm</span>; caution ≥1.5 cm."], [11, "p", 19, "Ch 139 · Surgical Management of Upper Urinary Tract Urothelial Tumours", "2 · Endoscopic (kidney-sparing) management", "Does URS spread tumour? Prior ureteroscopy ↑ bladder recurrence (seeding), but pre-RNU URS has not ↑ metastasis. Mitigate with single post-op intravesical instillation."], [11, "l", 19, "Ch 139 · Surgical Management of Upper Urinary Tract Urothelial Tumours", "3 · Segmental ureterectomy", "Ipsilateral recurrence <span class=\"key\">33–55%</span>, mostly distal to the original site, lifelong."], [11, "a", 20, "Ch 139 · Surgical Management of Upper Urinary Tract Urothelial Tumours", "4 · Positive cytology & carcinoma in situ (CIS)", "<p>Positive voided cytology → repeat → CT urogram + bladder biopsies → bladder positive: treat bladder</p>\n<p>Persistent positive, negative bladder (or after BCG \"6+1\") → selective upper-tract cytology + RPG + prostatic urethral biopsy (men) + URS</p>"], [11, "l", 20, "Ch 139 · Surgical Management of Upper Urinary Tract Urothelial Tumours", "6 · Radical nephroureterectomy", "Remove <b>entire intramural ureter and orifice</b>: retained stump recurs in <span class=\"key\">30–75%</span>, can't be surveyed, worsens survival. After bowel diversion, excise ureteroenteric anastomosis with bowel cuff."], [11, "p", 21, "Ch 139 · Surgical Management of Upper Urinary Tract Urothelial Tumours", "6 · Radical nephroureterectomy", "Principle beats approach: port-site seeding and carcinomatosis follow spillage, not the approach."], [11, "l", 21, "Ch 139 · Surgical Management of Upper Urinary Tract Urothelial Tumours", "7 · Perioperative adjuncts", "<b>Renal function is the hinge</b> → platinum <b>before</b> nephrectomy. Neoadjuvant favoured if post-op CrCl expected <span class=\"key\">&lt;50</span> mL/min; EA8141: CrCl &gt;50 → accelerated MVAC ×4. Adjuvant (POUT): gemcitabine–cisplatin (CrCl &gt;50) or –carboplatin (30–49); cisplatin preferred. cN+ → chemotherapy, then consolidative surgery."], [11, "r", 22, "Ch 139 · Surgical Management of Upper Urinary Tract Urothelial Tumours", "10 · Landmark trials", "POUT · Phase III adjuvant platinum vs surveillance, pT2–4/N+ · Stopped early; DFS HR <span class=\"key\">0.45</span>; 3-yr DFS 71% vs 46% · Adjuvant platinum standard after RNU for ≥pT2/N+"], [11, "l", 23, "Ch 141 · Contemporary Open Surgery of the Kidney", "1 · Role & preoperative work-up", "GFR <span class=\"key\">&lt;60</span> or significant proteinuria → perioperative nephrology consult; optimise diabetes/hypertension even if GFR ≥60."], [11, "l", 23, "Ch 141 · Contemporary Open Surgery of the Kidney", "1 · Role & preoperative work-up", "Contrast generally safe if GFR <span class=\"key\">&gt;30</span>. Suspected thrombus → MR or CT venography <b>≤1 month old</b> (rapid propagation)."], [11, "l", 23, "Ch 141 · Contemporary Open Surgery of the Kidney", "2 · Surgical anatomy & approaches", "<b>SMA</b>: anterior aorta <span class=\"key\">1–2 cm above LRV</span>, veers left → mistaken for left renal artery."], [11, "a", 24, "Ch 141 · Contemporary Open Surgery of the Kidney", "4 · Radical nephrectomy", "<p><b>Right:</b> survey abdomen → Toldt, iliac → hepatic flexure → Kocher → IVC → loop and palpate renal vein → artery behind vein → <b>artery then vein</b> → kidney outside Gerota's.</p>\n<p><b>Difficult hilum:</b> interaortocaval artery ligation → kidney decompresses → flaccid vein checked, double-ligated (0 silk + 3-0 Prolene) → lateral artery divided. Or: lower pole → ureter and gonadal vein → divide ureter → lift kidney posterior to anterior to show artery.</p>\n<p><b>Left:</b> Toldt splenic flexure → iliac → renocolic ligament (pad pancreas) → aorta leads to LRV; gonadal vein leads up to it → artery above/behind LRV → 0 silk + 3-0 Prolene, confirm occlusion → vein.</p>"], [11, "p", 25, "Ch 141 · Contemporary Open Surgery of the Kidney", "4 · Radical nephrectomy", "<b>Why artery first?</b> Vein first leaves kidney engorged and collaterals bleed. Arterial ligation shrinks the kidney and softens the vein so it can be checked for thrombus. Persisting pulse = accessory artery, incomplete control, or SMA tied."], [11, "l", 25, "Ch 141 · Contemporary Open Surgery of the Kidney", "4 · Radical nephrectomy", "<b>Adrenalectomy</b> only for upper-pole tumour with lost plane, adrenal mass, diffuse involvement. Metastasis <span class=\"key\">&lt;5%</span>; CT/MRI miss 20–25%. Contralateral metastasis as common as ipsilateral → prophylactic removal risks adrenal insufficiency without benefit."], [11, "l", 25, "Ch 141 · Contemporary Open Surgery of the Kidney", "4 · Radical nephrectomy", "<b>LND</b>: nodes positive ≈5%. EORTC RCT (772 patients): no overall survival benefit, but many low-stage tumours. <b>Do if nodes enlarged</b> (short axis <span class=\"key\">≥1.5 cm ≈ 50% positive</span>); consider in high risk (cytoreduction, &gt;10 cm, grade ≥3, sarcomatoid, thrombus, T4)."], [11, "l", 25, "Ch 141 · Contemporary Open Surgery of the Kidney", "5 · IVC tumour thrombectomy", "RCC = commonest cause; <span class=\"key\">5–10%</span> of RCC. Untreated → most die within 1 yr; surgery (RN + LND ± systemic therapy) is the backbone. Others: Wilms, adrenocortical carcinoma."], [11, "r", 25, "Ch 141 · Contemporary Open Surgery of the Kidney", "5 · IVC tumour thrombectomy", "I · IVC <span class=\"key\">≤2 cm</span> above ostium · Milk back, Satinsky partial clamp, ostial cavotomy"], [11, "a", 26, "Ch 141 · Contemporary Open Surgery of the Kidney", "5 · IVC tumour thrombectomy", "<p><b>Level I (right):</b> control IVC before handling tumour → right artery ligated interaortocavally → loop LRV, suprarenal and infrarenal IVC → <b>Rummel tourniquets</b> → milk thrombus toward ostium → Satinsky around ostium (thrombus inside jaws) → ostial cavotomy keeping ≥half IVC width → extract.</p>\n<p><b>Level I–II:</b> early renal artery ligation → tourniquets <b>infrarenal IVC → contralateral renal vein → suprarenal IVC</b> → cavotomy → extract → heparinised saline flush, inspect wall (resect suspicious intima) → 4-0 Prolene → release <b>caudal clamp first</b>, flush 5–10 mL on held breath → cranial clamp.</p>"], [11, "l", 26, "Ch 141 · Contemporary Open Surgery of the Kidney", "5 · IVC tumour thrombectomy", "<b>Pringle</b> (clamp portal vein, hepatic artery, bile duct) if clamping above hepatic veins: ≤60 min, ideally <span class=\"key\">≤20 min</span>. Pringle + clamps above and below liver = total hepatic vascular occlusion."], [11, "p", 27, "Ch 141 · Contemporary Open Surgery of the Kidney", "5 · IVC tumour thrombectomy", "<b>\"Shortcuts\" that become \"longcuts\":</b> opening IVC before all inflow controlled; side-biting a level I; clips on IVC side; incomplete arterial control; forceful milking (embolus, tear); clamping before volume loading or skipping test clamp."], [11, "r", 27, "Ch 141 · Contemporary Open Surgery of the Kidney", "6 · Partial nephrectomy", "Warm ischaemia · Aim <span class=\"key\">&lt;30 min</span>; within limits, preserved parenchyma dominates"], [11, "p", 27, "Ch 141 · Contemporary Open Surgery of the Kidney", "6 · Partial nephrectomy", "PN trades nephrons lost to the margin against nephrons injured by ischaemia. Within accepted limits, <b>volume of parenchyma preserved</b> matters more than clamp minutes; hypothermia and mannitol optional (role in solitary kidney/CKD unclear)."], [11, "l", 29, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "1 · Principles & patient selection", "First laparoscopic nephrectomy: <b>Clayman, 1991</b> <span class=\"tag\">MCQ</span>; first laparoscopic PN: Winfield 1993. Minimally invasive surgery (MIS) vs open: less pain and blood loss, quicker convalescence, <b>equivalent long-term outcomes</b>. Indications same as open."], [11, "p", 29, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "1 · Principles & patient selection", "The patient must tolerate the <b>pneumoperitoneum</b>, not the renal operation — cardiopulmonary reserve, not age or BMI, decides fitness."], [11, "l", 29, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "2 · Access & port placement", "<b>TP:</b> modified flank 30–45°; 3–5 trocars (umbilical camera, subxiphoid-midline and AAL 12 mm stapler port); obese → shift lateral. <b>Robotic</b> arm spacing <span class=\"key\">8 cm (Si) / 6 cm (Xi)</span> + 12 mm assistant port. Ports form a <b>broad-based triangle</b> with camera at apex."], [11, "p", 29, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "2 · Access & port placement", "RP pitfalls: balloon within muscle → flank hernia; too anterior → peritoneal/colon injury; too posterior → quadratus/psoas bleeding. Bail-out: open peritoneum, continue TP."], [11, "a", 30, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "3 · Nephrectomy — operative steps", "<p>Reflect colon → find ureter/gonadal vessels on psoas → lift kidney, expose hilum → artery then vein → upper pole (adrenal spared or taken) → ureter and lateral attachments → bag → extract</p>"], [11, "p", 30, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "4 · Simple vs radical nephrectomy", "Access changes morbidity and recovery, never oncology: early arterial control, en bloc removal and intact bagged extraction carry over from open surgery."], [11, "a", 31, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "5 · Partial nephrectomy", "<p>Intraoperative ultrasound (size, depth) → open Gerota's away from lesion → score capsule → clamp hilum (Satinsky en bloc or bulldogs) → cold-scissor excision → close vessels/collecting system → renorrhaphy → unclamp → drain</p>"], [11, "l", 31, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "5 · Partial nephrectomy", "<b>Trifecta:</b> negative margin + no major complication within 30 days + <span class=\"key\">WIT ≤25 min</span>."], [11, "l", 31, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "5 · Partial nephrectomy", "<b>Collecting system</b> entered in <span class=\"key\">~60%</span>: 2-0/3-0 polyglactin; <b>always drain</b>; routine ureteric catheter doesn't prevent fistula."], [11, "l", 31, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "5 · Partial nephrectomy", "<b>Ischaemia:</b> historical warm limit <span class=\"key\">30 min</span>; <b>preserved parenchymal volume predicts function better than WIT</b>. Cold ischaemia for solitary kidney, CKD, long clamp."], [11, "p", 31, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "5 · Partial nephrectomy", "No clamping strategy has beaten standard clamping on long-term function: what is kept matters more than how long it is clamped."], [11, "l", 32, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "7 · Complications & management", "Overall <span class=\"key\">~15%</span>; PN &gt; RN &gt; simple. Learning curve ~20 nephrectomies. Robotic PN halves open conversion. Age not a major risk; conversions cluster in infective disease."], [11, "a", 32, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "7 · Complications & management", "<p>Major bleed: locate → temporary control (grasper/pressure) → inform anaesthetist (blood, open set) → clear field, raise pneumoperitoneum or add trocar → definitive clip/suture → else convert and call vascular surgeon</p>"], [11, "p", 33, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "7 · Complications & management", "MIS complications are the open ones in altered form and timing: the lethal ones — access vessel injury, thermal bowel injury — happen out of view and present late or atypically."], [11, "p", 34, "Ch 143 · Focal Therapy for Renal Tumours", "1 · Rationale & indications", "<b>Trap:</b> TA is never the default for a fit patient."], [11, "r", 34, "Ch 143 · Focal Therapy for Renal Tumours", "1 · Rationale & indications", "AUA 2021 · Consider for cT1a <span class=\"key\">≤3 cm</span>, esp. comorbid; PN prioritised; percutaneous preferred"], [11, "r", 34, "Ch 143 · Focal Therapy for Renal Tumours", "1 · Rationale & indications", "EAU 2022 · TA not routinely <span class=\"key\">&gt;3 cm</span>; CA not <span class=\"key\">&gt;4 cm</span>; for frail/comorbid"], [11, "a", 34, "Ch 143 · Focal Therapy for Renal Tumours", "2 · Selection & work-up", "<p>Counsel (age, comorbidity, CKD risk, size/location) → biopsy → re-counsel with histology → PN / surveillance / percutaneous ablation</p>"], [11, "l", 34, "Ch 143 · Focal Therapy for Renal Tumours", "3 · Mechanisms", "Heat and cold: <b>central</b> necrosis + <b>peripheral sublethal</b> zone (apoptosis, ischaemia, immune). Cryo target <span class=\"key\">≤−40 °C</span>; iceball <span class=\"key\">5–10 mm beyond tumour</span> — every cryo rule pushes the −40 °C isotherm beyond the tumour edge."], [11, "l", 34, "Ch 143 · Focal Therapy for Renal Tumours", "3 · Mechanisms", "Heat: <span class=\"key\">≥60 °C</span> coagulative necrosis; ≥100 °C vaporisation/charring. Lethal: 45 °C × 60 min, 55 °C × 5 min, <b>70 °C × 1 min</b>."], [11, "p", 35, "Ch 143 · Focal Therapy for Renal Tumours", "4 · Choice of energy", "<b>Why RFA is self-limiting:</b> charring raises impedance and halts current (cap 105 °C, electrodes cooled). MWA <i>radiates</i> energy, works through desiccated tissue and blood, heats actively to 2 cm (RFA: millimetres) and outruns the heat sink."], [11, "a", 35, "Ch 143 · Focal Therapy for Renal Tumours", "5 · Technique", "<p>IV antibiotics → prone/flank on CT gantry → US, CT or MRI-guided placement → non-contrast CT confirms position → ablate → contrast CT (completeness, haematoma)</p>"], [11, "l", 36, "Ch 143 · Focal Therapy for Renal Tumours", "5 · Technique", "<b>CA:</b> probes <span class=\"key\">1–2 cm apart</span>; remove only after full thaw (else fracture, bleeding). Bleeding rises with size and probe number (&gt;4 cm)."], [11, "l", 36, "Ch 143 · Focal Therapy for Renal Tumours", "6 · Follow-up, success & salvage", "<b>AUA:</b> CT/MRI ± contrast + chest imaging at <span class=\"key\">6, 12, 24, 36, 48, 60 months</span>; then shared decision. US not routine unless CEUS protocol."], [11, "p", 36, "Ch 143 · Focal Therapy for Renal Tumours", "7 · Oncological outcomes vs PN", "<b>Why comparisons are biased:</b> benign and under-graded tumours flatter TA; occult pT3a penalises it; non-surgical candidates die of other causes first. EORTC 30904 (PN vs RN, ≤5 cm) had only 12 RCC deaths at 9.3 years – trials need huge cohorts."], [11, "l", 36, "Ch 143 · Focal Therap
