 vs nonfocal, <span class=\"key\">3 mm</span>) and grade at margin</b>."], [15, "l", 16, "Ch 157 · Diagnosis and Staging of Prostate Cancer", "3 · DRE and PSA", "Lower PSA: hypogonadism, obesity, statins, 5-ARIs, BPH surgery. On 5-ARI (finasteride 1 or 5 mg, dutasteride): <span class=\"key\">double PSA</span> after ≥12 months, or treat the nadir as new baseline."], [15, "p", 17, "Ch 157 · Diagnosis and Staging of Prostate Cancer", "4 · Staging: TNM (AJCC 8th, 2017)", "T1 is defined by how cancer was <b>found</b>, T2 by what is <b>felt</b>. Traps: SVI is T3b; non-regional nodes are M1a; biopsy-found impalpable cancer is T1c even if bilateral; clinical T is by DRE, not MRI."], [15, "l", 17, "Ch 157 · Diagnosis and Staging of Prostate Cancer", "5 · Predicting extent and risk", "<b>PSA</b> cannot stage an individual. Organ-confined ≈80% at PSA &lt;4, 66% at 4–10, &lt;50% &gt;10. Nodes ≈20% at &gt;20, <span class=\"key\">75% at &gt;50</span>."], [15, "p", 18, "Ch 157 · Diagnosis and Staging of Prostate Cancer", "6 · Staging imaging and nodes", "Imaging yield follows pre-test probability: in low-risk men most positive scans are false positives → more tests, anxiety, wrong denial of cure."], [15, "r", 18, "Ch 157 · Diagnosis and Staging of Prostate Cancer", "7 · Landmark trials", "ERSPC · European screening RCT, from 1993 · <span class=\"key\">20% relative reduction</span> in cancer death at 16 y · Saves lives, at cost of overdiagnosis"], [15, "m", 18, "Ch 157 · Diagnosis and Staging of Prostate Cancer", "8 · MCQ one-liners", "Finasteride 1 mg lowers PSA as much as 5 mg."], [15, "p", 19, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "1 · The modern question: timing as well as modality", "Cancer mortality is always weighed against competing mortality. A competing risk argues against treatment only when it will act <i>before</i> the cancer does."], [15, "l", 19, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "2 · Host evaluation", "NCCN: estimate life expectancy (SSA or WHO life tables). PCOS: 10-year prostate cancer mortality <span class=\"key\">3–18%</span> by risk vs <span class=\"key\">≥33%</span> other-cause with any comorbidity."], [15, "l", 19, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "2 · Host evaluation", "<b>Charlson (CCI)</b>: designed for 1-year inpatient mortality; <b>PCCI</b> reweights for 10-year. <b>CAN score</b> (automated, VHA): best predictor of 5-year survival <span class=\"tag\">MCQ</span>."], [15, "r", 19, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "2 · Host evaluation", "Prior TUR defect · Surgery · Brachytherapy dosimetry hard; ↑ incontinence. TURP <i>before</i> RT, delay EBRT <span class=\"key\">6–8 weeks</span>"], [15, "r", 20, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "3 · Risk stratification", "Very low · <b>All</b>: T1c; GG1; PSA &lt;10; &lt;3 positive cores, ≤50% each; PSA density &lt;<span class=\"key\">0.15</span> · Not indicated"], [15, "p", 20, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "3 · Risk stratification", "Favourable groups need ALL criteria; adverse groups ANY one. PSA density appears only in very low risk; GG3 alone makes intermediate unfavourable. AUA/ASTRO/SUO use very low/low/intermediate/high without substratification."], [15, "l", 20, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "3 · Risk stratification", "<b>proPSMA</b> (302 high-risk): accuracy <span class=\"key\">92% vs 65%</span>, sensitivity 85% vs 38%; negative scan cannot exclude small nodes."], [15, "l", 20, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "4 · Observation vs active surveillance", "Limitations: <span class=\"key\">25–45%</span> occult high grade on systematic biopsy; declining adherence; no agreed triggers. Reclassification predictors: PSA density &gt;0.15, core cancer density. <span class=\"xref\">→ Ch 159</span>"], [15, "r", 20, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "6 · Landmark trials", "<b>SPCG-4</b> · RP vs WW; 695; pre-PSA, ~90% palpable · 23.2 yr: cancer deaths 63 vs 99, RR <span class=\"key\">0.56</span>; absolute 11%; NNT <span class=\"key\">8</span>; most benefit &lt;65 (RR 0.45), intermediate risk · Benefit in younger, intermediate risk"], [15, "r", 21, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "6 · Landmark trials", "<b>ProtecT</b> · 1643 screen-detected, 50–69; monitoring vs RP vs RT + 3–6 mo ADT; 77% low risk · 15 yr cancer mortality <span class=\"key\">2.7% vs 2.2% vs 2.9%</span> (P = 0.53); more metastasis with monitoring; 60% of monitored treated by 15 yr · AS safe in favourable risk; RP = RT"], [15, "p", 21, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "6 · Landmark trials", "Trials show little benefit because competing mortality and low-risk enrolment dilute the effect; benefit appears only in younger intermediate-risk men with long follow-up. ProtecT expected 15% mortality, saw ~1% at 10 years."], [15, "p", 21, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "7 · Functional outcomes compared", "Surgery front-loads urinary and sexual harm that partly recovers; radiation spares early function but adds bowel toxicity and slow decline. Curves converge by 15 years — the choice is <i>when and where</i> the patient accepts harm."], [15, "a", 22, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "9 · Stepwise decision algorithm", "<p><b>1 — Treat or not?</b> Disease (grade, stage, genomics, family history) + host (age, comorbidity, longevity, preference) → WW (short longevity) or AS (very low/low, selected favourable intermediate).</p>\n<p><b>2 — Partial or whole gland?</b> Focality, size, grade, potency, LUTS → focal ablation (limited-focality intermediate risk, ideally in a trial) <span class=\"xref\">→ Ch 163</span>.</p>\n<p><b>3 — Surgery vs radiation vs whole-gland ablation</b> → outcomes, toxicities, baseline function, secondary treatment risk.</p>\n<p><b>4 — Delivery</b>: open vs robotic RP, node dissection, surgeon; EBRT vs brachytherapy, fractionation, ADT <span class=\"xref\">→ Ch 162</span>.</p>"], [15, "l", 22, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "9 · Stepwise decision algorithm", "<b>Whole-gland ablation</b>: little long-term data; salvage surgery hampered by fibrosis. Cryoablation → ED almost always; HIFU → better function but retreatment <span class=\"key\">29–38%</span>."], [15, "m", 22, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "10 · MCQ one-liners", "Early divergence of RP vs RT survival curves in observational studies indicates selection bias."], [15, "m", 22, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "10 · MCQ one-liners", "Brachytherapy, not EBRT, causes the worst acute obstructive/irritative symptoms."], [15, "l", 23, "Ch 159 · Active Surveillance of Prostate Cancer", "1 · Rationale: overdiagnosis", "<b>Latent reservoir</b>: autopsy cancer ≈ age as %; PSA + biopsy detects 15–25%, but lifetime risk of cancer death is only <span class=\"key\">3%</span>. Harbouring : death ≈ 20:1; diagnosis : death ≈ 6:1; overdiagnosis 87–94%."], [15, "p", 23, "Ch 159 · Active Surveillance of Prostate Cancer", "2 · AS versus watchful waiting", "AS defers curative intent; WW abandons it. Life expectancy, not grade, chooses between them."], [15, "l", 23, "Ch 159 · Active Surveillance of Prostate Cancer", "3 · Biology of grade group 1", "True grade progression ~<span class=\"key\">1–2% per year</span>, mostly high-volume Gleason 6 → long-term follow-up."], [15, "l", 23, "Ch 159 · Active Surveillance of Prostate Cancer", "3 · Biology of grade group 1", "Deaths in low-risk series = <b>occult higher grade</b>, present in ~<span class=\"key\">30%</span> after systematic biopsy (85% of it 3+4)."], [15, "p", 23, "Ch 159 · Active Surveillance of Prostate Cancer", "3 · Biology of grade group 1", "The main hazard of AS is <b>sampling error at entry</b>, not biology over time (\"wolf in sheep's clothing\"). First job: get the entry grade right."], [15, "l", 24, "Ch 159 · Active Surveillance of Prostate Cancer", "4 · Patient selection", "<b>Toronto</b> (inclusive: all Gleason 6 + selected intermediate; ~50% eligible) 15-yr cancer mortality <span class=\"key\">5%</span> actuarial (1.5% actual) vs <b>Johns Hopkins</b> (Epstein very low; ~20% eligible) <span class=\"key\">0.5%</span>. <b>Inclusion criteria set mortality; intervention constant (~25% at 5 yr)</b>. Toronto baseline Gleason 7: ≥20% metastasis at 15 yr (HR 3.75); PSA &gt;10 barely predictive."], [15, "a", 24, "Ch 159 · Active Surveillance of Prostate Cancer", "5 · Monitoring protocol", "<p>Diagnosis → mpMRI → <b>confirmation biopsy</b> (systematic + targeted) within 1–3 yr → PSA 6-monthly, DRE every 1–2 yr, MRI ≤ every 18–24 months → repeat biopsy every 3–5 yr while stable → trigger → definitive therapy, or WW when life expectancy falls</p>"], [15, "p", 25, "Ch 159 · Active Surveillance of Prostate Cancer", "5 · Monitoring protocol", "Grade triggers treatment; volume and PSA trigger investigation. 10–15% leave AS by choice (anxiety) without a trigger."], [15, "p", 26, "Ch 160 · Open Radical Prostatectomy", "1 · Principles", "The order of goals settles every intraoperative trade-off: when nerve sparing and a clear margin conflict, the margin wins."], [15, "l", 26, "Ch 160 · Open Radical Prostatectomy", "2 · Surgical anatomy", "Urethral branches at the bladder neck, <span class=\"key\">5 and 7 o'clock</span> pedicles; capsular branches mark the cavernous nerves."], [15, "l", 26, "Ch 160 · Open Radical Prostatectomy", "2 · Surgical anatomy", "Pelvic plexus = parasympathetic <span class=\"key\">S2–S4</span> + hypogastric sympathetic; beside the rectum, <span class=\"key\">5–11 cm</span> from the anal verge, midpoint at the seminal vesicle tip."], [15, "p", 26, "Ch 160 · Open Radical Prostatectomy", "2 · Surgical anatomy", "Nerves and vessels run between levator and prostatic fascia. Leaving prostatic fascia on the gland and Denonvilliers fascia on its back lets nerve sparing and clear margins coexist."], [15, "l", 26, "Ch 160 · Open Radical Prostatectomy", "3 · Selection and preoperative care", "<b>Defer <span class=\"key\">6 weeks after biopsy</span>, <span class=\"key\">12 weeks after TURP</span></b>."], [15, "a", 26, "Ch 160 · Open Radical Prostatectomy", "4 · Retropubic RP — operative steps", "<p>Lower midline extraperitoneal incision → PLND → endopelvic fascia → puboprostatic ligaments → DVC → urethra → posterior sphincter → NVB release → pedicles → bladder neck and seminal vesicles → reconstruction → anastomosis</p>"], [15, "p", 27, "Ch 160 · Open Radical Prostatectomy", "4 · Retropubic RP — operative steps", "Every step does one of three jobs: absolute venous control before the apex; the right fascia on the specimen; no traction or heat on the NVB."], [15, "l", 28, "Ch 160 · Open Radical Prostatectomy", "8 · Postoperative complications", "Mortality <span class=\"key\">0.2%</span>."], [15, "l", 28, "Ch 160 · Open Radical Prostatectomy", "8 · Postoperative complications", "<b>Thromboembolism</b> = major cause of death; highest with PLND, peaks <span class=\"key\">14–28 days</span>. Compression, early ambulation; treat with LMWH."], [15, "p", 28, "Ch 160 · Open Radical Prostatectomy", "8 · Postoperative complications", "Most late complications trace to the pelvic haematoma: it distracts the anastomosis (contracture, incontinence) and inflames the NVBs — hence early re-exploration, clips near the bundles and a peritoneal window."], [15, "p", 30, "Ch 161 · Laparoscopic and Robotic-Assisted Laparoscopic Radical Prostatectomy and Pelvic Lymphadenectomy", "1 · Background", "The robot did not change the operation; it removed the suturing barrier. Surgical anatomy (dorsal venous complex [DVC], neurovascular bundle [NVB], fasciae, sphincter) is as in open surgery <span class=\"xref\">→ Ch 160</span>."], [15, "l", 30, "Ch 161 · Laparoscopic and Robotic-Assisted Laparoscopic Radical Prostatectomy and Pelvic Lymphadenectomy", "2 · Patient selection", "mpMRI for extracapsular extension (ECE): specificity <span class=\"key\">0.88</span>, sensitivity <span class=\"key\">0.61</span>; guides extent of nerve sparing."], [15, "l", 30, "Ch 161 · Laparoscopic and Robotic-Assisted Laparoscopic Radical Prostatectomy and Pelvic Lymphadenectomy", "4 · Access", "Camera port <span class=\"key\">15–17 cm</span> from symphysis; 12–15 mm Hg."], [15, "a", 31, "Ch 161 · Laparoscopic and Robotic-Assisted Laparoscopic Radical Prostatectomy and Pelvic Lymphadenectomy", "5 · Operative steps (transperitoneal anterior RALRP)", "<p>Drop bladder (Retzius) → endopelvic fascia → DVC ligation → bladder neck → seminal vesicles and vasa → posterior plane (Denonvilliers) → pedicles and NVB release → apex: DVC and urethra → inspect → PLND → entrapment → posterior reconstruction → anastomosis → extraction</p>"], [15, "l", 31, "Ch 161 · Laparoscopic and Robotic-Assisted Laparoscopic Radical Prostatectomy and Pelvic Lymphadenectomy", "5 · Operative steps (transperitoneal anterior RALRP)", "Divide anteriorly in midline → lift catheter → inspect for median lobe and orifices → divide posterior neck angled <span class=\"key\">45°</span> downward."], [15, "l", 32, "Ch 161 · Laparoscopic and Robotic-Assisted Laparoscopic Radical Prostatectomy and Pelvic Lymphadenectomy", "7 · Pelvic lymph node dissection", "<b>Indications</b>: low risk (nodes &lt;5%) → may omit. AUA 2018: unfavourable intermediate or high risk. EAU 2021: nomogram risk <span class=\"key\">&gt;5%</span>. AUA/ASTRO 2022: risk-stratified by nomogram."], [15, "l", 32, "Ch 161 · Laparoscopic and Robotic-Assisted Laparoscopic Radical Prostatectomy and Pelvic Lymphadenectomy", "7 · Pelvic lymph node dissection", "<b>Lymphocele — commonest</b> (<span class=\"key\">2–5%</span> significant). <b>Transperitoneal access is not protective</b> (bladder walls off the fossa) → <b>peritoneal interposition flap</b> reduces it. Classically ipsilateral DVT."], [15, "p", 33, "Ch 161 · Laparoscopic and Robotic-Assisted Laparoscopic Radical Prostatectomy and Pelvic Lymphadenectomy", "9 · MIS-specific complications", "Robotic injuries are fewer but less visible: bleeding and strictures fall with magnified vision, while bowel injury and positioning neuropathy happen outside the camera's field and must be anticipated."], [15, "l", 34, "Ch 162 · Radiation Therapy for Prostate Cancer", "1 · Radiobiology and fractionation", "Conventional = <span class=\"key\">1.8–2 gray (Gy)</span> daily. <b>Linear–quadratic model</b>: response to fraction size set by <b>α/β ratio</b> — low (2–4 Gy) in late-responding normal tissue, high (≥8 Gy) in most tumours."], [15, "l", 34, "Ch 162 · Radiation Therapy for Prostate Cancer", "1 · Radiobiology and fractionation", "Prostate cancer (few cycling cells): α/β <span class=\"key\">≈1.5 Gy</span> (EBRT cohorts 1.0–1.7), <b>lower than rectum (~3 Gy)</b> → fractions &gt;2 Gy favour tumour kill over late toxicity = rationale for hypofractionation."], [15, "r", 34, "Ch 162 · Radiation Therapy for Prostate Cancer", "1 · Radiobiology and fractionation", "Moderate hypofractionation · 2.25–4 Gy · ~4 wk (<span class=\"key\">60 Gy/20</span>)"], [15, "r", 34, "Ch 162 · Radiation Therapy for Prostate Cancer", "1 · Radiobiology and fractionation", "Ultrahypofractionation = SBRT · ≥5 Gy · ≤5–7 fractions (<span class=\"key\">36.25 Gy/5</span>)"], [15, "r", 34, "Ch 162 · Radiation Therapy for Prostate Cancer", "2 · EBRT techniques", "PTV · CTV + margin: <span class=\"key\">3–7 mm</span> with image guidance"], [15, "l", 34, "Ch 162 · Radiation Therapy for Prostate Cancer", "2 · EBRT techniques", "<b>Rectal spacer</b> (hydrogel/hyaluronic acid into Denonvilliers' fascia, transperineal): late rectal toxicity <span class=\"key\">2% vs 7%</span> (hydrogel, 79.2 Gy); grade ≥2 2.9% vs 13.8% (hyaluronic acid, 60 Gy/20)."], [15, "l", 35, "Ch 162 · Radiation Therapy for Prostate Cancer", "4 · Hypofractionation", "<b>Dose ceiling</b>: no gain above <span class=\"key\">40 Gy/5</span>. Alternate days; margins 3–5 mm; rectal risk if &gt;35% of circumference &gt;39 Gy; spacer ↓ ulcers."], [15, "r", 35, "Ch 162 · Radiation Therapy for Prostate Cancer", "5 · Brachytherapy (BT)", "<sup>125</sup>I · <span class=\"key\">59.6 d</span> · 140–160 Gy · 108–110 Gy"], [15, "l", 35, "Ch 162 · Radiation Therapy for Prostate Cancer", "5 · Brachytherapy (BT)", "<b>Post-implant dosimetry</b> (CT ± MRI, 14–30 days): <b>D90</b> &gt;90% of prescription; <b>V100</b> &gt;85%; urethral V150 &lt;0.05 cm³; rectal V100 &lt;1 cm³. Low D90 → biochemical failure. <span class=\"tag\">MCQ</span> D90 is a dose, V100 a volume."], [15, "l", 35, "Ch 162 · Radiation Therapy for Prostate Cancer", "5 · Brachytherapy (BT)", "<b>ASCENDE-RT</b>: no OS difference; LDR boost grade 3 GU <span class=\"key\">18.4% vs 5.2%</span>."], [15, "p", 35, "Ch 162 · Radiation Therapy for Prostate Cancer", "5 · Brachytherapy (BT)", "Why BT works: the steep fall-off lets intraprostatic dose far exceed EBRT. Hence outcome depends on implant accuracy (D90), eligibility on whether the urethra tolerates swelling, and EBRT is added only where disease may lie beyond the implant."], [15, "r", 36, "Ch 162 · Radiation Therapy for Prostate Cancer", "6 · ADT with RT", "Unfavourable intermediate · <span class=\"key\">4–6 mo</span> · — · RTOG 94-08, DFCI 95-096, TROG 96.01 (6 &gt; 3 mo); RTOG 99-10: 9 mo no better than 4"], [15, "r", 36, "Ch 162 · Radiation Therapy for Prostate Cancer", "6 · ADT with RT", "High / very high · <span class=\"key\">24–36 mo</span> (≥18) · 12–36 mo · EORTC 22863, RTOG 92-02, EORTC 22961 (36 &gt; 6 mo); PCS IV: 18 = 36 mo"], [15, "r", 36, "Ch 162 · Radiation Therapy for Prostate Cancer", "9 · Follow-up and biochemical failure", "Failure · 3 consecutive rises · PSA <span class=\"key\">≥ nadir + 2 ng/mL</span>"], [15, "l", 36, "Ch 162 · Radiation Therapy for Prostate Cancer", "9 · Follow-up and biochemical failure", "<b>Biopsy</b> optimal at <span class=\"key\">30–36 mo</span>. Do not grade marked radiation effect (behaves as negative); high-molecular-weight cytokeratin separates atypia from cancer. Recurrence arises at the original dominant nodule."], [15, "l", 38, "Ch 163 · Focal Therapy of Prostate Cancer", "1 · Definition and rationale", "Multifocal in <span class=\"key\">50–91%</span> of RP specimens. <b>Index lesion (IL)</b> = largest/highest-grade focus; hypothesis: IL drives natural history and metastasis."], [15, "l", 38, "Ch 163 · Focal Therapy of Prostate Cancer", "1 · Definition and rationale", "<b>For</b>: IL holds <span class=\"key\">80–90%</span> of tumour volume; satellites mostly &lt;<span class=\"key\">0.5 mL</span> (Stamey \"insignificant\") → 52–93% functionally unifocal."], [15, "p", 38, "Ch 163 · Focal Therapy of Prostate Cancer", "1 · Definition and rationale", "\"Multifocal, therefore unsuitable for FT\" is a trap: what matters is one significant lesion plus insignificant satellites, not the count of foci. The hypothesis's exceptions are why FT is always paired with surveillance."], [15, "l", 38, "Ch 163 · Focal Therapy of Prostate Cancer", "2 · Patient selection", "<b>PROMIS</b>: csPCa sensitivity <span class=\"key\">93%</span>, specificity 41%, NPV 89% → lesions need biopsy; MRI-negative areas still need systematic biopsy."], [15, "l", 38, "Ch 163 · Focal Therapy of Prostate Cancer", "2 · Patient selection", "mpMRI <b>underestimates volume</b> → margin: <span class=\"key\">5 mm</span> ablates &gt;95%, 6 mm 98.6% of csPCa. ~<span class=\"key\">90%</span> of outfield csPCa lies within <b>1 cm</b> of target (\"penumbra\")."], [15, "p", 38, "Ch 163 · Focal Therapy of Prostate Cancer", "2 · Patient selection", "Imaging finds the lesion, only biopsy grades it, and only systematic biopsy vouches for the rest of the gland — every consensus has kept all three."], [15, "p", 39, "Ch 163 · Focal Therapy of Prostate Cancer", "3 · Ablation patterns and energies", "Every energy fails at the edge of the ablation zone, where temperature or field strength becomes sublethal. Margins, thermometry and adjuvants (cryo-enhancers, SBRT boost) all aim to make that edge lethal. Hence laser's precise but narrow zone gives the most infield recurrence."], [15, "l", 40, "Ch 163 · Focal Therapy of Prostate Cancer", "4 · Outcomes", "HEAT (HIFU): 7-yr failure-free survival <span class=\"key\">69%</span> (68% intermediate, 65% high risk)."], [15, "l", 40, "Ch 163 · Focal Therapy of Prostate Cancer", "6 · Follow-up and failure", "<b>PSA</b> falls only <span class=\"key\">50–80%</span>; Phoenix/ASTRO not validated after FT. Proposed: nadir + <span class=\"key\">1.0</span> ng/mL at 12 months or + 1.5 at 24–36 months predicts csPCa. DRE unreliable."], [15, "a", 40, "Ch 163 · Focal Therapy of Prostate Cancer", "6 · Follow-up and failure", "<p>mpMRI + targeted biopsy (4–6 cores) of treated zone at <b>3–6 months</b> → mpMRI at 1–2 and 5 years (targeted biopsy for new lesion) → systematic biopsy at 1–2 and 5 years for the untreated gland</p>"], [15, "r", 40, "Ch 163 · Focal Therapy of Prostate Cancer", "8 · Landmark trials", "<b>PCM301</b> (Azzouzi 2017) · 415 low-risk men; padeliporfin VTP vs AS · Progression 28% vs 58%; conversion to radical therapy 4 yr <span class=\"key\">24% vs 53%</span>; continence preserved · First level 1 evidence for FT — but Gleason 6 only, surrogate end points"], [15, "p", 41, "Ch 163 · Focal Therapy of Prostate Cancer", "8 · Landmark trials", "Open problems: can insignificant satellites be safely left; cost of repeated treatment; adjuvants. Lumpectomy works because the breast gets adjuvant radiotherapy — prostate FT relies on surveillance and retreatment instead."], [15, "l", 42, "Ch 164 · Treatment of Locally Advanced Prostate Cancer", "2 · Staging and risk assessment", "<b>PSMA PET</b>: nodal specificity ≥95%, sensitivity only ~40–66%; <b>proPSMA</b> accuracy <span class=\"key\">92% vs 65%</span>."], [15, "l", 42, "Ch 164 · Treatment of Locally Advanced Prostate Cancer", "3 · Radical prostatectomy in high-risk disease", "cT3: ~half recurrence-free at 8–10 yr; DSS <span class=\"key\">~80–90% at 10 yr</span>, though biochemical DFS often ~50%."], [15, "p", 42, "Ch 164 · Treatment of Locally Advanced Prostate Cancer", "3 · Radical prostatectomy in high-risk disease", "Operative principle: a <b>positive surgical margin</b> carries the highest relative risk of progression (4.37) — higher than ECE, SVI or nodes — so remove all prostatic tissue regardless of stage."], [15, "r", 42, "Ch 164 · Treatment of Locally Advanced Prostate Cancer", "3 · Radical prostatectomy in high-risk disease", "Positive margin · — · <span class=\"key\">4.37</span> (highest)"], [15, "l", 43, "Ch 164 · Treatment of Locally Advanced Prostate Cancer", "3 · Radical prostatectomy in high-risk disease", "Dose <span class=\"key\">≥64 Gy</span>. <b>GETUG-AFU 16</b>: <b>3 months</b> AD with salvage RT → 10-yr PFS 64% vs 49% (HR 0.54) <span class=\"xref\">→ Ch 162</span>."], [15, "a", 43, "Ch 164 · Treatment of Locally Advanced Prostate Cancer", "3 · Radical prostatectomy in high-risk disease", "<p><b>pN1 after RP</b>: favourable (few nodes, Gleason ≤8) → observation with PSA monitoring → adverse (&gt;3 nodes, Gleason &gt;8) → AD + RT (best OS) → avoid AD alone where fit.</p>"], [15, "l", 43, "Ch 164 · Treatment of Locally Advanced Prostate Cancer", "4 · RT + ADT", "<b>Duration</b>: intermediate 4–6 mo; high risk NCCN <span class=\"key\">18–36 mo</span> with EBRT, 12–36 mo with brachytherapy boost."], [15, "l", 44, "Ch 164 · Treatment of Locally Advanced Prostate Cancer", "4 · RT + ADT", "<b>SPCG-7</b>: cancer death RR <span class=\"key\">0.44</span>, overall mortality RR 0.68."], [15, "a", 44, "Ch 164 · Treatment of Locally Advanced Prostate Cancer", "5 · ADT alone and other options", "<p><b>Locally advanced / high-risk M0</b>: stage (PSMA PET or CT + bone scan) → fit, resectable → RP + ePLND → adverse pathology: early salvage RT (adjuvant if pT3b/Gleason 8–10/margins+); pN1: observe or AD + RT. Alternative → dose-escalated RT (± brachytherapy boost, ± pelvic nodes) + 18–36 mo ADT → very high risk or N1: + 2 yr abiraterone → unfit for local therapy: ADT alone.</p>"], [15, "p", 44, "Ch 164 · Treatment of Locally Advanced Prostate Cancer", "5 · ADT alone and other options", "Viva: \"Why not ADT alone for T3 disease?\" — SPCG-7 and PR.3 show RT added to ADT halves cancer death and improves OS; AD alone neither cures nor controls the primary, and it carries its own toxicity."], [15, "l", 46, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "1 · Biochemical recurrence: concept and definitions", "After radical prostatectomy (RP): <span class=\"key\">¼–⅖</span> develop BCR within 10 years; only ≈half of intermediate/high-risk men with BCR fail clinically."], [15, "l", 46, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "1 · Biochemical recurrence: concept and definitions", "MSK: PSA <span class=\"key\">≥0.4 ng/mL followed by a further rise</span> best predicted metastasis and secondary therapy."], [15, "r", 46, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "1 · Biochemical recurrence: concept and definitions", "Post-RP — AUA · PSA <span class=\"key\">≥0.2 ng/mL</span> · No gland → any PSA suspect"], [15, "r", 46, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "1 · Biochemical recurrence: concept and definitions", "After EBRT ± ADT · <b>Phoenix</b>: <span class=\"key\">nadir + 2 ng/mL</span> · Remnant gland makes PSA; validated against metastasis and death"], [15, "r", 46, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "1 · Biochemical recurrence: concept and definitions", "After LDR brachytherapy · ≥0.2 may suit better; <span class=\"key\">&lt;0.2 at 4 years ≈ cure</span> · ≥2× EBRT dose → very low nadir; Phoenix may flatter brachytherapy"], [15, "r", 46, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "1 · Biochemical recurrence: concept and definitions", "<b>Low risk</b> (needs BOTH) · PSADT <span class=\"key\">&gt;1 year</span> AND GG &lt;4 · Interval to failure <span class=\"key\">&gt;18 months</span> AND GG &lt;4"], [15, "p", 46, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "1 · Biochemical recurrence: concept and definitions", "<b>PSA bounce</b> after RT: transient rise of 0.1–0.5 ng/mL at mean ≈ <span class=\"key\">9 months</span> (radiation prostatitis, delayed cell death), then a fall. It is <b>favourable</b> (better BCR-free survival) → monitor; never salvage on a bounce."], [15, "l", 46, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "2 · Risk prediction and natural history", "<b>CAPRA</b> = pre-op; <b>CAPRA-S</b> = post-op <span class=\"tag\">MCQ</span>; only MSK nomograms reach 15-year cancer-specific survival."], [15, "l", 46, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "2 · Risk prediction and natural history", "<b>Pound</b>: median <span class=\"key\">8 years</span> BCR → metastasis, then <span class=\"key\">5 years</span> → death (P2-144)."], [15, "l", 47, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "3 · Imaging at recurrence", "Bone scan/CT rarely positive below PSA <span class=\"key\">10 ng/mL</span>. <b>PSMA PET</b>: ≈½ positive at PSA <span class=\"key\">&lt;0.5</span>; finds disease outside the salvage field in ≈1 in 5. <b>EMPIRE-1</b>: fluciclovine-guided salvage improved 3-year control."], [15, "p", 47, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "3 · Imaging at recurrence", "Salvage RT works best at the lowest PSA, but imaging detection and certainty of recurrence improve only as PSA rises. Risk features (grade, margins, kinetics) let us act early without overtreating."], [15, "l", 47, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "4 · Salvage after radical prostatectomy", "<b>SRT</b> = only curative option (P2-144). Dose <span class=\"key\">≥64–65 Gy</span> to fossa; ≈10% RFS lost per 0.1 ng/mL with ≥2 adverse features; IMRT standard."], [15, "r", 47, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "5 · Salvage after radiotherapy", "Salvage RP (open/robotic) · EAU: life expectancy ≥10 years, PSA <span class=\"key\">&lt;10</span>, biopsy GG ≤3, N0M0 on imaging, initial cT1–T2; gives pathological staging; poor if SV/nodal involvement · Incontinence, bladder neck contracture, rectal injury, near-universal impotence"], [15, "r", 47, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "5 · Salvage after radiotherapy", "Salvage cryotherapy · PSA &lt;10 (ideally &lt;4), PSADT <span class=\"key\">≥16 months</span>; post-cryo nadir &lt;0.2 predicts success · <b>Urethrorectal fistula</b> (1–3%), ED; incontinence single-digit with <b>urethral warming</b>"], [15, "l", 47, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "6 · Non-curative approach to BCR: observation vs ADT", "AUA: observation (or trial) after maximal local therapy; ADT only for higher metastatic risk — PSADT <span class=\"key\">&lt;12 months</span> or high grade; intermittent preferred. EAU: observe low-risk BCR, limited life expectancy or men declining local therapy."], [15, "l", 48, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "6 · Non-curative approach to BCR: observation vs ADT", "<b>Messing (ECOG)</b>: immediate ADT for pN+ after RP improved OS/PFS — but small, pre-modern imaging, bulky nodes, delayed arm treated only at clinical progression. Low-volume pN+ with undetectable PSA: <span class=\"key\">20–40%</span> cured by surgery alone."], [15, "l", 48, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "6 · Non-curative approach to BCR: observation vs ADT", "<b>EMBARK</b> entry: PSADT <span class=\"key\">≤9 months</span>, PSA ≥1 after RP or ≥2 above nadir after RT."], [15, "p", 48, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "7 · Androgen deprivation therapy: biology and agents", "<b>Flare</b> matters with spinal/weight-bearing bone metastases: antiandrogen with (or before) the agonist for <span class=\"key\">21–28 days</span>; simultaneous start as good as a week's lead-in. <b>Impending cord compression</b> or severe pain → <b>antagonist or orchiectomy</b> (or ketoconazole).<br><b>Antiandrogen withdrawal</b>: 15–30% respond (bicalutamide); 0–10% with ARTAs; no OS gain."], [15, "r", 49, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "8 · ADT side effects and their management", "<b>Osteoporosis / fracture</b> · Loss of peripheral oestrogen; fracture risk ↑20–45% · Baseline DEXA + FRAX; all: calcium 1000–1200 mg + vitamin D 400–1000 IU/day, exercise, stop smoking. Drug if T-score −1 to −2.5 with 10-year hip fracture <span class=\"key\">&gt;3%</span> or major fracture <span class=\"key\">&gt;20%</span> (or osteoporosis): denosumab 60 mg SC 6-monthly, zoledronic acid 4–5 mg IV yearly or alendronate 70 mg weekly; repeat DEXA at 1 year"], [15, "l", 49, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "9 · Metastatic hormone-sensitive prostate cancer (mHSPC)", "Prognosis: metachronous low volume best (median OS ≈92 vs ≈43 months synchronous high volume); nodes &gt; bone &gt; visceral. <b>SWOG 9346 PSA nadir at 7 months</b>: ≤0.2 → median OS <span class=\"key\">75</span> months; 0.2–4 → 44; &gt;4 → 13."], [15, "r", 49, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "9 · Metastatic hormone-sensitive prostate cancer (mHSPC)", "<b>CHAARTED high volume</b> · <span class=\"key\">≥4 bone metastases with ≥1 outside the axial skeleton</span>, OR any visceral (no grade criterion) · Docetaxel benefit; RT to primary in low volume"], [15, "r", 49, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "9 · Metastatic hormone-sensitive prostate cancer (mHSPC)", "<b>LATITUDE high risk</b> · <span class=\"key\">≥2 of</span>: Gleason ≥8, ≥3 bone lesions, visceral · Abiraterone entry"], [15, "l", 49, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "9 · Metastatic hormone-sensitive prostate cancer (mHSPC)", "<b>ADT is the floor, never the ceiling</b>; long-term CAB not recommended. Docetaxel <span class=\"key\">75 mg/m² 3-weekly × 6</span> (meta-analysis HR 0.77). Observation only if asymptomatic with life expectancy &lt;5 years."], [15, "l", 50, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "9 · Metastatic hormone-sensitive prostate cancer (mHSPC)", "<b>MDT</b>: oligometastases = <span class=\"key\">≤3 sites</span> on PET; SBRT or salvage node dissection."], [15, "r", 50, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "10 · Landmark trials", "RTOG 0534 (SPPORT) · Bed vs bed + 4–6 months ADT vs pelvis + ADT · 5-year freedom from progression 70.9 / 81.3 / <span class=\"key\">87.4%</span> · Add ADT + pelvic nodes (not OS)"], [15, "r", 50, "Ch 165 · Management of Recurrent and Newly Metastatic Prostate Cancer", "10 · Landmark trials", "CHAARTED (ECOG 3805) · ADT ± docetaxel · OS 57.6 vs 44.0 months (HR 0.61); high volume <span class=\"key\">49.2 vs 32.2</span> months · High volume only"], [15, "l", 51, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "2 · Clinical states and progression criteria", "PSADT <span class=\"key\">&lt;3 months</span> → rapid course → consider aggressive therapy."], [15, "r", 51, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "2 · Clinical states and progression criteria", "Bone scan · Early new lesions may be <b>flare</b> · Rescan at <span class=\"key\">12–16 weeks</span> as new baseline; progression = <span class=\"key\">≥2 new lesions</span> (\"2 + 2\")"], [15, "p", 51, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "2 · Clinical states and progression criteria", "Every marker (PSA, bone scan, PSMA PET) can flare early, so progression is called on confirmed, combined evidence — otherwise effective therapy is abandoned too soon."], [15, "l", 51, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "3 · Germline and somatic testing", "Somatic HRR mutations in <span class=\"key\">20–25%</span> of mCRPC; dMMR/MSI-H in <span class=\"key\">2–5%</span> → Lynch counselling."], [15, "p", 52, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "5 · mCRPC: androgen-signalling inhibitors", "<b>Prednisone with abiraterone</b>: CYP17 block ↓cortisol → ↑ACTH → mineralocorticoid excess; prednisone suppresses ACTH. Enzalutamide needs no steroid (prednisone may activate a promiscuous AR). ARPI class: fatigue, falls, fractures — caution &gt;75 years."], [15, "r", 52, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "6 · Cytotoxic chemotherapy", "Docetaxel · <span class=\"key\">75 mg/m² 3-weekly</span> + prednisone 5 mg twice daily; first line · Neutropenia, <b>neuropathy</b>, oedema, hyperlacrimation, nail dystrophy"], [15, "r", 52, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "6 · Cytotoxic chemotherapy", "Cabazitaxel · <span class=\"key\">20 mg/m²</span> (25 if low neutropenic risk) 3-weekly + prednisone + G-CSF; post-docetaxel · <b>Neutropenia</b> (grade 3–4 82%), <b>diarrhoea</b>"], [15, "r", 52, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "7 · Radiopharmaceuticals", "Emitter · <b>Alpha</b> (path <span class=\"key\">&lt;100 µm</span>, spares marrow); calcium mimetic · Beta; needs PSMA PET-positive disease"], [15, "l", 53, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "9 · Immunotherapy", "Checkpoint inhibitors fail in unselected mCRPC (\"cold\" tumour). <b>Pembrolizumab</b> 200 mg IV 3-weekly: tumour-agnostic for <b>MSI-H/dMMR</b> or TMB <span class=\"key\">≥10 mutations/megabase</span> after ≥1 line."], [15, "r", 53, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "10 · Neuroendocrine/aggressive-variant CRPC", "Survival · Years · <span class=\"key\">&lt;12 months</span>"], [15, "a", 54, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "12 · Complications and palliative care", "<p>Back pain ± deficit or sphincter change → <b>high-dose IV dexamethasone</b> (10 mg IV, then 4–10 mg 6–12-hourly; 16–100 mg/day) → <b>urgent whole-spine MRI</b> → RT ± decompressive surgery → taper steroids over 2–3 weeks</p>"], [15, "r", 54, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "13 · Bone-targeted therapy", "Dose · <span class=\"key\">4 mg IV 4-weekly</span>, renal adjustment · <span class=\"key\">120 mg subcutaneous (SC) 4-weekly</span>; no renal adjustment"], [15, "r", 54, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "13 · Bone-targeted therapy", "Toxicity · Flu-like, creatinine rise, hypocalcaemia, ONJ · Hypocalcaemia (grade ≥3 5%), ONJ <span class=\"key\">2–4%</span>"], [15, "p", 54, "Ch 166 · Management of Castration-Resistant Prostate Cancer", "13 · Bone-targeted therapy", "<b>ONJ</b>: mostly with dental extraction/poor dentition → dental assessment first. Calcium 1000 mg + vitamin D 800 IU daily with both. Bone agents strongly recommended with radium-223."], [15, "a", 56, "★ Putting it together", "A · PSA to diagnosis", "<p><b>1. Raised PSA or abnormal DRE</b> → repeat; exclude infection, instrumentation, 5-ARIs (×2 PSA); density, biomarkers (<span class=\"xref\">→ Ch 154</span>).</p>\n<p><b>2. mpMRI before biopsy</b> → PI-RADS (<span class=\"xref\">→ Ch 155</span>).</p>\n<p><b>3. Biopsy</b>: PI-RADS 3–5 targets + systematic; transperineal safer.</p>\n<p><b>4. ISUP Grade Group</b> (<span class=\"xref\">→ Ch 156</span>); risk group (<span class=\"xref\">→ Ch 157</span>); PSMA PET (or CT + bone scan) from unfavourable intermediate.</p>"], [15, "p", 56, "★ Putting it together", "B · Localised: risk → treatment", "SPCG-4, PIVOT, ProtecT: radical treatment helps only younger men, ≥intermediate risk, long life expectancy. ProtecT: RP = RT for 15-year cancer survival."], [15, "a", 57, "★ Putting it together", "D · Advanced disease", "<p><b>1. BCR</b> (Ch 165): PSMA PET. Post-RP: salvage RT. Post-RT: biopsy-proven → local salvage. High risk (PSADT ≤9 months) → ADT + enzalutamide (EMBARK).</p>\n<p><b>2. mHSPC</b>: never ADT alone: + ARPI; triplet with docetaxel if fit, high volume. Prostate RT if low volume (STAMPEDE arm H). Genetic testing all.</p>\n<p><b>3. nmCRPC</b> PSADT ≤10 months: ARPI (SPARTAN, PROSPER, ARAMIS).</p>\n<p><b>4. mCRPC</b> (Ch 166): switch mechanism: docetaxel → cabazitaxel (CARD); ¹⁷⁷Lu-PSMA (VISION); radium-223 symptomatic bone-only (ALSYMPCA); PARPI if BRCA/HRR mutation (PROfound); pembrolizumab if MSI-H. Bone protection always.</p>"]]};
const {names,urls,days,items}=DATA;
const KIND={p:'Key point',a:'Algorithm',m:'MCQ',l:'',r:'Table'};
const KCLS={p:'k-p',a:'k-a',m:'k-m',l:'k-l',r:'k-r'};
const PAPERS={P1:'t0',P2:'t1',P3:'t2',P4:'t3'};
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
// index items by book
const byBook=names.map(()=>[]);items.forEach((it,i)=>byBook[it[0]].push(i));
function inRange(b,a,z){return byBook[b].filter(i=>items[i][2]>=a&&items[i][2]<=z)}
function fmtDate(iso){const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}
function localISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayIndex(){const t=localISO(new Date());let i=days.findIndex(d=>d.date===t);if(i<0)i=t<days[0].date?0:days.length-1;return i}
let cur=todayIndex();
function prevStudy(k,back){let j=k-back;while(j>=0&&days[j].buf)j--;return j>=0?j:null}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function renderItems(ids,opts={}){
  let html='',lastB=-1,lastCh='',lastH2='';
  for(const i of ids){const [b,t,p,ch,h2,h]=items[i];
    if(opts.showBook&&b!==lastB){html+=`<div class="src">${esc(names[b])}</div>`;lastB=b;lastCh='';lastH2=''}
    if(ch!==lastCh){html+=(html.endsWith('</li>')?'</ul>':'')+`<div class="ch">${esc(ch)}</div>`;lastCh=ch;lastH2=''}
    else if(html.endsWith('</li>')) html+='</ul>';
    if(h2&&h2!==lastH2){html+=`<div class="h2">${esc(h2)}</div>`;lastH2=h2}
    html+=`<ul class="core"><li class="${KCLS[t]}">${KIND[t]?`<span class="kind">${KIND[t]}</span>`:''}${h}<span class="pg">p.${p}</span></li>`;
  }
  if(html.endsWith('</li>'))html+='</ul>';
  return html.replace(/<\/ul><ul class="core">/g,'');
}
function rangeLabel(r){return `${esc(names[r[0]])} <span class="bk">p.${r[1]}–${r[2]}</span>`}
function bookLinks(bb){const seen=[...new Set(bb.map(r=>r[0]))];return 'iPad PDF: '+seen.map(b=>`<span class="bk">${esc(urls[b])}</span>`).join(' · ')}
function check(key,label){const v=store.get('dr-'+key,false);return `<label class="done"><input type="checkbox" data-k="${key}" ${v?'checked':''}> ${label}</label>`}
function trackBar(){return '<div class="track" aria-hidden="true">'+days.map((d,i)=>`<i class="${d.buf?'buf':''} ${i===cur?'now':(store.get('dr-'+d.n+'-all',false)?'done':'')}"></i>`).join('')+'</div>'}
function renderToday(){
  const d=days[cur];const el=document.getElementById('today');
  const phase=d.buf?'Buffer day':(d.n<=13?'First read':'Second read');
  let h=`<div class="eyebrow">Day ${d.n} of 27 · ${phase}</div><h1>${fmtDate(d.date)}</h1>${trackBar()}`;
  if(d.buf){
    const from=d.n===14?0:14, to=d.n-1;
    const ranges=[];for(let j=from;j<to;j++)if(!days[j].buf)ranges.push(...days[j].bb);
    const ids=[];ranges.forEach(r=>ids.push(...inRange(r[0],r[1],r[2])));
    const uniq=[...new Set(ids)].sort((a,b)=>a-b);
    h+=`<div class="block buf"><h2>Pause</h2><p>Morning: catch up anything pending. If you are on track, read the Rapid Revision Sheets of Papers 1–4.</p><p>Afternoon: one calm pass through the core of every book page read ${d.n===14?'in Days 1–13':'in Days 15–26'} — ${uniq.length} items below.</p>${check(d.n+'-all','Day complete')}</div>`;
    h+=`<div class="block"><div class="recall-head"><h2>Core pass</h2><button class="toggle cz" type="button" aria-pressed="false">Hide numbers</button></div><div class="rl">${renderItems(uniq,{showBook:true})}</div></div>`;
    el.innerHTML=h;wire(el);return;
  }
  const pp=d.pp.map(r=>`<span class="r"><span class="tag ${PAPERS[r[0]]}">${r[0]}</span>p.${r[1]}–${r[2]}</span>`).join('');
  h+=`<div class="block"><h2>Papers <span class="when">7–1 and 3–4</span></h2><div class="ranges">${pp}</div><p class="meta">${d.np} pages · by 1 pm reach ${d.cut}</p>${check(d.n+'-p','Papers done')}</div>`;
  h+=`<div class="block"><h2>Books <span class="when">4–7:30</span></h2><div class="ranges">${d.bb.map(r=>`<span class="r">${rangeLabel(r)}</span>`).join('')}</div><p class="meta">${d.n===1?'Old edition p.1–39 (= iPad p.1–25, Ch 24–59) · ':d.nb+' pages · '}${bookLinks(d.bb)}</p>${check(d.n+'-b','Books done')}</div>`;
  const y=prevStudy(cur,1), w=prevStudy(cur,7);
  let rec='';let n=0;
  if(y!==null){const ids=[];days[y].bb.forEach(r=>ids.push(...inRange(r[0],r[1],r[2])));n+=ids.length;
    rec+=`<div class="src">Yesterday · ${days[y].bb.map(rangeLabel).join(' + ')}</div>${renderItems(ids)}`}
  if(w!==null&&w!==y){const ids=[];days[w].bb.forEach(r=>ids.push(...inRange(r[0],r[1],r[2])));n+=ids.length;
    rec+=`<div class="src">One week back · ${days[w].bb.map(rangeLabel).join(' + ')}</div>${renderItems(ids)}`}
  h+=`<div class="block"><div class="recall-head"><h2>Recall <span class="when">7:30–8</span></h2><button class="toggle cz" type="button" aria-pressed="false">Hide numbers</button></div>`;
  h+= n?`<p class="meta">${n} core items. Say each highlighted number before you reveal it.</p><div class="rl">${rec}</div>`:`<p class="empty">Nothing to recall yet. Tomorrow's recall starts with today's pages.</p>`;
  h+=`${check(d.n+'-r','Recall done')}</div>`;
  el.innerHTML=h;wire(el);
}
function wire(root){
  root.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.onchange=()=>{store.set('dr-'+cb.dataset.k,cb.checked);const d=days[cur];
    if(!d.buf){const all=['p','b','r'].every(x=>store.get('dr-'+d.n+'-'+x,false));store.set('dr-'+d.n+'-all',all)}
    const t=root.querySelector('.track');if(t)t.outerHTML=trackBar()});
  root.querySelectorAll('.cz').forEach(b=>b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);b.textContent=on?'Show numbers':'Hide numbers';const rl=b.closest('.block').querySelector('.rl');if(rl)rl.classList.toggle('cloze',on)});
  root.addEventListener('click',e=>{const k=e.target.closest('.cloze .key');if(k)k.classList.toggle('shown')});
}
document.getElementById('prev').onclick=()=>{if(cur>0){cur--;renderToday();scrollTo(0,0)}};
document.getElementById('next').onclick=()=>{if(cur<days.length-1){cur++;renderToday();scrollTo(0,0)}};
document.getElementById('todayBtn').onclick=()=>{cur=todayIndex();renderToday()};
function updNav(){document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===days.length-1}
const _rt=renderToday;renderToday=function(){_rt();updNav()};
// views
const vT=document.getElementById('vToday'),vC=document.getElementById('vCore');
function view(c){vT.setAttribute('aria-pressed',!c);vC.setAttribute('aria-pressed',c);document.getElementById('today').classList.toggle('hide',c);document.getElementById('core').classList.toggle('hide',!c);document.getElementById('daynav').classList.toggle('hide',c);if(c&&!coreReady)initCore();store.set('dr-view',c)}
vT.onclick=()=>view(false);vC.onclick=()=>view(true);
// core view
let coreReady=false,book=store.get('dr-book',0),limit=150;
function initCore(){coreReady=true;
  const chips=document.getElementById('bookchips');chips.innerHTML=names.map((n,i)=>`<button class="chip" type="button" data-b="${i}" aria-pressed="${i===book}">${esc(n)}</button>`).join('');
  chips.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;book=+b.dataset.b;store.set('dr-book',book);chips.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',+c.dataset.b===book));limit=150;drawCore()};
  let t;document.getElementById('q').addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>{limit=150;drawCore()},220)});
  const cz=document.getElementById('clozeCore');cz.onclick=()=>{const on=cz.getAttribute('aria-pressed')!=='true';cz.setAttribute('aria-pressed',on);cz.textContent=on?'Show numbers':'Hide numbers';document.getElementById('corelist').classList.toggle('cloze',on)};
  document.getElementById('corelist').addEventListener('click',e=>{const k=e.target.closest('.cloze .key');if(k)k.classList.toggle('shown');if(e.target.id==='more'){limit+=300;drawCore()}});
  drawCore()}
function drawCore(){const q=document.getElementById('q').value.trim().toLowerCase();
  let ids;if(q.length>=2){ids=items.map((_,i)=>i).filter(i=>{const it=items[i];return (it[5]+' '+it[3]+' '+it[4]).replace(/<[^>]+>/g,'').toLowerCase().includes(q)})}else ids=byBook[book];
  document.getElementById('ccount').textContent=(q.length>=2?`${ids.length} matches in all books`:`${ids.length} items in ${names[book]}`);
  let html=renderItems(ids.slice(0,limit),{showBook:q.length>=2});
  if(q.length>=2){const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![^<]*>)','gi');html=html.replace(re,'<mark class="hit">$1</mark>')}
  if(ids.length>limit)html+=`<button class="more" id="more" type="button">Show more (${ids.length-limit} left)</button>`;
  document.getElementById('corelist').innerHTML=html}
renderToday();
if(store.get('dr-view',false))view(true);
</script>
