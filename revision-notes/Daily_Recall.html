of Intestinal Segments in Urinary Diversion", "9 · Metabolic complications", "Stomach secretes HCl (alkalosis, low Cl); jejunum secretes NaCl (low Na and Cl, high K); ileum and colon absorb NH<sub>4</sub>Cl (high Cl). <b>Only jejunum is hyperkalaemic</b>."], [10, "l", 31, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "9 · Metabolic complications", "<b>Gastric alkalosis</b> is usually trivial, but severe with renal failure or dehydration, as vomiting raises aldosterone and the kidney retains bicarbonate. Above a <b>gastrin</b> of <span class=\"key\">120 ng/L</span>, small gastrin rises cause large bicarbonate rises, and distension stimulates gastrin. Treat stepwise: rehydration and H2 blocker, arginine HCl if life-threatening, omeprazole, then segment removal."], [10, "l", 32, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "9 · Metabolic complications", "After <b>ureterosigmoidostomy</b>, cancer develops in 6–29% after <span class=\"key\">10–20 yr</span>. Defunctioned anastomoses still develop cancer, so <b>excise them, do not ligate</b>."], [10, "p", 33, "Ch 134 · Continent Urinary Diversion", "1 · Definition and basic principles", "Continence is a pressure balance: low reservoir pressure (from detubularisation) against adequate outlet resistance (sphincter or efferent valve). If either fails, the patient leaks. Camey I (tubular ileum) failed because its pressure was too high."], [10, "a", 33, "Ch 134 · Continent Urinary Diversion", "2 · Patient selection", "<ol>\n<li>Estimated glomerular filtration rate (eGFR) &gt;40.</li>\n<li>Intact external sphincter and adequate bowel.</li>\n<li>Not frail; no severe liver, cardiac or psychological disease.</li>\n<li>Men: no distal prostatic urethral cancer. Women: no palpable anterior vaginal tumour or cervical invasion.</li>\n<li>If all are met and the patient will self-catheterise, offer an orthotopic neobladder.</li>\n</ol>"], [10, "l", 34, "Ch 134 · Continent Urinary Diversion", "2 · Patient selection", "<b>Renal function</b> is the key contraindication. Proceed if creatinine &lt;<span class=\"key\">1.7–2.2 mg/dL</span> or eGFR &gt;<span class=\"key\">35–40 mL/min</span>. All need hydration and oral bicarbonate, avoiding nephrotoxins <span class=\"xref\">see Ch 133</span>."], [10, "a", 35, "Ch 134 · Continent Urinary Diversion", "3 · Preserving continence at cystectomy", "<ol>\n<li>Open the endopelvic fascia; incise the puboprostatic ligaments slightly.</li>\n<li>Ligate the DVC close to the apex.</li>\n<li>Incise the anterior urethra and place sutures.</li>\n<li>Place posterior sutures through the rectourethralis, then divide the posterior urethra.</li>\n<li>Tag the sutures until the ureteroenteric anastomosis is done.</li>\n</ol>"], [10, "a", 35, "Ch 134 · Continent Urinary Diversion", "3 · Preserving continence at cystectomy", "<ol>\n<li>Divide the posterior pedicles and develop the plane off the anterior vagina.</li>\n<li>Use the Foley balloon to mark the bladder–urethra junction.</li>\n<li>Free the bladder neck and the first 0.5 cm of urethra.</li>\n<li>Clamp the bladder neck, divide just distal to it, and send a frozen section.</li>\n</ol>"], [10, "l", 35, "Ch 134 · Continent Urinary Diversion", "4 · Choice of bowel and ureteric reflux", "<b>Antireflux is unnecessary</b>: Valsalva raises pressure equally throughout, and every valve can obstruct. A direct (Wallace or Leadbetter) anastomosis strictures in <span class=\"key\">3–6%</span>, against 7–29% for Le Duc. <b>Obstruction, not reflux, destroys kidneys.</b> Kock nipple failures are late (&gt;10 yr) and silent until bilateral hydronephrosis."], [10, "a", 35, "Ch 134 · Continent Urinary Diversion", "5 · Orthotopic neobladder designs", "<p><b>Studer:</b></p><ol>\n<li>Isolate ileum ending 15–20 cm proximal to the ileocaecal valve; discard ~5 cm proximally; keep a 40–44 cm reservoir (two 20–22 cm limbs) and an afferent limb.</li>\n<li>Open the reservoir, oversew the back wall, and fold it the opposite way.</li>\n<li>Make stented end-to-side ureteroileal anastomoses.</li>\n<li>Join the dependent point to the urethra.</li>\n</ol>"], [10, "p", 36, "Ch 134 · Continent Urinary Diversion", "5 · Orthotopic neobladder designs", "Hautmann vs Studer is a capacity trade-off: a bigger initial pouch is continent sooner but empties worse and absorbs more later."], [10, "l", 37, "Ch 134 · Continent Urinary Diversion", "7 · Perioperative care", "<b>Drainage</b>: 7 Fr single-J stents and a 24 Fr urethral catheter irrigated for mucus; remove the catheter at <span class=\"key\">3 weeks</span>; pouchogram only if drain output is significant. Then timed voids, lengthened progressively, with pelvic floor exercises. For robotic diversion <span class=\"xref\">see Ch 135</span>."], [10, "l", 37, "Ch 134 · Continent Urinary Diversion", "8 · Results and complications", "Day continence comes over <b>3–6 months</b>, ultimately <span class=\"key\">80–90%</span>. Night continence lags into year 2, and nocturnal incontinence persists in <span class=\"key\">20–50%</span>. Risks: age &gt;65, colon, diabetes, no nerve sparing, hysterectomy."], [10, "p", 38, "Ch 134 · Continent Urinary Diversion", "8 · Results and complications", "Men fail by <b>leaking</b> (sphincter without reflexes), so augment the sphincter. Women fail by <b>not emptying</b> (unsupported pouch kinks), so support the pouch."], [10, "l", 39, "Ch 135 · Minimally Invasive Urinary Diversion", "1 · Context", "In the International Robotic Cystectomy Consortium (IRCC), ICUD rose ≈<span class=\"key\">11%/year</span>, driven by the <b>ileal conduit</b> (commonest robotic diversion)."], [10, "r", 39, "Ch 135 · Minimally Invasive Urinary Diversion", "2 · Patient selection", "Neobladder (absolute) · Urethral involvement distal to prostate; creatinine <span class=\"key\">&gt;2 mg/dL</span>; poor hepatic function (as for open)"], [10, "a", 39, "Ch 135 · Minimally Invasive Urinary Diversion", "2 · Patient selection", "<p>Pasadena Consensus learning pathway:</p><ol>\n<li>RARC with extracorporeal diversion.</li>\n<li>Intracorporeal conduit (≈30–100 cases).</li>\n<li>Continent diversion (≈25–50 cases).</li>\n</ol><p>Target time: <span class=\"key\">≤4 h conduit, ≤5 h neobladder</span>.</p>"], [10, "r", 39, "Ch 135 · Minimally Invasive Urinary Diversion", "3 · Perioperative bundle", "Thromboprophylaxis · Pneumatic compression and stockings; low-molecular-weight heparin before and up to <span class=\"key\">4 weeks</span> after"], [10, "r", 39, "Ch 135 · Minimally Invasive Urinary Diversion", "3 · Perioperative bundle", "Antibiotics · Broad-spectrum intravenous within <span class=\"key\">1 h</span>"], [10, "r", 40, "Ch 135 · Minimally Invasive Urinary Diversion", "5 · Nerve sparing", "Sphincter · One-third overlapped by dorsal venous complex (DVC); dorsal penile nerve branches within <span class=\"key\">3 mm</span> of apex · Mainly mid–distal third, so continence survives loss of bladder neck"], [10, "a", 40, "Ch 135 · Minimally Invasive Urinary Diversion", "6 · Intracorporeal ileal conduit", "<ol>\n<li>Pass the left ureter under the sigmoid mesentery to the right.</li>\n<li>Choose 12 cm ileum, 15–20 cm from the ileocaecal valve; place the marionette stitch.</li>\n<li>Isolate with a 45-mm stapler.</li>\n<li>Do ureteroileal anastomoses (left first) and stent.</li>\n<li>Reanastomose bowel, then form the stoma.</li>\n</ol>"], [10, "a", 41, "Ch 135 · Minimally Invasive Urinary Diversion", "7 · Intracorporeal neobladder", "<ol>\n<li>Urethral anastomosis (Van Velthoven barbed suture).</li>\n<li>Detubularise distal 40 cm (cold scissors); form the posterior plate.</li>\n<li>Join ureters to afferent limb or chimney, stented.</li>\n<li>Close the anterior wall once the 22-Fr catheter is confirmed.</li>\n</ol>"], [10, "a", 41, "Ch 135 · Minimally Invasive Urinary Diversion", "7 · Intracorporeal neobladder", "<ol>\n<li>Mobilise the right colon.</li>\n<li>Divide ileum 15 cm from the ileocaecal junction and transverse colon proximal to the middle colic; restore ileocolic continuity at once.</li>\n<li>Detubularise along the anterior taenia and fold.</li>\n<li>Bring ureters through the posterior plate on double-J; 24-Fr caecostomy via appendiceal stump.</li>\n<li>Taper ileum over 14 Fr, imbricate the valve, and form an umbilical stoma.</li>\n</ol>"], [10, "p", 41, "Ch 135 · Minimally Invasive Urinary Diversion", "7 · Intracorporeal neobladder", "Capacity comes from detubularised right colon; continence from tapered ileum and the imbricated ileocaecal valve."], [10, "r", 42, "Ch 135 · Minimally Invasive Urinary Diversion", "8 · Postoperative care", "Neobladder catheter · <span class=\"key\">3–4 weeks</span>, after leak-free pouchogram"], [10, "l", 42, "Ch 135 · Minimally Invasive Urinary Diversion", "9 · Outcomes", "<b>Operative time</b> is a quality measure. Diversion type determines it most (conduit ≈70 min shorter); ICUD and ECUD take similar time. Proficiency needs ≥<span class=\"key\">66 RARCs</span>."], [10, "p", 42, "Ch 135 · Minimally Invasive Urinary Diversion", "9 · Outcomes", "Night continence is worse because the urethrosphincteric guarding reflex is inactive in deep sleep. Continence then depends on reservoir capacity, hence detubularisation, nerve and sphincter preservation, a night alarm and limiting night output. Assess at 6–12 months."], [10, "p", 44, "Ch 124 · Bladder Surgery for Benign Disease", "1 · Surgical anatomy essentials", "Three landmarks organise every benign bladder operation: Retzius for access, the peritoneal reflection for the posterior bladder, and the distal ureter for safety. They decide whether surgery stays extraperitoneal."], [10, "p", 44, "Ch 124 · Bladder Surgery for Benign Disease", "1 · Surgical anatomy essentials", "Common aftercare: watertight <b>two-layer 2-0 polyglactin</b> closure (mucosa, then seromuscular), leak test, large-bore Foley for about <span class=\"key\">1 week</span>, self-suction drain out at about <span class=\"key\">48 h</span> if output is low, and a <b>cystogram before catheter removal</b>. With high drain output, drain creatinine above serum means a urine leak."], [10, "l", 45, "Ch 124 · Bladder Surgery for Benign Disease", "2 · Bladder diverticula", "Treat the cause at the same sitting: transurethral prostate surgery, or simple prostatectomy for glands <span class=\"key\">&gt;80 cc</span>, and augmentation for neurogenic bladder. Do <b>endoscopic outlet surgery first</b>, because later irrigation disrupts fresh suture lines."], [10, "a", 45, "Ch 124 · Bladder Surgery for Benign Disease", "2 · Bladder diverticula", "<p><b>Open intravesical diverticulectomy</b></p><ol>\n<li>Put the anterior superior iliac spine (ASIS) at the table break; fill via an 18 Fr Foley with about 200 mL.</li>\n<li>Lower midline incision; split recti; incise transversalis fascia.</li>\n<li>Sweep peritoneum off the dome and open a vertical cystotomy with 2-0 stays.</li>\n<li>Identify the orifices (5 Fr ureteral catheter if concerned) and excise the sac.</li>\n<li>Place a 20–22 Fr Foley, close in two layers, leak-test; optional suprapubic catheter; pelvic drain.</li>\n</ol>"], [10, "r", 46, "Ch 124 · Bladder Surgery for Benign Disease", "2 · Bladder diverticula", "Delivery · Allis clamp everts the sac, or it is dissected from the pseudocapsule from inside; mucosal incision about <span class=\"key\">0.5 cm</span> round the neck · A finger in the sac pushes it out; the neck is incised circumferentially from outside"], [10, "l", 46, "Ch 124 · Bladder Surgery for Benign Disease", "2 · Bladder diverticula", "Use lithotomy, steep Trendelenburg, and cystoscopy first. Pneumoperitoneum is <span class=\"key\">15 mm Hg</span>, with the assistant port opposite the sac."], [10, "a", 46, "Ch 124 · Bladder Surgery for Benign Disease", "2 · Bladder diverticula", "<p><b>Managing a leak</b></p><ol>\n<li>If asymptomatic, keep Foley and drain.</li>\n<li>If a symptomatic collection forms, drain it percutaneously.</li>\n<li>Do a cystogram before removal; if the leak persists, choose nephrostomies or exploration and closure.</li>\n</ol>"], [10, "p", 46, "Ch 124 · Bladder Surgery for Benign Disease", "2 · Bladder diverticula", "Diverticulectomy is a dissection problem: find the sac, stay in the sac–pseudocapsule plane, keep the ureter in view, close the seromuscular defect securely, and fix the outlet first."], [10, "l", 47, "Ch 124 · Bladder Surgery for Benign Disease", "3 · Bladder stones, foreign bodies and fistulae", "<b>Percutaneous</b>: through a 1-cm incision two fingerbreadths above the symphysis, a needle is passed under ultrasound or cystoscopic vision and dilated to a <span class=\"key\">30 Fr</span> sheath for a 24–26 Fr nephroscope. Stones &lt;1 cm are grasped whole, larger ones fragmented; the suprapubic catheter is clamped at 24–48 h."], [10, "l", 47, "Ch 124 · Bladder Surgery for Benign Disease", "3 · Bladder stones, foreign bodies and fistulae", "<b>Transvesical laparoscopy</b> uses a pneumovesicum of <span class=\"key\">8–12 mm Hg</span>, avoids the peritoneum and suits eroded mesh. Transperitoneal laparoscopic or robotic cystolithotomy allows simultaneous prostatectomy or diverticulectomy. Aftercare: Foley about 1 week, cystogram."], [10, "l", 48, "Ch 124 · Bladder Surgery for Benign Disease", "4 · Partial cystectomy for benign disease and urachal surgery", "Excise full thickness with about a <span class=\"key\">2-cm margin</span> if capacity allows, with frozen-section margins; reimplant if the orifice is involved; 22 Fr Foley, two-layer closure, drain. Minimally invasive: transillumination or laparoscopic ultrasound outlines the margin, and a ureteral catheter protects the ureter."], [10, "p", 48, "Ch 124 · Bladder Surgery for Benign Disease", "4 · Partial cystectomy for benign disease and urachal surgery", "Leiomyoma, paraganglioma and endometriosis infiltrate and recur if incompletely excised, so benign partial cystectomy borrows cancer discipline (exclude cancer, no spillage, a margin). Urachal surgery is the exception: the whole tract matters, not a wide margin."], [10, "p", 49, "Ch 124 · Bladder Surgery for Benign Disease", "6 · Ureteral reimplantation in adults", "Refluxing reimplantation is acceptable in adults. VUR is rarely the indication, and refluxing anastomoses show no faster renal decline, more stenosis or more infection than tunnelled ones, while needing less ureter and less bladder mobilisation."], [10, "r", 49, "Ch 124 · Bladder Surgery for Benign Disease", "6 · Ureteral reimplantation in adults", "Tunnel · <span class=\"key\">3–5 × ureteric diameter</span> (5:1 robotically) · None"], [10, "l", 50, "Ch 124 · Bladder Surgery for Benign Disease", "6 · Ureteral reimplantation in adults", "Ureteric sutures are full-thickness; bladder bites take mucosa plus some detrusor; knots lie outside the lumen. The stent is a <span class=\"key\">6 Fr × 26–28 cm double-J</span>."], [10, "l", 50, "Ch 124 · Bladder Surgery for Benign Disease", "6 · Ureteral reimplantation in adults", "Primary reimplantation suits defects up to <span class=\"key\">4 cm</span>; longer gaps need a psoas hitch or Boari flap; renal descent adds up to <span class=\"key\">5 cm</span>. More bladder reach: divide the contralateral medial umbilical ligament, free peritoneum off the dome, ligate the contralateral pedicle."], [10, "l", 50, "Ch 124 · Bladder Surgery for Benign Disease", "6 · Ureteral reimplantation in adults", "Aftercare: Foley for 1 week with a cystogram; stent for <span class=\"key\">≈6 weeks</span>."], [10, "p", 50, "Ch 124 · Bladder Surgery for Benign Disease", "6 · Ureteral reimplantation in adults", "Reimplantation fails from ischaemia or tension. Every rule (preserve adventitia, spatulate, enter superior-medial toward the bladder neck, bridge rather than stretch) prevents one or the other. The robot mainly eases intracorporeal suturing."], [10, "r", 51, "Ch 124 · Bladder Surgery for Benign Disease", "7 · Bridging distal ureteral defects", "<b>Boari flap</b> · Up to <span class=\"key\">15 cm</span> · Base ≥<span class=\"key\">4 cm</span>, apex ≥<span class=\"key\">3 cm</span>, length:base ≤<span class=\"key\">3:1</span>"], [10, "p", 51, "Ch 124 · Bladder Surgery for Benign Disease", "7 · Bridging distal ureteral defects", "The bladder is the donor tissue: hitch first, flap second. Every flap rule (base width, 3:1, measure empty) protects the flap's blood supply and bladder capacity."], [10, "r", 51, "Ch 124 · Bladder Surgery for Benign Disease", "8 · Enterocystoplasty (augmentation)", "<b>Ileum</b> (commonest) · 25 cm taken <span class=\"key\">≈20 cm</span> proximal to the ileocaecal valve (spares B12 and bile-salt absorption); acidosis risk"], [10, "a", 52, "Ch 124 · Bladder Surgery for Benign Disease", "8 · Enterocystoplasty (augmentation)", "<ol>\n<li>Isolate ileum and check reach to the dome.</li>\n<li>Transilluminate mesentery, staple, keep a broad mesenteric base.</li>\n<li>Side-to-side bowel anastomosis; close the window.</li>\n<li><b>Detubularise</b> on the antimesenteric border and fold into a U.</li>\n<li><b>Bivalve the bladder widely</b> and make a wide-mouthed anastomosis.</li>\n<li>Suprapubic tube with or without Foley; leak-test; drain.</li>\n</ol>"], [10, "l", 52, "Ch 124 · Bladder Surgery for Benign Disease", "8 · Enterocystoplasty (augmentation)", "Stones are the commonest long-term complication. Neoplasia risk means surveillance endoscopy from <span class=\"key\">10 years</span>. Irrigation may reduce mucus; check metabolic and vitamin bloods routinely. Continence and satisfaction are high, but secondary procedures are common."], [10, "p", 52, "Ch 124 · Bladder Surgery for Benign Disease", "8 · Enterocystoplasty (augmentation)", "Augmentation exchanges a pressure problem for a lifelong bowel-in-bladder problem. Detubularisation and a wide-mouthed anastomosis win the pressure battle; catheterisation, irrigation, bloods and endoscopic surveillance are the price."], [10, "a", 52, "Ch 124 · Bladder Surgery for Benign Disease", "9 · Continent catheterisable channels", "<p><b>Minimally invasive appendicovesicostomy</b></p><ol>\n<li>Detach the appendix with a caecal cuff and spatulate it.</li>\n<li>Make a ≈4-cm submucosal detrusor tunnel; anastomose with 4-0 polydioxanone.</li>\n<li>Bring the stoma to the right lower quadrant or umbilicus.</li>\n<li>Drain the bladder for <span class=\"key\">2–4 weeks</span>. Continence is <span class=\"key\">&gt;95%</span>.</li>\n</ol>"], [10, "p", 53, "Ch 124 · Bladder Surgery for Benign Disease", "9 · Continent catheterisable channels", "Use the appendix when present and long enough; reconfigure ileum when not. Continence comes from tunnel length through detrusor, and missed catheterisation endangers the bladder, not just the channel."], [10, "r", 54, "★ Putting it together", "C · Choosing the diversion See Ch 133–135", "Must have · Usable (non-irradiated) ileum · eGFR <span class=\"key\">&gt;35–40</span>; intact sphincter; negative urethral frozen section; will catheterise · eGFR &gt;35–40; dexterity; efferent limb (appendix, tapered ileum)"], [10, "a", 55, "★ Putting it together", "E · Metastatic urothelial carcinoma", "<ol>\n<li><b>Fitness</b>: cisplatin-, platinum-only or platinum-ineligible.</li>\n<li><b>First line</b>: enfortumab vedotin (EV) with pembrolizumab (EV-302); otherwise gem–cis (gem–carbo if cisplatin-ineligible).</li>\n<li><b>If no progression on platinum</b>, give avelumab maintenance (JAVELIN Bladder 100).</li>\n<li><b>Later lines</b>: pembrolizumab; erdafitinib (if FGFR-altered); EV; sacituzumab govitecan. If platinum-ineligible, pembrolizumab first. <span class=\"xref\">See Ch 131</span></li>\n</ol>"], [11, "l", 2, "Ch 136 · Benign Renal Tumours", "1 · The benign small renal mass", "Up to <span class=\"key\">~25%</span> of surgically treated small renal masses (SRMs) are benign."], [11, "l", 2, "Ch 136 · Benign Renal Tumours", "2 · Renal cysts and the Bosniak classification", "A <b>simple cyst</b> (any size, homogeneous, <span class=\"key\">≤20 Hounsfield units (HU)</span>) needs no further imaging. Otherwise use Bosniak."], [11, "r", 2, "Ch 136 · Benign Renal Tumours", "2 · Renal cysts and the Bosniak classification", "I · Thin (<span class=\"key\">≤2 mm</span>) smooth wall (may enhance); simple fluid; no septa or calcification · Benign · No follow-up"], [11, "r", 2, "Ch 136 · Benign Renal Tumours", "2 · Renal cysts and the Bosniak classification", "II · Thin wall plus (a) <span class=\"key\">≤3</span> thin enhancing septa, any calcification; or (b) homogeneous marked T2 hyperintensity; or (c) marked T1 hyperintensity · Highly likely benign · No follow-up"], [11, "r", 2, "Ch 136 · Benign Renal Tumours", "2 · Renal cysts and the Bosniak classification", "IIF · Minimally thickened (<span class=\"key\">3 mm</span>) enhancing wall or septum, or <span class=\"key\">≥4</span> thin septa; or heterogeneous T1 hyperintensity on fat-saturated magnetic resonance imaging (MRI) · Likely benign · Active surveillance up to <span class=\"key\">5 yr</span>"], [11, "r", 2, "Ch 136 · Benign Renal Tumours", "2 · Renal cysts and the Bosniak classification", "III · Enhancing thick (<span class=\"key\">≥4 mm</span>) or irregular (≤3 mm obtuse-margined protrusion) wall or septum · <span class=\"key\">~50%</span> · ≤2 cm: surveillance preferred; 2–4 cm: surveillance or excision (shared decision); &gt;4 cm: excision, partial (PN) over radical nephrectomy (RN) when feasible"], [11, "r", 2, "Ch 136 · Benign Renal Tumours", "2 · Renal cysts and the Bosniak classification", "IV · Enhancing nodule: ≥4 mm obtuse-margined, or any-size acute-margined protrusion · <span class=\"key\">~90%</span>"], [11, "p", 2, "Ch 136 · Benign Renal Tumours", "2 · Renal cysts and the Bosniak classification", "Ladder: wall ≤2 mm, then 3 mm, then ≥4 mm, then irregular, then nodule. Traps: any calcification fits II; a class I wall may enhance; large hyperdense cysts are no longer IIF; growth of I/II is not malignancy."], [11, "p", 2, "Ch 136 · Benign Renal Tumours", "2 · Renal cysts and the Bosniak classification", "<b>Why surveil small III/IV?</b> Class III has a low positive predictive value. Cystic RCC is indolent: mostly fluid, so size predicts poorly (proposed <b>pT1c</b>). The number needed to treat is therefore very high."], [11, "l", 3, "Ch 136 · Benign Renal Tumours", "2 · Renal cysts and the Bosniak classification", "Acquired cystic kidney disease (ACKD) cysts arise from the proximal tubule; <span class=\"key\">80%</span> have them by 10 yr of dialysis."], [11, "l", 3, "Ch 136 · Benign Renal Tumours", "2 · Renal cysts and the Bosniak classification", "The chapter puts ACKD RCC risk at <span class=\"key\">≥10×</span> (multifocal, bilateral, papillary commoner; a distinct WHO 2022 entity)."], [11, "l", 3, "Ch 136 · Benign Renal Tumours", "2 · Renal cysts and the Bosniak classification", "PKD1 relatives aged 15–29 need <span class=\"key\">≥3 cysts</span>; a normal scan excludes disease only from age 40."], [11, "p", 3, "Ch 136 · Benign Renal Tumours", "3 · Oncocytoma", "<b>Why can a core not clear oncocytoma?</b> Sampling error, and chRCC has oncocytic areas, so a minority of biopsy \"oncocytomas\" are RCC. EAU: no definitive core diagnosis; CK7 and cytogenetics help."], [11, "a", 4, "Ch 136 · Benign Renal Tumours", "4 · Angiomyolipoma", "<ol>\n<li><b>Spontaneous retroperitoneal haemorrhage</b> (Wunderlich<span class=\"dag\">†</span>): resuscitate, then <b>SAE</b>. Nephrectomy only if SAE is unavailable or unsuitable.</li>\n<li><b>Symptomatic</b> (pain, haematuria, barriers to care): SAE, then nephron-sparing surgery (NSS) or RN; ablation in selected cases.</li>\n<li><b>Asymptomatic sporadic</b>: if &gt;<span class=\"key\">6 cm</span>, aneurysm <span class=\"key\">≥5 mm</span>, growth &gt;<span class=\"key\">0.25 cm/yr</span>, or childbearing age/pregnancy, then treat; otherwise surveil.</li>\n<li><b>TSC</b>: if &gt;<span class=\"key\">3 cm</span> or growing, then everolimus first line; SAE or kidney-sparing resection second.</li>\n</ol>"], [11, "p", 4, "Ch 136 · Benign Renal Tumours", "4 · Angiomyolipoma", "<b>Why abandon 4 cm?</b> It is poorly specific, so it caused overtreatment; AML &lt;4 cm is surveilled. \"Barriers to care\" counts because surveillance needs access to imaging and emergency care. In pregnancy, treat before conception."], [11, "l", 4, "Ch 136 · Benign Renal Tumours", "5 · Other benign epithelial and mesenchymal tumours", "<b>Papillary adenoma</b> is unencapsulated and <span class=\"key\">≤15 mm</span>. It shares +7, +17, −Y with papillary RCC but cannot metastasise; acceptable in a donor kidney."], [11, "r", 4, "Ch 136 · Benign Renal Tumours", "6 · Landmark trial", "EXIST-2 · Phase III randomised trial, everolimus vs placebo, AML in TSC or lymphangioleiomyomatosis · ≥50% volume reduction <span class=\"key\">42% vs 0%</span>; no bleeding needing embolisation · Approved; mTOR inhibition first line in TSC"], [11, "p", 5, "Ch 137 · Malignant Renal Tumours", "2 · Classification & pathology", "Trap: epithelioid angiomyolipoma (AML) is malignant; classic AML, papillary adenoma and oncocytoma are benign. The papillary type 1/2 split was <b>abandoned</b> because \"type 2\" was several diseases (MET-altered, MiT translocation, FH-deficient) with different prognoses. WHO therefore moved to molecular definitions."], [11, "p", 7, "Ch 137 · Malignant Renal Tumours", "2 · Classification & pathology", "Localised clear cell RCC does worse than papillary or chromophobe because it is intrinsically aggressive. Yet metastatic clear cell does better, because VHL-driven angiogenesis and immunogenicity make it respond to tyrosine kinase inhibitors (TKIs) and immune checkpoint inhibitors (ICIs)."], [11, "a", 7, "Ch 137 · Malignant Renal Tumours", "3 · Molecular biology & hereditary syndromes", "<ol>\n<li>Normoxia: the VHL protein joins elongin B/C, cullin-2 and RBX1 to form an E3 ligase, which degrades hypoxia-inducible factor (HIF)-1α/2α.</li>\n<li>If VHL is lost (or in hypoxia), <b>HIF-2α</b> accumulates and pairs with ARNT. This raises VEGF (vascular endothelial growth factor), PDGF, TGF-α, GLUT1, erythropoietin (EPO) and CA-IX → hypervascular clear cell RCC.</li>\n</ol>"], [11, "a", 9, "Ch 137 · Malignant Renal Tumours", "5 · Diagnosis", "<ol>\n<li>If simple cyst, then observe.</li>\n<li>If complex or solid: eGFR &gt;45 → CT or MRI with/without contrast; eGFR 30–45 → hydrate, then the same; eGFR &lt;30 → non-contrast CT or gadolinium MRI; contrast allergy → ultrasound (USG), contrast USG or MRI.</li>\n<li>Then: fat → AML; complex cyst → Bosniak; solid enhancing → management options, with or without RMB.</li>\n</ol>"], [11, "p", 10, "Ch 137 · Malignant Renal Tumours", "6 · Staging & prognosis", "TNM limitation: stage is set by the single worst feature, so co-existing adverse features (e.g. adrenal invasion plus a supradiaphragmatic thrombus) are lost. Record all of them and use integrated nomograms."], [11, "p", 14, "Ch 137 · Malignant Renal Tumours", "10 · Other renal malignancies", "Non-RCC malignancies are almost all <b>hypovascular</b>. The key decision is surgical (sarcoma, carcinoid) vs medical (lymphoma, metastasis: biopsy, don't resect). RCC nodes are interaortocaval (right) or para-aortic (left); nodes elsewhere suggest lymphoma. A solitary enhancing mass years after an organ-confined non-renal cancer is more likely a primary RCC."], [11, "l", 15, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "1 · Epidemiology & risk factors", "Bilateral ≤5%; multifocal <span class=\"key\">10–20%</span>; concomitant carcinoma in situ (CIS) 11–36%; 7–9% metastatic at diagnosis; contralateral upper tract recurrence 2–6%."], [11, "l", 15, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "1 · Epidemiology & risk factors", "Upper tract urothelial carcinoma (UTUC) is <span class=\"key\">5–10%</span> of urothelial cancers; in the Balkans it is <span class=\"key\">40%</span> of renal neoplasms. Concurrent bladder cancer occurs in <span class=\"key\">17%</span>; ~60% are invasive at diagnosis."], [11, "l", 15, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "1 · Epidemiology & risk factors", "After UTUC, the bladder recurs in <span class=\"key\">22–47%</span>."], [11, "p", 15, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "1 · Epidemiology & risk factors", "<b>Why UTUC presents invasive:</b> the muscle layer is thin (mesodermal), so tumours reach muscle, parenchyma or periureteric fat earlier than bladder tumours."], [11, "l", 15, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "1 · Epidemiology & risk factors", "<b>Smoking</b> carries a relative risk (RR) of <span class=\"key\">2.5–7</span>. Occupational exposure averages ≈7 yr. Chronic infection or stones carry RR 1.5–2 (squamous cell carcinoma, SCC)."], [11, "p", 15, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "1 · Epidemiology & risk factors", "Aristolochic acid, arsenic, phenacetin and Lynch all behave as a <b>field disease</b> (multiple, bilateral recurrences). This makes kidney-sparing treatment more attractive, but Balkan endemic nephropathy (BEN) patients often have renal insufficiency. Analgesic abuse history is present in 22% of pelvic and 11% of ureteric tumours."], [11, "l", 15, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "1 · Epidemiology & risk factors", "<b>Lynch</b>: UTUC risk is ≈<span class=\"key\">14×</span>, and ≈<span class=\"key\">75×</span> in MSH2 carriers. If mismatch repair (MMR) proteins are lost on immunohistochemistry (IHC), do germline testing."], [11, "l", 15, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "2 · Pathology & molecular biology", "Over 90% are urothelial carcinoma (UC). Variant histology (≈<span class=\"key\">25%</span>: squamous, glandular, sarcomatoid, micropapillary, neuroendocrine, lymphoepithelial) is aggressive; <b>micropapillary</b> is independently adverse. CIS is easily missed."], [11, "l", 16, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "2 · Pathology & molecular biology", "Ureteric inverted papilloma harbours malignancy in ≈<span class=\"key\">18%</span>, so follow it for ≥2 yr."], [11, "l", 16, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "3 · Diagnosis", "<b>CT urography (CTU)</b> is first line (EAU prefers it to MR urography (MRU)): sensitivity ≈<span class=\"key\">92%</span>, specificity ≈95%. A filling defect is seen in 50–75%; flat lesions are missed. UC is ≈46 HU vs ≈100 HU for a uric acid stone. Hydronephrosis means an invasive ureteric tumour in up to 80%."], [11, "p", 16, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "3 · Diagnosis", "<b>Why URS biopsy cannot stage:</b> samples are small and shallow, so a Ta biopsy is often T3 at resection. Stage is <b>inferred</b> from grade, appearance, hydronephrosis and cytology, which is why kidney-sparing patients need intensive follow-up."], [11, "l", 17, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "5 · Prognosis & risk stratification", "Pre-op factors: age (never alone a reason to deny RNU), smoking, ASA/ECOG status, obesity, low albumin, high NLR/CRP. Do <b>RNU within <span class=\"key\">12 wk</span></b> for invasive disease. Size <span class=\"key\">2 cm</span> is the best cut-off for ≥pT2."], [11, "p", 17, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "5 · Prognosis & risk stratification", "Every pre-op factor is a stand-in for invasion, so one adverse feature means high risk. <b>Trap:</b> a small, low-grade, unifocal tumour <b>with hydronephrosis is high risk</b>."], [11, "l", 17, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "6 · Recurrence patterns", "Upper tract tumours after bladder cancer: 2–4%, late (median &gt;3 yr), and 0.75–6.4% after cystectomy. About <span class=\"key\">30%</span> of bacillus Calmette–Guérin (BCG)-treated bladder CIS (or cystectomy for BCG-refractory disease) develop UTUC. Risk factors: distal ureter/orifice tumour, multifocal or recurrent non-muscle-invasive bladder cancer, CIS, reflux."], [11, "p", 18, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "6 · Recurrence patterns", "<b>Asymmetric recurrence:</b> antegrade seeding makes bladder recurrences common, early and monoclonal; the field effect gives multifocal tumours of different clones. Both operate."], [11, "a", 18, "Ch 138 · Urothelial Tumours of the Upper Urinary Tract and Ureter", "7 · Management overview & follow-up", "<ol>\n<li>Work-up: cystoscopy and CTU, with or without URS biopsy and cytology; assess contralateral function; screen for LS; then assign the risk group.</li>\n<li>If <b>low risk</b>, then kidney-sparing treatment (endoscopic or segmental) with intensive surveillance.</li>\n<li>If <b>high risk</b>, then RNU with bladder cuff, with or without LND, within 12 wk.</li>\n<li>If <b>cN+</b>, then systemic chemotherapy first, and surgery only if there is a response.</li>\n<li>After RNU, give a single intravesical chemotherapy dose; all patients have cystoscopic follow-up.</li>\n</ol>"], [11, "p", 19, "Ch 139 · Surgical Management of Upper Urinary Tract Urothelial Tumours", "1 · Principles & patient selection", "Low grade does not mean automatic ablation: obstruction or multifocality makes an LG tumour unfavourable, where RNU keeps a role."], [11, "p", 19, "Ch 139 · Surgical Management of Upper Urinary Tract Urothelial Tumours", "1 · Principles & patient selection", "Two axes: tumour risk and renal reserve. High risk with adequate reserve means extirpation; low risk means preservation. Imperative indications are where they conflict."], [11, "a", 20, "Ch 139 · Surgical Management of Upper Urinary Tract Urothelial Tumours", "1 · Principles & patient selection", "<ol>\n<li>Imaging suspicion: CT or MR urogram.</li>\n<li>Endoscopy with biopsy and cytology; assign risk group; shared decision.</li>\n<li>If high risk with adequate glomerular filtration rate (GFR), then RNU with or without neoadjuvant chemotherapy.</li>\n<li>If low risk or poor GFR, then kidney-sparing management (KSM).</li>\n</ol>"], [11, "l", 20, "Ch 139 · Surgical Management of Upper Urinary Tract Urothelial Tumours", "2 · Endoscopic (kidney-sparing) management", "<b>Grade</b> is the key selector and the strongest predictor of recurrence; HG results are poor. AUA/SUO: tumours <span class=\"key\">&lt;1.5 cm</span>; caution at ≥1.5 cm."], [11, "p", 21, "Ch 139 · Surgical Management of Upper Urinary Tract Urothelial Tumours", "2 · Endoscopic (kidney-sparing) management", "Does URS spread tumour? Prior ureteroscopy increases bladder recurrence (seeding), but pre-RNU URS has not increased metastasis. A single post-op intravesical instillation mitigates this."], [11, "l", 21, "Ch 139 · Surgical Management of Upper Urinary Tract Urothelial Tumours", "3 · Segmental ureterectomy", "Ipsilateral recurrence is <span class=\"key\">33–55%</span>, mostly distal to the original site, and lifelong."], [11, "a", 22, "Ch 139 · Surgical Management of Upper Urinary Tract Urothelial Tumours", "4 · Positive cytology & carcinoma in situ (CIS)", "<ol>\n<li>Positive voided cytology: repeat it.</li>\n<li>CT urogram and bladder biopsies. If the bladder is positive, then treat the bladder.</li>\n<li>If still positive with a negative bladder (or after bacillus Calmette–Guérin [BCG] \"6+1\"), then selective upper-tract cytology, retrograde pyelography (RPG), prostatic urethral biopsy (men) and URS.</li>\n</ol>"], [11, "l", 22, "Ch 139 · Surgical Management of Upper Urinary Tract Urothelial Tumours", "6 · Radical nephroureterectomy", "Remove the <b>entire intramural ureter and orifice</b>: a retained stump recurs in <span class=\"key\">30–75%</span>, cannot be surveyed and worsens survival. After bowel diversion, excise the ureteroenteric anastomosis with a bowel cuff."], [11, "p", 23, "Ch 139 · Surgical Management of Upper Urinary Tract Urothelial Tumours", "6 · Radical nephroureterectomy", "Principle beats approach: port-site seeding and carcinomatosis follow spillage, not the approach."], [11, "l", 23, "Ch 139 · Surgical Management of Upper Urinary Tract Urothelial Tumours", "7 · Perioperative adjuncts", "<b>Renal function is the hinge</b>, so give platinum <b>before</b> nephrectomy. Neoadjuvant is favoured if post-op creatinine clearance (CrCl) is expected <span class=\"key\">&lt;50</span> mL/min."], [11, "r", 25, "Ch 139 · Surgical Management of Upper Urinary Tract Urothelial Tumours", "10 · Landmark trials", "POUT · Phase III adjuvant platinum vs surveillance, pT2–4/N+ · Stopped early; disease-free survival (DFS) hazard ratio <span class=\"key\">0.45</span>; 3-yr DFS 71% vs 46% · Adjuvant platinum standard after RNU for ≥pT2/N+"], [11, "l", 26, "Ch 141 · Contemporary Open Surgery of the Kidney", "1 · Role & preoperative work-up", "If GFR is <span class=\"key\">&lt;60</span> or there is significant proteinuria, ask for a perioperative nephrology consult. Optimise diabetes and hypertension even if GFR is ≥60."], [11, "l", 26, "Ch 141 · Contemporary Open Surgery of the Kidney", "1 · Role & preoperative work-up", "Contrast is generally safe if GFR is <span class=\"key\">&gt;30</span>. If thrombus is suspected, MR or CT venography must be <b>≤1 month old</b>, because thrombus propagates rapidly."], [11, "l", 26, "Ch 141 · Contemporary Open Surgery of the Kidney", "2 · Surgical anatomy & approaches", "The <b>SMA</b> leaves the front of the aorta <span class=\"key\">1–2 cm above LRV</span> and veers left, so it can be mistaken for the left renal artery."], [11, "a", 28, "Ch 141 · Contemporary Open Surgery of the Kidney", "4 · Radical nephrectomy", "<ol>\n<li><b>Right:</b> survey the abdomen; open Toldt's line down to the iliac vessels; take down the hepatic flexure; Kocher; expose the IVC.</li>\n<li>Loop and palpate the renal vein; find the artery behind it; tie <b>artery, then vein</b>; remove the kidney outside Gerota's.</li>\n<li><b>Difficult hilum:</b> ligate the artery in the interaortocaval space, so the kidney decompresses. Check the now flaccid vein and double-ligate it (0 silk and 3-0 Prolene), then divide the artery laterally.</li>\n<li>Alternative: start at the lower pole, divide the ureter and gonadal vein, and lift the kidney from posterior to anterior to show the artery.</li>\n<li><b>Left:</b> mobilise the splenic flexure down to the iliacs; divide the renocolic ligament (pad the pancreas).</li>\n<li>Follow the aorta, or gonadal vein upward, to the LRV. Tie the artery above and behind it (0 silk and 3-0 Prolene), confirm occlusion, then the vein.</li>\n</ol>"], [11, "p", 28, "Ch 141 · Contemporary Open Surgery of the Kidney", "4 · Radical nephrectomy", "<b>Why artery first?</b> Tying the vein first leaves the kidney engorged, so collaterals bleed. Arterial ligation shrinks the kidney and softens the vein, which can then be checked for thrombus. A persisting pulse means an accessory artery, incomplete control, or the SMA has been tied."], [11, "l", 28, "Ch 141 · Contemporary Open Surgery of the Kidney", "4 · Radical nephrectomy", "<b>Adrenalectomy</b> only for an upper-pole tumour with a lost plane, an adrenal mass or diffuse involvement. Metastasis occurs in <span class=\"key\">&lt;5%</span>, and CT or MRI misses 20–25%."], [11, "l", 28, "Ch 141 · Contemporary Open Surgery of the Kidney", "4 · Radical nephrectomy", "<b>Do LND if nodes are enlarged</b>: a short axis <span class=\"key\">≥1.5 cm ≈ 50% positive</span>. Consider it in high risk (cytoreduction, &gt;10 cm, grade ≥3, sarcomatoid, thrombus, T4)."], [11, "l", 28, "Ch 141 · Contemporary Open Surgery of the Kidney", "5 · IVC tumour thrombectomy", "RCC is the commonest cause (<span class=\"key\">5–10%</span> of RCC); others are Wilms tumour and adrenocortical carcinoma. Untreated, most die within 1 yr. Surgery (RN and LND, with or without systemic therapy) is the backbone."], [11, "r", 29, "Ch 141 · Contemporary Open Surgery of the Kidney", "5 · IVC tumour thrombectomy", "I · IVC <span class=\"key\">≤2 cm</span> above ostium · Milk back, Satinsky partial clamp, ostial cavotomy"], [11, "a", 29, "Ch 141 · Contemporary Open Surgery of the Kidney", "5 · IVC tumour thrombectomy", "<ol>\n<li><b>Level I (right):</b> control the IVC before handling the tumour; ligate the right artery interaortocavally.</li>\n<li>Loop the LRV and the suprarenal and infrarenal IVC with <b>Rummel tourniquets</b>.</li>\n<li>Milk the thrombus toward the ostium; place a Satinsky round the ostium with the thrombus inside the jaws.</li>\n<li>Do an ostial cavotomy keeping ≥half the IVC width, and extract.</li>\n<li><b>Level I–II:</b> ligate the renal artery early. Tighten tourniquets in order: <b>infrarenal IVC, contralateral renal vein, suprarenal IVC</b>.</li>\n<li>Open the cava, extract, flush with heparinised saline and inspect the wall (resect suspicious intima). Close with 4-0 Prolene.</li>\n<li>Release the <b>caudal clamp first</b>, flush 5–10 mL on a held breath, then release the cranial clamp.</li>\n</ol>"], [11, "l", 30, "Ch 141 · Contemporary Open Surgery of the Kidney", "5 · IVC tumour thrombectomy", "The <b>Pringle</b> manoeuvre (clamping the portal vein, hepatic artery and bile duct) is needed if clamping above the hepatic veins. Limit it to ≤60 min, ideally <span class=\"key\">≤20 min</span>. Pringle with clamps above and below the liver gives total hepatic vascular occlusion."], [11, "p", 30, "Ch 141 · Contemporary Open Surgery of the Kidney", "5 · IVC tumour thrombectomy", "<b>\"Shortcuts\" that become \"longcuts\":</b> opening the IVC before all inflow is controlled; side-biting a level I; clips on the IVC side; incomplete arterial control; forceful milking (embolus, tear); clamping before volume loading or skipping the test clamp."], [11, "r", 31, "Ch 141 · Contemporary Open Surgery of the Kidney", "6 · Partial nephrectomy", "Warm ischaemia · Aim <span class=\"key\">&lt;30 min</span>; within limits, preserved parenchyma dominates"], [11, "p", 31, "Ch 141 · Contemporary Open Surgery of the Kidney", "6 · Partial nephrectomy", "PN trades nephrons lost to the margin against nephrons injured by ischaemia. Within accepted limits, the <b>volume of parenchyma preserved</b> matters more than clamp minutes. Hypothermia and mannitol are optional (their role in solitary kidney or CKD is unclear)."], [11, "l", 33, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "1 · Principles & patient selection", "First laparoscopic nephrectomy: <b>Clayman, 1991</b> <span class=\"tag\">MCQ</span>; first laparoscopic partial nephrectomy (PN): Winfield, 1993."], [11, "p", 33, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "1 · Principles & patient selection", "The patient must tolerate the <b>pneumoperitoneum</b>, not the renal operation: cardiopulmonary reserve, not age or BMI, decides fitness."], [11, "l", 33, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "2 · Access & port placement", "<b>Robotic</b> arms are spaced <span class=\"key\">8 cm (Si) / 6 cm (Xi)</span>, with a 12 mm assistant port. Ports form a <b>broad-based triangle</b> with the camera at the apex."], [11, "p", 34, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "2 · Access & port placement", "RP pitfalls: a balloon inflated within muscle causes a flank hernia; too anterior injures the peritoneum or colon; too posterior makes the quadratus or psoas bleed. Bail-out: open the peritoneum and continue transperitoneally."], [11, "a", 34, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "3 · Nephrectomy — operative steps", "<ol>\n<li>Reflect colon; find ureter and gonadal vessels on the psoas.</li>\n<li>Lift kidney to expose the hilum; artery, then vein.</li>\n<li>Upper pole (adrenal spared or taken); ureter and lateral attachments; bag; extract.</li>\n</ol>"], [11, "p", 35, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "4 · Simple vs radical nephrectomy", "Access changes morbidity and recovery, never oncology: early arterial control, en bloc removal and intact bagged extraction carry over from open surgery."], [11, "a", 35, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "5 · Partial nephrectomy", "<ol>\n<li>Intraoperative ultrasound (size, depth); open Gerota's away from the lesion; score the capsule.</li>\n<li>Clamp the hilum (Satinsky en bloc or bulldogs); cold-scissor excision.</li>\n<li>Close vessels and collecting system; renorrhaphy; unclamp; drain.</li>\n</ol>"], [11, "l", 35, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "5 · Partial nephrectomy", "<b>Trifecta:</b> negative margin, no major complication within 30 days, and <span class=\"key\">WIT ≤25 min</span>."], [11, "l", 36, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "5 · Partial nephrectomy", "The <b>collecting system</b> is entered in <span class=\"key\">~60%</span>. Repair it with 2-0/3-0 polyglactin and <b>always drain</b>; a routine ureteric catheter does not prevent fistula."], [11, "l", 36, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "5 · Partial nephrectomy", "<b>Ischaemia:</b> the historical warm limit is <span class=\"key\">30 min</span>, but <b>preserved parenchymal volume predicts function better than WIT</b>. Use cold ischaemia for a solitary kidney, CKD or a long expected clamp time."], [11, "p", 36, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "5 · Partial nephrectomy", "No clamping strategy has beaten standard clamping on long-term function: what is kept matters more than how long it is clamped."], [11, "l", 37, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "7 · Complications & management", "The overall rate is <span class=\"key\">~15%</span>, and PN &gt; RN &gt; simple. The learning curve is ~20 nephrectomies. Robotic PN halves open conversion. Age is not a major risk; conversions cluster in infective disease."], [11, "a", 37, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "7 · Complications & management", "<ol>\n<li>Major bleed: locate; temporary control (grasper or pressure); inform the anaesthetist (blood, open set).</li>\n<li>Clear the field: raise pneumoperitoneum or add a trocar; then definitive clip or suture.</li>\n<li>If that fails, then convert and call a vascular surgeon.</li>\n</ol>"], [11, "p", 38, "Ch 142 · Laparoscopic and Robotic Surgery of the Kidney", "7 · Complications & management", "MIS complications are the open ones in altered form and timing: the lethal ones (access vessel injury, thermal bowel injury) happen out of view and present late or atypically."], [11, "p", 39, "Ch 143 · Focal Therapy for Renal Tumours", "1 · Rationale & indications", "<b>Trap:</b> TA is never the default for a fit patient."], [11, "r", 39, "Ch 143 · Focal Therapy for Renal Tumours", "1 · Rationale & indications", "American Urological Association (AUA) 2021 · Consider for cT1a <span class=\"key\">≤3 cm</span>, especially comorbid; PN prioritised; percutaneous preferred"], [11, "r", 39, "Ch 143 · Focal Therapy for Renal Tumours", "1 · Rationale & indications", "European Association of Urology (EAU) 2022 · TA not routinely <span class=\"key\">&gt;3 cm</span>; CA not <span class=\"key\">&gt;4 cm</span>; for frail/comorbid"], [11, "a", 39, "Ch 143 · Focal Therapy for Renal Tumours", "2 · Selection & work-up", "<ol>\n<li>Counsel: age, comorbidity, CKD risk, size and location.</li>\n<li>Biopsy, then re-counsel with histology.</li>\n<li>Choose PN, surveillance or percutaneous ablation.</li>\n</ol>"], [11, "l", 40, "Ch 143 · Focal Therapy for Renal Tumours", "3 · Mechanisms", "Probes sit <span class=\"key\">1–2 cm apart</span> and come out only after full thaw; early removal fractures tumour and bleeds."], [11, "l", 40, "Ch 143 · Focal Therapy for Renal Tumours", "3 · Mechanisms", "Cryo target is <span class=\"key\">≤−40 °C</span>; the iceball extends <span class=\"key\">5–10 mm beyond tumour</span>, pushing the −40 °C isotherm past the tumour edge."], [11, "l", 40, "Ch 143 · Focal Therapy for Renal Tumours", "3 · Mechanisms", "Heat: <span class=\"key\">≥60 °C</span> causes coagulative necrosis; ≥100 °C causes vaporisation and charring. Lethal: 45 °C for 60 min, 55 °C for 5 min, <b>70 °C for 1 min</b>."], [11, "p", 40, "Ch 143 · Focal Therapy for Renal Tumours", "4 · Choice of energy", "<b>Why RFA is self-limiting:</b> charring raises impedance and halts current (cap 105 °C, electrodes cooled). MWA <i>radiates</i> energy, so it works through desiccated tissue and blood, heats actively to 2 cm (RFA: millimetres) and outruns the heat sink."], [11, "a", 41, "Ch 143 · Focal Therapy for Renal Tumours", "5 · Technique", "<ol>\n<li>Give intravenous (IV) antibiotics.</li>\n<li>Position prone or flank on the computed tomography (CT) gantry.</li>\n<li>Place probes under US, CT or magnetic resonance imaging (MRI) guidance; confirm on non-contrast CT.</li>\n<li>Ablate, then contrast CT for completeness and haematoma.</li>\n</ol>"], [11, "l", 41, "Ch 143 · Focal Therapy for Renal Tumours", "6 · Follow-up, success & salvage", "<b>AUA:</b> CT/MRI with and without contrast plus chest imaging at <span class=\"key\">6, 12, 24, 36, 48, 60 months</span>, then shared decision. US is not routine unless a contrast-enhanced (CEUS) protocol exists."], [11, "p", 42, "Ch 143 · Focal Therapy for Renal Tumours", "7 · Oncological outcomes vs PN", "<b>Why comparisons are biased:</b> benign and under-graded tumours flatter TA; occult pT3a penalises it; non-surgical candidates die of other causes first. The European Organisation for Research and Treatment of Cancer (EORTC) 30904 trial (PN vs RN, ≤5 cm) had only 12 RCC deaths at 9.3 years, so trials need huge cohorts."], [11, "l", 42, "Ch 143 · Focal Therapy for Renal Tumours", "8 · Complications & management", "Major complications (Clavien ≥3) are <span class=\"key\">≤5%</span>, fewer than PN; percutaneous beats laparoscopic, and MWA is lowest (network meta-analysis)."], [11, "l", 43, "Ch 144 · Treatment of Advanced Renal Cell Carcinoma", "1 · Overview", "About <span class=\"key\">1/3</span> present with metastases; a further <span class=\"key\">20–40%</span> of localised tumours metastasise later. mRCC 5-yr survival is about <span class=\"key\">12%</span>; 10-yr &lt;5%."], [11, "r", 43, "Ch 144 · Treatment of Advanced Renal Cell Carcinoma", "2 · Prognostic models", "Corrected calcium · <span class=\"key\">&gt;10 mg/dL</span> · &gt; upper limit of normal (ULN)"], [11, "r", 43, "Ch 144 · Treatment of Advanced Renal Cell Carcinoma", "2 · Prognostic models", "Lactate dehydrogenase (LDH) · <span class=\"key\">&gt;1.5 × ULN</span> · —"], [11, "r", 43, "Ch 144 · Treatment of Advanced Renal Cell Carcinoma", "2 · Prognostic models", "Time factor · No prior nephrectomy · <span class=\"key\">&lt;1 yr</span> from diagnosis to systemic therapy"], [11, "p", 44, "Ch 144 · Treatment of Advanced Renal Cell Carcinoma", "2 · Prognostic models", "Both score host reserve, tumour systemic effects and pace of disease; three factors shared. IMDC swaps LDH and prior nephrectomy for neutrophilia, thrombocytosis and short interval. The IMDC risk group <b>decides the first-line regimen</b>."], [11, "r", 44, "Ch 144 · Treatment of Advanced Renal Cell Carcinoma", "3 · Biology and drug targets", "Sunitinib · VEGFR2, PDGFR-β, c-KIT, FLT3; <span class=\"key\">50 mg, 4 wk on / 2 off</span> · Diarrhoea, HFS, fatigue, HTN, thrombocytopenia, <b>hypothyroidism</b>"], [11, "a", 45, "Ch 144 · Treatment of Advanced Renal Cell Carcinoma", "4 · Surgery in metastatic disease", "<ol>\n<li>Assess mRCC: histology, IMDC risk, PS and metastatic burden.</li>\n<li>If fit, with low burden, favourable features and a resectable primary, then consider upfront CN followed by systemic therapy.</li>\n<li>If intermediate/poor risk or high burden, then give systemic therapy first and offer deferred CN to responders.</li>\n</ol>"], [11, "p", 45, "Ch 144 · Treatment of Advanced Renal Cell Carcinoma", "4 · Surgery in metastatic disease", "CN helps only patients fit enough, and with disease slow enough, to reach effective systemic therapy; operating first on poor-risk patients mainly delays it."], [11, "r", 45, "Ch 144 · Treatment of Advanced Renal Cell Carcinoma", "5 · Systemic therapy for ccRCC", "Durable complete response (CR) · &lt;2% · <span class=\"key\">7–9%</span>; &gt;60% of CRs stay disease-free"], [11, "r", 45, "Ch 144 · Treatment of Advanced Renal Cell Carcinoma", "5 · Systemic therapy for ccRCC", "Regimen · Schedule/route immaterial · <span class=\"key\">600,000–720,000 IU/kg</span> IV bolus 8-hourly, max 15 doses"], [11, "p", 46, "Ch 144 · Treatment of Advanced Renal Cell Carcinoma", "5 · Systemic therapy for ccRCC", "<b>Choosing:</b> IO/TKI gives higher response and PFS and is better tolerated; IO/IO gives deeper durable responses (CR 9%) with autoimmune toxicity; they have never been compared directly. Ipilimumab + nivolumab is restricted to intermediate/poor risk (favourable did better on sunitinib in CheckMate 214). Avelumab + axitinib is not NCCN-preferred (no OS benefit). PD-L1 does not select. Use a TKI or temsirolimus if IO is contraindicated."], [11, "l", 46, "Ch 144 · Treatment of Advanced Renal Cell Carcinoma", "5 · Systemic therapy for ccRCC", "<b>Ipilimumab + nivolumab toxicity:</b> grade 3–4 events <span class=\"key\">46%</span>, high-dose steroids 35%, discontinuation 22%. The dose (nivolumab 3 mg/kg + ipilimumab 1 mg/kg 3-weekly × 4) came from CheckMate 016."], [11, "p", 47, "Ch 144 · Treatment of Advanced Renal Cell Carcinoma", "6 · Non-clear cell RCC", "In nccRCC the syndrome names the driver, and the driver names the drug: VHL leads to VEGF/mTOR/HIF-2α drugs, MET to MET inhibitors, and FH loss to glucose restriction."], [11, "r", 49, "★ Putting it together", "A · Small renal mass", "Best for · Frail, life expectancy &lt;5 y; solid &lt;2 cm or mainly cystic · cT1a <span class=\"key\">≤3 cm</span>, comorbid; biopsy first · cT1a standard; imperative if solitary, bilateral, hereditary, chronic kidney disease (CKD) · Only if high complexity, no CKD/proteinuria, and new eGFR <span class=\"key\">&gt;45</span>"], [11, "a", 50, "★ Putting it together", "E · Metastatic RCC", "<ol>\n<li><b>Score IMDC (6 factors)</b>: KPS &lt;80%, Hb &lt; LLN, calcium/neutrophils/platelets &gt; ULN, &lt;1 yr to therapy. 0 is favourable, 1–2 intermediate, ≥3 poor.</li>\n<li><b>First line</b>: IO + TKI (pembro + axitinib, nivo + cabozantinib, pembro + lenvatinib) at any risk; ipi + nivo only if intermediate/poor.</li>\n<li><b>Cytoreductive nephrectomy</b>: upfront only if fit, low burden, favourable; otherwise deferred in responders (CARMENA, SURTIME).</li>\n<li><b>Later lines</b>: switch mechanism; belzutifan (HIF-2α) after IO + TKI.</li>\n</ol>"], [12, "l", 2, "Ch 145 · Surgical and Radiographic Anatomy of the Adrenals", "1 · Embryology", "At birth the gland is <span class=\"key\">2×</span> adult weight. The <b>fetal zone involutes in year 1</b>, replaced by glomerulosa (ZG) and fasciculata (ZF) under adrenocorticotropic hormone (ACTH). Zona reticularis (ZR) reaches adult volume at 6–8 y."], [12, "l", 2, "Ch 145 · Surgical and Radiographic Anatomy of the Adrenals", "2 · Zones and hormones", "Glomerulosa ~15% (aldosterone; small clustered cells); fasciculata <span class=\"key\">~80%</span> (cortisol; lipid-laden \"clear cells\"); reticularis 5–7% (DHEAS, dehydroepiandrosterone sulphate; anastomosing cords); medulla ~10% (chromaffin cells)."], [12, "p", 2, "Ch 145 · Surgical and Radiographic Anatomy of the Adrenals", "3 · Relations and blood supply", "Right side is riskier: high, retrocaval, short vein with little working length; avulsion tears the cava."], [12, "l", 3, "Ch 145 · Surgical and Radiographic Anatomy of the Adrenals", "5 · Imaging appearance", "<b>CT</b> (computed tomography) has the best spatial resolution: an inverted <b>V/Y</b>, limbs 3–6 mm (thinner than crus). Unenhanced <span class=\"key\">≤10 HU</span> means lipid-rich. It shows morphology only."], [12, "l", 4, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "1 · Applied anatomy and physiology", "Anomalous venous drainage occurs in up to <span class=\"key\">9%</span>, which matters for adrenal vein sampling (AVS). Triple supply means a partial-adrenalectomy remnant rarely infarcts."], [12, "p", 4, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "2 · Evaluation of an adrenal mass – principles", "Two questions: <b>(1) Is it malignant?</b> (imaging). <b>(2) Is it hormonally active?</b> (biochemistry). Yes to either means treat (usually resect). Imaging cannot identify functional adenomas, so biochemistry is never omitted."], [12, "l", 5, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "3 · Imaging", "<b>Unenhanced computed tomography (CT)</b>: <span class=\"key\">≤10 Hounsfield units (HU)</span> means a lipid-rich adenoma (no known malignancy), &gt;70% of adenomas. ≤0 HU is 100% specific but insensitive."], [12, "l", 5, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "3 · Imaging", "Up to <span class=\"key\">7%</span> of metastases are &lt;10 HU, so every lesion still needs biochemistry."], [12, "l", 5, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "3 · Imaging", "<b>CT washout</b> is the gold standard for lipid-poor lesions (≈30% of adenomas), with phases at 0, 60 s and 15 min. It is an adenoma if the absolute percentage washout (APW) is <span class=\"key\">&gt;60%</span> or the relative washout (RPW) <span class=\"key\">&gt;40%</span>. RCC and hepatoma metastases can also wash out."], [12, "a", 5, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "3 · Imaging", "<ol>\n<li>Unenhanced CT: if ≤10 HU or MRI drop-out, then adenoma.</li>\n<li>If &gt;10 HU, then do a 15-min washout CT.</li>\n<li>If APW &gt;60% / RPW &gt;40%, then it is an adenoma; if below, an adenoma is very unlikely, so manage as indeterminate.</li>\n</ol>"], [12, "p", 6, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "4 · Hormonal work-up (all lesions >1 cm)", "Every incidentaloma: <b>1-mg dexamethasone suppression test (DST) and metanephrines</b>. Add an <b>aldosterone-to-renin ratio (ARR)</b> if there is hypertension or unexplained hypokalaemia. &gt;10% are functional. <b>Never biopsy, sample or excise before excluding phaeochromocytoma</b>. Canadian Urological Association (CUA) guidance allows omitting metanephrines in asymptomatic &lt;10 HU lesions."], [12, "l", 6, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "4 · Hormonal work-up (all lesions >1 cm)", "1-mg DST: <span class=\"key\">≤1.8 µg/dL (50 nmol/L)</span> excludes autonomy; 1.8–5.0 means possible autonomy; <span class=\"key\">&gt;5.0 µg/dL (140 nmol/L)</span> is &gt;95% specific. The 5.0 cut-off misses up to 18% of Cushing syndrome."], [12, "a", 7, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "5 · Biopsy and incidentaloma management", "<ol>\n<li>If imaging characterises the lesion, then do not biopsy.</li>\n<li>If it is functional, then do not biopsy.</li>\n<li>If ACC is suspected, then do not biopsy.</li>\n<li>If the result will change management (e.g., known primary) and justify risk, then biopsy, <b>after excluding phaeochromocytoma</b>.</li>\n</ol>"], [12, "l", 7, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "6 · Primary aldosteronism (PA)", "<b>ARR</b>: morning, seated, plasma aldosterone concentration (PAC, ng/dL) divided by plasma renin activity (PRA, ng/mL/h). Positive if <span class=\"key\">ARR &gt;20–30 with PAC &gt;15–20 ng/dL</span>. Floor PRA at 0.2; correct K⁺."], [12, "l", 8, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "6 · Primary aldosteronism (PA)", "<b>Selectivity</b> proves the catheter is in the vein: adrenal vein to IVC cortisol &gt;1.1–5:1 (higher with cosyntropin). <b>Lateralisation</b>: a cortisol-corrected aldosterone-to-cortisol (A/C) ratio <span class=\"key\">&gt;2–4:1</span> indicates ipsilateral adrenalectomy."], [12, "a", 8, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "6 · Primary aldosteronism (PA)", "<ol>\n<li>If there is a screening indication, measure the ARR.</li>\n<li>If the ARR is positive, confirm with a suppression test. If there is a family history or onset &lt;20 y, test for FH-I.</li>\n<li>If not a surgical candidate, then MRA.</li>\n<li>If a surgical candidate, do CT. If age &lt;40 with a unilateral &gt;1 cm nodule, then adrenalectomy.</li>\n<li>Otherwise do AVS: if lateralised, laparoscopic adrenalectomy; if not lateralised, MRA.</li>\n</ol>"], [12, "a", 9, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "7 · Cushing syndrome and cortisol excess", "<ol>\n<li>Exclude exogenous steroid.</li>\n<li>Screen with 1-mg DST, late-night salivary cortisol (LNSC) ×2 or UFC ×2.</li>\n<li>If abnormal, endocrinologist confirms; measure <b>morning ACTH</b>.</li>\n<li>If ACTH low: adrenal, do CT.</li>\n<li>If normal/high: pituitary MRI and <b>inferior petrosal sinus sampling after CRH</b>. A central-to-peripheral gradient means Cushing disease; no gradient means ectopic.</li>\n</ol>"], [12, "p", 10, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "8 · Phaeochromocytoma and paraganglioma (PPGL)", "The rule of 10s is outdated – every patient with PPGL should be offered genetic counselling/testing (Endocrine Society 2014)."], [12, "p", 10, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "8 · Phaeochromocytoma and paraganglioma (PPGL)", "<b>Why never β before α?</b> β-blockade removes β2-mediated arteriolar dilatation. Catecholamines then act unopposed on α1 receptors and cause a hypertensive crisis. Hence use selective β1 agents."], [12, "l", 12, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "11 · Adrenal metastases", "With known malignancy, <span class=\"key\">&gt;50%</span> of new adrenal lesions are metastases. RCC and hepatoma deposits may wash out, so growth and biopsy decide. <b>Still exclude phaeochromocytoma</b>."], [12, "p", 12, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "12 · Adrenal insufficiency", "<span class=\"dag\">†</span> <b>Adrenal crisis</b>: do not wait for results. Draw cortisol and ACTH, give <b>hydrocortisone 100 mg IV bolus</b>, then 200 mg/24 h (infusion or 50 mg 6-hourly). Give 0.9% saline (1 L in the first hour) with dextrose, treat the precipitant, and taper over 1–3 days. Fludrocortisone is unnecessary while hydrocortisone is &gt;50 mg/day. Teach sick-day rules and issue a steroid card."], [12, "m", 13, "Ch 146 · Pathophysiology, Evaluation and Medical Management of Adrenal Disorders", "15 · MCQ one-liners", "Commonest ectopic ACTH source: bronchial carcinoid."], [12, "l", 14, "Ch 147 · Surgery of the Adrenal Glands", "1 · Surgical anatomy (essentials)", "The <b>right</b> gland lies behind the bare area of the liver (fused in ~10%). Its vein is <span class=\"key\">&lt;1 cm</span> long and enters the <b>posterior inferior vena cava (IVC) at 45°</b>; variants drain into the right hepatic or right renal vein."], [12, "r", 14, "Ch 147 · Surgery of the Adrenal Glands", "2 · Indications", "Size · <span class=\"key\">≥4 cm</span>; &gt;2 cm growing ≥1 cm in 12 months"], [12, "r", 14, "Ch 147 · Surgery of the Adrenal Glands", "2 · Indications", "Imaging · Non-contrast computed tomography (CT) <span class=\"key\">&gt;10 HU</span> (Hounsfield units); washout &lt;50% with delayed &gt;35 HU; chemical-shift MRI not adenoma; FDG-PET uptake equal to or above liver"], [12, "p", 14, "Ch 147 · Surgery of the Adrenal Glands", "2 · Indications", "Trap: bilateral hyperplasia causing aldosteronism is <b>not</b> surgical, so adrenal venous sampling (AVS) comes before adrenalectomy for aldosteronism."], [12, "l", 14, "Ch 147 · Surgery of the Adrenal Glands", "2 · Indications", "Inert, ≤4 cm, ≤10 HU, homogeneous: repeat CT at 12 months. Operate on myelolipoma (≤ −20 HU) only if <span class=\"key\">&gt;7 cm</span>, symptomatic or atypical, and still exclude PCC."], [12, "r", 15, "Ch 147 · Surgery of the Adrenal Glands", "4 · Pre-operative preparation", "<b>PCC</b> · α-blockade for <span class=\"key\">2 weeks</span> (phenoxybenzamine; doxazosin, calcium channel blocker, metyrosine alternatives); β <b>only after α</b>; volume expansion · Contracted patients collapse once vein tied. ECG, echo"], [12, "a", 15, "Ch 147 · Surgery of the Adrenal Glands", "6 · Operative steps", "<p><b>Right</b>:</p><ol>\n<li>Elevate the liver; Kocher the duodenum; expose the IVC.</li>\n<li>Dissect up from the renal vein (inferior limit) to the short adrenal vein.</li>\n<li><b>Warn anaesthesia</b>, then clip early.</li>\n<li>Dissect superiorly and laterally down to psoas (posterior limit); bag the gland intact.</li>\n</ol>"], [12, "a", 15, "Ch 147 · Surgery of the Adrenal Glands", "6 · Operative steps", "<p><b>Left</b>:</p><ol>\n<li>Reflect the colon at Toldt, outside Gerota; lift spleen and pancreas up.</li>\n<li>Follow the left renal (or gonadal) vein to the adrenal vein; clip after warning.</li>\n<li>Protect pancreas and splenic artery; divide the ganglion nexus superomedially; bag.</li>\n</ol>"], [12, "p", 15, "Ch 147 · Surgery of the Adrenal Glands", "6 · Operative steps", "Ligate the vein early in PCC to limit the catecholamine surge; hypotension follows, so tell anaesthesia first."], [12, "l", 16, "Ch 147 · Surgery of the Adrenal Glands", "10 · Outcomes", "PCC recurs in up to <span class=\"key\">16%</span> over life, so check BP and metanephrines annually."], [12, "l", 16, "Ch 147 · Surgery of the Adrenal Glands", "10 · Outcomes", "Cushing: insulin resistance may persist. Advanced-stage ACC has a 5-year survival <span class=\"key\">&lt;15%</span>."], [12, "p", 17, "Ch 140 · Retroperitoneal Tumours", "1 · Anatomy of the retroperitoneum", "The operative problem is usually the neighbouring structure, not the tumour: RP tumours grow silently (resected sarcomas average <span class=\"key\">&gt;15 cm</span>) and present with multi-organ involvement."], [12, "l", 18, "Ch 140 · Retroperitoneal Tumours", "4 · Mesenchymal tumours (sarcoma)", "Soft-tissue sarcoma is &lt;1% of adult cancers; <span class=\"key\">15–20%</span> arise in the RP."], [12, "r", 18, "Ch 140 · Retroperitoneal Tumours", "4 · Mesenchymal tumours (sarcoma)", "<b>Well-/de-differentiated (WD/DD) liposarcoma</b> (commonest, <span class=\"key\">~60%</span>) · Fat density; <b>MDM2/CDK4 (12q) amplification</b>, ring chromosomes; S100+ · Radical compartmental resection"], [12, "r", 18, "Ch 140 · Retroperitoneal Tumours", "4 · Mesenchymal tumours (sarcoma)", "<b>Leiomyosarcoma</b> (<span class=\"key\">~20%</span>) · From vessel media (IVC); no fat; SMA, desmin, h-caldesmon+ · Negative margins + adjuvant"], [12, "l", 18, "Ch 140 · Retroperitoneal Tumours", "4 · Mesenchymal tumours (sarcoma)", "<b>Liposarcoma</b>: DD has a higher-grade non-lipogenic component, so <b>dense nodules in a fatty mass mean de-differentiation</b> and are the biopsy target. WD recurs locally in up to 40% but rarely metastasises; DD spreads distantly in up to 20%, with 5-year mortality ~30%. Mean time to recurrence is ~<span class=\"key\">2 years</span>, so surveillance is lifelong."], [12, "p", 19, "Ch 140 · Retroperitoneal Tumours", "4 · Mesenchymal tumours (sarcoma)", "MDM2 amplified (WD/DD) means local disease, won or lost at the margin; MDM2 absent (pleomorphic) means systemic disease. Infiltrative types (Ewing, DSRCT) need chemotherapy because no margin is achievable."], [12, "p", 20, "Ch 140 · Retroperitoneal Tumours", "6 · Germ cell, haematological, cystic, unknown primary", "Histology decides first treatment: exclude chemotherapy-first entities (GCT, lymphoma, Ewing, midline unknown primary) before planning sarcoma resection."], [12, "l", 20, "Ch 140 · Retroperitoneal Tumours", "7 · Surgery for RP sarcoma", "Nephrectomy is needed in up to <span class=\"key\">55%</span> but rarely leads to dialysis; <span class=\"dag\">†</span> get a split renogram first. ~5% lose the femoral or obturator nerve and need a knee brace."], [12, "l", 20, "Ch 140 · Retroperitoneal Tumours", "8 · RPLND in germ cell tumours", "Primary RPLND gives survival ~100% with either template. In post-chemotherapy RPLND (PC-RPLND), a full bilateral infrahilar template is standard; unilateral only if the mass is <span class=\"key\">≤5 cm</span> in the landing zone, markers are normal, and IGCCCG risk is good or intermediate."], [12, "l", 20, "Ch 140 · Retroperitoneal Tumours", "8 · RPLND in germ cell tumours", "Sparing the L1–L4 fibres and the superior hypogastric plexus below the IMA gives antegrade ejaculation in <span class=\"key\">90–100%</span>; temporary anejaculation is neuropraxia."], [12, "a", 20, "Ch 140 · Retroperitoneal Tumours", "9 · Complications", "<p><b>Chylous ascites</b>:</p><ol>\n<li>Paracentesis, a medium-chain triglyceride (MCT) diet, with or without octreotide.</li>\n<li>If it reaccumulates, place a drain.</li>\n<li>Then nil by mouth and total parenteral nutrition.</li>\n<li>If output stays &gt;100 mL/day, then peritoneovenous (LeVeen) shunt or ligation.</li>\n<li>Continue the MCT diet for 1–3 months after resolution.</li>\n</ol>"], [12, "a", 22, "★ Putting it together: adrenal and retroperitoneal decisions", "A · Adrenal incidentaloma: two questions", "<ol>\n<li><b>Malignant?</b> If unenhanced CT is ≤10 HU or MRI shows drop-out, then adenoma. If &gt;10 HU, do washout CT (APW &gt;60% / RPW &gt;40% = adenoma). If &gt;4 cm, suspicious or growing &gt;1 cm, consider resection (<span class=\"xref\">Ch 146</span>).</li>\n<li><b>Functioning?</b> Test all: 1-mg dexamethasone suppression test (DST) and metanephrines; aldosterone-to-renin ratio (ARR) if hypertensive or hypokalaemic.</li>\n<li>If <b>silent, &lt;4 cm and benign</b>, then no follow-up.</li>\n</ol>"], [12, "p", 22, "★ Putting it together: adrenal and retroperitoneal decisions", "C · Adrenalectomy approach", "Use laparoscopy (transperitoneal or retroperitoneoscopic) for benign tumours. Operate open for large suspected adrenocortical carcinoma or invasion, because rupture spills tumour and causes recurrence. On the right, the short vein enters the IVC, so control it carefully. Partial adrenalectomy suits bilateral or hereditary disease (<span class=\"xref\">Ch 147</span>)."], [12, "a", 23, "★ Putting it together: adrenal and retroperitoneal decisions", "D · Retroperitoneal mass", "<ol>\n<li><b>Image</b>, then <b>exclude</b> paraganglioma (metanephrines), germ cell tumour (testis, markers) and lymphoma before biopsy.</li>\n<li>If it changes treatment, do a <b>core biopsy</b> by the retroperitoneal route.</li>\n<li><b>Sarcoma:</b> en bloc R0 resection at the first operation (multivisceral if needed) in a specialist centre; never enucleate. Follow with lifelong CT, especially for liposarcoma (<span class=\"xref\">Ch 140</span>).</li>\n</ol>"], [13, "l", 2, "Ch 88 · Surgical, Radiologic and Endoscopic Anatomy of the Kidney and Ureter", "1 · Kidney: position and relations", "The kidney is ≈<span class=\"key\">11 cm</span> long, 125–170 g (male), at T12–L3. The <b>right lies 1–2 cm lower</b>; both descend ≈3 cm on inspiration or standing."], [13, "l", 2, "Ch 88 · Surgical, Radiologic and Endoscopic Anatomy of the Kidney and Ureter", "3 · Parenchyma and its imaging", "Glomerular filtration rate (GFR) is ≈<span class=\"key\">125 mL/min</span>; ≈99% of filtrate is reabsorbed. Urothelium lines calyces to urethra, so urothelial carcinoma arises anywhere."], [13, "r", 2, "Ch 88 · Surgical, Radiologic and Endoscopic Anatomy of the Kidney and Ureter", "3 · Parenchyma and its imaging", "<b>Nephrographic</b> · <span class=\"key\">80–120 s</span> · <b>Best for renal masses</b>"], [13, "p", 3, "Ch 88 · Surgical, Radiologic and Endoscopic Anatomy of the Kidney and Ureter", "5 · Percutaneous puncture and vessels", "Why the fornix? Arteries run on the anterior and posterior faces of the infundibula, and a forniceal puncture through the papilla avoids them. If an infundibulum is unavoidable, choose the lower pole. Vascular injury causes haemorrhage, arteriovenous fistula, pseudoaneurysm and loss of function."], [13, "p", 4, "Ch 88 · Surgical, Radiologic and Endoscopic Anatomy of the Kidney and Ureter", "8 · Radiologic anatomy of the ureter", "<b>Weigert–Meyer rule</b>: the upper-moiety orifice is <b>inferior and medial</b> and obstructs (ureterocele); the lower moiety refluxes (vesicoureteral reflux, VUR)."], [13, "l", 5, "Ch 88 · Surgical, Radiologic and Endoscopic Anatomy of the Kidney and Ureter", "10 · Endoscopic anatomy", "The lower-pole infundibulum needs ≈<span class=\"key\">140°</span> deflection. Ducts of Bellini dilate with obstruction."], [13, "a", 5, "Ch 88 · Surgical, Radiologic and Endoscopic Anatomy of the Kidney and Ureter", "10 · Endoscopic anatomy", "<ol><li>Infundibulotomy: incise superior, then inferior, then posterior quadrants.</li><li><b>Never anterior</b>.</li></ol>"], [13, "l", 6, "Ch 90 · Fundamentals of Nephrology", "1 · Why a urologist needs nephrology", "Each kidney has ≈<span class=\"key\">1 million</span> <b>nephrons</b>, fixed at birth. When nephron mass falls (nephrectomy, agenesis), the rest <b>hyperfilter</b>."], [13, "p", 6, "Ch 90 · Fundamentals of Nephrology", "1 · Why a urologist needs nephrology", "Surgery, obstruction, its relief and drug dosing all change volume, electrolytes and acid–base. The glomerulus is a pressure filter set by arteriolar tone; the tubule is energy-hungry and near-hypoxic. Most disorders fail one or the other."], [13, "p", 6, "Ch 90 · Fundamentals of Nephrology", "2 · Measuring kidney function", "Trap: after cystectomy or bladder repair, a rising SCr with ascites may be an <b>intraperitoneal urine leak</b> reabsorbed across the peritoneum, not kidney injury."], [13, "l", 6, "Ch 90 · Fundamentals of Nephrology", "3 · Acute kidney injury", "Net filtration pressure ≈<span class=\"key\">10 mm Hg</span> = glomerular hydrostatic 60 − Bowman's 18 − oncotic 32."], [13, "r", 7, "Ch 90 · Fundamentals of Nephrology", "3 · Acute kidney injury", "1 · Rise ≥<span class=\"key\">0.3 mg/dL</span> (within 48 h<span class=\"dag\">†</span>) or ×1.5 baseline (within 7 days<span class=\"dag\">†</span>) · &lt;0.5 mL/kg/h for 6 h"], [13, "l", 7, "Ch 90 · Fundamentals of Nephrology", "3 · Acute kidney injury", "Keep mean arterial pressure (MAP) &gt;<span class=\"key\">65 mm Hg</span>; elderly vasculopaths need more."], [13, "l", 8, "Ch 90 · Fundamentals of Nephrology", "3 · Acute kidney injury", "This is an SCr rise within <span class=\"key\">48 h</span> of intravenous (IV) iodinated contrast. Risks are age, diabetes, CKD, anaemia and the arterial route."], [13, "l", 8, "Ch 90 · Fundamentals of Nephrology", "3 · Acute kidney injury", "<b>Gadolinium</b> groups I and III cause nephrogenic systemic fibrosis (<b>NSF</b>), so avoid them in AKI, eGFR &lt;<span class=\"key\">30</span> and dialysis. Group II (gadobenate, gadoteridol, gadobutrol, gadoterate) is allowed. <b>Group III (gadoxetate) is treated as group I.</b>"], [13, "l", 8, "Ch 90 · Fundamentals of Nephrology", "3 · Acute kidney injury", "Onset is days to weeks after the drug; suspect it in unexplained hospital AKI with <b>sterile pyuria</b>. Urine eosinophils are insensitive and non-specific <span class=\"tag\">MCQ</span>."], [13, "l", 9, "Ch 90 · Fundamentals of Nephrology", "3 · Acute kidney injury", "Non-recovery for ≥<span class=\"key\">90 days</span> means CKD or end-stage kidney disease (ESKD)."], [13, "l", 9, "Ch 90 · Fundamentals of Nephrology", "5 · Chronic kidney disease", "<b>KDIGO</b> (Kidney Disease: Improving Global Outcomes) defines CKD as abnormal structure or function for ≥<span class=\"key\">3 months</span>. Structure alone qualifies (atrophic kidney, normal GFR). Classify by <b>cause, GFR and albuminuria</b>."], [13, "l", 9, "Ch 90 · Fundamentals of Nephrology", "5 · Chronic kidney disease", "Target glycated haemoglobin &lt;7.5% and blood pressure &lt;<span class=\"key\">130/80</span>; the agent matters only in proteinuric disease (RAAS blockade)."], [13, "l", 10, "Ch 90 · Fundamentals of Nephrology", "6 · Haematuria and proteinuria: when to involve a nephrologist", "<span class=\"dag\">†</span>Microhaematuria is ≥<span class=\"key\">3</span> red blood cells per high-power field (RBC/HPF) on microscopy; a positive dipstick needs confirmation."], [13, "a", 10, "Ch 90 · Fundamentals of Nephrology", "6 · Haematuria and proteinuria: when to involve a nephrologist", "<ol>\n<li>Haematuria with or without proteinuria: send urine microscopy, ACR, SCr/eGFR.</li>\n<li>If there are casts, dysmorphic cells, AKI or systemic features, then refer for <b>urgent nephrology</b>.</li>\n<li>If isolated non-glomerular haematuria, then urological evaluation.</li>\n<li>If isolated albuminuria, then stage CKD and refer per criteria.</li>\n</ol>"], [13, "l", 10, "Ch 90 · Fundamentals of Nephrology", "7 · Electrolyte and acid–base disorders", "Of 1 L, D5 leaves <span class=\"key\">83 mL</span> in the circulation, 0.9% saline 250 mL and 5% albumin 1000 mL."], [13, "l", 10, "Ch 90 · Fundamentals of Nephrology", "7 · Electrolyte and acid–base disorders", "<b>Rate</b>: in chronic hyponatraemia, raise sodium ≤<span class=\"key\">8–12 mEq/L per 24 h</span>, or <b>osmotic demyelination</b> follows."], [13, "l", 11, "Ch 90 · Fundamentals of Nephrology", "7 · Electrolyte and acid–base disorders", "Give free water. In chronic cases, lower sodium ≤<span class=\"key\">0.5 mEq/L/h</span>, or cerebral oedema follows."], [13, "a", 11, "Ch 90 · Fundamentals of Nephrology", "7 · Electrolyte and acid–base disorders", "<ol>\n<li><b>Stabilise</b> if there is any ECG change: calcium gluconate 10%, 10 mL IV.</li>\n<li><b>Shift</b>: insulin 10 U with 50 mL of 50% dextrose; nebulised salbutamol 20 mg.</li>\n<li><b>Remove</b>: haemodialysis if oliguric or ESKD; loop diuretic if non-oliguric; bicarbonate if acidotic; a binder.</li>\n<li>Stop culprit drugs.</li>\n</ol>"], [13, "l", 11, "Ch 90 · Fundamentals of Nephrology", "7 · Electrolyte and acid–base disorders", "Treat if symptomatic or ≥<span class=\"key\">14 mg/dL</span>: <b>isotonic saline</b> 200 mL/h to urine 100–150 mL/h; loop diuretic only if overloaded; calcitonin (rapid, tachyphylaxis 48 h); IV bisphosphonate; denosumab."], [13, "l", 12, "Ch 90 · Fundamentals of Nephrology", "7 · Electrolyte and acid–base disorders", "<span class=\"tag\">MCQ</span> Laxative abuse gives a negative urine AG and urine pH &gt;5.8, which leads to <b>ammonium acid urate stones</b>."], [13, "a", 12, "Ch 90 · Fundamentals of Nephrology", "8 · Urinary tract obstruction and post-obstructive diuresis", "<ol>\n<li>Relieve the obstruction, then allow free oral fluids; do not give routine IV fluid.</li>\n<li>If output stays high, or there is hypovolaemia, or the patient is obtunded or nil by mouth, then check a panel every <span class=\"key\">4–6 h</span> (Na, K, phosphate, Ca, Mg).</li>\n<li>Replace ≈<span class=\"key\">75%</span> of the output with <b>0.45% saline</b> plus electrolytes.</li>\n</ol>"], [13, "p", 12, "Ch 90 · Fundamentals of Nephrology", "8 · Urinary tract obstruction and post-obstructive diuresis", "Why not replace all output? The diuresis is mostly appropriate excretion of retained salt, water and urea; <span class=\"dag\">†</span>full replacement keeps the patient expanded and sustains it."], [13, "l", 12, "Ch 90
