it recurs, then urethroplasty.</li>\n<li>If bulbar 1–2 cm (up to 3–5 cm proximally), then excision and primary anastomosis (EPA).</li>\n<li>If longer bulbar, then oral mucosa graft (OMG) onlay, with or without augmented anastomosis.</li>\n<li>If penile, then onlay (graft or flap); if hostile bed, LS or failed hypospadias, then staged OMG.</li>\n<li>If panurethral, options exhausted or elderly, then perineal urethrostomy.</li>\n</ol>"], [8, "l", 44, "Ch 86 · Urethral Stricture Disease", "4 · Dilation and internal urethrotomy (DVIU)", "Direct vision internal urethrotomy (DVIU) does worse when luminal narrowing exceeds <span class=\"key\">74%</span>. It fails in non-bulbar strictures; repetition worsens later urethroplasty. Use saline (extravasation)."], [8, "r", 44, "Ch 86 · Urethral Stricture Disease", "4 · Dilation and internal urethrotomy (DVIU)", "<span class=\"key\">&lt;1.5 cm</span> · Longer"], [8, "l", 44, "Ch 86 · Urethral Stricture Disease", "4 · Dilation and internal urethrotomy (DVIU)", "Self-catheterisation tapers over <span class=\"key\">3–6 months</span>; the stricture recurs when it stops. A 6-week catheter is no better than 3–7 days. UroLume is withdrawn."], [8, "p", 44, "Ch 86 · Urethral Stricture Disease", "4 · Dilation and internal urethrotomy (DVIU)", "No endoscopic adjunct removes spongiofibrosis, so endoscopy cures only the short superficial bulbar stricture; each repetition spends the patient's reconstructive capital."], [8, "p", 45, "Ch 86 · Urethral Stricture Disease", "6 · Substitution urethroplasty", "A graft lives on its bed: it succeeds where the bed is thick and vascular (bulb, dorsal corpora), and is staged when the bed, or skin disease, cannot be trusted in one step."], [8, "l", 45, "Ch 86 · Urethral Stricture Disease", "6 · Substitution urethroplasty", "<b>Flaps</b> use hairless genital skin on dartos; in <b>Quartey</b> flaps the skin is a passenger on fascia. Designs: ventral longitudinal (<b>Orandi</b>), dorsal transverse, hockey stick (7–9 cm), <b>circular island</b> up to <span class=\"key\">15 cm</span>; scrotal island is not first choice."], [8, "l", 46, "Ch 86 · Urethral Stricture Disease", "8 · Pelvic fracture urethral injury (PFUI)", "PFUI occurs in about <span class=\"key\">10%</span> of pelvic fractures; \"apple off its stem\" is wrong. Primary realignment is linked to delayed repair and more endoscopic failures."], [8, "l", 46, "Ch 86 · Urethral Stricture Disease", "8 · Pelvic fracture urethral injury (PFUI)", "Repair at <span class=\"key\">3–6 months</span>; a transpubic approach is unnecessary."], [8, "a", 46, "Ch 86 · Urethral Stricture Disease", "8 · Pelvic fracture urethral injury (PFUI)", "<ol>\n<li>On-table endoscopy (exclude bladder stones); exaggerated lithotomy; perineal incision.</li>\n<li>Divide bulbospongiosus and mobilise the bulb; pass a Haygrove sound via the suprapubic tract; excise fibrosis.</li>\n<li>Spatulate to <span class=\"key\">≥30 Fr</span>; place 8–10 tension-free 4-0 polydioxanone (PDS) sutures over a silicone stent.</li>\n<li>If tension remains, then add steps in order: mobilisation (to penoscrotal junction), intracrural separation, infrapubectomy, corporal rerouting.</li>\n</ol>"], [8, "l", 46, "Ch 86 · Urethral Stricture Disease", "8 · Pelvic fracture urethral injury (PFUI)", "Success is in the high <span class=\"key\">90s %</span>. Give an anticholinergic after surgery."], [8, "l", 48, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "1 · Surgical anatomy of the scrotum", "<b>Transdermal absorption</b> is about <span class=\"key\">40×</span> that of other skin, and the skin is rich in 5α-reductase."], [8, "p", 48, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "1 · Surgical anatomy of the scrotum", "Three trunks (aorta, internal iliac, external iliac) anastomose in the cord (about 10 cm above the testis) and at the cauda. So the testicular artery can be ligated in Fowler–Stephens orchidopexy, and the superior epididymal artery sacrificed in vasectomy reversal."], [8, "l", 48, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "3 · Scrotal wall: excision, scrotectomy, reconstruction", "<b>Fournier gangrene</b> is the commonest indication for partial scrotectomy. Give fluids and broad-spectrum antibiotics, and <b>debride urgently</b>, because it spreads <span class=\"key\">2–3 cm/h</span>; mortality is about <span class=\"key\">20%</span>. Re-debride every <span class=\"key\">24–48 h</span>; anorectal extension may need a colostomy."], [8, "l", 49, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "3 · Scrotal wall: excision, scrotectomy, reconstruction", "If more than <span class=\"key\">50–60%</span> of skin is lost, do not reconstruct at once; place the testes in thigh pockets, under saline gauze or under vacuum dressing (VAC)."], [8, "a", 49, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "3 · Scrotal wall: excision, scrotectomy, reconstruction", "<ol>\n<li>If &lt;50% and tension-free, then close primarily.</li>\n<li>If &lt;50% with tension, then local scrotal advancement or secondary intention.</li>\n<li>If &gt;50%, then VAC, then stretched scrotal advancement or delayed primary closure.</li>\n<li>If no local tissue, then fasciocutaneous thigh flap; meshed split-thickness skin graft (STSG) last.</li>\n</ol>"], [8, "p", 49, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "3 · Scrotal wall: excision, scrotectomy, reconstruction", "The scrotum works because it is lax. Graft contracture defeats that, whereas residual scrotal skin stretches enormously and is the best donor."], [8, "l", 49, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "4 · Hydrocele", "<b>Congenital</b> hydrocele comes from a patent processus; about <span class=\"key\">80%</span> resolve by 18 months. <b>Acquired</b> hydrocele reflects a production–absorption imbalance, in men over 40."], [8, "p", 49, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "4 · Hydrocele", "The more tunica excised, the lower the recurrence but the more haematoma; plication trades a little recurrence for a dry field. Recurrence after any successful repair is <span class=\"key\">0–6%</span>."], [8, "l", 49, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "4 · Hydrocele", "With <b>retreatment</b>, resolution is <span class=\"key\">85–96%</span>. Results are poor if multiloculated or more than <span class=\"key\">750 mL</span>."], [8, "l", 50, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "7 · Vasectomy", "<b>Counsel</b>: not sterile at once, so use contraception until post-vasectomy semen analysis (PVSA). Repeat vasectomy is needed in &lt;<span class=\"key\">1%</span>; pregnancy occurs in about <span class=\"key\">1 in 2000</span> even after an azoospermic PVSA; chronic pain affects about <span class=\"key\">1–2%</span>."], [8, "r", 50, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "7 · Vasectomy", "Skin opening · 1.5–3 cm · ≤<span class=\"key\">10 mm</span> · Puncture &lt;10 mm"], [8, "p", 50, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "7 · Vasectomy", "Every recommended method rests on <b>mucosal cautery</b>; ligatures and clips alone are not core methods. Division is required; segment excision is optional (<span class=\"key\">1 cm</span> is adequate)."], [8, "a", 51, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "7 · Vasectomy", "<ol>\n<li>Do PVSA at <span class=\"key\">8–16 weeks</span> (after at least 10–20 ejaculations).</li>\n<li>If azoospermia or rare non-motile sperm (RNMS, ≤<span class=\"key\">100,000/mL</span>), then stop contraception.</li>\n<li>If motile sperm, then repeat at 6 months; if still motile, then it is a failure, so repeat the vasectomy.</li>\n</ol>"], [8, "l", 51, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "7 · Vasectomy", "Complications: haematoma, infection, and <b>sperm granuloma</b>, which is expected rather than a complication (NSAIDs; excise if it persists, &lt;5%). Post-vasectomy pain affects about <span class=\"key\">2%</span>; if a cord block helps, then denervation or reversal."], [8, "l", 51, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "8 · Orchidectomy and prosthesis", "<b>Prosthesis</b>: offer it to every man lacking a testis, before cancer orchidectomy. Pierce the fill port ≤<span class=\"key\">5 times</span>, never after insertion. A <b>high scrotal subdartos</b> pouch has least infection and erosion; trans-scrotal placement extrudes more."], [8, "a", 52, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "10 · Chronic scrotal pain (>3 months)", "<ol>\n<li>History, examination, duplex ultrasound; if a cause is found, then treat it.</li>\n<li>If none, then exclude extrascrotal causes (image abdomen, pelvis, spine, hip); treat prostatitis or pelvic floor causes.</li>\n<li>If non-specific, then give support, NSAIDs, tricyclics or gabapentin for ≥3 months.</li>\n<li>If epididymal, then epididymectomy.</li>\n<li>If testicular or post-vasectomy, then do a cord block: if relief &gt;<span class=\"key\">50%</span>, then microsurgical denervation (or reversal); if &lt;50%, then pain clinic, with inguinal orchidectomy last.</li>\n<li>If post-hernia, then ilioinguinal block; if relief &gt;<span class=\"key\">90%</span>, then neurolysis.</li>\n</ol>"], [8, "l", 52, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "12 · Seminal vesicles", "The seminal vesicles (SV) are Wolffian derivatives that bud at about <span class=\"key\">12 weeks</span>; they make about <span class=\"key\">60%</span> of seminal fluid. Relations: bladder in front, rectum behind, <b>neurovascular bundles lateral to the tips</b>, ureter anterolateral."], [8, "l", 52, "Ch 87 · Surgery of the Scrotum and Seminal Vesicles", "12 · Seminal vesicles", "<b>MRI is most accurate</b>. On transrectal ultrasound (TRUS), suspect obstruction if the SV is &gt;<span class=\"key\">1.5 cm</span> or the ejaculatory duct &gt;<span class=\"key\">2.3 mm</span>; confirm by <b>aspiration showing sperm</b>."], [8, "a", 54, "★ Putting it together", "A · Testicular mass: the first week", "<ol>\n<li>Ultrasound (US).</li>\n<li>Tumour markers AFP, hCG and LDH <b>before</b> orchidectomy; sperm bank.</li>\n<li><b>Radical inguinal orchidectomy</b> (never trans-scrotal).</li>\n<li>Repeat markers (AFP half-life 5–7 days, hCG 1–1.5 days); CT abdomen–pelvis and chest (<span class=\"xref\">see Ch 79, 80</span>).</li>\n</ol>"], [8, "a", 54, "★ Putting it together", "C · Penile cancer: primary and groin", "<ol>\n<li><b>Primary:</b> if penile intraepithelial neoplasia (PeIN), then topical 5-FU/imiquimod, laser or glans resurfacing. If invasive, then organ-sparing surgery, glansectomy, or partial/total penectomy; margins &lt;1 cm are acceptable (<span class=\"xref\">see Ch 82</span>).</li>\n<li><b>cN0:</b> if low risk (pTis/pTa/pT1a), then surveillance; if intermediate/high, then dynamic sentinel node biopsy (DSNB) or modified inguinal dissection (ILND); if positive, then radical.</li>\n<li><b>cN+:</b> if FNA positive, then bilateral radical ILND; if cN3, then neoadjuvant TIP first. Add pelvic dissection if ≥2 inguinal nodes or extranodal extension (ENE) (<span class=\"xref\">see Ch 84</span>).</li>\n</ol>"], [9, "p", 2, "Ch 93 · Management of Upper Urinary Tract Obstruction", "2 · Diagnosis", "<b>Dilation is not obstruction.</b> Anatomical imaging (ultrasonography, computed tomography [CT], retrograde) shows <i>where</i>; functional tests (renography, Whitaker) show <i>whether it matters</i>. Combine one of each."], [9, "l", 2, "Ch 93 · Management of Upper Urinary Tract Obstruction", "2 · Diagnosis", "<b>Renography (Ch 93 values)</b>: hydrate, then give furosemide <span class=\"key\">0.3–0.5 mg/kg</span> at <b>20 min</b>. Mercaptoacetyltriglycine (MAG3) is preferred."], [9, "l", 2, "Ch 93 · Management of Upper Urinary Tract Obstruction", "2 · Diagnosis", "<b>Obstruction is a half-time (T½) &gt;<span class=\"key\">40 min</span></b>. After successful pyeloplasty, drainage occurs even before furosemide."], [9, "a", 2, "Ch 93 · Management of Upper Urinary Tract Obstruction", "2 · Diagnosis", "<p><b>Whitaker test</b></p><ol>\n<li>Place a nephrostomy and a bladder catheter; perfuse at <span class=\"key\">10 mL/min</span>.</li>\n<li>If pressure stays ≤12–15 cm H<sub>2</sub>O, there is no obstruction; if it exceeds <span class=\"key\">15–20 cm H<sub>2</sub>O</span>, there is.</li>\n<li>It is invasive, so use it only when other tests are non-diagnostic. Errors: pelvic compliance, position.</li>\n</ol>"], [9, "l", 3, "Ch 93 · Management of Upper Urinary Tract Obstruction", "3 · Indications and choice of intervention", "<b>Neonates</b> are selectively observed; operate for progressive hydronephrosis or a <span class=\"key\">10%</span> fall in differential function. <b>Asymptomatic adults</b> with indeterminate results have serial renography."], [9, "r", 3, "Ch 93 · Management of Upper Urinary Tract Obstruction", "3 · Indications and choice of intervention", "Crossing vessel present vs absent · <span class=\"key\">42% vs 86%</span>"], [9, "l", 3, "Ch 93 · Management of Upper Urinary Tract Obstruction", "3 · Indications and choice of intervention", "<b>Nephrectomy</b> suits a thin shell with a normal contralateral kidney. Adults with &lt;<span class=\"key\">15%</span> differential function are non-salvageable; children have no agreed cut-off."], [9, "l", 3, "Ch 93 · Management of Upper Urinary Tract Obstruction", "4 · Endopyelotomy", "Pyeloplasty (≈<span class=\"key\">95%</span>) wins because it makes a wide dependent funnel and reduces the pelvis; endourology wins only on recovery."], [9, "l", 3, "Ch 93 · Management of Upper Urinary Tract Obstruction", "4 · Endopyelotomy", "<b>Contraindications</b>: segment &gt;<span class=\"key\">2 cm</span>, active infection, uncorrected coagulopathy. Marked vessel entanglement on 3D CT calls for robotic repair."], [9, "l", 3, "Ch 93 · Management of Upper Urinary Tract Obstruction", "4 · Endopyelotomy", "Stent with a 14/7-Fr endopyelotomy stent (or 8–10 Fr), traditionally for <span class=\"key\">6 weeks</span>; 2 and 4 weeks are equal."], [9, "a", 4, "Ch 93 · Management of Upper Urinary Tract Obstruction", "4 · Endopyelotomy", "<ol>\n<li>General anaesthesia; working and safety wires; flexible ureteroscope via a sheath.</li>\n<li>With a 200-µm holmium fibre, incise <b>laterally</b> into fat and into normal ureter.</li>\n<li>Leave a stent and Foley; do a renogram 4 weeks after stent removal.</li>\n</ol>"], [9, "a", 4, "Ch 93 · Management of Upper Urinary Tract Obstruction", "4 · Endopyelotomy", "<p><b>Percutaneous bleeding</b></p><ol>\n<li>Bed rest and transfusion.</li>\n<li><b>Do not irrigate</b> the nephrostomy, so clot tamponades.</li>\n<li>If bleeding persists, do <b>selective embolisation</b> (low threshold).</li>\n</ol>"], [9, "l", 4, "Ch 93 · Management of Upper Urinary Tract Obstruction", "4 · Endopyelotomy", "Renogram at 1 month after stent removal, at 6 months, then yearly for <span class=\"key\">2–3 years</span>. Pyeloplasty 85/75% vs endopyelotomy 63/41% at 3/10 years."], [9, "p", 4, "Ch 93 · Management of Upper Urinary Tract Obstruction", "5 · Pyeloplasty", "<b>Principles (open = minimally invasive)</b>: widely patent, watertight, tension-free anastomosis; funnel-shaped, <b>dependent</b> transition."], [9, "l", 4, "Ch 93 · Management of Upper Urinary Tract Obstruction", "5 · Pyeloplasty", "<span class=\"tag\">MCQ</span> Trendelenburg 1886 made the first attempt; Kuster 1891 the first successful dismembered repair; <b>Anderson–Hynes 1949</b> is standard; Davis 1943 described intubated ureterotomy."], [9, "a", 5, "Ch 93 · Management of Upper Urinary Tract Obstruction", "5 · Pyeloplasty", "<ol>\n<li>Dissect the ureter with periureteral tissue; place a lateral marking stitch.</li>\n<li>Excise the UPJ; spatulate <b>laterally</b>; bring the apex to the inferior pelvis, anterior to any crossing vessel.</li>\n<li>Do a watertight absorbable anastomosis, with or without reduction; leave a stent and drain.</li>\n</ol>"], [9, "l", 5, "Ch 93 · Management of Upper Urinary Tract Obstruction", "5 · Pyeloplasty", "Remove the <b>stent</b> at <span class=\"key\">4–6 weeks</span>. An added nephrostomy in uncomplicated adults means longer stay and more infection, so reserve it for secondary UPJO."], [9, "l", 5, "Ch 93 · Management of Upper Urinary Tract Obstruction", "5 · Pyeloplasty", "Laparoscopic and robotic success is &gt;<span class=\"key\">90–95%</span>, equal to open; the robot's advantage is ergonomic. \"Strict\" success definitions give rates about one-third lower."], [9, "a", 5, "Ch 93 · Management of Upper Urinary Tract Obstruction", "5 · Pyeloplasty", "<ol>\n<li>Remove the Foley at 24–36 h, then the drain if output is negligible.</li>\n<li>If output rises after Foley removal (reflux along the stent), <b>replace the Foley for 7 days</b>.</li>\n<li>Remove the stent at 4–6 weeks; then renography.</li>\n</ol>"], [9, "p", 5, "Ch 93 · Management of Upper Urinary Tract Obstruction", "6 · Other UPJ reconstructions", "Every UPJ repair asks: <b>what tissue bridges the gap while keeping blood supply?</b> Dismemberment excises disease but devascularises; flaps keep blood supply but carry disease forward; the calyx is used when the pelvis is too small."], [9, "r", 5, "Ch 93 · Management of Upper Urinary Tract Obstruction", "6 · Other UPJ reconstructions", "Culp–DeWeerd spiral flap · Large pelvis, long proximal narrowing · Longest flap; length:width ≤<span class=\"key\">3:1</span>"], [9, "l", 6, "Ch 93 · Management of Upper Urinary Tract Obstruction", "8 · Ureteral stricture — evaluation and endourology", "Stricture follows ureteroscopy (URS) in ≈<span class=\"key\">3%</span> vs 1.5% after shock-wave lithotripsy (SWL); an impacted stone &gt;2 months gives ≈1 in 4. Thulium gives more than holmium."], [9, "l", 6, "Ch 93 · Management of Upper Urinary Tract Obstruction", "8 · Ureteral stricture — evaluation and endourology", "Endourology needs ipsilateral function ≥<span class=\"key\">25%</span> (the algorithm uses 20%)."], [9, "l", 6, "Ch 93 · Management of Upper Urinary Tract Obstruction", "8 · Ureteral stricture — evaluation and endourology", "<b>Balloon dilation</b>: a 4-cm, 5–8-mm balloon is inflated until the <b>waist disappears</b>, for 10 min, then stented 2–4 weeks. Contraindications: infection, stricture &gt;<span class=\"key\">2 cm</span>."], [9, "a", 6, "Ch 93 · Management of Upper Urinary Tract Obstruction", "8 · Ureteral stricture — evaluation and endourology", "<ol>\n<li>If &lt;2 cm and function &gt;20%, then endoscopic incision.</li>\n<li>If &gt;2 cm and function &gt;20%, then reconstruction.</li>\n<li>If function &lt;20%, then nephrectomy (children may still merit repair).</li>\n<li>Transplant ureter: consider balloon. Follow with renography for 2 years.</li>\n</ol>"], [9, "p", 6, "Ch 93 · Management of Upper Urinary Tract Obstruction", "8 · Ureteral stricture — evaluation and endourology", "Each failure predictor (long, old, anastomotic, poorly vascularised) is a proxy for <b>ischaemic scar</b> that an incision cannot heal across."], [9, "r", 6, "Ch 93 · Management of Upper Urinary Tract Obstruction", "9 · Ureteral stricture — reconstruction ladder", "Ureteroureterostomy · <span class=\"key\">2–3 cm</span> · Upper/mid"], [9, "r", 6, "Ch 93 · Management of Upper Urinary Tract Obstruction", "9 · Ureteral stricture — reconstruction ladder", "Psoas hitch · <span class=\"key\">6–10 cm</span> · Below pelvic brim"], [9, "r", 7, "Ch 93 · Management of Upper Urinary Tract Obstruction", "9 · Ureteral stricture — reconstruction ladder", "Boari flap · <span class=\"key\">10–15 cm</span> · Lower/mid; spiral may reach pelvis"], [9, "a", 7, "Ch 93 · Management of Upper Urinary Tract Obstruction", "9 · Ureteral stricture — reconstruction ladder", "<p><b>Persistent leak</b></p><ol>\n<li>X-ray the stent position.</li>\n<li>Pull the drain off the anastomosis and stop suction.</li>\n<li>Place a Foley and give an anticholinergic; if it persists, place a nephrostomy.</li>\n</ol>"], [9, "l", 7, "Ch 93 · Management of Upper Urinary Tract Obstruction", "9 · Ureteral stricture — reconstruction ladder", "<b>Ileal ureter</b> is isoperistaltic. Contraindications: creatinine &gt;<span class=\"key\">2 mg/dL</span> (acidosis in ≈half), bladder dysfunction, inflammatory bowel disease, radiation enteritis."], [9, "p", 7, "Ch 93 · Management of Upper Urinary Tract Obstruction", "9 · Ureteral stricture — reconstruction ladder", "Ladder: bring the bladder up, the kidney down, borrow the other ureter, or substitute (ileum, buccal). Tension and ischaemia cause failure at every rung."], [9, "a", 8, "Ch 93 · Management of Upper Urinary Tract Obstruction", "10 · Ureteroenteric anastomotic stricture", "<ol>\n<li>If &lt;2 cm and function &gt;20%: right side, endoscopic incision; <b>left side, formal repair</b> (sigmoid mesentery bleeding).</li>\n<li>If &gt;2 cm, then formal repair.</li>\n<li>If function &lt;20%, then nephrectomy or observation.</li>\n</ol>"], [9, "a", 8, "Ch 93 · Management of Upper Urinary Tract Obstruction", "11 · Retroperitoneal fibrosis", "<ol>\n<li>If uraemic, decompress with a <b>nephrostomy</b> or stents and manage the <b>post-obstructive diuresis</b>.</li>\n<li>Stop any culprit drug; biopsy.</li>\n<li>Give steroids; if they fail, do ureterolysis.</li>\n</ol>"], [9, "l", 9, "Ch 94 · Upper Urinary Tract Trauma", "2 · Haematuria", "Significant haematuria is <b>gross</b>, or <b>microhaematuria (&gt;5 red blood cells per high-power field) with systolic blood pressure (SBP) <span class=\"key\">&lt;90 mm Hg</span></b>."], [9, "p", 9, "Ch 94 · Upper Urinary Tract Trauma", "2 · Haematuria", "Haematuria triggers imaging; it does not measure injury. The worst injuries (pedicle, UPJ) may not bleed into the urine, so mechanism carries equal weight."], [9, "r", 9, "Ch 94 · Upper Urinary Tract Trauma", "3 · AAST kidney injury scale (2018)", "II · Perirenal haematoma within Gerota's fascia; laceration <span class=\"key\">≤1 cm</span>, no extravasation"], [9, "l", 10, "Ch 94 · Upper Urinary Tract Trauma", "3 · AAST kidney injury scale (2018)", "Advance one grade for bilateral or multiple injuries, up to III; grade by the highest finding. <span class=\"tag\">MCQ</span> Trap: main-vessel injury was grade IV in 1989 and is now V; segmental pseudoaneurysm or arteriovenous fistula (AVF) is now IV."], [9, "l", 10, "Ch 94 · Upper Urinary Tract Trauma", "5 · Imaging studies", "Gold standard: <b>contrast CT with arterial/nephrographic and delayed (~<span class=\"key\">10 min</span>) phases</b>. Vein injury is poorly seen; medial haematoma with normal arteries suggests it."], [9, "a", 10, "Ch 94 · Upper Urinary Tract Trauma", "5 · Imaging studies", "<p><b>One-shot intravenous pyelogram (IVP)</b> (unstable, no CT): <span class=\"key\">2 mL/kg contrast → single film at 10 min</span>. It confirms a working contralateral kidney; alternatively palpate it, or loop the injured ureter and give IV methylene blue.</p>"], [9, "l", 11, "Ch 94 · Upper Urinary Tract Trauma", "6 · Nonoperative management", "<b>Failure triggers</b>: instability; transfusion of <span class=\"key\">2–3 units</span>; new pain or guarding; enlarging urinoma with fever. Most failures need only stent, nephrostomy or AE."], [9, "p", 11, "Ch 94 · Upper Urinary Tract Trauma", "7 · Urinary extravasation", "Parenchymal leaks heal because antegrade flow is preserved; anything stopping urine reaching the bladder converts an observable leak into one that must be drained."], [9, "a", 12, "Ch 94 · Upper Urinary Tract Trauma", "8 · Intervention", "<p><b>Vascular control first</b></p><ol>\n<li>Eviscerate the small bowel; incise peritoneum over the aorta above the inferior mesenteric artery (IMA), up to the ligament of Treitz.</li>\n<li>Follow the aorta to the left renal vein; loop and retract it; loop both renal arteries.</li>\n<li>Reflect the colon and open Gerota's fascia; occlude the vessels if bleeding.</li>\n</ol>"], [9, "a", 12, "Ch 94 · Upper Urinary Tract Trauma", "8 · Intervention", "<ol>\n<li>Expose and gain vascular control; debride only devitalised tissue.</li>\n<li>Suture-ligate vessels; close the collecting system <b>watertight</b>.</li>\n<li>Approximate parenchyma over a bolster; cover with Gerota's fascia or <b>pedicled omentum</b>; drain.</li>\n</ol>"], [9, "l", 12, "Ch 94 · Upper Urinary Tract Trauma", "8 · Intervention", "<b>Revascularise</b> only a solitary kidney or bilateral injury, with warm ischaemia <span class=\"key\">&lt;120 min</span>; unilateral repair salvages only ~⅓."], [9, "r", 12, "Ch 94 · Upper Urinary Tract Trauma", "10 · Ureteral injury", "II · Laceration <span class=\"key\">&lt;50%</span> transection"], [9, "r", 13, "Ch 94 · Upper Urinary Tract Trauma", "10 · Ureteral injury", "IV · Complete transection, <span class=\"key\">&lt;2 cm</span> devascularisation"], [9, "p", 13, "Ch 94 · Upper Urinary Tract Trauma", "10 · Ureteral injury", "Ureteral injury is diagnosed by absent contrast beyond it, so time the study for excretion, follow both ureters, and never treat a non-diagnostic study as negative."], [9, "a", 13, "Ch 94 · Upper Urinary Tract Trauma", "10 · Ureteral injury", "<ol>\n<li>If stable at laparotomy, repair now; if unstable, do damage control and repair later.</li>\n<li>If contusion, stent, or excise and repair.</li>\n<li>If found late or partial, stent; if stenting fails, place a nephrostomy and repair later.</li>\n<li>If ureterovaginal fistula, try a stent first.</li>\n</ol>"], [9, "l", 15, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "1 · Overview and epidemiology", "Lifetime prevalence is <span class=\"key\">1–15%</span>; in the United States ≈ <span class=\"key\">10%</span> and rising, partly from more computed tomography (CT)."], [9, "l", 16, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "2 · Physicochemistry and stone formation", "Urine holds calcium oxalate at ≈ 4× its solubility in water; with inhibitors it precipitates only at <span class=\"key\">7–11×</span>."], [9, "l", 16, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "2 · Physicochemistry and stone formation", "<b>Randall plaque</b> (<span class=\"tag\">MCQ</span> 1937) is <b>calcium apatite</b>. It starts in the <b>thin-limb basement membrane</b>, spreads through the interstitium and erodes the papilla; calcium oxalate then grows on it. Osteopontin lies at the mineral–organic interface."], [9, "p", 16, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "2 · Physicochemistry and stone formation", "<b>Plaque vs plug</b>: a plaque is an idiopathic interstitial apatite anchor; a plug is intratubular obstruction with injury, caused by secondary systemic disease. <b>Ductal plugs should prompt a search for a secondary cause.</b> Infection or shock-wave lithotripsy (SWL) may convert a calcium oxalate former into a brushite former."], [9, "l", 17, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "3 · Inhibitors and promoters", "<b>Matrix</b> is ≈ <span class=\"key\">2.5%</span> of stone weight and contains matrix substance A (found in formers only)."], [9, "r", 17, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "4 · Mineral metabolism", "Proximal tubule · <span class=\"key\">60–65%</span> · Paracellular; claudin-2"], [9, "r", 17, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "5 · Classification", "Calcium oxalate (pure or with apatite) · <span class=\"key\">60%</span>"], [9, "p", 18, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "5 · Classification", "Classify by the <b>urinary abnormality, not the stone</b>: composition starts the work-up. Fewer than 3% have no abnormality. Work-up: see <span class=\"xref\">Ch 99</span>."], [9, "l", 18, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "6 · Hypercalciuria", "<b>Definition</b>: &gt; <span class=\"key\">200 mg/day</span> after 1 week on a 400 mg calcium, 100 mEq sodium diet; or &gt; 4 mg/kg/day; or &gt; 7 mmol/day (men) or 6 mmol/day (women)."], [9, "p", 19, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "6 · Hypercalciuria", "<b>Fasting urine and PTH separate gut from kidney</b>: in renal leak, fasting calcium and PTH are high; in absorptive hypercalciuria, fasting calcium is normal and PTH suppressed."], [9, "l", 19, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "6 · Hypercalciuria", "<b>PHPT</b> causes ≈ 5% of stones, and stones occur in &lt; 5% of PHPT. Suspect it if serum calcium is &gt; <span class=\"key\">10.1 mg/dL</span>; repeat with intact PTH, and use ionised calcium for normocalcaemic PHPT."], [9, "l", 19, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "7 · Hyperoxaluria", "<b>Definition</b>: &gt; <span class=\"key\">40 mg/day</span>. Types: primary, enteric, dietary and idiopathic."], [9, "a", 19, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "7 · Hyperoxaluria", "<p><b>Enteric hyperoxaluria</b></p><ol>\n<li>Fat malabsorption leaves fatty acids in the gut lumen.</li>\n<li>Fatty acids saponify calcium and magnesium, so less calcium binds oxalate and more oxalate is free.</li>\n<li>Free oxalate undergoes <b>colonic hyperabsorption</b>, helped by bile salts that increase colonic permeability.</li>\n</ol>"], [9, "l", 20, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "8 · Hyperuricosuria, hypocitraturia, hypomagnesiuria", "<b>Hyperuricosuria</b> is &gt; <span class=\"key\">600 mg/day</span> (diet, gout, myeloproliferative disease, hypoxanthine-guanine phosphoribosyltransferase [HGPRT] deficiency)."], [9, "l", 20, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "8 · Hyperuricosuria, hypocitraturia, hypomagnesiuria", "<b>Hypocitraturia</b> is &lt; <span class=\"key\">320 mg/day</span>; <b>acid–base status is the main determinant</b>. Causes: distal RTA, chronic diarrhoea, animal protein, thiazides (through hypokalaemia), angiotensin-converting enzyme (ACE) inhibitors."], [9, "p", 20, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "8 · Hyperuricosuria, hypocitraturia, hypomagnesiuria", "Citrate excretion reads the proximal-tubular <b>intracellular pH</b>: acidosis, hypokalaemia or an acid diet make the tubule reclaim citrate. Hence potassium citrate is the treatment (see <span class=\"xref\">Ch 99</span>)."], [9, "p", 21, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "9 · Renal tubular acidosis", "Stone risk in RTA follows citrate and pH: only distal RTA combines fixed alkaline urine with profound hypocitraturia and hypercalciuria, the recipe for <b>calcium phosphate</b> stones."], [9, "l", 21, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "10 · Uric acid stones", "The pKa of uric acid is <span class=\"key\">5.35</span>. Undissociated uric acid dissolves only to ≈ 96–100 mg/L, but at pH 6.5 &gt; 1200 mg/L stays soluble."], [9, "a", 21, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "10 · Uric acid stones", "<p><b>Why the urine is acid in insulin resistance</b></p><ol>\n<li>Insulin resistance and lipotoxicity make the tubule burn fatty acids, not glutamine, and lower sodium–hydrogen exchanger 3 (NHE3) activity.</li>\n<li>Proximal ammoniagenesis falls, so H⁺ is excreted as titratable acid.</li>\n<li>Urine pH stays <b>persistently low</b>, uric acid stays undissociated, and stones form.</li>\n</ol>"], [9, "p", 21, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "10 · Uric acid stones", "Uric acid stones are a disease of <b>urine pH, not uric acid</b>. No inhibitor exists, so raising pH above the pKa removes the driver; <span class=\"dag\">†</span>alkalinisation can dissolve stones (see <span class=\"xref\">Ch 99</span>)."], [9, "a", 21, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "11 · Cystine and struvite stones", "<p><b>Urease cascade</b></p><ol>\n<li>Urease splits urea into ammonia (NH₃) and CO₂.</li>\n<li>Ammonia forms NH₄⁺ and OH⁻, raising urine pH to 7.2–8.0.</li>\n<li>With magnesium, phosphate forms <b>struvite</b>; with calcium, carbonate apatite.</li>\n</ol>"], [9, "p", 23, "Ch 95 · Urinary Lithiasis: Etiology, Epidemiology and Pathogenesis", "13 · Anatomic predisposition and pregnancy", "Anatomy sets the stage but metabolism writes the stone: anatomical stone formers still need <b>metabolic evaluation</b>, and pyeloplasty alone does not prevent recurrence (see <span class=\"xref\">Ch 99</span>)."], [9, "l", 24, "Ch 96 · Acute Care of Urinary Lithiasis", "1 · Presentation and diagnosis", "Haematuria occurs in ~<span class=\"key\">90%</span>, so it is absent in &gt;10%."], [9, "r", 24, "Ch 96 · Acute Care of Urinary Lithiasis", "1 · Presentation and diagnosis", "Low-dose NCCT (≤<span class=\"key\">3 mSv</span>) · Equal for stones ≥3 mm · Weak &lt;3 mm and in obesity"], [9, "p", 24, "Ch 96 · Acute Care of Urinary Lithiasis", "1 · Presentation and diagnosis", "Unknown diagnosis: NCCT answers everything at once. Known stone: US showing hydronephrosis suffices."], [9, "l", 25, "Ch 96 · Acute Care of Urinary Lithiasis", "3 · Medical expulsive therapy (MET)", "Trial of passage, with or without MET, lasts <span class=\"key\">4–6 weeks</span>."], [9, "l", 25, "Ch 96 · Acute Care of Urinary Lithiasis", "4 · Urgent intervention", "<b>Stent failure</b> is predicted by P-CUT ≥<span class=\"key\">7.5 mm</span> (strongest), stone ≥9.5 mm and multiple stones; prefer PCN then."], [9, "a", 25, "Ch 96 · Acute Care of Urinary Lithiasis", "4 · Urgent intervention", "<ol>\n<li>Give analgesia; get NCCT.</li>\n<li>If infection or an AUA criterion, then drain only (stent/PCN); treat the stone later.</li>\n<li>If not and stone &lt;10 mm, then trial with or without MET for 4–6 weeks.</li>\n<li>If it fails, then URS or SWL.</li>\n</ol>"], [9, "l", 25, "Ch 96 · Acute Care of Urinary Lithiasis", "5 · Special populations", "Resistive index difference ≥<span class=\"key\">0.06</span> means obstruction."], [9, "l", 25, "Ch 96 · Acute Care of Urinary Lithiasis", "5 · Special populations", "~30% need intervention; change stent/PCN every <span class=\"key\">4–6 weeks</span>."], [9, "l", 27, "Ch 97 · Surgical Management of Ureteral Calculi", "1 · Background and indications", "Medical expulsive therapy (MET) is controversial after SUSPEND <span class=\"xref\">(Ch 96)</span>; intervene after <span class=\"key\">4–6 weeks</span>."], [9, "p", 27, "Ch 97 · Surgical Management of Ureteral Calculi", "1 · Background and indications", "Why only URS tolerates anticoagulation: SWL and PCNL injure parenchyma where bleeding is unseen and uncontrollable; laser URS works inside the lumen under vision."], [9, "r", 28, "Ch 97 · Surgical Management of Ureteral Calculi", "2 · Choosing treatment", "SWL · Historical limit 2 cm; SFR falls above <span class=\"key\">10–15 mm</span>"], [9, "p", 28, "Ch 97 · Surgical Management of Ureteral Calculi", "2 · Choosing treatment", "Constant trade-off: SWL means fewer complications but more sessions; URS means one session with slightly more morbidity."], [9, "r", 28, "Ch 97 · Surgical Management of Ureteral Calculi", "3 · Ureteroscopes", "Cost · Cheap · Repair ~every <span class=\"key\">15</span> cases · Low volume"], [9, "l", 28, "Ch 97 · Surgical Management of Ureteral Calculi", "4 · Access", "For a difficult ureter, place a stent and return after <span class=\"key\">2–4 weeks</span>."], [9, "a", 28, "Ch 97 · Surgical Management of Ureteral Calculi", "4 · Access", "<ol>\n<li>If the wire will not pass, place an open-ended catheter 1–2 mm short of the stone.</li>\n<li>Do a retrograde pyelogram.</li>\n<li>Use contrast hydrodissection with a hydrophilic wire.</li>\n<li>Advance the catheter past the stone, then exchange for a stiff wire.</li>\n</ol>"], [9, "l", 29, "Ch 97 · Surgical Management of Ureteral Calculi", "5 · Lithotripsy", "<b>Thermal</b> damage begins above <span class=\"key\">43 °C</span>, and <b>heat tracks power, not laser type</b>."], [9, "l", 29, "Ch 97 · Surgical Management of Ureteral Calculi", "5 · Lithotripsy", "Cap at <span class=\"key\">≤10 W in ureter</span> and ≤25 W in kidney; use a sheath and continuous irrigation, because stopping it causes thermal stricture."], [9, "l", 30, "Ch 97 · Surgical Management of Ureteral Calculi", "7 · SWL for ureteral calculi", "Technique <span class=\"xref\">(Ch 98)</span>: upper ureter supine, mid-ureter over the sacrum <b>prone</b>, distal supine; <span class=\"key\">60–90 shocks/min</span> beats 120; ramp the energy."], [9, "l", 30, "Ch 97 · Surgical Management of Ureteral Calculi", "8 · Special situations", "<b>Pregnancy</b>: treat conservatively first; <b>SWL is contraindicated</b>; URS is safe with shielded fluoroscopy. Stents encrust, so change them <span class=\"key\">every 4 weeks</span>; use a retrograde stent before a nephrostomy."], [9, "p", 31, "Ch 97 · Surgical Management of Ureteral Calculi", "9 · Complications", "Nearly every serious URS complication is force without vision: blind basketing, forced sheaths, persistence in a tight ureter. Remedy: see, fragment, and when in doubt stop, stent and stage."], [9, "p", 32, "Ch 98 · Surgical Management of Upper Urinary Tract Calculi", "1 · Choosing the approach", "Only the stone domain is changed by choosing a modality; anatomy and patient factors decide which modality is available. Obesity, coagulopathy and pregnancy each exclude <i>a</i> modality, not surgery."], [9, "l", 32, "Ch 98 · Surgical Management of Upper Urinary Tract Calculi", "1 · Choosing the approach", "The natural history is not benign: <span class=\"key\">~50%</span> have a stone event within <b>5 years</b>."], [9, "l", 32, "Ch 98 · Surgical Management of Upper Urinary Tract Calculi", "1 · Choosing the approach", "Treat residual fragments <b>&gt;<span class=\"key\">4 mm</span></b> after ureteroscopy (URS)."], [9, "l", 32, "Ch 98 · Surgical Management of Upper Urinary Tract Calculi", "1 · Choosing the approach", "SWL works best when density is <b>&lt;<span class=\"key\">900 HU</span></b> (Hounsfield units) and skin-to-stone distance (SSD) is <b>&lt;<span class=\"key\">10 cm</span></b>."], [9, "l", 33, "Ch 98 · Surgical Management of Upper Urinary Tract Calculi", "2 · Shock wave lithotripsy", "The first human SWL was in 1980 (Dornier); the electrohydraulic HM3 remains the efficacy benchmark <span class=\"tag\">MCQ</span>."], [9, "l", 33, "Ch 98 · Surgical Management of Upper Urinary Tract Calculi", "2 · Shock wave lithotripsy", "<b>Absolute contraindications</b> are pregnancy, uncorrected coagulopathy or antithrombotics, untreated UTI, severe untreated hypertension, aortic or renal artery aneurysm (aorta &gt;<span class=\"key\">4 cm</span>), and obstruction distal to the stone."], [9, "l", 33, "Ch 98 · Surgical Management of Upper Urinary Tract Calculi", "3 · Ureteroscopy (retrograde intrarenal surgery, RIRS)", "Landmarks <span class=\"tag\">MCQ</span>: Bozzini's Lichtleiter 1806 was the first endoscope; Takayasu placed the first ureteral access sheath (UAS) in 1974."], [9, "l", 34, "Ch 98 · Surgical Management of Upper Urinary Tract Calculi", "4 · Percutaneous nephrolithotomy", "Landmarks <span class=\"tag\">MCQ</span>: Fernström and Johansson 1976, first percutaneous stone removal; Wickham 1984, first tubeless; Valdivia-Uría 1987, first supine; Jackman 1998, first mini-perc (13 Fr)."], [9, "a", 35, "Ch 98 · Surgical Management of Upper Urinary Tract Calculi", "4 · Percutaneous nephrolithotomy", "<ol>\n<li>Confirm the collecting system and ureter are clear.</li>\n<li>Withdraw the sheath under vision, with the safety wire out last.</li>\n<li>Compress the tract.</li>\n<li>If bleeding persists, re-inflate the balloon or place a <b>Kaye tamponade catheter</b>, and alert the anaesthetist.</li>\n<li>If it still persists, arrange <b>selective angioembolisation</b>.</li>\n</ol>"], [9, "l", 37, "Ch 99 · Prevention of Urinary Stone Disease", "1 · Stone disease as a chronic condition", "Up to <span class=\"key\">50%</span> recur within 5–10 years. The <b>ROKS</b> nomogram predicts a second stone, and ROKS 2 predicts multiple recurrences."], [9, "l", 37, "Ch 99 · Prevention of Urinary Stone Disease", "3 · General measures (all formers)", "<b>Fluid</b> is the cornerstone: aim for urine ≥<span class=\"key\">2.5 L/day</span> (about 3 L intake)."], [9, "p", 37, "Ch 99 · Prevention of Urinary Stone Disease", "3 · General measures (all formers)", "Why normal calcium? Dietary calcium binds oxalate in the gut; restricting it frees oxalate for absorption."], [9, "l", 37, "Ch 99 · Prevention of Urinary Stone Disease", "4 · Hypercalciuria: thiazides", "The American Urological Association (AUA) makes thiazides the <b>preferred drug</b> for hypercalciuria with recurrent calcium stones, <b>and</b> for recurrent calcium stones with a normal evaluation. Yendt 1966 <span class=\"tag\">MCQ</span>."], [9, "l", 38, "Ch 99 · Prevention of Urinary Stone Disease", "6 · Hypocitraturia", "<b>Alkali citrate, not total citrate, matters</b>. Orange juice also raises oxalate, and the Moonstone supplement is acidic <span class=\"tag\">MCQ</span>."], [9, "a", 39, "Ch 99 · Prevention of Urinary Stone Disease", "8 · Cystine stones", "<ol>\n<li><b>Dilute</b>: urine ≥<span class=\"key\">3 L/day</span>, including at night; sodium ≤2300 mg/day; moderate protein (not in children).</li>\n<li>Aim for cystine &lt;<span class=\"key\">250 mg/L</span>.</li>\n<li>If not enough, <b>alkalinise</b> with potassium citrate to pH <span class=\"key\">7.0–7.5</span>.</li>\n<li>If still forming stones, add a <b>thiol</b> (tiopronin).</li>\n</ol>"], [9, "l", 39, "Ch 99 · Prevention of Urinary Stone Disease", "9 · Infection (struvite) stones", "AHA is contraindicated if creatinine is &gt;<span class=\"key\">2.5 mg/dL</span> or in pregnancy."], [9, "a", 39, "Ch 99 · Prevention of Urinary Stone Disease", "10 · Monitoring", "<ol>\n<li>Start therapy.</li>\n<li>Repeat the 24-hour urine within <span class=\"key\">6 months</span>.</li>\n<li>Then check urine and blood (for side effects) at least yearly.</li>\n<li>If a new stone forms, <b>re-analyse</b> it.</li>\n<li>Image periodically.</li>\n</ol>"], [9, "r", 41, "Ch 100 · Lower Urinary Tract Calculi", "1 · Bladder calculi", "Patient · Children; peak <span class=\"key\">2–4 years</span>; boys far more than girls · Men &gt;60 with outlet obstruction"], [9, "p", 41, "Ch 100 · Lower Urinary Tract Calculi", "1 · Bladder calculi", "Primary stone is a disease of the urine (normal bladder); secondary is a disease of the bladder (stasis, nidus, infection). Do not hunt for outlet obstruction in the endemic child."], [9, "l", 42, "Ch 100 · Lower Urinary Tract Calculi", "3 · Special situations", "<b>Spinal cord injury</b>: risk peaks <span class=\"key\">3 months</span> after injury; 15–30% form stones within 10 years."], [9, "l", 43, "Ch 54 · Management of Paediatric Kidney Stone Disease", "1 · Epidemiology", "Early onset means stones before <span class=\"key\">24 years</span>."], [9, "r", 43, "Ch 54 · Management of Paediatric Kidney Stone Disease", "1 · Epidemiology", "Calcium oxalate (CaOx) · ≈ <span class=\"key\">80%</span>, mostly idiopathic, on Randall's plaques · 75–80%"], [9, "p", 43, "Ch 54 · Management of Paediatric Kidney Stone Disease", "1 · Epidemiology", "Stone formers get more CKD, hypertension and fracture. Childhood is the bone-accrual window, so seek low BMD early."], [9, "a", 43, "Ch 54 · Management of Paediatric Kidney Stone Disease", "2 · Diagnosis and imaging", "<ol>\n<li>If a stone is suspected, do grey-scale <b>ultrasound (US)</b> with colour Doppler.</li>\n<li>If US is negative but suspicion is high, or there is hydronephrosis, then do <b>low-dose non-contrast computed tomography (NCCT)</b>.</li>\n<li>If US is negative and suspicion is low, stop.</li>\n</ol>"], [9, "r", 44, "Ch 54 · Management of Paediatric Kidney Stone Disease", "3 · Metabolic evaluation: every child", "Calcium · &lt; <span class=\"key\">4 mg/kg/day</span>; spot Ca : creatinine &lt; 0.8 (0–6 mo), &lt; 0.6 (7–12 mo), &lt; <span class=\"key\">0.21</span> (&gt; 2 y)"], [9, "p", 44, "Ch 54 · Management of Paediatric Kidney Stone Disease", "3 · Metabolic evaluation: every child", "Never use adult limits: infants excrete more calcium, so the school-age 0.21 ratio overcalls them. Citrate's abnormality is too <i>little</i>."], [9, "l", 45, "Ch 54 · Management of Paediatric Kidney Stone Disease", "5 · Management principles", "The residual fragment threshold is <span class=\"key\">4 mm on US</span>: 2 mm on CT plus the ≈ 2 mm US overestimate."], [9, "r", 45, "Ch 54 · Management of Paediatric Kidney Stone Disease", "5 · Management principles", "Uncomplicated ureteric ≤ <span class=\"key\">10 mm</span> · Observation with or without an α-blocker"], [9, "r", 45, "Ch 54 · Management of Paediatric Kidney Stone Disease", "5 · Management principles", "Renal ≤ <span class=\"key\">20 mm</span> · SWL or URS"], [9, "a", 45, "Ch 54 · Management of Paediatric Kidney Stone Disease", "6 · Ureteroscopy", "<ol>\n<li>Confirm a sterile culture; place in lithotomy; do cystoscopy.</li>\n<li>Do a retrograde pyelogram and place a safety wire.</li>\n<li>Calibrate the orifice with an 8/10 Fr coaxial dilator.</li>\n<li><b>If it will not pass, then place a 4.6–4.8 Fr stent for ≥ 14 days and return later.</b></li>\n<li>If it passes, do URS.</li>\n<li>Stent if the case was long, needed many passes, or caused trauma or oedema.</li>\n</ol>"], [9, "a", 46, "Ch 54 · Management of Paediatric Kidney Stone Disease", "8 · Percutaneous nephrolithotomy", "<ol>\n<li>Prevent hypothermia; place a ureteric catheter.</li>\n<li>Position prone (latex precautions in myelomeningocele).</li>\n<li>Puncture a posterior calyx under US or fluoroscopy.</li>\n<li>Dilate serially to an 18 Fr sheath (24 Fr for staghorn).</li>\n<li>Fragment with nephroscope and ultrasonic or laser energy; check with a flexible scope.</li>\n<li>Place a nephrostomy (7 Fr infant to 16 Fr adolescent).</li>\n</ol>"], [9, "a", 48, "Ch 125 · Genital and Lower Urinary Tract Trauma", "2 · Penile fracture", "<ol>\n<li>Explore promptly. Through a ventral penoscrotal (or small lateral) incision, evacuate haematoma and find the tear (artificial erection).</li>\n<li>Irrigate; close the tunica with interrupted <b>2-0/3-0 absorbable</b> sutures.</li>\n<li>If the urethra is injured, repair it.</li>\n</ol>"], [9, "l", 48, "Ch 125 · Genital and Lower Urinary Tract Trauma", "3 · Penetrating, bite, amputation, zipper and strangulation", "Urethral injury occurs in <span class=\"key\">15–50%</span> of penile gunshots, so check with RUG or intraoperative dye. Viable tissue is repaired primarily; high-velocity tissue loss needs suprapubic diversion and staged repair."], [9, "a", 49, "Ch 125 · Genital and Lower Urinary Tract Trauma", "3 · Penetrating, bite, amputation, zipper and strangulation", "<ol>\n<li>Suprapubic cystostomy; debride.</li>\n<li>Tunica with 2-0 absorbable; urethra over a catheter with 4-0.</li>\n<li>Anastomose dorsal artery with <b>11-0</b>, dorsal vein with <b>9-0</b> and dorsal nerve with <b>10-0</b> nylon.</li>\n<li>Provide skin cover.</li>\n</ol>"], [9, "a", 49, "Ch 125 · Genital and Lower Urinary Tract Trauma", "4 · Testicular injury", "<ol>\n<li>Explore; remove necrotic and extruded tubules.</li>\n<li>Close the tunica with small absorbable sutures.</li>\n<li>If the defect is large, use a tunica vaginalis flap or graft (never synthetic); drain.</li>\n</ol>"], [9, "l", 50, "Ch 125 · Genital and Lower Urinary Tract Trauma", "4 · Testicular injury", "Salvage is <span class=\"key\">&gt;90%</span> if repaired within <b>72 h</b>; non-operative care leads to infection, atrophy and late orchidectomy."], [9, "p", 51, "Ch 125 · Genital and Lower Urinary Tract Trauma", "6 · Bladder injury", "Immediate repair: intraperitoneal, penetrating, bladder neck, rectal/vaginal injury, bone fragments in bladder, clots/poor drainage, iatrogenic urological injury, laparotomy for other reasons."], [9, "a", 51, "Ch 125 · Genital and Lower Urinary Tract Trauma", "7 · Posterior urethral injury (PFUI)", "<ol>\n<li>If there is blood at the meatus, do RUG before any catheter.</li>\n<li>Place a 16-Fr catheter in the fossa navicularis and inflate the balloon with 3 mL.</li>\n<li>Apply penile traction, position oblique, inject 20 mL contrast and image during injection.</li>\n</ol>"], [9, "r", 53, "Ch 62 · Paediatric Genitourinary Trauma", "1 · Renal injury: how the child differs", "Blood pressure · Maintained until ≈ <span class=\"key\">25–30% volume loss</span>; hypotension is late · Falls earlier"], [9, "l", 53, "Ch 62 · Paediatric Genitourinary Trauma", "2 · Indications for imaging", "Paediatric triggers: fall &gt; <span class=\"key\">10 feet (3 m)</span>, high-speed collision, flank blow; rib, spine, femur or pelvic fracture. All four markers together (haematuria, hypotension, associated injury, mechanism) give &gt; <span class=\"key\">98% sensitivity</span>."], [9, "p", 53, "Ch 62 · Paediatric Genitourinary Trauma", "2 · Indications for imaging", "Trap: \"no haematuria, so no imaging\". Haematuria is one of four routes into imaging; in children both adult markers fail, so mechanism drives the decision."], [9, "p", 54, "Ch 62 · Paediatric Genitourinary Trauma", "4 · Grading", "Grades 1–3 differ only in depth (1 cm) and never involve the collecting system — entry makes grade 4. Shattered kidney: grade 5 (1989), grade 4 (2011)."], [9, "r", 54, "Ch 62 · Paediatric Genitourinary Trauma", "4 · Grading", "Perirenal haematoma &gt; 3.5 cm adult, &gt; <span class=\"key\">2.2 cm child</span> · Bleeding needing angioembolisation"], [9, "a", 54, "Ch 62 · Paediatric Genitourinary Trauma", "5 · Non-operative management (NOM)", "<ol>\n<li>Confirm stability; grade the injury.</li>\n<li>Bed rest, with serial haemoglobin and abdominal examination.</li>\n<li>When gross haematuria resolves and counts are stable, mobilise.</li>\n</ol>"], [9, "l", 54, "Ch 62 · Paediatric Genitourinary Trauma", "5 · Non-operative management (NOM)", "Grade 3 (devitalised) to 5: ≈ <span class=\"key\">25%</span> need embolisation, ≈ <span class=\"key\">15%</span> urinoma intervention, ≈ 5% exploration."], [9, "l", 54, "Ch 62 · Paediatric Genitourinary Trauma", "6 · Complications during NOM", "<b>Urine leaks</b> occur only in grade 4–5, and up to <span class=\"key\">85%</span> resolve. A urinoma shows the triad of <b>flank pain, ileus and low-grade fever</b>."], [9, "r", 55, "Ch 62 · Paediatric Genitourinary Trauma", "6 · Complications during NOM", "Timing · From injury · Typically <span class=\"key\">1–2 weeks</span> (up to 1 month)"], [9, "a", 55, "Ch 62 · Paediatric Genitourinary Trauma", "7 · Operative management", "<ol>\n<li>Confirm a contralateral kidney.</li>\n<li>Open Gerota fascia; control the vessels; debride; close the collecting system, then parenchyma over a bolster.</li>\n<li>Drain. If the injury is penetrating, inspect the ureter.</li>\n</ol>"], [9, "r", 56, "Ch 62 · Paediatric Genitourinary Trauma", "9 · Ureteral trauma", "II / III · &lt; 50% / ≥ <span class=\"key\">50%</span> transection"], [9, "r", 56, "Ch 62 · Paediatric Genitourinary Trauma", "9 · Ureteral trauma", "V · Avulsion, &gt; <span class=\"key\">2 cm</span> devascularisation"], [9, "p", 57, "Ch 62 · Paediatric Genitourinary Trauma", "10 · Bladder injury", "Bladder neck avulsion is commoner in children; girls depend more on the bladder neck for continence, so outcome is poor — many need secondary procedures, even closure and diversion."], [9, "a", 57, "Ch 62 · Paediatric Genitourinary Trauma", "11 · Urethral injury", "<ol>\n<li>Divert with a suprapubic tube and wait several months.</li>\n<li>Assess with cystogram and RUG, with or without endoscopy.</li>\n<li>Do transperineal excision and primary anastomosis; if there is tension, add pubectomy.</li>\n<li>Catheter for 2–3 weeks; cystogram; remove the suprapubic tube.</li>\n</ol>"], [9, "p", 57, "Ch 62 · Paediatric Genitourinary Trauma", "12 · Genital injury", "Most are accidental, but <b>abuse must always be assessed</b> (≈ 1 in 7 boys, 1 in 3 girls abused). Examine anus and rectum; involve social services before discharge."], [9, "a", 58, "★ Putting it together", "A · Renal colic", "<ol>\n<li>Give a non-steroidal anti-inflammatory drug (NSAID; ketorolac 30 mg) unless there is renal failure, bleeding or pregnancy. Non-contrast computed tomography (NCCT) confirms; use ultrasound first in pregnancy and children (see Ch 96).</li>\n<li>If there is infection, bilateral obstruction, a solitary kidney, immunosuppression, renal deterioration or refractory pain or vomiting, then <b>decompress now</b> (stent or nephrostomy; equal). Never lithotripsy while infected.</li>\n<li><b>Otherwise</b>, if the stone is &lt;10 mm, try passage with or without an α-blocker (distal 5–10 mm) for 4–6 weeks. If that fails, do ureteroscopy (URS) or shock wave lithotripsy (SWL) (see Ch 97).</li>\n</ol>"], [9, "p", 58, "★ Putting it together", "B · Stone operation", "SWL absolute contraindications: pregnancy, coagulopathy or antithrombotics, untreated infection, uncontrolled hypertension, arterial aneurysm, and obstruction distal to the stone. No routine stent after SWL or uncomplicated URS (see Ch 98)."], [9, "a", 58, "★ Putting it together", "C · Prevention", "<ol>\n<li><b>All patients:</b> urine ≥2.5 L/day <span class=\"dag\">†</span>, normal calcium, low sodium and less animal protein (see Ch 99).</li>\n<li><b>If high risk</b>, collect 24-hour urines, give targeted therapy and repeat the urines within 6 months.</li>\n</ol>"], [9, "a", 59, "★ Putting it together", "D · Renal trauma", "<ol>\n<li><b>Image</b> with delayed-phase CT for gross haematuria, microhaematuria with shock, deceleration or penetrating injury (see Ch 94).</li>\n<li>If stable with grade I–IV (or selected V), manage <b>non-operatively</b> (&gt;90% succeed). If there is a contrast blush, embolise; if a leak is symptomatic, stent.</li>\n<li>If unstable or the haematoma is expanding, <b>explore</b>; a one-shot pyelogram (2 mL/kg, 10 min) confirms the other kidney.</li>\n</ol>"], [9, "p", 60, "★ Putting it together", "G · Children", "<b>Stones:</b> ultrasound first, and a full metabolic evaluation after the first stone. Renal ≤20 mm: SWL or URS; &gt;20 mm: PCNL (see Ch 54). <b>Trauma:</b> image by mechanism (fall &gt;3 m, deceleration), because blood pressure falls late; a perirenal haematoma &gt;2.2 cm predicts embolisation (see Ch 62)."], [10, "l", 2, "Ch 129 · Tumours of the Urinary Bladder", "1 · Epidemiology (headline)", "The median age at diagnosis is <span class=\"key\">73</span>, and about 9 in 10 patients are over 55. The <b>male:female ratio is about 3:1</b>."], [10, "l", 2, "Ch 129 · Tumours of the Urinary Bladder", "2 · Risk factors", "<b>Smoking</b> causes <span class=\"key\">30–40%</span> of UC and raises risk <span class=\"key\">2–3×</span>. Pipes, cigars and e-cigarettes count too."], [10, "l", 2, "Ch 129 · Tumours of the Urinary Bladder", "2 · Risk factors", "<b>N-acetyltransferase 2 (NAT2) slow acetylators</b> carry the highest risk, because acetylation detoxifies aromatic amines. Risk falls to near that of never-smokers <span class=\"key\">&gt;15 years</span> after quitting."], [10, "r", 3, "Ch 129 · Tumours of the Urinary Bladder", "3 · Pathology", "Dysplasia · Loss of polarity, umbrella cells kept; CK20, p53 · 14–19% progress; <span class=\"key\">60%</span> progress to CIS if there was prior cancer"], [10, "p", 4, "Ch 129 · Tumours of the Urinary Bladder", "3 · Pathology", "Small cell is systemic disease. Primary cystectomy gives poor disease-free survival (DFS) that adjuvant chemotherapy does not rescue, whereas neoadjuvant chemotherapy markedly improves cancer-specific survival. SCC in spinal cord injury fell after the switch to intermittent self-catheterisation, which shows that inflammation drives it."], [10, "l", 5, "Ch 129 · Tumours of the Urinary Bladder", "4 · Molecular biology", "In TCGA, luminal-infiltrated tumours respond poorly to cisplatin NAC (try immunotherapy); neuronal ones get etoposide–cisplatin; APOBEC-high survives better. <span class=\"tag\">MCQ</span> Micropapillary maps to a luminal class."], [10, "l", 5, "Ch 129 · Tumours of the Urinary Bladder", "5 · Clinical presentation and evaluation", "<b>Painless gross haematuria occurs in <span class=\"key\">85%</span></b>, and microscopic haematuria in nearly all. Irritative symptoms suggest CIS."], [10, "a", 6, "Ch 129 · Tumours of the Urinary Bladder", "5 · Clinical presentation and evaluation", "<ol>\n<li>Cytology shows high-grade cells but cystoscopy is negative.</li>\n<li>Take random bladder biopsies and prostatic urethral biopsies.</li>\n<li>If these are negative, take selective upper-tract washings for cytology, with or without ureteroscopy.</li>\n</ol>"], [10, "l", 7, "Ch 129 · Tumours of the Urinary Bladder", "6 · Staging and risk groups", "<b>The 2017 change</b>: regional nodes without distant metastasis are now stage III (previously IV). <span class=\"tag\">MCQ</span> Common iliac nodes are N3, not M1a."], [10, "l", 8, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "1 · Definition and natural history", "<b>Non-muscle-invasive bladder cancer (NMIBC)</b> is urothelial carcinoma (UC) that has not invaded the detrusor: Ta, T1 and carcinoma in situ (CIS). It makes up <span class=\"key\">70–80%</span> of new bladder cancers: Ta 60–70%, T1 20–30%, CIS ~10% <span class=\"xref\">See Ch 129</span>."], [10, "l", 8, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "1 · Definition and natural history", "Recurrence occurs in <span class=\"key\">40–60%</span>; progression in ~6% of low-grade (LG) Ta to 17% of high-grade (HG) T1."], [10, "l", 8, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "1 · Definition and natural history", "<b>Grade, not stage, is the strongest predictor of progression</b>, and CIS comes second. HG Ta and HG T1 progress similarly. Primary CIS progresses in <span class=\"key\">&gt;50%</span>, and untreated CIS reaches muscle in 40–83%."], [10, "l", 8, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "1 · Definition and natural history", "<b>Understaging</b>: cystectomy for presumed NMIBC shows worse disease in <span class=\"key\">one-third to one-half</span>; clinical T1 is unreliable."], [10, "p", 8, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "1 · Definition and natural history", "NMIBC is two diseases. LG disease is a <b>recurrence</b> problem; HG disease is a <b>progression</b> problem. Chemotherapy treats recurrence, bacille Calmette-Guérin (BCG) treats progression, and cystectomy is for progression that cannot be controlled."], [10, "r", 8, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "2 · Risk stratification", "Low · LG solitary Ta <span class=\"key\">≤3 cm</span>; papillary urothelial neoplasm of low malignant potential (PUNLMP) · Single postoperative chemotherapy instillation"], [10, "r", 8, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "2 · Risk stratification", "High · HG T1; recurrent HG Ta; HG Ta &gt;3 cm or multifocal; <b>any CIS</b>; any BCG failure in HG; <b>any variant histology</b>; <b>any lymphovascular invasion (LVI)</b>; any HG prostatic urethral involvement · Induction BCG and maintenance to <span class=\"key\">3 yr</span>. If BCG-unresponsive: radical cystectomy (RC), pembrolizumab, nadofaragene or gemcitabine–docetaxel"], [10, "l", 9, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "2 · Risk stratification", "EORTC <b>overestimates</b> risk, because its patients had little maintenance BCG, perioperative mitomycin C (MMC) or re-TURBT. CUETO, derived in BCG-treated patients, fits better. <span class=\"tag\">MCQ</span> Both use <b>WHO 1973</b>."], [10, "l", 9, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "3 · Endoscopic management", "Image the upper tracts at diagnosis by computed tomography urography or retrograde pyelography. Upper tract tumours occur in <span class=\"key\">&lt;5%</span>; risks are trigonal tumour, CIS and high risk."], [10, "r", 9, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "3 · Endoscopic management", "Recommended (within <span class=\"key\">6 weeks</span>, include muscularis propria) · Consider"], [10, "l", 9, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "3 · Endoscopic management", "Small (<span class=\"key\">≤1 cm</span>) LG recurrences can be fulgurated or lasered in the office. No tissue is obtained, so this needs <b>prior LG diagnosis and negative cytology</b>. <b>Active surveillance</b> of small LG tumours is safe in selected patients."], [10, "r", 9, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "3 · Endoscopic management", "Gain · ~<span class=\"key\">one-third more CIS</span>; smaller papillary tumours · More papillary tumours and CIS"], [10, "l", 10, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "4 · Single post-operative instillation", "Give MMC within <span class=\"key\">6 h</span>; the evidence is level 1. The gain is limited in recurrent or multiple tumours. Thiotepa is ineffective."], [10, "a", 11, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "6 · Bacille Calmette-Guérin (BCG)", "<ol>\n<li>Wait <span class=\"key\">2–4 weeks</span> after TURBT (re-epithelialisation).</li>\n<li>Check urinalysis before each dose (exclude infection, gross bleeding).</li>\n<li>Instil 1 vial in 50 mL saline by catheter.</li>\n<li>Retain 1–2 h; restrict fluids, diuretics and caffeine beforehand.</li>\n<li>If catheterisation is traumatic, delay several days.</li>\n</ol>"], [10, "l", 11, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "6 · Bacille Calmette-Guérin (BCG)", "In CIS, the initial CR is up to <span class=\"key\">84%</span>, and about half are durable."], [10, "a", 11, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "6 · Bacille Calmette-Guérin (BCG)", "<ol>\n<li><b>SWOG (Southwest Oncology Group; Lamm 2000)</b>: give induction weekly ×6.</li>\n<li>Then give 3 weekly instillations at <span class=\"key\">3 and 6 months, then every 6 months to 3 yr</span>.</li>\n<li>If high risk, give full dose for 3 yr. If intermediate risk, give 1 yr (EORTC 30962).</li>\n</ol>"], [10, "l", 11, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "6 · Bacille Calmette-Guérin (BCG)", "<span class=\"tag\">MCQ</span> BCG is resistant to <b>pyrazinamide</b>. Avoid cycloserine (psychiatric effects). Asymptomatic granulomatous prostatitis needs no treatment."], [10, "a", 12, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "6 · Bacille Calmette-Guérin (BCG)", "<ol>\n<li>Prioritise high-risk patients.</li>\n<li>Reduce the dose, especially in maintenance, and split vials.</li>\n<li>Use chemotherapy: single agent for intermediate, Gem/Doce for high risk. Early RC for the highest risk.</li>\n</ol>"], [10, "p", 12, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "7 · Recurrence after BCG", "<b>Trap:</b> HG T1 at 3 months after induction alone counts as unresponsive. CIS or HG Ta at 3 months is \"resistant\", so give more BCG."], [10, "l", 12, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "8 · Early radical cystectomy in high-risk NMIBC", "T1 failing BCG at 3 months progresses in <span class=\"key\">82%</span>, and CIS in ~50%. With prolonged intravesical therapy, only ~¼ are alive with their bladder at 15 yr."], [10, "l", 12, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "8 · Early radical cystectomy in high-risk NMIBC", "Immediate RC for clinical T1 gives 10-yr disease-free survival of <span class=\"key\">92%</span> (64% if understaged). Even a 12-week delay worsens survival."], [10, "a", 13, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "8 · Early radical cystectomy in high-risk NMIBC", "<ol>\n<li><b>Strongly consider RC</b> if: BCG-unresponsive HG; persistent HG T1 on re-resection; T1 with CIS, LVI or variant histology; deep lamina propria invasion; diffuse CIS.</li>\n<li>Also if: diverticular HG tumour; distal ureteric or prostatic ductal involvement; incompletely resectable tumour; patient preference.</li>\n</ol>"], [10, "r", 13, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "9 · Surveillance", "Low · At 3 months, then annually from 12 months; consider stopping at <span class=\"key\">≥5 yr</span> · Consider · Only if haematuria"], [10, "r", 13, "Ch 130 · Management Strategies for Non–Muscle-Invasive Bladder Cancer", "9 · Surveillance", "High · <span class=\"key\">3–4-monthly for 2 yr</span>, then 6-monthly for 2 yr, then annually <b>for life</b> · Same schedule · Annually for 2 yr, then lengthen"], [10, "l", 15, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "1 · Natural history and histology", "<span class=\"key\">20–30%</span> of new bladder cancers are muscle-invasive (MIBC), and <span class=\"key\">~12%</span> are node-positive or metastatic."], [10, "l", 15, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "1 · Natural history and histology", "<b>Primary MIBC</b> is invasive at diagnosis; <b>secondary</b> (<span class=\"key\">~20%</span>) has progressed from non-muscle-invasive disease (NMIBC). It does worse: more understaging and less response to neoadjuvant chemotherapy (NAC)."], [10, "l", 15, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "1 · Natural history and histology", "Most deaths after local therapy occur within <span class=\"key\">2 years</span> and come from micrometastases present at diagnosis."], [10, "l", 15, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "2 · Clinical staging", "If high-grade T1 or no muscle, repeat TUR within <span class=\"key\">6 weeks</span> (&gt;40% are upstaged without muscle)."], [10, "l", 15, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "2 · Clinical staging", "<b>Prostatic urethral biopsy</b> (trigone or bladder-neck tumour, carcinoma in situ (CIS), multifocal): take a full-thickness loop from mid-prostate to verumontanum at <span class=\"key\">5 and 7 o'clock</span>, where ducts are densest. Stromal involvement affects NAC, urethrectomy and diversion choice."], [10, "l", 16, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "2 · Clinical staging", "<b>Image before TUR</b>, as post-resection inflammation mimics T3. CT nodal sensitivity is only <span class=\"key\">30–50%</span>; hydronephrosis suggests extravesical disease."], [10, "l", 16, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "2 · Clinical staging", "Magnetic resonance imaging (MRI) suits poor renal function or contrast allergy and stages T best. The <b>Vesical Imaging-Reporting and Data System (VI-RADS)</b> grades the muscularis line: intact in 1–3, interrupted in 4, into fat in 5. A score <span class=\"key\">≥3</span> is suspicious, so \"equivocal\" counts as positive."], [10, "l", 17, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "4 · Radical cystectomy: principles and extent", "<b>RC with bilateral pelvic lymph node dissection (PLND) is standard for resectable MIBC</b>, ideally after cisplatin NAC. Delay &gt;<span class=\"key\">12 weeks</span> means more extravesical and nodal disease and worse survival."], [10, "p", 17, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "4 · Radical cystectomy: principles and extent", "Spare an organ only where it is oncologically silent. The gatekeepers are, in men, the prostatic urethra and bladder neck; in women, the bladder neck, base and anterior vaginal wall."], [10, "l", 17, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "5 · Pelvic lymph node dissection", "About <span class=\"key\">25%</span> are node-positive at RC. Recurrence is <span class=\"key\">70–80%</span> if node-positive vs ~30% if node-negative."], [10, "l", 18, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "7 · Outcomes after RC", "<span class=\"key\">~50%</span> ultimately die of bladder cancer, mostly from metastases within 2 years."], [10, "l", 18, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "7 · Outcomes after RC", "<b>Pelvic recurrence</b>: low risk (≤pT2) 5–8%; intermediate (pT3–4, negative margins, ≥10 nodes) 15–21%; high (pT3–4 with positive margins or &lt;10 nodes) <span class=\"key\">39–46%</span>."], [10, "r", 18, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "8 · Neoadjuvant therapy", "Renal · Glomerular filtration rate (GFR) <span class=\"key\">&lt;60 mL/min</span> · Creatinine clearance &lt;30 mL/min"], [10, "l", 19, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "10 · Bladder preservation", "<b>Dose</b>: a continuous course to <span class=\"key\">60–66 Gy</span> with restaging at 3–4 months is commonest. Split course is historical. <span class=\"key\">55 Gy in 20 fractions</span> is non-inferior."], [10, "p", 19, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "10 · Bladder preservation", "TMT contains cystectomy rather than replacing it. Salvage RC is the built-in safety net, so selection and lifelong cystoscopy decide success. Complete TUR cuts the need for cystectomy (~11% vs 42%)."], [10, "a", 20, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "11 · Metastatic urothelial carcinoma", "<ol>\n<li>If platinum-eligible, give GC or ddMVAC (or gemcitabine–carboplatin, or EV with pembrolizumab).</li>\n<li>If there is response or stable disease, give avelumab maintenance.</li>\n<li>On progression, give pembrolizumab, or erdafitinib if FGFR-altered.</li>\n<li>Then give EV, then sacituzumab govitecan.</li>\n<li>If platinum-ineligible, give pembrolizumab, then EV.</li>\n</ol>"], [10, "l", 21, "Ch 131 · Management of Muscle-Invasive and Metastatic Bladder Cancer", "12 · Follow-up", "<b>After bladder preservation</b>: cystoscopy 3–4-monthly in years 1–2, 6-monthly in years 3–4, then yearly to <span class=\"key\">10 years</span>. Get CT urogram and chest CT 3–6-monthly for 2 years, then yearly to 5."], [10, "l", 22, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "2 · Transurethral resection of bladder tumour (TURBT)", "Image the upper tracts by CT urogram, MRI, or ultrasound with retrograde study. Iodinated contrast needs a glomerular filtration rate (GFR) <span class=\"key\">≥60</span> mL/min; gadolinium needs GFR <span class=\"key\">&gt;30</span>."], [10, "a", 22, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "2 · Transurethral resection of bladder tumour (TURBT)", "<ol>\n<li>Lithotomy; antibiotic within 1 h (avoid fluoroquinolones).</li>\n<li>30° lens: urethra, orifices. 70° lens: bladder neck, dome, anterior wall.</li>\n<li>If inspection is incomplete, use the 120° lens.</li>\n<li>Map tumours; add blue-light or narrow-band imaging if available (more tumours found, less recurrence, detects carcinoma in situ (CIS)).</li>\n</ol>"], [10, "l", 22, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "2 · Transurethral resection of bladder tumour (TURBT)", "Remove all visible tumour with <b>detrusor in the specimen</b>, using a loop on cutting current, with a <span class=\"key\">~2 cm</span> margin of normal tissue where possible."], [10, "p", 23, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "2 · Transurethral resection of bladder tumour (TURBT)", "Perforation can follow adequate resection of advanced tumour. It <b>rules out immediate intravesical chemotherapy</b>, because the drug would leak outside the bladder."], [10, "l", 23, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "2 · Transurethral resection of bladder tumour (TURBT)", "Single mitomycin C or epirubicin <span class=\"key\">within 24 h</span> gives a ~<span class=\"key\">13%</span> absolute fall in recurrence (meta-analysis)."], [10, "l", 23, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "2 · Transurethral resection of bladder tumour (TURBT)", "<b>BCG (bacille Calmette–Guérin) is never given immediately</b>: wait <span class=\"key\">2–4 weeks</span> with no gross haematuria (<span class=\"dag\">†</span> risk of systemic absorption)."], [10, "l", 23, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "3 · Radical cystectomy: preparation", "Start <b>venous thromboembolism (VTE) prophylaxis</b> (compression and drug) <b>before induction</b> and extend it to <span class=\"key\">4 weeks</span>: 28 vs 8 days gives fewer major VTE, no extra bleeding. Enoxaparin is standard; apixaban is equal, with better compliance."], [10, "a", 24, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "4 · Open radical cystectomy: technique", "<ol>\n<li>Lower midline; Retzius space; divide urachus; incise peritoneum lateral to medial umbilical ligaments; divide vas or round ligament.</li>\n<li>Mobilise caecum, small-bowel root and left Toldt line; make the <b>retrosigmoid window</b> (left ureter).</li>\n<li>Free ureters with adventitia; divide obliterated umbilical artery for length; divide ureters.</li>\n<li>Retractor (check vena cava); PLND; staple, clip or seal vesical pedicles.</li>\n</ol>"], [10, "a", 24, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "4 · Open radical cystectomy: technique", "<ol>\n<li>Incise peritoneum over seminal vesicles; separate rectum; incise Denonvilliers fascia.</li>\n<li>Control posterior pedicles; open endopelvic fascia.</li>\n<li>Ligate dorsal venous complex (DVC); divide urethra.</li>\n</ol>"], [10, "a", 24, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "4 · Open radical cystectomy: technique", "<ol>\n<li>Ligate ovarian vessels; incise posterior fornix; control pedicles.</li>\n<li>Excise urethra from above or the introitus.</li>\n<li><b>Clamshell vaginal closure</b> (keeps girth, loses length), watertight, 2-0 polyglactin; pack out day 2.</li>\n</ol>"], [10, "l", 25, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "5 · Pelvic lymphadenectomy", "Protect the obturator nerve and seal lymphatics. <span class=\"key\">≥10 nodes</span> removed goes with better survival (NMIBC at RC: &gt;20)."], [10, "a", 25, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "6 · Partial cystectomy", "<ol>\n<li>PLND; open the bladder away from tumour.</li>\n<li>Full-thickness excision with fat and a 1–2 cm frozen-section margin; reimplant ureter if needed.</li>\n<li>2–3-layer watertight closure; warm water irrigation (against seeding); drain.</li>\n<li>Cystogram day 7, then remove catheter.</li>\n</ol>"], [10, "p", 25, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "7 · Robotic radical cystectomy (RARC)", "No effective salvage exists: urine spillage, poor PLND or a positive soft-tissue margin leads to near-uniformly fatal recurrence, so robotics is judged on oncology first."], [10, "a", 26, "Ch 132 · Surgical Management of Bladder Cancer: Transurethral, Open and Robotic", "7 · Robotic radical cystectomy (RARC)", "<ol>\n<li>Release sigmoid; develop presacral plane; open cul-de-sac to prostate apex.</li>\n<li>Open Retzius; control anterior pedicle; free ureters (<b>never grasp</b>).</li>\n<li><b>Extended PLND with ureters intact</b>.</li>\n<li>Clip ureters, send margin, pass left ureter under sigmoid.</li>\n<li>Posterior pedicles, DVC, urethra (clip proximally only if neobladder).</li>\n</ol>"], [10, "l", 27, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "1 · Surgical anatomy", "<b>Small bowel</b> is ~22 ft: the proximal 2/5 is jejunum (wider, single arcades, thin mesentery) and the distal 3/5 ileum (multiple arcades). Bowel &gt;<span class=\"key\">8 cm</span> from a straight vessel may not survive, so clear ≤8 cm of mesentery at a segment end."], [10, "p", 27, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "1 · Surgical anatomy", "Watershed zones get the smallest end branches of two arteries, so they go ischaemic first in hypotension or embolism; site anastomoses to one side."], [10, "l", 27, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "2 · Segment selection", "<b>B12</b>: liver stores last <span class=\"key\">3–5 yr</span> and clinical deficiency is rare; homocysteine and methylmalonic acid are the sensitive markers."], [10, "l", 28, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "3 · Bowel preparation and enhanced recovery", "Oral antibiotics cut bacterial concentration to ~10<sup>2</sup>/g; the descending colon holds <span class=\"key\">10<sup>10–12</sup>/g</span>. Kanamycin is the best single agent."], [10, "l", 29, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "4 · Intestinal anastomoses", "<b>Ogilvie syndrome</b> is a dilated caecum; a water-soluble enema excludes obstruction. If the caecum is <span class=\"key\">&gt;12 cm</span> or white count rises, give neostigmine or decompress by colonoscopy. Operate for ischaemia, peritonitis or failure."], [10, "p", 29, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "5 · Ureterointestinal anastomoses", "Conduit pressure is damped by ureteric peristalsis. Reflux harms the kidney only with impaired peristalsis plus infection or obstruction. Antireflux tunnels stricture more and do not stop colonisation, so a stented refluxing anastomosis is the default; reflux also allows a loopogram to image the upper tracts."], [10, "l", 29, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "5 · Ureterointestinal anastomoses", "Open reanastomosis is most durable; endoincision works in ~50–60% at 2 yr; balloon is not durable. Endourology fails more if the stricture appears &lt;1 yr post-op, is <span class=\"key\">≥1.5 cm</span>, or is left-sided. Metal stents are only for limited life expectancy."], [10, "a", 30, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "6 · Conduit diversion", "<ol>\n<li>Take <span class=\"key\">10–15 cm</span> of ileum, 10–15 cm from the ileocaecal valve; keep a major arcade with windows ~5 cm.</li>\n<li>Restore continuity by ileoileostomy, with the segment caudal; close the mesenteric window; flush the segment.</li>\n<li>Pass the left ureter behind the sigmoid mesentery; make stented anastomoses.</li>\n<li>Fix the base retroperitoneally in the right lower quadrant (RLQ); make the stoma.</li>\n</ol>"], [10, "r", 31, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "8 · Renal function", "Creatinine and urine protein · <span class=\"key\">&lt;2.0 mg/dL</span>, no proteinuria"], [10, "r", 31, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "8 · Renal function", "GFR · <span class=\"key\">&gt;35 mL/min</span>"], [10, "r", 31, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "8 · Renal function", "Ammonium chloride load · Urine pH <span class=\"key\">≤5.8</span>"], [10, "r", 31, "Ch 133 · Use of Intestinal Segments in Urinary Diversion", "8 · Renal function", "Water deprivation · Osmolality <span class=\"key\">≥600 mOsm/kg</span>"], [10, "p", 31, "Ch 133 · Use
