toses", "Share · ~<span class=\"key\">80%</span> · Minority; genital rare (2.4%)"], [1, "l", 37, "Ch 30 · Cutaneous Diseases of the External Genitalia", "3 · Eczematous dermatoses", "Pink-yellow greasy-scaled plaques in sebaceous areas (incl. glans, pubis); uncircumcised. <i>Malassezia</i>. Up to <span class=\"key\">83%</span> of AIDS patients; Parkinson → <b>extensive SD → test for HIV</b>."], [1, "r", 38, "Ch 30 · Cutaneous Diseases of the External Genitalia", "4 · Papulosquamous disorders", "First-line · Low-potency steroid (hydrocortisone butyrate 0.1%) <span class=\"key\">≤2 weeks</span> continuous; triamcinolone 0.1% for thick plaque"], [1, "l", 38, "Ch 30 · Cutaneous Diseases of the External Genitalia", "5 · Lichen sclerosus (LS) / BXO", "Female 6–10×; males usually &gt;60; <span class=\"key\">15–20%</span> extragenital. Male: <b>perianal spared</b>; purpura may mask whiteness."], [1, "a", 38, "Ch 30 · Cutaneous Diseases of the External Genitalia", "5 · Lichen sclerosus (LS) / BXO", "<p>Biopsy → <b>potent steroid (clobetasol 0.05%) for 3 months</b> → taper → twice-weekly maintenance (or mometasone 0.1% / calcineurin inhibitor) → lifelong surveillance of non-healing fissures, ulcers, nodules</p>"], [1, "l", 38, "Ch 30 · Cutaneous Diseases of the External Genitalia", "5 · Lichen sclerosus (LS) / BXO", "Recurrence <span class=\"key\">40–50%</span> → proactive maintenance. Calcineurin inhibitors inferior; refractory → retinoids, PDT. <span class=\"dag\">†</span> Meatotomy/meatoplasty for meatal disease."], [1, "p", 39, "Ch 30 · Cutaneous Diseases of the External Genitalia", "5 · Lichen sclerosus (LS) / BXO", "Steroid strength tracks the scarring and malignant stakes of the disease; LS is the single exception to the short-course rule."], [1, "r", 39, "Ch 30 · Cutaneous Diseases of the External Genitalia", "6 · Vesiculobullous and drug eruptions", "Lesion · Symmetric <b>targets</b>; palms, soles, mouth · Prodrome → macules → blisters → necrosis; genital ~<span class=\"key\">60%</span> · Solitary violaceous plaque with halo, often glans"], [1, "r", 39, "Ch 30 · Cutaneous Diseases of the External Genitalia", "6 · Vesiculobullous and drug eruptions", "Course · Self-limited, recurs · 4–6 weeks; mortality to ~<span class=\"key\">30%</span> (TEN overlap) · <b>Recurs at same site within 24 h</b> of re-exposure"], [1, "a", 39, "Ch 30 · Cutaneous Diseases of the External Genitalia", "6 · Vesiculobullous and drug eruptions", "<p>SJS: stop offending drug → burn-type supportive care → ICU / burn unit (lowers mortality) → multispecialty wound care; limited data: cyclosporine 3–5 mg/kg/day, etanercept, plasmapheresis, IVIG; systemic steroids controversial</p>"], [1, "p", 39, "Ch 30 · Cutaneous Diseases of the External Genitalia", "6 · Vesiculobullous and drug eruptions", "The same drug class can cause a trivial FDE or a lethal SJS: extent and systemic illness separate them. Genital FDE mimics herpes — \"same spot each time\" is the clue."], [1, "a", 40, "Ch 30 · Cutaneous Diseases of the External Genitalia", "8 · Infections", "<p>Remove irritants → hygiene → topical antibiotic/antifungal → short low-potency steroid → <b>failure: biopsy</b> (neoplasia, Zoon, psoriasis, HPV, HSV) → recurrent with phimosis: <b>circumcision</b></p>"], [1, "p", 40, "Ch 30 · Cutaneous Diseases of the External Genitalia", "8 · Infections", "Fournier gangrene is fascial — skin shows a fraction of the necrosis; testes spared (own blood supply). Imaging (CT best for gas) must never delay surgery. Debride to bleeding tissue; second look at 24–48 h."], [1, "r", 41, "Ch 30 · Cutaneous Diseases of the External Genitalia", "8 · Infections", "Treat · Topical imidazole <span class=\"key\">≥2 weeks</span>; fluconazole 150 mg occasionally; test for diabetes · Topical azole/allylamine; deep → terbinafine 250 mg/day 1 week; no steroids · Antibacterial soap, clindamycin 1%, miconazole; oral erythromycin if severe · Low-potency steroid"], [1, "p", 41, "Ch 30 · Cutaneous Diseases of the External Genitalia", "8 · Infections", "Azoles cover yeast and dermatophyte (use when unsure); nystatin misses tinea; allylamines weaker on <i>Candida</i>. Negative KOH from an untreated lesion → rethink the diagnosis."], [1, "r", 42, "Ch 30 · Cutaneous Diseases of the External Genitalia", "9 · Premalignant and malignant lesions", "SCCis — accessible (scrotum) · Excision with <span class=\"key\">5-mm margin</span> (favoured)"], [1, "p", 42, "Ch 30 · Cutaneous Diseases of the External Genitalia", "9 · Premalignant and malignant lesions", "HPV mapping: 6/11 → condyloma and verrucous carcinoma (locally destructive, rarely metastasises); 16 → bowenoid papulosis and SCCis."], [1, "r", 42, "Ch 30 · Cutaneous Diseases of the External Genitalia", "9 · Premalignant and malignant lesions", "Extramammary Paget · Red plaque at apocrine sites; CEA/EMA +; underlying carcinoma <span class=\"key\">10–30%</span> (urethra, prostate, bladder, rectum) · <b>Mandatory search for internal malignancy</b>; excision/Mohs; imiquimod, 5-FU, RT"], [1, "p", 43, "Ch 30 · Cutaneous Diseases of the External Genitalia", "10 · Benign male genital lesions", "Zoon balanitis vs erythroplasia of Queyrat: both red glans plaques in uncircumcised men — one benign and cured by circumcision, the other SCCis. A persistent red glans plaque always needs biopsy."], [1, "l", 44, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "1 · Urogenital tuberculosis — organism and pathogenesis", "<span class=\"key\">15–20%</span> of pulmonary TB in developing countries; latent 90–95%, lifetime reactivation <span class=\"key\">5–15%</span>; latency up to decades (46 years) → UG TB often without active lung disease."], [1, "l", 44, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "1 · Urogenital tuberculosis — organism and pathogenesis", "Ascending: intravesical BCG → UG TB in <span class=\"key\">~1%</span>. Contiguous: spine → psoas → kidney; gut TB → enterorenal/enterovesical fistula."], [1, "p", 44, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "1 · Urogenital tuberculosis — organism and pathogenesis", "UG TB is a blood-borne disease landing in the two best-perfused UG organs — kidney and epididymis. Haematogenous seeding gives parenchymal disease; descending urinary spread gives luminal disease (distal ureteric stricture, cystitis). Healing by fibrosis turns an infection into an obstruction."], [1, "l", 44, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "2 · Clinical features and pathology by site", "Indolent; repeatedly treated as bacterial UTI or investigated for cancer. Constitutional symptoms <span class=\"key\">&lt; 20%</span>; <b>LUTS dominate</b>; haematuria/flank pain ~⅓; colic &lt;10%. <b>Hallmark: sterile pyuria</b> (&gt;90%)."], [1, "r", 44, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "2 · Clinical features and pathology by site", "Kidney · <span class=\"key\">80%</span>, haematogenous · Caseating cavities → autonephrectomy (up to ⅓); \"putty\" kidney; ESRF ~7%; pelvic squamous metaplasia → SCC risk"], [1, "a", 45, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "3 · Diagnosis", "<p>Hierarchy: culture or MTBC DNA positive → diagnosis. Negative → caseating granulomas on tissue in right context. Negative → compatible picture + exposure + response to empirical treatment. Always look for coexisting pulmonary TB (up to one-fifth): chest radiograph in every patient.</p>"], [1, "l", 45, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "3 · Diagnosis", "Culture sensitivity 10–90% (intermittent shedding); ZN smear <span class=\"key\">&lt; 50%</span>. Acidic urine inhibits mycobacteria → culture promptly."], [1, "l", 45, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "3 · Diagnosis", "<b>TST</b> cut-offs: <span class=\"key\">≥ 5 mm</span> contacts/immunosuppressed; <span class=\"key\">≥ 10 mm</span> immigrants, high-risk workers, drug injectors; <span class=\"key\">≥ 15 mm</span> no risk factors. False negative 10–25%. <b>IGRA</b>: no BCG false positives; preferred screen for those from endemic countries. Both = exposure only."], [1, "p", 45, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "3 · Diagnosis", "Imaging signs are fibrosis made visible: destruction (moth-eaten calyx, cavities) heals by scarring (phantom calyx, Kerr's kink, pipe-stem ureter, golf-hole orifice, thimble bladder). Obstruction is the commonest finding and must be watched during treatment."], [1, "a", 46, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "4 · Medical treatment", "<p><b>Standard 6-month short course (2HRZE / 4HR)</b>: Intensive 2 months — daily INH (H) + rifampicin (R) + pyrazinamide (Z) + ethambutol (E); stop E once fully susceptible. Continuation 4 months — HR daily (or thrice weekly by DOT; twice weekly no longer recommended) → eradicates persisters. Pyridoxine throughout.</p>"], [1, "l", 46, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "5 · Surgical treatment", "<b>Timing: <span class=\"key\">4–6 weeks</span> after starting chemotherapy</b> (emergencies excepted)."], [1, "a", 46, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "5 · Surgical treatment", "<p>Uraemia or sepsis → emergency decompression → retrograde double-J stent (preferred; succeeds in &lt; half, 41%) → fails → antegrade stent → fails → percutaneous nephrostomy (PCN; loculated systems may need more than one) → definitive repair; unsalvageable kidney → nephrectomy.</p>"], [1, "r", 47, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "5 · Surgical treatment", "Moderate gap · Psoas hitch · Up to <span class=\"key\">5 cm</span>; needs good capacity; avoid genitofemoral/femoral nerves"], [1, "r", 47, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "5 · Surgical treatment", "Long gap · Boari flap ± hitch · <span class=\"key\">10–15 cm</span>; poor in contracted bladder"], [1, "p", 47, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "5 · Surgical treatment", "Trap: in TB the bladder itself may be contracted, ruling out psoas hitch and Boari flap — assess capacity first; ileal ureter ± augmentation is then the option."], [1, "l", 47, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "5 · Surgical treatment", "Contracted bladder: operate for intolerable symptoms, capacity <span class=\"key\">&lt; 100 mL</span>, after chemotherapy controls disease; thimble → orthotopic substitution. Urethra: bladder neck contracture → incision; fistula → suprapubic diversion, delayed repair."], [1, "l", 47, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "6 · BCG-related infection, relapse, special situations", "<b>Relapse</b> <span class=\"key\">6.3–22%</span> (pulmonary 2–6%), mean ~5 years; follow-up <b>10 years</b>; culture recurrences."], [1, "a", 48, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "7 · Schistosomiasis (bilharzia)", "<p>Fork-tailed cercariae penetrate intact skin in fresh water → schistosomulae → lungs → liver → paired adults (female in male's gynaecophoric canal) to vesical plexus (80–110 days; live 3–5 years) → eggs (~140 µm, <b>terminal spine</b>) cross bladder wall into urine → miracidia → <i>Bulinus</i> → cercariae.</p>"], [1, "p", 48, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "7 · Schistosomiasis (bilharzia)", "Trap: a negative urine egg count does not exclude severe disease — the most damaged kidneys belong to egg-negative, often asymptomatic, inactive-stage patients."], [1, "l", 49, "Ch 31 · Tuberculosis and Parasitic Infections of the Genitourinary Tract", "7 · Schistosomiasis (bilharzia)", "<b>Praziquantel</b> — only WHO drug: <span class=\"key\">40 mg/kg once</span>, or 20 mg/kg twice 6–8 h apart; cure/egg reduction 60–90%. Pregnancy FDA category B. Katayama: add steroids. Weak on schistosomulae → repeat after several weeks. Artemisinins act on schistosomulae — avoid where malaria co-endemic."], [1, "a", 51, "★ Putting it together: infection decisions", "B · Beyond antibiotics", "<p><b>Image</b> (US/CT): no response by 72 h, sepsis, obstruction/stone, gas, febrile men, recurrent pyelonephritis.</p>\n<p><b>Drain</b> any obstructed infected kidney (stent/nephrostomy); renal abscess ≤3 cm → antibiotics alone; 3–5 cm variable; &gt;5 cm → percutaneous drainage. Treat the stone later.</p>\n<p><b>Emphysematous pyelonephritis</b> (CT class): gas within kidney → antibiotics + drainage; beyond kidney, poor prognosis → nephrectomy (<span class=\"xref\">→ Ch 26</span>).</p>\n<p><b>Fournier:</b> antibiotics, <b>urgent repeated radical debridement</b>; scores never delay surgery.</p>"], [1, "a", 51, "★ Putting it together: infection decisions", "C · Recurrent UTI in women", "<p>Culture-confirm → behaviour, hydration → vaginal oestrogen (postmenopausal) → methenamine, cranberry, D-mannose, immunostimulants → self-start or post-coital antibiotic → continuous low-dose prophylaxis.</p>"], [1, "a", 52, "★ Putting it together: infection decisions", "E · GU tuberculosis in four lines", "<p><b>Suspect:</b> sterile pyuria, contracted bladder, beaded vas, epididymal mass.</p>\n<p><b>Confirm:</b> three early-morning urines: AFB, culture, GeneXpert.</p>\n<p><b>Treat:</b> 2 months HRZE, then 4 months HR; watch for ureteric stricture.</p>\n<p><b>Operate</b> after ≥4–6 weeks of drugs: nephrectomy (non-functioning), reimplantation (stricture), augmentation (contracted bladder) (<span class=\"xref\">→ Ch 31</span>).</p>"], [2, "l", 2, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "3 · Primary vs secondary VUR", "Spina bifida: VUR in up to <span class=\"key\">30%</span> → early CIC, anticholinergic/β3-agonist. Seek occult dysraphism (sacral dimple, hairy patch, cleft anomaly, refractory constipation)."], [2, "p", 2, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "3 · Primary vs secondary VUR", "Primary and secondary are not exclusive: \"primary\" VUR often has a treatable secondary component (overactivity, BBD). Remove it and only true primary VUR remains."], [2, "l", 2, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "4 · Epidemiology", "VUR in <span class=\"key\">~30%</span> of children with UTI; ~17% of those imaged for hydronephrosis. Under 2 y <span class=\"key\">38.6%</span> vs 7.6% at 12–21 y."], [2, "l", 3, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "6 · Diagnosis", "<b>Top-down</b>: DMSA first, VCUG only if abnormal. Normal DMSA → <span class=\"key\">&lt;1%</span> chance of high-grade VUR; misses ~1/3 of (mostly low-grade) VUR."], [2, "l", 3, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "7 · Congenital dysplasia vs acquired scar", "Hypertension in <span class=\"key\">34–38%</span> of scarred children. <b>Correcting VUR does not lower BP</b>; nephrectomy/segmental resection of a small kidney may."], [2, "l", 3, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "8 · Bladder and bowel dysfunction (BBD)", "<b>Phimosis</b>: in boys with VUR, circumcision NNT to prevent one UTI falls from ~111 to <span class=\"key\">~4</span>; topical steroid equivalent."], [2, "l", 4, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "10 · Medical management — continuous antibiotic prophylaxis (CAP)", "2-year BUTI on CAP: <span class=\"key\">8.6% low, 26% intermediate, 62.5% high</span>. ~2/3 of children are low risk."], [2, "a", 4, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "11 · Practical algorithm (AUA-based, risk-stratified)", "<p>True febrile UTIs + RBUS → VCUG if multiple febrile UTIs, admissions or upper-tract findings (afebrile/doubtful UTI, normal US → conservative)</p>\n<p>All: treat BBD (constipation first), hygiene, timed voiding</p>\n<p>Low risk (grade I–II, no BBD, male, older) → observation ± CAP; treat febrile UTI promptly</p>\n<p>High risk (grade ≥III, girl, BBD, febrile presentation, scars, infant) → CAP</p>\n<p>Breakthrough febrile UTI, new scars, high grade with poor function, persistent VUR with low infection tolerance → correction (endoscopic or reimplant)</p>"], [2, "l", 5, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "12 · Surgical correction", "Open correction <span class=\"key\">&gt;95%</span>; robotic probably less morbid. Not superior to medical therapy for scarring or growth (IRSC, Birmingham)."], [2, "l", 5, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "14 · Sibling screening", "Sibling prevalence ~<span class=\"key\">30%</span> (up to 50%), higher in younger siblings."], [2, "l", 5, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "15 · Follow-up and adulthood", "<b>Pregnancy</b>: VUR → pyelonephritis ~1/3; scars → ~3× hypertension, <span class=\"key\">~8× pre-eclampsia</span>. <b>Scarring, not VUR, drives morbidity.</b> Reimplanted women still at UTI risk; no excess miscarriage."], [2, "r", 6, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "16 · Landmark trials", "Swedish Reflux Trial · 1–2 y, grade III–IV; CAP vs endoscopic vs surveillance · Girls febrile UTI: 19% CAP, 23% endoscopic, <span class=\"key\">57%</span> surveillance; no new scars on CAP; boys no difference · Treat girls with dilating VUR"], [2, "r", 6, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "16 · Landmark trials", "RIVUR · 607 children, grade I–IV after first/second UTI; TMP-SMX vs placebo · Recurrent UTI <span class=\"key\">12.9% vs 23.6%</span>; scarring unchanged; most benefit with febrile index UTI/BBD · CAP prevents UTI, not scars"], [2, "p", 6, "Ch 41 · Management Strategies for Vesicoureteral Reflux", "16 · Landmark trials", "Trials disagree because of population risk: RIVUR was diluted by low-risk children (~8% grade IV); reanalysis NNT 5 high-risk vs 18 low-risk. CAP cuts infection in proportion to baseline risk; neither CAP nor surgery prevents scarring better."], [2, "p", 7, "Ch 49 · Anomalies of the Kidney and Collecting System", "1 · Embryology that explains everything", "Every anomaly of number is a failure of UB–MM induction: timing and extent set the phenotype. An early insult drags the WD/MD with it (genital anomalies). Arrested ascent leaves an unrotated kidney with anterior pelvis and fetal blood supply; fusion freezes kidneys where they meet."], [2, "l", 7, "Ch 49 · Anomalies of the Kidney and Collecting System", "2 · Bilateral renal agenesis (BRA)", "<span class=\"key\">≈1 in 5000</span> births; <b>75% male</b>. First-degree relatives ≈1000× risk → <b>US parents and siblings</b> of any infant with URA, BRA or dysgenesis."], [2, "p", 7, "Ch 49 · Anomalies of the Kidney and Collecting System", "2 · Bilateral renal agenesis (BRA)", "BRA is lethal through the lungs, not the kidneys. Amnioinfusion replaces only the amniotic step, so it converts pulmonary deaths into neonatal ESRD."], [2, "l", 7, "Ch 49 · Anomalies of the Kidney and Collecting System", "3 · Unilateral renal agenesis (URA) and the solitary functioning kidney (SFK)", "<span class=\"key\">1 in 1200</span>; male 1.8:1; left slightly more. Many apparent URAs are <b>involuted MCDK</b> (curvilinear calcification on CT; colonic flexure in normal place). Renal aplasia may be the commonest cause of congenital solitary kidney. 20-week scan pitfall: adrenal or spleen mistaken for kidney."], [2, "l", 8, "Ch 49 · Anomalies of the Kidney and Collecting System", "3 · Unilateral renal agenesis (URA) and the solitary functioning kidney (SFK)", "<b>Contralateral</b>: VUR <span class=\"key\">≈30%</span>, PUJ obstruction ≈11%, VUJ obstruction ≈7%."], [2, "l", 9, "Ch 49 · Anomalies of the Kidney and Collecting System", "5 · Ectopia (anomalies of ascent)", "<span class=\"key\">1 in 900</span> (autopsy); bilateral ≈10%. <b>Pelvic commonest</b>; lumbar, abdominal, cephalad, thoracic. Aberrant vessels are consequence, not cause."], [2, "l", 10, "Ch 49 · Anomalies of the Kidney and Collecting System", "6 · Fusion anomalies", "<b>Commonest fusion anomaly</b>: <span class=\"key\">1 in 400</span> (0.25%); male 2:1. <b>Lower-pole fusion 95%</b>, before rotation."], [2, "p", 10, "Ch 49 · Anomalies of the Kidney and Collecting System", "6 · Fusion anomalies", "<span class=\"dag\">†</span> PUJ obstruction in horseshoe kidney: dismembered pyeloplasty with dependent anterior anastomosis; symphysiotomy not routinely needed."], [2, "l", 10, "Ch 49 · Anomalies of the Kidney and Collecting System", "7 · Malrotation and vascular anomalies", "Aneurysm: ring calcification ≈30%; renin-mediated hypertension; rupture only &gt;3 cm. Treat if rupture, growth, pregnancy, <span class=\"key\">&gt;2 cm</span>, symptoms."], [2, "p", 11, "Ch 49 · Anomalies of the Kidney and Collecting System", "8 · Collecting system anomalies", "Collecting-system anomalies split on one question — is there obstruction? Dilatation without obstruction (bifid, extrarenal pelvis, megacalycosis) needs nothing; stasis (diverticulum, hydrocalycosis) is treated for symptoms; infundibulopelvic stenosis threatens function through bilateral dysplasia."], [2, "p", 12, "Ch 50 · Renal Dysgenesis and Cystic Disease of the Kidney", "2 · Dysgenesis: dysplasia vs hypoplasia", "The ureteric orifice predicts the kidney: a bud from the wrong place on the wolffian duct meets the wrong blastema, so ectopia, obstruction and dysplasia travel together."], [2, "p", 14, "Ch 50 · Renal Dysgenesis and Cystic Disease of the Kidney", "5 · ADPKD — paediatric focus", "ADPKD is a volume disease: cyst growth stretches vessels (hypertension), compresses nephrons and hides stones and tumours. Every therapy is judged by whether it slows total kidney volume."], [2, "a", 15, "Ch 50 · Renal Dysgenesis and Cystic Disease of the Kidney", "8 · Multicystic dysplastic kidney (MCDK)", "<p>Prenatal MCDK → US day 2–3 and at 1 month (contralateral kidney, bladder) → DMSA or MAG3 if doubt → VCUG only if UTI or abnormal contralateral kidney/bladder → primary care: BP, mass, UTI</p>"], [2, "p", 15, "Ch 50 · Renal Dysgenesis and Cystic Disease of the Kidney", "8 · Multicystic dysplastic kidney (MCDK)", "MCDK removes itself; management looks to the solitary contralateral kidney and its reflux or obstruction. Mistaking a non-functioning PUJ kidney for MCDK costs little."], [2, "l", 17, "Ch 51 · Pathophysiology of Urinary Tract Obstruction", "1 · Definition and classification", "≈ <span class=\"key\">1 in 500</span> live births; high-grade obstruction lifetime ESRD risk up to <span class=\"key\">30%</span>."], [2, "p", 17, "Ch 51 · Pathophysiology of Urinary Tract Obstruction", "1 · Definition and classification", "Trap: <b>detrusor hypertrophy</b> is a lower-tract cause of upper-tract (UVJ) obstruction — the thick wall narrows the intramural ureter. Neurogenic bladder obstructs without an anatomical lesion."], [2, "l", 17, "Ch 51 · Pathophysiology of Urinary Tract Obstruction", "2 · Haemodynamic changes", "<b>Hypertension</b> (RAAS): bilateral ≈ <span class=\"key\">77%</span>; unilateral ≈ <span class=\"key\">20%</span> (renin lateralises)."], [2, "l", 18, "Ch 51 · Pathophysiology of Urinary Tract Obstruction", "4 · Pathology and fibrosis", "<b>Bladder</b>: hypertrophy → compensation → decompensation; IL-6, TNF-α, MCP-1 → poor compliance. Storage pressure &gt; <span class=\"key\">40 cm H₂O</span> injures kidneys."], [2, "a", 18, "Ch 51 · Pathophysiology of Urinary Tract Obstruction", "6 · Post-obstructive diuresis (POD)", "<p>Monitor intake/output, serum and urine electrolytes → replace losses, correct electrolytes → <b>do not over-replace</b> (perpetuates POD) → usually resolves in <span class=\"key\">24 h</span>, seldom &gt; 48 h</p>"], [2, "l", 18, "Ch 51 · Pathophysiology of Urinary Tract Obstruction", "7 · Fetus and child", "Second-trimester oligo/anhydramnios → mortality <span class=\"key\">60–80%</span>. Favourable fetal urine also Ca &lt; 8 mg/dL; last sample reflects current function."], [2, "l", 18, "Ch 51 · Pathophysiology of Urinary Tract Obstruction", "7 · Fetus and child", "Postnatal: US; MAG3 drainage; DMSA scar; VCUG outlet/VUR. Whitaker obstructed if pelvic pressure &gt; <span class=\"key\">12 cm H₂O</span> or continuous rise. Cystatin C GFR most accurate in children."], [2, "p", 21, "Ch 52 · Ectopic Ureter, Ureterocele and Ureteral Anomalies", "3 · Ectopic ureter — sites and sex asymmetry", "Why does only the girl leak? The female ureter may open distal to the external sphincter and leaks continuously; the male ureter, confined to wolffian derivatives above it, presents as infection or obstruction."], [2, "a", 23, "Ch 52 · Ectopic Ureter, Ureterocele and Ureteral Anomalies", "6 · Management principles", "<p>Prenatal hydronephrosis → postnatal ultrasound → prophylaxis if significant hydroureteronephrosis → VCUG (optional if it won't change decompression) → renal scan after 2 months</p>\n<p>Small ureterocele, minimal hydronephrosis, no obstruction → observe</p>\n<p>Significant obstruction, parenchyma at risk → TUI (or cutaneous distal ureterostomy if endoscopy impossible, until old enough for reimplant)</p>\n<p>Unresponsive sepsis → TUI (ureterocele) / nephrostomy or end ureterostomy (ectopic ureter); elective drainage still needed later</p>"], [2, "l", 24, "Ch 52 · Ectopic Ureter, Ureterocele and Ureteral Anomalies", "7 · Operative options", "Relieves obstruction in <span class=\"key\">78–97%</span>. Choice in <b>sepsis</b> and the <b>infant</b>."], [2, "l", 24, "Ch 52 · Ectopic Ureter, Ureterocele and Ureteral Anomalies", "7 · Operative options", "Well child: no catheter, outpatient. Ultrasound + VCUG at <span class=\"key\">4–6 weeks</span>."], [2, "l", 24, "Ch 52 · Ectopic Ureter, Ureterocele and Ureteral Anomalies", "7 · Operative options", "New reflux <span class=\"key\">0–50%</span>. <b>Intravesical</b>: decompression without reflux 70–80%. <b>Extravesical</b>: secondary surgery up to 70%. Reoperation RR 1.74 with lower pole reflux, 2.78 if extravesical (not additive). Single-system better than duplex."], [2, "p", 24, "Ch 52 · Ectopic Ureter, Ureterocele and Ureteral Anomalies", "7 · Operative options", "Why TUI first even if half need more surgery? Outpatient, may be definitive, defers the second operation to an older child, and decompression often avoids tapering at reimplant. Less appealing in an older child with a massive non-functioning upper pole — definitive surgery at diagnosis."], [2, "l", 24, "Ch 52 · Ectopic Ureter, Ureterocele and Ureteral Anomalies", "7 · Operative options", "Outcomes: ectopic ureter — usually curative. Ureterocele — lower pole reflux resolves in up to 20%; new reflux <span class=\"key\">15–50%</span>; secondary surgery <span class=\"key\">40–50%</span>."], [2, "l", 25, "Ch 52 · Ectopic Ureter, Ureterocele and Ureteral Anomalies", "7 · Operative options", "Persisting reflux <span class=\"key\">5–10%</span>, more with tapering."], [2, "a", 25, "Ch 52 · Ectopic Ureter, Ureterocele and Ureteral Anomalies", "8 · Decision summary", "<p>Keep upper pole + lower pole reflux → common sheath reimplant, or lower pole reimplant + distal ureteroureterostomy</p>\n<p>Keep + no lower pole reflux → proximal or distal ureteroureterostomy</p>\n<p>Function unclear / massive dilation / sepsis → temporary end ureterostomy → DMSA → reconstruct or remove</p>\n<p>Remove (marked dilation, preference) → upper pole nephrectomy with ureterectomy</p>"], [2, "p", 26, "Ch 52 · Ectopic Ureter, Ureterocele and Ureteral Anomalies", "8 · Decision summary", "VUR is the pivot: no VUR → upper tract solution; VUR → bladder-level solution — except in the infant, where TUI defers bladder surgery. Upper pole function then picks nephrectomy vs ureteroureterostomy. TUI failure costs little and may simplify the next operation."], [2, "l", 26, "Ch 52 · Ectopic Ureter, Ureterocele and Ureteral Anomalies", "10 · Other ureteral anomalies", "~<span class=\"key\">1 in 125</span> (0.8%) at autopsy; F:M 1.6:1; unilateral 6× bilateral. <b>Look for contralateral duplication</b> — an occult second ectopic ureter explains persistent wetting."], [2, "l", 26, "Ch 52 · Ectopic Ureter, Ureterocele and Ureteral Anomalies", "10 · Other ureteral anomalies", "Smith: type 1 three separate ureters (<span class=\"key\">35%</span>, commonest); 2 incomplete, two orifices (21%); 3 trifid, one orifice (31%); 4 two ureters, three orifices (13%). Weigert–Meyer usually holds; violated in quadruplication."], [2, "l", 27, "Ch 52 · Ectopic Ureter, Ureterocele and Ureteral Anomalies", "10 · Other ureteral anomalies", "<b>Fibroepithelial polyp</b>: commonest at <b>UPJ</b>; <span class=\"key\">89% male, 78% left</span>; only 22% seen preoperatively (filling defect). At UPJ → pyeloplasty; elsewhere → <b>ureteroscopic removal</b>."], [2, "l", 28, "Ch 53 · Surgery of the Ureter in Children", "1 · Pelviureteric junction (PUJ) obstruction — definition and aetiology", "Paediatric hydronephrosis: pelvic anteroposterior diameter (APD) <span class=\"key\">12 mm</span>; hydronephrosis ≠ obstruction. Koff's definition is retrospective — every indication tries to predict harm before function is lost."], [2, "l", 28, "Ch 53 · Surgery of the Ureter in Children", "1 · Pelviureteric junction (PUJ) obstruction — definition and aetiology", "<b>Lower-moiety PUJ obstruction (duplex)</b>: incomplete duplication → ureteropyelostomy to lower-pole pelvis; complete → standard pyeloplasty; moiety ≤ <span class=\"key\">5–10%</span> function → partial nephrectomy."], [2, "l", 28, "Ch 53 · Surgery of the Ureter in Children", "2 · Diagnosis and indications", "Neonatal renogram washout confounded by immaturity, hydration, diuretic timing, posture, pelvic compliance — false positives up to <span class=\"key\">44%</span>; decide on DRF trend and dilatation, not T½ alone."], [2, "a", 28, "Ch 53 · Surgery of the Ureter in Children", "3 · Anderson–Hynes dismembered pyeloplasty", "<p>Expose PUJ → free lower pole (find accessory vessel) → sparing bipolar → stay sutures → decompress pelvis with 21-G needle → dismember ± reduce pelvis → <b>spatulate laterally</b> into healthy ureter, stenotic segment as \"no-touch\" handle → apex to inferior pelvis → tension-free watertight 6-0/5-0 absorbable anastomosis → excise stenotic segment last → irrigate clot → cover with perinephric fat</p>"], [2, "p", 29, "Ch 53 · Surgery of the Ureter in Children", "3 · Anderson–Hynes dismembered pyeloplasty", "Every variant answers two questions: is there a crossing vessel (dismember), and is the gap too long for tension-free anastomosis (flap, mobilisation)?"], [2, "p", 29, "Ch 53 · Surgery of the Ureter in Children", "3 · Anderson–Hynes dismembered pyeloplasty", "One fixed principle, many routes: dismember, excise, spatulate, anastomose without tension. Access, stent and robot are choices of convenience; failure is managed by repeating the principle."], [2, "p", 30, "Ch 53 · Surgery of the Ureter in Children", "6 · Primary megaureter", "Why not rely on the renogram? Neonatal washout depends on immature function, hydration and a huge ureter's capacity — serial DRF, diameter and infection history drive surgery. Megaureter is the PUJ problem moved to the bottom of the ureter: an immature adynamic segment that usually matures."], [2, "a", 30, "Ch 53 · Surgery of the Ureter in Children", "6 · Primary megaureter", "<p>Excise stenotic distal segment → straighten → taper → non-refluxing reimplant at <span class=\"key\">5:1</span> tunnel length:diameter → stent (feeding tube 7 days or double-J 4 weeks)</p>"], [2, "p", 30, "Ch 53 · Surgery of the Ureter in Children", "7 · Surgery for vesicoureteral reflux", "<b>Principles</b>: exclude/treat bladder causes first · handle ureter (blood supply) and bladder (haematuria, spasm) gently · tension-free mobilisation · tunnel length:diameter <span class=\"key\">5:1</span> (Paquin) · straight course at empty and full bladder."], [2, "r", 31, "Ch 53 · Surgery of the Ureter in Children", "7 · Surgery for vesicoureteral reflux", "<b>Cohen</b> · Intravesical; cross-trigonal · Commonest; success &gt; <span class=\"key\">98%</span>; thick bladder; with bladder-neck reconstruction · Difficult later retrograde catheterisation"], [2, "r", 31, "Ch 53 · Surgery of the Ureter in Children", "7 · Surgery for vesicoureteral reflux", "<b>Lich–Gregoir</b> · Extravesical detrusorotomy ≈ 5 cm · No haematuria/spasm; short catheter · Transient voiding dysfunction/retention up to <span class=\"key\">10%</span>, esp. bilateral"], [2, "a", 31, "Ch 53 · Surgery of the Ureter in Children", "7 · Surgery for vesicoureteral reflux", "<p>Vertical cystotomy → feeding tube in orifice as handle → circumscribe orifice → free ureter (preserve distal blood supply) until it reaches contralateral wall tension-free → submucosal tunnel across trigone → new orifice above contralateral orifice → mucosa-to-mucosa 6-0, detrusor hitch at 6 o'clock</p>"], [2, "a", 31, "Ch 53 · Surgery of the Ureter in Children", "7 · Surgery for vesicoureteral reflux", "<p>Bladder one-third full → divide obliterated umbilical artery → free ureter <b>hugging it</b>, only to the UVJ → mark 5-cm tunnel with bladder distended → detrusorotomy to mucosa → wide flaps → lay ureter in → close detrusor caudocranially, catching adventitia at apex → Foley 12–48 h</p>"], [2, "p", 31, "Ch 53 · Surgery of the Ureter in Children", "7 · Surgery for vesicoureteral reflux", "Why voiding dysfunction? Pelvic plexus lies ≈ 1.5–2 cm dorsomedial to the UVJ. Stay on the ureter, avoid the dorsomedial UVJ, stop at the UVJ. Zaontz modification (detrusorotomy around UVJ) now avoided."], [2, "l", 31, "Ch 53 · Surgery of the Ureter in Children", "7 · Surgery for vesicoureteral reflux", "AUA meta-analysis open success <span class=\"key\">95.9%</span>; minimally invasive converging."], [2, "p", 32, "Ch 53 · Surgery of the Ureter in Children", "7 · Surgery for vesicoureteral reflux", "Early complications are tissue reactions — drain and wait. Late ones are design errors (blood supply, hiatus position, tunnel ratio) or an untreated bladder; reimplanting into an abnormal bladder worsens dilatation."], [2, "l", 33, "Ch 56 · Hypospadias", "1 · Definition, diagnosis and embryology", "<b>Triad</b>: proximal (ventral) ectopic meatus, ventral curvature, dorsally hooded foreskin (curvature and hood not always present). Incidence ≈ <span class=\"key\">1 in 150–300</span> male births; diagnosis clinical."], [2, "l", 33, "Ch 56 · Hypospadias", "1 · Definition, diagnosis and embryology", "Critical window <span class=\"key\">weeks 8–16</span>; closure proceeds from anus to glans tip. Two-zipper theory = Kurzrock (current). <span class=\"tag\">MCQ</span>"], [2, "l", 33, "Ch 56 · Hypospadias", "1 · Definition, diagnosis and embryology", "Ventral prepuce fusion awaits urethral fold fusion (≈ 20 weeks) → ectopic meatus has incomplete foreskin in <span class=\"key\">95%</span>."], [2, "p", 33, "Ch 56 · Hypospadias", "1 · Definition, diagnosis and embryology", "Hypospadias is an arrest of the androgen-dependent closing zipper: the meatus stops where closure stopped, the prepuce cannot close ventrally over an open urethra, and unfused dysplastic ventral tissue tethers the shaft into curvature."], [2, "l", 33, "Ch 56 · Hypospadias", "3 · Classification and severity", "Distal (glanular, coronal, distal shaft) <span class=\"key\">70–85%</span>; proximal 10–25%."], [2, "l", 34, "Ch 56 · Hypospadias", "4 · Associated anomalies and DSD work-up", "<b>DSD work-up</b>: UDT + proximal hypospadias; perineal hypospadias; atypical genitalia. Since 2006 severe hypospadias = 46,XY DSD. DSD risk ≈ <span class=\"key\">50%</span> non-palpable vs 15% palpable testis; 64% proximal vs 7% distal."], [2, "p", 34, "Ch 56 · Hypospadias", "4 · Associated anomalies and DSD work-up", "Hypospadias + cryptorchidism signals a systemic androgen problem, not a local one — hence karyotype before surgery."], [2, "l", 34, "Ch 56 · Hypospadias", "5 · Pre-operative assessment", "<b>Timing</b>: genital awareness ≈ 18 months. AAP 1996: 6–12 months; authors <span class=\"key\">6–18 months</span>. Systematic review (&gt;16,000): fewer complications when younger. One short anaesthetic low-risk."], [2, "l", 34, "Ch 56 · Hypospadias", "5 · Pre-operative assessment", "<b>Androgen</b>: glans width <span class=\"key\">&lt;14 mm</span> → more complications. Testosterone cypionate <b>2 mg/kg IM at 5 and 2 weeks</b> pre-op if glans &lt;15 mm (≈ 4 mm gain); DHT or hCG alternatives. Two RCTs fewer complications; meta-analyses inconclusive. Side effects (aggression, erections, pigmentation) resolve within 6 months."], [2, "a", 35, "Ch 56 · Hypospadias", "7 · Curvature", "<p>Deglove to penoscrotal junction, excise dysplastic dartos → <b>artificial erection</b> (Gittes–McLaughlin, corporal compression or prostaglandin) → straight → urethroplasty · residual &lt;30° → dorsal plication · &gt;30° → divide urethral plate → still &gt;30° → ventral corporal lengthening (usually staged)</p>"], [2, "p", 35, "Ch 56 · Hypospadias", "8 · Urethroplasty", "Why proximal repairs fail — Poiseuille: resistance ∝ length / radius⁴. A long, rigid, spongiosum-free tube ending in a non-distensible glans raises proximal pressure → fistula, diverticulum, stricture. 25–75% need extra procedures after planned two-stage repair."], [2, "l", 36, "Ch 56 · Hypospadias", "9 · Post-operative care", "Compressive dressing ≈ <span class=\"key\">72 h</span>. Diversion <span class=\"key\">3–21 days</span> by complexity (dripping stent; suprapubic for older/redo); short distal repairs unstented."], [2, "r", 36, "Ch 56 · Hypospadias", "10 · Complications", "Meatal stenosis · Obstructive symptoms + <span class=\"key\">&lt;8 Fr</span> prepubertal / &lt;12 Fr postpubertal"], [2, "r", 36, "Ch 56 · Hypospadias", "10 · Complications", "Recurrent curvature · <span class=\"key\">&gt;30°</span> on erection"], [2, "l", 36, "Ch 56 · Hypospadias", "10 · Complications", "<b>BXO/lichen sclerosus</b>: steroids usually fail → excise all, staged buccal/preputial graft; recurrence up to <span class=\"key\">40%</span>; can invade buccal grafts."], [2, "p", 36, "Ch 56 · Hypospadias", "10 · Complications", "Nearly every complication traces to distal obstruction, ischaemia or tension — so fistula/diverticulum repair begins by calibrating the distal urethra."], [2, "r", 38, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "2 · Embryology of descent", "Inguinoscrotal · <span class=\"key\">20–28 weeks</span> · Canal widens, processus forms; rapid transinguinal passage (rarely before 22 weeks); gubernaculum regresses; most scrotal after 27 weeks · Androgen via <b>GFN</b> → <b>CGRP</b>; cremaster myogenesis (Wnt)"], [2, "p", 38, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "2 · Embryology of descent", "Outgrowth creates the canal; regression lets the testis follow — a defect in either gives the same phenotype. INSL3 and androgen act on one target (gubernacular/cremaster myogenesis), hence one clinical picture whichever fails."], [2, "l", 39, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "3 · Epidemiology, aetiology and associations", "Prevalence <span class=\"key\">2–4% at birth</span> (term) → <span class=\"key\">1–2% at 3 months</span>; up to 45% preterm. Spontaneous descent mainly first 3–6 months, rarely after 6 months. High scrotal testes descend ≈ 88% vs extrascrotal ≈ half."], [2, "l", 40, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "5 · Malignancy", "TGCT risk <span class=\"key\">2–5×</span> (pooled OR ≈ 4); ≈ 1% of cryptorchid men; 5–10% of TGCT patients had UDT. Contralateral OR ≈ 1.5."], [2, "l", 41, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "5 · Malignancy", "<b>Swedish population study</b>: OR 3.2 — ≈ 2.8 if diagnosed before puberty vs ≈ 5.0 after. <span class=\"dag\">†</span> Pettersson 2007: RR 2.23 if operated &lt; 13 years vs 5.40 at ≥ 13. Meta-analysis: orchidopexy after 10–11 years → RR <span class=\"key\">5.8</span>."], [2, "a", 41, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "6 · Diagnosis", "<p>Warm room/hands, distraction; supine (then cross-legged, squatting, standing); thigh abduction inhibits cremaster; lubricant on fingers → sweep from ASIS along canal with one hand → palpate lowest position with the other → compress canal, invaginate scrotum to feel SIP → sustained traction fatigues cremaster: <b>stays = retractile; springs back = undescended</b>.</p>"], [2, "l", 41, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "6 · Diagnosis", "≈ <span class=\"key\">80% palpable</span>; 60–70% unilateral. Non-palpable at surgery: abdominal/peeping 25–50%, vanished 15–40%, missed extra-abdominal 10–30%."], [2, "l", 42, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "7 · Management principles and timing", "<b>Timing</b>: observe to <span class=\"key\">6 months</span> (corrected) → refer → orchidopexy <b>6–18 months</b>, preferably by 12. Preterm: observe to 6 months beyond due date (1 year if marginal). Abdominal orchidopexy easier soon after minipuberty. Most children worldwide still operated after 2 years."], [2, "p", 42, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "7 · Management principles and timing", "Hormones fail on both claims for one reason: position, not endocrinology, is the modifiable variable — descent is not androgen-limited after fetal life, and germ cells track age at scrotal placement."], [2, "a", 42, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "8 · Surgery for the palpable testis", "<p>EUA → skin-crease incision → check SIP → open external oblique, spare ilioinguinal nerve → free testis, divide gubernaculum distal to sac (protect long-looping vas) → <b>separate patent processus from vas and vessels without skeletonising; high-ligate at internal ring</b> (main length gain) → divide lateral spermatic bands → retroperitoneal dissection through transversalis fascia → <b>Prentiss manoeuvre</b> (medial to inferior epigastric vessels) → transverse scrotal incision, <b>subdartos pouch</b> → pass testis untwisted → excise appendages, inspect epididymis → close dartos around cord (transalbugineal sutures unnecessary — 98.7% success without) → local/ilioinguinal/caudal block.</p>"], [2, "a", 43, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "9 · The non-palpable testis", "<p>EUA — now palpable? → inguinal/scrotal orchidopexy. <b>Still non-palpable → diagnostic laparoscopy</b> (ring patency, vessels, vas, testis):</p>\n<p>• <b>Blind-ending vessels</b> (± vas) above closed ring = vanished → stop (only unequivocal endpoint).</p>\n<p>• <b>Vessels + vas entering ring</b> → inguinal/scrotal exploration; excise nubbin (viable tubules 5–15%).</p>\n<p>• <b>Intra-abdominal testis</b> → primary laparoscopic or Fowler–Stephens (one/two stage); orchidectomy if postpubertal or dysgenetic.</p>\n<p>• Peeping testis → laparoscopic or inguinal orchidopexy.</p>\n<p>• Neither vas nor vessels → search perivesical area and retroperitoneum to the kidney (perirenal testis may accompany renal dysplasia/agenesis).</p>"], [2, "a", 43, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "9 · The non-palpable testis", "<p>Empty bladder/stomach → open (Hasson) umbilical 5-mm port, CO<sub>2</sub> 8–12 mmHg → inspect both rings → 2–3-mm working ports → divide gubernaculum distal to ring (handle) → incise peritoneum lateral to vessels, distal to vas → mobilise vessels <b>preserving the peritoneal triangle between vas and vessels</b> (keeps FS possible) → new hiatus medial to inferior epigastric vessels, lateral to medial umbilical ligament → trans-scrotal port to subdartos pouch; avoid tension.</p>"], [2, "l", 44, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "9 · The non-palpable testis", "Two-stage: clip vessels high (1.5–3 cm above testis) → wait ≈ <span class=\"key\">6 months</span> → mobilise on wide peritoneal pedicle. Two-stage slightly favoured (better position, similar atrophy)."], [2, "p", 44, "Ch 57 · Etiology, Diagnosis and Management of the Undescended Testis", "9 · The non-palpable testis", "Every abdominal technique answers one question: how to gain length without losing blood supply. FS sacrifices the testicular artery; traction gains length over time while keeping it — vessel division is the last resort."], [2, "l", 45, "Ch 61 · Urologic Considerations in Pediatric Renal Transplantation", "1 · Causes of ESKD in children", "<b>CAKUT</b> (hypoplasia/dysplasia), then obstructive uropathy — mainly <b>PUV</b> in younger boys; older: FSGS, neuropathic bladder. Commonest age at transplant <span class=\"key\">13–17 years</span>."], [2, "p", 45, "Ch 61 · Urologic Considerations in Pediatric Renal Transplantation", "1 · Causes of ESKD in children", "<b>Five goals</b>: unimpeded drainage · capacious low-pressure reservoir with social continence · volitional emptying · no infection · fewest operations. Chronic rejection is unavoidable, but every added insult accelerates it."], [2, "a", 45, "Ch 61 · Urologic Considerations in Pediatric Renal Transplantation", "2 · Pre-transplant evaluation", "<p>Positive history → US + VCUG → abnormal dynamics → urodynamics → drugs + CIC ± bladder cycling → reassess → still unsafe → augmentation → clear for transplant</p>"], [2, "l", 45, "Ch 61 · Urologic Considerations in Pediatric Renal Transplantation", "3 · Bladder management", "<b>Target</b>: expected capacity at detrusor pressure <span class=\"key\">&lt; 40 cm H₂O</span>, socially continent."], [2, "l", 45, "Ch 61 · Urologic Considerations in Pediatric Renal Transplantation", "3 · Bladder management", "<b>Augment</b> if cannot reach &gt; <span class=\"key\">75%</span> expected capacity at &lt; 40 cm H₂O with CIC no more often than every <span class=\"key\">3–4 h</span> despite maximal therapy; no clear rise in transplant complications. PUV → <b>postpone</b>; neuropathic → <b>earlier</b>."], [2, "l", 45, "Ch 61 · Urologic Considerations in Pediatric Renal Transplantation", "3 · Bladder management", "Reconstruction <b>before</b> transplant, <span class=\"key\">6–12 weeks</span> healing; exception: transplant before 2 years (before continence expected)."], [2, "l", 46, "Ch 61 · Urologic Considerations in Pediatric Renal Transplantation", "5 · Transplant into the abnormal bladder", "Gibson retroperitoneal; &lt; <span class=\"key\">15 kg</span> may need aorta/vena cava and transperitoneal approach. Know augment pedicle position."], [2, "l", 46, "Ch 61 · Urologic Considerations in Pediatric Renal Transplantation", "5 · Transplant into the abnormal bladder", "Stent if difficult: double-J out at <span class=\"key\">4–6 weeks</span>; early removal at 5–7 days may cut infection. Largest urethral catheter tolerated."], [2, "r", 46, "Ch 61 · Urologic Considerations in Pediatric Renal Transplantation", "6 · Urological complications", "Ureteric stenosis · <span class=\"key\">6%</span> · Most within 100 days; distal ischaemic; focal → balloon + stent 4–6 weeks; else open repair (native ureter, bladder flap) — do not delay"], [2, "r", 46, "Ch 61 · Urologic Considerations in Pediatric Renal Transplantation", "6 · Urological complications", "Urine leak · <span class=\"key\">3%</span> · Early; drain creatinine → catheter → US → MAG3/cystogram; small: observe; large: drain/explore; short necrosis → reimplant; long → native ureter, psoas hitch, flap"], [2, "a", 46, "Ch 61 · Urologic Considerations in Pediatric Renal Transplantation", "6 · Urological complications", "<p>Indwelling catheter 1–2 weeks → creatinine falls = bladder cause → if not, stent + catheter; rejection signs → biopsy; failed retrograde stent → nephrostomy + antegrade study</p>"], [2, "l", 48, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "1 · Wilms tumour (WT): epidemiology and genetics", "<span class=\"key\">6–7%</span> of childhood cancers, <span class=\"key\">95%</span> of kidney cancers under 15 y; median <span class=\"key\">3.5 y</span>; younger in bilateral/syndromic. Mostly somatic multi-hit (Knudson two-hit explains few); <b>10–15%</b> germline/early epigenetic; familial 1–2%."], [2, "r", 48, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "1 · Wilms tumour (WT): epidemiology and genetics", "High (&gt; 20%) · WAGR, DDS (<span class=\"key\">50%</span>); Fanconi D1 (BRCA2); Perlman (DIS3L2); mosaic variegated aneuploidy"], [2, "p", 48, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "1 · Wilms tumour (WT): epidemiology and genetics", "Trap: BWS is the <b>commonest</b> predisposing syndrome but only moderate risk; WAGR/DDS are rarer and highest."], [2, "a", 48, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "1 · Wilms tumour (WT): epidemiology and genetics", "<p>WT risk &gt; 1% → renal US every <b>3–4 months</b> until <b>7 y</b> → suspicious lesion → CT/MRI</p>"], [2, "l", 48, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "2 · Pathology", "<b>Anaplasia</b>: nuclei ≥ <span class=\"key\">3×</span> neighbours, hyperchromasia, abnormal mitoses; ~2% under 2 y, ~13% over 5 y; acquired (absent from rests)."], [2, "l", 48, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "2 · Pathology", "Nephrogenic rests in &gt; 1/3 of WT kidneys, <span class=\"key\">&gt; 90%</span> of bilateral; most regress. Diffuse hyperplastic perilobar nephroblastomatosis: thick rind, almost always bilateral, ~half develop WT. Perilobar = periphery, late, BWS; intralobar = anywhere/sinus, early, WAGR/DDS."], [2, "p", 49, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "4 · Staging and COG vs SIOP", "COG stage is surgical-pathological, so the surgeon — not the scan — decides chemotherapy intensity and irradiation: one spill converts stage I/II to III."], [2, "l", 49, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "5 · Surgical principles", "Node sampling (COG <span class=\"key\">≥5 nodes</span>, skip metastases interaortocaval); omission = commonest violation (10–20%) → under-staging."], [2, "a", 49, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "5 · Surgical principles", "<p>Synchronous bilateral → <b>no upfront nephrectomy, no biopsy</b> → VCR + AMD + DOX 6 weeks → imaging → NSS if feasible → else more chemo, <b>surgery by week 12</b> → non-responder: <b>bilateral open biopsy</b></p>"], [2, "l", 49, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "5 · Surgical principles", "Unilateral NSS: syndromic or solitary kidney; UMBRELLA <span class=\"key\">&lt;300 mL</span>, remnant, negative nodes; frozen section, margin of normal kidney."], [2, "l", 50, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "6 · Relapse and late effects", "Late effects track <b>RT and anthracycline</b>: heart failure 4.4% after DOX (rare below <span class=\"key\">150 mg/m²</span>); second cancers 1% at 10 y; gonadal failure. Renal failure after unilateral nephrectomy <b>0.6%</b> at 20 y (higher in WT1 syndromes)."], [2, "p", 50, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "7 · Other renal tumours", "Age points to diagnosis: neonate → CMN; toddler → WT/rhabdoid; adolescent → RCC. Metastatic site sets staging tests: lung (WT), bone (CCSK), brain (rhabdoid/CCSK)."], [2, "l", 51, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "8 · Neuroblastoma", "Urinary <b>VMA/HVA</b> raised in <span class=\"key\">90–95%</span>. Marrow: two aspirates + two biopsies. MRI best for intraspinal extension. <b>Calcification and vessel encasement</b> favour neuroblastoma over WT."], [2, "r", 51, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "8 · Neuroblastoma", "MS · Age <span class=\"key\">&lt;18 months</span>; skin, liver, marrow (&lt; 10%) only; no bone (INSS 4S: &lt; 12 months)"], [2, "p", 51, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "8 · Neuroblastoma", "Trap: diploid is bad, hyperdiploid good. Stage 4S/MS: OS 80–88%, frequent regression; deaths in infants &lt; 2 months from massive hepatomegaly (respiratory compromise) or coagulopathy."], [2, "p", 51, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "8 · Neuroblastoma", "Surgical value runs inversely with biology: favourable tumours are cured by little or no resection; unfavourable ones are not rescued by radical resection — vital structures are never traded for margin."], [2, "p", 52, "Ch 63 · Paediatric Urologic Oncology: Renal and Adrenal", "9 · Adrenocortical tumours", "Why open? Cure needs complete removal of an intact tumour; capsular rupture seeds the retroperitoneum, with poor salvage."], [2, "l", 53, "Ch 64 · Paediatric Urological Oncology: Pelvis, Bladder, Testis and Genitalia", "1 · Rhabdomyosarcoma (RMS): biology", "<b>Commonest childhood sarcoma</b> (~3% of paediatric cancers); 20–30% GU; peaks first 2 y and adolescence. Sites: bladder/prostate (BP), paratesticular (PT), vulvovaginal (VV). GU-RMS 5-y survival <span class=\"key\">&gt;80%</span>. Metastases in 16% at diagnosis."], [2, "p", 53, "Ch 64 · Paediatric Urological Oncology: Pelvis, Bladder, Testis and Genitalia", "1 · Rhabdomyosarcoma (RMS): biology", "Fusion status predicts outcome better than histology, so trials assign risk by <b>fusion status</b>. MYOD1 mutation and circulating tumour DNA are emerging adverse markers."], [2, "a", 53, "Ch 64 · Paediatric Urological Oncology: Pelvis, Bladder, Testis and Genitalia", "2 · Presentation and work-up", "<p>US → CT/MRI of primary + nodal basin (BP: pelvic and retroperitoneal to renal vessels; PT: retroperitoneal; VV: inguinal, pelvic, retroperitoneal) → <b>chest CT</b> (lung commonest) → bone scan + bilateral marrow (omit in fusion-negative ERMS without nodal/lung disease)</p>"], [2, "p", 54, "Ch 64 · Paediatric Urological Oncology: Pelvis, Bladder, Testis and Genitalia", "3 · Stage, group and risk", "Organ-preserving <b>biopsy</b> places BP-RMS in group III → <b>intermediate risk</b>; PT-RMS (resected by orchidectomy) is almost always low risk. Age &lt; 1 y or &gt; 10 y independently adverse. Trap: most distal node positive = IIc, not IIb."], [2, "l", 54, "Ch 64 · Paediatric Urological Oncology: Pelvis, Bladder, Testis and Genitalia", "4 · Treatment principles", "Primary exenteration fell from almost all (IRS-I) to <span class=\"key\">13%</span> (IRS-IV), OS unchanged (78–83%)."], [2, "l", 54, "Ch 64 · Paediatric Urological Oncology: Pelvis, Bladder, Testis and Genitalia", "4 · Treatment principles", "<b>Ipsilateral nerve-sparing RPLND</b> before chemo if <span class=\"key\">age ≥10 y</span> or radiological N1; ≥ 7–13 nodes to renal vessels."], [2, "p", 55, "Ch 64 · Paediatric Urological Oncology: Pelvis, Bladder, Testis and Genitalia", "4 · Treatment principles", "Why age, not CT? Older boys have far more retroperitoneal disease and CT has a high false-negative rate for nodes."], [2, "l", 55, "Ch 64 · Paediatric Urological Oncology: Pelvis, Bladder, Testis and Genitalia", "5 · Other bladder tumours", "<b>Spina bifida/exstrophy</b>: lifetime bladder cancer <span class=\"key\">2–4%</span>, aggressive, <b>not increased by augmentation</b>; screening asymptomatic patients ineffective — evaluate haematuria promptly."], [2, "r", 55, "Ch 64 · Paediatric Urological Oncology: Pelvis, Bladder, Testis and Genitalia", "6 · Testicular tumours", "Half-life · <span class=\"key\">5 days</span> · <span class=\"key\">24 h</span>"], [2, "a", 55, "Ch 64 · Paediatric Urological Oncology: Pelvis, Bladder, Testis and Genitalia", "6 · Testicular tumours", "<p>Inguinal approach → markers normal + benign-looking US → <b>testis-sparing partial orchidectomy</b> with frozen section → benign: close; germ cell malignancy or raised AFP → radical inguinal orchidectomy</p>"], [2, "l", 56, "Ch 64 · Paediatric Urological Oncology: Pelvis, Bladder, Testis and Genitalia", "6 · Testicular tumours", "<b>YST</b>: radical inguinal orchidectomy; <span class=\"key\">90%</span> stage I; CT; AFP decline by half-life. Stage I → <b>surveillance, no RPLND/chemo</b>. Scrotal violation → stage II (chemo, no hemiscrotectomy). Nodes with normal markers → biopsy; nodes + raised markers = stage III; III–IV → cisplatin, etoposide, bleomycin. Persistent mass → biopsy/RPLND."], [2, "p", 56, "Ch 64 · Paediatric Urological Oncology: Pelvis, Bladder, Testis and Genitalia", "6 · Testicular tumours", "Trap: <b>complete</b> androgen insensitivity is intermediate (not high) risk; partial is high."], [2, "a", 57, "★ Putting it together: common paediatric decisions", "A · VUR after febrile UTI", "<p><b>1.</b> US → VCUG if recurrent/admitted febrile UTI or abnormal US.</p>\n<p><b>2.</b> Treat BBD (constipation first).</p>\n<p><b>3.</b> Low risk (grade I–II, no BBD, boy, older) → observe ± CAP. High risk (grade ≥ III, girl, BBD, scars, infant) → CAP.</p>\n<p><b>4.</b> Breakthrough UTI, new scars, persistent high grade + poor function → injection or reimplant (<span class=\"xref\">→ Ch 41, 53</span>).</p>"], [2, "a", 57, "★ Putting it together: common paediatric decisions", "C · Undescended testis", "<p><b>Palpable</b> → orchidopexy at <span class=\"key\">6–18 months</span> (ideally by 12); no imaging.</p>\n<p><b>Non-palpable</b> → EUA → laparoscopy: blind-ending vessels → stop · vessels + vas entering ring → groin exploration · intra-abdominal → laparoscopic orchidopexy (primary/Fowler–Stephens).</p>\n<p><b>Bilateral non-palpable or UDT + hypospadias</b> → DSD work-up first <span class=\"xref\">→ Ch 59</span>.</p>"], [2, "p", 58, "★ Putting it together: common paediatric decisions", "E · Newborn with atypical genitalia", "Bilateral impalpable gonads + atypical genitalia = salt-wasting CAH until proven otherwise. Electrolytes, 17-OHP (after 36 h), karyotype; crisis days 5–7. Sex assignment/surgery not emergencies (MDT)."], [3, "l", 2, "Ch 32 · Embryology of the Human Genitourinary Tract", "1 · Overview", "<b>Indifferent stage</b> ≈ <span class=\"key\">8–9 wk</span>; thereafter androgens drive the sexes apart."], [3, "p", 2, "Ch 32 · Embryology of the Human Genitourinary Tract", "2 · Kidney and ureter", "One defect gives both dysplasia and an abnormal orifice: bud position on the Wolffian duct sets where it meets the blastema (kidney quality) and where its orifice lands in the bladder."], [3, "l", 3, "Ch 32 · Embryology of the Human Genitourinary Tract", "4 · Gonads", "<b>SRY</b> → Sertoli cells enclose PGCs in cords (≈ <span class=\"key\">6 wk</span>). Leydig cells from 8 wk."], [3, "l", 3, "Ch 32 · Embryology of the Human Genitourinary Tract", "4 · Gonads", "<b>MIS/AMH</b> (Sertoli): Müllerian regression <span class=\"key\">8–10 wk</span> (sensitivity window 9–13 wk); absent → uterus, tubes persist. <b>Testosterone</b> (Leydig): Wolffian → epididymis, vas, seminal vesicle; absent → Wolffian ducts regress."], [3, "p", 3, "Ch 32 · Embryology of the Human Genitourinary Tract", "4 · Gonads", "Two independent testicular signals act on two independent duct systems: MIS decides Müllerian, testosterone decides Wolffian and external genitalia. Every DSD is a combination of the two."], [3, "l", 3, "Ch 32 · Embryology of the Human Genitourinary Tract", "6 · Genital ducts", "<b>Prostate</b>: buds at <span class=\"key\">10 wk</span> from FOXA1+ UGS epithelium below ureteric insertion; most buds lateral to the <b>verumontanum</b> (Wolffian ducts + utricle open on it)."], [3, "l", 4, "Ch 32 · Embryology of the Human Genitourinary Tract", "7 · External genitalia", "Shaft fused by <span class=\"key\">16 wk</span>. Meatus = ecto–endodermal junction; prepuce depends on glanular urethra."], [3, "p", 5, "Ch 32 · Embryology of the Human Genitourinary Tract", "9 · Clinical correlations", "Homologues: Littre ↔ Skene, Cowper ↔ Bartholin, spongiosum ↔ vestibular bulb, gubernaculum ↔ ovarian + round ligaments, labioscrotal swellings ↔ labia majora. Traps: vagina is UGS-derived; appendix testis Müllerian, appendix epididymis Wolffian."], [3, "l", 6, "Ch 33 · Urologic Aspects of Pediatric Nephrology", "1 · Renal function in the child", "GFR doubles in 2 weeks, adult level by <span class=\"key\">2 years</span>; term ≈40 mL/min/1.73 m²."], [3, "l", 6, "Ch 33 · Urologic Aspects of Pediatric Nephrology", "1 · Renal function in the child", "Creatinine: first 48 h = <b>maternal</b>; by day 7 the neonate's own (<span class=\"key\">&lt;0.5 mg/dL</span> at term)."], [3, "p", 6, "Ch 33 · Urologic Aspects of Pediatric Nephrology", "1 · Renal function in the child", "The neonatal kidney is \"hormonally deaf\": maternal creatinine, week-1 salt wasting, hyperkalaemia (aldosterone-unresponsive tubule), low bicarbonate and poor concentration (ADH-unresponsive) reflect immaturity, not disease."], [3, "l", 6, "Ch 33 · Urologic Aspects of Pediatric Nephrology", "2 · Haematuria", "Microscopic: <span class=\"key\">&gt;5 red blood cells (RBCs)/high-power field</span> (fresh spun); ≈1% of school children, mostly resolves."], [3, "l", 6, "Ch 33 · Urologic Aspects of Pediatric Nephrology", "3 · Proteinuria", "Normal UPCR <span class=\"key\">&lt;0.2 mg/mg</span> (&lt;0.7 newborn); timed &lt;4 mg/m²/h; adolescents &lt;150 mg/24 h."], [3, "l", 6, "Ch 33 · Urologic Aspects of Pediatric Nephrology", "4 · Glomerular disease", "Proteinuria <span class=\"key\">&gt;40 mg/m²/h or UPCR &gt;2.0</span> + hypoalbuminaemia + hyperlipidaemia."], [3, "l", 7, "Ch 33 · Urologic Aspects of Pediatric Nephrology", "4 · Glomerular disease", "<b>Post-streptococcal GN</b>: weeks after pharyngitis/pyoderma; C3 normalises by <span class=\"key\">8–12 weeks</span>; persistently low → biopsy."], [3, "l", 7, "Ch 33 · Urologic Aspects of Pediatric Nephrology", "7 · Hypertension", "Repeated BP <span class=\"key\">&gt;95th percentile</span> for age, sex, height; adolescents normal &lt;120/80. Up to a quarter white-coat."], [3, "l", 8, "Ch 33 · Urologic Aspects of Pediatric Nephrology", "7 · Hypertension", "Lifestyle for stage 1 without end-organ damage; drugs for stage 2, symptoms, end-organ damage, secondary cause. Target &lt;90th percentile; CKD <span class=\"key\">&lt;50th</span>."], [3, "l", 8, "Ch 33 · Urologic Aspects of Pediatric Nephrology", "8 · Acute kidney injury", "FeNa <span class=\"key\">&lt;1%</span> = prerenal; &gt;3% = intrinsic; on diuretics FeUrea &lt;35%."], [3, "l", 8, "Ch 33 · Urologic Aspects of Pediatric Nephrology", "9 · Chronic kidney disease", "Abnormality &gt;3 months; stages (&gt;2 years) by GFR: I ≥90, II 60–89, III 30–59, IV 15–29, V <span class=\"key\">&lt;15</span> or dialysis."], [3, "l", 8, "Ch 33 · Urologic Aspects of Pediatric Nephrology", "10 · Dialysis and transplantation", "PD first if <span class=\"key\">&lt;9 years / &lt;20 kg</span>; vesicostomy acceptable; contraindicated by omphalocele, gastroschisis, diaphragmatic hernia, exstrophy."], [3, "l", 8, "Ch 33 · Urologic Aspects of Pediatric Nephrology", "10 · Dialysis and transplantation", "Often pre-emptive living-related; many wait for <span class=\"key\">≥10 kg and 65 cm</span> (graft thrombosis)."], [3, "l", 9, "Ch 34 · Perinatal Urology", "1 · Fetal renal development and prenatal imaging", "Metanephric kidney at <span class=\"key\">day 28</span>; urine production from <span class=\"key\">14 weeks</span>; after <span class=\"key\">~16 weeks</span> amniotic fluid is mainly fetal urine → oligohydramnios → pulmonary hypoplasia."], [3, "l", 9, "Ch 34 · Perinatal Urology", "1 · Fetal renal development and prenatal imaging", "AFI (four largest pockets): normal 8–18 cm; oligohydramnios <span class=\"key\">&lt;5–6 cm</span>."], [3, "p", 9, "Ch 34 · Perinatal Urology", "1 · Fetal renal development and prenatal imaging", "Prenatal detection is for triage and counselling (differential, postnatal plan, natural history); no proof it improves outcome."], [3, "l", 9, "Ch 34 · Perinatal Urology", "2 · Grading systems", "Pyramidal thickness <span class=\"key\">≤3 mm</span> predicts pyeloplasty and reduced function."], [3, "l", 9, "Ch 34 · Perinatal Urology", "2 · Grading systems", "<b>UTD</b> (six parameters + oligohydramnios). Normal APD ceiling <span class=\"key\">&lt;4 mm (16–27 weeks) → &lt;7 mm (≥28 weeks) → &lt;10 mm (postnatal &gt;48 h)</span>, all else normal. Objective + subjective; pre- and postnatal; whole tract."], [3, "a", 9, "Ch 34 · Perinatal Urology", "3 · Prenatal follow-up", "<p>A1 (APD 4 to &lt;7 mm at 16–27 wk; 7 to &lt;10 mm ≥28 wk; all else normal) → repeat US after 32 weeks → postnatal US after 48 h</p>\n<p>A2–3 (any abnormal parameter) → US every 4 weeks to delivery (may progress; second anomaly likelier) → postnatal US after 48 h</p>"], [3, "l", 10, "Ch 34 · Perinatal Urology", "4 · Fetal LUTO and oligohydramnios", "Poor prognosis: oligohydramnios <span class=\"key\">before 27 weeks</span>, cortical cysts, echogenicity. After 27 weeks → favourable lungs."], [3, "l", 10, "Ch 34 · Perinatal Urology", "4 · Fetal LUTO and oligohydramnios", "Early delivery, vesicoamniotic shunt (VAS), fetal cystoscopy, serial amnioinfusion. Window <span class=\"key\">18–24 weeks</span>; need ≈1 in 60,000."], [3, "l", 10, "Ch 34 · Perinatal Urology", "4 · Fetal LUTO and oligohydramnios", "Complications ≈<span class=\"key\">44%</span>: shunt failure (commonest), preterm labour, membrane rupture, ascites, chorioamnionitis, bowel herniation."], [3, "p", 10, "Ch 34 · Perinatal Urology", "4 · Fetal LUTO and oligohydramnios", "Counsel: intervention improves perinatal survival (lungs); complications exceed 40%; it does not reliably prevent renal replacement — dysplasia is often established first."], [3, "l", 11, "Ch 34 · Perinatal Urology", "5 · Postnatal imaging", "<b>MAG3</b> (over DTPA; \"well-tempered\" protocol): surgery considered if <span class=\"key\">DRF &lt;40%</span>, T½ &gt;20 min, or delayed upright retention. Pitfalls: dehydration, furosemide before peak uptake into a capacious pelvis, ROI placement."], [3, "l", 11, "Ch 34 · Perinatal Urology", "6 · Postnatal management, UTI and prophylaxis", "CAP without VUR in P3 until pyeloplasty or <span class=\"key\">1 year</span> (~90% of UTIs in year 1)."], [3, "l", 11, "Ch 34 · Perinatal Urology", "6 · Postnatal management, UTI and prophylaxis", "Circumcision: NNT <span class=\"key\">10</span>; OR ≈0.3."], [3, "l", 11, "Ch 34 · Perinatal Urology", "6 · Postnatal management, UTI and prophylaxis", "Agents: amoxicillin, first-generation cephalosporin from birth; nitrofurantoin/trimethoprim <span class=\"key\">≥8 weeks</span> (immature hepatic metabolism)."], [3, "a", 11, "Ch 34 · Perinatal Urology", "6 · Postnatal management, UTI and prophylaxis", "<p>US after 48 h → normal (&lt;10 mm, all normal) → transient</p>\n<p>P1 → US 3–6 months → P2 → CAP if ureter &gt;7 mm; VCUG/MAG3 at discretion → P3 → CAP + VCUG + US ~1 month → persistent → MAG3</p>\n<p>Bilateral severe dilation ± oligohydramnios → outlet obstruction: decompress → CAP → urgent evaluation</p>"], [3, "l", 11, "Ch 34 · Perinatal Urology", "7 · Specific antenatal diagnoses", "Commonest <b>surgical</b> cause. Third-trimester APD <span class=\"key\">15 mm</span>: sensitivity/specificity ≈80% for pyeloplasty; postnatal APD predicts better. Even severe UTD: ~a fifth need surgery."], [3, "l", 12, "Ch 34 · Perinatal Urology", "7 · Specific antenatal diagnoses", "Most resolve. Surgery predicted by ureter <span class=\"key\">&gt;13 mm</span>, DRF &lt;30%."], [3, "l", 12, "Ch 34 · Perinatal Urology", "7 · Specific antenatal diagnoses", "BAPU: prenatal ureter <span class=\"key\">&gt;7 mm after 30 weeks</span> → postnatal US, CAP, VCUG for all; consider MAG3."], [3, "p", 12, "Ch 34 · Perinatal Urology", "7 · Specific antenatal diagnoses", "In PUJ, VUR and megaureter, dilation alone is not an indication: operate for function loss, infection or progression; grade sets surveillance."], [3, "p", 12, "Ch 34 · Perinatal Urology", "7 · Specific antenatal diagnoses", "Bilateral dilation with normal fluid = urine still leaves the fetus (reflux, megacystis); with low fluid = true outlet obstruction."], [3, "a", 12, "Ch 34 · Perinatal Urology", "7 · Specific antenatal diagnoses", "<p>Team at delivery → (lung resuscitation) → 5 Fr feeding tube, finger in rectum to guide over high bladder neck → KUB confirms → fails → US-guided suprapubic catheter</p>"], [3, "l", 13, "Ch 34 · Perinatal Urology", "7 · Specific antenatal diagnoses", "<b>CAH</b>: 21-hydroxylase (6p), AR; salt-wasting 75%. Only <span class=\"key\">1 in 8</span> at-risk pregnancies is an affected girl → prenatal treatment controversial. Electrolytes first; 17-OHP + genetics."], [3, "l", 13, "Ch 34 · Perinatal Urology", "8 · Neonatal urological emergencies", "ARM: GU/spinal anomalies up to <span class=\"key\">75%</span> → renal + spinal US; CAP until videourodynamics at 6 weeks."], [3, "p", 15, "Ch 35 · Urologic Evaluation of the Child", "1 · Triage by acuity", "Context shifts the tier: hernia emergent if incarcerated, semiurgent if reducible; hydronephrosis urgent if bilateral/solitary."], [3, "l", 15, "Ch 35 · Urologic Evaluation of the Child", "3 · Examination", "Minimum systolic BP: <span class=\"key\">≥60</span> neonate; ≥70 at 1 mo–1 yr; <span class=\"key\">70 + 2×age</span> at 1–10 yr; ≥90 above 10 yr."], [3, "l", 15, "Ch 35 · Urologic Evaluation of the Child", "3 · Examination", "<b>Micropenis</b>: stretched length &lt; mean − 2.5 SD — term <span class=\"key\">1.9 cm</span>, adult 9.3 cm; barely changes 5–11 yr; preterm needs gestation-specific values."], [3, "l", 16, "Ch 35 · Urologic Evaluation of the Child", "4 · Urine and blood tests", "AAP UTI: pyuria and/or bacteriuria + <span class=\"key\">≥50,000 colony-forming units (CFU)/mL</span> (catheter/aspirate) in a symptomatic child."], [3, "r", 16, "Ch 35 · Urologic Evaluation of the Child", "4 · Urine and blood tests", "Microscopic haematuria · <span class=\"key\">&gt;5 red cells (RBC)/high-power field</span> (adult ≥3), &gt;2 occasions"], [3, "r", 16, "Ch 35 · Urologic Evaluation of the Child", "6 · Emergent presentations", "Absent cremasteric reflex; nausea/vomiting; high-riding testis · 1 each · <span class=\"key\">≥6</span> → explore without US"], [3, "l", 16, "Ch 35 · Urologic Evaluation of the Child", "6 · Emergent presentations", "<b>Ambiguous genitalia</b>: exclude <b>salt-wasting CAH</b> (21-hydroxylase ≈ 95%): crisis day <span class=\"key\">4–15</span> → no early discharge; <b>17-OHP + electrolytes</b>."], [3, "l", 17, "Ch 35 · Urologic Evaluation of the Child", "6 · Emergent presentations", "<b>Retention</b>: capacity (mL) = <span class=\"key\">(age + 2) × 30</span>. Analgesia, sitz bath, disimpaction before catheter; no cause → neurological evaluation."], [3, "l", 17, "Ch 35 · Urologic Evaluation of the Child", "7 · Common referral presentations", "Scan <b>before discharge</b> if bilateral, solitary kidney or suspected outlet obstruction (third-trimester APD &gt;7 mm or UTD A2–3); otherwise after <span class=\"key\">48 h</span>. Creatinine maternal for 48 h → follow trend."], [3, "l", 17, "Ch 35 · Urologic Evaluation of the Child", "7 · Common referral presentations", "<b>Varicocele</b> (≈15% adolescents): Lambert volume L×W×H×<span class=\"key\">0.71</span>. Non-decompressing supine or right-sided → retroperitoneal US."], [3, "p", 18, "Ch 35 · Urologic Evaluation of the Child", "7 · Common referral presentations", "Red flags: absent cremasteric reflex with acute pain; ambiguous genitalia with impalpable gonads; bilateral hydronephrosis in a boy; fever with obstruction; hypotension; abdominal mass; meatal blood; lumbosacral lipoma or deviated cleft."], [3, "p", 19, "Ch 36 · Pediatric Urogenital Imaging", "1 · Principles — ALARA and the three harms", "Every choice trades <b>radiation, sedation and contrast</b> against yield; the long lifespan tips it towards US, and the question is which test fills US's functional gap (obstruction, reflux, pyelonephritis) most cheaply."], [3, "l", 19, "Ch 36 · Pediatric Urogenital Imaging", "2 · Ultrasonography", "Fetal urine from <span class=\"key\">10–12 weeks</span>; by <span class=\"key\">20 weeks</span> US detects most anomalies. Check cord insertion and abdominal wall (exstrophy)."], [3, "l", 20, "Ch 36 · Pediatric Urogenital Imaging", "2 · Ultrasonography", "Sulfur hexafluoride microbubbles; five-grade VUR system; <b>no radiation</b>. AUC <span class=\"key\">0.97</span>, sensitivity ~92%, specificity ~91–94% → recommended for VUR."], [3, "l", 20, "Ch 36 · Pediatric Urogenital Imaging", "3 · Voiding cystourethrography", "<b>Trauma</b>: meatal blood → <b>retrograde urethrogram before any catheter</b> → gravity fill. Capacity (mL) = <span class=\"key\">(age + 2) × 30</span>, max 400. \"Pie-in-the-sky\" bladder = pelvic fracture, extraperitoneal injury."], [3, "r", 20, "Ch 36 · Pediatric Urogenital Imaging", "4 · Nuclear medicine", "Timing · Within days; resolves over ~5 months · Lesion at <span class=\"key\">≥6 months</span> = scar"], [3, "l", 21, "Ch 36 · Pediatric Urogenital Imaging", "4 · Nuclear medicine", "Furosemide <span class=\"key\">1 mg/kg IV</span> at maximal filling; too early → drainage measured before system full. <span class=\"dag\">†</span>DTPA noisier in the immature neonatal kidney."], [3, "l", 21, "Ch 36 · Pediatric Urogenital Imaging", "5 · MR urography", "Protocol: hydration + catheter → <span class=\"key\">furosemide 1 mg/kg (max 20 mg)</span> → T2 → gadolinium → dynamic T1; <b>Patlak</b> function."], [3, "l", 23, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "1 · Overview and the paradigm shift", "UTI affects ~<span class=\"key\">1% of boys, 3–5% of girls</span>; 30–50% recur. Commonest bacterial infection in febrile children (~7% of febrile infants)."], [3, "p", 23, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "2 · Pathogenesis and virulence", "IBCs and biofilms shield bacteria from neutrophils and antibiotics; a biofilm survives 1000–1500× normal killing concentrations (poor penetration, slow growth, altered targets)."], [3, "l", 23, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "3 · Host risk factors", "<b>Circumcision</b>: UTI in first 6 months ↓ <span class=\"key\">~10-fold</span>. US Army cohort: circumcised 0.11%, uncircumcised 1.12%, girls 0.57% <span class=\"tag\">MCQ</span>. Number needed to circumcise: <span class=\"key\">111</span> normal boys, 11 recurrent UTI, <span class=\"key\">4</span> high-grade VUR. Protective in antenatal hydronephrosis."], [3, "l", 23, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "3 · Host risk factors", "<b>VUR</b>: 1–2% of newborns, <span class=\"key\">25–40%</span> after first UTI; most pyelonephritis occurs without VUR, but grade III–IV doubles pyelonephritic change <span class=\"xref\">→ Ch 41</span>."], [3, "p", 24, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "3 · Host risk factors", "Host factors either raise inoculum/dwell time (prepuce, faecal flora, stasis, constipation, catheter) or lower defence (immature immunity, receptor-bearing blood groups); prevention reverses whichever applies."], [3, "l", 24, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "4 · Classification", "Febrile UTI (presumed pyelonephritis) vs afebrile cystitis. Localisation poor: only <span class=\"key\">50–66%</span> of febrile children have acute DMSA changes (gold standard)."], [3, "l", 24, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "4 · Classification", "Kass: two cultures <span class=\"key\">≥10<sup>5</sup> colony-forming units (CFU)/mL</span>, same organism, no symptoms."], [3, "l", 25, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "5 · Diagnosis", "Pyuria less with Klebsiella/Enterococcus → culture anyway; UTI without pyuria rare (separates ASB). Threshold <span class=\"key\">≥10 WBC/HPF</span> better &lt;2 years."], [3, "r", 25, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "5 · Diagnosis", "AAP 2011 (2–24 months) · Catheter/SPA · <span class=\"key\">≥50,000 + pyuria</span>"], [3, "l", 25, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "6 · Imaging after UTI", "DMSA (~1 mSv): APN best within <b>1 week</b>; scar at <span class=\"key\">≥6 months</span>; ~15% of acute lesions scar; scar indistinguishable from dysplasia. CT (10–15 mSv) only for occult stones or mass vs inflammation."], [3, "l", 26, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "6 · Imaging after UTI", "<b>NICE \"atypical\"</b>: seriously ill, poor urine flow, abdominal/bladder mass, raised creatinine, septicaemia, no response within <span class=\"key\">48 h</span>, non-<i>E. coli</i>. Late DMSA at 4–6 months."], [3, "r", 26, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "7 · Treatment", "Febrile UTI · <span class=\"key\">7–14 days</span> (shorter inferior)"], [3, "r", 26, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "7 · Treatment", "Afebrile cystitis · <span class=\"key\">2–4 days</span> (beats single dose; equals 7–14 days)"], [3, "l", 27, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "8 · Renal scarring and sequelae", "Childhood UTI = <span class=\"key\">&lt;1% of CKD</span>; ESKD ~1 in 10,000. Scars → hypertension, pre-eclampsia."], [3, "l", 27, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "9 · Prevention and prophylaxis", "Recurrence <span class=\"key\">10–30%</span>, highest in first 3–6 months; girls up to 40%."], [3, "l", 29, "Ch 38 · Core Principles of Perioperative Management in Children", "2 · Preoperative assessment", "<b>Investigations indication-driven</b>: no routine bloods, CXR or ECG; murmur alone is not an ECG indication. Urine hCG in females of menstrual age — <span class=\"tag\">MCQ</span> false positive after augmentation cystoplasty."], [3, "l", 29, "Ch 38 · Core Principles of Perioperative Management in Children", "2 · Preoperative assessment", "<b>URTI</b>: airway hyperreactive <span class=\"key\">6–8 weeks</span> → laryngospasm, bronchospasm, desaturation; laryngeal mask safer than endotracheal tube. Postpone elective surgery ≥ 4, ideally 6 weeks."], [3, "l", 29, "Ch 38 · Core Principles of Perioperative Management in Children", "2 · Preoperative assessment", "<b>Sepsis</b>: antibiotics within <span class=\"key\">1 h</span> of septic shock; avoid neuraxial blocks. <b>Trauma</b>: full stomach → rapid-sequence induction."], [3, "r", 29, "Ch 38 · Core Principles of Perioperative Management in Children", "3 · Fasting (NPO)", "<span class=\"key\">2 h</span> · Clear liquids, carbohydrate drinks (European and Canadian 2022: 1 h)"], [3, "r", 29, "Ch 38 · Core Principles of Perioperative Management in Children", "3 · Fasting (NPO)", "<span class=\"key\">4 h</span> · Breast milk"], [3, "r", 29, "Ch 38 · Core Principles of Perioperative Management in Children", "3 · Fasting (NPO)", "<span class=\"key\">6 h</span> · Infant formula, non-human milk, light meal, tube feeds"], [3, "r", 29, "Ch 38 · Core Principles of Perioperative Management in Children", "3 · Fasting (NPO)", "<span class=\"key\">8 h</span> · Regular meal"], [3, "l", 30, "Ch 38 · Core Principles of Perioperative Management in Children", "4 · Anaesthesia considerations", "<b>Postoperative apnoea</b> (peaks 12–23 h) → 23-h cardiorespiratory monitoring if postconceptional age <span class=\"key\">&lt; 50–60 weeks</span> (ex-preterm) or <span class=\"key\">&lt; 44 weeks</span> (term); defer elective surgery beyond these."], [3, "l", 30, "Ch 38 · Core P
