renal development and prenatal imaging", "The metanephric kidney appears at <span class=\"key\">day 28</span>; urine production starts at <span class=\"key\">14 weeks</span>. After <span class=\"key\">~16 weeks</span> amniotic fluid is mainly urine, so obstruction causes oligohydramnios and pulmonary hypoplasia."], [3, "l", 11, "Ch 34 · Perinatal Urology", "1 · Fetal renal development and prenatal imaging", "Amniotic fluid index (AFI), the sum of four largest pockets: normal 8–18 cm; oligohydramnios <span class=\"key\">&lt;5–6 cm</span>."], [3, "p", 11, "Ch 34 · Perinatal Urology", "1 · Fetal renal development and prenatal imaging", "Prenatal detection is for triage and counselling (differential, postnatal plan, natural history); there is no proof it improves outcome."], [3, "l", 11, "Ch 34 · Perinatal Urology", "2 · Grading systems", "Pyramidal thickness <span class=\"key\">≤3 mm</span> predicts pyeloplasty and reduced function."], [3, "a", 12, "Ch 34 · Perinatal Urology", "3 · Prenatal follow-up", "<ol>\n<li>Normal APD ceiling, all else normal: <span class=\"key\">&lt;4 mm (16–27 weeks) → &lt;7 mm (≥28 weeks) → &lt;10 mm (postnatal &gt;48 h)</span>.</li>\n<li>If A1 (APD 4 to &lt;7 mm at 16–27 wk, or 7 to &lt;10 mm at ≥28 wk, all else normal), repeat US once after 32 weeks.</li>\n<li>If A2–3 (any abnormal parameter), scan every 4 weeks until delivery, because the lesion may progress and a second anomaly is likelier.</li>\n<li>In both, do a postnatal US after 48 h.</li>\n</ol>"], [3, "l", 12, "Ch 34 · Perinatal Urology", "4 · Fetal LUTO and oligohydramnios", "Poor prognosis: oligohydramnios <span class=\"key\">before 27 weeks</span>, cortical cysts, echogenicity. Onset after 27 weeks favours the lungs."], [3, "l", 12, "Ch 34 · Perinatal Urology", "4 · Fetal LUTO and oligohydramnios", "Options: early delivery, vesicoamniotic shunt (VAS), fetal cystoscopy, serial amnioinfusion. Window <span class=\"key\">18–24 weeks</span>; about 1 in 60,000 need it."], [3, "l", 12, "Ch 34 · Perinatal Urology", "4 · Fetal LUTO and oligohydramnios", "Complications about <span class=\"key\">44%</span>: shunt failure (commonest), preterm labour, membrane rupture, ascites, chorioamnionitis, bowel herniation."], [3, "p", 13, "Ch 34 · Perinatal Urology", "4 · Fetal LUTO and oligohydramnios", "Counsel: intervention improves perinatal survival (lungs); complications exceed 40%; it does not reliably prevent renal replacement, because dysplasia is often established first."], [3, "l", 13, "Ch 34 · Perinatal Urology", "5 · Postnatal imaging", "<b>Mercaptoacetyltriglycine (MAG3)</b> is preferred over DTPA (\"well-tempered\" protocol). Consider surgery if <span class=\"key\">DRF &lt;40%</span>, half-time (T½) &gt;20 min, or retention persists upright."], [3, "l", 14, "Ch 34 · Perinatal Urology", "6 · Postnatal management, UTI and prophylaxis", "In P3 without VUR, give CAP until pyeloplasty or <span class=\"key\">1 year</span> (about 90% of UTIs occur in year 1)."], [3, "l", 14, "Ch 34 · Perinatal Urology", "6 · Postnatal management, UTI and prophylaxis", "Circumcision has a number needed to treat (NNT) of <span class=\"key\">10</span>; odds ratio about 0.3."], [3, "l", 14, "Ch 34 · Perinatal Urology", "6 · Postnatal management, UTI and prophylaxis", "Agents: amoxicillin or a first-generation cephalosporin from birth; nitrofurantoin or trimethoprim only from <span class=\"key\">≥8 weeks</span>, because hepatic metabolism is immature."], [3, "a", 14, "Ch 34 · Perinatal Urology", "6 · Postnatal management, UTI and prophylaxis", "<ol>\n<li>US after 48 h: if normal (&lt;10 mm, all else normal), the dilation was transient.</li>\n<li>If P1, repeat US at 3–6 months.</li>\n<li>If P2, give CAP if the ureter is &gt;7 mm; VCUG and MAG3 at discretion.</li>\n<li>If P3, give CAP, do a VCUG and repeat US at about 1 month; if dilation persists, do a MAG3.</li>\n<li>If bilateral severe dilation (with or without oligohydramnios), treat as outlet obstruction: decompress, CAP, urgent evaluation.</li>\n</ol>"], [3, "l", 14, "Ch 34 · Perinatal Urology", "7 · Specific antenatal diagnoses", "Commonest <b>surgical</b> cause. Third-trimester APD <span class=\"key\">15 mm</span> has about 80% sensitivity and specificity for pyeloplasty; postnatal APD predicts better. Even with severe UTD, about a fifth need surgery."], [3, "l", 14, "Ch 34 · Perinatal Urology", "7 · Specific antenatal diagnoses", "Most resolve. Surgery is predicted by a ureter <span class=\"key\">&gt;13 mm</span> and DRF &lt;30%."], [3, "l", 15, "Ch 34 · Perinatal Urology", "7 · Specific antenatal diagnoses", "BAPU: prenatal ureter <span class=\"key\">&gt;7 mm after 30 weeks</span> needs postnatal US, CAP and VCUG for all; consider MAG3."], [3, "p", 15, "Ch 34 · Perinatal Urology", "7 · Specific antenatal diagnoses", "In PUJ, VUR and megaureter, dilation alone is not an indication: operate for function loss, infection or progression; grade sets surveillance."], [3, "p", 15, "Ch 34 · Perinatal Urology", "7 · Specific antenatal diagnoses", "Bilateral dilation with normal fluid means urine still leaves the fetus (reflux, megacystis); with low fluid it means true outlet obstruction."], [3, "a", 15, "Ch 34 · Perinatal Urology", "7 · Specific antenatal diagnoses", "<ol>\n<li>Have the team at delivery and resuscitate the lungs first.</li>\n<li>Pass a 5 Fr feeding tube, with a finger in the rectum to guide it over the high bladder neck.</li>\n<li>Confirm position on a plain abdominal film (KUB).</li>\n<li>If it fails, place a US-guided suprapubic catheter.</li>\n</ol>"], [3, "l", 16, "Ch 34 · Perinatal Urology", "7 · Specific antenatal diagnoses", "<b>Congenital adrenal hyperplasia (CAH)</b>: 21-hydroxylase (6p), autosomal recessive; 75% are salt-wasting. Only <span class=\"key\">1 in 8</span> at-risk pregnancies is an affected girl, so prenatal treatment is controversial. Check electrolytes first, then 17-hydroxyprogesterone (17-OHP) and genetics."], [3, "l", 17, "Ch 34 · Perinatal Urology", "8 · Neonatal urological emergencies", "Anorectal malformation has genitourinary or spinal anomalies in up to <span class=\"key\">75%</span>: renal and spinal US; CAP until videourodynamics at 6 weeks."], [3, "p", 19, "Ch 35 · Urologic Evaluation of the Child", "1 · Triage by acuity", "Context shifts the tier: a hernia is emergent if incarcerated but semiurgent if reducible; hydronephrosis is urgent if bilateral or in a solitary kidney."], [3, "l", 19, "Ch 35 · Urologic Evaluation of the Child", "3 · Examination", "Minimum systolic blood pressure (BP): <span class=\"key\">≥60</span> neonate; ≥70 at 1 month–1 year; <span class=\"key\">70 + 2×age</span> at 1–10 years; ≥90 above 10 years."], [3, "l", 20, "Ch 35 · Urologic Evaluation of the Child", "3 · Examination", "<b>Micropenis</b>: stretched length below mean − 2.5 standard deviations (SD), <span class=\"key\">1.9 cm</span> at term and 9.3 cm in adults. It barely changes at 5–11 years; preterms need gestation-specific values."], [3, "l", 20, "Ch 35 · Urologic Evaluation of the Child", "4 · Urine and blood tests", "American Academy of Pediatrics (AAP) UTI: pyuria and/or bacteriuria with <span class=\"key\">≥50,000 colony-forming units (CFU)/mL</span> (catheter or aspirate) in a symptomatic child."], [3, "r", 20, "Ch 35 · Urologic Evaluation of the Child", "4 · Urine and blood tests", "Microscopic haematuria · <span class=\"key\">&gt;5 red cells (RBC)/high-power field</span> (adult ≥3), on &gt;2 occasions"], [3, "r", 21, "Ch 35 · Urologic Evaluation of the Child", "6 · Emergent presentations", "Absent cremasteric reflex; nausea or vomiting; high-riding testis · 1 each · <span class=\"key\">≥6</span>: explore without US"], [3, "l", 21, "Ch 35 · Urologic Evaluation of the Child", "6 · Emergent presentations", "<b>Ambiguous genitalia</b>: exclude <b>salt-wasting congenital adrenal hyperplasia (CAH)</b> (21-hydroxylase in about 95%). Crisis comes on day <span class=\"key\">4–15</span>, so no early discharge. Check <b>17-hydroxyprogesterone (17-OHP) and electrolytes</b>."], [3, "l", 21, "Ch 35 · Urologic Evaluation of the Child", "6 · Emergent presentations", "<b>Retention</b>: expected capacity (mL) = <span class=\"key\">(age + 2) × 30</span>. Try analgesia, sitz bath and disimpaction before a catheter; if no cause, evaluate neurologically."], [3, "l", 21, "Ch 35 · Urologic Evaluation of the Child", "7 · Common referral presentations", "Scan <b>before discharge</b> if bilateral, solitary kidney or suspected outlet obstruction (third-trimester anteroposterior diameter &gt;7 mm or urinary tract dilation A2–3); otherwise after <span class=\"key\">48 h</span>. Creatinine is maternal for 48 h, so follow the trend."], [3, "l", 22, "Ch 35 · Urologic Evaluation of the Child", "7 · Common referral presentations", "<b>Varicocele</b> (about 15% of adolescents): Lambert volume L×W×H×<span class=\"key\">0.71</span>. If non-decompressing supine or right-sided, do a retroperitoneal US."], [3, "p", 22, "Ch 35 · Urologic Evaluation of the Child", "7 · Common referral presentations", "Red flags: absent cremasteric reflex with acute pain; ambiguous genitalia with impalpable gonads; bilateral hydronephrosis in a boy; fever with obstruction; hypotension; abdominal mass; meatal blood; lumbosacral lipoma or deviated cleft."], [3, "p", 23, "Ch 36 · Pediatric Urogenital Imaging", "1 · Principles — ALARA and the three harms", "Every choice trades <b>radiation, sedation and contrast</b> against yield; the long lifespan tips it towards US, and the question is which test fills US's functional gap (obstruction, reflux, pyelonephritis) most cheaply."], [3, "l", 23, "Ch 36 · Pediatric Urogenital Imaging", "2 · Ultrasonography", "Fetal urine is made from <span class=\"key\">10–12 weeks</span>; by <span class=\"key\">20 weeks</span> US detects most anomalies. Check cord insertion and abdominal wall (exstrophy)."], [3, "l", 24, "Ch 36 · Pediatric Urogenital Imaging", "2 · Ultrasonography", "Sulfur hexafluoride microbubbles grade VUR on five grades with <b>no radiation</b>. Area under curve <span class=\"key\">0.97</span>, sensitivity ~92%, specificity ~91–94%, so it is recommended for VUR."], [3, "l", 25, "Ch 36 · Pediatric Urogenital Imaging", "3 · Voiding cystourethrography", "<b>Trauma</b>: with meatal blood, do a <b>retrograde urethrogram (RUG) before any catheter</b>, then gravity fill. Capacity (mL) = <span class=\"key\">(age + 2) × 30</span>, max 400. A \"pie-in-the-sky\" bladder means pelvic fracture with extraperitoneal injury."], [3, "r", 25, "Ch 36 · Pediatric Urogenital Imaging", "4 · Nuclear medicine", "Timing · Within days; resolves over ~5 months · Lesion at <span class=\"key\">≥6 months</span> = scar"], [3, "l", 25, "Ch 36 · Pediatric Urogenital Imaging", "4 · Nuclear medicine", "Give furosemide <span class=\"key\">1 mg/kg IV</span> at maximal filling; if too early, drainage is measured before the system is full. <span class=\"dag\">†</span>DTPA is noisier in the immature neonatal kidney."], [3, "l", 25, "Ch 36 · Pediatric Urogenital Imaging", "5 · MR urography", "Protocol: hydration and catheter, then <span class=\"key\">furosemide 1 mg/kg (max 20 mg)</span>, T2, gadolinium and dynamic T1; function by <b>Patlak</b> analysis."], [3, "l", 27, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "1 · Overview and the paradigm shift", "Urinary tract infection (UTI) affects ~<span class=\"key\">1% of boys, 3–5% of girls</span>, and 30–50% recur. It is the commonest bacterial infection in febrile children (~7% of febrile infants)."], [3, "p", 27, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "2 · Pathogenesis and virulence", "IBCs and biofilms shield bacteria from neutrophils and antibiotics; a biofilm survives 1000–1500× normal killing concentrations (poor penetration, slow growth, altered targets)."], [3, "l", 28, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "3 · Host risk factors", "<b>Circumcision</b> lowers UTI in the first 6 months <span class=\"key\">~10-fold</span>. US Army cohort: 0.11%, uncircumcised 1.12% and girls 0.57% <span class=\"tag\">MCQ</span>. Number needed to circumcise: <span class=\"key\">111</span> normal boys, 11 with recurrent UTI and <span class=\"key\">4</span> with high-grade VUR. It protects in antenatal hydronephrosis."], [3, "l", 28, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "3 · Host risk factors", "<b>VUR</b> is found in 1–2% of newborns and <span class=\"key\">25–40%</span> after a first UTI. Most pyelonephritis occurs without VUR, but grade III–IV doubles pyelonephritic change <span class=\"xref\">(see Ch 41)</span>."], [3, "p", 28, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "3 · Host risk factors", "Host factors either raise inoculum/dwell time (prepuce, faecal flora, stasis, constipation, catheter) or lower defence (immature immunity, receptor-bearing blood groups); prevention reverses whichever applies."], [3, "l", 28, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "4 · Classification", "Febrile UTI is presumed pyelonephritis; afebrile UTI is cystitis. Localisation is poor: only <span class=\"key\">50–66%</span> of febrile children show acute changes on dimercaptosuccinic acid (DMSA) scan, the gold standard."], [3, "l", 28, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "4 · Classification", "Kass definition: two cultures of <span class=\"key\">≥10<sup>5</sup> colony-forming units (CFU)/mL</span> of the same organism, without symptoms."], [3, "l", 29, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "5 · Diagnosis", "Pyuria is less with Klebsiella and Enterococcus, so culture anyway. UTI without pyuria is rare, which separates it from ASB. A threshold of <span class=\"key\">≥10 WBC/HPF</span> works better under 2 years."], [3, "r", 29, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "5 · Diagnosis", "AAP 2011 (2–24 months) · Catheter/SPA · <span class=\"key\">≥50,000 + pyuria</span>"], [3, "l", 30, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "6 · Imaging after UTI", "DMSA (~1 mSv) shows APN best within <b>1 week</b>; a defect at <span class=\"key\">≥6 months</span> is a scar. About 15% of acute lesions scar, and a scar cannot be told from dysplasia. Computed tomography (CT, 10–15 mSv) is only for occult stones or mass vs inflammation."], [3, "l", 30, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "6 · Imaging after UTI", "<b>NICE \"atypical\" UTI</b> means seriously ill, poor urine flow, abdominal or bladder mass, raised creatinine, septicaemia, no response within <span class=\"key\">48 h</span>, or a non-<i>E. coli</i> organism. Late DMSA is at 4–6 months."], [3, "r", 31, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "7 · Treatment", "Febrile UTI · <span class=\"key\">7–14 days</span> (shorter is inferior)"], [3, "r", 31, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "7 · Treatment", "Afebrile cystitis · <span class=\"key\">2–4 days</span> (beats single dose; equals 7–14 days)"], [3, "l", 32, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "8 · Renal scarring and sequelae", "Childhood UTI causes <span class=\"key\">&lt;1% of CKD</span>, and end-stage kidney disease (ESKD) follows in ~1 in 10,000. Scars lead to hypertension and pre-eclampsia."], [3, "l", 32, "Ch 37 · Infection and Inflammation of the Paediatric Genitourinary Tract", "9 · Prevention and prophylaxis", "Recurrence is <span class=\"key\">10–30%</span>, highest in the first 3–6 months; in girls up to 40%."], [3, "l", 34, "Ch 38 · Core Principles of Perioperative Management in Children", "2 · Preoperative assessment", "<b>Investigations are indication-driven</b>: no routine bloods, chest X-ray or ECG, and a murmur alone is not an ECG indication. Check urine human chorionic gonadotrophin (hCG) in females of menstrual age; <span class=\"tag\">MCQ</span> it can be falsely positive after augmentation cystoplasty."], [3, "l", 34, "Ch 38 · Core Principles of Perioperative Management in Children", "2 · Preoperative assessment", "<b>URTI</b> leaves the airway hyperreactive for <span class=\"key\">6–8 weeks</span>, which risks laryngospasm, bronchospasm and desaturation. A laryngeal mask is safer than an endotracheal tube. Postpone elective surgery ≥ 4, ideally 6 weeks."], [3, "l", 34, "Ch 38 · Core Principles of Perioperative Management in Children", "2 · Preoperative assessment", "<b>Sepsis</b>: give antibiotics within <span class=\"key\">1 h</span> of septic shock and avoid neuraxial blocks. <b>Trauma</b>: assume a full stomach and use rapid-sequence induction."], [3, "r", 34, "Ch 38 · Core Principles of Perioperative Management in Children", "3 · Fasting (NPO, nil by mouth)", "<span class=\"key\">2 h</span> · Clear liquids, carbohydrate drinks (European and Canadian 2022: 1 h)"], [3, "r", 34, "Ch 38 · Core Principles of Perioperative Management in Children", "3 · Fasting (NPO, nil by mouth)", "<span class=\"key\">4 h</span> · Breast milk"], [3, "r", 34, "Ch 38 · Core Principles of Perioperative Management in Children", "3 · Fasting (NPO, nil by mouth)", "<span class=\"key\">6 h</span> · Infant formula, non-human milk, light meal, tube feeds"], [3, "r", 34, "Ch 38 · Core Principles of Perioperative Management in Children", "3 · Fasting (NPO, nil by mouth)", "<span class=\"key\">8 h</span> · Regular meal"], [3, "l", 35, "Ch 38 · Core Principles of Perioperative Management in Children", "4 · Anaesthesia considerations", "<b>Postoperative apnoea</b> peaks at 12–23 h, so give 23-h cardiorespiratory monitoring if postconceptional age is <span class=\"key\">&lt; 50–60 weeks</span> (ex-preterm) or <span class=\"key\">&lt; 44 weeks</span> (term). Defer elective surgery beyond these."], [3, "l", 35, "Ch 38 · Core Principles of Perioperative Management in Children", "4 · Anaesthesia considerations", "The Food and Drug Administration (FDA) warning (2016) says repeated or lengthy (<span class=\"key\">&gt; 3 h</span>) anaesthesia at <span class=\"key\">&lt; 3 years</span> or in third-trimester pregnancy may affect brain development. This rests on animal neuroapoptosis."], [3, "l", 35, "Ch 38 · Core Principles of Perioperative Management in Children", "4 · Anaesthesia considerations", "<b>Autonomic dysreflexia</b> (lesion at or above <span class=\"key\">T6</span>): bladder distension or another noxious stimulus causes severe hypertension and bradycardia, risking stroke. <span class=\"dag\">†</span>Stop the stimulus, drain the bladder, sit the child up and give a rapid antihypertensive."], [3, "l", 36, "Ch 38 · Core Principles of Perioperative Management in Children", "5 · Fluid and electrolyte management", "<b>Holliday–Segar 4-2-1 rule</b>: <span class=\"key\">4 mL/kg/h</span> for the first 10 kg, plus <span class=\"key\">2 mL/kg/h</span> for the next 10 kg, plus <span class=\"key\">1 mL/kg/h</span> per kg above 20. For 22 kg: 40 + 20 + 2 = 62 mL/h."], [3, "p", 36, "Ch 38 · Core Principles of Perioperative Management in Children", "5 · Fluid and electrolyte management", "<b>Why isotonic?</b> Surgical stress, pain, nausea and hypoxia trigger non-osmotic antidiuretic hormone (ADH) release, which retains water through aquaporin-2. Hypotonic fluid adds free water and causes hyponatraemia (&lt; 135 mmol/L). <span class=\"dag\">†</span>A child's large brain-to-skull ratio leaves little room for cerebral oedema, so encephalopathy can be fatal."], [3, "l", 36, "Ch 38 · Core Principles of Perioperative Management in Children", "6 · Blood loss and transfusion †", "Transfuse at haemoglobin <span class=\"key\">&lt; 7 g/dL</span> in stable children (higher in neonates, cyanotic heart disease and active bleeding). 10–15 mL/kg raises haemoglobin by ≈ 2–3 g/dL."], [3, "l", 36, "Ch 38 · Core Principles of Perioperative Management in Children", "8 · Antibiotic prophylaxis and intraoperative crises", "<b>Timing</b>: give within <span class=\"key\">60 min</span> of incision; vancomycin and fluoroquinolones within <span class=\"key\">120 min</span>."], [3, "l", 36, "Ch 38 · Core Principles of Perioperative Management in Children", "8 · Antibiotic prophylaxis and intraoperative crises", "Doses: cefazolin <span class=\"key\">30 mg/kg</span> (redose at 4 h); ampicillin 50 mg/kg (redose at 2 h); gentamicin 2.5 mg/kg, vancomycin 15 mg/kg, metronidazole 15 mg/kg and ciprofloxacin 10 mg/kg (not redosed)."], [3, "l", 39, "Ch 39 · Principles of Laparoscopic and Robotic Surgery in Children", "1 · Evolution and indications", "The first paediatric urological laparoscopy was for non-palpable testis in <span class=\"key\">1976</span>. Intracorporeal suturing was the bottleneck; the wristed robot removed it, so <b>reconstruction</b> grew (pyeloplasty commonest; reimplantation, (hemi)nephrectomy, intra-abdominal testis, urachal/diverticulum excision; deep pelvis: utricle, urogenital sinus, bladder neck)."], [3, "r", 39, "Ch 39 · Principles of Laparoscopic and Robotic Surgery in Children", "2 · Physiology of pneumoperitoneum", "Maximum IAP · <span class=\"key\">≤ 6</span> · <span class=\"key\">≤ 8</span> · <span class=\"key\">≤ 10</span> · <span class=\"key\">≤ 12 mm Hg</span>"], [3, "l", 41, "Ch 39 · Principles of Laparoscopic and Robotic Surgery in Children", "6 · Robotics in children", "<b>Working space</b> is ≈ <span class=\"key\">1 L at 1 year vs 6 L in adults</span>, so arms collide. Aids: wide port spacing, linear placement, \"burping\" ports, minimal inhalational agent, enema and rectal tube."], [3, "l", 41, "Ch 39 · Principles of Laparoscopic and Robotic Surgery in Children", "6 · Robotics in children", "<b>Limitations</b>: no 5-mm robotic ports; single-port needs a 25-mm cannula and ≈ <span class=\"key\">10 cm</span> to target, prohibitive in small children; no haptics; cost; training."], [3, "p", 41, "Ch 39 · Principles of Laparoscopic and Robotic Surgery in Children", "7 · Complications", "<b>Ergonomics</b>: laparoscopy strains hands, thumb and shoulders, so set the table at 70–80% elbow height and the monitor at eye level. Robot offloads the arm but fixes the neck; use the clutch to keep elbows on the armrest."], [3, "l", 42, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "1 · Principles and terminology", "<b>Expected bladder capacity (EBC)</b>: infant ≤1 y = <span class=\"key\">weight (kg) × 7 mL</span>; older child = <span class=\"key\">(age in years + 2) × 30 mL</span>. Small is &lt;65% EBC; large is &gt;150% (some use &gt;130%)."], [3, "l", 42, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "2 · History", "<b>Secondary enuresis</b> is wetting after <span class=\"key\">≥6 months</span> dry, so look for stressors."], [3, "a", 42, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "2 · History", "<p><b>Bowel and bladder dysfunction (BBD)</b></p><ol>\n<li>Apply Rome IV; obtain a 7-day diary, urinalysis and pelvic ultrasound (US).</li>\n<li><b>Treat the bowel first.</b></li>\n<li>If LUTS persist, then do uroflow with electromyography (EMG) and start urotherapy.</li>\n<li>If that fails, add an anticholinergic, then a β3-agonist; then botulinum toxin, biofeedback or neuromodulation.</li>\n</ol>"], [3, "l", 43, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "5 · Non-invasive urodynamics", "Uroflow is valid only if toilet-trained, voiding <span class=\"key\">≥50% EBC</span> (a pattern needs about 50–100 mL), with &gt;1 curve; it shows emptying only."], [3, "p", 43, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "5 · Non-invasive urodynamics", "The curve reflects detrusor against outlet. Too much detrusor gives a tower; too much outlet gives a plateau; intermittent outlet activity gives staccato; intermittent detrusor effort gives an interrupted curve. Patch EMG tells which side is at fault."], [3, "l", 43, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "5 · Non-invasive urodynamics", "<b>Pelvic US</b>: bladder wall is abnormal if <span class=\"key\">&gt;3 mm full / &gt;5 mm empty</span>. A rectal diameter <span class=\"key\">&gt;30 mm</span> without urge means faecal loading."], [3, "l", 44, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "5 · Non-invasive urodynamics", "<b>PVR</b> varies, so repeat it. It is abnormal at 4–6 y if <span class=\"key\">&gt;30 mL or &gt;21%</span> of capacity and at 7–12 y if <span class=\"key\">&gt;20 mL or &gt;15%</span>; repeated &gt;20 mL is abnormal."], [3, "l", 44, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "6 · Invasive urodynamics", "Routine culture or prophylaxis is not needed, because post-study UTI is about <span class=\"key\">1.4%</span>."], [3, "l", 44, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "6 · Invasive urodynamics", "<b>Stop filling</b> at strong urge, discomfort, voiding, leak greater than fill rate, detrusor pressure (Pdet) persistently <span class=\"key\">&gt;40 cmH₂O</span>, or volume <span class=\"key\">&gt;150% EBC</span>."], [3, "l", 44, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "6 · Invasive urodynamics", "<b>Compliance = ΔV/ΔPdet</b>, calculated every study: <span class=\"key\">&gt;20 normal; 10–20 moderately; &lt;10 severely impaired</span>. In small contracted bladders absolute Pdet (&lt;30–40) is the better guide; an <b>early</b> rise means most of the day at high pressure."], [3, "l", 44, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "6 · Invasive urodynamics", "A DLPP <span class=\"key\">&gt;40 cmH₂O</span> (or no leak at high pressure) signals danger; ALPP has no paediatric norms."], [3, "p", 45, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "6 · Invasive urodynamics", "<b>McGuire (1981)</b>, myelodysplasia: with leak pressure &gt;40 cmH₂O, hydronephrosis or secondary VUR developed in <span class=\"key\">85%</span>, because pressure is transmitted up the ureters. Aim for the lowest achievable pressure."], [3, "l", 45, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "6 · Invasive urodynamics", "Normal Pdet at Qmax is about 66 cmH₂O in boys and 57 in girls; infant boys reach 118, which is physiological <span class=\"tag\">MCQ</span>."], [3, "p", 45, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "6 · Invasive urodynamics", "<b>Upper-tract threats</b>: compliance &lt;20 (especially &lt;10); DLPP &gt;40 cmH₂O; sustained high filling Pdet; DSD with poor emptying; high voiding pressure with poor flow. Interobserver agreement is poor."], [3, "r", 45, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "7 · Evaluation in specific conditions", "Spinal dysraphism · UMPIRE risk by DLPP/end-fill Pdet: <span class=\"key\">&lt;25 low; 25–39 or DO intermediate; ≥40 high</span> · Baseline, serial, pre-surgery"], [3, "p", 46, "Ch 40 · Clinical and Urodynamic Evaluation of Lower Urinary Tract Dysfunction in Children", "7 · Evaluation in specific conditions", "UMPIRE dropped DSD from high risk because reviewers disagreed on who had it, not because DSD is benign. Neurogenic bladder goals: normal capacity, low storage pressure, complete emptying, upper-tract protection."], [3, "l", 47, "Ch 42 · Bladder Anomalies in Children", "2 · Fetal bladder on ultrasound", "The wall is ≤3 mm, and the bladder is seen in nearly all fetuses by 13 weeks. It empties every <span class=\"key\">15–20 min</span>, so if unseen, <b>repeat in the same sitting</b>. Amniotic fluid is mainly fetal urine after <span class=\"key\">16 weeks</span>."], [3, "r", 47, "Ch 42 · Bladder Anomalies in Children", "3 · Megacystis", "10–14 weeks · Length ≤6 mm; &lt;10% of crown–rump length (CRL) · <span class=\"key\">≥8 mm</span>; ≥13% of CRL"], [3, "l", 48, "Ch 42 · Bladder Anomalies in Children", "3 · Megacystis", "In euploid fetuses, 7–15 mm mostly resolves, while <span class=\"key\">&gt;15 mm</span> never does (all obstructive). Resolution before 23 weeks means no postnatal surgery; later, most need intervention. <b>Persistent megacystis with oligohydramnios means LUTO.</b>"], [3, "p", 48, "Ch 42 · Bladder Anomalies in Children", "3 · Megacystis", "A female fetus with megacystis cannot have PUV, so think of MMIHS, cloacal anomaly or urethral atresia."], [3, "a", 48, "Ch 42 · Bladder Anomalies in Children", "4 · Bladder duplication", "<ol><li>Early: relieve obstruction and prevent infection.</li><li>Later, if both sphincters are competent, then join the distal urethras.</li><li>If one is incompetent, then close that bladder neck and excise its urethra.</li><li>Join duplicated vaginas, with vulvoplasty.</li></ol>"], [3, "a", 49, "Ch 42 · Bladder Anomalies in Children", "6 · Urachal anomalies", "<ol><li>If infected, drain and give antibiotics first.</li><li>Infraumbilical incision; circumscribe the tract at the umbilicus, preserving it.</li><li>Dissect extraperitoneally to the dome and excise with a <b>bladder cuff</b>.</li><li>Two-layer closure; catheter overnight.</li></ol>"], [3, "r", 49, "Ch 42 · Bladder Anomalies in Children", "7 · Acquired lesions", "Nephrogenic adenoma · Female 5:1; after infection, stones, surgery, augmentation · Transurethral resection; <span class=\"key\">80% recur</span>, so surveillance cystoscopy"], [3, "p", 51, "Ch 43 · Exstrophy–Epispadias Complex", "3 · Variants", "Superior vesical fissure inflated the belief that variants do better. All others need formal closure and follow-up like CBE."], [3, "a", 52, "Ch 43 · Exstrophy–Epispadias Complex", "5 · Newborn care and selection", "<ol>\n<li>Tie the cord with 2-0 silk (no clamp, which traumatises mucosa).</li>\n<li>Cover the plate with non-adherent plastic wrap; irrigate with saline at each nappy change.</li>\n<li>Assess heart and lungs; obtain a renal ultrasound (US).</li>\n<li>Transfer to an exstrophy centre for multidisciplinary team (MDT) counselling.</li>\n</ol>"], [3, "l", 52, "Ch 43 · Exstrophy–Epispadias Complex", "5 · Newborn care and selection", "<b>Assess</b> the template (≥<span class=\"key\">3 × 3 cm</span> is suitable), the diastasis and pelvic malleability under anaesthesia, the urethral plate and penile length. A plate that <b>bulges on crying or indents under anaesthesia</b> is adequate."], [3, "p", 52, "Ch 43 · Exstrophy–Epispadias Complex", "6 · Surgical philosophies", "Erlangen, Kelly and CPRE claim to avoid BNR, yet almost all still need an outlet procedure. Compressing the reconstruction adds ischaemic and outlet risk without removing that need."], [3, "a", 53, "Ch 43 · Exstrophy–Epispadias Complex", "7 · Primary closure (MSRE stage 1)", "<ol>\n<li>General anaesthesia with <b>epidural</b> (catheter to T10–T12).</li>\n<li>Outline a 2-cm mucosal strip from the trigone to mid-shaft (boy) or vaginal orifice (girl); incise the bladder–skin junction.</li>\n<li>Free the bladder from the rectus and strip peritoneum off the dome.</li>\n<li><b>Divide the urogenital diaphragm fibres sharply down to the levator hiatus</b>; free the corpora from the rami.</li>\n<li>Close bladder, neck and posterior urethra; <b>taper over a 12-Fr sound</b>.</li>\n<li>Place a suprapubic Malecot (4 weeks) and ureteric stents; leave the <b>urethra unstented</b>.</li>\n<li>Close the pubis with a <b>No. 2 nylon horizontal mattress</b> suture, knot away from the neourethra; fashion a neoumbilicus.</li>\n</ol>"], [3, "l", 53, "Ch 43 · Exstrophy–Epispadias Complex", "8 · Osteotomy and immobilisation", "Osteotomise if closure is <span class=\"key\">&gt;72 h</span> after birth, diastasis is <span class=\"key\">&gt;4 cm</span>, the pelvis is stiff, the template is large, after <b>failed closure</b>, and in <b>cloacal exstrophy</b>. Diastasis &gt;6 cm needs staged closure with a fixator."], [3, "r", 53, "Ch 43 · Exstrophy–Epispadias Complex", "8 · Osteotomy and immobilisation", "Spica cast · 47% · 30% · <span class=\"key\">66%</span>"], [3, "r", 53, "Ch 43 · Exstrophy–Epispadias Complex", "8 · Osteotomy and immobilisation", "External fixation with traction · <span class=\"key\">7.5%</span> · 8% · — (few)"], [3, "l", 54, "Ch 43 · Exstrophy–Epispadias Complex", "9 · After primary closure", "If capacity is <span class=\"key\">&lt;30 mL at 1–2 years</span>, a continence procedure may not be feasible."], [3, "l", 55, "Ch 43 · Exstrophy–Epispadias Complex", "11 · Bladder neck reconstruction (stage 3)", "<b>Prerequisites</b>: capacity <span class=\"key\">≥100 mL</span> (under anaesthesia), stable urodynamics, a motivated child (5–7 years), a voiding programme for ≥6 months and a psychology review. Reimplant earlier for pyelonephritis, worsening hydronephrosis or falling function."], [3, "a", 55, "Ch 43 · Exstrophy–Epispadias Complex", "11 · Bladder neck reconstruction (stage 3)", "<p><b>Modified YDL</b></p><ol>\n<li>Open the bladder neck transversely.</li>\n<li>Perform <b>Cohen cross-trigonal reimplantation</b>.</li>\n<li>Outline a posterior mucosal strip <span class=\"key\">15 × 30 mm</span>; denude the lateral muscle triangles (no cephalad transverse cut).</li>\n<li>Tubularise the strip and <b>double-breast the muscle flaps</b> over it.</li>\n<li>Suspend to the rectus fascia; suprapubic tube for 3 weeks, then clamp trials.</li>\n</ol>"], [3, "l", 55, "Ch 43 · Exstrophy–Epispadias Complex", "11 · Bladder neck reconstruction (stage 3)", "After MSRE, ~<span class=\"key\">70–75%</span> are dry by day (intervals &gt;3 h); CPRE with YDL is lowest (~56%)."], [3, "a", 57, "Ch 43 · Exstrophy–Epispadias Complex", "15 · Epispadias", "<p><b>Female repair (6–12 months)</b></p><ol>\n<li>Incise vertically through the urethral wall at 9 and 3 o'clock.</li>\n<li>Excise the urethral roof (dorsal wedge taper) and close over a 10-Fr Foley.</li>\n<li>Unite the clitoral halves and labia minora; bring mons fat over the suture line.</li>\n<li>Catheter 5–7 days; BNR at 4–5 years.</li>\n</ol>"], [3, "l", 57, "Ch 43 · Exstrophy–Epispadias Complex", "15 · Epispadias", "Female continence after BNR is ~<span class=\"key\">87%</span>, as good as in CBE girls. Epispadias outperforms exstrophy because the bladder was never exposed."], [3, "r", 58, "Ch 43 · Exstrophy–Epispadias Complex", "16 · Cloacal exstrophy", "Spinal defects · Uncommon · <span class=\"key\">85–100%</span> (lipomeningocele commonest)"], [3, "a", 58, "Ch 43 · Exstrophy–Epispadias Complex", "16 · Cloacal exstrophy", "<ol>\n<li>Stage 1 (newborn): close the omphalocele, separate the caecal plate, join the hemibladders and form a colostomy.</li>\n<li>Stage 2: bladder closure with <b>combined osteotomy</b> and fixation for 6–8 weeks.</li>\n<li>At 5–7 years: YDL only if capacity &gt;100 mL (rare); usually augmentation with a continent stoma.</li>\n</ol>"], [3, "l", 59, "Ch 44 · Prune-Belly Syndrome", "1 · Definition and aetiology", "The <b>triad</b> (Eagle–Barrett) is deficient abdominal wall muscle, bilateral intra-abdominal testes and a dilated urinary tract. Incidence is ~<span class=\"key\">1 in 29,000–44,000</span> (similar to exstrophy) and <span class=\"key\">95% male</span>. Commoner in twins, African ancestry and young mothers. <b>Osler</b> gave the name <span class=\"tag\">MCQ</span>."], [3, "l", 59, "Ch 44 · Prune-Belly Syndrome", "1 · Definition and aetiology", "Heredity: 1 in 23 children with prune-belly syndrome (PBS) is a twin, but most twins are discordant; chromosomal associations (Turner, trisomy 13/18, monosomy 16, Beckwith–Wiedemann) are exceptional. No inheritance pattern; multiplex families show smooth-muscle genes <b>MYOCD</b>, <b>FLNA</b> <span class=\"tag\">MCQ</span>."], [3, "p", 59, "Ch 44 · Prune-Belly Syndrome", "1 · Definition and aetiology", "Weakness of the obstruction theory: most have <b>no obstruction after birth</b>. The tract is <b>dilated, collagen-rich and largely non-obstructed</b>; this drives management."], [3, "l", 59, "Ch 44 · Prune-Belly Syndrome", "2 · Genitourinary pathology", "<b>Kidneys</b>: dysplasia in ~<span class=\"key\">50%</span>, often asymmetric, worst with outlet obstruction <b>without urachal decompression</b>. Dilation <b>does not correlate</b> with dysplasia; <b>infection, not obstruction, is the main threat</b>."], [3, "l", 59, "Ch 44 · Prune-Belly Syndrome", "2 · Genitourinary pathology", "<b>Ureters</b>: distal is worse, so the <b>proximal ureter is preserved</b> in reconstruction. Vesicoureteric reflux (VUR) occurs in ~<span class=\"key\">75%</span>; pelviureteric or vesicoureteric junction (PUJ/VUJ) obstruction is uncommon. The ureter is a <b>failed pump, not a blocked pipe</b>, causing stasis and infection."], [3, "l", 59, "Ch 44 · Prune-Belly Syndrome", "2 · Genitourinary pathology", "<b>Bladder</b>: massive, <b>thick but smooth</b> (no trabeculation), with a urachal pseudodiverticulum; the urachus is patent at birth in <span class=\"key\">25–30%</span>. Splayed trigone, lateral orifices, wide neck."], [3, "p", 60, "Ch 44 · Prune-Belly Syndrome", "3 · Extragenitourinary anomalies", "Two mechanisms: <b>oligohydramnios</b> (lung hypoplasia, limb deformity, knee dimples) and <b>absent abdominal wall pressure</b> (weak cough, atelectasis, constipation)."], [3, "l", 60, "Ch 44 · Prune-Belly Syndrome", "4 · Presentation and spectrum", "The abdominal wall is <b>not</b> a sorting criterion. <b>RUBACE</b> scores severity in survivors; renal weighs most <span class=\"tag\">MCQ</span>."], [3, "a", 61, "Ch 44 · Prune-Belly Syndrome", "5 · Evaluation", "<ol>\n<li>Team; <b>heart and lungs first</b> (chest X-ray).</li>\n<li>Creatinine and blood urea nitrogen (BUN) trend; day-1 value is maternal.</li>\n<li>Renal–bladder ultrasound (US).</li>\n<li>Prophylaxis and circumcision; then selective imaging.</li>\n</ol>"], [3, "l", 61, "Ch 44 · Prune-Belly Syndrome", "6 · Management philosophy", "Delay major reconstruction to <span class=\"key\">≥3–6 months</span> (lungs). Single-stage comprehensive surgery (reconstruction, orchidopexy, abdominoplasty, circumcision) adds no morbidity. Correct high-grade VUR."], [3, "a", 61, "Ch 44 · Prune-Belly Syndrome", "9 · Abdominoplasty", "<p><b>Monfort</b></p><ol>\n<li>Skin ellipse, umbilicus spared; incise the central plate at the lateral rectus borders.</li>\n<li>Do the genitourinary surgery.</li>\n<li>Score peritoneum over lateral muscle; suture plate edges to the scored line.</li>\n<li>Overlap lateral flaps over drains.</li>\n</ol>"], [3, "l", 62, "Ch 44 · Prune-Belly Syndrome", "10 · Long-term outcome", "Creatinine <span class=\"key\">&lt;0.7 mg/dL at 1 year</span> predicts stable function unless pyelonephritis or obstruction intervenes. Up to <span class=\"key\">30%</span> develop chronic renal failure (CRF), driven by <b>pyelonephritis, dysplasia and polyuria</b>."], [3, "p", 62, "Ch 44 · Prune-Belly Syndrome", "10 · Long-term outcome", "Long-term care is a contest against <b>stasis</b>: lowering residual urine and infection protects the kidneys, while dysplasia and polyuria set a ceiling that surgery cannot raise."], [3, "p", 64, "Ch 45 · Posterior Urethral Valves", "2 · Pathophysiology", "Every pop-off is false reassurance: normal creatinine in a growing infant hides an abnormal GFR. Follow VURD as closely as any PUV child."], [3, "l", 64, "Ch 45 · Posterior Urethral Valves", "3 · Diagnosis", "<b>US</b> first: the wall is thick if <span class=\"key\">&gt;3 mm distended / &gt;5 mm empty</span>; perirenal fluid means urinoma."], [3, "r", 65, "Ch 45 · Posterior Urethral Valves", "4 · Fetal intervention", "Sodium / chloride · <span class=\"key\">&lt;100 / &lt;90 mEq/L</span>"], [3, "r", 65, "Ch 45 · Posterior Urethral Valves", "4 · Fetal intervention", "Osmolality · <span class=\"key\">&lt;200 mOsm/L</span>"], [3, "r", 65, "Ch 45 · Posterior Urethral Valves", "4 · Fetal intervention", "β2-microglobulin · <span class=\"key\">&lt;6 mg/L</span> (most sensitive)"], [3, "l", 65, "Ch 45 · Posterior Urethral Valves", "4 · Fetal intervention", "Both carry <span class=\"key\">40–50%</span> pregnancy loss. Deliver at a neonatal surgical centre. The paediatric urologist counsels on diagnosis, alternatives and outcomes, starting lifelong care."], [3, "p", 65, "Ch 45 · Posterior Urethral Valves", "4 · Fetal intervention", "Fetal intervention can rescue the lung, not the kidney: fluid deficiency is still in progress, but dysplasia is already established."], [3, "a", 65, "Ch 45 · Posterior Urethral Valves", "5 · Neonatal presentation and initial management", "<ol>\n<li>Stabilise the airway.</li>\n<li>Pass a <b>5–7 Fr feeding tube</b>. If it curls: coudé, curved stylet, or rectal finger.</li>\n<li>Confirm on US; minimal balloon fill.</li>\n<li>Creatinine, electrolytes, fluids.</li>\n<li>US, then VCUG; antibiotic prophylaxis.</li>\n<li>Ablate when stable.</li>\n</ol>"], [3, "p", 67, "Ch 45 · Posterior Urethral Valves", "7 · VUR in PUV", "VUR in valves is a pressure gauge, not a lesion: fix the pressure, not the reading."], [3, "a", 67, "Ch 45 · Posterior Urethral Valves", "8 · Bladder dysfunction and valve bladder syndrome", "<ol>\n<li>High-pressure voiding causes fibrosis and weaker contraction.</li>\n<li>Post-void residual (PVR) rises; nephrogenic polyuria adds volume.</li>\n<li>Upper tracts store urine and refill the bladder, so it is never empty.</li>\n<li>Pressure is back-transmitted; renal function declines, causing more polyuria.</li>\n</ol>"], [3, "l", 67, "Ch 45 · Posterior Urethral Valves", "9 · Prognosis for renal function", "Lifetime end-stage renal disease (ESRD) is <span class=\"key\">20–50%</span>. Risks: age at diagnosis, dysplasia with or without VUR, <b>year-1 nadir creatinine</b>, recurrent UTI and bladder dysfunction."], [3, "r", 68, "Ch 45 · Posterior Urethral Valves", "9 · Prognosis for renal function", "&lt;0.4 / 0.4–0.69 / 0.7–0.99 / &gt;1.0 mg/dL · <span class=\"key\">0% / 2% / 27% / 100%</span>"], [3, "l", 68, "Ch 45 · Posterior Urethral Valves", "9 · Prognosis for renal function", "<span class=\"key\">0.7 mg/dL is the watershed</span>: risk leaps. The 1-year value beats the 1-month value; 30-day creatinine velocity also predicts."], [3, "l", 70, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "1 · Definition and causes", "The commonest cause is <b>neural tube defect (NTD)</b>, ≈ spina bifida (SB). Survival is ≈90% to 10 years, so <b>renal failure</b> is a leading late morbidity; <span class=\"key\">10%</span> of SB deaths are urological."], [3, "l", 70, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "2 · Myelodysplasia (NTD)", "The neural tube closes by <span class=\"key\">day 35</span>. Prenatal detection: maternal α-fetoprotein (AFP) and ultrasound (US)."], [3, "l", 70, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "2 · Myelodysplasia (NTD)", "<b>Folic acid</b> cuts NTDs 50–70%: all women of child-bearing age take <span class=\"key\">400 µg/day</span>, from ≥4 weeks before conception through the first month; women with SB take <span class=\"key\">4–5 mg/day</span>."], [3, "l", 70, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "2 · Myelodysplasia (NTD)", "Recurrence is <span class=\"key\">5%</span> after one affected child; offspring risk is 3.7% if one parent has SB (≈15% if both)."], [3, "p", 71, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "2 · Myelodysplasia (NTD)", "Management of Myelomeningocele Study (<b>MOMS</b>): prenatal repair (&lt;26 weeks) reduced death or shunt need (relative risk (RR) 0.70) and improved motor and cognitive scores at 30 months. Costs: prematurity (34 vs 37 weeks), uterine-scar thinning or dehiscence (⅓), more re-tethering. Rationale: a \"two-hit\" in-utero injury."], [3, "p", 71, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "2 · Myelodysplasia (NTD)", "Every pattern is detrusor (over/under) × outlet (competent/incompetent/dyssynergic). Dangerous: <b>overactive or poorly compliant detrusor against a closed or dyssynergic outlet</b>: storage pressure rises, causing vesicoureteric reflux (VUR) and hydroureteronephrosis. An incompetent outlet \"pops off\": the child is wet but the kidneys are safe."], [3, "a", 71, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "2 · Myelodysplasia (NTD)", "<ol>\n<li>Before discharge: renal–bladder US and post-void residual (PVR) (need for CIC?).</li>\n<li>After week 1: serum creatinine.</li>\n<li>Once stable: urodynamics, <b>safe from ≈3 months</b> (within 3 months per ICCS, SBA, EAU).</li>\n<li>Cystography: ideally videourodynamics, otherwise voiding cystourethrogram (VCUG).</li>\n<li>Optional baseline dimercaptosuccinic acid (DMSA) scan (EAU).</li>\n<li>US at 6, 12, 18 and 24 months, then yearly.</li>\n</ol>"], [3, "l", 71, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "2 · Myelodysplasia (NTD)", "UMPIRE (CDC newborn SB protocol) baseline: US normal 56%, mild hydronephrosis 40%, moderate–severe 4%; dilating VUR <span class=\"key\">7%</span>; DMSA defects ≈8%."], [3, "r", 71, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "2 · Myelodysplasia (NTD)", "<b>Hostile / high</b> · Detrusor leak point pressure (DLPP) or end-filling pressure <span class=\"key\">≥40 cmH₂O</span>; neurogenic detrusor overactivity (NDO) with DSD (DSD removed in UMPIRE revision because of poor agreement)"], [3, "p", 72, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "3 · Proactive (early) management", "Proactive won because it treats the cause (pressure, failure to empty) before the consequence (reflux, dilatation, scarring, renal failure)."], [3, "a", 72, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "4 · Management ladder", "<ol>\n<li>CIC and antimuscarinic, with or without a β3-agonist.</li>\n<li>If that fails: intradetrusor botulinum toxin.</li>\n<li>If CIC is impossible: vesicostomy as a bridge.</li>\n<li>Then augmentation, with or without a catheterisable channel and an outlet procedure <span class=\"xref\">see Ch 48</span>.</li>\n</ol>"], [3, "l", 73, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "4 · Management ladder", "Under general anaesthesia, by rigid cystoscopy, inject <span class=\"key\">≈10 U/kg (max 360 U)</span> into ≈30 sites, <b>sparing the trigone</b>; minimum age usually 2 y."], [3, "l", 74, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "8 · Other causes", "<b>Autonomic dysreflexia</b> (lesion <span class=\"key\">≥T6</span>): bladder filling triggers a sympathetic surge, with severe hypertension, stroke or seizures. Monitor blood pressure; keep α-blockers ready during urodynamics."], [3, "l", 74, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "8 · Other causes", "CP is a coordinated upper motor neuron (UMN) lesion: late continence, urgency; NDO 30–61%, DSD ≈12%, and ⅓ are normal. Upper-tract risk is <span class=\"key\">&lt;5%</span>, so do urodynamics only if conservative care fails, or for DSD symptoms or recurrent UTI."], [3, "p", 74, "Ch 46 · Neuromuscular Dysfunction of the Lower Urinary Tract in Children", "8 · Other causes", "Lesion level predicts pattern. <b>Suprapontine</b> (CP) gives coordinated overactivity and low risk. <b>Suprasacral cord</b> (SCI, myelitis, tethering) gives NDO with DSD and high risk. <b>Sacral/peripheral</b> gives underactivity. Myelodysplasia is mixed and unpredictable."], [3, "l", 76, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "1 · Normal bladder and bowel function", "In <b>infancy</b>, voiding pressures are often <span class=\"key\">&gt;100 cm H<sub>2</sub>O</span> and interrupted voiding is normal; both are gone by <span class=\"key\">~2 yr</span>. Infants arouse before voiding. Dyscoordination later is <b>dysfunction, not immaturity</b>."], [3, "p", 76, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "1 · Normal bladder and bowel function", "Bladder and bowel are one unit: they share pelvic space (\"zero-sum\" volume) and converging dorsal-root afferents (cross-organ sensitisation). A loaded rectum causes overactivity and poor emptying, so treating constipation improves lower urinary tract symptoms (LUTS). Anticholinergics for the bladder can recreate the constipation that drove the symptoms."], [3, "r", 76, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "2 · Definitions — International Children's Continence Society (ICCS)", "Storage · Increased frequency · <span class=\"key\">≥8 voids/day</span>"], [3, "r", 76, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "2 · Definitions — International Children's Continence Society (ICCS)", "Decreased frequency · <span class=\"key\">≤3 voids/day</span>"], [3, "l", 77, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "2 · Definitions — International Children's Continence Society (ICCS)", "<b>Daytime urinary incontinence (DUI)</b> is leakage while awake at age <span class=\"key\">≥5 yr</span>. <b>Enuresis</b> is intermittent leakage while asleep at ≥5 yr: <b>monosymptomatic (MNE)</b> has no other LUTS, <b>non-monosymptomatic (NMNE)</b> has any LUTS."], [3, "p", 77, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "2 · Definitions — International Children's Continence Society (ICCS)", "<b>Trap:</b> dysfunctional voiding (neurologically intact) is not detrusor–sphincter dyssynergia (DSD), which needs a neurological lesion. Say \"LUT dysfunction\", not \"voiding dysfunction\". Urgency incontinence is not always OAB: a voiding postponer also leaks with urge, and anticholinergics help briefly, then worsen emptying."], [3, "l", 79, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "4 · Evaluation", "<b>Urinalysis</b>: SG &gt;1.005 makes DI unlikely. Persistent protein ≥1+ needs a first-morning protein:creatinine ratio (&gt;<span class=\"key\">0.2 mg/mg</span> is abnormal)."], [3, "a", 79, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "4 · Evaluation", "<ol>\n<li>≥2 of, ≥1/week for ≥1 month, irritable bowel syndrome (IBS) criteria not met:</li>\n<li>≤2 defecations in toilet/week; ≥1 faecal incontinence/week; retentive posturing/withholding; painful or hard stools; large rectal faecal mass; large-diameter stools that may block the toilet.</li>\n</ol>"], [3, "l", 79, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "4 · Evaluation", "Do no routine labs or <b>plain radiograph</b> (only if impaction is suspected and exam impossible, or if refractory). A rectal diameter <span class=\"key\">≥30 mm</span> on US suggests constipation (European Association of Urology/European Society for Paediatric Urology, EAU/ESPU), but gastroenterologists advise against routine US."], [3, "a", 79, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "5 · Management of daytime incontinence", "<ol>\n<li>History, exam, urinalysis, PVR, with or without uroflow.</li>\n<li>Exclude neurogenic causes, diabetes, CKD and anatomical causes.</li>\n<li>Optimise neurodevelopmental disorders; <b>treat constipation first</b>.</li>\n<li>If wetting is only at night, treat as MNE.</li>\n<li>Otherwise, <b>standard urotherapy</b> (≥4 wk); re-evaluate.</li>\n<li>Then <b>specific urotherapy</b> by diagnosis.</li>\n<li>If refractory: botulinum toxin or neuromodulation.</li>\n</ol>"], [3, "r", 80, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "5 · Management of daytime incontinence", "<b>Oxybutynin</b> (non-selective) · Immediate release <span class=\"key\">0.3–0.6 mg/kg/day</span> in 2–3 doses (max 15 mg); extended release (ER) 5–20 mg/day (do not crush); patch 3.9 mg/day. Only US-approved drug for paediatric non-neurogenic OAB. Dry mouth, flushing, constipation, cognition."], [3, "l", 80, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "5 · Management of daytime incontinence", "<b>Intradetrusor onabotulinumtoxinA</b> (refractory): <span class=\"key\">5 units/kg, max 100 units</span>; it lasts ~12 months, and retention needing CIC is rare."], [3, "l", 81, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "6 · Nocturnal enuresis", "Prevalence is <span class=\"key\">5–10% at 7 yr</span>; ~15% resolve each year, and ~2% persist into adulthood. Loci are on chromosomes 6 and 13."], [3, "l", 81, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "6 · Nocturnal enuresis", "In <b>NMNE</b>, treat bothersome daytime LUTS and constipation first. In <b>MNE</b>, treat from <span class=\"key\">~6 yr</span>."], [3, "r", 81, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "6 · Nocturnal enuresis", "Use · Nightly; the parent wakes the child; continue until <span class=\"key\">14 consecutive dry nights</span> · <span class=\"key\">0.2–0.4 mg</span> tablet or 120–240 µg melt ~1 h before bed; stop if no effect after ~1 week"], [3, "a", 81, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "6 · Nocturnal enuresis", "<ol>\n<li>MNE at ≥6 yr: start the alarm or desmopressin.</li>\n<li>If it fails, check use, then switch or <b>combine</b>.</li>\n<li>Re-evaluate: hidden daytime LUTS, constipation, sleep-disordered breathing, neurodevelopmental disorder; uroflow and PVR.</li>\n<li>Then <b>add an anticholinergic</b> to desmopressin.</li>\n<li>If refractory: imipramine, a β3-agonist or specialist drugs.</li>\n</ol>"], [3, "a", 82, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "7 · Functional constipation — treatment", "<ol>\n<li>If impacted, <b>disimpact</b> with oral polyethylene glycol (PEG) or enemas.</li>\n<li>Give education, a diary, toilet sitting and <b>maintenance PEG</b>.</li>\n<li>Review at 2 wk; if failing, check adherence, dose, impaction, mental health.</li>\n<li>Continue for <b>≥2 months</b>. Wean when ≥1 month symptom-free, with ≥3 stools/week and Rome IV not met.</li>\n<li>Relapse: reinstate, or refer to gastroenterology.</li>\n</ol>"], [3, "r", 82, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "7 · Functional constipation — treatment", "PEG 3350 — disimpaction · <span class=\"key\">1–1.5 g/kg/day × 3–6 days</span> (&gt;3 yr)"], [3, "r", 82, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "7 · Functional constipation — treatment", "PEG 3350 — maintenance · <span class=\"key\">0.2–0.8 g/kg/day</span>, start 0.4 (&gt;6 months)"], [3, "l", 82, "Ch 47 · Functional Disorders of the Bladder and Bowel in Children", "8 · Recurrent UTI and BBD", "In RIVUR/CUTIE, recurrence was <span class=\"key\">BBD + VUR 51% &gt; BBD alone 35% &gt; VUR alone 20%</span>. A wider caecal diameter predicted more recurrence."], [3, "p", 83, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "1 · Goals and principles", "Every reconstructive step trades storage for emptying. Raising capacity or outlet resistance turns a leaking, self-venting system into one wholly dependent on emptying. A continent reservoir that is not catheterised causes hydronephrosis, sepsis and perforation, so incontinence can be \"protective\". CIC and motivation are prerequisites."], [3, "l", 83, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "2 · Patient selection and preoperative evaluation", "<b>Storage</b>: a chronic filling pressure <span class=\"key\">&gt;40 cm H<sub>2</sub>O</span> causes hydroureteronephrosis, a falling glomerular filtration rate (GFR) and acquired vesicoureteral reflux (VUR). Start anticholinergics and CIC; persistent poor compliance needs <b>augmentation</b>."], [3, "l", 83, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "2 · Patient selection and preoperative evaluation", "Fill at <span class=\"key\">≤10% of predicted capacity per minute</span>, because fast filling falsely lowers compliance; use body-temperature fluid. The UMPIRE protocol (Urologic Management to Preserve Initial Renal function) standardises care."], [3, "l", 83, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "2 · Patient selection and preoperative evaluation", "Check electrolytes, blood urea nitrogen (BUN) and creatinine. If raised, involve nephrology and measure 24-h urine <b>volume</b>: the reservoir must hold <span class=\"key\">3–4 h</span> of output."], [3, "l", 84, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "4 · Bladder augmentation (enterocystoplasty)", "<b>Always detubularise</b> and <b>reconfigure into a sphere</b>. Intact bowel contracts at <span class=\"key\">60–100 cm H<sub>2</sub>O</span>, and a sphere gives the most volume per surface area."], [3, "l", 84, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "4 · Bladder augmentation (enterocystoplasty)", "Length: ileum <span class=\"key\">20–40 cm</span>, colon <span class=\"key\">~20 cm</span>; err on the large side."], [3, "l", 84, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "4 · Bladder augmentation (enterocystoplasty)", "<b>Ileocystoplasty</b>: take ileum at least <span class=\"key\">15–20 cm proximal to ileocaecal valve</span> (B12, <span class=\"dag\">†</span>bile salts); open antimesenterically into a U, S or W fold or cup patch."], [3, "p", 85, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "4 · Bladder augmentation (enterocystoplasty)", "Augmentation is needed less now, thanks to early anticholinergics, CIC, botulinum toxin and neuromodulation (immediate vs expectant treatment: 17% vs 41% augmented). Not trial-proven, but the rationale for treating at diagnosis."], [3, "l", 86, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "5 · Continent catheterisable channels", "In a <b>flap valve</b>, a supple narrow tube tunnelled into a <b>low-pressure</b> reservoir is <b>compressed</b> as pressure rises; the appendix needs only <span class=\"key\">~2 cm</span> of tunnel. Nipple valves (Kock, Mainz, Hanna) are <b>effaced</b> by the same pressure (about 85% vs more than 90–95% continent). A flap valve has <b>no pop-off</b>."], [3, "a", 86, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "5 · Continent catheterisable channels", "<ol>\n<li>Detach the appendix with a caecal cuff (less stenosis; a caecal flap lengthens it) and preserve the mesoappendix.</li>\n<li>Tunnel the <b>distal end</b> submucosally.</li>\n<li>Bring the caecal end to skin with no tension or twist, and sew a <b>skin flap</b> into the stoma.</li>\n<li>Keep the channel <b>short and straight</b>; fix the bladder to the abdominal wall.</li>\n<li>Test catheterisation after each step.</li>\n<li>Stent with 6–12 French (Fr) for 10–14 days; the surgeon does the first catheterisation.</li>\n<li>Then CIC at least 4-hourly by day.</li>\n</ol>"], [3, "p", 87, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "6 · Bladder outlet procedures", "Choosing the outlet: a child who voids gets an AUS (the only option preserving voiding). A child on CIC who is being augmented gets a sling (girls) or flap-valve lengthening with a channel. After failed repairs, do bladder neck closure with a Mitrofanoff. Always re-study the bladder afterwards."], [3, "l", 88, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "9 · Complications of augmentation", "Counsel a <span class=\"key\">~9%</span> risk, mostly in myelodysplasia. <b>Outlet procedures double the risk</b>, as do missed CIC and substance abuse. Overdistension makes the wall ischaemic; recurrence is common."], [3, "l", 88, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "9 · Complications of augmentation", "After ureterosigmoidostomy, adenocarcinoma arises at the anastomosis with a latency of <span class=\"key\">~26 yr</span>, because urine and faeces form N-nitroso compounds."], [3, "l", 88, "Ch 48 · Lower Urinary Tract Reconstruction in Children", "9 · Complications of augmentation", "After augmentation it is reported from <span class=\"key\">4 yr</span>, is highest after <b>gastrocystoplasty</b>, and is aggressive and often metastatic. Bladder cancer in spina bifida (SB) is ~2–4%, mostly stage III–IV."], [3, "a", 90, "★ Putting it together: common paediatric pathways", "A · Antenatal urinary tract dilation (UTD)", "<ol>\n<li><b>Prenatal:</b> A1 before 28 weeks: ultrasound (US) after 32 weeks. A2–3: US 4-weekly. Male, thick bladder, bilateral: suspect posterior urethral valves (PUV).</li>\n<li><b>Postnatal:</b> first US <b>after 48 hours</b>, except suspected PUV or bilateral severe dilation (before discharge).</li>\n<li>If normal (anteroposterior diameter &lt;10 mm), discharge; if mild, repeat US; if moderate–severe or dilated ureter, voiding cystourethrogram (VCUG), MAG3, consider continuous antibiotic prophylaxis (CAP) (<span class=\"xref\">→ Ch 34</span>).</li>\n</ol>"], [3, "a", 90, "★ Putting it together: common paediatric pathways", "B · First febrile urinary tract infection (UTI)", "<ol>\n<li><b>Diagnose:</b> catheter or suprapubic sample if not toilet-trained; bag only rules out.</li>\n<li><b>Treat</b> within 48 h (&gt;72 h doubles new scarring); oral if well.</li>\n<li><b>Image:</b> US all; VCUG if US abnormal, atypical or recurrent (American Academy of Pediatrics 2–24 months); DMSA at 4–6 months if scarring matters.</li>\n<li><b>Prevent:</b> treat bladder and bowel dysfunction (BBD) and constipation; CAP if high risk; circumcision lowers infant UTI (<span class=\"xref\">→ Ch 37, 41</span>).</li>\n</ol>"], [3, "a", 90, "★ Putting it together: common paediatric pathways", "C · Newborn with PUV", "<ol>\n<li>Stabilise breathing → 5–7 Fr feeding tube (minimal or no balloon) → creatinine, electrolytes, fluids.</li>\n<li>US, then VCUG; prophylaxis.</li>\n<li>When stable, <b>endoscopic ablation</b>; if the urethra is small, vesicostomy.</li>\n<li>Prognosis: first-year nadir creatinine (&lt;0.8 mg/dL good). Lifelong: valve bladder, chronic kidney disease (CKD), blood pressure; transplant, Ch 61 (book 1) (<span class=\"xref\">→ Ch 45</span>).</li>\n</ol>"], [3, "a", 91, "★ Putting it together: common paediatric pathways", "E · Daytime wetting and bedwetting", "<ol>\n<li>Urinalysis, PVR with or without uroflow; exclude neurogenic, anatomical, medical causes.</li>\n<li><b>Constipation first</b>, then urotherapy ≥4 weeks.</li>\n<li>Specific: antimuscarinic for overactive bladder, biofeedback for dysfunctional voiding. If refractory: toxin, neuromodulation.</li>\n<li><b>Monosymptomatic nocturnal enuresis:</b> alarm or desmopressin (no fluids 1 h before to morning); combine if partial (<span class=\"xref\">→ Ch 47</span>).</li>\n</ol>"], [3, "p", 91, "★ Putting it together: common paediatric pathways", "F · Augmentation segment", "Reconstruction trades storage for emptying. An unreliably catheterised continent reservoir causes hydronephrosis, sepsis and perforation, so CIC commitment comes first. Perforation means pain and sepsis; it is urgent (<span class=\"xref\">see Ch 48</span>)."], [4, "l", 2, "Ch 101 · Surgical, Radiographic and Endoscopic Anatomy of the Female Pelvis", "1 · Perineum and external genitalia", "The meatus lies <span class=\"key\">1 cm</span> anterior to the vaginal opening."], [4, "l", 3, "Ch 101 · Surgical, Radiographic and Endoscopic Anatomy of the Female Pelvis", "4 · Endopelvic fascia and visceral ligaments", "Distinguish the <b>infundibulopelvic ligament</b> (ovarian vessels, with the ureter beneath) with the <b>ovarian ligament</b> (ovary to uterus) <span class=\"tag\">MCQ</span>."], [4, "p", 3, "Ch 101 · Surgical, Radiographic and Endoscopic Anatomy of the Female Pelvis", "4 · Endopelvic fascia and visceral ligaments", "Support ligaments are connective tissue condensed around vessels and nerves, so the best anchors (uterosacral, cardinal) are exactly where sutures injure the ureter, pelvic plexus and sacral nerves. <span class=\"xref\">See Ch 108</span>"], [4, "l", 3, "Ch 101 · Surgical, Radiographic and Endoscopic Anatomy of the Female Pelvis", "5 · Urethra and continence anatomy", "The urethra is <span class=\"key\">4.7–5.1 cm</span> long, behind the symphysis, hung from posterior pubourethral ligaments, on the anterior vaginal wall."], [4, "a", 4, "Ch 101 · Surgical, Radiographic and Endoscopic Anatomy of the Female Pelvis", "6 · Bladder and ureter", "<p><b>Ureteric danger points</b>:</p><ol>\n<li>Pelvic brim, at the infundibulopelvic ligament.</li>\n<li>Under the uterine artery (hysterectomy).</li>\n<li>Beside the cardinal/uterosacral ligaments near the cervix.</li>\n<li>Anterior vaginal fornix (vaginal surgery).</li>\n<li>Sacral promontory: the right ureter (sacrocolpopexy).</li></ol>"], [4, "p", 5, "Ch 101 · Surgical, Radiographic and Endoscopic Anatomy of the Female Pelvis", "7 · Nerves at surgical risk", "Post-lithotomy foot drop is peripheral (fibular head), not pelvic. Leg pain and swelling after long lithotomy suggest <b>compartment syndrome</b>, an emergency (<span class=\"dag\">†</span> fasciotomy)."], [4, "l", 5, "Ch 101 · Surgical, Radiographic and Endoscopic Anatomy of the Female Pelvis", "8 · Vessels and lymphatics", "The <b>presacral plexus</b> is valveless and under high pressure (worse in lithotomy). A 1–2 mm vein can bleed more than <span class=\"key\">1 L/min</span>."], [4, "a", 5, "Ch 101 · Surgical, Radiographic and Endoscopic Anatomy of the Female Pelvis", "8 · Vessels and lymphatics", "<p><b>Sacrocolpopexy</b></p><ol>\n<li>Expose the ALL at the promontory over the L5/S1 disc.</li>\n<li>Open the peritoneum distally.</li>\n<li>Suture into the ALL over <b>S1</b> (strongest; less discitis).</li>\n<li>Avoid the left common iliac vein, middle sacral vessels, presacral plexus and right ureter (each about 2.7 cm from the mid-promontory).</li></ol>"], [4, "a", 5, "Ch 101 · Surgical, Radiographic and Endoscopic Anatomy of the Female Pelvis", "9 · Endoscopic anatomy", "<ol>\n<li>Distal urethra: glands, diverticular ostia, mesh, stones.</li>\n<li>Mid-urethral coaptation (external sphincter).</li>\n<li>Bladder neck coaptation.</li>\n<li>Trigone and orifices (30° lens).</li>\n<li>Survey the whole mucosa.</li></ol>"], [4, "l", 7, "Ch 108 · Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology", "1 · Definitions and terminology", "<b>Overactive bladder (OAB)</b> is urgency with or without UUI, usually with frequency and nocturia; it is <b>defined by urgency</b>. Frequency ≥ <span class=\"key\">8 voids/24 h</span> is abnormal once polyuria is excluded."], [4, "l", 7, "Ch 108 · Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology", "2 · Epidemiology of female UI", "<b>Pregnancy</b> is the commonest cause of new UI in young women (about <span class=\"key\">40%</span>, mostly SUI). Over 30% leak at 1 year; UI at 3 months usually persists. Pelvic floor muscle training (PFMT) during and after pregnancy reduces UI."], [4, "r", 8, "Ch 108 · Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology", "3 · Risk factors for female UI", "<b>Vaginal delivery</b> · Causes later <b>SUI, not UUI</b>. Caesarean section (CS) protects only if <b>every</b> delivery is by CS; number needed to treat (NNT) is <span class=\"key\">13</span> to prevent one moderate–severe UI. Elective CS protects more than CS in labour. Baby ≥4 kg: odds ratio (OR) about 1.5."], [4, "p", 8, "Ch 108 · Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology", "3 · Risk factors for female UI", "Obstetric injury and loss of support cause <b>stress</b> UI; ageing, neurological, metabolic and lifestyle factors cause <b>urgency</b>. So the dominant type moves from stress to urge with age."], [4, "l", 8, "Ch 108 · Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology", "3 · Risk factors for female UI", "In men <b>UUI is commoner than MUI, which is commoner than SUI</b>. Male SUI is nearly always iatrogenic (radical prostatectomy [RP], pelvic surgery) or neurological. Remission reaches <span class=\"key\">40%</span>."], [4, "l", 8, "Ch 108 · Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology", "4 · Physiology of continence", "In <b>women</b>, the continence zone is the <b>proximal and mid-urethra</b>; the bladder neck is often incompetent in continent women. The oestrogen-sensitive spongy submucosa gives up to <span class=\"key\">30%</span> of closure."], [4, "p", 9, "Ch 108 · Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology", "4 · Physiology of continence", "The female outlet relies on a <b>single</b> mid-urethral sphincter against a mobile backing, so continence needs support, intrinsic urethral properties and muscle together."], [4, "l", 10, "Ch 108 · Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology", "6 · Pathophysiology of female SUI", "ISD was described with the autologous pubovaginal sling, usually after previous surgery; it equals <b>type III SUI</b> (Blaivas) <span class=\"tag\">MCQ</span>."], [4, "l", 10, "Ch 108 · Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology", "6 · Pathophysiology of female SUI", "<b>Valsalva leak point pressure (VLPP)</b> is the abdominal pressure that causes leakage (invalid during detrusor contraction or poor compliance). <b>VLPP &lt; <span class=\"key\">60 cm H₂O</span> means ISD</b>, historically treated by bulking or pubovaginal sling."], [4, "p", 10, "Ch 108 · Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology", "6 · Pathophysiology of female SUI", "<b>Slings work in hypermobility but Burch fails in ISD</b>. Almost all SUI includes some ISD, so sphincter-directed procedures (pubovaginal sling [PVS], mid-urethral sling [MUS], bulking) work in hypermobile women. Burch corrects only hypermobility, so it is weak with severe ISD and a fixed urethra."], [4, "a", 10, "Ch 108 · Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology", "11 · Pathophysiology of POP", "<p><b>POP sequence</b></p><ol>\n<li>Labour causes levator trauma or denervation.</li>\n<li>The muscle loses tone and the urogenital hiatus widens.</li>\n<li>Fascia and ligaments now carry the whole load.</li>\n<li>They stretch and fail (ageing, straining, hysterectomy): POP.</li>\n<li>POP widens the hiatus further.</li></ol>"], [4, "l", 12, "Ch 108 · Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology", "11 · Pathophysiology of POP", "MRI shows levator defects in up to <span class=\"key\">20%</span> of primiparas and none in nulliparas. <b>Avulsion</b> predicts advanced, multicompartment POP."], [4, "a", 12, "Ch 108 · Urinary Incontinence and Pelvic Prolapse: Epidemiology and Pathophysiology", "12 · POP and UI interaction", "<ol>\n<li>A cystocele kinks the urethra, and the obstruction masks SUI.</li>\n<li>POP repair relieves the kink, so SUI is unmasked.</li>\n<li>Detect it by UDS or stress test <b>with the prolapse reduced</b> (pessary or speculum).</li></ol>"], [4, "l", 14, "Ch 105 · Evaluation and Management of Women With Urinary Incontinence and Pelvic Organ Prolapse", "2 · History", "SUI coexists in about <span class=\"key\">40%</span> of women with POP. Many expect repair to cure leakage, so counsel."], [4, "l", 15, "Ch 105 · Evaluation and Management of Women With Urinary Incontinence and Pelvic Organ Prolapse", "3 · Physical examination", "The Q-tip test is uncomfortable, now mostly for teaching and trials. A vaginal swab test is equivalent, and <b>visual urethral mobility</b> (meatal rotation &lt; or <span class=\"key\">&gt;30°</span>) is routine."], [4, "p", 16, "Ch 105 · Evaluation and Management of Women With Urinary Incontinence and Pelvic Organ Prolapse", "3 · Physical examination", "Stage II is a 2-cm window around the hymen; the III/IV boundary depends on tvl. Example: tvl 8, Bp +5 lies between +1 and +6, so <b>stage III</b>."], [4, "l", 16, "Ch 105 · Evaluation and Management of Women With Urinary Incontinence and Pelvic Organ Prolapse", "3 · Physical examination", "The <b>bulbocavernosus reflex</b> (S2–S4) is present in only about <span class=\"key\">70%</span> of normal women, so its absence alone is not pathological."], [4, "a", 17, "Ch 105 · Evaluation and Management of Women With Urinary Incontinence and Pelvic Organ Prolapse", "5 · Management pathway", "<ol>\n<li>History, examination, UA and PVR.</li>\n<li>Exclude DIAPPERS causes, UTI, obstruction and tumour.</li>\n<li>Classify the UI and grade the bother.</li>\n<li>If there are red flags (pain, haematuria, recurrent UTI, pelvic mass, prior radiation or pelvic surgery, prolapse beyond the introitus, fistula), then refer for specialist work-up.</li>\n<li>If not, start initial management and reassess.</li>\n<li>Add tests only if they change management; then surgery.</li></ol>"], [4, "p", 18, "Ch 114 · Conservative Management of Urinary Incontinence: Behavioural and Pelvic Floor Therapy, Urethral and Pelvic Devices", "1 · Definition and principles", "Why first-line if surgery cures SUI more often? Conservative therapy is risk free and at least as effective as drugs. This asymmetry of harm drives every recommendation."], [4, "l", 19, "Ch 114 · Conservative Management of Urinary Incontinence: Behavioural and Pelvic Floor Therapy, Urethral and Pelvic Devices", "3 · Lifestyle modifications", "Excess intake (~3.7 L/day) worsens frequency, so reduce it if 24-h output is &gt;~<span class=\"key\">2100 mL</span>."], [4, "l", 19, "Ch 114 · Conservative Management of Urinary Incontinence: Behavioural and Pelvic Floor Therapy, Urethral and Pelvic Devices", "3 · Lifestyle modifications", "<b>Target</b> six to eight 8-oz glasses, or <span class=\"key\">30 mL/kg/day</span>, minimum <span class=\"key\">1500 mL</span>, at set times. The Institute of Medicine (IOM) figure of 2.7 L/day includes water from food."], [4, "l", 19, "Ch 114 · Conservative Management of Urinary Incontinence: Behavioural and Pelvic Floor Therapy, Urethral and Pelvic Devices", "3 · Lifestyle modifications", "About <span class=\"key\">250 mg/day</span> (≈2 cups) is associated with moderate–severe UI in men; coffee is not linked to nocturia."], [4, "l", 19, "Ch 114 · Conservative Management of Urinary Incontinence: Behavioural and Pelvic Floor Therapy, Urethral and Pelvic Devices", "4 · Pelvic floor muscle training (PFMT)", "PFMT is the cornerstone for SUI, UUI, MUI, urgency and frequency (<b>Arnold Kegel, 1948</b>) <span class=\"tag\">MCQ</span>."], [4, "a", 20, "Ch 114 · Conservative Management of Urinary Incontinence: Behavioural and Pelvic Floor Therapy, Urethral and Pelvic Devices", "4 · Pelvic floor muscle training (PFMT)", "<ol>\n<li>Empty the bladder.</li>\n<li><b>Lying</b>: 5 quick (1–2 s) and 5 sustained (5, building to 10 s) contractions.</li>\n<li>Repeat <b>sitting</b>, then <b>standing</b> (total 30).</li>\n<li>Rest as long as each contraction (work:rest <b>1:1 to 1:2</b>).</li>\n<li>Do this twice daily = <b>60/day</b>.</li>\n</ol>"], [4, "a", 21, "Ch 114 · Conservative Management of Urinary Incontinence: Behavioural and Pelvic Floor Therapy, Urethral and Pelvic Devices", "5 · Urge suppression", "<ol>\n<li>When the urge comes, do not rush.</li>\n<li>Stand still or sit, and relax.</li>\n<li>Do several quick PFM squeezes, then distract yourself.</li>\n<li>The urge subsides like a wave; then walk normally to void.</li>\n<li>Once mastered, wait 5 min after the urge, then extend.</li>\n</ol>"], [4, "l", 21, "Ch 114 · Conservative Management of Urinary Incontinence: Behavioural and Pelvic Floor Therapy, Urethral and Pelvic Devices", "5 · Urge suppression", "Used alone for UUI, it gives a mean <span class=\"key\">60–80%</span> reduction in incontinence, and also reduces urgency, frequency and nocturia."], [4, "r", 22, "Ch 114 · Conservative Management of Urinary Incontinence: Behavioural and Pelvic Floor Therapy, Urethral and Pelvic Devices", "7 · Electrical stimulation (E-stim)", "UUI · <span class=\"key\">5–20 Hz</span> (low)"], [4, "r", 22, "Ch 114 · Conservative Management of Urinary Incontinence: Behavioural and Pelvic Floor Therapy, Urethral and Pelvic Devices", "7 · Electrical stimulation (E-stim)", "SUI (including post-prostatectomy) · <span class=\"key\">20–50 Hz</span> (higher)"], [4, "p", 22, "Ch 114 · Conservative Management of Urinary Incontinence: Behavioural and Pelvic Floor Therapy, Urethral and Pelvic Devices", "7 · Electrical stimulation (E-stim)", "E-stim is dosed by goal. Sub-sensory, low-frequency, prolonged stimulation inhibits the detrusor; near-painful, higher-frequency, brief stimulation contracts the sphincter. Volitional PFMT does both, so E-stim earns its place only where volitional contraction is absent."], [4, "a", 22, "Ch 114 · Conservative Management of Urinary Incontinence: Behavioural and Pelvic Floor Therapy, Urethral and Pelvic Devices", "8 · Bladder training and scheduled voiding", "<ol>\n<li>Start with a diary.</li>\n<li>Set an initial interval of ~1 h while awake (30 min if needed).</li>\n<li>Void on waking, at each interval and at bedtime, but not between.</li>\n<li>If leaks and urgency are controlled, increase by <b>15–30 min/week</b>.</li>\n<li>Target an interval of <b>3–4 h</b>; review weekly with reinforcement.</li>\n</ol>"], [4, "l", 24, "Ch 114 · Conservative Management of Urinary Incontinence: Behavioural and Pelvic Floor Therapy, Urethral and Pelvic Devices", "12 · Adherence, prevention and delivery", "<b>Prevention in childbearing</b>: supervised antenatal PFMT (12 weeks from 16–24 weeks' gestation) prevents late-pregnancy and early postpartum UI (A). Offer a postnatal programme after forceps or a baby ≥<span class=\"key\">4000 g</span>. Antenatal PFMT does <b>not</b> prevent postnatal prolapse."], [4, "p", 26, "Ch 116 · Retropubic Suspension Surgery for Incontinence in Females", "1 · Mechanism", "Suspension corrects <b>hypermobility, not the sphincter</b>: it lifts and stabilises bladder neck and proximal urethra, so presupposes a mobile urethra. A fixed ISD urethra needs compression (sling, artificial urinary sphincter (AUS))."], [4, "r", 26, "Ch 116 · Retropubic Suspension Surgery for Incontinence in Females", "2 · Patient selection", "Immobile urethra (negative Q-tip ≈ <span class=\"key\">5-fold</span> failure): use sling or AUS · Obesity, menopause, age &gt;60"], [4, "a", 27, "Ch 116 · Retropubic Suspension Surgery for Incontinence in Females", "4 · Burch colposuspension", "<ol>\n<li>Low lithotomy, prep including vagina, Foley.</li>\n<li>Pfannenstiel or low midline incision (with or without Cherney).</li>\n<li>Enter Retzius; sweep fat laterally.</li>\n<li>Find bladder neck by Foley balloon and vaginal finger.</li>\n<li>Dissect bladder off vagina <b>laterally</b>; expose Cooper's.</li>\n<li>Place sutures, then cystoscopy.</li>\n</ol>"], [4, "l", 27, "Ch 116 · Retropubic Suspension Surgery for Incontinence in Females", "4 · Burch colposuspension", "Pass sutures medial to lateral and tie <b>distal first</b>, <b>loosely</b> (Tanagho), leaving <span class=\"key\">≈ 2 fingerbreadths</span> between bladder neck and pubis; over-tightening obstructs."], [4, "p", 27, "Ch 116 · Retropubic Suspension Surgery for Incontinence in Females", "4 · Burch colposuspension", "<b>Danger points</b>: never dissect midline over urethra or bladder neck (Santorini bleeding, injury, obstruction if sutures medial). Passing through Cooper's may
