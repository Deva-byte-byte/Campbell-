 · Fundamentals of Nephrology", "8 · Urinary tract obstruction and post-obstructive diuresis", "A small stone with low-grade obstruction can be observed safely for <span class=\"key\">2–4 weeks</span>. Beyond 4 weeks outcome is unpredictable (recovery up to 5 months)."], [13, "l", 14, "Ch 91 · Renal Transplantation", "1 · End-stage disease and why transplant", "KDIGO stage <b>G5 (eGFR &lt;<span class=\"key\">15</span> mL/min/1.73 m²)</b> is end-stage renal disease (ESRD) <span class=\"xref\">see Ch 90</span>."], [13, "l", 14, "Ch 91 · Renal Transplantation", "1 · End-stage disease and why transplant", "<span class=\"tag\">MCQ</span> First successful kidney transplant: identical twins, 1954."], [13, "p", 14, "Ch 91 · Renal Transplantation", "2 · Recipient evaluation", "Two questions: will the patient survive the operation, and will immunosuppression unmask something dormant (infection, cancer)?"], [13, "l", 14, "Ch 91 · Renal Transplantation", "2 · Recipient evaluation", "Evaluate before dialysis; deceased-donor listing is allowed at eGFR ≤<span class=\"key\">20</span>."], [13, "a", 15, "Ch 91 · Renal Transplantation", "4 · Deceased donation", "<ol>\n<li>Midline incision and sternotomy; mobilise bowel off the retroperitoneum.</li>\n<li>Control the aorta and inferior vena cava (IVC).</li>\n<li>Find aberrant or accessory arteries <b>before cannulation</b>.</li>\n<li>Perfuse; ice via opened Gerota fascia.</li>\n<li>Remove kidneys en bloc with <b>periureteric tissue preserved</b>.</li>\n<li>Separate on the back table; store cold.</li>\n</ol>"], [13, "l", 16, "Ch 91 · Renal Transplantation", "5 · Living donation", "Donor mortality is <span class=\"key\">3/10,000</span>. An independent donor advocate is mandatory."], [13, "a", 16, "Ch 91 · Renal Transplantation", "6 · The operation", "<ol>\n<li><b>Vein first</b>: end-to-side to the external iliac vein, 5-0/6-0 polypropylene.</li>\n<li>Artery end-to-side to the external iliac artery (punch arteriotomy; avoid calcified clamp sites).</li>\n<li>Reperfuse, then position the kidney without kink or stretch.</li>\n</ol>"], [13, "a", 17, "Ch 91 · Renal Transplantation", "6 · The operation", "<ol>\n<li><b>Lich–Gregoir</b> extravesical: fill the bladder; incise the detrusor down to mucosa.</li>\n<li>Open the mucosa distally and spatulate the ureter.</li>\n<li>Suture mucosa to mucosa with 5-0/6-0 absorbable, with or without a stent.</li>\n<li>Close the detrusor loosely as a short tunnel.</li>\n</ol>"], [13, "a", 18, "★ Putting it together: kidney function and transplant decisions", "A · Rising creatinine after urological surgery", "<ol>\n<li><b>Postrenal first:</b> check the catheter; scan bladder and kidneys. After cystectomy or bladder repair, a rise with ascites may be a urine leak, so drain creatinine ≫ serum confirms it (see Ch 90).</li>\n<li><b>Prerenal vs intrinsic:</b> if fractional sodium excretion (FeNa) &lt;1% with bland urine, then volume depletion; if &gt;1% with granular casts, then acute tubular necrosis (ATN). Stop nephrotoxins, renin–angiotensin blockers, metformin.</li>\n<li><b>Dialysis</b> only for refractory \"AEIOU\": acidosis, electrolytes (K), intoxication, overload, uraemia.</li>\n</ol>"], [13, "p", 18, "★ Putting it together: kidney function and transplant decisions", "B · Post-obstructive diuresis", "After bilateral (or solitary-kidney) relief, monitor output and electrolytes. It is mostly physiological; <span class=\"dag\">†</span>it is pathological if it persists after euvolaemia. <span class=\"dag\">†</span>Do not replace every millilitre. If unable to drink, replace ≈75% with 0.45% saline (see Ch 90)."], [13, "a", 19, "★ Putting it together: kidney function and transplant decisions", "E · Child going for transplant", "<ol>\n<li>Most have congenital anomalies of kidney and urinary tract (CAKUT), chiefly valves.</li>\n<li>Make the bladder safe: age-appropriate capacity at detrusor pressure &lt;40 cm H₂O (antimuscarinics, clean intermittent catheterisation, augmentation if needed).</li>\n<li>Remove refluxing ureters or kidneys causing infection, polyuria or hypertension.</li>\n<li>A poor bladder destroys the graft (see Ch 92/61).</li>\n</ol>"], [14, "r", 2, "Ch 148 · Anatomy and Development of the Prostate", "1 · Development (embryology)", "<span class=\"key\">10</span> · Epithelial buds invade the mesenchyme; this fixes the adult ductal pattern"], [14, "p", 2, "Ch 148 · Anatomy and Development of the Prostate", "1 · Development (embryology)", "McNeal: <b>re-awakening of embryonic induction</b> in ageing transition-zone stroma may initiate new glands, one theory of BPH."], [14, "l", 3, "Ch 148 · Anatomy and Development of the Prostate", "2 · Zonal anatomy (McNeal)", "The urethra bends <span class=\"key\">≈35°</span> at the verumontanum, where <b>13–15</b> ducts open dorsolaterally. This is the distal limit of transurethral resection (TURP) and enucleation."], [14, "p", 3, "Ch 148 · Anatomy and Development of the Prostate", "2 · Zonal anatomy (McNeal)", "Trap: the central zone (CZ), around the ejaculatory ducts, is not the TZ. Short proximal ducts <b>enlarge</b> (BPH); long distal ducts <b>transform</b> (cancer). The enlarging TZ compresses PZ into the <b>surgical (pseudo)capsule</b>, the enucleation plane <span class=\"xref\">See Ch 152</span>."], [14, "l", 3, "Ch 148 · Anatomy and Development of the Prostate", "5 · Secretions and clinical markers", "Prostatic fluid is <span class=\"key\">37–44%</span> of semen and acidic (pH ≈6.3). Seminal vesicle fluid (the majority, alkaline) supplies semenogelins."], [14, "l", 3, "Ch 148 · Anatomy and Development of the Prostate", "5 · Secretions and clinical markers", "Kallikreins liquefy semen within <span class=\"key\">20–30 min</span>; incomplete liquefaction at 60 min is nonliquefaction."], [14, "p", 4, "Ch 148 · Anatomy and Development of the Prostate", "5 · Secretions and clinical markers", "Benign cells: high zinc blocks aconitase, so citrate is exported. Cancer: <b>zinc is lost</b> and citrate is oxidised, so citrate is low (<span class=\"dag\">†</span>the basis of MR spectroscopy)."], [14, "l", 5, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "1 · Definitions and the four overlapping entities", "\"<b>Prostatism</b>\" is obsolete; Paul Abrams coined \"LUTS\" <span class=\"tag\">MCQ</span>. \"Hypertrophy\" is wrong because BPH raises cell <b>number</b>, not size."], [14, "l", 5, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "1 · Definitions and the four overlapping entities", "<span class=\"dag\">†</span>BOOI = PdetQmax − 2Qmax: <span class=\"key\">&gt;40 obstructed, 20–40 equivocal, &lt;20 unobstructed</span>."], [14, "p", 5, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "1 · Definitions and the four overlapping entities", "Viva: \"Is every man with LUTS and a big prostate obstructed?\" No. Size, symptoms, flow and obstruction are separate; obstruction is diagnosed only by pressure–flow."], [14, "l", 5, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "2 · Epidemiology", "At autopsy there is <b>no BPH under 30</b>; prevalence is ≈ <span class=\"key\">50% in the 50s</span><span class=\"dag\">†</span> and <span class=\"key\">88% in the 80s</span>. It is <b>similar across all ethnic and geographic groups</b>."], [14, "l", 5, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "2 · Epidemiology", "BPH is described on three axes: <b>symptoms</b> (IPSS), <b>enlargement</b> and <b>obstruction</b>, plus bother and quality of life (QoL). The proposed volume cut-off is <span class=\"key\">&gt;30 mL</span>; a community composite is IPSS &gt;7, maximum flow rate (Qmax) &lt;15 mL/s and volume &gt;20 mL."], [14, "a", 6, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "2 · Epidemiology", "<ol><li>Total prostate volume (TPV) ≈ <span class=\"key\">25 mL in the 30s → 35–45 mL in the 70s</span>.</li><li>Transition zone volume (TZV) ≈ 15 → 25 mL.</li></ol>"], [14, "p", 6, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "3 · Aetiology", "BPH is an <b>accumulation</b> disease: volume = proliferation minus death. Established BPH shows equal or reduced replication and raised bcl-2. Androgens act chiefly by <b>suppressing cell death</b>, so withdrawal shrinks the gland. Early BPH may involve rapid proliferation."], [14, "l", 6, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "3 · Aetiology", "Serum testosterone falls with age, but <b>intraprostatic dihydrotestosterone (DHT) and androgen receptor (AR) stay high</b>. DHT is <b>maintained, not elevated</b>; old \"raised DHT\" reports used cadaveric controls <span class=\"tag\">MCQ</span>."], [14, "a", 6, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "3 · Aetiology", "<ol>\n<li>Testosterone enters the stromal cell.</li>\n<li><b>Type 2 5α-reductase</b> (nuclear membrane, interstitial fibroblast) converts it to DHT.</li>\n<li>DHT acts on the stroma (autocrine) or diffuses to the epithelium (paracrine).</li>\n<li>The DHT–AR complex binds DNA and switches on growth factors.</li>\n<li>Growth factors drive epithelial survival and growth.</li>\n</ol>"], [14, "l", 6, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "3 · Aetiology", "≈ <span class=\"key\">90%</span> of prostatic androgen is DHT of testicular origin; ≈10% is adrenal. DHT has higher AR affinity and forms a more stable complex."], [14, "l", 7, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "3 · Aetiology", "SRD5A2 lies on <span class=\"key\">chromosome 2p23</span> <span class=\"tag\">MCQ</span>. The V89L variant lowers and A49T raises activity, but links to BPH are inconsistent. Promoter methylation occurs in up to 30% of BPH."], [14, "l", 8, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "3 · Aetiology", "<b>Waist circumference</b> predicts prostatectomy and LUTS independently of BMI. BMI &gt;35 versus &lt;25 gives an odds ratio (OR) of <span class=\"key\">3.5</span> for a prostate ≥40 mL. Non-alcoholic fatty liver disease (NAFLD) is associated."], [14, "l", 9, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "3 · Aetiology", "In young men with large glands (&gt;37 g), first-degree relatives have ≈ <span class=\"key\">4-fold</span> risk of surgery (brothers ≈6–8-fold). Inheritance is <b>autosomal dominant</b>; ≈ <span class=\"key\">50%</span> of men operated on before 60 have heritable disease, versus ≈9% after 60."], [14, "l", 9, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "4 · Pathology", "The <b>middle lobe</b> is <b>periurethral</b>, because there is no TZ at the bladder neck <span class=\"tag\">MCQ</span>. Patterns are middle, lateral, trilobar and posterior commissural (median bar)."], [14, "p", 9, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "4 · Pathology", "Only humans have a <b>capsule</b>, transmitting expansion onto the urethra; dogs get BPH but rarely obstruct. Transurethral incision of the prostate (TUIP) relieves obstruction without changing volume. Hence <b>size does not correlate with obstruction</b>."], [14, "a", 9, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "5 · Pathophysiology of obstruction", "<ol>\n<li>Hyperplasia raises urethral resistance (static and dynamic components).</li>\n<li>The detrusor compensates, at a cost to storage function.</li>\n<li>Storage LUTS appear, with or without impaired emptying.</li>\n<li>In a minority, the detrusor decompensates.</li>\n</ol>"], [14, "l", 10, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "5 · Pathophysiology of obstruction", "Many LUTS arise from <b>obstruction-induced bladder change</b>. ≈ <span class=\"key\">One-third</span> of men keep voiding dysfunction (mostly storage) after relief."], [14, "a", 10, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "5 · Pathophysiology of obstruction", "<p><b>Three-stage remodelling</b>:</p><ol><li>Smooth muscle hypertrophy.</li><li>Compensation.</li><li>Decompensation (underactive bladder).</li></ol>"], [14, "p", 10, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "5 · Pathophysiology of obstruction", "Storage LUTS persist after transurethral resection of the prostate (TURP) because the collagen-rich, overactive detrusor does not reverse, so counsel men with DO before surgery. Acute urinary retention (AUR) is <b>not</b> the inevitable end: many men in AUR have an adequate detrusor and a precipitant."], [14, "l", 10, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "6 · Natural history", "≈ <span class=\"key\">40%</span> improve without treatment (watchful waiting behaves like placebo); active drug gives about twice the placebo improvement in each stratum."], [14, "l", 10, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "6 · Natural history", "<b>Olmsted County</b>: IPSS rises ≈ <span class=\"key\">0.2–0.34 points/year</span> (steepest in the 60s); Qmax falls ≈ <span class=\"key\">2.1%/year</span> (faster if age ≥70 or Qmax &lt;10); volume grows ≈ <span class=\"key\">0.6 mL/year</span> (≈1.9%/year, faster with higher PSA or volume). Volume &gt;50 mL gives ≈3.5-fold odds of moderate–severe LUTS."], [14, "l", 11, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "6 · Natural history", "<b>MTOPS</b> (Medical Therapy of Prostatic Symptoms) placebo arm: progression <span class=\"key\">4.5 per 100 patient-years</span> (17% at 4 yr), mostly an <b>IPSS rise ≥4</b> (14%); AUR 2%; invasive therapy 5%; <b>no renal insufficiency</b>."], [14, "p", 11, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "6 · Natural history", "PSA is a cheap surrogate for volume, the main driver of AUR and surgery; models with &gt;100 predictors barely beat PSA alone."], [14, "p", 11, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "7 · Complications", "Death, renal failure, stones and infection are now rare. The common events are <b>AUR and surgery</b>, predicted by age, symptoms, low flow and a large gland (or high PSA)."], [14, "r", 11, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "7 · Complications", "Later surgery · <span class=\"key\">75%</span> · <span class=\"key\">26%</span>"], [14, "l", 11, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "7 · Complications", "AUR incidence is ≈ <span class=\"key\">4.5–6.8/1000 person-years</span> in the community, 9.6 in Veterans Affairs (VA) watchful waiting, 18 in PLESS placebo and 6 in MTOPS. The hazard is constant over time."], [14, "l", 12, "Ch 149 · Benign Prostatic Hyperplasia: Aetiology, Pathophysiology, Epidemiology and Natural History", "7 · Complications", "<b>Bladder stones</b> are ≈ <span class=\"key\">8×</span> commoner because of stasis; renal stones are not."], [14, "p", 13, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "1 · Definitions and the diagnostic problem", "Bothersome LUTS are not BPH-related BOO until assessed. Aims: <b>grade severity and bother</b> and <b>identify the cause</b>. Symptoms, flow, post-void residual (PVR), volume and cystoscopy cannot separate obstruction from bladder dysfunction; only the <b>pressure–flow study</b> can (gold standard, reserved for when it changes surgery)."], [14, "l", 13, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "2 · History and symptom assessment", "The minimum perceptible change is <span class=\"key\">3 points</span>, but with a severe baseline <b>percentage</b> reduction is more reliable."], [14, "l", 13, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "2 · History and symptom assessment", "The AUA Symptom Index (AUASI) and International Prostate Symptom Score (IPSS) total <span class=\"key\">0–35</span>: mild <span class=\"key\">0–7</span>, moderate <span class=\"key\">8–19</span>, severe <span class=\"key\">20–35</span>."], [14, "l", 14, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "3 · Examination and DRE", "PV does not correlate with symptoms or obstruction, but the <span class=\"key\">30 mL</span> and <span class=\"key\">50 mL</span> cut-offs predict treatment response and progression."], [14, "l", 14, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "4 · Frequency–volume charts and nocturia", "<b>Indication</b>: predominant <b>storage LUTS or nocturia</b>; it beats recall. <b>Duration</b>: <span class=\"key\">3 days</span> (adherence falls by 7). Charting has a training effect; keep habits routine."], [14, "l", 14, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "4 · Frequency–volume charts and nocturia", "<b>Nocturia</b> is waking ≥1 time to void. <b>Nocturnal polyuria</b> is night output <span class=\"key\">&gt;20%</span> of 24-h output (young) or <span class=\"key\">&gt;33%</span> (over 65)."], [14, "a", 14, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "4 · Frequency–volume charts and nocturia", "<p><b>Nocturia</b></p><ol>\n<li>Complete an FVC.</li>\n<li>If <span class=\"dag\">†</span>global polyuria (&gt;40 mL/kg/24 h), look for diabetes or excess intake.</li>\n<li>If nocturnal polyuria, look for heart failure, sleep apnoea, evening fluids or diuretic timing.</li>\n<li>If reduced capacity, think of OAB or BOO.</li>\n<li>Treat the cause. If nocturia persists, consider <b>sleep apnoea</b> (AUA).</li>\n</ol>"], [14, "l", 14, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "5 · Laboratory tests", "<b>Prostate-specific antigen (PSA)</b> gives PCa risk, a volume surrogate and progression risk. Test only if life expectancy is <span class=\"key\">&gt;10 years</span> and it changes management."], [14, "l", 14, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "5 · Laboratory tests", "PSA predicting <b>PV &gt;40 mL</b>: <span class=\"key\">&gt;1.6</span> (50s), <span class=\"key\">&gt;2.0</span> (60s), <span class=\"key\">&gt;2.3 ng/mL</span> (70s); area under the curve ≈0.76–0.78. Baseline PSA predicts acute urinary retention (AUR), surgery, and change in symptoms and maximum flow rate (Qmax)."], [14, "l", 15, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "6 · Instrumental investigations", "A PVR <span class=\"key\">&lt;30 mL</span> is insignificant; persistently <span class=\"key\">&gt;50 mL</span> is important; <span class=\"key\">200–300 mL</span> may mean DUA and a poorer response; <span class=\"key\">&gt;300 mL</span> is significant chronic retention."], [14, "l", 15, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "6 · Instrumental investigations", "Record <b>Qmax</b>, voided volume and pattern (average flow is less accurate). Repeat if voided volume is <span class=\"key\">&lt;150 mL</span>; void in the preferred position."], [14, "l", 15, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "6 · Instrumental investigations", "It <b>cannot distinguish BOO from DUA</b> (DUA in 9–48%). Qmax <span class=\"key\">10 mL/s</span> is more specific; <span class=\"key\">15 mL/s</span> is more sensitive."], [14, "l", 15, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "6 · Instrumental investigations", "Pressure–flow study (PFS) indications (EAU): failed invasive treatment; cannot void <span class=\"key\">&gt;150 mL</span>; PVR <span class=\"key\">&gt;300 mL</span>; age <span class=\"key\">&gt;80</span> or <span class=\"key\">&lt;50 years</span> with voiding LUTS; neurological disease or pelvic surgery. AUA: before surgery if <b>Qmax &gt;10 mL/s</b>."], [14, "l", 15, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "6 · Instrumental investigations", "<b>Intravesical prostatic protrusion (IPP)</b> <span class=\"key\">≥10 mm</span> is high grade; it predicts need for therapy and a <b>failed trial without catheter (TWOC)</b>. Bladder wall thickness (BWT, 2 mm), detrusor wall thickness (DWT), ultrasound-estimated bladder weight (UEBW), penile cuff test and near-infrared spectroscopy (NIRS) are accurate, but <b>none replaces PFS</b>."], [14, "a", 15, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "7 · Evaluation algorithms", "<p><b>EAU (men ≥40 yr)</b></p><ol>\n<li>History (including sexual), symptom score, examination with DRE, urinalysis, PVR, and PSA if life expectancy &gt;10 yr.</li>\n<li>If DRE, PSA or urinalysis is abnormal, or neurological disease, follow the relevant guideline.</li>\n<li>If not bothersome, no further work-up.</li>\n<li>If PVR is significant, renal ultrasound with or without renal function.</li>\n<li>If bothersome, FVC (storage or nocturia), then prostate ultrasound and uroflow if treating, then the medical algorithm.</li>\n<li>Before surgery, endoscopy if it alters the choice; PFS for specific indications.</li>\n</ol>"], [14, "a", 15, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "7 · Evaluation algorithms", "<p><b>AUA</b></p><ol>\n<li>History, examination, IPSS, urinalysis, with or without PVR and flow.</li>\n<li>If <b>PVR &gt;300 mL</b>, manage as non-neurogenic chronic retention.</li>\n<li>Counsel: behavioural, medical, procedural.</li>\n<li>Reassess at <span class=\"key\">4–12 weeks</span>. If improved, follow up. If nocturia predominates, FVC and a drug. If incomplete, FVC, PVR and flow, urodynamics and cystoscopy, then the OAB pathway, surgery, or both.</li>\n</ol>"], [14, "l", 16, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "8 · Watchful waiting (WW)", "Lifestyle: fluids <span class=\"key\">1.5–2 L/day</span>, none 2 h before bed; less caffeine and evening alcohol; retime diuretics; <b>double voiding</b> and <b>urethral milking</b>; avoid constipation; bladder retraining (suppress urge, target ≥3 h or 200–400 mL)."], [14, "p", 16, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "8 · Watchful waiting (WW)", "Treatment is driven by <b>bother and complicating features</b>, not by score or size alone."], [14, "a", 16, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "9 · Medical therapy: choice", "<p><b>EAU</b></p><ol>\n<li>Not bothersome: WW.</li>\n<li>Nocturnal polyuria: lifestyle with or without desmopressin.</li>\n<li>Storage predominant: antimuscarinic or β3-agonist.</li>\n<li>If <b>PV &gt;40 mL and long-term treatment</b> intended: 5-ARI with or without an α1-blocker or phosphodiesterase-5 inhibitor (PDE5I).</li>\n<li>Otherwise α1-blocker or PDE5I; if storage symptoms remain, add an antimuscarinic or β3-agonist.</li>\n</ol>\n<p><b>AUA</b>: α-blocker (PDE5I if erectile dysfunction, ED) → <b>prostate &gt;30 mL</b> → add 5-ARI → PDE5I trial → surgery.</p>"], [14, "p", 17, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "9 · Medical therapy: choice", "<b>Reading trials</b>: placebo improves scores and flow (a 4-week run-in is ideal); judge by a 3-point or percentage threshold, and Qmax as %. Goals: relieve symptoms, reduce BOO, improve emptying and <b>prevent progression</b>."], [14, "p", 18, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "10 · α1-Blockers", "<b>Titration</b>: α1b blockade causes <b>first-dose hypotension</b> and syncope; a bedtime start and titration avoid it. Uroselective drugs are fixed-dose; doxazosin GITS starts at 4 mg without titration."], [14, "p", 18, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "10 · α1-Blockers", "<b>Intraoperative floppy iris syndrome (IFIS)</b>: <b>billowing iris, iris prolapse, progressive miosis</b>. α1a blockade causes dilator atrophy, so IFIS occurs <b>years after stopping</b>; stopping pre-op does <b>not</b> help. Highest with <b>tamsulosin</b>, then alfuzosin, doxazosin and naftopidil. <span class=\"dag\">†</span>If cataract surgery is awaited, defer the α1-blocker."], [14, "p", 18, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "10 · α1-Blockers", "One efficacy, three toxicities: <b>α1b blockade gives vascular effects</b> (terazosin, doxazosin); <b>α1a blockade affects ejaculation and causes IFIS</b> (silodosin, tamsulosin); <b>α1d blockade gives storage benefit</b> (naftopidil)."], [14, "l", 18, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "11 · 5α-Reductase inhibitors", "<b>Slow</b>: maximum shrinkage at <span class=\"key\">6 months</span>; benefit needs ≥6 months."], [14, "l", 18, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "11 · 5α-Reductase inhibitors", "<b>Volume dependent</b>: best at <span class=\"key\">&gt;40 mL</span> (PLESS PV &gt;55 mL: 70% reduction). Indication: moderate–severe LUTS with PV &gt;40 mL (EAU) or &gt;30 mL (AUA)."], [14, "p", 19, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "11 · 5α-Reductase inhibitors", "5-ARIs treat the gland: slow, volume-dependent and modest for symptoms, but they prevent AUR and surgery, and they halve PSA (both a trap and a tool)."], [14, "p", 19, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "12 · Antimuscarinics", "Antimuscarinics treat the bladder, so every recommendation is anchored to a PVR ceiling (200 mL)."], [14, "l", 19, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "13 · β3-Agonists", "<b>Mirabegron</b> starts at <span class=\"key\">25 mg</span> and rises to <span class=\"key\">50 mg</span>. In BOO, PVR rose only at 100 mg; less dry mouth."], [14, "l", 19, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "13 · β3-Agonists", "AEs: nasopharyngitis, headache, blood pressure rise ≤1 mm Hg. <b>Contraindicated</b> in uncontrolled hypertension <span class=\"key\">≥180/110 mm Hg</span>; QT prolongation at 200 mg; moderate CYP2D6 inhibitor<span class=\"dag\">†</span>."], [14, "l", 20, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "15 · Combination therapy", "<b>Indication</b>: high risk, PV <span class=\"key\">&gt;30–40 mL</span> and PSA <span class=\"key\">&gt;1.5 ng/mL</span>. <b>SMART</b>: stop the α-blocker after 6 months."], [14, "p", 20, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "15 · Combination therapy", "<b>α-blockers prevent symptomatic progression only; 5-ARIs prevent AUR and surgery.</b> The α-blocker gives fast dynamic relief; the 5-ARI gives slow static shrinkage."], [14, "a", 21, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "17 · Follow-up", "<ol>\n<li>Review at <span class=\"key\">4–12 weeks</span> (α-blocker response, AEs).</li>\n<li>Review at <span class=\"key\">6 months</span> (5-ARI).</li>\n<li>Then <b>annually</b>: score, flow, PVR; PSA on a 5-ARI if life expectancy &gt;10 yr. WW: yearly.</li>\n</ol>"], [14, "a", 21, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "18 · Acute urinary retention", "<ol>\n<li>Catheterise (<span class=\"dag\">†</span>suprapubic if urethral fails).</li>\n<li>Start an <b>α1-blocker</b>.</li>\n<li>Do a <b>TWOC at ~3–5 days</b>.</li>\n<li>If he voids, continue (add a 5-ARI for a large gland).</li>\n<li>If he fails, try up to <b>3 TWOCs</b>.</li>\n<li>If AUR recurs or TWOC fails: PFS and surgery <span class=\"xref\">See Ch 151</span>.</li>\n</ol>"], [14, "l", 21, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "18 · Acute urinary retention", "Emergency surgery is more morbid, so TWOC comes first; success ≈ <span class=\"key\">60%</span>; recurrence mostly within <b>6 months</b>."], [14, "l", 21, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "18 · Acute urinary retention", "Failure predictors: age, severe LUTS, drained volume <span class=\"key\">&gt;1 L</span>, spontaneous AUR and high-grade IPP."], [14, "p", 21, "Ch 150 · Evaluation and Nonsurgical Management of Benign Prostatic Hyperplasia", "18 · Acute urinary retention", "<b>The α-blocker rescues the TWOC</b> (dynamic component); <b>the 5-ARI prevents the next episode</b> (static component)."], [14, "p", 23, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "1 · Scope and principles", "Volume predicts progression (acute urinary retention (AUR), surgery) but correlates poorly with symptoms. <b>Symptoms decide whether to operate; size and shape decide which operation.</b> A gland &gt;30 cc triples AUR risk (Olmsted County)."], [14, "l", 23, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "2 · Work-up and indications for surgery", "History, examination, IPSS and urinalysis at baseline (Statement (St) 1); repeat IPSS after treatment (St 3). Bands: <span class=\"key\">0–7 mild, 8–19 moderate, 20–35 severe</span>."], [14, "p", 24, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "3 · Choosing the operation", "Only enucleation spans every size band; only simple prostatectomy joins it above 80 cc. TUIP alone is confined to small glands. Minimally invasive surgical therapies (MISTs) and RWT live in 30–80 cc, so volume and median lobe assessment precede every recommendation."], [14, "l", 24, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "4 · Monopolar TURP (m-TURP): the benchmark", "AUA: TURP for &lt;30 and 30–80 cc (St 28), monopolar or bipolar by expertise (St 29). Monopolar irrigant is non-ionic (water, <span class=\"key\">1.5% glycine</span><span class=\"dag\">†</span>, sorbitol) and <b>hypo-osmolar</b>, which causes TUR syndrome."], [14, "a", 24, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "4 · Monopolar TURP (m-TURP): the benchmark", "<ol>\n<li>Inspect the bladder. If tumour, resect it and defer TURP.</li>\n<li>Identify orifices, neck, trigone, verumontanum (veru), sphincter; if orifices hidden, give indigo carmine or methylene blue.</li>\n<li>Resect median lobe, then lateral lobes, then anterior tissue and apex last.</li>\n<li>Evacuate chips, secure haemostasis, insert a large three-way catheter.</li>\n</ol>"], [14, "l", 25, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "4 · Monopolar TURP (m-TURP): the benchmark", "Even routine TURP absorbs <span class=\"key\">800–1000 mL</span> irrigant. Catheter out at 24–48 h; stool softeners 2–4 weeks; no cycling 4–6 weeks; no sex for ≥2 weeks."], [14, "l", 25, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "4 · Monopolar TURP (m-TURP): the benchmark", "Warn of dysuria for weeks and eschar bleeding at <span class=\"key\">1–4 weeks</span>. Once emptying is confirmed, treat storage symptoms with an antimuscarinic or β3-agonist; detrusor overactivity may take months. Results last about 10 years."], [14, "l", 25, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "5 · TURP complications", "Risk: gland <span class=\"key\">&gt;45 cc</span>, resection <span class=\"key\">&gt;90 min</span>, perforation, irrigant height. Keep the bag at about <span class=\"key\">60 cm</span>, because prostatic venous pressure is only about <span class=\"key\">10 mm Hg</span>. Na<sup>+</sup> <span class=\"key\">&lt;120 mEq/L</span> is severe."], [14, "a", 25, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "5 · TURP complications", "<ol>\n<li>Stop or expedite surgery, secure haemostasis, stop irrigation; send Na<sup>+</sup>.</li>\n<li>If overloaded, give a <span class=\"dag\">†</span>loop diuretic.</li>\n<li>If severe central nervous system signs: <b>3% saline 100 mL</b> (+2–3 mEq/L), repeat ×2 at 10 min (max 300 mL).</li>\n<li>Target +4–6 mEq/L; ≤12 mEq/L in 24 h (≤8–10 if presentation &gt;48 h). Monitor in high dependency.</li>\n</ol>"], [14, "p", 25, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "5 · TURP complications", "Acute post-TURP hyponatraemia is safer to correct than chronic: the brain has not yet shed its organic osmolytes, so osmotic demyelination is less likely. Bipolar saline TURP eliminates TUR syndrome."], [14, "r", 25, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "5 · TURP complications", "<b>Retrograde ejaculation</b> · About <span class=\"key\">two-thirds</span> · Counsel; erection, orgasm, desire unaffected"], [14, "a", 26, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "7 · TUIP", "<ol>\n<li>Use a Collins knife, loop, or holmium/thulium laser.</li>\n<li>Incise at 5 and/or 7 o'clock from distal to the orifice, through the bladder neck, to proximal to the veru.</li>\n<li>Deepen to capsule (with or without fat); cauterise.</li>\n<li>Catheter out and home on day 0–1.</li>\n</ol>"], [14, "p", 26, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "8 · Bipolar TUVP", "Vaporisation trades haemostasis for a coagulated, specimen-free bed. The coagulum causes dysuria and retention; with no anatomical plane, durability is weaker. PVP makes the same trade."], [14, "a", 28, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "11 · HoLEP", "<ol>\n<li>Incise the bladder neck at 5 and 7 o'clock (at 6 o'clock if no median lobe); carry to the veru and enucleate the median lobe.</li>\n<li>Make a perimontanal inverted-U incision; open the apical plane.</li>\n<li>Sweep anteriorly to 11–1 o'clock; incise the apical mucosal strip (no sphincter traction).</li>\n<li>Develop the anterior plane to the neck (\"Baleen\" sign = bladder); release lobes into the bladder.</li>\n<li>Haemostasis with a defocused beam; morcellate via nephroscope; 22 Fr three-way catheter, ~60 mL balloon.</li>\n</ol>"], [14, "l", 28, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "11 · HoLEP", "Retrograde ejaculation in about <span class=\"key\">three-quarters</span>; median-lobe-only HoLEP preserves it in ~90%. Erections are unchanged or improved. Retreatment is rare. Anticoagulated men need slightly longer stay and irrigation; warfarin fares worse than direct oral anticoagulants."], [14, "l", 28, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "13 · MISTs", "PUL typically uses <span class=\"key\">4–6 implants</span>, placed anterolaterally between dorsal veins and neurovascular bundles. Remove encrusted implants with endoscopic graspers."], [14, "p", 29, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "13 · MISTs", "PUL moves tissue; WVTT ablates it. So PUL cannot treat a median lobe but needs no catheter and causes little dysuria, whereas WVTT treats median lobes at the cost of a catheter and weeks of irritation. Both preserve the bladder neck, and so antegrade ejaculation."], [14, "l", 29, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "15 · True MISTs and temporary devices", "<b>iTind (TIPD)</b>: three nitinol struts (12, 5, 7 o'clock) and a 6 o'clock anchor, left <span class=\"key\">5–7 days</span> to cause ischaemic remodelling, then removed via an 18 Fr catheter. St 41: 25–75 cc, no obstructing median lobe. Sham trial: responder end point met, but absolute IPSS difference not significant."], [14, "a", 29, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "16 · Prostate artery embolisation (PAE)", "<ol>\n<li>Femoral access under local anaesthesia; pelvic angiography with the catheter balloon as landmark.</li>\n<li>Pass a 1.9–2.4 Fr microcatheter into the prostatic arteries (mostly from internal pudendal; often duplicated).</li>\n<li>Inject microspheres to stasis; bilateral is better.</li>\n</ol>"], [14, "p", 30, "Ch 151 · Minimally Invasive and Endoscopic Management of Benign Prostatic Hyperplasia", "17 · Overall comparison", "The \"gold standard\" for a given man is the operation that meets his goals safely: a shared decision on bothersome symptoms, size and shape, bleeding risk, ejaculation wishes and surgeon expertise."], [14, "l", 32, "Ch 152 · Simple Prostatectomy: Open, Laparoscopic and Robotic", "1 · Definition and surgical anatomy", "It enucleates only the benign prostatic hyperplasia (BPH) adenoma; gold standard for outlet obstruction with glands <span class=\"key\">&gt;80 g</span>."], [14, "l", 32, "Ch 152 · Simple Prostatectomy: Open, Laparoscopic and Robotic", "1 · Definition and surgical anatomy", "Eponyms <span class=\"tag\">MCQ</span>: <b>Freyer</b>, suprapubic transvesical; <b>Millin (1945)</b>, retropubic; first laparoscopic (Mariano) 2002; first robotic (Sotelo) 2008."], [14, "l", 32, "Ch 152 · Simple Prostatectomy: Open, Laparoscopic and Robotic", "2 · Indications", "Gland <span class=\"key\">&gt;80–100 g</span> with bothersome lower urinary tract symptoms (LUTS) refractory to medical or endoscopic therapy."], [14, "p", 32, "Ch 152 · Simple Prostatectomy: Open, Laparoscopic and Robotic", "3 · Pre-operative evaluation", "Work-up asks three questions. Is the gland big enough (TRUS)? Is there cancer (digital rectal examination, PSA, MRI)? Will the bladder empty (urodynamics)?"], [14, "p", 33, "Ch 152 · Simple Prostatectomy: Open, Laparoscopic and Robotic", "4 · Open techniques", "Every open variant: enter, find the pseudocapsular plane, divide the urethra at the apex <b>proximal to the verumontanum</b> without pulling on the sphincter, then 5/7 o'clock haemostasis with bladder neck mucosal advancement."], [14, "a", 33, "Ch 152 · Simple Prostatectomy: Open, Laparoscopic and Robotic", "5 · Haemostasis", "<ol>\n<li>Catheter traction (50 mL balloon), with or without continuous bladder irrigation (CBI); exclude coagulopathy.</li>\n<li>If bleeding continues, evacuate clot endoscopically and fulgurate.</li>\n<li>If severe, reopen the fossa.</li>\n</ol>"], [14, "a", 34, "Ch 152 · Simple Prostatectomy: Open, Laparoscopic and Robotic", "7 · Laparoscopic and robotic", "<ol>\n<li>Vertical cystotomy; identify orifices.</li>\n<li>Incise the bladder neck 3→9 o'clock under the median lobe; develop the <b>posterior plane</b> to the apex, then the lobes.</li>\n<li>Divide the anterior commissure, see the veru, and transect the urethra <b>just proximal to the veru</b>.</li>\n<li>Place 5/7 barbed sutures; do <b>vesicourethral mucosal advancement</b> (double-armed suture from 6 o'clock); close in two layers.</li>\n</ol>"], [14, "p", 34, "Ch 152 · Simple Prostatectomy: Open, Laparoscopic and Robotic", "8 · Outcomes and comparisons", "Minimally invasive routes improve only perioperative morbidity; function is identical because enucleation is identical. Open transfusion is now <span class=\"key\">&lt;5%</span>."], [14, "r", 34, "Ch 152 · Simple Prostatectomy: Open, Laparoscopic and Robotic", "9 · Complications", "Bladder neck contracture · Open <span class=\"key\">2–6%</span>; minimally invasive &lt;1% · Dilation or Collings knife incision to 22 Fr"], [14, "r", 34, "Ch 152 · Simple Prostatectomy: Open, Laparoscopic and Robotic", "9 · Complications", "Erectile dysfunction · <span class=\"key\">3–5%</span> · —"], [14, "r", 34, "Ch 152 · Simple Prostatectomy: Open, Laparoscopic and Robotic", "9 · Complications", "<b>Retrograde ejaculation</b> · <span class=\"key\">80–90%</span> · Counsel pre-op"], [14, "p", 35, "Ch 152 · Simple Prostatectomy: Open, Laparoscopic and Robotic", "9 · Complications", "The adenoma lies inside the pseudocapsule and proximal to the veru. Removal loses the bladder neck (retrograde ejaculation) but spares sphincter and NVBs, so incontinence and ED are rare."], [14, "a", 36, "★ Putting it together: the BPH pathway", "A · Man with LUTS", "<p><b>1. Assess:</b> International Prostate Symptom Score (IPSS: 0–7 mild, 8–19 moderate, 20–35 severe), digital rectal examination, urinalysis, PSA if it changes management, voiding diary if nocturia; uroflow and post-void residual (PVR) before intervention <span class=\"xref\">(see Ch 150)</span>.</p>\n<p><b>2. If complications, operate:</b> refractory retention, recurrent UTI, stones, prostatic haematuria, renal impairment.</p>\n<p><b>3. If mild</b>, watchful waiting. <b>4. If bothersome</b>, drugs (B); if they fail, a procedure (C).</p>"], [14, "p", 37, "★ Putting it together: the BPH pathway", "D · TURP complications", "TUR syndrome (glycine absorption) causes confusion, visual change and hyponatraemia. Stop, check sodium, give a diuretic if overloaded and 3% saline if severe, and correct slowly; bipolar prevents it. Late: retrograde ejaculation (~two-thirds), stricture (meatus, bulb), bladder neck contracture (small gland, over-resection; ~6 months), and incontinence (pelvic floor exercises, then sling or AUS) <span class=\"xref\">(see Ch 151)</span>."], [15, "l", 2, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "1 · Epidemiology — the headline", "It is the <b>second commonest</b> non-skin cancer and the <b>fifth</b> cause of cancer death in men; 2020 saw ≈ <span class=\"key\">1.4 million cases, 375,000 deaths</span>."], [15, "l", 2, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "1 · Epidemiology — the headline", "Incidence varies ~13-fold (South Central Asia lowest, Northern Europe highest). US lifetime risk is ≈ <span class=\"key\">1 in 8</span>. 5-year survival is 97%, yet it is the second cause of cancer death in US men."], [15, "l", 2, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "1 · Epidemiology — the headline", "<b>Incidence and mortality are decoupled.</b> Incidence follows screening and wealth. Mortality peaks where African ancestry meets poor access: the <b>Caribbean has the highest mortality in the world</b> <span class=\"tag\">MCQ</span>. Asia is lowest on both but rising."], [15, "l", 2, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "1 · Epidemiology — the headline", "<b>Latent (autopsy) cancer</b> is ~5% under 30 y, 29% at 60–69 and <span class=\"key\">59% &gt;79 y</span>. It is higher in Black men at every age."], [15, "p", 2, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "1 · Epidemiology — the headline", "Aetiology is hard to study: in a prostate-specific antigen (PSA)-screened population a diagnosis mostly means a man \"happened to have a PSA test\", so risk-factor studies may find determinants of <i>being tested</i>. The preferred end point is <b>aggressive disease</b> (advanced, metastatic, death). <b>Healthy-user bias</b>: health-conscious men seek PSA tests, so healthy habits falsely seem to raise incidence while lowering mortality."], [15, "l", 2, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "2 · Established risk factors", "<b>Race</b>: Black men have the highest incidence (172.6/100,000 in the US) and <span class=\"key\">twice</span> the cancer-specific mortality of White men. They present younger and more metastatic."], [15, "l", 2, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "2 · Established risk factors", "<b>Family history</b> is present in ~20%. Twin-study heritability is up to <span class=\"key\">58%</span>, so genes outweigh shared lifestyle."], [15, "r", 2, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "2 · Established risk factors", "Both father and brother · <span class=\"key\">9×</span>"], [15, "l", 4, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "5 · Possible risk factors — body, metabolism, lifestyle", "<b>Adult serum testosterone does <i>not</i> predict risk</b> <span class=\"tag\">MCQ</span>. Genetically higher free testosterone, IGF-1 and early puberty modestly do."], [15, "l", 4, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "5 · Possible risk factors — body, metabolism, lifestyle", "A <b>composite healthy lifestyle</b> means <span class=\"key\">30–50%</span> less lethal cancer. In the highest polygenic-risk quartile, lifetime lethal risk falls from 5.3% to 1.6%."], [15, "l", 4, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "5 · Possible risk factors — body, metabolism, lifestyle", "Transgender women on oestrogen have a median PSA ≈ <span class=\"key\">0.02 ng/mL</span> (50-fold lower), so cut-points must be lowered."], [15, "p", 4, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "6 · Supplements", "Vitamin E worked in the Alpha-Tocopherol, Beta-Carotene (ATBC) trial but failed in SELECT: ATBC used a tenfold lower dose in <b>heavy smokers</b> with little PSA screening (aggressive cancers); SELECT used 400 IU in non-smokers with widespread screening (indolent cancers). Different disease, different answer."], [15, "p", 5, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "7 · Chemoprevention", "Cardiovascular disease kills more men with non-metastatic prostate cancer than the cancer does, so lifestyle advice benefits both."], [15, "l", 5, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "8 · PSA screening", "Screening lowers cancer death ~<span class=\"key\">20–30%</span>, and the benefit builds with time."], [15, "r", 5, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "9 · Landmark trials", "<b>PCPT</b> (Prostate Cancer Prevention Trial) · 18,882, PSA ≤3; finasteride 5 mg 7 y · Cancer fell <span class=\"key\">24.8%</span> (18.4 vs 24.4%); Gleason 7–10 6.4 vs 5.1%; 18-y death fell 25% (not significant) · Fewer cancers, more high-grade"], [15, "r", 5, "Ch 153 · Epidemiology, Aetiology and Prevention of Prostate Cancer", "9 · Landmark trials", "<b>REDUCE</b> · PSA 2.5–10, prior negative biopsy; dutasteride 0.5 mg 4 y · Cancer fell <span class=\"key\">22.8%</span>; Gleason 8–10 0.9 vs 0.6% (years 3–4: 12 vs 1) · FDA warning"], [15, "l", 7, "Ch 154 · Prostate Cancer Biomarkers", "2 · PSA biology", "PSA is <b>hK3</b> (gene KLK3 on <b>19q13</b>), an androgen-regulated serine protease that <b>liquefies semen</b> by cleaving semenogelin. Half-life is <span class=\"key\">2–3 days</span>."], [15, "l", 7, "Ch 154 · Prostate Cancer Biomarkers", "2 · PSA biology", "After biopsy the rise lasts ≥<span class=\"key\">4 weeks</span>; cycling &gt;55 km adds ~10%; ejaculation raises it for 24 h, so repeat after abstinence."], [15, "l", 7, "Ch 154 · Prostate Cancer Biomarkers", "2 · PSA biology", "<b>5α-reductase inhibitors (5ARIs)</b> lower PSA ~<span class=\"key\">50%</span> by 12 months, so <b>double</b> it. This overestimates in the first 6 months and underestimates after years."], [15, "r", 7, "Ch 154 · Prostate Cancer Biomarkers", "3 · PSA derivatives", "<b>PSA density</b> · PSA ÷ volume; cut-off <span class=\"key\">0.15</span> (0.08–0.15) · After negative/equivocal magnetic resonance imaging (MRI); ≤0.15 = Johns Hopkins AS entry; predicts AS reclassification"], [15, "p", 8, "Ch 154 · Prostate Cancer Biomarkers", "3 · PSA derivatives", "%fPSA was validated against <i>any</i> cancer, not GG ≥2, so it overestimates significant risk. Risk calculators (PCPT, Prostate Biopsy Collaborative Group) include it."], [15, "r", 8, "Ch 154 · Prostate Cancer Biomarkers", "4 · Blood and urine tests (NCCN 2023 pre-biopsy)", "<b>4Kscore</b> · Blood: tPSA, fPSA, iPSA and <b>hK2</b>, with age, DRE, prior biopsy · <span class=\"key\">7.5%</span>: sensitivity 94%, negative predictive value (NPV) 95%; ≤7.5% = low long-term metastasis risk"], [15, "l", 8, "Ch 154 · Prostate Cancer Biomarkers", "4 · Blood and urine tests (NCCN 2023 pre-biopsy)", "<b>TMPRSS2:ERG</b> is <span class=\"key\">~100% specific</span> but in only ~half of tumours, so it is combined with PCA3."], [15, "p", 8, "Ch 154 · Prostate Cancer Biomarkers", "4 · Blood and urine tests (NCCN 2023 pre-biopsy)", "Urine tests follow a DRE because cancer RNA comes only from shed cells massaged into the urethra. ExoDx avoids this, as exosomes are shed spontaneously. Urinary markers are highly specific; their weakness is coverage, hence panels."], [15, "a", 9, "Ch 154 · Prostate Cancer Biomarkers", "7 · Clinical algorithm", "<ol>\n<li><b>Raised PSA</b>: repeat it, excluding infection, instrumentation, ejaculation and 5ARI. Then do MRI and/or a biomarker (PHI, 4Kscore, IsoPSA, SelectMDx, EPI, MPS; PSA density). If risk is high, biopsy.</li>\n<li><b>Negative biopsy, persistent suspicion</b>: MRI, %fPSA, PCA3/EPI/MPS (repeat thresholds), ConfirmMDx. If positive, targeted re-biopsy.</li>\n<li><b>Favourable-risk</b>: PSA density and Prolaris/Oncotype/Decipher decide AS vs treatment.</li>\n<li><b>After RP</b>: <span class=\"dag\">†</span> PSA should be undetectable. If ≥0.2 ng/mL and confirmed, this is biochemical recurrence; then Decipher/PORTOS guides adjuvant or salvage radiotherapy.</li>\n</ol>"], [15, "l", 10, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "1 · Indications and contraindications", "<b>Initial</b> biopsy also follows cancer found at transurethral resection. <b>Repeat</b> biopsy: rising prostate-specific antigen (PSA); atypical small acinar proliferation (ASAP; <span class=\"key\">≈50%</span> cancer risk); atypical intraductal proliferation; positive PCA3 or ConfirmMDx; suspicious MRI; recurrence after ablation; active surveillance (AS)."], [15, "l", 10, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "1 · Indications and contraindications", "PSA density <span class=\"key\">&gt;0.15 ng/mL/cc</span> suggests cancer. Volume = π/6 × transverse × anteroposterior × length (1 cm³ ≈ 1 g)."], [15, "p", 11, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "2 · Pre-biopsy mpMRI", "DCE never creates or downgrades PI-RADS 4–5 and never upgrades a TZ lesion. mpMRI misses a minority of significant cancers (mostly 3+4): MRI-invisible lesions, reader discordance, registration or needle error, small lesion in a large gland. So systematic cores remain relevant."], [15, "l", 11, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "5 · Antibiotic prophylaxis", "Every transrectal patient gets prophylaxis. AUA 2019: fluoroquinolone; 1st/2nd-generation cephalosporin with or without aminoglycoside; or 3rd-generation cephalosporin. Give ≥1 h before, for <span class=\"key\">≤24 h</span>."], [15, "l", 11, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "5 · Antibiotic prophylaxis", "Infection risk factors: antibiotics within <span class=\"key\">6 months</span> (most consistent), diabetes, immunosuppression, prior UTI or biopsy infection, many prior biopsies, travel (India, South-East Asia), health-care work, rectal resistant <i>E. coli</i>. They need augmented or swab-targeted prophylaxis, or TP."], [15, "r", 12, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "7 · Complications and management", "Sepsis · <span class=\"key\">0.3–3.1%</span> · Carbapenem until cultures"], [15, "a", 12, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "7 · Complications and management", "<ol>\n<li><b>Post-biopsy fever</b>: assess for sepsis and take cultures.</li>\n<li>Give <b>no empirical fluoroquinolone</b>: <i>E. coli</i> is resistant (also to co-trimoxazole, ampicillin). Start a carbapenem (or amikacin/3rd-generation cephalosporin by sensitivity) and resuscitate.</li>\n</ol>"], [15, "a", 12, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "7 · Complications and management", "<ol>\n<li><b>Persistent rectal bleeding</b>: apply pressure.</li>\n<li>If it continues, tamponade (sheath or Foley balloon). If still bleeding: endoscopy with adrenaline/sclerosant, then angioembolisation, then transrectal suture.</li>\n</ol>"], [15, "p", 12, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "7 · Complications and management", "Commonest complication: bleeding overall; infection among serious ones and admissions (1.0% rising to 4.1% in the resistance era). Frequent-trivial vs rare-dangerous explains universal prophylaxis and the move to the perineum."], [15, "a", 13, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "8 · Repeat and saturation biopsy", "<ol>\n<li>Cancer yield on successive biopsies in the European Randomized Study of Screening for Prostate Cancer (ERSPC): <span class=\"key\">22% → 10% → 5% → 4%</span>.</li>\n</ol>"], [15, "m", 13, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "10 · MCQ one-liners", "Commonest false-positive hypoechoic lesion: benign prostatic hyperplasia (BPH) foci and prostatitis."], [15, "m", 13, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "10 · MCQ one-liners", "Significant cancer in PROMIS: Grade Group ≥3 or core length ≥6 mm."], [15, "m", 13, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "10 · MCQ one-liners", "Absent seminal vesicle: ipsilateral renal agenesis in 79%."], [15, "m", 13, "Ch 155 · Prostate Biopsy: Techniques and Imaging", "10 · MCQ one-liners", "Müllerian cysts are midline; wolffian cysts are lateral."], [15, "l", 14, "Ch 156 · Pathology of Prostatic Neoplasia", "1 · Precursor and intraductal lesions", "~<span class=\"key\">20%</span> of high-grade prostatic intraepithelial neoplasia (HGPIN) carries the <b>TMPRSS2:ERG</b> fusion. Isolated HGPIN (unifocal or multifocal, or on transurethral resection (TUR)) needs no repeat biopsy once multiparametric magnetic resonance imaging (mpMRI), digital rectal examination (DRE) and prostate-specific antigen (PSA) are weighed."], [15, "l", 14, "Ch 156 · Pathology of Prostatic Neoplasia", "1 · Precursor and intraductal lesions", "<b>Intraductal carcinoma of the prostate (IDC-P)</b> shows atypia beyond HGPIN (dense cribriform) with <b>basal cells retained</b>. It is usually <b>retrograde spread of high-grade invasive cancer</b>. Prevalence rises from ~2% in low risk to &gt;50% in metastatic disease. It independently predicts early biochemical recurrence (BCR). Grade Group (GG) 1 with IDC-P is upgraded at radical prostatectomy (RP) in <span class=\"key\">&gt;80%</span>. Strict (Guo–Epstein) criteria permit definitive therapy without proven invasion."], [15, "p", 14, "Ch 156 · Pathology of Prostatic Neoplasia", "1 · Precursor and intraductal lesions", "HGPIN is a weak risk marker; IDC-P usually marks high-grade cancer already present. Traps: re-biopsy for HGPIN; surveillance for GG1 with IDC-P."], [15, "l", 14, "Ch 156 · Pathology of Prostatic Neoplasia", "2 · Adenocarcinoma: location, spread, staging", "<b>Zones (McNeal)</b>: <span class=\"dag\">†</span>peripheral zone (PZ): ~70% of gland and of cancers, including the main mass in T2 and <span class=\"key\">85%</span> of T1c; posterolateral and palpable."], [15, "l", 15, "Ch 156 · Pathology of Prostatic Neoplasia", "2 · Adenocarcinoma: location, spread, staging", "EPE is uncommon below <span class=\"key\">0.5 cm³</span>; nodes and SVI are uncommon below <span class=\"key\">4 cm³</span>."], [15, "r", 15, "Ch 156 · Pathology of Prostatic Neoplasia", "3 · Grading: Gleason and grade groups", "1 · 3+3 · 0% · <span class=\"key\">96%</span>"], [15, "r", 15, "Ch 156 · Pathology of Prostatic Neoplasia", "3 · Grading: Gleason and grade groups", "2 · 3+4 · 0.6% · <span class=\"key\">88%</span>"], [15, "r", 15, "Ch 156 · Pathology of Prostatic Neoplasia", "3 · Grading: Gleason and grade groups", "3 · 4+3 · 4.3% · <span class=\"key\">63%</span>"], [15, "r", 15, "Ch 156 · Pathology of Prostatic Neoplasia", "3 · Grading: Gleason and grade groups", "4 · 4+4, 3+5, 5+3 · — · <span class=\"key\">48%</span>"], [15, "r", 15, "Ch 156 · Pathology of Prostatic Neoplasia", "3 · Grading: Gleason and grade groups", "5 · 9–10 · — · <span class=\"key\">26%</span>"], [15, "p", 15, "Ch 156 · Pathology of Prostatic Neoplasia", "3 · Grading: Gleason and grade groups", "The steep drop is between GG2 and GG3: never lump them as \"7\". 3+5 and 5+3 are GG4; GG5 starts at 9. Pure GG1 cannot metastasise, so calling it \"cancer\" is debated."], [15, "p", 16, "Ch 156 · Pathology of Prostatic Neoplasia", "3 · Grading: Gleason and grade groups", "<span class=\"dag\">†</span>Cribriform pattern and IDC-P mark aggressive disease and argue against AS even in GG2, so they must be reported. Aggregate grading of a targeted lesion avoids under-grading (one core) and over-grading (highest core)."], [15, "r", 16, "Ch 156 · Pathology of Prostatic Neoplasia", "3 · Grading: Gleason and grade groups", "Biopsy GG1, then RP · ~<span class=\"key\">⅓</span> upgraded"], [15, "l", 16, "Ch 156 · Pathology of Prostatic Neoplasia", "4 · Needle biopsy assessment", "<b>Atypical small acinar proliferation (ASAP)</b>: ~5% of biopsies; cancer follows in ~<span class=\"key\">40%</span> (PSA does not stratify), ~80% GG1 and ~5% GG4–5. Get <b>expert review before re-biopsy</b>, then re-biopsy the atypical site."], [15, "p", 16, "Ch 156 · Pathology of Prostatic Neoplasia", "4 · Needle biopsy assessment", "Sampling error is one-directional: a bad biopsy is believed, a good one is provisional, and an atypical one is re-examined before it is repeated."], [15, "l", 17, "Ch 156 · Pathology of Prostatic Neoplasia", "5 · TUR and RP specimens", "<b>EPE</b>: focal vs nonfocal extent predicts progression. <b>SVI</b> carries <span class=\"key\">65%</span> 5-yr progression."], [15, "l", 17, "Ch 156 · Pathology of Prostatic Neoplasia", "5 · TUR and RP specimens", "<b>Margins</b> are positive in ~15% (robotic); only ~50% progress. Distance to ink is irrelevant. Report <b>extent (focal vs nonfocal, <span class=\"key\">3 mm</span>) and grade at the margin</b>."], [15, "l", 19, "Ch 157 · Diagnosis and Staging of Prostate Cancer", "3 · DRE and PSA", "PSA is lowered by hypogonadism, obesity, statins, 5α-reductase inhibitors (5-ARIs) and benign prostatic hyperplasia (BPH) surgery. On a 5-ARI (finasteride 1 or 5 mg, dutasteride), <span class=\"key\">double PSA</span> after ≥12 months, or treat the nadir as the new baseline."], [15, "p", 20, "Ch 157 · Diagnosis and Staging of Prostate Cancer", "4 · Staging: TNM (AJCC 8th, 2017)", "T1 is defined by how the cancer was <b>found</b>, T2 by what is <b>felt</b>. Traps: SVI is T3b; non-regional nodes are M1a; a biopsy-found impalpable cancer is T1c even if bilateral; clinical T is set by DRE, not imaging."], [15, "l", 20, "Ch 157 · Diagnosis and Staging of Prostate Cancer", "5 · Predicting extent and risk", "<b>PSA</b> cannot stage an individual. Organ-confined: ≈80% at PSA &lt;4, 66% at 4–10, &lt;50% above 10. Nodes: ≈20% at PSA &gt;20 and <span class=\"key\">75% at &gt;50</span>."], [15, "p", 21, "Ch 157 · Diagnosis and Staging of Prostate Cancer", "6 · Staging imaging and nodes", "Imaging yield follows pre-test probability. In low-risk men most positive scans are false positives, which lead to more tests, anxiety and wrongly denied cure."], [15, "r", 21, "Ch 157 · Diagnosis and Staging of Prostate Cancer", "7 · Landmark trials", "ERSPC · European screening randomised trial, from 1993 · <span class=\"key\">20% relative reduction</span> in cancer death at 16 y · Saves lives, at the cost of overdiagnosis"], [15, "m", 21, "Ch 157 · Diagnosis and Staging of Prostate Cancer", "8 · MCQ one-liners", "Finasteride 1 mg lowers PSA as much as 5 mg."], [15, "p", 22, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "1 · The modern question: timing as well as modality", "Cancer mortality is always weighed against competing mortality. A competing risk argues against treatment only when it will act <i>before</i> the cancer does."], [15, "l", 22, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "2 · Host evaluation", "In the Prostate Cancer Outcomes Study (PCOS), 10-year prostate cancer mortality was <span class=\"key\">3–18%</span> by risk, but other-cause mortality was <span class=\"key\">≥33%</span> with any comorbidity."], [15, "l", 22, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "2 · Host evaluation", "The automated <b>Care Assessment Needs (CAN) score</b> (Veterans Health Administration) best predicts 5-year survival <span class=\"tag\">MCQ</span>."], [15, "r", 23, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "2 · Host evaluation", "Prior transurethral resection (TUR) defect · Surgery · Brachytherapy dosimetry is hard; incontinence increases. Do TURP <i>before</i> RT and delay EBRT <span class=\"key\">6–8 weeks</span>"], [15, "r", 23, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "3 · Risk stratification", "Very low · <b>All</b>: T1c; grade group (GG) 1; prostate-specific antigen (PSA) &lt;10; &lt;3 positive cores, ≤50% each; PSA density &lt;<span class=\"key\">0.15</span> · Not indicated"], [15, "p", 23, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "3 · Risk stratification", "Favourable groups need ALL criteria; adverse groups ANY one. PSA density appears only in very low risk; GG3 alone makes intermediate unfavourable. AUA/ASTRO/SUO use very low/low/intermediate/high without substratification."], [15, "l", 23, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "3 · Risk stratification", "<b>proPSMA</b> (302 high-risk men): PSMA PET had accuracy <span class=\"key\">92% vs 65%</span> and sensitivity 85% vs 38% over conventional imaging. A negative scan cannot exclude small nodes."], [15, "l", 24, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "4 · Observation vs active surveillance", "Limitations are <span class=\"key\">25–45%</span> occult high grade on systematic biopsy, declining adherence and no agreed triggers. <span class=\"xref\">See Ch 159</span>"], [15, "r", 24, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "6 · Landmark trials", "<b>SPCG-4</b> · RP vs WW; 695; pre-PSA; ~90% palpable · 23.2 yr: cancer deaths 63 vs 99, relative risk (RR) <span class=\"key\">0.56</span>; absolute 11%; NNT <span class=\"key\">8</span>; most benefit &lt;65 (RR 0.45), intermediate risk · Benefit in younger men with intermediate risk"], [15, "r", 24, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "6 · Landmark trials", "<b>ProtecT</b> · 1643 screen-detected, 50–69; monitoring vs RP vs RT with 3–6 mo ADT; 77% low risk · 15-yr cancer mortality <span class=\"key\">2.7% vs 2.2% vs 2.9%</span> (P = 0.53); more metastasis with monitoring; 60% of monitored treated by 15 yr · AS safe in favourable risk; RP equals RT"], [15, "p", 24, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "6 · Landmark trials", "Trials show little benefit because competing mortality and low-risk enrolment dilute the effect; benefit appears only in younger intermediate-risk men with long follow-up. ProtecT expected 15% mortality but saw ~1% at 10 years."], [15, "p", 25, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "7 · Functional outcomes compared", "Surgery front-loads urinary and sexual harm that partly recovers; radiation spares early function but adds bowel toxicity and slow decline. Curves converge by 15 years, so the choice is <i>when and where</i> the patient accepts harm."], [15, "a", 25, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "9 · Stepwise decision algorithm", "<ol>\n<li><b>Treat or not?</b> Weigh disease (grade, stage, genomics, family history) and host (age, comorbidity, longevity, preference). If longevity is short, then WW; if very low/low or selected favourable intermediate, then AS.</li>\n<li><b>Partial or whole gland?</b> Weigh focality, size, grade, potency, LUTS. If limited-focality intermediate risk, then focal ablation, ideally in a trial. <span class=\"xref\">See Ch 163</span></li>\n<li><b>Surgery, radiation or whole-gland ablation?</b> Compare outcomes, toxicities, baseline function and risk of secondary treatment.</li>\n<li><b>Delivery:</b> open vs robotic RP, node dissection, surgeon; or EBRT vs brachytherapy, fractionation, ADT. <span class=\"xref\">See Ch 162</span></li>\n</ol>"], [15, "l", 26, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "9 · Stepwise decision algorithm", "<b>Whole-gland ablation:</b> long-term data are scant, and fibrosis hampers salvage surgery. Cryoablation almost always causes ED. HIFU (high-intensity focused ultrasound) preserves function better, but retreatment is <span class=\"key\">29–38%</span>."], [15, "m", 26, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "10 · MCQ one-liners", "Early divergence of RP vs RT survival curves in observational studies indicates selection bias."], [15, "m", 26, "Ch 158 · Active Management Strategies for Localised Prostate Cancer", "10 · MCQ one-liners", "Brachytherapy, not EBRT, causes the worst acute obstructive/irritative symptoms."], [15, "l", 27, "Ch 159 · Active Surveillance of Prostate Cancer", "1 · Rationale: overdiagnosis", "<b>Latent reservoir</b>: autopsy cancer prevalence roughly equals age as a percentage. Prostate-specific antigen (PSA) testing and biopsy detect cancer in 15–25%, yet lifetime risk of cancer death is only <span class=\"key\">3%</span>."], [15, "p", 27, "Ch 159 · Active Surveillance of Prostate Cancer", "2 · AS versus watchful waiting", "AS defers curative intent; WW abandons it. Life expectancy, not grade, chooses between them."], [15, "l", 27, "Ch 159 · Active Surveillance of Prostate Cancer", "3 · Biology of grade group 1", "True grade progression is ~<span class=\"key\">1–2% per year</span>, mostly in high-volume Gleason 6, so follow-up must be long term."], [15, "l", 27, "Ch 159 · Active Surveillance of Prostate Cancer", "3 · Biology of grade group 1", "Deaths in low-risk series come from <b>occult higher grade</b> missed at biopsy, present in ~<span class=\"key\">30%</span> after systematic biopsy (85% of it 3+4)."], [15, "p", 28, "Ch 159 · Active Surveillance of Prostate Cancer", "3 · Biology of grade group 1", "The main hazard of AS is <b>sampling error at entry</b>, not biology over time (\"wolf in sheep's clothing\"). First job: get the entry grade right."], [15, "l", 28, "Ch 159 · Active Surveillance of Prostate Cancer", "4 · Patient selection", "<b>Toronto</b> is inclusive (all Gleason 6 and selected intermediate; ~50% eligible). Its 15-yr cancer mortality is <span class=\"key\">5%</span> actuarial (1.5% actual)."], [15, "l", 28, "Ch 159 · Active Surveillance of Prostate Cancer", "4 · Patient selection", "<b>Johns Hopkins</b> is restrictive (Epstein very low; ~20% eligible), with 15-yr cancer mortality of <span class=\"key\">0.5%</span>."], [15, "a", 29, "Ch 159 · Active Surveillance of Prostate Cancer", "5 · Monitoring protocol", "<ol>\n<li>At diagnosis, obtain mpMRI.</li>\n<li>Do a <b>confirmation biopsy</b> (systematic + targeted) within 1–3 yr.</li>\n<li>Check PSA 6-monthly, digital rectal examination (DRE) every 1–2 yr and MRI ≤ every 18–24 months.</li>\n<li>Repeat biopsy every 3–5 yr while stable.</li>\n<li>If a trigger appears, then give definitive therapy; if life expectancy falls, then switch to WW.</li>\n</ol>"], [15, "p", 29, "Ch 159 · Active Surveillance of Prostate Cancer", "5 · Monitoring protocol", "Grade triggers treatment; volume and PSA trigger investigation. 10–15% leave AS by choice (anxiety) without a trigger."], [15, "p", 31, "Ch 160 · Open Radical Prostatectomy", "1 · Principles", "The order of goals settles every intraoperative trade-off: when nerve sparing and a clear margin conflict, the margin wins."], [15, "l", 31, "Ch 160 · Open Radical Prostatectomy", "2 · Surgical anatomy", "Inferior vesical urethral branches enter at the bladder neck (<span class=\"key\">5 and 7 o'clock</span> pedicles); capsular branches mark the cavernous nerves."], [15, "l", 31, "Ch 160 · Open Radical Prostatectomy", "2 · Surgical anatomy", "The pelvic plexus combines parasympathetic <span class=\"key\">S2–S4</span> and hypogastric sympathetic fibres. It lies beside the rectum, <span class=\"key\">5–11 cm</span> from the anal verge, centred on the seminal vesicle tip."], [15, "p", 31, "Ch 160 · Open Radical Prostatectomy", "2 · Surgical anatomy", "Nerves and vessels run between levator and prostatic fascia. Leaving prostatic fascia on the gland and Denonvilliers fascia on its back lets nerve sparing and clear margins coexist."], [15, "l", 32, "Ch 160 · Open Radical Prostatectomy", "3 · Selection and preoperative care", "<b>Defer surgery <span class=\"key\">6 weeks after biopsy</span> and <span class=\"key\">12 weeks after TURP</span></b>, so haematoma settles."], [15, "a", 32, "Ch 160 · Open Radical Prostatectomy", "4 · Retropubic RP — operative steps", "<ol>\n<li>Lower midline extraperitoneal incision; pelvic lymph node dissection (PLND).</li>\n<li>Open endopelvic fascia; divide puboprostatic ligaments.</li>\n<li>Control and divide the DVC, then the urethra and posterior sphincter.</li>\n<li>Release the NVBs; divide pedicles, bladder neck and seminal vesicles.</li>\n<li>Reconstruct the bladder neck and make the anastomosis.</li>\n</ol>"], [15, "p", 33, "Ch 160 · Open Radical Prostatectomy", "4 · Retropubic RP — operative steps", "Every step does one of three jobs: absolute venous control before the apex; the right fascia on the specimen; no traction or heat on the NVB."], [15, "l", 34, "Ch 160 · Open Radical Prostatectomy", "8 · Postoperative complications", "Mortality is <span class=\"key\">0.2%</span>. <b>Delayed haemorrhage</b> needs <b>early exploration and evacuation</b>, which shortens stay."], [15, "l", 34, "Ch 160 · Open Radical Prostatectomy", "8 · Postoperative complications", "<b>Thromboembolism</b> is the major cause of death. It is highest with PLND and peaks at <span class=\"key\">14–28 days</span>. Use compression and early ambulation; treat with low-molecular-weight heparin (LMWH)."], [15, "p", 34, "Ch 160 · Open Radical Prostatectomy", "8 · Postoperative complications", "Most late complications trace to the pelvic haematoma: it distracts the anastomosis (contracture, incontinence) and inflames the NVBs. Hence early re-exploration, clips near the bundles and a peritoneal window."], [15, "p", 36, "Ch 161 · Laparoscopic and Robotic-Assisted Laparoscopic Radical Prostatectomy and Pelvic Lymphadenectomy", "1 · Background", "The robot did not change the operation; it removed the suturing barrier. Surgical anatomy (dorsal venous complex [DVC], neurovascular bundle [NVB], fasciae, sphincter) is as in open surgery. <span class=\"xref\">See Ch 160</span>"], [15, "l", 36, "Ch 161 · Laparoscopic and Robotic-Assisted Laparoscopic Radical Prostatectomy and Pelvic Lymphadenectomy", "2 · Patient selection", "Multiparametric MRI (mpMRI) for extracapsular extension (ECE) has specificity <span class=\"key\">0.88</span> and sensitivity <span class=\"key\">0.61</span>; it guides nerve sparing."], [15, "l", 37, "Ch 161 · Laparoscopic and Robotic-Assisted Laparoscopic Radical Prostatectomy and Pelvic Lymphadenectomy", "4 · Access", "Place the camera port <span class=\"key\">15–17 cm</span> from the symphysis; insufflate to 12–15 mm Hg."], [15, "a", 37, "Ch 161 · Laparoscopic and Robotic-Assisted Laparoscopic Radical Prostatectomy and Pelvic Lymphadenectomy", "5 · Operative steps (transperitoneal anterior RALRP)", "<ol>\n<li>Drop the bladder (Retzius); open the endopelvic fascia; ligate the DVC.</li>\n<li>Divide the bladder neck; free the seminal vesicles and vasa.</li>\n<li>Develop the posterior (Denonvilliers) plane; control pedicles and release the NVBs.</li>\n<li>At the apex, divide the DVC and urethra; inspect the specimen.</li>\n<li>Do pelvic lymph node dissection (PLND); entrap the specimen.</li>\n<li>Posterior reconstruction, anastomosis, extraction.</li>\n</ol>"], [15, "l", 37, "Ch 161 · Laparoscopic and Robotic-Assisted Laparoscopic Radical Prostatectomy and Pelvic Lymphadenectomy", "5 · Operative steps (transperitoneal anterior RALRP)", "Divide anteriorly in the midline, lift the catheter, inspect for median lobe and orifices, then divide the posterior neck angled <span class=\"key\">45°</span> downward."], [15, "l", 38, "Ch 161 · Laparoscopic and Robotic-Assisted Laparoscopic Radical Prostatectomy and Pelvic Lymphadenectomy", "7 · Pelvic lymph node dissection", "European Association of Urology (EAU) 2021: nomogram risk <span class=\"key\">&gt;5%</span>. AUA/American Society for Radiation Oncology (ASTRO) 2022: risk-stratified by nomogram."], [15, "l", 38, "Ch 161 · Laparoscopic and Robotic-Assisted Laparoscopic Radical Prostatectomy and Pelvic Lymphadenectomy", "7 · Pelvic lymph node dissection", "<b>Lymphocele is commonest</b> (<span class=\"key\">2–5%</span> significant). <b>Transperitoneal access is not protective</b>, because the bladder walls off the fossa. A <b>peritoneal interposition flap</b> reduces it. It classically presents with ipsilateral deep vein thrombosis (DVT)."], [15, "p", 39, "Ch 161 · Laparoscopic and Robotic-Assisted Laparoscopic Radical Prostatectomy and Pelvic Lymphadenectomy", "9 · MIS-specific complications", "Robotic injuries are fewer but less visible: bleeding and strictures fall with magnified vision, while bowel injury and positioning neuropathy happen outside the camera's field and must be anticipated."], [15, "l", 41, "Ch 162 · Radiation Therapy for Prostate Cancer", "1 · Radiobiology and fractionation", "Conventional fractionation gives <span class=\"key\">1.8–2 gray (Gy)</span> daily."], [15, "l", 41, "Ch 162 · Radiation Therapy for Prostate Cancer", "1 · Radiobiology and fractionation", "Prostate cancer has few cycling cells, so its α/β is <span class=\"key\">≈1.5 Gy</span> (1.0–1.7 in external beam radiotherapy [EBRT] cohorts), <b>lower than the rectum (~3 Gy)</b>. So fractions &gt;2 Gy favour tumour kill over late toxicity: the rationale for hypofractionation."], [15, "r", 41, "Ch 162 · Radiation Therapy for Prostate Cancer", "1 · Radiobiology and fractionation", "Moderate hypofractionation · 2.25–4 Gy · ~4 wk (<span class=\"key\">60 Gy/20</span>)"], [15, "r", 41, "Ch 162 · Radiation Therapy for Prostate Cancer", "1 · Radiobiology and fractionation", "Ultrahypofractionation = stereotactic body RT (SBRT) · ≥5 Gy · ≤5–7 fractions (<span class=\"key\">36.25 Gy/5</span>)"], [15, "r", 41, "Ch 162 · Radiation Therapy for Prostate Cancer", "2 · EBRT techniques", "Planning target volume (PTV) · CTV plus a margin for motion and set-up: <span class=\"key\">3–7 mm</span> with image guidance"], [15, "l", 42, "Ch 162 · Radiation Therapy for Prostate Cancer", "2 · EBRT techniques", "A <b>rectal spacer</b> (hydrogel or hyaluronic acid) is injected transperineally into Denonvilliers' fascia. Late rectal toxicity: <span class=\"key\">2% vs 7%</span> (hydrogel, 79.2 Gy); grade ≥2: 2.9% vs 13.8% (hyaluronic acid, 60 Gy/20)."], [15, "l", 42, "Ch 162 · Radiation Therapy for Prostate Cancer", "4 · Hypofractionation", "<b>Dose ceiling</b>: no gain above <span class=\"key\">40 Gy/5</span>. Give on alternate days with 3–5 mm margins. Rectal risk rises if &gt;35% of the circumference gets &gt;39 Gy; a spacer reduces ulcers."], [15, "r", 42, "Ch 162 · Radiation Therapy for Prostate Cancer", "5 · Brachytherapy (BT)", "<sup>125</sup>I · <span class=\"key\">59.6 d</span> · 140–160 Gy · 108–110 Gy"], [15, "l", 43, "Ch 162 · Radiation Therapy for Prostate Cancer", "5 · Brachytherapy (BT)", "<b>Post-implant dosimetry</b> (CT with or without MRI, 14–30 days): <b>D90</b> &gt;90% of prescription; <b>V100</b> &gt;85%; urethral V150 &lt;0.05 cm³; rectal V100 &lt;1 cm³. A low D90 predicts biochemical failure. <span class=\"tag\">MCQ</span> D90 is a dose, V100 a volume."], [15, "l", 43, "Ch 162 · Radiation Therapy for Prostate Cancer", "5 · Brachytherapy (BT)", "<b>ASCENDE-RT</b>: no OS difference; LDR boost grade 3 GU toxicity <span class=\"key\">18.4% vs 5.2%</span>."], [15, "p", 43, "Ch 162 · Radiation Therapy for Prostate Cancer", "5 · Brachytherapy (BT)", "Why BT works: the steep fall-off lets intraprostatic dose far exceed EBRT. Hence outcome depends on implant accuracy (D90), eligibility on whether the urethra tolerates swelling, and EBRT is added only where disease may lie beyond the implant."], [15, "r", 43, "Ch 162 · Radiation Therapy for Prostate Cancer", "6 · ADT with RT", "Unfavourable intermediate · <span class=\"key\">4–6 mo</span> · — · RTOG 94-08, DFCI 95-096, TROG 96.01 (6 mo better than 3); RTOG 99-10: 9 mo no better than 4"], [15, "r", 43, "Ch 162 · Radiation Therapy for Prostate Cancer", "6 · ADT with RT", "High / very high · <span class=\"key\">24–36 mo</span> (≥18) · 12–36 mo · EORTC 22863, RTOG 92-02, EORTC 22961 (36 mo better than 6); PCS IV: 18 mo = 36 mo"], [15, "r", 44, "Ch 162 · Radiation Therapy for Prostate Cancer", "9 · Follow-up and biochemical failure", "Failure · 3 consecutive rises · PSA <span class=\"key\">≥ nadir + 2 ng/mL</span>"], [15, "l", 44, "Ch 162 · Radiation Therapy for Prostate Cancer", "9 · Follow-up and biochemical failure", "<b>Biopsy</b> is best at <span class=\"key\">30–36 mo</span>, since irradiated cells die slowly. Do not grade marked radiation effect; it behaves as negative. High-molecular-weight cytokeratin separates radiation atypia from cancer. Recurrence arises at the original dominant nodule."], [15, "l", 47, "Ch 163 · Focal Therapy of Prostate Cancer", "1 · Definition and rationale", "Cancer is multifocal in <span class=\"key\">50–91%</span> of radical prostatectomy (RP) specimens. The <b>index lesion (IL)</b>, the largest or highest-grade focus, is held to drive natural history and metastasis."], [15, "l", 47, "Ch 163 · Focal Therapy of Prostate Cancer", "1 · Definition and rationale", "<b>For</b>: the IL holds <span class=\"key\">80–90%</span> of tumour volume, and satellites are mostly &lt;<span class=\"key\">0.5 mL</span> (Stamey \"insignificant\"). So 52–93% of glands are functionally unifocal."], [15, "p", 47, "Ch 163 · Focal Therapy of Prostate Cancer", "1 · Definition and rationale", "\"Multifocal, therefore unsuitable for FT\" is a trap: what matters is one significant lesion plus insignificant satellites, not the count of foci. The hypothesis's exceptions are why FT is always paired with surveillance."], [15, "l", 47, "Ch 163 · Focal Therapy of Prostate Cancer", "2 · Patient selection", "<b>PROMIS</b>: for clinically significant cancer (csPCa), sensitivity was <span class=\"key\">93%</span>, specificity 41% and negative predictive value 89%. So MRI lesions need biopsy, and MRI-negative areas still need systematic biopsy."], [15, "l", 47, "Ch 163 · Focal Therapy of Prostate Cancer", "2 · Patient selection", "mpMRI <b>underestimat
